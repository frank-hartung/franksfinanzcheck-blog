{{- /* TARIF (Kind von tarifvergleich) – v5: nutzt <template>-Tags als
       Daten-Marker (werden von Browsern nicht gerendert und von Hugo
       nicht entfernt). */ -}}
{{- $tone    := .Get "tone" | default "mid" -}}
{{- $win     := .Get "win" | default "false" -}}
{{- $tag     := .Get "tag" | default "" -}}
{{- $name    := .Get "name" | default "" -}}
{{- $ctaText := .Get "cta_text" | default (.Get "cta-text") | default "" -}}
{{- $ctaUrl  := .Get "cta_url"  | default (.Get "cta-url")  | default "" -}}
{{- $ctaMut  := .Get "cta_muted" | default (.Get "cta-muted") | default "false" -}}
<template data-ff="tarif" data-tone="{{ $tone }}" data-win="{{ $win }}" data-tag="{{ $tag | htmlEscape }}" data-name="{{ $name | htmlEscape }}" data-cta-text="{{ $ctaText | htmlEscape }}" data-cta-url="{{ $ctaUrl | htmlEscape }}" data-cta-muted="{{ $ctaMut }}"></template>{{ .Inner }}<template data-ff="/tarif"></template>
