{{- /* ZEILE (Kind von tarif) – v5: .Inner wird per markdownify gerendert,
       damit **bold** und <br>-Tags funktionieren; Ergebnis in ein
       <template data-ff>-Marker-Paar verpackt, damit der
       Grosseltern-Shortcode es sicher per Regex aus .Inner fischen
       kann. Keine Scratch-Abhaengigkeit. */ -}}
{{- $label     := .Get "label" -}}
{{- $cardLabel := .Get "card_label" | default (.Get "card-label") | default $label -}}
{{- $tone      := .Get "tone" | default "default" -}}
{{- $highlight := .Get "highlight" | default "false" -}}
{{- $rawValue  := trim .Inner "\n\r\t " -}}
{{- /* Markdown rendern, umschliessende <p>-Tags entfernen und
       verbliebene &lt;br&gt;-Escapes wieder zu <br> machen (Goldmark
       filtert inline-HTML in shortcode-Inhalten sonst gern heraus). */ -}}
{{- $value := $rawValue | markdownify -}}
{{- $value = replaceRE `(?s)^\s*<p>(.*)</p>\s*$` "$1" $value -}}
{{- $value = $value | safeHTML -}}
<template data-ff="zeile" data-label="{{ $label | htmlEscape }}" data-card-label="{{ $cardLabel | htmlEscape }}" data-tone="{{ $tone }}" data-highlight="{{ $highlight }}"></template>{{ $value }}<template data-ff="/zeile"></template>
