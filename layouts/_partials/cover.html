{{- with .cxt}} {{/* Apply proper context from dict */}}
{{- if (and .Params.cover.image (not $.isHidden)) }}
<figure class="entry-cover">
    {{- $loading := cond $.IsSingle "eager" "lazy" }}
    {{- /* Einzelartikel: Das Cover ist mobil im ersten Viewport und bleibt
           eager + high. In Listen (Startseite UND /posts/) folgen erst
           Hero bzw. Themenwelten; deren Covers liegen bei 390px > 2400px
           unter der Navigation und bleiben lazy + low. */}}
    {{- $fetchPriority := "" }}
    {{- $isLcpCandidate := false }}
    {{- if $.IsSingle }}{{ $fetchPriority = "high" }}{{ $isLcpCandidate = true }}{{ else }}{{ $fetchPriority = "low" }}{{ end }}
    {{- $fcpImageRole := cond $isLcpCandidate "lcp" "deferred" }}
    {{- $addLink := (and site.Params.cover.linkFullImages $.IsSingle) }}
    {{- $prod := (hugo.IsProduction | or (eq site.Params.env "production")) }}
    {{- $alt := (.Params.cover.alt | default .Params.cover.caption | plainify) }}
    {{- $responsiveImages := (.Params.cover.responsiveImages | default site.Params.cover.responsiveImages) | default true }}

    {{- $pageBundleCover := (.Resources.ByType "image").GetMatch (printf "*%s*" (.Params.cover.image)) }}
    {{- $globalResourcesCover := (resources.ByType "image").GetMatch (printf "*%s*" (.Params.cover.image)) }}
    {{- $cover := (or $pageBundleCover $globalResourcesCover)}}
    {{- /* We are not using the .Param.cover.relative to decide the location of image */}}
    {{- /* If we have the image in pageBundle or globalResources we can process the image */}}

    {{- $sizes := (slice "360" "480" "720" "1080" "1500") }}
    {{- $processableFormats := (slice "jpg" "jpeg" "png" "tif" "bmp" "gif") -}}
    {{- if hugo.IsExtended -}}
        {{- $processableFormats = $processableFormats | append "webp" -}}
    {{- end -}}

    {{- $imgdl := (.Params.cover.image) | absURL }}
    {{- /* First-Party-Auslieferung: Bilder direkt von GitHub Pages (eigener
           Ursprung, kein Drittanbieter-CDN → Lighthouse "Drittanbieter" = 0).
           Cache-Busting via ?v=<SHA> (asset_url.html). Der Commit-SHA wird
           vom Deploy-Workflow als HUGO_JSDELIVR_SHA injiziert. */}}
    {{- $imgSrcset := "" }}
    {{- $webpSrcset := "" }}
    {{- $avifSrcset := "" }}
    {{- $coverFile := path.Base .Params.cover.image }}
    {{- $coverBase := strings.TrimSuffix (path.Ext $coverFile) $coverFile }}
    {{- $coverDir := path.Dir .Params.cover.image }}
    {{- $imgdl = partial "asset_url.html" .Params.cover.image }}
    {{- /* Responsive srcset: Mobile 360/480, Desktop 620/720.
           Die 1000px-Originale bleiben als Fallback-/OG-Dateien erhalten,
           werden aber NICHT mehr als Kandidat angeboten. Grund: Chrome wählt
           auf HiDPI/Preload-Konstellationen sonst trotz kleiner Layoutbreite
           häufig die 1000px-Variante → Lighthouse "Bildübermittlung verbessern".
           Die Varianten erzeugt scripts/image_optimizer.py automatisch. */}}
    {{- $srcsetParts := slice }}
    {{- $webpParts := slice }}
    {{- $avifParts := slice }}
    {{- range $w := slice "360" "480" "620" "720" }}
        {{- $pJpg := printf "%s/%s/%s" $coverDir $w $coverFile -}}
        {{- $pWebp := printf "%s/webp/%s/%s.webp" $coverDir $w $coverBase -}}
        {{- $pAvif := printf "%s/avif/%s/%s.avif" $coverDir $w $coverBase -}}
        {{- if os.FileExists (path.Join "static" $pJpg) }}{{ $srcsetParts = $srcsetParts | append (printf "%s %sw" (partial "asset_url.html" $pJpg) $w) }}{{ end -}}
        {{- if os.FileExists (path.Join "static" $pWebp) }}{{ $webpParts = $webpParts | append (printf "%s %sw" (partial "asset_url.html" $pWebp) $w) }}{{ end -}}
        {{- if os.FileExists (path.Join "static" $pAvif) }}{{ $avifParts = $avifParts | append (printf "%s %sw" (partial "asset_url.html" $pAvif) $w) }}{{ end -}}
    {{- end }}
    {{- $imgSrcset = delimit $srcsetParts ", " }}
    {{- $webpSrcset = delimit $webpParts ", " }}
    {{- $avifSrcset = delimit $avifParts ", " }}
    {{- if not $imgSrcset }}
        {{- if $cover }}
            {{- $imgdl = $cover.Permalink }}
        {{- end }}
    {{- end }}
    {{- /* Fallback (gleiche Datei, first-party) */}}
    {{- $imgFallback := partial "asset_url.html" .Params.cover.image }}

    {{- $imgWidth := (.Params.cover.width | default 1000) }}
    {{- $imgHeight := (.Params.cover.height | default 1500) }}
    {{- /* sizes: In Listen werden Covers ~620px breit dargestellt, auf
           Single-Seiten ~720px. */}}
    {{- $imgSizes := "(min-width: 768px) 620px, 100vw" }}
    {{- if $.IsSingle }}{{ $imgSizes = "(min-width: 768px) 720px, 100vw" }}{{ end }}

    {{- if $addLink }}
        <a href="{{ $imgdl }}" target="_blank" rel="noopener noreferrer">
    {{- end }}

    {{- /* KI-Cover: Original unverändert ausliefern. Neukodierte Varianten
           könnten Provenienz-Metadaten verlieren oder veralten. */}}
    {{- $aiImage := eq .Params.cover.ai_generated true -}}
    {{- /* Maschinenlesbare Herkunftsangabe am Bild (#1028): `data-digital-source-type`
           nutzt das IPTC-Vokabular (http://cv.iptc.org/newscodes/digitalsourcetype/…),
           das C2PA in `c2pa.actions` übernimmt und das Meta, Apple, Google und
           Pinterest auswerten. Es wird nur ausgegeben, wenn die Art der
           Erzeugung ausdrücklich belegt ist – kein geratenes „trained…".
           Dieselbe Angabe steht als XMP-Feld IN der Datei
           (scripts/ki_bild_markierung.py, Wache --gate). */}}
    {{- $quelleTyp := "" -}}
    {{- with .Params.cover.ki_pruefung }}{{ $quelleTyp = .digital_source_type | default "" }}{{ end -}}
    {{- if $aiImage }}
    <img loading="{{ $loading }}"{{ with $fetchPriority }} fetchpriority="{{ . }}"{{ end }} decoding="async" data-ff-fcp-image="{{ $fcpImageRole }}"{{ if $isLcpCandidate }} data-ff-lcp="candidate"{{ end }}{{ if $aiImage }} data-ai-generated="true"{{ with $quelleTyp }} data-digital-source-type="{{ . }}"{{ end }}{{ end }} src="{{ $imgFallback }}" width="{{ $imgWidth }}" height="{{ $imgHeight }}" alt="{{ $alt }}">
    {{- else }}
    {{- /* <picture> mit Format-Kaskade: AVIF → WebP → JPEG (Fallback).
           Browser wählt das kleinste unterstützte Format; das srcset
           liefert zusätzlich die passende Größe (360/480/620/720px). */}}
    <picture>
    {{- if $avifSrcset }}<source type="image/avif" srcset="{{ $avifSrcset }}" sizes="{{ $imgSizes }}">{{- end }}
    {{- if $webpSrcset }}<source type="image/webp" srcset="{{ $webpSrcset }}" sizes="{{ $imgSizes }}">{{- end }}
    {{- if $cover -}}
        {{/* i.e it is present in page bundle */}}
        {{- if (and (in $processableFormats $cover.MediaType.SubType) ($responsiveImages) (eq $prod true)) }}
            <img loading="{{$loading}}"{{ with $fetchPriority }} fetchpriority="{{ . }}"{{ end }} decoding="async" data-ff-fcp-image="{{ $fcpImageRole }}"{{ if $isLcpCandidate }} data-ff-lcp="candidate"{{ end }}
                srcset='{{- range $size := $sizes -}}
                            {{- if (ge $cover.Width $size) }}
                                {{- printf "%s %s" (($cover.Resize (printf "%sx" $size)).Permalink) (printf "%sw," $size) }}
                            {{- end }}
                        {{- end }}
                        {{- printf "%s %dw" ($cover.Permalink) ($cover.Width) }}'
                src="{{ $cover.Permalink }}"
                sizes="(min-width: 768px) 720px, 100vw"
                width="{{ $cover.Width }}" height="{{ $cover.Height }}"
                alt="{{ $alt }}">
        {{- else }}{{/* Unprocessable image or responsive images disabled */}}
            <img loading="{{ $loading }}"{{ with $fetchPriority }} fetchpriority="{{ . }}"{{ end }} decoding="async" data-ff-fcp-image="{{ $fcpImageRole }}"{{ if $isLcpCandidate }} data-ff-lcp="candidate"{{ end }} src="{{ $imgdl }}"{{ with $imgSrcset }} srcset="{{ . }}"{{ end }} sizes="{{ $imgSizes }}" onerror="this.onerror=null;this.src='{{ $imgFallback }}'" width="{{ $imgWidth }}" height="{{ $imgHeight }}" alt="{{ $alt }}">
        {{- end }}
    {{- else }}
        {{- /* For absolute urls and external links, no img processing here */}}
        <img loading="{{ $loading }}"{{ with $fetchPriority }} fetchpriority="{{ . }}"{{ end }} decoding="async" data-ff-fcp-image="{{ $fcpImageRole }}"{{ if $isLcpCandidate }} data-ff-lcp="candidate"{{ end }} src="{{ $imgdl }}"{{ with $imgSrcset }} srcset="{{ . }}"{{ end }} sizes="{{ $imgSizes }}" onerror="this.onerror=null;this.src='{{ $imgFallback }}'" width="{{ $imgWidth }}" height="{{ $imgHeight }}" alt="{{ $alt }}">
    {{- end }}
    </picture>
    {{- end }}

    {{- if $addLink }}
        </a>
    {{- end -}}

    {{- /* Die Bildherkunft ist unabhängig von ai_generated (Artikeltext).
           Nur eine ausdrücklich bestätigte Bildherkunft löst den Hinweis aus;
           weder Text-Flag noch unbekannte Herkunft beweisen KI-Bildgenerierung. */}}
    {{- if or $aiImage (and $.IsSingle .Params.cover.caption) }}
        <figcaption>
            {{- if and $.IsSingle .Params.cover.caption }}{{ .Params.cover.caption | markdownify }}{{ end -}}
            {{- if $aiImage }}{{ if and $.IsSingle .Params.cover.caption }} · {{ end }}<span data-ff-ki-image-label>Bild mit KI erstellt oder bearbeitet</span>{{ end -}}
        </figcaption>
    {{- end }}
</figure>
{{- end }}{{/* End image */}}
{{- end -}}{{/* End context */ -}}
