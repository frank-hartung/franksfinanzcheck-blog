{{- with .cxt}} {{/* Apply proper context from dict */}}
{{- if (and .Params.cover.image (not $.isHidden)) }}
<figure class="entry-cover">
    {{- $loading := cond $.IsSingle "eager" "lazy" }}
    {{- $addLink := (and site.Params.cover.linkFullImages $.IsSingle) }}
    {{- $prod := (hugo.IsProduction | or (eq site.Params.env "production")) }}
    {{- $alt := (.Params.cover.alt | default .Params.cover.caption | plainify) }}
    {{- $responsiveImages := (.Params.cover.responsiveImages | default site.Params.cover.responsiveImages) | default true }}

    {{- $pageBundleCover := (.Resources.ByType "image").GetMatch (printf "*%s*" (.Params.cover.image)) }}
    {{- $globalResourcesCover := (resources.ByType "image").GetMatch (printf "*%s*" (.Params.cover.image)) }}
    {{- $cover := (or $pageBundleCover $globalResourcesCover)}}
    {{- /* We are not using the .Param.cover.relative to decide the location of image */}}
    {{- /* If we have the image in pageBundle or globalResources we can process the image */}}

    {{- $sizes := (slice "360" "480" "720" "1080" "1500") }}
    {{- $processableFormats := (slice "jpg" "jpeg" "png" "tif" "bmp" "gif") -}}
    {{- if hugo.IsExtended -}}
        {{- $processableFormats = $processableFormats | append "webp" -}}
    {{- end -}}

    {{- $imgdl := (.Params.cover.image) | absURL }}
    {{- /* jsDelivr-CDN: Bilder mit 1 Jahr Cache + immutable ausliefern
           (GitHub Pages setzt hart max-age=600). Der Commit-SHA wird vom
           Deploy-Workflow als HUGO_JSDELIVR_SHA injiziert; ohne ihn
           (lokaler Build) bleiben die GitHub-Pages-URLs aktiv. */}}
    {{- $jsdelivrSha := getenv "HUGO_JSDELIVR_SHA" }}
    {{- $imgSrcset := "" }}
    {{- $webpSrcset := "" }}
    {{- $avifSrcset := "" }}
    {{- $coverFile := path.Base .Params.cover.image }}
    {{- $coverBase := strings.TrimSuffix (path.Ext $coverFile) $coverFile }}
    {{- if $jsdelivrSha }}
        {{- $imgdl = printf "https://cdn.jsdelivr.net/gh/frank-hartung/franksfinanzcheck-blog@%s/static/%s" $jsdelivrSha .Params.cover.image }}
        {{- /* Responsive srcset: 620px (Listen) + 720px (Singles) + 1000px Original.
               Die Varianten liegen unter static/images/covers/{620,720}/ und werden
               von generate_covers.py erzeugt. → spart Download (Lighthouse). */}}
        {{- $coverDir := path.Dir .Params.cover.image }}
        {{- $srcsetParts := slice }}
        {{- $webpParts := slice }}
        {{- $avifParts := slice }}
        {{- range $w := slice "620" "720" }}
            {{- $srcsetParts = $srcsetParts | append (printf "https://cdn.jsdelivr.net/gh/frank-hartung/franksfinanzcheck-blog@%s/static/%s/%s/%s %sw" $jsdelivrSha $coverDir $w $coverFile $w) }}
            {{- $webpParts = $webpParts | append (printf "https://cdn.jsdelivr.net/gh/frank-hartung/franksfinanzcheck-blog@%s/static/%s/webp/%s/%s.webp %sw" $jsdelivrSha $coverDir $w $coverBase $w) }}
            {{- $avifParts = $avifParts | append (printf "https://cdn.jsdelivr.net/gh/frank-hartung/franksfinanzcheck-blog@%s/static/%s/avif/%s/%s.avif %sw" $jsdelivrSha $coverDir $w $coverBase $w) }}
        {{- end }}
        {{- $srcsetParts = $srcsetParts | append (printf "%s %dw" $imgdl 1000) }}
        {{- $webpParts = $webpParts | append (printf "https://cdn.jsdelivr.net/gh/frank-hartung/franksfinanzcheck-blog@%s/static/%s/webp/%s.webp 1000w" $jsdelivrSha $coverDir $coverBase) }}
        {{- $avifParts = $avifParts | append (printf "https://cdn.jsdelivr.net/gh/frank-hartung/franksfinanzcheck-blog@%s/static/%s/avif/%s.avif 1000w" $jsdelivrSha $coverDir $coverBase) }}
        {{- $imgSrcset = delimit $srcsetParts ", " }}
        {{- $webpSrcset = delimit $webpParts ", " }}
        {{- $avifSrcset = delimit $avifParts ", " }}
    {{- else if $cover }}
        {{- $imgdl = $cover.Permalink }}
    {{- end }}
    {{- /* Fallback, falls das CDN mal nicht erreichbar ist: gleiche Datei auf GitHub Pages */}}
    {{- $imgFallback := (.Params.cover.image) | absURL }}

    {{- $imgWidth := (.Params.cover.width | default 1000) }}
    {{- $imgHeight := (.Params.cover.height | default 1500) }}
    {{- /* sizes: In Listen werden Covers ~620px breit dargestellt, auf
           Single-Seiten ~720px. */}}
    {{- $imgSizes := "(min-width: 768px) 620px, 100vw" }}
    {{- if $.IsSingle }}{{ $imgSizes = "(min-width: 768px) 720px, 100vw" }}{{ end }}

    {{- if $addLink }}
        <a href="{{ $imgdl }}" target="_blank" rel="noopener noreferrer">
    {{- end }}

    {{- /* <picture> mit Format-Kaskade: AVIF → WebP → JPEG (Fallback).
           Browser wählt das kleinste unterstützte Format; das srcset
           liefert zusätzlich die passende Größe (620/720/1000px). */}}
    <picture>
    {{- if $avifSrcset }}<source type="image/avif" srcset="{{ $avifSrcset }}" sizes="{{ $imgSizes }}">{{- end }}
    {{- if $webpSrcset }}<source type="image/webp" srcset="{{ $webpSrcset }}" sizes="{{ $imgSizes }}">{{- end }}
    {{- if $cover -}}
        {{/* i.e it is present in page bundle */}}
        {{- if (and (in $processableFormats $cover.MediaType.SubType) ($responsiveImages) (eq $prod true)) }}
            <img loading="{{$loading}}"
                srcset='{{- range $size := $sizes -}}
                            {{- if (ge $cover.Width $size) }}
                                {{- printf "%s %s" (($cover.Resize (printf "%sx" $size)).Permalink) (printf "%sw," $size) }}
                            {{- end }}
                        {{- end }}
                        {{- printf "%s %dw" ($cover.Permalink) ($cover.Width) }}'
                src="{{ $cover.Permalink }}"
                sizes="(min-width: 768px) 720px, 100vw"
                width="{{ $cover.Width }}" height="{{ $cover.Height }}"
                alt="{{ $alt }}">
        {{- else }}{{/* Unprocessable image or responsive images disabled */}}
            <img loading="{{ $loading }}" src="{{ $imgdl }}"{{ with $imgSrcset }} srcset="{{ . }}"{{ end }} sizes="{{ $imgSizes }}" onerror="this.onerror=null;this.src='{{ $imgFallback }}'" width="{{ $imgWidth }}" height="{{ $imgHeight }}" alt="{{ $alt }}">
        {{- end }}
    {{- else }}
        {{- /* For absolute urls and external links, no img processing here */}}
        <img loading="{{ $loading }}" src="{{ $imgdl }}"{{ with $imgSrcset }} srcset="{{ . }}"{{ end }} sizes="{{ $imgSizes }}" onerror="this.onerror=null;this.src='{{ $imgFallback }}'" width="{{ $imgWidth }}" height="{{ $imgHeight }}" alt="{{ $alt }}">
    {{- end }}
    </picture>

    {{- if $addLink }}
        </a>
    {{- end -}}

    {{- /*  Display Caption  */}}
    {{- if $.IsSingle }}
        {{ with .Params.cover.caption -}}
            <figcaption>{{ . | markdownify }}</figcaption>
        {{- end }}
    {{- end }}
</figure>
{{- end }}{{/* End image */}}
{{- end -}}{{/* End context */ -}}
