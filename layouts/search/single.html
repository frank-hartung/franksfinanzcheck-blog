{{ define "main" }}
<main class="main ff-search-page" data-pagefind-body>
  <header class="page-header"><p class="ff-eyebrow">FranksFinanzcheck · Wissensarchiv</p><h1>{{ .Title }}</h1><p>{{ .Description }}</p></header>
  <section aria-label="Website durchsuchen" class="ff-search-panel">
    <label class="screen-reader-text" for="pagefind-search">Suchbegriff</label>
    <div id="pagefind-search" class="pagefind-ui" data-pagefind-ui="" data-pagefind-language="de"></div>
    <noscript><p>Die Suche benötigt JavaScript. Nutze alternativ das <a href="/posts/">Artikelarchiv</a>.</p></noscript>
  </section>
  <p class="ff-search-note">Die Suche läuft vollständig im Browser. Deine Suchanfrage wird nicht an einen externen Suchdienst übertragen.</p>
</main>
<link href="/pagefind/pagefind-ui.css" rel="stylesheet">
<script src="/pagefind/pagefind-ui.js" defer></script>
<script defer>
 document.addEventListener('DOMContentLoaded', function () {
   if (window.PagefindUI) new PagefindUI({ element: '#pagefind-search', showSubResults: true, resetStyles: false, translations: { placeholder: 'Ratgeber, Thema oder Begriff suchen …', zero_results: 'Keine passenden Treffer. Probiere einen allgemeineren Begriff.', many_results: 'Ergebnisse: [count]', one_result: 'Ein Ergebnis', load_more: 'Mehr Ergebnisse' } });
 });
</script>
{{ end }}
