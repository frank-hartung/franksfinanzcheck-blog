# CodeQL-Analyse-Konfiguration – Frank's Finanzcheck
#
# Was hier ausgeschlossen ist, ist BEGRÜNDET ausgeschlossen (kein toter Winkel
# für eigenen Code):
#   · **/*.min.js / **/*.min.css – minifizierte Vendor-Bibliotheken
#     (Fuse.js im PaperMod-Theme, GSAP unter static/premium/vendor/). Deren
#     Quellen liegen upstream; Alerts daraus wären nicht heilbar.
#   · .claude/skills/impeccable/scripts – vendored Skill-Tooling (Upstream
#     v4.x, wird bei Skill-Updates überschrieben, läuft ausschließlich im
#     Betreiber-Browser – kein Produktionscode der Website).
#   · .claude/skills/seo/scripts – vendorte claude-seo-Runtime (Upstream
#     v2.5.0, MIT, wird bei `npx skills update` überschrieben). Aufgenommen am
#     01.11.2026, weil `google_auth.py` in `_write_private_json()` die
#     Tokendatei korrekt mit os.open(0o600) + fchmod schreibt und die Query
#     `py/clear-text-storage-sensitive-data` Dateirechte nicht auswertet.
#     Die Datei ist KEIN toter Winkel: `scripts/clear_text_logging_guard.py`
#     liest sie weiter und weist sie als Fremdcode-Befund aus (Punkt 2 seines
#     Vertrags). Entscheidung und Nachlauf: CLAUDE-SEO-AUFNAHME-26-SKILLS-
#     HIGHEND-2026-11-01.md.
#   · node_modules – Abhängigkeiten (Dependabot wacht separat über Versionen).
#
# Eigener Produktionscode (static/, layouts/, newsletter-worker/, scripts/,
# e2e/, tools/) bleibt vollständig analysiert.
#
# Zusätzlich zur Default-Suite läuft je Sprache AlertSuppression.ql: Diese
# Query markiert Ergebnisse als „unterdrückt“, wenn die Zeile darüber einen
# `# codeql[<rule-id>] Grund`-Kommentar trägt (GitHubs Upload ignoriert
# SARIF-Suppressions – der Filter-Schritt im Workflow entfernt sie vor
# dem Upload; siehe .github/workflows/codeql.yml).
# WICHTIG: packs gehören HIERHER und nicht als init-Input – der packs-Input
# überschreibt die Konfiguration komplett und lässt dann NUR die Packs
# laufen (die Default-Suite würde stillschweigend wegfallen).
name: "CodeQL-Konfiguration Frank's Finanzcheck"

# Sicherheitsaudit 14.10.2026 (I-10): Die Standard-Suite fand bei ~17
# Laeufen/Tag 0 Fundstellen (JS 87, Python 43 Regeln). `security-extended`
# ergaenzt die Sicherheitsregeln mittlerer Praezision (u. a. weitere
# Injection-, Pfad- und Regex-Muster). Die Default-Suite laeuft weiter mit.
queries:
  - uses: security-extended

packs:
  python:
    - codeql/python-queries:AlertSuppression.ql
  javascript:
    - codeql/javascript-queries:AlertSuppression.ql

# Der Schlüssel heißt `paths-ignore` (Bindestrich), nicht `paths_ignore`.
# Bis 01.11.2026 stand hier die Unterstrich-Variante: CodeQL liest sie
# nicht, die Liste war damit wirkungslos – aufgefallen erst, als der
# vendorte claude-seo-Code trotz Eintrag im SARIF auftauchte.
paths-ignore:
  - "**/*.min.js"
  - "**/*.min.css"
  - ".claude/skills/impeccable/scripts/**"
  - ".claude/skills/seo/scripts/**"
  - "node_modules/**"
