# ============================================================
#  SICHERHEITS-WACHE – Regressionsschutz für das Audit 15.10.2026
#  ------------------------------------------------------------
#  WARUM DIESER LAUF EXISTIERT
#  Das Sicherheitsaudit (SICHERHEITSAUDIT-PREMIUM-2026-10-14.md) hat die
#  Befunde F-01..F-10 belegt. Ein Befund ist aber erst dann behoben, wenn er
#  NICHT zurückkommen kann. Vier Schichten schützen jetzt:
#
#    · content_html_wache.py     F-06 · rohes HTML in content/** (unsafe=true)
#    · blog_header_gate.py       F-01 · Sicherheits-Header der Live-Seite
#    · worker_betrieb_wache.py   F-02/F-03/F-08 · Turnstile, Tagesbudget,
#                                Schlüsselrollen, Export-Protokoll
#    · n8n_schutz_wache.py       F-04 · Webhooks, Whisper, Bridge, Kopien-Drift
#
#  Jede dieser Wachen hat einen ECHTEN Selbsttest (`--selftest`): Er baut
#  Sabotage-Fälle und prüft, dass die Regel anschlägt. Erst danach läuft die
#  Prüfung. Eine Wache ohne Gegenprobe ist ein Wunsch, keine Wache.
#
#  KADENZ: bei jedem Push/PR (Quellseite, offline, schnell) und täglich
#  06:05 UTC mit LIVE-Messung (Header der echten Seite + Worker-Zustand).
#  Fehlt der Export-Schlüssel, ist der Worker-Stand STOERUNG (rot), nicht
#  übersprungen/grün. Nur ein vollständiger Live-Nachweis darf WF-E813
#  schließen (#809); grüne Offline-Push-Läufe belegen keine Edge-Reparatur.
#
#  MESS-SCHRITTE WERTEN IHREN EXIT AUS, SIE REICHEN IHN NICHT DURCH
#  (Vertrag C34, Dauerheilung WF-E813, 15.10.2026):
#  Der erste planmäßige Live-Lauf dieses Workflows wurde rot – und die
#  automatische Meldung riet auf einen abgelaufenen API-Schlüssel, obwohl
#  diese Wache keinen Schlüssel kennt. Ursache war die zweite Hälfte
#  derselben Zeile: blog_header_gate.py zählte jede Netzstörung als
#  fehlenden Pflicht-Header. Ein TLS-Abbruch wurde damit zu „Header fehlen"
#  umgedeutet, obwohl daneben stand, dass ohne Messung der Stand UNGEPRÜFT
#  gilt. Ungeprüft ist nicht fehlend.
#  Seitdem liefert die Wache vier Klassen, und der Mess-Schritt bleibt
#  neutral (der Exit wird nur festgehalten); der Auswerte-Schritt
#  entscheidet, WAS gemeldet wird:
#
#    0  OK / TEILWEISE   -> Messung grün; Auto-Close nur bei vollständigem OK
#    1  BEFUND           -> ::error:: + nächster Schritt (A1 im Dashboard)
#    2  STOERUNG         -> ::error::, ausdrücklich KEIN Header-Befund
#    sonst WACHE-FEHLER  -> ::error::, die Wache selbst ist defekt
#
#  Transiente Netzfehler heilt die Wache vorher selbst (vier Versuche mit
#  2 s/8 s/30 s Pause, GET-Fallback bei HEAD-Fehlerstatus). Erst was danach
#  noch rot ist, erreicht den Melder.
# ============================================================
name: Sicherheits-Wache

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "layouts/**"
      - "static/**"
      - "hugo.toml"
      - "newsletter-worker/**"
      - "cloudflare/**"
      - "n8n/**"
      - "tools/n8n/**"
      - "scripts/blog_header_gate.py"
      - "scripts/tests/test_blog_header_gate.py"
      - "scripts/sicherheits_nachweis.py"
      - "scripts/tests/test_sicherheits_nachweis.py"
      - "scripts/cloudflare_edge_freigabe.py"
      - "scripts/tests/test_cloudflare_edge_freigabe.py"
      - "scripts/worker_deploy_vorbereiten.py"
      - "scripts/tests/test_worker_deploy_vorbereiten.py"
      - "scripts/worker_ressourcen.py"
      - "scripts/tests/test_worker_ressourcen.py"
      - "scripts/worker_zugang.py"
      - "scripts/tests/test_worker_zugang.py"
      - ".github/workflows/worker-zugang-pruefen.yml"
      - "scripts/worker_environment_guard.py"
      - "scripts/tests/test_worker_environment_guard.py"
      # WF-829B / #922 (30.10.2026): Das Gate meldete die fehlende
      # Produktionsfreigabe, aber nichts im Repo konnte sie HERSTELLEN.
      # `worker_environment_einrichten.py` ist dieser Weg (nur verschärfend).
      # Ändert er sich, muss dieser Lauf ihn prüfen – er trägt die Freigabe.
      - "scripts/worker_environment_einrichten.py"
      - "scripts/tests/test_worker_environment_einrichten.py"
      # WF-829B / #922 (01.11.2026): Ein Lauf, der auf die Freigabe
      # eines Menschen wartet, wird nicht rot – er altert nur und
      # blockiert still den Concurrency-Slot `worker-deploy`.
      - "scripts/worker_freigabe_wache.py"
      - "scripts/tests/test_worker_freigabe_wache.py"
      - "scripts/alert_resolve_gate.py"
      - "scripts/tests/test_alert_resolve_gate.py"
      - "scripts/tests/test_worker_betrieb_wache.py"
      - "scripts/tests/test_alert_scoping.py"
      - "scripts/tests/sim/alert_scoping_sim.mjs"
      - ".github/workflows/alert-on-failure.yml"
      - ".github/workflows/worker-deploy.yml"
      - "scripts/content_html_wache.py"
      - "scripts/worker_betrieb_wache.py"
      - "scripts/n8n_schutz_wache.py"
      - "scripts/n8n_bridge.py"
      - "scripts/abhaengigkeits_wache.py"
      - "scripts/tests/test_abhaengigkeits_wache.py"
      # Trigger-Wache (W1/W3), 27.10.2026: Der gemeinsame Kommando-Melder
      # entscheidet, ob ein Befund als Annotation erscheint. Ändert er sich,
      # muss DIESER Lauf ihn prüfen – er ist der Kanal, der WF-E813 führt.
      - "scripts/github_kommando.py"
      - "scripts/tests/test_github_kommando.py"
      - "requirements*.txt"
      - "requirements-ci.in"
      - "package.json"
      - "package-lock.json"
      - "tools/*/package.json"
      - "tools/*/package-lock.json"
      - "cloudflare/*/package.json"
      - "newsletter-worker/package.json"
      - ".github/dependabot.yml"
      - ".github/workflows/sicherheits-wache.yml"
  pull_request:
    paths:
      - "content/**"
      - "layouts/**"
      - "static/**"
      - "hugo.toml"
      - "newsletter-worker/**"
      - "cloudflare/**"
      - "n8n/**"
      - "tools/n8n/**"
      - "scripts/blog_header_gate.py"
      - "scripts/tests/test_blog_header_gate.py"
      - "scripts/sicherheits_nachweis.py"
      - "scripts/tests/test_sicherheits_nachweis.py"
      - "scripts/cloudflare_edge_freigabe.py"
      - "scripts/tests/test_cloudflare_edge_freigabe.py"
      - "scripts/worker_deploy_vorbereiten.py"
      - "scripts/tests/test_worker_deploy_vorbereiten.py"
      - "scripts/worker_ressourcen.py"
      - "scripts/tests/test_worker_ressourcen.py"
      - "scripts/worker_zugang.py"
      - "scripts/tests/test_worker_zugang.py"
      - ".github/workflows/worker-zugang-pruefen.yml"
      - "scripts/worker_environment_guard.py"
      - "scripts/tests/test_worker_environment_guard.py"
      # WF-829B / #922 (30.10.2026): Das Gate meldete die fehlende
      # Produktionsfreigabe, aber nichts im Repo konnte sie HERSTELLEN.
      # `worker_environment_einrichten.py` ist dieser Weg (nur verschärfend).
      # Ändert er sich, muss dieser Lauf ihn prüfen – er trägt die Freigabe.
      - "scripts/worker_environment_einrichten.py"
      - "scripts/tests/test_worker_environment_einrichten.py"
      # WF-829B / #922 (01.11.2026): Ein Lauf, der auf die Freigabe
      # eines Menschen wartet, wird nicht rot – er altert nur und
      # blockiert still den Concurrency-Slot `worker-deploy`.
      - "scripts/worker_freigabe_wache.py"
      - "scripts/tests/test_worker_freigabe_wache.py"
      - "scripts/alert_resolve_gate.py"
      - "scripts/tests/test_alert_resolve_gate.py"
      - "scripts/tests/test_worker_betrieb_wache.py"
      - "scripts/tests/test_alert_scoping.py"
      - "scripts/tests/sim/alert_scoping_sim.mjs"
      - ".github/workflows/alert-on-failure.yml"
      - ".github/workflows/worker-deploy.yml"
      - "scripts/content_html_wache.py"
      - "scripts/worker_betrieb_wache.py"
      - "scripts/n8n_schutz_wache.py"
      - "scripts/n8n_bridge.py"
      - "scripts/abhaengigkeits_wache.py"
      - "scripts/tests/test_abhaengigkeits_wache.py"
      - "scripts/github_kommando.py"
      - "scripts/tests/test_github_kommando.py"
      - "requirements*.txt"
      - "requirements-ci.in"
      - "package.json"
      - "package-lock.json"
      - "tools/*/package.json"
      - "tools/*/package-lock.json"
      - "cloudflare/*/package.json"
      - "newsletter-worker/package.json"
      - ".github/dependabot.yml"
      - ".github/workflows/sicherheits-wache.yml"
  schedule:
    - cron: "5 6 * * *"     # täglich 08:05 MESZ – nach der Spam-Wache, vor der Redaktion
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sicherheits-wache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quellseite:
    name: Quellseite (offline, mit Selbsttests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inhalts-Wache – rohes HTML und Bau-Härtung (F-06)
        run: |
          set -euo pipefail
          python3 scripts/content_html_wache.py --selftest
          python3 scripts/content_html_wache.py

      - name: Header-Wache – Vorlage und Meta-CSP (F-01, offline)
        run: |
          set -euo pipefail
          python3 -m unittest scripts.tests.test_blog_header_gate scripts.tests.test_sicherheits_nachweis scripts.tests.test_alert_scoping scripts.tests.test_alert_resolve_gate scripts.tests.test_cloudflare_edge_freigabe
          python3 scripts/sicherheits_nachweis.py --selftest
          python3 scripts/alert_resolve_gate.py --selftest
          python3 scripts/cloudflare_edge_freigabe.py --selftest
          python3 scripts/blog_header_gate.py --selftest
          python3 scripts/blog_header_gate.py --offline

      - name: Betriebs-Wache – Deckel, Turnstile, Schlüsselrollen (F-02/F-03/F-08, offline)
        run: |
          set -euo pipefail
          python3 -m unittest scripts.tests.test_worker_betrieb_wache scripts.tests.test_worker_deploy_vorbereiten scripts.tests.test_worker_ressourcen scripts.tests.test_worker_zugang scripts.tests.test_worker_environment_guard scripts.tests.test_worker_environment_einrichten scripts.tests.test_worker_freigabe_wache
          python3 scripts/worker_deploy_vorbereiten.py --selftest
          python3 scripts/worker_ressourcen.py --selftest
          python3 scripts/worker_zugang.py --selftest
          python3 scripts/worker_environment_guard.py --selftest
          python3 scripts/worker_environment_einrichten.py --selftest
          python3 scripts/worker_freigabe_wache.py --selftest
          python3 scripts/worker_betrieb_wache.py --selftest
          python3 scripts/worker_betrieb_wache.py --offline

      - name: Automatik-Wache – n8n, Whisper, Bridge (F-04)
        run: |
          set -euo pipefail
          python3 scripts/n8n_schutz_wache.py --selftest
          python3 scripts/n8n_schutz_wache.py

  abhaengigkeiten:
    name: Abhängigkeiten (Pins offline · Audit online)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # WARUM DIESER JOB (24.10.2026): GitHub meldete 58 offene
      # Schwachstellen, während der ausgelieferte Bestand nach
      # vollständiger Prüfung gegen dieselbe Advisory-Datenbank
      # sauber war. Gefehlt hat eine Stimme, die den BESTAND prüft
      # und nicht die Alarmtabelle. Dieser Job ist diese Stimme –
      # offline bei jedem Push, online im Tageslauf.
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python bereitstellen
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Eigenprüfung (Sabotage- und Gegenproben)
        run: python3 scripts/abhaengigkeits_wache.py --selftest

      - name: Struktur-Gate – jeder Pin ist eine Aussage (offline)
        # A1 Pins · A2 Quelle/Hash-Lock · A3 Lockfile · A4 Action-SHA
        # A5 Image-Tag · A6 Doppelversion. Braucht kein Netz und
        # blockiert deshalb zuverlässig, auch wenn die API schweigt.
        run: python3 scripts/abhaengigkeits_wache.py --check

      - name: Vertragstests der Wache
        run: python3 -m unittest scripts.tests.test_abhaengigkeits_wache -v

      - name: Advisory-Audit – ausgelieferte Versionen gegen die Datenbank
        # Nur im Tageslauf und auf Zuruf: Der Audit fragt für jede
        # ausgelieferte Version die öffentliche Advisory-API. Ein
        # Netzfehler ist STÖRUNG (Exit 2), kein Befund – ungeprüft
        # ist nicht sauber (Vertrag C34).
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          code=0
          python3 scripts/abhaengigkeits_wache.py --audit \
            --report abhaengigkeiten.md --json > abhaengigkeiten.json || code=$?
          if [ "$code" -eq 1 ]; then
            echo "::error title=Abhängigkeits-Audit::Mindestens eine ausgelieferte Version ist von einer bekannten Schwachstelle betroffen – siehe Annotationen und Bericht."
          elif [ "$code" -eq 2 ]; then
            echo "::error title=Abhängigkeits-Audit gestört::Der Audit konnte nicht durchgeführt werden (Netz/API). Ungeprüft gilt nicht als sauber."
          elif [ "$code" -ne 0 ]; then
            echo "::error title=Abhängigkeits-Audit::Werkzeugfehler (Exit $code)."
          fi
          {
            echo "## Abhängigkeits-Audit"
            echo ""
            sed -n '1,60p' abhaengigkeiten.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

  live:
    name: Live-Messung (täglich und auf Zuruf)
    needs: quellseite
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read      # Environment-Freigabe lesen (nur Metadaten, keine Secrets)
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sicherheits-Header der echten Seite messen (F-01)
        id: header
        # Der Mess-Schritt bleibt bewusst neutral: Er hält den Exit-Code nur
        # fest, statt ihn an GitHub durchzureichen. Ein einziger Exit-1-Kanal
        # zwänge den Melder, „nicht messbar“ und „Header fehlen“ gleich zu
        # behandeln – genau das hat WF-E813 erzeugt (Vertrag C34).
        # Wichtig: Erst NACH der Cloudflare-Regel kann das hier grün sein.
        run: |
          set -euo pipefail
          # GitHub startet bash mit -e. set -uo schaltet -e NICHT aus.
          # Nur der erwartbar nicht-null liefernde Messaufruf steht im if;
          # Schreibfehler beim Output bleiben echte Schrittfehler (#782).
          rm -f f01-live.md f01-live.json
          code=0
          if python3 scripts/blog_header_gate.py --json --report f01-live.md > f01-live.json; then
            code=0
          else
            code=$?
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Sicherheits-Header auswerten (F-01) · Befund · Störung · grün
        if: ${{ !cancelled() && steps.header.outcome != 'skipped' }}
        env:
          MESS_CODE: ${{ steps.header.outputs.code }}
        run: |
          set -euo pipefail
          # F-01 BEFUND / F-01 STOERUNG / F-01 WACHE-FEHLER:
          # JSON, Exit und Bericht müssen zusammenpassen. Jeder Befund wird
          # als eigene, gegen Kommando-Injektion geschützte Annotation sichtbar.
          python3 scripts/sicherheits_nachweis.py --auswerten header \
            --code "$MESS_CODE" --daten f01-live.json --bericht f01-live.md

      - name: Worker-Zustand messen – Budget, Bot-Schutz, Exporte (F-02/F-03/F-08)
        id: worker
        # Ein roter F-01 darf die unabhängige Worker-Messung nicht verdecken.
        if: ${{ !cancelled() }}
        env:
          NEWSLETTER_WORKER_BASE: ${{ vars.NEWSLETTER_WORKER_BASE || 'https://abos.franksfinanzcheck.de' }}
          NEWSLETTER_WORKER_EXPORT_KEY: ${{ secrets.NEWSLETTER_WORKER_EXPORT_KEY }}
          NEWSLETTER_WORKER_WRITE_KEY: ${{ secrets.NEWSLETTER_WORKER_WRITE_KEY }}
        run: |
          set -euo pipefail
          rm -f worker-live.md worker-live.json
          code=0
          if python3 scripts/worker_betrieb_wache.py --json --report worker-live.md > worker-live.json; then
            code=0
          else
            code=$?
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Worker-Zustand auswerten (F-02/F-03/F-08) · Befund · Störung · grün
        if: ${{ !cancelled() && steps.worker.outcome != 'skipped' }}
        env:
          MESS_CODE: ${{ steps.worker.outputs.code }}
        run: |
          set -euo pipefail
          python3 scripts/sicherheits_nachweis.py --auswerten worker \
            --code "$MESS_CODE" --daten worker-live.json --bericht worker-live.md

      - name: Live-Nachweis abschließen (F-01/F-02/F-03/F-08)
        # Der Auto-Close prüft genau diesen erfolgreichen Schritt zusätzlich
        # zu allen Mess-/Auswerte-Schritten. TEILWEISE genügt ausdrücklich nicht.
        if: ${{ !cancelled() }}
        run: python3 scripts/sicherheits_nachweis.py --live f01-live.json worker-live.json

      # PRODUKTIONS-ENVIRONMENT: DRIFT SICHTBAR MACHEN (WF-829B / #922, 30.10.2026)
      # Der harte Stopp liegt im Deploy-Pfad: `worker_environment_guard.py`
      # bricht den Deploy fail-closed ab, solange Reviewer, Branch-Regel oder
      # Admin-Bypass-Sperre fehlen. Was fehlte, war der BLICK dazwischen: Wird
      # das Environment neu angelegt (GitHub tut das beim ersten Verweis
      # automatisch – ungesichert) oder ein Reviewer entfernt, merkt das sonst
      # erst der nächste Deploy-Versuch.
      # Bewusst WARNSTUFE, nicht rot: Der Zustand ist aus dem Repository nicht
      # herstellbar (dieses Token darf Environments nicht schreiben, und der
      # Admin-Bypass-Schalter ist reine Oberfläche). Rot wäre ein Dauer-Alarm
      # ohne Schließpfad (C14). Nicht belegbar (Exit 2) bleibt dagegen rot:
      # ungeprüft ist nicht sauber (C34).
      - name: Produktions-Environment – Freigabestand und Drift (täglich)
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          code=0
          python3 scripts/worker_environment_einrichten.py --pruefen --warnstufe \
            --md "$GITHUB_STEP_SUMMARY" || code=$?
          if [ "$code" = "2" ]; then
            echo "::error title=Produktions-Environment::Der Freigabestand ist nicht belegbar (Netz oder Rechte). Ungeprüft gilt nicht als sauber."
            exit 1
          fi
          if [ "$code" = "1" ]; then
            echo "::warning title=Produktions-Environment::Die Freigabe ist nicht vollständig eingerichtet; der Worker-Deploy bleibt fail-closed gesperrt. Einrichten: python3 scripts/worker_environment_einrichten.py --anwenden (plus ein Schalter im Dashboard – der Lauf nennt ihn)."
          fi
          exit 0

      # Ein Lauf, der auf die Freigabe eines Menschen wartet, wird nicht rot und
      # meldet nichts — er altert nur und belegt dabei den Concurrency-Slot
      # `worker-deploy`. Genau dieser stille Zustand liegt zwischen dem
      # Absichern des Environments und dem grünen Deploy, der #922 schließt.
      # Deshalb steht er hier täglich: Warnstufe mit Lauf-Link (ein Mensch muss
      # handeln), rot nur, wenn der Zustand nicht belegbar ist (C33).
      - name: Wartende Deploy-Freigaben (täglich)
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          code=0
          python3 scripts/worker_freigabe_wache.py --check --md "$GITHUB_STEP_SUMMARY" || code=$?
          if [ "$code" = "2" ]; then
            echo "::error title=Wartende Deploy-Freigabe::Der Freigabezustand ist nicht belegbar (Netz oder Rechte). Ungeprüft gilt nicht als sauber."
            exit 1
          fi
          if [ "$code" = "1" ]; then
            echo "::warning title=Wartende Deploy-Freigabe::Ein Worker-Deploy wartet über der Schwelle auf Freigabe. Der Lauf blockiert den Concurrency-Slot und hält den Nachweis für #922 offen. Freigeben oder abbrechen — der Lauf-Link steht in der Zusammenfassung."
          fi
          exit 0

      - name: Sicherheits-Nachweise aufbewahren (ohne Secrets oder Abonnentendaten)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sicherheits-live-nachweis
          path: |
            f01-live.md
            f01-live.json
            worker-live.md
            worker-live.json
          retention-days: 7
          if-no-files-found: error
