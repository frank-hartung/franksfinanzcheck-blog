# ============================================================
#  INTEGRITÄTS-LOCK (PR-GATE) – Issue #316, 19.09.2026
#
#  WARUM DIESER WORKFLOW EXISTIERT:
#  Am 18.09.2026 hat PR #315 (Commit ff6232e3) sechs gesperrte Skripte
#  geheilt und den Integritäts-Lock NICHT mit-signiert. Aufgefallen ist das
#  erst am nächsten Lauf der Content-Engine – die dafür im ersten Schritt
#  hart starb (kein Artikel, kein Slot, Defizit-Alarm, Issue #316). Der
#  HARD STOP tat also genau, was er soll, und traf den falschen: Er stoppte
#  die Produktion statt den Merge.
#
#  Dieses Gate zieht die Grenze dorthin, wo sie hingehört: VOR den Merge.
#  Es prüft bei jedem Pull Request auf `main`, ob der signierte Kern
#  (data/integrity_lock.json) noch zum Baum passt. Passt er nicht, zeigt
#  der Lauf die Herkunft (welcher Commit die Datei angefasst hat) und die
#  Reparaturzeile – nicht nur ein rotes Kreuz.
#
#  Regeln dabei:
#    · fail-closed: Drift in JEDER Klasse lässt das Gate rot werden.
#    · read-only: kein Schreibzugriff, keine Secrets, keine Abhängigkeiten
#      (nur stdlib) – der Lauf kostet Sekunden.
#    · kein push-Trigger: Ein roter Lauf, den niemand liest, ist Deko. Auf
#      `main` heilt die Engine belegten Drift selbst (erster Schritt in
#      content-engine-v2.yml, mit ::warning:: und Akte im Lock); kritische
#      Abweichungen stoppen dort weiter hart und alarmieren.
#
# ------------------------------------------------------------
#  PFLICHT-CHECK-VERTRAG (Nachtrag 19.09.2026, Governance-Regel C18)
# ------------------------------------------------------------
#  Ein Gate hält einen Merge nur auf, wenn GitHub es als PFLICHT-CHECK
#  (required status check) im Branch-Schutz kennt – und zwar unter dem
#  Namen, den der Job meldet. Dieser Job trug zunächst keinen Anzeigenamen
#  und hieß darum „lock“ (seine Job-ID); unter diesem Namen landete er in
#  einem Ruleset, das keinen Ziel-Zweig hatte – ein Häkchen, das nichts
#  schützte. Seitdem gilt:
#
#    · Der Anzeigename `Integritäts-Siegel` ist der Vertrag mit dem Ruleset.
#      Er steht als Konstante in scripts/governance_contract.py
#      (PFLICHT_CHECK_NAME); C18 prüft bei jedem Push/PR, dass diese Datei
#      ihn trägt. UMBENENNEN heißt: Konstante, dieser `name:` und das
#      Ruleset im selben Atemzug – sonst wartet jeder PR auf einen Check,
#      der nie berichtet („Expected“), und `main` ist eingefroren.
#      Reihenfolge und API-Einzeiler: docs/PFLICHT-CHECK-RUNBOOK.md
#    · Kein `paths`/`paths-ignore` am Trigger: Ein pfadgefilterter
#      Pflicht-Check startet für PRs ohne Treffer gar nicht – GitHub wartet
#      dann ewig auf ihn. Kein `if:` am Job, kein `continue-on-error` am
#      Gate-Schritt: Ein übersprungener oder verschluckter Pflicht-Check
#      gilt GitHub als BESTANDEN (Scheingrün).
#    · Der letzte Schritt (scripts/pflichtcheck_guard.py) fragt GitHub, ob
#      der Ziel-Zweig genau diesen Check verlangt. Nein → rot mit Diagnose
#      (welches Ruleset, welcher Name, welches Ziel) und Reparatur in
#      Klicks. API nicht erreichbar → ::warning::, nicht rot: Der Melder
#      darf nicht selbst zum Vorfall werden.
#    · DAUERZUSTAND (Nachtrag 20.09.2026, Entscheidung Frank): Der Vertrag ist
#      auf diesem Repo nicht erfüllbar – Rulesets ändern ist Admin-Aufgabe (C15),
#      und dass das rote Kreuz niemanden aufhält, ist belegt: PR #327 wurde am
#      20.09. bei FAILURE gemergt (Run 35520108131). Der Schritt meldet genau
#      diesen Befund deshalb als BEKANNT (Exit 0, ::warning::) – 🛑, Diagnose und
#      Runbook-Verweis bleiben im Log stehen, gewaschen wird nichts. Jeder andere
#      Befund, ein neues Ruleset ohne Actions-Bypass und eine abgelaufene
#      Prüffrist (bis 31.12.2026) melden weiter Exit 1 und ::error::.
#      `--strict` bzw. PFLICHTCHECK_STRICT=1 stellt den harten Zähler für
#      Admin-Sitzungen wieder her – bewusst NICHT hier: ein Dauer-Rot ist Lärm,
#      und Lärm war der Befund #206/#272. Erklärung und Rückbau:
#      docs/PFLICHT-CHECK-RUNBOOK.md, Abschnitt „Dauerzustand“.
#      Der harte Stopp (Schritt „Integritäts-Siegel prüfen“) bleibt davon
#      unberührt: er läuft, prüft fail-closed und meldet Drift in den
#      Kerndateien – er hält nur keinen Merge auf, weil keiner verlangt ist.
# ============================================================
name: Integritäts-Lock (PR-Gate)

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: integrity-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    # Anzeigename = Check-Name im Ruleset = governance_contract.PFLICHT_CHECK_NAME.
    # Nicht ohne Runbook ändern (docs/PFLICHT-CHECK-RUNBOOK.md).
    name: Integritäts-Siegel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken (volle Historie für die Herkunft)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Integritäts-Siegel prüfen (HARD STOP – Sabotage-Schutz)
        run: python3 scripts/integrity_guard.py --gate

      - name: Kern-Beweis des Guards (schreibt nie)
        run: python3 scripts/integrity_guard.py --selftest

      # Wächter des Wächters: Verlangt der Branch-Schutz des Ziel-Zweigs
      # (GITHUB_BASE_REF) genau den Check, der hier gerade läuft? Liest den
      # Namen aus DIESER Datei, fragt nur lesend (github.token, Metadata-Recht
      # genügt) und nennt bei Rot Ruleset, Ziel und Reparatur.
      - name: Pflicht-Check-Vertrag prüfen (verlangt der Branch-Schutz dieses Siegel?)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pflichtcheck_guard.py
