# ============================================================
#  AUTOMATISCHE CONTENT-GENERIERUNG (Vollautomatik, kostenlos)
#
#  Abgestimmt auf deine Pinterest-Veröffentlichungszeiten:
#    - Pins morgens um 08:00 Uhr  → Blog-Artikel ca. 08:10 Uhr
#    - Pins abends um 19:30 Uhr   → Blog-Artikel ca. 19:40 Uhr
#
#  Der Bot wählt Themen DIREKT aus deinem Pinterest-Plan
#  (data/pinterest_plan.yaml, 62 Pins), generiert daraus
#  EINZIGARTIGE Artikel (Anti-Copy-Prompt + 7-Wort-Phrasen-Check)
#  und VERÖFFENTLICHT sie automatisch (draft: false) –
#  kein manuelles Pushen nötig.
#
#  WICHTIG (Workflow-Kette): Nach dem Commit wird der Deploy-Workflow
#  per workflow_dispatch explizit angestoßen – ein normaler Push mit
#  GITHUB_TOKEN würde den Deploy NICHT auslösen (GitHub-Schutz).
#
#  Zeitzonen-Hinweis: GitHub-Actions-Cron läuft in UTC.
#    Sommerzeit (MESZ, UTC+2):  06:10 UTC = 08:10 Uhr · 17:40 UTC = 19:40 Uhr
#    Winterzeit (MEZ, UTC+1):   07:10 UTC = 08:10 Uhr · 18:40 UTC = 19:40 Uhr
#
#  Manuell starten: GitHub → Actions → "Automatische Content-Generierung"
#  → "Run workflow".  |  Stoppen: Workflow deaktivieren (Kill-Switch).
# ============================================================
name: Automatische Content-Generierung

on:
  schedule:
    # Haupt-Zeiten (nach deinen Pin-Zeiten):
    - cron: "10 6 * * *"    # 08:10 Uhr MESZ (nach den Morgen-Pins 08:00)
    - cron: "40 17 * * *"   # 19:40 Uhr MESZ (nach den Abend-Pins 19:30)
    # Fallback-Zeiten (GitHub kann geplante Läufe verzögern/verwerfen –
    #  durch mehrere Crons wird sichergestellt, dass der Artikel trotzdem
    #  erscheint. Das Skript prüft selbst: max. 2 Artikel pro Tag.)
    - cron: "10 8 * * *"    # 10:10 Uhr MESZ (Fallback Morgen)
    - cron: "10 10 * * *"   # 12:10 Uhr MESZ (Fallback Morgen)
    - cron: "10 12 * * *"   # 14:10 Uhr MESZ (Fallback Morgen)
    - cron: "10 14 * * *"   # 16:10 Uhr MESZ (Fallback Morgen)
    - cron: "10 19 * * *"   # 21:10 Uhr MESZ (Fallback Abend)
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  generiere-und-veroeffentliche:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Artikel generieren & automatisch veröffentlichen
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}    # Gratis-Key: console.groq.com
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # Gratis-Key: aistudio.google.com
          BLOG_AUTHOR: ${{ vars.BLOG_AUTHOR }}
          AFFILIATE_URL: ${{ vars.AFFILIATE_URL }}
          MAX_ARTIKEL_PRO_LAUF: "1"
          MAX_ARTIKEL_PRO_TAG: "2"   # max. 2 Artikel/Tag (Guard gegen Doppel-Läufe)
          PIN_TOPICS: "1"          # Themen direkt aus dem Pinterest-Plan
          AUTO_PUBLISH: "1"        # Veröffentlichung ohne manuellen Schritt
        run: python3 scripts/generate_drafts.py

      - name: Cover-Bilder für neue Artikel generieren
        # Der Bot erstellt Artikel ohne Cover – dieser Schritt erzeugt
        # automatisch das Branding-Cover (1000x1500, Smaragdgrün/Gelb)
        # und trägt es ins Frontmatter ein (nur falls noch keins existiert).
        run: |
          pip install -q pillow
          python3 scripts/generate_covers.py

      - name: Einzigartigkeits-Audit (Qualitäts-Gate)
        # Prüft ALLE Artikel gegen die Pin-Texte + untereinander.
        # Bei kritischen Duplikaten bricht der Workflow ab (Exit 1) →
        # nichts wird committet/veröffentlicht. Im Log siehst du, was zu tun ist.
        run: python3 scripts/check_uniqueness.py

      - name: Änderungen committen & pushen
        run: |
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine neuen Artikel – nichts zu committen."
          else
            git commit -m "content: neuer Artikel automatisch aus Pinterest-Plan generiert und veröffentlicht"
            git push
          fi

      - name: Deploy-Workflow anstoßen (nur falls Push-Trigger nicht greift)
        # Der Push selbst löst den Deploy-Workflow bereits aus (on: push).
        # Dieser Schritt ist nur ein Fallback: Er stößt den Deploy nur dann
        # explizit an, wenn der Commit NICHT gerade eben durch den Push
        # verarbeitet wurde – so entstehen keine parallelen Deploys mehr.
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const last = execSync('git log -1 --format=%s').toString().trim();
            const isContent = last.startsWith('content:');
            if (!isContent) {
              console.log('Kein Content-Commit – kein Deploy nötig.');
              return;
            }
            console.log('Content-Commit gefunden – Deploy wird über den Push-Trigger abgewickelt.');
            console.log('(Kein workflow_dispatch nötig – verhindert parallele Deploys.)')
