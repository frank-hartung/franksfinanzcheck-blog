# ============================================================
#  AUTOMATISCHE CONTENT-GENERIERUNG (Vollautomatik, kostenlos)
#
#  Abgestimmt auf deine Pinterest-Veröffentlichungszeiten:
#    - Pins morgens um 08:00 Uhr  → Blog-Artikel ca. 08:10 Uhr
#    - Pins abends um 19:30 Uhr   → Blog-Artikel ca. 19:40 Uhr
#
#  Der Bot wählt Themen DIREKT aus deinem Pinterest-Plan
#  (data/pinterest_plan.yaml, 62 Pins), generiert daraus
#  EINZIGARTIGE Artikel (Anti-Copy-Prompt + 7-Wort-Phrasen-Check)
#  und VERÖFFENTLICHT sie automatisch (draft: false) –
#  kein manuelles Pushen nötig.
#
#  WICHTIG (Workflow-Kette): Nach dem Commit wird der Deploy-Workflow
#  per workflow_dispatch explizit angestoßen – ein normaler Push mit
#  GITHUB_TOKEN würde den Deploy NICHT auslösen (GitHub-Schutz).
#
#  Zeitzonen-Hinweis: GitHub-Actions-Cron läuft in UTC.
#    Sommerzeit (MESZ, UTC+2):  06:10 UTC = 08:10 Uhr · 17:40 UTC = 19:40 Uhr
#    Winterzeit (MEZ, UTC+1):   07:10 UTC = 08:10 Uhr · 18:40 UTC = 19:40 Uhr
#
#  Manuell starten: GitHub → Actions → "Automatische Content-Generierung"
#  → "Run workflow".  |  Stoppen: Workflow deaktivieren (Kill-Switch).
# ============================================================
name: Automatische Content-Generierung

on:
  schedule:
    # Haupt-Zeiten (nach deinen Pin-Zeiten):
    - cron: "10 6 * * *"    # 08:10 Uhr MESZ (nach den Morgen-Pins 08:00)
    - cron: "40 17 * * *"   # 19:40 Uhr MESZ (nach den Abend-Pins 19:30)
    # Fallback-Zeiten (GitHub kann geplante Läufe verzögern/verwerfen –
    #  durch mehrere Crons wird sichergestellt, dass der Artikel trotzdem
    #  erscheint. Das Skript prüft selbst: max. 2 Artikel pro Tag.)
    - cron: "10 8 * * *"    # 10:10 Uhr MESZ (Fallback Morgen)
    - cron: "10 10 * * *"   # 12:10 Uhr MESZ (Fallback Morgen)
    - cron: "10 12 * * *"   # 14:10 Uhr MESZ (Fallback Morgen)
    - cron: "10 14 * * *"   # 16:10 Uhr MESZ (Fallback Morgen)
    - cron: "10 19 * * *"   # 21:10 Uhr MESZ (Fallback Abend)
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  generiere-und-veroeffentliche:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Artikel generieren & automatisch veröffentlichen
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}    # Gratis-Key: console.groq.com
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # Gratis-Key: aistudio.google.com
          BLOG_AUTHOR: ${{ vars.BLOG_AUTHOR }}
          AFFILIATE_URL: ${{ vars.AFFILIATE_URL }}
          MAX_ARTIKEL_PRO_LAUF: "1"
          MAX_ARTIKEL_PRO_TAG: "2"   # max. 2 Artikel/Tag (Guard gegen Doppel-Läufe)
          PIN_TOPICS: "1"          # Themen direkt aus dem Pinterest-Plan
          AUTO_PUBLISH: "1"        # Veröffentlichung ohne manuellen Schritt
        run: python3 scripts/generate_drafts.py

      - name: Profi-Polish-Pass für neue Artikel (KI-Nachbearbeitung)
        # Lässt die KI jeden frisch generierten Bot-Artikel auf Profi-
        # Niveau polieren (Floskeln raus, aktive Sprache, Haken-Einleitung,
        # E-E-A-T-Praxisbezug). Verifikation: Links/Struktur/Länge bleiben
        # erhalten, sonst wird der Polish verworfen.
        if: ${{ !cancelled() }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          LAST=$(git log -1 --format=%s)
          if [[ "$LAST" != content:* ]]; then
            echo "Kein Content-Commit – kein Polish nötig."
            exit 0
          fi
          python3 scripts/profi_polish.py --new

      - name: Rechtschreib- & Groß-Klein-Prüfung (Top-Level, Hunspell de_DE)
        # Prüft und korrigiert die heute erstellten Artikel: Rechtschreibung
        # (Hunspell de_DE), kleingeschriebene Substantive, Satzanfänge,
        # "zuhause"→"zu Hause", Bot-Phrasen ("dns server"→"DNS-Server").
        # Whitelist schützt Eigennamen/Fachbegriffe; Links/Code bleiben
        # unangetastet. Exit 1 → Workflow-Abbruch (kein Fehler-Text live).
        if: ${{ !cancelled() }}
        run: |
          LAST=$(git log -1 --format=%s)
          if [[ "$LAST" != content:* ]]; then
            echo "Kein Content-Commit – keine Prüfung nötig."
            exit 0
          fi
          sudo apt-get install -y -qq hunspell hunspell-de-de >/dev/null 2>&1
          python3 scripts/spellcheck.py --fix | tee /tmp/spell_log.txt
          exit ${PIPESTATUS[0]}

      - name: Grammatikprüfung (LanguageTool de-DE – Top-Level)
        # Prüft die heute erstellten Artikel auf Grammatik, Zeichensetzung
        # und Kontext-Fehler (LanguageTool Public API, kostenlos).
        # Eindeutige Korrekturen werden automatisch angewendet; Stil-Fälle
        # und unsichere landen im Report. Exit 1 → Workflow-Abbruch.
        if: ${{ !cancelled() }}
        run: |
          LAST=$(git log -1 --format=%s)
          if [[ "$LAST" != content:* ]]; then
            echo "Kein Content-Commit – keine Grammatikprüfung nötig."
            exit 0
          fi
          python3 scripts/grammar_check.py --fix --new-only | tee /tmp/grammar_log.txt
          exit ${PIPESTATUS[0]}

      - name: Profi-Text-Qualitäts-Gate (nur neue Artikel)
        # Prüft die HEUTE erstellten Artikel auf Profi-Niveau (Wortanzahl,
        # Struktur, KI-Floskeln, Lesbarkeit, Keywords). Bei Unterschreitung
        # der Schwelle → Workflow-Abbruch, damit kein minderwertiger Text
        # veröffentlicht wird. (Der Bot regeneriert intern bereits bis zu
        # 3× – dieses Gate ist die letzte Sicherung.)
        if: ${{ !cancelled() }}
        run: |
          LAST=$(git log -1 --format=%s)
          if [[ "$LAST" != content:* ]]; then
            echo "Kein Content-Commit – kein Gate nötig."
            exit 0
          fi
          python3 scripts/profi_text_check.py --new-only | tee /tmp/profi_gate.txt
          exit ${PIPESTATUS[0]}

      - name: Lesbarkeits-Gate (deutsche Readability-Formeln)
        # Prüft neue Artikel auf Lesbarkeit (Flesch/Amstad: Ø Satzlänge,
        # Wortlänge, Schachtelsätze, Passiv). Schwelle: Score ≥ 75.
        # Exit 1 → Workflow-Abbruch (kein unlesbarer Text live).
        if: ${{ !cancelled() }}
        run: |
          LAST=$(git log -1 --format=%s)
          if [[ "$LAST" != content:* ]]; then
            echo "Kein Content-Commit – kein Lesbarkeits-Gate nötig."
            exit 0
          fi
          python3 scripts/readability_check.py --new-only | tee /tmp/read_log.txt
          exit ${PIPESTATUS[0]}

      - name: Cover-Bilder für neue Artikel generieren
        # Der Bot erstellt Artikel ohne Cover – dieser Schritt erzeugt
        # automatisch das Branding-Cover (1000x1500, Smaragdgrün/Gelb)
        # und trägt es ins Frontmatter ein (nur falls noch keins existiert).
        run: |
          pip install -q pillow pillow-avif-plugin
          python3 scripts/generate_covers.py

      - name: Einzigartigkeits-Audit (Qualitäts-Gate)
        # Prüft ALLE Artikel gegen die Pin-Texte + untereinander.
        # Bei kritischen Duplikaten bricht der Workflow ab (Exit 1) →
        # nichts wird committet/veröffentlicht. Im Log siehst du, was zu tun ist.
        run: python3 scripts/check_uniqueness.py

      - name: Änderungen committen & pushen
        run: |
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine neuen Artikel – nichts zu committen."
          else
            git commit -m "content: neuer Artikel automatisch aus Pinterest-Plan generiert und veröffentlicht"
            git push
          fi

      - name: Neue Artikel sofort auf Profi-Niveau bringen (Meta + Interne Links)
        # Lücke geschlossen: Neue Bot-Artikel hatten bis zum wöchentlichen
        # SEO-Workflow (Mittwoch) kurze Titel/Descriptions und waren nicht
        # in die interne Linkstruktur eingebunden. Jetzt direkt nach der
        # Veröffentlichung: Meta-Optimierung (KI) + kontextuelle interne
        # Links – nur wenn wirklich ein Content-Commit vorliegt.
        id: sofort_optimieren
        if: ${{ !cancelled() }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          LAST=$(git log -1 --format=%s)
          if [[ "$LAST" != content:* ]]; then
            echo "Kein Content-Commit in diesem Lauf – keine Sofort-Optimierung nötig."
            exit 0
          fi
          echo "Content-Commit gefunden – optimiere neuen Artikel sofort…"
          python3 scripts/meta_optimizer.py --fix --ai
          python3 scripts/internal_linker.py --apply --max 3
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Optimierungs-Änderungen."
          else
            git commit -m "content: neuer Artikel sofort optimiert (Meta-Titel/Description, interne Verlinkung)"
            git push
          fi

      - name: Neue Artikel sofort bei Bing/Yandex einreichen (IndexNow)
        # Lücke geschlossen: Neue Artikel wurden erst am Mittwoch (SEO-
        # Workflow) bei IndexNow eingereicht → bis zu 5 Tage Indexierungs-
        # Verzögerung. Jetzt sofort nach der Veröffentlichung.
        run: python3 scripts/submit_indexnow.py

      - name: Deploy-Workflow anstoßen (nur falls Push-Trigger nicht greift)
        # Der Push selbst löst den Deploy-Workflow bereits aus (on: push).
        # Dieser Schritt ist nur ein Fallback: Er stößt den Deploy nur dann
        # explizit an, wenn der Commit NICHT gerade eben durch den Push
        # verarbeitet wurde – so entstehen keine parallelen Deploys mehr.
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const last = execSync('git log -1 --format=%s').toString().trim();
            const isContent = last.startsWith('content:');
            if (!isContent) {
              console.log('Kein Content-Commit – kein Deploy nötig.');
              return;
            }
            console.log('Content-Commit gefunden – Deploy wird über den Push-Trigger abgewickelt.');
            console.log('(Kein workflow_dispatch nötig – verhindert parallele Deploys.)')
