# ============================================================
#  AUTOMATISCHE CONTENT-GENERIERUNG (Vollautomatik, kostenlos)
#
#  ⚠️ SEIT 09.08.2026 DEAKTIVIERT (nur noch manuell startbar):
#  Abgelöst durch "Content-Engine v2" (.github/workflows/content-engine-v2.yml),
#  die die 2 kritischen Fehler dieser Version behebt:
#    1) Deploy-Trigger crashte (execSync-Import fehlte) → Artikel wurden
#       nie deployed.
#    2) Kein Fallback bei schwacher KI → 0 Artikel pro Tag.
#  → Die Engine v2 läuft automatisch über dieselben Crons.
# ============================================================
name: Automatische Content-Generierung

on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

# KEINE parallelen Läufe: GitHub holt verpasste Crons nach → zwei Läufe
# gleichzeitig würden sich beim git push gegenseitig blockieren/überschreiben.
concurrency:
  group: content-bot
  cancel-in-progress: false

jobs:
  generiere-und-veroeffentliche:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      # ================= PHASE 1: GENERIEREN & SOFORT LIVE =================
      # ============== PRE-FLIGHT-CHECK (widerstandsfähig) ==============
      # Prüft VOR der Generierung: Skript-Syntax (verhindert stille Ausfälle
      # durch kaputte Skripte), API-Keys, Themenpool. Bricht früh mit klarer
      # Meldung ab (→ Fehler-Alerting) statt mitten im Lauf zu scheitern.
      - name: Pre-Flight-Check (Syntax, Keys, Themenpool)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/bot_preflight.py
          echo "PREFLIGHT_OK=true" >> "$GITHUB_ENV"

      - name: Artikel generieren (Phase 1)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}    # Gratis-Key: console.groq.com
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # Gratis-Key: aistudio.google.com
          BLOG_AUTHOR: ${{ vars.BLOG_AUTHOR }}
          AFFILIATE_URL: ${{ vars.AFFILIATE_URL }}
          MAX_ARTIKEL_PRO_LAUF: "1"
          # Tageslimit via Repository-Variable steuerbar (GitHub → Settings →
          # Secrets and variables → Actions → Variables):
          #   MAX_ARTIKEL_PRO_TAG = "2"  → aktuell (August 2026): 2 Posts/Tag
          #   MAX_ARTIKEL_PRO_TAG = "4"  → ab sofort 4 Posts/Tag möglich
          # Ohne Variable gilt der Default 2. Der Guard verhindert Doppel-Läufe.
          MAX_ARTIKEL_PRO_TAG: ${{ vars.MAX_ARTIKEL_PRO_TAG || '2' }}
          PIN_TOPICS: "1"          # Themen direkt aus dem Pinterest-Plan
          AUTO_PUBLISH: "1"        # Veröffentlichung ohne manuellen Schritt
        run: python3 scripts/generate_drafts.py

      - name: Phase-1-Commit – Artikel sofort veröffentlichen
        # Der Artikel ist ab HIER live. Selbst wenn alle folgenden Schritte
        # fehlschlagen, bleibt er veröffentlicht (Kern der Zuverlässigkeit).
        run: |
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Kein neuer Artikel generiert – nichts zu committen."
            echo "ARTIKEL_ERSTELLT=false" >> "$GITHUB_ENV"
          else
            git commit -m "content: neuer Artikel automatisch generiert und veröffentlicht"
            git pull --rebase --autostash origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            git push
            echo "✅ Phase-1-Commit: Artikel veröffentlicht"
            echo "ARTIKEL_ERSTELLT=true" >> "$GITHUB_ENV"
          fi

      # ============ PHASE 2: QUALITÄTS-KETTE (weich, nie blockierend) ============
      - name: Phase 2 – Qualitäts-Kette (Polish, Rechtschreibung, Grammatik, Gates, Cover, Uniqueness)
        if: ${{ !cancelled() && env.ARTIKEL_ERSTELLT == 'true' }}
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "== Profi-Polish (KI) =="
          python3 scripts/profi_polish.py --new || echo "⚠ Polish-Fehler (nicht kritisch – Artikel bleibt live)"
          echo "== Rechtschreibung (Hunspell) =="
          sudo apt-get install -y -qq hunspell hunspell-de-de >/dev/null 2>&1
          python3 scripts/spellcheck.py --fix || echo "⚠ Spellcheck-Fehler (nicht kritisch)"
          echo "== Grammatik (LanguageTool) =="
          python3 scripts/grammar_check.py --fix --new-only || echo "⚠ Grammatik-Fehler (LanguageTool evtl. limitiert – nicht kritisch)"
          echo "== Profi-Text-Gate =="
          python3 scripts/profi_text_check.py --new-only || echo "⚠ Profi-Gate: Artikel unter Schwelle (manuell prüfen – nicht blockierend)"
          echo "== Lesbarkeits-Gate =="
          python3 scripts/readability_check.py --new-only || echo "⚠ Lesbarkeits-Gate: unter 75 (manuell prüfen – nicht blockierend)"
          echo "== Cover generieren =="
          pip install -q pillow pillow-avif-plugin
          python3 scripts/generate_covers.py || echo "⚠ Cover-Fehler (nicht kritisch)"
          echo "== Einzigartigkeits-Audit =="
          python3 scripts/check_uniqueness.py || echo "⚠ Uniqueness-Audit: kritische Funde (manuell prüfen – nicht blockierend)"
          echo "== Affiliate-Link-Check (Deep-Links automatisch korrigieren) =="
          python3 scripts/affiliate_link_check.py --fix || echo "⚠ Affiliate-Check: Probleme (siehe AFFILIATE-REPORT.md – nicht blockierend)"
          echo "== Cover-Validierung (alle Varianten vorhanden – auto-nachziehen) =="
          python3 scripts/check_covers.py --fix || echo "⚠ Cover-Check: Varianten fehlen trotz Nachziehen (manuell prüfen – nicht blockierend)"
          # Fixes als Folge-Commit sichern
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Qualitäts-Fixes."
          else
            git commit -m "content: Qualitäts-Fixes (Rechtschreibung, Grammatik, Cover, Polish)"
            git pull --rebase --autostash origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            git push
            echo "✅ Folge-Commit: Qualitäts-Fixes gepusht"
          fi

      # ============ PHASE 3: SOFORT-OPTIMIERUNG (weich) ============
      - name: Phase 3 – Meta-Optimierung & interne Links
        if: ${{ !cancelled() && env.ARTIKEL_ERSTELLT == 'true' }}
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "== Meta-Optimierung (KI) =="
          python3 scripts/meta_optimizer.py --fix --ai || echo "⚠ Meta-Fehler (nicht kritisch)"
          echo "== Interne Verlinkung =="
          python3 scripts/internal_linker.py --apply --max 5 || echo "⚠ Linker-Fehler (nicht kritisch)"
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Optimierungs-Änderungen."
          else
            git commit -m "content: neuer Artikel sofort optimiert (Meta, interne Verlinkung)"
            git pull --rebase --autostash origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            git push
            echo "✅ Optimierungs-Commit gepusht"
          fi

      - name: Phase 3 – Sofort bei Bing/Yandex einreichen (IndexNow)
        if: ${{ !cancelled() && env.ARTIKEL_ERSTELLT == 'true' }}
        continue-on-error: true
        run: python3 scripts/submit_indexnow.py || echo "⚠ IndexNow-Fehler (nicht kritisch – SEO-Workflow reicht später nach)"

      # ===================== DEPLOY ANSTOSSEN (KRITISCH) =====================
      # GitHub-Schutz: Commits, die vom GITHUB_TOKEN eines Workflows erstellt
      # werden, lösen KEINE weiteren Workflow-Läufe aus (rekursive Trigger-
      # Sperre). Der Content-Bot pusht aber genau so → der Deploy-Workflow
      # würde NIE starten und neue Artikel blieben offline!
      # Lösung: Deploy-Workflow per workflow_dispatch explizit anstoßen –
      # GANZ AM ENDE (nach allen Folge-Commits), damit der neueste Stand
      # deployed wird. (Deploy-Workflow hat concurrency-Queue → kein Konflikt.)
      - name: Deploy-Workflow explizit anstoßen (GitHub-Token-Schutz umgehen)
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        with:
          script: |
            const last = execSync('git log -1 --format=%s').toString().trim();
            const isContent = last.startsWith('content:');
            if (!isContent) {
              console.log('Kein Content-Commit in diesem Lauf – kein Deploy nötig.');
              return;
            }
            console.log('Content-Commit gefunden – stoße Deploy-Workflow an …');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
            });
            console.log('✅ Deploy-Workflow ausgelöst.');

      # ===================== STATUS-ZUSAMMENFASSUNG =====================
      # ============== BOT-STATUS-DASHBOARD (immer aktualisieren) ==============
      # Aktualisiert BOT-STATUS.md im Repo (Änderungs-Only-Commit, kein Spam),
      # damit du den Zustand der Automatisierung auf der Repo-Seite siehst.
      - name: Bot-Status-Dashboard aktualisieren
        if: ${{ always() }}
        env:
          MAX_ARTIKEL_PRO_TAG: ${{ vars.MAX_ARTIKEL_PRO_TAG || '2' }}
        run: |
          python3 scripts/bot_status.py
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add BOT-STATUS.md
          if git diff --cached --quiet; then
            echo "BOT-STATUS.md unverändert."
          else
            git commit -m "chore: Bot-Status aktualisiert"
            git pull --rebase --autostash origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            git push
            echo "✅ BOT-STATUS.md gepusht"
          fi

      - name: Status-Zusammenfassung (Job-Summary)
        if: ${{ always() }}
        run: |
          {
            echo "## 🤖 Content-Bot – Lauf-Zusammenfassung"
            echo ""
            echo "- **Artikel erstellt:** ${{ env.ARTIKEL_ERSTELLT == 'true' && 'JA ✅' || 'Nein (Limit erreicht oder KI ohne Antwort)' }}"
            echo "- **Letzter Commit:** $(git log -1 --format='%h %s')"
            echo "- **Tages-Limit:** ${{ vars.MAX_ARTIKEL_PRO_TAG || '2' }} Artikel (Guard aktiv – per GitHub-Variable auf 4 erhöhbar)"
            echo ""
            echo "> Hinweis: Phase-2/3-Fehler sind weich – sie verhindern die Veröffentlichung NICHT."
          } >> "$GITHUB_STEP_SUMMARY"
