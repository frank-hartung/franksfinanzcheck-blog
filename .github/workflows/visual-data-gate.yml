name: Daten- und Visualisierungs-Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "data/datasets/**"
      - "layouts/shortcodes/chart.html"
      - "assets/css/extended/zz-visual-data.css"
      - "content/**"
      - "scripts/visual_data_gate.py"
      - "scripts/tests/test_visual_data_gate.py"
      - ".github/workflows/visual-data-gate.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  visual-data:
    name: Quellen, Stand, Einheit und Methodik
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: YAML-Abhängigkeit installieren
        run: pip install --require-hashes -r "$GITHUB_WORKSPACE/requirements-ci.txt"
      - name: Datensätze und Einbindungen prüfen
        run: python3 scripts/visual_data_gate.py
      - name: Gate-Tests ausführen
        run: python3 -m unittest scripts.tests.test_visual_data_gate -v
      - name: Hugo installieren
        uses: ./.github/actions/install-hugo
        with:
          version: "0.168.0"
      - name: Statisches SVG und Datentabelle bauen
        uses: ./.github/actions/hugo-build
        with:
          args: "--minify --destination public"
          label: "Visual-Data-Gate"
      - name: Gebaute Visualisierungen nachweisen
        run: |
          test "$(grep -Roh 'data-ff-chart' public/posts | wc -l)" -ge 2
          test "$(grep -Roh 'ff-chart__table' public/posts | wc -l)" -ge 2
          test "$(grep -Roh 'ff-chart__mark' public/posts | wc -l)" -ge 7
