# ============================================================
#  CLOUDFLARE-WORKER DEPLOYEN – Sicherheitsaudit 14.10.2026 (M-14)
#
#  Vorher existierte die produktive Worker-Konfiguration nur im Dashboard
#  (Platzhalter-IDs im Repo, `workers_dev = true`). Jetzt gilt:
#    · Deploy ausschließlich aus dem Repo, mit fest gepinntem Wrangler
#      (tools/wrangler, npm ci --ignore-scripts).
#    · Jeder Deploy braucht die Freigabe im Environment
#      `cloudflare-produktion` (Required reviewer, nur Branch main).
#    · Ressourcen-IDs kommen aus Repository-Variablen ODER – seit der zweiten
#      WF-E813-Härtung – lesend aus der bereits produktiven Worker-Bindung.
#      Dadurch blockiert eine fehlende kopierte Variable den Deploy nicht mehr.
#      Es wird NIE ein neuer/leerer Speicher geraten oder angelegt; fehlt auch
#      die bestehende Bindung, bricht der Deploy sichtbar rot ab (kein Skip-Grün).
#    · `workers_dev = false` ist Pflicht (scripts/worker_deploy_vorbereiten.py).
#    · Vor dem Deploy laufen die Worker-Tests.
#
#  Secrets:
#    CF_WORKERS_DEPLOY_TOKEN  – im Environment `cloudflare-produktion`: eigener
#                               API-Token NUR für Worker-Deploys (Vorlage
#                               „Edit Cloudflare Workers“ + D1: Edit, nur
#                               dieses Konto und die Zone franksfinanzcheck.de)
#    CLOUDFLARE_ACCOUNT_ID    – Konto-ID (das vorhandene Repo-Secret genügt)
#  Der Workers-AI-Token CLOUDFLARE_API_TOKEN wird hier bewusst NICHT benutzt.
#
#  Der KI-Assistent wird nur von Hand deployt (M-04: bewusst aus).
#
#  ZUGANGSDOSSIER STATT RATESPIEL (WF-829B / #922, 29.10.2026):
#  Der Lauf 40569123622 scheiterte am 27.10. in beiden Deploy-Jobs im
#  Schritt „Produktive Ressource auflösen“ – nach 0 s, vor Wrangler.
#  Fail-closed war richtig; die Auskunft war es nicht: Der Resolver
#  bricht beim ERSTEN fehlenden Baustein ab, also kostete jedes Feld
#  eine eigene Environment-Freigabe. Vor dem Resolver läuft deshalb
#  `scripts/worker_zugang.py`: Es sammelt ALLE Befunde des Laufs
#  (Token fehlt/ungültig/zu schwach, Konto-ID fehlt/falsch, Worker
#  unbekannt, Bindung fehlt/mehrdeutig, Netzstörung), schreibt ein
#  Inhaber-Dossier in die Step Summary und meldet je Befund genau eine
#  Annotation. Gelesen wird ausschließlich; nichts wird angelegt oder
#  geändert. Der Resolver bleibt die Autorität für die IDs, die
#  Reihenfolge (Prüfung → Auflösung → Vorbereitung → Deploy) bleibt.
#  Wer nur den Zugang prüfen will, ohne zu deployen: Workflow
#  „Deploy-Zugang prüfen“ (workflow_dispatch, gleiches Environment).
# ============================================================
name: Cloudflare-Worker deployen

on:
  workflow_dispatch:
    inputs:
      worker:
        description: "Welcher Worker?"
        required: true
        type: choice
        options:
          - newsletter-worker
          - klick-zaehler
          - ki-assistent
  push:
    branches: [main]
    paths:
      - "newsletter-worker/**"
      - "cloudflare/klick-zaehler/**"
      - "cloudflare/ki-assistent/**"
      - "tools/wrangler/**"
      - "scripts/worker_deploy_vorbereiten.py"
      - "scripts/worker_ressourcen.py"
      - "scripts/worker_zugang.py"
      - "scripts/github_kommando.py"
      - "scripts/manifest_guard.py"
      - ".github/workflows/worker-deploy.yml"

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  plan:
    name: Deploy planen
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      worker: ${{ steps.plan.outputs.worker }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Geänderte Dateien ermitteln (nur bei push)
        id: diff
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VORHER: ${{ github.event.before }}
          NACHHER: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$VORHER" ] || [ "$VORHER" = "0000000000000000000000000000000000000000" ]; then
            echo "dateien=*" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "dateien<<ENDE_DATEIEN"
            gh api "repos/${REPO}/compare/${VORHER}...${NACHHER}" --jq '.files[].filename' || echo "*"
            echo "ENDE_DATEIEN"
          } >> "$GITHUB_OUTPUT"

      - name: Deploybereite Worker bestimmen
        id: plan
        env:
          EREIGNIS: ${{ github.event_name }}
          AUSWAHL: ${{ inputs.worker }}
          GEAENDERT: ${{ steps.diff.outputs.dateien }}
        run: |
          python3 scripts/worker_deploy_vorbereiten.py --selftest
          python3 scripts/worker_deploy_vorbereiten.py --plan

  deploy:
    name: Deploy ${{ matrix.worker }}
    needs: plan
    if: needs.plan.outputs.worker != '[]' && needs.plan.outputs.worker != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: cloudflare-produktion
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        worker: ${{ fromJSON(needs.plan.outputs.worker) }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nur von main deployen
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Worker werden nur von main deployt (Ref: $REF)."
            exit 1
          fi

      - name: Node bereitstellen
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Worker-Tests
        env:
          WORKER: ${{ matrix.worker }}
        run: |
          set -euo pipefail
          case "$WORKER" in
            newsletter-worker) cd newsletter-worker && node --test ;;
            klick-zaehler) cd cloudflare/klick-zaehler && node --test test/worker.test.mjs ;;
            ki-assistent) cd cloudflare/ki-assistent && node --test test/worker.test.mjs ;;
            *) echo "::error::Unbekannter Worker: $WORKER"; exit 1 ;;
          esac

      - name: Selbsttest Deploy-Zugang (ohne Netz)
        run: python3 scripts/worker_zugang.py --selftest

      - name: Zugang prüfen (alle Befunde auf einmal, lesend)
        id: zugang
        env:
          WORKER: ${{ matrix.worker }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID_ABO: ${{ vars.KV_NAMESPACE_ID_ABO }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          python3 scripts/worker_zugang.py --pruefen --worker "$WORKER" --md "$GITHUB_STEP_SUMMARY"

      - name: Produktive Ressource auflösen (lesend, ohne neuen Speicher)
        id: ressourcen
        env:
          WORKER: ${{ matrix.worker }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID_ABO: ${{ vars.KV_NAMESPACE_ID_ABO }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          python3 scripts/worker_ressourcen.py --selftest
          python3 scripts/worker_ressourcen.py --aufloesen "$WORKER"

      - name: Konfiguration vorbereiten (aufgelöste IDs, workers_dev = false)
        env:
          WORKER: ${{ matrix.worker }}
          KV_NAMESPACE_ID_ABO: ${{ steps.ressourcen.outputs.kv_namespace_id_abo }}
          D1_DATABASE_ID: ${{ steps.ressourcen.outputs.d1_database_id }}
        run: python3 scripts/worker_deploy_vorbereiten.py --vorbereiten "$WORKER"

      - name: Manifest-Wache (package.json & Lockfile vor npm ci)
        run: |
          python3 scripts/manifest_guard.py --selftest
          python3 scripts/manifest_guard.py

      - name: Wrangler installieren (gepinnt, ohne Install-Skripte)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/wrangler

      - name: Deploy
        env:
          WORKER: ${{ matrix.worker }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CF_WORKERS_DEPLOY_TOKEN oder CLOUDFLARE_ACCOUNT_ID fehlt im Environment cloudflare-produktion."
            exit 1
          fi
          case "$WORKER" in
            newsletter-worker) VERZ=newsletter-worker ;;
            klick-zaehler) VERZ=cloudflare/klick-zaehler ;;
            ki-assistent) VERZ=cloudflare/ki-assistent ;;
            *) echo "::error::Unbekannter Worker: $WORKER"; exit 1 ;;
          esac
          WRANGLER_SEND_METRICS=false tools/wrangler/node_modules/.bin/wrangler deploy --config "$VERZ/wrangler.toml"
          python3 scripts/worker_deploy_vorbereiten.py --nachweis "$WORKER"
          {
            echo "## ✅ Worker deployt: $WORKER"
            echo ""
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Freigegeben über Environment cloudflare-produktion"
          } >> "$GITHUB_STEP_SUMMARY"
