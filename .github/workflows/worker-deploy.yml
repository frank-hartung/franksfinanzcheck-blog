# ============================================================
#  CLOUDFLARE-WORKER DEPLOYEN – Sicherheitsaudit 14.10.2026 (M-14)
#
#  Vorher existierte die produktive Worker-Konfiguration nur im Dashboard
#  (Platzhalter-IDs im Repo, `workers_dev = true`). Jetzt gilt:
#    · Deploy ausschließlich aus dem Repo, mit fest gepinntem Wrangler
#      (tools/wrangler, npm ci --ignore-scripts).
#    · Vor dem Secret-Job prüft ein read-only-Gate, dass
#      `cloudflare-produktion` mindestens einen Required Reviewer, exakt
#      `main` als Branch und keinen Admin-Bypass konfiguriert hat.
#    · Ressourcen-IDs kommen aus Repository-Variablen ODER – seit der zweiten
#      WF-E813-Härtung – lesend aus der bereits produktiven Worker-Bindung.
#      Dadurch blockiert eine fehlende kopierte Variable den Deploy nicht mehr.
#      Es wird NIE ein neuer/leerer Speicher geraten oder angelegt; fehlt auch
#      die bestehende Bindung, bricht der Deploy sichtbar rot ab (kein Skip-Grün).
#    · `workers_dev = false` ist Pflicht (scripts/worker_deploy_vorbereiten.py).
#    · Vor dem Deploy laufen die Worker-Tests.
#
#  Secrets:
#    CF_WORKERS_DEPLOY_TOKEN  – im Environment `cloudflare-produktion`: eigener
#                               API-Token NUR für Worker-Deploys (Vorlage
#                               „Edit Cloudflare Workers“ + D1: Edit, nur
#                               dieses Konto und die Zone franksfinanzcheck.de)
#    CLOUDFLARE_ACCOUNT_ID    – Konto-ID (das vorhandene Repo-Secret genügt)
#  Der Workers-AI-Token CLOUDFLARE_API_TOKEN wird hier bewusst NICHT benutzt.
#
#  Der KI-Assistent wird nur von Hand deployt (M-04: bewusst aus).
#
#  ZUGANGSDOSSIER STATT RATESPIEL (WF-829B / #922, 29.10.2026):
#  Der Lauf 40569123622 scheiterte am 27.10. in beiden Deploy-Jobs im
#  Schritt „Produktive Ressource auflösen“ – nach 0 s, vor Wrangler.
#  Fail-closed war richtig; die Auskunft war es nicht: Der Resolver
#  bricht beim ERSTEN fehlenden Baustein ab, also kostete jedes Feld
#  eine eigene Environment-Freigabe. Vor dem Resolver läuft deshalb
#  `scripts/worker_zugang.py`: Es sammelt ALLE Befunde des Laufs
#  (Token fehlt/ungültig/zu schwach, Konto-ID fehlt/falsch, Worker
#  unbekannt, Bindung fehlt/mehrdeutig, Netzstörung), schreibt ein
#  Inhaber-Dossier in die Step Summary und meldet je Befund genau eine
#  Annotation. Gelesen wird ausschließlich; nichts wird angelegt oder
#  geändert. Der Resolver bleibt die Autorität für die IDs, die
#  Reihenfolge (Prüfung → Auflösung → Vorbereitung → Deploy) bleibt.
#  Wer nur den Zugang prüfen will, ohne zu deployen: Workflow
#  „Deploy-Zugang prüfen“ (workflow_dispatch, gleiches Environment).
# ------------------------------------------------------------
#  TRIGGER-VERTRAG WF-829B / #922, 10.11.2026 (gemessen, nicht vermutet)
#  ------------------------------------------------------------
#  Ein freigabepflichtiger Produktions-Deploy ist ein WILLENSakt. Das
#  Runbook A4 sagt es selbst: „Actions → Cloudflare-Worker deployen →
#  Run workflow (main)". Trotzdem hat dieses Workflow-File jeden `push`
#  auf einen Worker-Pfad als Deploy-Versuch behandelt. Das Ergebnis war
#  strukturell unvermeidlich: Das fail-closed-Gate las das Environment
#  `cloudflare-produktion` (seit 25.10. ungesichert), brach korrekt vor
#  jedem Secret-Zugriff ab – und jeder Abhängigkeits-Bump wurde zu einem
#  roten Lauf samt Nachführung von #922. Acht rote Läufe seit dem 27.10.
#  Der parallele Selbstheilungs-Workflow lief siebenmal grün, viermal
#  davon mit ausgeführtem Live-Heiljob – ohne eine Zeile am Environment
#  zu ändern: Ihm fehlt `administration=write` (live 403), und
#  `can_admins_bypass` hat in REST wie GraphQL keinen Schreibweg.
#
#  DESHALB AB JETZT:
#    · `workflow_dispatch` → Plan, Produktions-Gate, Deploy (unverändert,
#      inklusive des harten Stopps VOR den Cloudflare-Secrets).
#    · `push` / `pull_request` → NUR der geheimnisfreie Testjob. Kein
#      Environment, kein Secret, kein Wrangler, kein Freigabe-Versuch.
#    · `abschluss` (immer) beweist die Trennung: Ein geplanter Deploy darf
#      nie `skipped` sein, und ein Push/PR darf nie deployen. Ein grüner
#      Lauf ohne ausgeführten Deploy ist damit ausgeschlossen – genau der
#      Vorfall vom 24.10.2026 (Run 40100342025), diesmal am Verhalten
#      gemessen statt an einer Stellvertreter-Einstellung.
#
#  NICHT GEÄNDERT: die drei Schutzziele des Environments, das Gate, die
#  Reihenfolge, die Ressourcenauflösung, der Build-Nachweis. Nichts wurde
#  gelockert, um Grün zu erzeugen. Wer deployen will, löst den Lauf auf
#  `main` bewusst aus; die Environment-Freigabe bleibt Menschenhandlung.
# ============================================================
name: Cloudflare-Worker deployen

on:
  workflow_dispatch:
    inputs:
      worker:
        description: "Welcher Worker?"
        required: true
        type: choice
        options:
          - newsletter-worker
          - klick-zaehler
          - ki-assistent
  # Beide Filter sind deckungsgleich (W3 der Trigger-Wache). Jedes Skript,
  # das unten in einem `run:`-Block steht, muss in BEIDEN Listen stehen.
  pull_request:
    paths:
      - "newsletter-worker/**"
      - "cloudflare/klick-zaehler/**"
      - "cloudflare/ki-assistent/**"
      - "tools/wrangler/**"
      - "scripts/worker_deploy_vorbereiten.py"
      - "scripts/worker_ressourcen.py"
      - "scripts/worker_zugang.py"
      - "scripts/github_kommando.py"
      - "scripts/worker_environment_guard.py"
      - "scripts/manifest_guard.py"
      - "scripts/ci_tests.py"
      - "scripts/worker_deploy_abschluss.py"
      - "scripts/tests/test_worker_deploy_abschluss.py"
      - ".github/workflows/worker-deploy.yml"
      - ".github/workflows/produktions-schutz-selbstheilung.yml"
  push:
    branches: [main]
    paths:
      - "newsletter-worker/**"
      - "cloudflare/klick-zaehler/**"
      - "cloudflare/ki-assistent/**"
      - "tools/wrangler/**"
      - "scripts/worker_deploy_vorbereiten.py"
      - "scripts/worker_ressourcen.py"
      - "scripts/worker_zugang.py"
      - "scripts/github_kommando.py"
      - "scripts/worker_environment_guard.py"
      - "scripts/manifest_guard.py"
      - "scripts/ci_tests.py"
      - "scripts/worker_deploy_abschluss.py"
      - "scripts/tests/test_worker_deploy_abschluss.py"
      - ".github/workflows/worker-deploy.yml"
      - ".github/workflows/produktions-schutz-selbstheilung.yml"

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  # Push/PR: NUR Tests. Kein Environment, kein Secret, kein Wrangler.
  # Der Name bleibt bei „Worker-Tests", damit ein roter Test vom Fehler-
  # Alerting als Code-Regression (Runbook-Klasse `worker-deploy`) erkannt wird.
  tests:
    name: Worker-Tests (ohne Deployment)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node bereitstellen
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Worker-Tests (alle drei Worker, geheimnisfrei)
        run: |
          set -euo pipefail
          python3 scripts/ci_tests.py --titel "Worker-Tests (ohne Deployment)" -- bash -c 'set -euo pipefail; (cd newsletter-worker && node --test); (cd cloudflare/klick-zaehler && node --test test/worker.test.mjs); (cd cloudflare/ki-assistent && node --test test/worker.test.mjs)'

      - name: Deploy-Vorbereitung selbsttesten (offline, ohne Schreiben)
        run: python3 scripts/worker_deploy_vorbereiten.py --selftest

  plan:
    name: Deploy planen
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      worker: ${{ steps.plan.outputs.worker }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploybereite Worker bestimmen
        id: plan
        env:
          EREIGNIS: ${{ github.event_name }}
          AUSWAHL: ${{ inputs.worker }}
          REF: ${{ github.ref }}
        run: |
          python3 scripts/worker_deploy_vorbereiten.py --selftest
          python3 scripts/worker_deploy_vorbereiten.py --plan

  production-policy:
    name: Produktions-Environment absichern (nur main, Reviewer, kein Admin-Bypass)
    needs: plan
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.worker != '[]' && needs.plan.outputs.worker != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Dieses Vorab-Gate liest nur GitHub-Environment-Metadaten. Es hat weder
    # ein Environment noch Cloudflare-Secrets; erst sein Erfolg darf den
    # nachfolgenden, secret-tragenden Deploy-Job freigeben.
    permissions:
      actions: read
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Environment-Guard selbsttesten (offline)
        run: python3 scripts/worker_environment_guard.py --selftest

      - name: Produktions-Environment absichern (vor Zugriff auf Secrets)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/worker_environment_guard.py --check

  deploy:
    name: Deploy ${{ matrix.worker }}
    needs: [plan, production-policy]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.plan.outputs.worker != '[]' && needs.plan.outputs.worker != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: cloudflare-produktion
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        worker: ${{ fromJSON(needs.plan.outputs.worker) }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nur von main deployen
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Worker werden nur von main deployt (Ref: $REF)."
            exit 1
          fi

      - name: Node bereitstellen
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Worker-Tests
        env:
          WORKER: ${{ matrix.worker }}
        run: |
          set -euo pipefail
          case "$WORKER" in
            newsletter-worker) cd newsletter-worker && node --test ;;
            klick-zaehler) cd cloudflare/klick-zaehler && node --test test/worker.test.mjs ;;
            ki-assistent) cd cloudflare/ki-assistent && node --test test/worker.test.mjs ;;
            *) echo "::error::Unbekannter Worker: $WORKER"; exit 1 ;;
          esac

      - name: Selbsttest Deploy-Zugang (ohne Netz)
        run: python3 scripts/worker_zugang.py --selftest

      - name: Zugang prüfen (alle Befunde auf einmal, lesend)
        id: zugang
        env:
          WORKER: ${{ matrix.worker }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID_ABO: ${{ vars.KV_NAMESPACE_ID_ABO }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          python3 scripts/worker_zugang.py --pruefen --worker "$WORKER" --md "$GITHUB_STEP_SUMMARY"

      - name: Produktive Ressource auflösen (lesend, ohne neuen Speicher)
        id: ressourcen
        env:
          WORKER: ${{ matrix.worker }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID_ABO: ${{ vars.KV_NAMESPACE_ID_ABO }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          python3 scripts/worker_ressourcen.py --selftest
          python3 scripts/worker_ressourcen.py --aufloesen "$WORKER"

      - name: Konfiguration vorbereiten (aufgelöste IDs, workers_dev = false)
        env:
          WORKER: ${{ matrix.worker }}
          KV_NAMESPACE_ID_ABO: ${{ steps.ressourcen.outputs.kv_namespace_id_abo }}
          D1_DATABASE_ID: ${{ steps.ressourcen.outputs.d1_database_id }}
        run: python3 scripts/worker_deploy_vorbereiten.py --vorbereiten "$WORKER"

      - name: Manifest-Wache (package.json & Lockfile vor npm ci)
        run: |
          python3 scripts/manifest_guard.py --selftest
          python3 scripts/manifest_guard.py

      - name: Wrangler installieren (gepinnt, ohne Install-Skripte)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/wrangler

      - name: Deploy
        env:
          WORKER: ${{ matrix.worker }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CF_WORKERS_DEPLOY_TOKEN oder CLOUDFLARE_ACCOUNT_ID fehlt im Environment cloudflare-produktion."
            exit 1
          fi
          case "$WORKER" in
            newsletter-worker) VERZ=newsletter-worker ;;
            klick-zaehler) VERZ=cloudflare/klick-zaehler ;;
            ki-assistent) VERZ=cloudflare/ki-assistent ;;
            *) echo "::error::Unbekannter Worker: $WORKER"; exit 1 ;;
          esac
          WRANGLER_SEND_METRICS=false tools/wrangler/node_modules/.bin/wrangler deploy --config "$VERZ/wrangler.toml"
          python3 scripts/worker_deploy_vorbereiten.py --nachweis "$WORKER"
          {
            echo "## ✅ Worker deployt: $WORKER"
            echo ""
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Freigegeben über Environment cloudflare-produktion"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------
  #  ABSCHLUSS · Der Beweis am Verhalten, nicht an der Einstellung.
  #  Läuft IMMER (auch wenn ein vorgelagerter Job rot oder übersprungen
  #  ist) und liest ausschließlich `needs.*.result`. Kein Secret, kein
  #  Environment, kein Netz. Ein roter Befund nennt den Job beim Namen.
  # ------------------------------------------------------------
  abschluss:
    name: Deploy-Beweis · kein stiller Skip
    if: always()
    needs: [plan, tests, production-policy, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Beweis selbsttesten (offline, Gegenproben)
        run: python3 scripts/worker_deploy_abschluss.py --selftest

      - name: Deploy-Beweis aus der Lage DIESES Laufs
        env:
          EREIGNIS: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GEPLANT: ${{ needs.plan.outputs.worker }}
          ERGEBNIS_PLAN: ${{ needs.plan.result }}
          ERGEBNIS_TESTS: ${{ needs.tests.result }}
          ERGEBNIS_POLICY: ${{ needs.production-policy.result }}
          ERGEBNIS_DEPLOY: ${{ needs.deploy.result }}
        run: |
          python3 scripts/worker_deploy_abschluss.py --pruefen --md "$GITHUB_STEP_SUMMARY"
