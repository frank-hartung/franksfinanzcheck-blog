# Newsletter-Tageslauf: Capture-Wache + Digest, Versand nur mit Absender.
#
# Warum dieser Workflow überhaupt existiert: docs/ANLEITUNG-NEWSLETTER.md
# beschrieb seit Wochen einen „Newsletter-AI"-Lauf samt NEWSLETTER-STATUS.md.
# Beides gab es nie – der Newsletter war eine Dokumentation, keine Funktion.
# Dieser Lauf ist die Funktion (bzw. der ehrliche Nachweis, dass sie noch
# inert ist), und die Wache meldet beides laut.
#
# Sicherheitshierarchie (absichtlich dreifach):
#   1. ohne Secrets (BREVO_API_KEY / BREVO_LIST_ID) wird kein Netzversuch gemacht
#   2. ohne workflow_dispatch-Eingabe („live“, „planmaessig“ ODER test_adresse)
#      wird nur gebaut, nicht gesendet – ein Testversand trifft nur die
#      eingegebene Adresse (sendTest)
#   3. gesendet wird an eine Liste, deren Double-Opt-in bei Brevo liegt –
#      Adressen berühren diesen Repo-Workflow nie
#
# „planmaessig“ (nur für die Kadenz-Wache gedacht): verhält sich exakt wie der
# planmäßige Cron (05:05 UTC, Mo–Fr, echter Listen-Versand). Grund: GitHub
# verwirft oder verschiebt schedule-Ereignisse gelegentlich STILL (23.09.2026:
# der 05:05-Cron blieb komplett aus, am Vortag kam er erst ~10:05 UTC). Die
# Kadenz-Wache (newsletter-cadence.yml) zählt nach und holt den Lauf genau dann
# nach, wenn sicher kein Lauf des Tages existiert – dieselbe Freigabestufe wie
# der Cron, nicht mehr.
name: Newsletter-Daily (Capture-Wache + Digest)

on:
  schedule:
    - cron: "5 5 * * 1-5"     # 05:05 UTC = 07:05 MESZ – vor dem Frühstück
  workflow_dispatch:
    inputs:
      tage:
        description: 'Zeitraum: Artikel der letzten N Tage in den Digest'
        type: string
        default: '1'
      live:
        description: 'WIRKLICH an die Liste senden (sonst nur bauen; mit test_adresse bleibt es beim Testversand)'
        type: boolean
        default: false
      test_adresse:
        description: 'Testversand an diese Adresse (leer = kein Testversand) – trifft NUR diese Adresse, nie die Liste'
        type: string
        default: ''
      planmaessig:
        description: 'NUR Kadenz-Wache: verhält sich wie der planmäßige Cron (echter Listen-Versand)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: newsletter-daily
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python bereitstellen
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Wachen-Selbsttest (Capture-Logik, Verdopplungsschutz, Verriegelung)
        run: python3 scripts/newsletter_digest.py --selftest

      # Die Capture-Wache prüft N5/N6 am GEBAUTEN Zustand (Landingpage,
      # Footer-CTA). Ohne Build vor der Wache meldet sie ab Aktivierung
      # jeden Lauf „Build veraltet“ für eine gesunde Seite – eine Wache,
      # die prüft, was sie nie sah, ist ein Dauer-Falschalarm. Deshalb
      # derselbe Hugo-Build wie im Qualitäts-Gate (22.09.2026).
      - name: Hugo installieren (Extended, verifiziert, mehrquellig)
        uses: ./.github/actions/install-hugo
        with:
          version: "0.164.0"

      - name: Seite bauen
        run: hugo --minify

      - name: Capture-Wache – konfiguriert oder laut inert
        # --strict-inert: ein Lauf, der senden will, darf Inaktivität nicht als
        # Erfolg verbuchen. Kein Gate-Fehler (der Leerzustand ist ein Betreiber-
        # entscheid, kein Defekt), aber eine Warnung im Lauf + Summary.
        run: |
          set +e
          python3 scripts/newsletter_digest.py --check --strict-inert | tee /tmp/nl_check.log
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "## 📬 Newsletter-Capture"
            echo '```'
            sed -n '1,20p' /tmp/nl_check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Newsletter-Capture inaktiv oder Befund – es gehen keine Adressen ein (siehe Summary)"
          fi

      # Die Zustellbarkeits-Wache: Cloudflare-Zone + Brevo-Konto, GEMESSEN statt
      # nachgeschlagen. Warum vor dem Versand und nicht nur im Governance-Lauf:
      # Lauf #21 (23.09.) meldete einen Absender-Befund für ein Problem der Kante
      # (HTTP 403 / Cloudflare „Error 1010“ – die API-Antwort kam nie von Brevo),
      # und die Checkliste schrieb als nächsten Schritt eine SPF-Erweiterung vor,
      # die an der Zustellung nichts ändert. Beides sind Klassen, die nur sichtbar
      # werden, wenn man Zone und Konto gemeinsam nachmisst.
      # Der Lauf bleibt bei Messlücken gelb (DoH-Ausfall ist kein Befund); rot –
      # und damit Versand gestoppt – wird nur ein bestätigter Fund bei einem
      # wirklichen Listen-Versand. Testversände (eine Adresse) bleiben erlaubt:
      # sie sind der vorgesehene Probelauf VOR der Freischaltung.
      - name: Zustellbarkeit (Cloudflare-DNS + Brevo-Konto)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          # Als ENV, nicht als Interpolation im Skripttext (B3-Regel aus der
          # Kadenz-Absicherung: Eingaben sind Daten, niemals Code).
          SEND_AN: ${{ (inputs.live || inputs.planmaessig || github.event_name == 'schedule') && 'ja' || 'nein' }}
          TEST_ADRESSE_GESETZT: ${{ inputs.test_adresse != '' && 'ja' || 'nein' }}
        run: |
          set +e
          if ! python3 scripts/newsletter_zustellbarkeit.py --selftest > /tmp/zust_selftest.log 2>&1; then
            set -e
            echo "::error::Zustellbarkeits-Wache: Selbsttest rot – ihre Aussagen wären wertlos"
            tail -20 /tmp/zust_selftest.log
            exit 1
          fi
          python3 scripts/newsletter_zustellbarkeit.py --pruefen --md > /tmp/zust.md 2>/tmp/zust.err
          rc=$?
          set -e
          {
            echo ""
            cat /tmp/zust.md
            [ -s /tmp/zust.err ] && echo "_Hinweise:_ \`$(tail -2 /tmp/zust.err | tr '\n' ' ' | cut -c1-200)\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            if [ "$SEND_AN" = "ja" ] && [ "$TEST_ADRESE_GESETZT" != "ja" ]; then
              echo "::error::Zustellbarkeit befundet (rc $rc) – der Listen-Versand wird angehalten, bevor eine Kampagne entsteht. Details im Summary dieses Schritts."
              exit "$rc"
            fi
            echo "::warning::Zustellbarkeit befundet – gebaut, aber nicht an die Liste gesendet. Details im Summary dieses Schritts."
          fi

      - name: Digest bauen (und senden, wenn Absender + Freigabe da sind)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          NEWSLETTER_ABSENDER: ${{ vars.NEWSLETTER_ABSENDER }}
          # Die Freigabe für den LISTEN-Versand: planmäßiger Cron, „live“ oder
          # „planmaessig“ (Nachholen der Kadenz-Wache). Eine test_adresse allein
          # ist ein realer, aber eingegrenzter sendTest – sie braucht diese
          # Freigabe nicht (Entscheidung 23.09.2026, dokumentiert im Skript).
          NEWSLETTER_SEND: ${{ (inputs.live || inputs.planmaessig || github.event_name == 'schedule') && 'ja' || '' }}
          # Eingaben als ENV statt als ${{ }}-Interpolation im Skripttext:
          # ein String-Eingabefeld (test_adresse!) gehört nie ungefiltert in
          # eine Shell-Zeile – als env-Wert ist sie Daten, kein Code.
          EINGABE_TAGE: ${{ inputs.tage || '1' }}
          EINGABE_TEST_ADRESSE: ${{ inputs.test_adresse || '' }}
        run: |
          TAGE="$EINGABE_TAGE"
          case "$TAGE" in ''|*[!0-9]*) TAGE=1 ;; esac
          ARGS="--build --days $TAGE --out /tmp/ff-newsletter"
          # --send war bisher nur für „schedule“ verdrahtet – workflow_dispatch
          # durfte dadurch nie senden, weder „live“ noch als Testversand (Bug
          # 23.09.2026: Testlauf lief grün, die Mail kam nie an). Jetzt gilt:
          # planmäßiger Lauf, „live“, „planmaessig“ oder eine Testadresse
          # bedeuten jeweils „ja, es soll etwas raus“.
          SENDEN=""
          if [ "$NEWSLETTER_SEND" = "ja" ]; then
            SENDEN="ja"
          fi
          if [ -n "$EINGABE_TEST_ADRESSE" ]; then
            SENDEN="ja"
          fi
          if [ -n "$SENDEN" ]; then
            ARGS="$ARGS --send"
            # --live = Liste wirklich treffen. Der Testversand braucht es nicht:
            # er ist über die Testadresse bereits eine real eingegrenzte Aktion
            # (Brevo sendTest, nie sendNow).
            if [ "$NEWSLETTER_SEND" = "ja" ]; then
              ARGS="$ARGS --live"
            fi
          fi
          # Ohne Absender kein Versand – und kein roter Lauf: der Leerzustand ist
          # eine Betreiber-Entscheidung, kein Defekt. Die Warnung steht im Log,
          # die Capture-Wache oben meldet denselben Zustand zusätzlich laut.
          if [ -z "$BREVO_API_KEY" ] || [ -z "$BREVO_LIST_ID" ]; then
            echo "⚠ Kein Absender konfiguriert (Secrets BREVO_API_KEY / BREVO_LIST_ID) – Digest wird nur gebaut."
            ARGS="${ARGS/--send/}"
            ARGS="${ARGS/--live/}"
            OHNE_ABSENDER="ja"
          fi
          set +e
          # --test-adresse IMMER übergeben (leer = keiner): der Wert läuft als
          # env-Variable in Anführungszeichen, nie als Skript-Interpolation –
          # Leerzeichen in der Adresse splitten nichts, Inhalt kann keine
          # Shell-Zeile erfinden.
          python3 scripts/newsletter_digest.py $ARGS --test-adresse "$EINGABE_TEST_ADRESSE" | tee /tmp/nl_build.log
          rc=${PIPESTATUS[0]}
          set -e
          # Die Pipeline (| tee) verschluckt den Exit-Code des Skripts – hier
          # wird er wieder sichtbar. Ein blockierter (QA) oder fehlgeschlagener
          # (Brevo) Versand darf nicht als grüner Lauf durchgehen.
          if [ -n "${OHNE_ABSENDER:-}" ]; then
            echo "::warning::Kein Absender konfiguriert (BREVO_API_KEY / BREVO_LIST_ID) – es wurde nichts versendet."
          fi
          if [ "$rc" -ne 0 ]; then
            if [ -n "${OHNE_ABSENDER:-}" ]; then
              echo "::warning::Digest-Versand nicht ausgelöst, weil kein Absender konfiguriert ist – nur gebaut."
            else
              # Der konkrete Befund (Vorflug, QA oder Brevo) steht als ❌-Zeile
              # im Log – sie wandert in die Annotation, damit die Ursache in der
              # Actions-Übersicht lesbar ist, bevor jemand Logs aufklappt.
              BEFUND=$(grep "❌" /tmp/nl_build.log | tail -1 | sed 's/^[[:space:]]*//' | cut -c1-350)
              # Ehrlichkeit nach dem Versand: meldet das Skript VERSAND ERFOLGT,
              # ist die Mail raus und nur der Status unvollständig – meldet die
              # Annotation genau das, nie das Gegenteil (Fix 23.09.2026). Die
              # dritte Wahrheit heißt UNKLAR: Antwort verloren, Sendung möglicherweise
              # trotzdem angenommen. Sie als „nichts versandt“ zu melden, wäre die
              # gefährlichste Lüge dieses Laufs – sie lädt zum sofortigen erneuten
              # Run ein, und der trifft die Liste ein zweites Mal.
              if grep -q "VERSAND-STATUS UNKLAR" /tmp/nl_build.log; then
                echo "::error::Digest-Lauf fehlgeschlagen (Exit $rc) – UNKLAR, ob die Mail raus ist. Der Versand wurde NICHT wiederholt; der Lauf hat in data/newsletter_state.json einen Halt hinterlegt, der weitere Listen-Versände blockiert, bis im Brevo-Konto nachgesehen ist. ${BEFUND:-Details im Lauf-Log.}"
              elif grep -q "VERSAND ERFOLGT" /tmp/nl_build.log; then
                echo "::error::Digest-Lauf fehlgeschlagen (Exit $rc) – der VERSAND IST RAUS, der Status ist unvollständig. ${BEFUND:-Details im Lauf-Log.}"
              else
                echo "::error::Digest-Versand fehlgeschlagen (Exit $rc) – es ist nichts versandt. ${BEFUND:-Details im Lauf-Log.}"
              fi
              exit "$rc"
            fi
          fi
          # Nur bei manuellem Lauf laut melden – ein leeres Werktag-Cron ist
          # normal (keine neuen Artikel), kein Warnfall.
          if [ -n "$SENDEN" ] && [ "${{ github.event_name }}" != "schedule" ] && grep -q "nichts zu senden" /tmp/nl_build.log; then
            echo "::warning::Versand angefordert, aber der Digest ist leer – alles im Zeitraum ist Draft oder bereits versandt. Zeitraum über „tage“ vergrößern oder Artikel veröffentlichen."
          fi
          {
            echo ""
            echo "**Versandlauf:**"
            echo '```'
            sed -n '1,24p' /tmp/nl_build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Versandstatus protokollieren (data/newsletter_state.json)
        # `always()`, nicht „nur bei Erfolg“: der Status ist der Duplikatsschutz.
        # Genau in den Läufen, die scheitern (QA-Befund nach dem Versand,
        # Kantenblock beim Nachlesen, Halt wegen unklaren Ergebnisses), muss die
        # Datei in main landen – sonst weiß der nächste Lauf nichts von der
        # vorigen Ausgabe und liefert sie nochmal aus. Ein fehlender Versand
        # ändert nichts an der Datei, der Schritt bleibt dann leer.
        if: ${{ always() && !cancelled() }}
        run: |
          git config user.name "Newsletter-Bot"
          git config user.email "newsletter-bot@users.noreply.github.com"
          git add data/newsletter_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine Versandänderung – nichts zu committen."
          else
            git commit -m "newsletter: Versandstatus des Laufs festschreiben"
            scripts/git_sync.sh --push-only || echo "::warning::Push des Versandstatus fehlgeschlagen – Digest bleibt trotzdem korrekt"
          fi
