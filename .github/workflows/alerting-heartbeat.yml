# ============================================================
#  ALERTING-HERZSCHLAG – die Zustellung des Fehler-Alertings
#  wird nachgezählt, jeden Tag.
#
#  WARUM (18.09.2026, Befund E des Qualitäts-Gate-Vorfalls):
#  `alert-on-failure.yml` ist nachweislich KORREKT konfiguriert
#  (39 Namen byteweise identisch, types: [completed], Alarm bei
#  failure), trotzdem kamen 08.–18.09. nur 602 Alerting-Läufe auf
#  922 abgeschlossene Läufe gelisteter Workflows – rund 35 % der
#  `workflow_run`-Ereignisse gingen nie zu (14 rote Gate-Läufe:
#  0 Meldungen; Deploy: 13 rote Läufe ohne Meldung; Lesehilfen:
#  9). Nachweis und Messmethodik: docs/INCIDENT-2026-09-18-
#  qualitaets-gate-zeitbombe.md, Befund E.
#
#  DIESES WORKFLOW läuft deshalb per CRON, niemals per
#  `workflow_run`: Das wäre der Kanal, der verliert – ein Wächter,
#  der über die gestörte Leitung alarmiert werden will, schweigt
#  genau dann, wenn er gebraucht wird. Er meldet sich selbst wie
#  das Qualitäts-Gate (Issue öffnen/aktualisieren bei Befund,
#  schließen bei Grün, Label auto-report). Der Titel kommt aus
#  `scripts/alerting_heartbeat.py` (ISSUE_TITEL), nicht aus einer
#  YAML-Kopie – abgetippte Listen sind die Fehlerklasse, die
#  dieses Repo am 18.09.2026 zweimal gebissen hat.
#
#  Die Zählung selbst (Fenster 26 h, Gnadenfrist 90 min, Rot-
#  sofort-Befund) liegt mit Selbsttest im Skript; der Vertrag
#  verlangt ihn (governance_contract.GUARDS), und das
#  Qualitäts-Gate führt den Selbsttest über den Runner mit.
#
#  Dieser Workflow steht BEWUSST NICHT in der Wacht-Liste von
#  alert-on-failure.yml (Selbst-Beobachtung über den beobachteten
#  Kanal ist keine). Sein Befund ist im Issue und am roten Lauf
#  sichtbar.
# ============================================================
name: Alerting-Herzschlag (workflow_run-Zustellung)

on:
  schedule:
    # AUDIT 30.09. (Kollision entzerrt): war 04:50 UTC – exakt die Minute
    # des Hemingway-Lesbarkeitschecks (Mo/Mi/Fr). 04:47 ändert am 26-h-Fenster nichts.
    - cron: "47 4 * * *"   # täglich 04:47 UTC – nach dem nächtlichen Gate,
                           # vor dem Morgen; Fenster deckt 26 h rückwärts ab
  workflow_dispatch: {}

permissions:
  actions: read    # die Läufe der beobachteten Workflows zählen (gleiches Recht wie alert-on-failure.yml)
  issues: write    # Eigenmeldung (Label auto-report)

concurrency:
  group: alerting-heartbeat
  cancel-in-progress: false

jobs:
  herzschlag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        # v4 – unveränderlich gepinnt (der Wächter selbst darf keine bewegliche Abhängigkeit haben)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python-Abhängigkeit (PyYAML für die Wacht-Liste, Fallback im Skript)
        run: python3 -m pip install -q --break-system-packages --require-hashes -r "$GITHUB_WORKSPACE/requirements-ci.txt" 2>/dev/null || python3 -m pip install -q --require-hashes -r "$GITHUB_WORKSPACE/requirements-ci.txt" 2>/dev/null || true

      # KANAL-PROBE (WF-829B / #922, 30.10.2026)
      # Am 29./30.10. war der Meldeweg selbst tot: eine doppelte `const`-
      # Deklaration im github-script-Block von alert-on-failure.yml. JEDER
      # Lauf des Fehler-Alertings starb daran – und mit ihm jede Meldung.
      # Der Lauf „Skript-Syntax" sah den Befund und wurde rot; gemeldet hat
      # ihn niemand, weil der Melder genau dieser tote Kanal war.
      #   Ein Wächter, der über die gestörte Leitung alarmiert, schweigt
      #   genau dann, wenn er gebraucht wird.
      # Diese Probe läuft VOR der Zählung und über einen Kanal, der den
      # beobachteten nicht benutzt (cron, eigene Meldung). Fällt sie rot,
      # bleibt die Zählung aus: Eine Zustellquote für einen Meldeweg, der
      # gar nicht laufen kann, wäre eine Zahl ohne Bedeutung.
      - name: Kanal-Integrität – kann das Fehler-Alerting selbst laufen?
        id: kanal
        run: |
          set -uo pipefail
          code=0
          python3 scripts/alerting_heartbeat.py --kanal --md || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "kanal-code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Selbsttest der Herzschlag-Logik (vorm Messen)
        run: python3 scripts/alerting_heartbeat.py --selftest

      - name: Herzschlag messen (Zustellung der letzten 26 h nachzählen)
        id: messung
        # Nur zählen, wenn der Meldeweg überhaupt laufen kann – sonst wäre
        # „0 Zustellungen" eine Messung an einer Leiche.
        if: steps.kanal.outputs.kanal-code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 scripts/alerting_heartbeat.py --md | tee herzschlag.log

      # ------------------------------------------------------------
      #  EIGENMELDUNG (cron, nicht workflow_run – s. Kopf):
      #  Befund -> Issue öffnen oder aktualisieren (Dedupe über Titel),
      #  grün -> offene Meldung schließen. Gleiches bewährtes Muster
      #  wie die Selbstmeldung des Qualitäts-Gates (18.09.2026).
      # ------------------------------------------------------------
      - name: Toten Meldeweg melden (eigenes Issue, ohne das Fehler-Alerting)
        if: ${{ steps.kanal.outputs.kanal-code != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITEL="$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import alerting_heartbeat as ah; print(ah.ISSUE_TITEL_KANAL)')"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BEFUND="$(python3 scripts/alerting_heartbeat.py --kanal 2>&1 | grep -E '^\s*-|🔴|🛑' || true)"

          BODY=$(cat <<EOF
          ## ${TITEL}

          **Run:** [${GITHUB_RUN_ID}](${RUN_URL}) · **Commit:** \`${GITHUB_SHA:0:8}\`

          Das Fehler-Alerting (**Fehler-Alerting**) kann keinen einzigen Lauf
          mehr ausführen: Ein \`github-script\`-Block in
          \`.github/workflows/alert-on-failure.yml\` kompiliert nicht. Der
          Runner führt den Block als Funktion aus – ein Syntaxfehler tötet
          jeden Lauf, also auch jede Meldung. **Genau diese Meldung kann
          deshalb nicht über das Fehler-Alerting kommen**; sie kommt vom
          Herzschlag, der per \`cron\` läuft und den beobachteten Kanal
          absichtlich nicht benutzt.

          ${BEFUND:-Details im Run-Log.}

          **Heilung:** die betroffene Workflow-Datei in EINER Fassung setzen
          (typisch ist ein Zusammenschnitt beim Zusammenführen: doppelte
          \`const\`-Zeile, zwei Zeichenketten ohne Komma). Lokal:
          \`python3 scripts/workflow_js_wache.py --check\`.
          Hintergrund: \`WARTUNG-VEROEFFENTLICHUNG-WF-829B-922-DAUERHEILUNG-HIGHEND-2026-10-30.md\`.
          EOF
          )

          gh label create auto-report --repo "$GITHUB_REPOSITORY" \
            --color "d73a4a" --description "Automatisch erkannte Fehlermeldung" --force || true

          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label auto-report \
            --json number,title \
            | jq -r --arg t "$TITEL" '.[] | select(.title == $t) | .number' | head -n 1)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --body "Erneuter Befund bei [Run ${GITHUB_RUN_ID}](${RUN_URL})."$'\n\n'"${BEFUND:-Details im Run-Log.}"
            echo "→ Bestehendes Issue #${EXISTING} aktualisiert."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITEL" --label auto-report --body "$BODY"
            echo "→ Neues Issue erstellt."
          fi

      - name: Kanal-Meldung schließen (Meldeweg läuft wieder)
        if: ${{ steps.kanal.outputs.kanal-code == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITEL="$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import alerting_heartbeat as ah; print(ah.ISSUE_TITEL_KANAL)')"
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label auto-report \
            --json number,title \
            | jq -r --arg t "$TITEL" '.[] | select(.title == $t) | .number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
              --comment "✅ Behoben: alle \`github-script\`-Blöcke des Fehler-Alertings kompilieren wieder ([Run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))."
            echo "→ Issue #$n geschlossen ($TITEL)."
          done

      - name: Störung melden (Issue öffnen oder aktualisieren)
        if: ${{ steps.messung.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITEL="$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import alerting_heartbeat as ah; print(ah.ISSUE_TITEL)')"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BEFUNDE="$(grep -E '^  ❌' herzschlag.log 2>/dev/null | sed 's/^  ❌ /- /' || true)"
          TABELLE="$(sed -n '/^### /,/^---$/p' herzschlag.log 2>/dev/null | head -n 60 || true)"

          BODY=$(cat <<EOF
          ## ${TITEL}

          **Run:** [${GITHUB_RUN_ID}](${RUN_URL}) · **Commit:** \`${GITHUB_SHA:0:8}\`

          ${BEFUNDE:-Details im Run-Log.}

          <details><summary>Zählung des Laufs (Fenster, Quoten, rote Läufe)</summary>

          ${TABELLE}

          </details>

          Hintergrund und Messmethodik: \`docs/INCIDENT-2026-09-18-qualitaets-gate-zeitbombe.md\`
          (Befund E: ~35 % der \`workflow_run\`-Ereignisse kamen 08.–18.09.2026 nie an).
          Diese Meldung wird automatisch geschlossen, sobald die Zählung wieder
          vollständig ist, und nach der Aufräum-Frist dauerhaft gelöscht.
          EOF
          )

          gh label create auto-report --repo "$GITHUB_REPOSITORY" \
            --color "d73a4a" --description "Automatisch erkannte Fehlermeldung" --force || true

          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label auto-report \
            --json number,title \
            | jq -r --arg t "$TITEL" '.[] | select(.title == $t) | .number' | head -n 1)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --body "Erneuter Befund bei [Run ${GITHUB_RUN_ID}](${RUN_URL})."$'\n\n'"${BEFUNDE:-Details im Run-Log.}"
            echo "→ Bestehendes Issue #${EXISTING} aktualisiert."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITEL" --label auto-report --body "$BODY"
            echo "→ Neues Issue erstellt."
          fi

      - name: Meldung schließen (Zustellung wieder vollständig)
        # WF-829B/#922: Nicht `success()`. Ist der Kanal tot, bleibt die
        # Zählung aus – der Job wäre trotzdem „erfolgreich“ und würde eine
        # offene Zustellungs-Meldung schließen, die niemand nachgemessen
        # hat. Schließen darf nur, wer gemessen hat.
        if: ${{ steps.kanal.outputs.kanal-code == '0' && steps.messung.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITEL="$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import alerting_heartbeat as ah; print(ah.ISSUE_TITEL)')"
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label auto-report \
            --json number,title \
            | jq -r --arg t "$TITEL" '.[] | select(.title == $t) | .number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
              --comment "✅ Behoben: die Zustellung ist im Fenster wieder vollständig ([Run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})). Diese Meldung wird nach der Aufräum-Frist dauerhaft gelöscht."
            echo "→ Issue #$n geschlossen ($TITEL)."
          done
