# ============================================================
#  WÖCHENTLICHES EINZIGARTIGKEITS-AUDIT (automatisch)
#
#  Läuft jeden Montag um 07:00 Uhr (DE) und prüft alle Artikel:
#    - gegen die Pinterest-Pin-Texte
#    - untereinander (interne Duplikate)
#
#  Bei kritischen Duplikaten wird automatisch ein GitHub-Issue
#  erstellt → du siehst es auf einen Blick in deinem Repo.
#
#  Manuell starten: GitHub → Actions → "Wöchentliches Audit"
#  → "Run workflow".
# ============================================================
name: Wöchentliches Einzigartigkeits-Audit

on:
  schedule:
    - cron: "0 5 * * 1"    # Montag 07:00 Uhr MESZ (05:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Audit ausführen (Log wird gespeichert)
        id: audit
        continue-on-error: true   # Wir fangen den Exit-Code selbst ab
        run: |
          python3 scripts/check_uniqueness.py | tee /tmp/audit_log.txt
          exit ${PIPESTATUS[0]}

      - name: Issue erstellen, wenn kritische Duplikate gefunden wurden
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let details = 'Kritische Duplikate gefunden. Bitte die betroffenen Artikel überarbeiten (siehe Workflow-Log).';
            try {
              details = fs.readFileSync('/tmp/audit_log.txt', 'utf-8');
            } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Einzigartigkeits-Audit: Kritische Duplikate gefunden',
              body: '```\n' + details + '\n```\n\n---\nAutomatisch erstellt vom wöchentlichen Audit-Workflow.'
            });
            console.log('✅ Issue erstellt');
