# ============================================================
#  WÖCHENTLICHES EINZIGARTIGKEITS-AUDIT (automatisch)
#
#  Läuft jeden Montag um 07:00 Uhr (DE) und prüft alle Artikel:
#    - gegen die Pinterest-Pin-Texte
#    - untereinander (interne Duplikate)
#
#  Bei kritischen Duplikaten wird automatisch ein GitHub-Issue
#  erstellt → du siehst es auf einen Blick in deinem Repo.
#
#  Manuell starten: GitHub → Actions → "Wöchentliches Audit"
#  → "Run workflow".
# ============================================================
name: Wöchentliches Einzigartigkeits-Audit

on:
  schedule:
    - cron: "0 5 * * 1"    # Montag 07:00 Uhr MESZ (05:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: write   # AUDIT 2026-08-10: Backlog-Heilung schreibt
  issues: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      # ---- Audit-Erweiterung 11.08.: Workspace-Hygiene mit Selbstheilung ----
      - name: Workspace-Guard (Junk/Waisen/Rotation — auto-heilen)
        run: python3 scripts/workspace_guard.py --fix
          python3 scripts/affiliate_marketer.py --fix 2>/dev/null || echo '⚠ Marketer-Check (nicht kritisch)'

      # ---- Audit-Erweiterung (2026-08-10): Laengen-Backlog heilen (3/Woche) ----
      - name: Laengen-Backlog heilen (Length-Guard, 3 Artikel pro Woche)
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/brand_guard.py --fix || echo "⚠ Brand-Lock verletzt & geheilt"
          python3 scripts/length_guard.py --fix --ai --backlog 3 --scope pillar
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Artikel zu heilen – Bestand im Korridor."
          else
            git commit -m "content: Laengen-Heilung Backlog (KI, verifiziert) + LENGTH-REPORT"
            git pull --rebase --autostash origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            git push || { sleep 20; git pull --rebase origin main && git push; }
          fi

      # ---- Audit-Erweiterung 11.08. (Abend): Verlags-Lektorat L1-L12, woechentl. Archiv-Sichtung ----
      - name: Lektor-Guard (Archiv-Gesamtsichtung, selbstheilend, Selbsttest-Gate)
        continue-on-error: true
        run: |
          python3 scripts/lektor_guard.py --fix || echo "⚠ Lektorat Archiv (nicht kritisch)"
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Lektorat: Bestand sauber."
          else
            git commit -m "content: Verlags-Lektorat Archiv-Sichtung (Auto-Regeln L1/L2/L4/L10/L11)"
            git pull --rebase --autostash origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            git push || { sleep 20; git pull --rebase origin main && git push; }
          fi

      # ---- Audit-Erweiterung 11.08. (spaet): Link-Integritaet mit Selbstheilung ----
      - name: Link-Guard (interne Linkziele pruefen + heilen, Selbsttest-Gate)
        continue-on-error: true
        run: |
          python3 scripts/link_guard.py --fix || echo "⚠ Link-Guard (nicht kritisch)"
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Links sauber."
          else
            git commit -m "fix: kaputte interne Links geheilt (Truncation/Sektion)"
            git pull --rebase --autostash origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            git push || { sleep 20; git pull --rebase origin main && git push; }
          fi

      # ---- Wiederlebt 11.08. spaet (Inter-Aera): Font-Vertrag beweisen ----
      - name: Font-Guard (woff2/ttf-Inhalt pruefen + selbstheilend zurueckbauen)
        continue-on-error: true
        run: |
          python3 -m pip install -q fonttools brotli 2>/dev/null || true
          python3 scripts/font_guard.py --fix || echo "⚠ Font-Guard (nicht kritisch)"
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add static/fonts/ FONT-REPORT.md data/font_history.jsonl
          if git diff --cached --quiet; then echo "Fonts sauber."
          else
            git commit -m "fix(fonts): Vertragsbruch geheilt (font_guard)"
            git pull --rebase --autostash origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            git push || { sleep 20; git pull --rebase origin main && git push; }
          fi

      - name: Tabellen-Wache (Bestand – Struktur/Splitter, selbstheilend)
        continue-on-error: true
        run: |
          python3 scripts/table_guard.py --fix || echo "⚠ Tabellen (nicht kritisch)"
          git add -A 2>/dev/null || true
          git diff --cached --quiet || { git config user.name "Content-Bot"; git config user.email "content-bot@users.noreply.github.com"; git commit -m "fix(tabellen): Zell-Splitter geheilt (table_guard)"; git pull --rebase --autostash origin main 2>/dev/null || git rebase --abort 2>/dev/null || true; git push || { sleep 20; git pull --rebase origin main && git push; }; }

      - name: Redaktionelle Endabnahme des Wochenbestands (Gates G1-G5, Zertifikat)
        continue-on-error: true
        run: |
          python3 scripts/redaktion_final.py || echo "⚠ Endabnahme meldet Funde (nicht kritisch)"

      - name: Audit ausführen (Log wird gespeichert)
        id: audit
        continue-on-error: true   # Wir fangen den Exit-Code selbst ab
        run: |
          python3 scripts/check_uniqueness.py | tee /tmp/audit_log.txt
          exit ${PIPESTATUS[0]}

      - name: Issue erstellen, wenn kritische Duplikate gefunden wurden
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let details = 'Kritische Duplikate gefunden. Bitte die betroffenen Artikel überarbeiten (siehe Workflow-Log).';
            try {
              details = fs.readFileSync('/tmp/audit_log.txt', 'utf-8');
            } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Einzigartigkeits-Audit: Kritische Duplikate gefunden',
              body: '```\n' + details + '\n```\n\n---\nAutomatisch erstellt vom wöchentlichen Audit-Workflow.'
            });
            console.log('✅ Issue erstellt');
