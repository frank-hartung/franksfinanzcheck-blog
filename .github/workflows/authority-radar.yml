name: Externe Autorität & Distribution

on:
  schedule:
    - cron: "17 7 5 * *" # monatlich am 5.; genug Zeit für Monatsimporte
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: authority-radar
  cancel-in-progress: false

jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: python3 -m pip install -q pyyaml
      - name: Vertrag und Selbsttest
        run: |
          python3 scripts/authority_engine.py --selftest
          python3 -m unittest scripts.tests.test_authority_engine
      - name: Authority-Radar erzeugen
        id: radar
        run: |
          set +e
          python3 scripts/authority_engine.py --check
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -gt 1 ]; then exit "$code"; fi
      - name: Radar committen
        run: |
          if git status --porcelain AUTHORITY-RADAR.md | grep -q .; then
            git config user.name "Authority-Radar-Bot"
            git config user.email "authority-radar-bot@users.noreply.github.com"
            git add AUTHORITY-RADAR.md
            git commit -m "authority: Monatsradar aktualisiert"
            scripts/git_sync.sh --push-only
          fi
      - name: Handlungsbedarf als einzelnes Issue melden
        if: steps.radar.outputs.exit == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create externe-autoritaet --color "1b665c" --description "Earned Media, Linkable Assets und Distribution" --force || true
          if ! gh issue list --state open --label externe-autoritaet --json number --jq 'length' | grep -q '^[1-9]'; then
            gh issue create --title "Authority-Radar: Distribution und Nachweise prüfen ($(date +%F))" --label externe-autoritaet --body-file AUTHORITY-RADAR.md
          else
            echo "Offenes Authority-Issue vorhanden – kein Duplikat."
          fi
