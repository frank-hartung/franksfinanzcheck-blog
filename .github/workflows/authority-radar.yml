name: Externe Autorität & Distribution

on:
  schedule:
    - cron: "17 7 5 * *" # monatlich am 5.; genug Zeit für Monatsimporte
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: authority-radar
  cancel-in-progress: false

jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7.0.1
      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: python3 -m pip install -q pyyaml
      - name: Vertrag und Selbsttest
        run: |
          python3 scripts/authority_engine.py --selftest
          python3 -m unittest scripts.tests.test_authority_engine
      - name: Authority-Radar erzeugen
        id: radar
        run: |
          set +e
          python3 scripts/authority_engine.py --check
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -gt 1 ]; then exit "$code"; fi
      - name: Radar committen
        run: |
          if git status --porcelain AUTHORITY-RADAR.md | grep -q .; then
            git config user.name "Authority-Radar-Bot"
            git config user.email "authority-radar-bot@users.noreply.github.com"
            git add AUTHORITY-RADAR.md
            git commit -m "authority: Monatsradar aktualisiert"
            scripts/git_sync.sh --push-only
          fi
      - name: Authority-Issue idempotent abgleichen
        env:
          GH_TOKEN: ${{ github.token }}
          RADAR_EXIT: ${{ steps.radar.outputs.exit }}
        run: |
          set -euo pipefail
          label="externe-autoritaet"
          title="Authority-Radar: Distribution und Nachweise prüfen ($(date -u +%F))"
          gh label create "$label" --color "1b665c" --description "Earned Media, Linkable Assets und Distribution" --force

          # Genau ein Radar-Ticket: ältere Duplikate werden geschlossen, das jüngste
          # Ticket wird bei jedem Lauf aktualisiert statt mit einem veralteten Body stehen zu bleiben.
          mapfile -t issues < <(gh issue list --state open --label "$label" --limit 100 --json number --jq 'sort_by(.number) | reverse | .[].number')
          keeper="${issues[0]:-}"
          for duplicate in "${issues[@]:1}"; do
            gh issue close "$duplicate" --comment "Automatisch geschlossen: Das laufende Authority-Radar wird in #${keeper} konsolidiert."
          done

          if [[ "$RADAR_EXIT" == "1" ]]; then
            if [[ -n "$keeper" ]]; then
              gh issue edit "$keeper" --title "$title" --body-file AUTHORITY-RADAR.md
              gh issue comment "$keeper" --body "Radar am $(date -u +%F) neu geprüft und vollständig synchronisiert."
            else
              gh issue create --title "$title" --label "$label" --body-file AUTHORITY-RADAR.md
            fi
          elif [[ -n "$keeper" ]]; then
            gh issue close "$keeper" --comment "Automatisch erledigt: Der aktuelle Authority-Radar enthält keinen Handlungsbedarf mehr."
          fi
