# ============================================================
#  RELEASE-SCORECARD – die tägliche Produktionswahrheit
#  (Auftrag Frank, 03.10.2026, Befund 10: „Der Produktions-
#   prozess ist sehr komplex“ – „Ich würde daraus eine einzige
#   sichtbare Release-Scorecard machen.“)
#
#  WARUM DIESE WACHE
#  -----------------
#  Das Repository besitzt viele Gates, Reports und Automationen.
#  Stark – aber ohne EINEN Wahrheitsort kann niemand auf einen
#  Blick sagen: Welche Checks blockieren? Welche warnen nur?
#  Wer entscheidet? Und war die veröffentlichte Version wirklich
#  die geprüfte? Diese Wache hält die Antwort aktuell:
#
#    * Baut die Site (Render-Beweise brauchen public/ – ein
#      Bericht über einen Tag alten Build wäre ein Mess-Artefakt,
#      genau die Klasse, die die alte Editorial-Scorecard hatte).
#    * Misst den KOMPLETTEN Live-Bestand über die Publish-Gate-
#      Collectoren (keine zweite Messregel) und schreibt
#      RELEASE-SCORECARD.md (Mensch), data/release_scorecard_state.json
#      (Siegel) und data/release_scorecard_history.jsonl (Verlauf).
#    * Exit-Vertrag: 0 = Bestand freigabe-reif · 1 = blockierende
#      Funde · 2 = Werkzeugfehler (fail-closed).
#    * Issue-Politik (C4): Ein roter Bestand öffnet GENAU EIN
#      Ticket (Suche über Wache-ID, update statt duplizieren),
#      Grün schließt es. Kein Dauer-Alarm ohne Schließpfad (C14):
#      Blockierende Bestandsfunde gehören den fachlich
#      zuständigen Wachen (Eigentümer steht je Check in der SSOT),
#      dieses Ticket ist nur der sichtbare Wahrheitsort.
#
#  Der DEPLOY läuft die selbe Engine hart vor jeder Auslieferung
#  (deploy.yml, „Release-Scorecard (Produktionswahrheit
#  versiegeln, fail-closed)“) – hier geht es um die tägliche
#  Bestands-Sicht und die Historie.
#
#  Runbook: docs/ANLEITUNG-RELEASE-SCORECARD.md
# ============================================================
name: Release-Scorecard (Produktionswahrheit)

on:
  schedule:
    - cron: "7 5 * * *"    # 05:07 UTC (07:07 MESZ / 06:07 MEZ) – nach den Nacht-Gates
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: release-scorecard
  cancel-in-progress: false

env:
  LABEL: release-scorecard
  REPORT: RELEASE-SCORECARD.md
  STATE: data/release_scorecard_state.json

jobs:
  scorecard:
    name: Live-Bestand messen, versiegeln, melden
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Laufbeginn festhalten (Stale-State-Schutz)
        id: laufbeginn
        run: echo "zeit=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Hugo installieren (Extended, verifiziert, mehrquellig)
        uses: ./.github/actions/install-hugo
        with:
          version: "0.168.0"

      - name: Py-Abhängigkeiten
        run: python3 -m pip install -q --require-hashes -r "$GITHUB_WORKSPACE/requirements-ci.txt" 2>/dev/null || python3 -m pip install -q --break-system-packages --require-hashes -r "$GITHUB_WORKSPACE/requirements-ci.txt"

      # Selbsttest zuerst (C6/C15): Eine sabotierte Engine darf keine
      # Wahrheit schreiben – fail-closed, kein || true.
      - name: Scorecard-Selbsttest
        run: python3 scripts/release_scorecard.py --selftest

      - name: Bestands-Selbstheilung – Vertrag und Regression (#1098)
        run: |
          python3 scripts/release_bestand_heiler.py --selftest
          python3 -m unittest scripts.tests.test_release_bestand_heiler

      # SCHLIESSAKTE STRUKTURELL HEILEN (08.11.2026, #1098-Nachlauf)
      # -----------------------------------------------------------
      # Ein Writer-Fehler hängte Folgeentscheidungen IN fremde
      # Listeneinträge. YAML nimmt dann still den letzten Wert: Der Eintrag
      # trug eine `geprueft_fassung` und einen `vorgaenger_geprueft_fassung`
      # aus zwei VERSCHIEDENEN Ketten, und die Scorecard fiel als
      # Werkzeugfehler aus („Vorgänger fehlt oder stimmt nicht") – obwohl
      # jede Entscheidung belegt war. Der Heiler trennt die Blöcke, ergänzt
      # nur die beim Anfügen verlorenen Felder (Slug, Befund-ID, Bindung),
      # weist Unzuordenbares aus und rollt bei jedem Zweifel die
      # Original-Bytes zurück. Danach gilt fail-closed: Ein doppelter
      # Schlüssel ist rot, nicht „nichts gesehen".
      - name: Schließakte strukturell heilen (Selbstheilung, fail-closed)
        id: schliessakte
        run: |
          set -Eeuo pipefail
          python3 scripts/faktenfrische_befund_ledger.py --selftest
          python3 scripts/faktenfrische_befund_ledger.py --reparieren --apply \
            | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/faktenfrische_befund_ledger.py --struktur-pruefen \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Render-Beweise (Affiliate-Integrität, Offenlegung, SEO-Audit,
      # Seiten-Existenz) brauchen den Build. Ohne ihn wäre die Scorecard
      # ehrlich „nicht beweisbar“ – wir bauen also lieber.
      - name: Site bauen (Beweisbasis public/)
        uses: ./.github/actions/hugo-build
        with:
          args: "--minify --destination public"
          label: "Scorecard-Beweisbasis"

      # #1098: Heilung ist ein eigener SCHREIBSCHRITT vor der Messung.
      # Die Scorecard bleibt Beweislauf (C15). Erst deterministische Heiler,
      # dann neuer Build, dann dieselbe harte Scorecard. Ein Versuch wird
      # nur bestätigt, wenn kein neuer Blocker entsteht und ein Ziel-Check
      # verschwindet; sonst stellt der Bestätiger die Original-Bytes wieder
      # her. F4/YMYL/Freigaben bleiben ausdrücklich unberührt.
      - name: Bestands-Selbstheilung versuchen (begrenzt, mit Rollback)
        id: heilung
        run: python3 scripts/release_bestand_heiler.py --apply

      - name: Geheilte Beweisbasis neu bauen
        if: steps.heilung.outputs.geaendert == 'true'
        uses: ./.github/actions/hugo-build
        with:
          args: "--minify --destination public --cleanDestinationDir"
          label: "Scorecard nach Bestands-Selbstheilung"

      # Messung: --streng macht Bestands-Rot zum Exit 1 (Issue-Entscheidung).
      # Werkzeugfehler bleiben Exit 2 (fail-closed). Weiterlaufen mit
      # continue-on-error, damit Report, Siegel und Ticket IMMER geschrieben
      # werden – ein stiller Abbruch wäre das Gegenteil von Wahrheit.
      - name: Release-Scorecard über den Live-Bestand
        id: scorecard
        continue-on-error: true
        run: python3 scripts/release_scorecard.py --live --streng --commit-sha "$(git rev-parse HEAD)"

      - name: Heilung gegen die vollständige Nachmessung bestätigen
        id: bestaetigung
        if: always() && steps.heilung.outputs.geaendert == 'true'
        continue-on-error: true
        run: python3 scripts/release_bestand_heiler.py --bestaetigen

      - name: Bei Abbruch oder verworfener Messung Original wiederherstellen
        id: rollback
        # Auch ein harter Prozessabbruch vor dem GitHub-Output muss den
        # Cleanup erreichen. Das Journal ist die Wahrheit, nicht der Output.
        if: always() && steps.heilung.outcome != 'skipped'
        run: |
          STATUS="$(python3 scripts/release_bestand_heiler.py --journal-status)"
          if [ "$STATUS" = "schreiben" ] || [ "$STATUS" = "geschrieben" ]; then
            python3 scripts/release_bestand_heiler.py --zurueckrollen
            if ! git diff --quiet -- content/posts; then
              echo "::error::Original-Wiederherstellung nicht vollständig – kein Content-Commit."
              exit 1
            fi
            echo "zurueckgerollt=true" >> "$GITHUB_OUTPUT"
          else
            # Bestätigte Heilung ist kein Cleanup-Fall. Ihr Diff ist der
            # bewiesene Nutzdeltasatz und darf nicht als Fehler gelten.
            echo "zurueckgerollt=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Zurückgerollten Bestand erneut beweisen
        if: always() && (steps.bestaetigung.outputs.zurueckgerollt == 'true' || steps.rollback.outputs.zurueckgerollt == 'true')
        uses: ./.github/actions/hugo-build
        with:
          args: "--minify --destination public --cleanDestinationDir"
          label: "Scorecard nach Rollback"

      - name: Scorecard nach Rollback erneut messen
        id: scorecard_rollback
        if: always() && (steps.bestaetigung.outputs.zurueckgerollt == 'true' || steps.rollback.outputs.zurueckgerollt == 'true')
        continue-on-error: true
        run: python3 scripts/release_scorecard.py --live --streng --commit-sha "$(git rev-parse HEAD)"

      # ------------------------------------------------------------ ---
      # Issue-Politik (C4): genau ein Ticket, update statt neu, Grün
      # schließt. Label vorher anlegen (C12, HTTP-422-Falle #209).
      # ----------------------------------------------------------------
      - name: Scorecard-Ticket pflegen (ein Ticket, mit Schließpfad)
        id: ticket
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # Ein gescheiterter Heilungs-/Bestätigungs-/Cleanup-Schritt ist
          # niemals ein grüner Inhaltsbefund – auch nicht, wenn eine frühere
          # Messung zufällig success war. 'skipped' erzeugt im Ticket-Generator
          # ausdrücklich „Messung nicht beweisbar“ statt Stale-State-Rot.
          ERGEBNIS: ${{ (steps.heilung.outcome != 'success' || steps.bestaetigung.outcome == 'failure' || steps.rollback.outcome == 'failure') && 'skipped' || ((steps.bestaetigung.outputs.zurueckgerollt == 'true' || steps.rollback.outputs.zurueckgerollt == 'true') && steps.scorecard_rollback.outcome || steps.scorecard.outcome) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASIS_COMMIT: ${{ github.sha }}
          LAUFBEGINN: ${{ steps.laufbeginn.outputs.zeit }}
        run: |
          set -euo pipefail
          gh label create "$LABEL" --color "b60205" \
            --description "Release-Scorecard: Produktionswahrheit rot (Befund 10)" --force 2>/dev/null || true
          FID="wache-id: release-scorecard"
          NUM="$(FID="$FID" gh issue list --label "$LABEL" --state open --json number,body \
                 --jq '[.[] | select(.body // "" | contains(env.FID)) | .number] | first // ""')"

          # Der Ticket-Text ist eine reine Funktion des Siegels
          # (scripts/scorecard_ticket.py). Bis 03.11.2026 stand hier ein
          # Heredoc, der bei jedem faktenalter-Fund „Kadenz, kein
          # Inhaltsbefund“ behauptete – am 02.11. war F1 grün und F4 die
          # Ursache. Ein Ticket, das die Messung falsch deutet, ist kein
          # Schließpfad (#912). Der Marker bleibt im Skript (C4).
          BODY="$(python3 scripts/scorecard_ticket.py --state "$STATE" \
                    --ergebnis "$ERGEBNIS" --erwarteter-commit "$BASIS_COMMIT" \
                    --frisch-ab "$LAUFBEGINN")"
          URSACHE="$(python3 scripts/scorecard_ticket.py --state "$STATE" --ergebnis "$ERGEBNIS" --ursache)"

          if [ "$ERGEBNIS" = "success" ]; then
            if [ -n "$NUM" ]; then
              gh issue comment "$NUM" --body "**$(date -u '+%Y-%m-%d %H:%M') UTC** – Bestand wieder freigabe-reif.

          $BODY

          Lauf: $RUN_URL" >/dev/null
              gh issue close "$NUM" --comment "Geschlossen durch Release-Scorecard (Schließpfad C4)." >/dev/null
              echo "Ticket #$NUM kommentiert und geschlossen."
            else
              echo "Grün und kein offenes Ticket – nichts zu tun."
            fi
          else
            if [ -z "$NUM" ]; then
              gh issue create --title "Release-Scorecard: Produktionswahrheit rot (Bestand blockiert)" \
                --label "$LABEL" --body "$BODY

          Lauf: $RUN_URL" >/dev/null
              echo "Ticket erstellt."
            else
              # #1098: Der Ticket-Kopf ist die heutige Wahrheit, nicht die
              # vom Eröffnungstag. Ursache/Scope/Frist werden aktualisiert;
              # der Lauf bleibt als Kommentar nachvollziehbar.
              ALT="$(gh issue view "$NUM" --json body --jq '.body // ""')"
              gh issue edit "$NUM" --body "$BODY

          Lauf: $RUN_URL" >/dev/null
              # Chronischer Befund: Kopf immer frisch, Kommentar nur bei
              # Ursachenwechsel (C14: kein täglicher Kommentar-Lärm).
              if ! printf '%s' "$ALT" | grep -Fq "release-scorecard-ursache: $URSACHE"; then
                gh issue comment "$NUM" --body "**$(date -u '+%Y-%m-%d %H:%M') UTC** – Ursache/Prüfstand geändert; der Ticket-Kopf nennt die aktuelle Nachmessung.

          Lauf: $RUN_URL" >/dev/null
              fi
              echo "Ticket #$NUM aktualisiert."
            fi
          fi

      # ------------------------------------------------------------
      # Report, Siegel und Historie IMMER sichern – mit if: always(),
      # damit die Produktionswahrheit nicht einfrieren kann, genau
      # wie PRODUKTIONS-STATUS.md (gleiche Betriebsregel).
      # Alle drei Pfade sind deploy-irrelevant (STATE_ONLY im
      # Deploy-Gate) – dieser Commit löst keinen Folge-Deploy aus.
      # ------------------------------------------------------------
      - name: Scorecard-Artefakte committen (immer)
        id: commit
        if: always()
        continue-on-error: true
        env:
          BESTAETIGT: ${{ steps.bestaetigung.outcome }}
          HEILUNG: ${{ steps.heilung.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
        run: |
          set -Eeuo pipefail
          git config user.name "Release-Scorecard-Bot"
          git config user.email "release-scorecard-bot@users.noreply.github.com"
          git add -- "$REPORT" data/release_scorecard_state.json data/release_scorecard_history.jsonl
          # Die strukturelle Heilung der Schließakte (#1098) ist ein
          # Beweisstand, kein Inhalt: Sie wird mitcommittet, damit der nächste
          # Lauf nicht dieselbe Reparatur wiederholen muss.
          if ! git diff --quiet -- data/faktenfrische_entscheidungen.yaml; then
            git add -- data/faktenfrische_entscheidungen.yaml
          fi
          # Content nur nach bestätigter Nachmessung committen. Ein bloßer
          # Heilungsversuch oder Rollback darf keine Textänderung nach main bringen.
          if [ "${BESTAETIGT:-}" = "success" ] && [ "${HEILUNG:-}" = "success" ] && [ "${ROLLBACK:-}" != "failure" ]; then
            git add -- content/posts
          fi
          if [ -f RELEASE-BESTAND-HEILUNG.md ]; then
            git add -- RELEASE-BESTAND-HEILUNG.md data/release_bestand_heilung_state.json data/audit
          fi
          if git diff --cached --quiet; then
            echo "Scorecard unverändert."
            exit 0
          fi
          git commit -m "chore(scorecard): Release-Scorecard aktualisiert + Live-Bestand versiegelt [skip ci]"
          # Verlust einer bestätigten Heilung ist kein Warnfall. Der rote
          # Schritt löst den Fehlerkanal aus; Artefakte bleiben erhalten.
          scripts/git_sync.sh --push-only

      - name: Report als Artefakt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-scorecard-${{ github.run_number }}
          path: |
            RELEASE-SCORECARD.md
            data/release_scorecard_state.json
            RELEASE-BESTAND-HEILUNG.md
            data/release_bestand_heilung_state.json
          retention-days: 30

      # Roter Lauf = roter Job (nachdem Report und Ticket gesichert sind).
      - name: Lauf-Ergebnis durchreichen
        if: steps.scorecard.outcome == 'failure' || steps.scorecard_rollback.outcome == 'failure' || steps.heilung.outcome == 'failure' || steps.bestaetigung.outcome == 'failure' || steps.rollback.outcome == 'failure' || steps.ticket.outcome == 'failure' || steps.commit.outcome == 'failure'
        run: |
          echo "::error::Release-Scorecard rot – Details im Ticket, in RELEASE-SCORECARD.md und im Schritt-Log."
          exit 1
