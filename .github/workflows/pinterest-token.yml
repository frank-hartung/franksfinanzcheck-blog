# ============================================================
#  PINTEREST-TOKEN-WACHE – der Kanal erneuert sich selbst
#  ------------------------------------------------------------
#  WARUM (Governance-Report #206, 07.09.2026):
#  Pinterest-Access-Tokens sterben nach 30 Tagen. Der Betrieb hing an einem
#  von Hand eingefügten Secret – also stand der Kanal planmäßig jeden Monat
#  still: roter Governance-Befund (#206), fehlgeschlagene Läufe (#153, #209),
#  keine Pins, keine Performance-Daten. Kein Einzelfehler, ein fehlender
#  Lebenszyklus.
#
#  HÄRTUNG (#219, 08.09.2026) – warum die erste Neu-Autorisierung scheiterte:
#    a) Der Nachweis-Schritt rief `--verify-only` OHNE `--verify` auf → es gab
#       nie eine Live-Probe. Das Lagebild stand auf `unverified/amber` –
#       ein Zustand, der weder heilt noch schließt. Jetzt: `--verify`.
#    b) JEDER Prozess (auch der Deploy ohne Secrets) überschrieb
#       data/pinterest_token_state.json → Cockpit zeigte `absent/red`, obwohl
#       ein Secret existierte. Jetzt: nur live geprüfte Lagebilder schreiben
#       (Broker-Regel `_may_persist`), die Wache ist die einzige Instanz, die
#       auch „absent" festhalten darf.
#    c) Der Code-Tausch bekam den Code als Shell-Argument, brach bei Sonder-
#       zeichen, akzeptierte keine komplette URL und erklärte HTTP 400 nicht.
#       Jetzt: Code über Env, URL/`&state=` werden erkannt, Fehler → Anleitung.
#    d) Nach dem Tausch lief kein `--refresh` (Schritt war gekoppelt) und ein
#       Fehler im Tausch ließ den ganzen Lauf rot werden, ohne Issue-Update.
#       Jetzt: Tausch → Refresh → Nachweis → Commit → Issue, jeder Schritt
#       berichtet, keiner reißt den nächsten mit.
#    e) Scope `read_ads` existiert in v5 nicht; `user_accounts:read` fehlte,
#       obwohl die Live-Probe /v5/user_account genau den braucht.
#       Jetzt: korrekte v5-Scopes; Broker-Probe toleriert Alt-Tokens ohne
#       Profil-Scope (Gegenprobe /v5/boards).
#    f) Nur die Wache rotiert den Refresh-Token proaktiv
#       (PINTEREST_TOKEN_WACHE=1) – parallele Rotation durch andere Läufe
#       hätte den frisch autorisierten Speicher entwerten können.
#
#  WAS DIESER LAUF TUT (täglich 04:40 MESZ, vor allen Pinterest-Jobs):
#    1. Erneuert den Zugang über den Broker (scripts/pinterest_token.py):
#       verschlüsselter Speicher → Env-Refresh-Bootstrap → klassisches Secret.
#       Pinterest stellt bei jeder Erneuerung einen neuen 60-Tage-Refresh-Token
#       aus (continuous refresh) → läuft dieser Job täglich, läuft der Kanal
#       unbegrenzt.
#    2. Schreibt den rotierten Token AES-256-GCM-verschlüsselt ins Repo
#       (data/pinterest_tokens.enc – ohne PINTEREST_TOKEN_KEY unlesbar).
#    3. Führt den LIVE-Nachweis für die Secrets-Wache und schreibt das
#       Lagebild data/pinterest_token_state.json.
#    4. Meldet NUR, wenn ein Mensch wirklich gebraucht wird (einmalige
#       Neu-Autorisierung) – ein Issue, aktualisiert statt dupliziert,
#       automatisch geschlossen, sobald der Kanal wieder trägt.
#
#  EINMALIGE ERST-AUTORISIERUNG (5 Minuten, danach nie wieder):
#    Run workflow → `show_auth_url` → URL öffnen → Erlauben → Code von der
#    Landeseite kopieren → Run workflow → `auth_code` füllen. Runbook:
#    docs/PINTEREST-TOKEN-RUNBOOK.md
#
#  Benötigte Secrets: PINTEREST_APP_ID, PINTEREST_APP_SECRET,
#  PINTEREST_TOKEN_KEY (frei wählbare, lange Zeichenkette).
#  Optional: PINTEREST_REFRESH_TOKEN (Bootstrap ohne Browser-Handschlag),
#  PINTEREST_ACCESS_TOKEN (Notnagel/Altbestand).
# ============================================================
name: Pinterest-Token-Wache

on:
  schedule:
    - cron: "40 2 * * *"     # täglich 04:40 MESZ – vor Watchdog (06:30) und Governance
  workflow_dispatch:
    inputs:
      auth_code:
        description: "Autorisierungs-Code (oder die komplette Adresszeile nach dem Erlauben) – nur bei Erst-/Neu-Autorisierung"
        required: false
        default: ""
      show_auth_url:
        description: "Nur die Autorisierungs-URL ausgeben (nichts ändern)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: pinterest-token          # Refresh-Token rotiert: nie zwei Läufe parallel
  cancel-in-progress: false

env:
  TOKEN_LABEL: pinterest-token
  TOKEN_TITLE: "🔑 Pinterest-Zugang braucht eine einmalige Neu-Autorisierung"
  PINTEREST_TOKEN_WACHE: "1"      # einzige Instanz, die proaktiv rotieren darf

jobs:
  token:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Krypto-Bibliothek
        run: python3 -m pip install -q cryptography

      # Ein kaputter Broker darf keinen Token anfassen – erst Selbsttest.
      - name: Selbsttest von Broker + Autorisierung (Sabotage-Schutz)
        run: |
          python3 scripts/pinterest_token.py --selftest
          python3 scripts/pinterest_auth.py --selftest

      - name: Voraussetzungen prüfen (Secrets vorhanden?)
        id: pre
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_TOKEN_KEY: ${{ secrets.PINTEREST_TOKEN_KEY }}
        run: |
          missing=""
          [ -n "${PINTEREST_APP_ID:-}" ]     || missing="$missing PINTEREST_APP_ID"
          [ -n "${PINTEREST_APP_SECRET:-}" ] || missing="$missing PINTEREST_APP_SECRET"
          [ -n "${PINTEREST_TOKEN_KEY:-}" ]  || missing="$missing PINTEREST_TOKEN_KEY"
          if [ -n "$missing" ]; then
            echo "::warning::Fehlende Secrets:$missing – Auto-Erneuerung kann nicht scharf werden."
            echo "missing=$missing" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠️ Fehlende Secrets"
              echo ""
              echo "Ohne diese Secrets läuft der Zugang nur im 30-Tage-Handbetrieb:"
              for m in $missing; do echo "- \`$m\`"; done
              echo ""
              echo "Anlegen: Settings → Secrets and variables → Actions (Runbook Kap. 3, Schritt 0)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "missing=" >> "$GITHUB_OUTPUT"
          fi

      - name: Autorisierungs-URL anzeigen (nur auf Wunsch)
        if: ${{ inputs.show_auth_url }}
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
        run: |
          python3 scripts/pinterest_auth.py --auth-url | tee /tmp/authurl.txt
          URL="$(grep -m1 -o 'https://www.pinterest.com/oauth/[^ ]*' /tmp/authurl.txt || true)"
          {
            echo "### 🔑 Pinterest-Autorisierung – Schritt 1 von 2"
            echo ""
            if [ -n "$URL" ]; then
              echo "**[→ Hier klicken und mit dem Pinterest-Konto erlauben]($URL)**"
              echo ""
            fi
            echo '```'
            cat /tmp/authurl.txt
            echo '```'
            echo ""
            echo "Nach dem Erlauben zeigt \`franksfinanzcheck.de/pinterest-oauth\` den Code mit Kopier-Knopf."
            echo "Dann: diesen Workflow erneut starten und den Code (oder die komplette Adresszeile) in \`auth_code\` einfügen."
          } >> "$GITHUB_STEP_SUMMARY"

      # Der Code kommt über das Env (nicht als Argument): kein Shell-Bruch bei
      # Sonderzeichen, kein Klartext in `ps`, und `extract_code()` versteht auch
      # die komplette Redirect-URL. Der Schritt scheitert NICHT hart – das
      # Ergebnis fließt in Lagebild + Issue; der Refresh-Schritt läuft trotzdem.
      - name: Erst-/Neu-Autorisierung (Code → Token-Speicher)
        id: exchange
        if: ${{ !inputs.show_auth_url && inputs.auth_code != '' }}
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_TOKEN_KEY: ${{ secrets.PINTEREST_TOKEN_KEY }}
          PINTEREST_AUTH_CODE: ${{ inputs.auth_code }}
        run: |
          echo "::add-mask::$PINTEREST_AUTH_CODE"
          set +e
          python3 scripts/pinterest_auth.py --exchange 2>&1 | tee /tmp/exchange.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          {
            if [ "$rc" = "0" ]; then
              echo "### ✅ Autorisierung – Schritt 2 von 2: Code eingetauscht"
            else
              echo "### ❌ Autorisierung – Code-Tausch fehlgeschlagen (Exit $rc)"
            fi
            echo '```'
            cat /tmp/exchange.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != "0" ]; then
            echo "::error::Code-Tausch fehlgeschlagen – Diagnose steht in der Zusammenfassung."
          fi

      - name: Zugang erneuern + Lagebild schreiben
        id: token
        if: ${{ !inputs.show_auth_url }}
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_TOKEN_KEY: ${{ secrets.PINTEREST_TOKEN_KEY }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: |
          set +e
          python3 scripts/pinterest_token.py --refresh | tee /tmp/token.log
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### 🔑 Pinterest-Zugang (Lagebild)"
            echo '```'
            cat /tmp/token.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      # Nachweis für die Secrets-Wache – LIVE geprüft (--verify), mit Herkunft (C5).
      # #219: Ohne `--verify` lief hier nie eine Probe; die Wache blieb „unverified".
      - name: Nachweis für die Secrets-Wache (Live-Probe)
        if: ${{ !inputs.show_auth_url }}
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_TOKEN_KEY: ${{ secrets.PINTEREST_TOKEN_KEY }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: |
          python3 scripts/secrets_age_guard.py --verify --verify-only PINTEREST_ACCESS_TOKEN --quiet \
            || echo "::warning::Pinterest-Zugang nicht bestätigt – siehe Issue/Runbook."
          if [ -n "${PINTEREST_TOKEN_KEY:-}" ]; then
            python3 scripts/secrets_age_guard.py --record-success PINTEREST_TOKEN_KEY \
              --proof-by pinterest-token || true
          fi

      - name: Erneuerten Token + Lagebild committen
        if: ${{ always() && !inputs.show_auth_url }}
        run: |
          git config user.name "Pinterest-Token-Bot"
          git config user.email "pinterest-bot@users.noreply.github.com"
          git add data/pinterest_tokens.enc data/pinterest_token_state.json \
                  data/secrets_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Token-Wache: keine Änderungen."
          else
            git commit -m "chore(pinterest): Zugang erneuert (continuous refresh)"
            scripts/git_sync.sh --push-only
          fi

      - name: Label sicherstellen (sonst schlägt die Issue-Erstellung fehl)
        if: ${{ always() && !inputs.show_auth_url }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "$TOKEN_LABEL" --repo "$GITHUB_REPOSITORY" --color "d93f0b" \
            --description "Pinterest-Zugang: einmalige Handlung nötig" --force || true

      # Melden nur, wenn ein Mensch gebraucht wird. Alles andere heilt der Lauf.
      - name: Befund melden oder schließen (ein Issue, kein Duplikat)
        if: ${{ always() && !inputs.show_auth_url }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXCHANGE_RC: ${{ steps.exchange.outputs.rc }}
          MISSING: ${{ steps.pre.outputs.missing }}
        run: |
          field() { python3 -c "import json,sys;d=json.load(open('data/pinterest_token_state.json'));print(d.get(sys.argv[1]) or sys.argv[2])" "$1" "$2" 2>/dev/null || echo "$2"; }
          STATE="$(field state unknown)"
          SEV="$(field severity unknown)"
          SRC="$(field source none)"
          NEXT="$(field next_action '')"
          RUN="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          WF="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/pinterest-token.yml"
          OPEN="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$TOKEN_LABEL" \
                  --json number --jq '.[0].number' 2>/dev/null || echo "")"
          echo "Zustand=$STATE Ampel=$SEV Quelle=$SRC offenes Issue=${OPEN:-keins} Tausch-RC=${EXCHANGE_RC:-–}"

          # Grün oder gelb-aber-lebendig: Kanal trägt → Issue schließen, Ruhe.
          if [ "$STATE" = "live" ]; then
            if [ -n "$OPEN" ]; then
              gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" \
                --comment "✅ Pinterest-Zugang lebt (Quelle: \`$SRC\`, Ampel: \`$SEV\`) und erneuert sich ab jetzt täglich selbst. Nachweis: [Run ${GITHUB_RUN_ID}](${RUN})."
            fi
            exit 0
          fi
          # Pinterest nicht erreichbar: kein Mensch nötig, nächster Lauf prüft erneut.
          if [ "$STATE" = "unreachable" ]; then
            [ -n "$OPEN" ] && gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" \
              --body "🟡 Pinterest war in [Run ${GITHUB_RUN_ID}](${RUN}) nicht erreichbar – kein Handlungsbedarf, morgen erneut."
            exit 0
          fi

          EXTRA=""
          if [ -n "${MISSING:-}" ]; then
            LIST=""
            for m in $MISSING; do LIST="$LIST \`$m\`"; done
            EXTRA="$EXTRA"$'\n'"### ⚠️ Zuerst: fehlende Secrets anlegen"$'\n'
            EXTRA="$EXTRA""Ohne diese Secrets kann die Automatik nicht scharf werden:$LIST"$'\n'
            EXTRA="$EXTRA""(Settings → Secrets and variables → Actions; Runbook Kap. 3, Schritt 0)"$'\n'
          fi
          if [ -n "${EXCHANGE_RC:-}" ] && [ "${EXCHANGE_RC}" != "0" ]; then
            EXTRA="$EXTRA"$'\n'"### ❌ Der letzte Code-Tausch ist fehlgeschlagen"$'\n'
            EXTRA="$EXTRA""Die genaue Diagnose steht in der Zusammenfassung von [Run ${GITHUB_RUN_ID}](${RUN})."$'\n'
            EXTRA="$EXTRA""Häufigste Ursache: Der Code war schon verbraucht oder abgelaufen (gilt nur Minuten, genau einmal)."$'\n'
            EXTRA="$EXTRA""→ Schritt 1 erneut starten, neu erlauben, den **neuen** Code sofort einfügen."$'\n'
          fi

          BODY=$(cat <<EOF
          ## 🔑 Pinterest-Zugang: einmalige Handlung nötig

          **Zustand:** \`$STATE\` · **Ampel:** \`$SEV\` · **Quelle:** \`$SRC\` · Lauf: [${GITHUB_RUN_ID}](${RUN})

          Die automatische Erneuerung konnte den Zugang nicht wiederherstellen.
          $EXTRA
          ### Nächster Schritt
          $NEXT

          ### So geht es (5 Minuten, danach trägt sich der Kanal selbst)
          1. [**Pinterest-Token-Wache → Run workflow**]($WF) → Haken bei \`show_auth_url\` → starten.
             Die Zusammenfassung des Laufs zeigt einen anklickbaren Autorisierungs-Link.
          2. Link öffnen, mit dem Pinterest-Konto **Erlauben**. Du landest auf
             \`franksfinanzcheck.de/pinterest-oauth\` – die Seite zeigt den Code mit Kopier-Knopf.
          3. [**Run workflow**]($WF) → Code (oder die komplette Adresszeile) in \`auth_code\` einfügen → starten.
             Der Code gilt nur wenige Minuten und genau einmal – also zügig.
          4. Fertig: Der Lauf legt \`data/pinterest_tokens.enc\` an, prüft live, erneuert ab dann täglich
             (continuous refresh) und **schließt dieses Issue von selbst**.

          Voraussetzungen (einmalig): Secrets \`PINTEREST_APP_ID\`, \`PINTEREST_APP_SECRET\`, \`PINTEREST_TOKEN_KEY\`;
          in der Pinterest-App die Redirect-URI \`https://franksfinanzcheck.de/pinterest-oauth\` und die Scopes
          \`boards:read, boards:write, pins:read, pins:write, user_accounts:read\`.

          Vollständiges Runbook: \`docs/PINTEREST-TOKEN-RUNBOOK.md\`
          EOF
          )
          if [ -n "$OPEN" ]; then
            gh issue edit "$OPEN" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" \
              --body "🔁 Zugang weiterhin \`$STATE\` – erneuter Versuch: [Run ${GITHUB_RUN_ID}](${RUN})."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TOKEN_TITLE" \
              --label "$TOKEN_LABEL" --body "$BODY"
          fi
