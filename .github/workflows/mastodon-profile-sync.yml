name: Mastodon-Profil-Sync

# Setzt Anzeigename, Bio, Profilfelder, Avatar & Header des
# Mastodon-Accounts @FranksFinanzcheck@mastodon.social passend zur
# aktuellen Content-Ausrichtung des Blogs (Themen, Rhythmus, Branding/Logo).
#
# Bewusst KEIN Cronjob: Profil-/Branding-Texte sind redaktionelle
# Entscheidungen (anders als die Publikationscadence, siehe cadence-manager.yml).
# Manuell auslösen, wenn sich Content-Fokus oder Branding erkennbar ändern:
# Actions -> "Mastodon-Profil-Sync" -> Run workflow.
#
# Benötigt Secret MASTODON_ACCESS_TOKEN mit Scope 'write:accounts'
# (zusätzlich zu 'write:statuses'+'write:media' für social-ai.yml).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur anzeigen, nichts an Mastodon senden (true/false)"
        required: false
        default: "false"

# Kein contents:write nötig – MASTODON-PROFILE-REPORT.md ist seit dem
# Profi-Cleanup (31.08.2026) bewusst nicht versioniert (.gitignore).
# Der Report wird als CI-Artefakt gesichert statt committet (Fix #205-Klasse).

concurrency:
  group: mastodon-profile
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Mastodon-Profil aktualisieren
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE: ${{ vars.MASTODON_INSTANCE }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 scripts/mastodon_profile_sync.py --dry-run
          else
            python3 scripts/mastodon_profile_sync.py
          fi

      - name: Profil-Report als Artefakt sichern (bewusst nicht versioniert)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: mastodon-profile-report-${{ github.run_id }}
          path: MASTODON-PROFILE-REPORT.md
          if-no-files-found: warn
          retention-days: 90
