# ============================================================
#  E2E-TESTS (PLAYWRIGHT) – Design-Skills-Rollout 12.09.2026
#  ------------------------------------------------------------
#  Baut die Hugo-Website und fährt die Playwright-Suite in e2e/:
#    · Startseite, Artikel (dynamisch neuester Beitrag), Navigation,
#      Pagination, 404-Verhalten
#    · SEO-Meta (Canonical, Open Graph, JSON-LD, Twitter Card)
#    · Barrierefreiheit (H1-Struktur, alt-Texte, Landmarks, Skip-Link)
#    · Affiliate-Integrität (/go/-Links: sponsored+nofollow+noopener,
#      Redirect-Stümpfe, Tabnabbing-Schutz)
#    · Mobile (iPhone-14-Emulation): kein horizontaler Overflow,
#      Tap-Ziele >= 40px
#
#  Läuft: bei PRs auf main (nur wenn layouts/assets/content/e2e/
#  berührt sind), jede Nacht um 07:00 MESZ + manuell.
#  KEIN push-Trigger: der Deploy-Workflow pusht bei Push auf main
#  nach gh-pages. Der tägliche Lauf schließt trotzdem die Lücke für
#  automatische Content-Commits, die ohne PR direkt auf main landen.
#
#  Browser: gepinntes @sparticuz/chromium aus package-lock.json.
#  Die Browser-Vorprüfung startet Chromium und führt JavaScript aus;
#  kein Zugriff auf cdn.playwright.dev ist erforderlich.
# ============================================================
name: E2E-Tests (Playwright)

on:
  pull_request:
    branches: [main]
    paths:
      - "layouts/**"
      - "assets/**"
      - "static/**"
      - "content/**"
      - "data/datasets/**"
      - "data/fixkosten_kompass.yaml"
      - "scripts/fixkosten_kompass_guard.py"
      - "scripts/tests/test_fixkosten_kompass.py"
      - "tools/fixkosten-cockpit.test.mjs"
      - "data/werkzeuge.yaml"
      - "scripts/werkzeuge_gate.py"
      - "scripts/tests/test_werkzeuge_gate.py"
      - "tools/werkzeuge.test.mjs"
      - "hugo.toml"
      - "e2e/**"
      # 26.10.2026: Die Ausnahmen-Registry der A11y-Spec wird selbst geprüft
      # (Grund, Ziel, Ablauf). Eine Änderung nur dort muss den Lauf auslösen –
      # sonst altert eine Ausnahme unbemerkt über ihren Prüftermin hinaus.
      - "data/a11y/**"
      - "scripts/browser_setup.mjs"
      - "scripts/chromium_cache.mjs"
      - "scripts/tests/chromium_cache.test.mjs"
      - "scripts/ff_voice_browser_test.mjs"
      - "scripts/themenwelten_browser_test.mjs"
      - "scripts/tests/test_browser_setup_contract.py"
      - "scripts/h1_wache.py"
      - "scripts/a11y_audit.py"
      - "scripts/tests/test_h1_wache.py"
      - "scripts/tests/test_a11y_audit.py"
      # Snippet-Gate (Screaming-Frog-Spiegel, 27.10.2026): Grenzen (SSOT),
      # Messstelle, Quell-Wache und Tests. Eine Änderung nur an der Zahl
      # muss den Lauf auslösen, sonst altert die Grenze unbemerkt.
      - "scripts/serp_limits.py"
      - "scripts/seo_cockpit.py"
      - "scripts/metadaten_wache.py"
      - "scripts/tests/test_serp_limits.py"
      - "scripts/tests/test_seo_cockpit.py"
      - "scripts/tests/test_metadaten_wache.py"
      - "scripts/linktext_wache.py"
      - "scripts/tests/test_linktext_wache.py"
      - "tools/seo-cockpit/**"
      - "tools/seo-spider/**"
      - "scripts/seo_spider.py"
      - ".github/workflows/seo-spider-weekly.yml"
      - "scripts/manifest_guard.py"
      - "scripts/tests/test_manifest_guard.py"
      - "scripts/tabellen_lesbarkeit_guard.py"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/e2e.yml"
      - ".github/workflows/design-varianten.yml"
      - ".github/workflows/werkbank.yml"
      - ".github/workflows/lesehilfen-gate.yml"
      - ".github/workflows/themenwelten-gate.yml"
  schedule:
    - cron: "0 5 * * *"    # täglich 07:00 MESZ (05:00 UTC) – deckt direkte Content-Pushes ab
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright-Suite (Desktop + Mobile)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Job-Ebene statt Schritt-Ebene: Die Composite-Action hugo-build sieht
    # Job-Variablen zuverlässig, ein `env:` am `uses:`-Schritt nicht.
    env:
      HUGO_JSDELIVR_SHA: ${{ github.sha }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # WF-7B6B / #654 (08.10.2026): Ein Merge-Rest in package.json ließ `npm ci`
      # in Sekunde 1 abbrechen – die Meldung riet zu API-Keys. Diese Wache prüft
      # Manifest und Lockfile VOR dem Install, nennt Datei, Zeile und Ursache
      # (als Annotation an der Zeile) und beweist sich vorher selbst.
      # Runbook: docs/ANLEITUNG-MANIFEST-WACHE.md
      - name: Manifest-Wache (package.json & Lockfile vor npm ci)
        run: |
          python3 scripts/manifest_guard.py --selftest
          python3 scripts/manifest_guard.py

      - name: Hugo installieren (Extended, verifiziert, mehrquellig)
        uses: ./.github/actions/install-hugo
        with:
          version: "0.168.0"

      - name: Node einrichten (22, mit npm-Cache)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --ignore-scripts

      - name: Chromium-Versorgungsvertrag (Manifest, Lockfile, CI)
        run: |
          python3 -m unittest scripts.tests.test_browser_setup_contract
          npm run test:browser-cache

      - name: Chromium vorbereiten + JavaScript-Smoke-Test
        run: npm run browser:setup

      # Statische Wache VOR dem Browser: sie braucht weder Build noch
      # Chromium und faengt die Ursachenklasse „Markup da, CSS nie
      # geliefert" (Spar-Matrix 30.09.2026, .ff-pc-* 28.09.2026) in
      # Sekunden ab – inklusive Selbsttest, damit ein stumpfer Messer
      # nicht als Gruen durchgeht.
      - name: Tabellen-Lesbarkeit (L1–L5, statisch)
        run: |
          python3 scripts/tabellen_lesbarkeit_guard.py --selftest
          python3 scripts/tabellen_lesbarkeit_guard.py

      - name: Fixkosten-Cockpit – lokaler Produktvertrag
        run: |
          python3 -m pip install -q --require-hashes -r "$GITHUB_WORKSPACE/requirements-ci.txt"
          npm run test:cockpit

      # Rechenkern und Produktvertrag der Werkzeuge: 55 Prüfungen ohne
      # Browser (jsdom + reine Funktionen) plus die Sabotageproben der
      # Wache. Läuft vor dem Build, weil ein falsch rechnender Rechner
      # keine E2E-Runde wert ist.
      - name: Werkzeuge – Rechenkern und Produktvertrag
        run: npm run test:werkzeuge

      - name: Website bauen
        uses: ./.github/actions/hugo-build
        with:
          args: "--destination public"
          label: "E2E-Build"

      # H1-Wache, zweiter Teil (Stufe 2, 08.10.2026): Die Quellprüfung sieht
      # Markdown und Vorlagen, diese Prüfung sieht JEDE gebaute Seite – auch
      # die Blätterseiten /page/2/ … und /posts/page/2/ …, die eine pauschale
      # Ausnahme bis dahin verdeckte (sie trugen real gar keine H1). Der
      # Schritt läuft bewusst HIER: direkt nach dem echten Build, vor den
      # Browser-Tests, damit ein roter Befund sofort sichtbar ist.
      - name: H1-Wache – gebaute Seiten (jede genau eine H1)
        run: python3 scripts/h1_wache.py --public public

      # ------------------------------------------------------------------
      #  SNIPPET-GATE (Screaming-Frog-Spiegel, 27.10.2026)
      #  Ein fremder Crawl fand an der Startseite, was unsere eigenen Wachen
      #  nicht sahen: Description über 155 Zeichen (und über 985 Pixel), einen
      #  internen Link ohne Ankertext und „mehrere H2". Hier wird daraus ein
      #  PR-Gate – nicht ein Deploy-Blocker: Ein zu langes Snippet darf die
      #  Auslieferung der Live-Site nicht anhalten (C34), es darf aber nicht
      #  unbemerkt in main wandern. Grenzen und Breitenmaß stehen in
      #  scripts/serp_limits.py; dieselben Zahlen prüft metadaten_wache.py
      #  an der Quelle – `--fail-on` sperrt genau die drei Codes.
      #  Ankertext und Alt-Texte prüft daneben `scripts/linktext_wache.py`
      #  (aus dem Seobility-Lauf vom 27.10.2026, mit eigenen Ausnahmen und
      #  Selbsttest). Zwei Wachen für einen Befund laufen auseinander –
      #  deshalb steht `link-no-anchor` hier NICHT in der Sperrliste; das
      #  Cockpit führt die Zeile weiter im Bericht.
      # ------------------------------------------------------------------
      - name: Snippet-Gate – Snippetfenster und Rangfolge
        run: |
          set +e
          protokoll="${RUNNER_TEMP:-/tmp}/snippet-gate.log"
          python3 scripts/seo_cockpit.py --build public \
            --output "${RUNNER_TEMP:-/tmp}/seo-cockpit-pr" \
            --fail-on description-length,description-breite,heading-order \
            | tee "$protokoll"
          gate_status=${PIPESTATUS[0]}
          {
            echo "### Snippet-Gate (155 Zeichen · 985 px · Rangfolge)"
            echo '```'
            tail -n 30 "$protokoll"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$gate_status" -ne 0 ]; then
            echo "::error title=Snippet-Gate::Snippet oder Rangfolge verletzt – die Grenzen stehen in scripts/serp_limits.py"
          fi
          exit "$gate_status"

      # Ankertext und Alt-Texte: eine Wache, ein Besitzer (27.10.2026).
      # Der Seobility-Lauf hat dieselbe Klasse gefunden wie der fremde Crawl;
      # `linktext_wache.py` prüft sie am gerenderten HTML – inklusive der
      # begründeten Ausnahmen (`data-ff-linktext-frei`, `<a>` ohne `href`).
      - name: Linktext-Wache – Linktexte und Alt-Texte im Build
        run: |
          python3 scripts/linktext_wache.py --selftest
          python3 scripts/linktext_wache.py --public public

      - name: Metadaten-Wache – Quelle (Titel, Description, Belege)
        run: python3 scripts/metadaten_wache.py

      - name: SEO Spider – Parser, URL-Sicherheit und Crawl-Logik
        run: npm run test:seo:spider

      - name: E2E-Suite ausführen
        run: npx playwright test

      - name: Messbarer Design-Audit (Kontraste, Tap-Ziele, Typo)
        run: node e2e/design-metrics.mjs > design-metrics.json
        continue-on-error: true

      - name: HTML-Report als Artifact hochladen (bei Fehlern)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            design-metrics.json
          retention-days: 7
          if-no-files-found: ignore
