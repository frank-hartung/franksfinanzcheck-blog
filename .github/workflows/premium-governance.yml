# ============================================================
#  PREMIUM-GOVERNANCE (Chefredakteur-Cockpit, v2 – Härtung 07.09.2026)
#
#  Die „Blatt-Steuerung" für FranksFinanzcheck – wöchentlich (Mo 07:15 MESZ):
#    0. Selbsttests + Governance-VERTRAG (C1–C9)  – kaputte Wachen melden Unsinn
#    1. Messen: Hugo-Build, Decay, Core-Web-Vitals, Secrets (live-Probe),
#       Pinterest-Performance, Umami-Klicks, Awin-Provisionen
#    2. Bewerten: GATE entscheidet über eine dokumentierte Policy, ob daraus ein
#       Befund wird (Exit-Codes allein sind kein Alarm-Kriterium – das war #206)
#    3. Sehen: Chefredakteur-Scorecard ZULETZT (sie braucht die frischen Messwerte)
#    4. Melden: EIN gebündeltes Issue (Label `governance`) – aktualisiert statt
#       dupliziert, bei Grün automatisch geschlossen
#
#  GRÜNDLICH GEÄNDERT (Governance-Report #206, 07.09.2026):
#    · Scorecard lief VOR CWV/Decay/Secrets → sie zeigte stets die Werte der
#      Vorwoche (AMBER im Cockpit, GREEN im Wächter, 7 Punkte Abzug für nichts).
#      Jetzt: Messen → Bewerten → Sehen. Die Scorecard-Zeile trägt zudem ihre
#      Herkunft (Alter der Messung), „nicht gemessen" ist ⚪ statt 🟡.
#    · Secrets wurden NUR als „im Env vorhanden" geprüft; der „Erfolg" wurde vom
#      Governance-Lauf selbst vermerkt, obwohl er die KI-Keys nie benutzt.
#      Jetzt: Live-Probe `--verify` (Pinterest/Mastodon/Groq/Gemini/Umami) –
#      ein toter Token wird rot, ein fehlender Nachweis ist eine Info.
#    · Jeder Schritt mit Exit 1 (auch „noch keine Daten") hat ein Issue erzeugt
#      → Wochen-Duplikate (#145, #206). Jetzt: Policy im Gate.
#    · Hugo-Build mit `|| true` – ein fehlgeschlagener Bau ließ den CWV-Wächter
#      einen leeren Baum „grün" messen. Jetzt: Bau-Fehler ist ein Befund.
#
#  Kein API-Key nötig; nur Umgebungsvariablen für die Secrets-Probe.
#  Exit-Politik des Jobs: der Lauf wird nur rot, wenn das GATE ROT sieht
#  (Infra- oder Kanalproblem). Gelbe Befunde erscheinen im Issue, nicht als
#  roter Run – sonst verdoppelt das zentraler Fehler-Alerting jede Meldung.
# ============================================================
name: Premium-Governance

on:
  schedule:
    - cron: "15 5 * * 1"    # Montag 07:15 MESZ – Redaktions-Checkpoint
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: premium-governance
  cancel-in-progress: false

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOV_LABEL: governance
      GOV_TITLE: "🗞️ Governance-Report: Redaktionelle & technische Handlungsfelder"
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python-Abhängigkeiten
        run: python3 -m pip install -q pyyaml cryptography pillow 2>/dev/null || true

      # ---------- 0) PREFLIGHT: Wachen + Vertrag ----------
      # Schlägt ein Selbsttest fehl, ist der Messer kaputt – dann wäre jeder
      # Report wertlos. Lieber laut abbrechen als falsche Sicherheit liefern.
      - name: Governance-Selbsttests (Preflight)
        run: |
          fail=0
          for s in editorial_scorecard cwv_guard secrets_age_guard decay_radar \
                   governance_gate governance_contract readability_check \
                   umami_clicks click_attribution awin_provisions \
                   pinterest_perf_feedback pinterest_token pinterest_auth; do
            if python3 "scripts/$s.py" --selftest >/tmp/selftest-$s.log 2>&1; then
              tail -n 1 "/tmp/selftest-$s.log"
            else
              echo "::error::scripts/$s --selftest fehlgeschlagen"
              tail -n 20 "/tmp/selftest-$s.log"
              fail=1
            fi
          done
          exit $fail

      - name: Governance-Vertrag prüfen (C1–C9)
        run: python3 scripts/governance_contract.py --quick --md docs/GOVERNANCE-KONTRAKT.md

      - name: Report-Hygiene (Root bleibt sortenrein)
        # Wöchentliche Einordnung der Root-Reports: ci-dashboard | doku |
        # maschinen-muell | verwaist. Kein harter Fehler – der wöchentliche
        # Checkpunkt soll den Fund zeigen, die Heilung passiert täglich in
        # blog-health-daily.yml (dort auch im selben Commit).
        run: |
          python3 scripts/report_hygiene.py --selftest
          python3 scripts/report_hygiene.py --check \
            || echo "::warning::Root-Reports ohne Einordnung – heilen mit: python3 scripts/report_hygiene.py --apply"

      - name: Ledger zurücksetzen (nur dieser Lauf zählt)
        run: python3 scripts/governance_gate.py --reset

      - name: Hugo installieren (Messgrundlage Core-Web-Vitals)
        uses: ./.github/actions/install-hugo
        with:
          version: "0.164.0"

      # ---------- 1) MESSEN ----------
      - name: Hugo-Build (Fehler werden bewertet, nicht verschluckt)
        id: build
        run: |
          set +e
          hugo --minify > /tmp/build.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "Hugo-Build fehlgeschlagen (letzte 25 Zeilen):"
            tail -n 25 /tmp/build.log
          fi
          python3 scripts/governance_gate.py --emit build --log /tmp/build.log \
            --exit "$rc" --require-green

      - name: Content-Decay-Radar
        id: decay
        run: |
          set +e
          python3 scripts/decay_radar.py | tee /tmp/decay.log
          rc=${PIPESTATUS[0]}
          set -e
          python3 scripts/governance_gate.py --emit decay --report DECAY-REPORT.md \
            --log /tmp/decay.log --exit "$rc"

      - name: "Core-Web-Vitals-Wächter (Strict-Build: kein Grün ohne Messung)"
        id: cwv
        run: |
          set +e
          python3 scripts/cwv_guard.py --public public/ --strict-build | tee /tmp/cwv.log
          rc=${PIPESTATUS[0]}
          set -e
          python3 scripts/governance_gate.py --emit cwv --report CWV-REPORT.md \
            --log /tmp/cwv.log --exit "$rc"

      - name: Secrets-Wache mit Live-Probe (Pinterest/Mastodon/KI/Umami)
        id: secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_TOKEN_KEY: ${{ secrets.PINTEREST_TOKEN_KEY }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE: ${{ vars.MASTODON_INSTANCE }}
          UMAMI_API_TOKEN: ${{ secrets.UMAMI_API_TOKEN }}
        run: |
          set +e
          python3 scripts/secrets_age_guard.py --verify | tee /tmp/secrets.log
          rc=${PIPESTATUS[0]}
          set -e
          python3 scripts/governance_gate.py --emit secrets --report SECRETS-REPORT.md \
            --log /tmp/secrets.log --exit "$rc"

      - name: Lesbarkeits-Wache (Flesch-Amstad – Regelwerk R6 Bestands-Gate)
        id: lesbarkeit
        run: |
          set +e
          python3 scripts/readability_check.py --gate-bestand \
            --report LESBARKEIT-REPORT.md | tee /tmp/lesbarkeit.log
          rc=${PIPESTATUS[0]}
          set -e
          python3 scripts/governance_gate.py --emit lesbarkeit --report LESBARKEIT-REPORT.md \
            --log /tmp/lesbarkeit.log --exit "$rc"

      - name: Pinterest-Performance-Feedback (Themen-Gewichtung)
        id: pinperf
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: |
          set +e
          python3 scripts/pinterest_perf_feedback.py | tee /tmp/pinperf.log
          rc=${PIPESTATUS[0]}
          set -e
          python3 scripts/governance_gate.py --emit pinperf --report PINTEREST-PERF-REPORT.md \
            --log /tmp/pinperf.log --exit "$rc"

      # Der Klick-Export war der Grund, warum die Monetarisierungs-Zeile jeder
      # Scorecard „0 Klicks" zeigte: ein manueller Dashboard-Export, der nie
      # passiert. Jetzt holt ein Job die Daten selbst – ohne Token sauber skip.
      - name: Umami-Klicks automatisch laden (Umsatz-Datenpipeline)
        id: umami
        env:
          UMAMI_API_TOKEN: ${{ secrets.UMAMI_API_TOKEN }}
        run: |
          set +e
          python3 scripts/umami_clicks.py --fetch --days 90 | tee /tmp/umami.log
          rc=${PIPESTATUS[0]}
          set -e
          python3 scripts/governance_gate.py --emit umami --log /tmp/umami.log --exit "$rc"

      - name: Affiliate-Klick-Attribution
        id: clicks
        run: |
          set +e
          python3 scripts/click_attribution.py | tee /tmp/clicks.log
          rc=${PIPESTATUS[0]}
          set -e
          python3 scripts/governance_gate.py --emit clicks --report CLICK-REPORT.md \
            --log /tmp/clicks.log --exit "$rc"

      - name: Awin-Provisions-Import (Klicks → Umsatz)
        id: awin
        run: |
          set +e
          python3 scripts/awin_provisions.py | tee /tmp/awin.log
          rc=${PIPESTATUS[0]}
          set -e
          python3 scripts/governance_gate.py --emit awin --report AWIN-REPORT.md \
            --log /tmp/awin.log --exit "$rc"

      # ---------- 2) SEHEN (direkt nach dem Messen – die Sicht braucht frische Werte) ----------
      - name: "Live-Konsistenz (Cloudflare, CDN-Cache, Auslieferung)"
        id: live_policy
        # Kein Blick ins Repo, sondern auf die Antwort des Servers: robots.txt,
        # Der Report bleibt ein Lauf-Artefakt (Root-Regel in .gitignore) – der
        # dauerhafte Nachweis sitzt im Ledger-Event data/governance_history.jsonl.
        # Ein erzwungenes `git add` hier wäre genau die Root-Müll-Quelle, die
        # scripts/report_hygiene.py sonst wegräumt.
        # Sitemap, canonical/og:image/JSON-LD einer Live-Seite, HTTP-Umleitung,
        # Manifest-MIME. Der Lauf gilt nur mit Erreichbarkeit (--require-live);
        # die Messbarkeits-Lücke selbst bleibt Info, echte Drift ist ROT.
        run: |
          set +e
          python3 scripts/live_policy_guard.py --selftest >> /tmp/live_policy.log 2>&1 \
            && python3 scripts/live_policy_guard.py --require-live \
                 --report LIVE-POLICY-REPORT.md | tee -a /tmp/live_policy.log
          rc=${PIPESTATUS[0]}
          set -e
          python3 scripts/governance_gate.py --emit live-policy --report LIVE-POLICY-REPORT.md \
            --log /tmp/live_policy.log --exit "$rc"

      - name: Chefredakteur-Scorecard
        id: scorecard
        run: |
          set +e
          python3 scripts/editorial_scorecard.py | tee /tmp/scorecard.log
          rc=${PIPESTATUS[0]}
          set -e
          python3 scripts/governance_gate.py --emit scorecard --report EDITORIAL-SCORECARD.md \
            --log /tmp/scorecard.log --exit "$rc"

      # ---------- 3) BEWERTEN (EINE Entscheidung über alle Schritte, auch die Sicht) ----------
      - name: Gate-Entscheidung (Policy statt Exit-Code)
        id: decide
        run: |
          set +e
          python3 scripts/governance_gate.py --decide --fail-on red \
            --body-file /tmp/governance_issue_body.md | tee /tmp/decide.log
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### 🗞️ Governance-Bewertung"
            echo '```'
            cat /tmp/decide.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Der Lauf bleibt grün: das Issue IST der Alarm. Ein roter Run würde vom
          # zentralen Fehler-Alerting ein zweites Issue für dieselbe Lage erzeugen.
          # ROT steht als ::error::-Annotation im Run (siehe gate-Ausgabe).
          [ "$rc" = "0" ] || echo "Gate meldet ROT – siehe Annotation und Issue oben."
          exit 0

      - name: Cockpit in die Lauf-Zusammenfassung
        if: always()
        run: python3 scripts/governance_gate.py --summary

      # ---------- 4) MELDEN (ein Issue, aktualisiert, kein Duplikat) ----------
      - name: Label sicherstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "$GOV_LABEL" --repo "$GITHUB_REPOSITORY" --color "1d76db" \
            --description "Governance-Befunde der Blatt-Steuerung" --force || true

      - name: Governance-Issue (nur bei echtem Befund – aktualisieren statt duplizieren)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTION="${{ steps.decide.outputs.action }}"
          VERDICT="${{ steps.decide.outputs.verdict }}"
          FP="${{ steps.decide.outputs.fingerprint }}"
          RUN="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          OPEN="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$GOV_LABEL" \
                  --json number,title --jq '.[] | select(.title == env.GOV_TITLE) | .number' \
                  | head -n 1)"
          echo "Entscheidung: action=$ACTION verdict=$VERDICT fingerprint=$FP offenes Issue=${OPEN:-keins}"
          case "$ACTION" in
            report)
              if [ -n "$OPEN" ]; then
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" \
                  --body "🔁 **${VERDICT}** – Befund bleibt offen (Fingerabdruck \`$FP\`). Neuer Lauf: [Run ${GITHUB_RUN_ID}](${RUN})."
                # Body nur bei veränderter Befundlage überschreiben (kein Flush-Rauschen)
                if [ "${{ steps.decide.outputs.changed }}" = "true" ]; then
                  gh issue edit "$OPEN" --repo "$GITHUB_REPOSITORY" --body-file /tmp/governance_issue_body.md
                  echo "→ Issue #${OPEN} aktualisiert (Befundlage geändert)."
                else
                  echo "→ Issue #${OPEN} unverändert (gleicher Fingerabdruck) – nur Kommentar."
                fi
              else
                NUMBER="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$GOV_TITLE" \
                          --label "$GOV_LABEL" --body-file /tmp/governance_issue_body.md)"
                echo "→ Neues Governance-Issue: $NUMBER"
              fi
              ;;
            close)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" \
                  --comment "✅ **Alle Messungen grün** – die Wache meldet keine handlungsbedürftigen Befunde mehr. Letzter Check: [Run ${GITHUB_RUN_ID}](${RUN})."
                echo "→ Issue #${OPEN} geschlossen (Selbstheilung dokumentiert)."
              else
                echo "→ alles grün, kein offenes Issue."
              fi
              ;;
            *)
              echo "→ Hinweis-Stufe ohne Handlungsbedarf: kein Issue (Policy scripts/governance_gate.py)."
              ;;
          esac

      # ---------- COMMIT (Reports + Manifeste + Nachweise) ----------
      - name: Reports & Nachweise committen
        if: always()
        run: |
          git config user.name "Governance-Bot"
          git config user.email "governance-bot@users.noreply.github.com"
          # 12.09.2026 (Premium-Audit): die sieben Root-Reports sind gitignored
          # und nicht versioniert (bleiben im Lauf-Log) – nur die funktionalen
          # State-/Kontakte-Dateien werden versioniert.
          git add docs/GOVERNANCE-KONTRAKT.md 2>/dev/null || true
          git add data/decay_queue.json data/cwv_manifest.json data/secrets_state.json 2>/dev/null || true
          git add data/governance_status.json data/governance_history.jsonl 2>/dev/null || true
          git add data/cwv_history.jsonl data/scorecard_history.jsonl 2>/dev/null || true
          git add data/pinterest_weights.yaml data/click_stats.json data/pinterest_perf_history.jsonl 2>/dev/null || true
          git add data/pinterest_token_state.json 2>/dev/null || true
          git add data/awin_provisions.json data/subid_map.yaml 2>/dev/null || true
          git add data/umami_clicks.json data/umami_clicks.meta.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Governance: keine Änderungen."
          else
            git commit -m "governance: Messkette + Gate-Bewertung + Scorecard (wöchentlich, v2)"
            scripts/git_sync.sh --push-only
          fi
