name: Textverständnis-Patches einspielen (einmalig)

# EINMALIGER Workflow – aktiviert die Textverständnis-Wachen im Blog.
# VORAUSSETZUNG: Repository-Secret `GH_PAT` (dein persönliches Token mit
# den Scopes `repo` + `workflow` ODER feingranular: contents:write +
# workflows:write). Anlegen unter:
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#   Name: GH_PAT · Secret: <dein PAT>
#
# ANWENDUNG:
#   1. Diese Datei nach .github/workflows/apply-verstaendnis-patches.yml legen
#      (z. B. über die GitHub-Web-Oberfläche "Add file", da der Arena-Bot
#      keine Workflow-Dateien pushen darf).
#   2. Workflow unter GitHub → Actions → "Textverständnis-Patches einspielen"
#      → "Run workflow" starten.
#   3. Der Workflow holt die Patch-Dateien aus dem Arena-Branch, wendet beide
#      Patches an und pusht sie nach main.
#   4. Danach diese einmalige Workflow-Datei wieder löschen (optional).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Patch-Dateien aus Arena-Branch holen
        run: |
          git fetch origin arena/01a05dd2-franksfinanzcheck-blog
          git show origin/arena/01a05dd2-franksfinanzcheck-blog:patches/textverstaendnis-blog-health-2026-09-01.patch > /tmp/bh.patch
          git show origin/arena/01a05dd2-franksfinanzcheck-blog:patches/textverstaendnis-seo-weekly-2026-09-01.patch > /tmp/sw.patch
          echo "✅ Patch-Dateien geladen:"
          wc -l /tmp/bh.patch /tmp/sw.patch

      - name: Patches anwenden
        run: |
          git apply /tmp/bh.patch
          git apply /tmp/sw.patch
          echo "✅ Beide Patches angewendet:"
          git status --short

      - name: Committen & nach main pushen
        run: |
          git config user.name "Frank (Patch-Bot)"
          git config user.email "frank@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Änderungen – Patches waren offenbar schon aktiv."
          else
            git commit -m "feat(textverstaendnis): tägliche + wöchentliche Verständnis-Wache aktiviert (Patches 01.09.2026)"
            git push origin main
            echo "✅ Patches nach main gepusht."
          fi
