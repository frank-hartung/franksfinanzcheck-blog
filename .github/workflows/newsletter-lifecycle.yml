# Newsletter-Lifecycle: Bestätigungsmails (Double-Opt-In) und Nachgang.
#
# WIE DER WORKFLOW TRIGGERT WIRD
# ------------------------------
# Der Cloudflare-Worker (abos.franksfinanzcheck.de) nimmt eine Anmeldung an
# und speichert sie im KV als pending (mit Token). Damit die Adresse ihre
# Bestätigungsmail bekommt, startet der Worker DIESEN Workflow:
#
#   POST /repos/frank-hartung/franksfinanzcheck-blog/actions/workflows/
#        newsletter-lifecycle.yml/dispatches
#   Body: { "ref": "main", "inputs": { "aktion": "nachgang" } }
#
# SICHERHEIT (Audit 14.10.2026, H-05): Der Worker schickt KEINEN Token mehr.
# Ein Token als workflow_dispatch-Input stand unmaskiert im (oeffentlichen)
# Actions-Log – wer ihn liest, kann die Anmeldung bestaetigen oder abmelden.
# Der Nachgang holt frische Anmeldungen sofort (ohne Wartezeit beim ersten
# Versuch) ueber den geschuetzten Export /export/pending. Ein alter Worker,
# der noch `token` mitschickt, bekommt von GitHub 422 (unbekannter Input) –
# die Anmeldung bleibt im KV und der stuendliche Nachgang stellt zu.
#
# Der Worker braucht dafür ein Secret GITHUB_PAT (feingranular, nur dieses
# Repo, Berechtigung „Actions: Read and write“ – NICHT „Workflows“, das ist
# das Recht, Workflow-Dateien zu ändern, und löst keinen Dispatch aus;
# Quelle: docs.github.com/rest/actions/workflows#create-a-workflow-dispatch-event)
# und GITHUB_REPO=frank-hartung/franksfinanzcheck-blog.
# Seit 25.09.2026 ruft der Worker per Cron Trigger auch den stündlichen
# NACHGANG (aktion=nachgang) – der schedule unten kommt an diesem Repo
# Stunden zu spät oder gar nicht (Taktgeber, s. newsletter-worker/).
#
# Der stündliche NACHGANG (schedule) ist das Netz unter dem Dispatch:
# erreicht der Dispatch den Workflow nicht (Rate-Limit, GitHub-Wartung) oder
# kam die Mail nicht an, holt der Nachgang offene Bestätigungen aus dem
# Worker-Export (/export/pending) – erst nach NEWSLETTER_NACHGANG_MIN_MINUTEN,
# max. 3 Versuche, danach „abgelaufen“ im Worker (die Seite zeigt dann den
# ehrlichen Weg). Details: scripts/newsletter_versand.py (sende_nachgang).
name: Newsletter-Lifecycle (Bestätigung + Nachgang)

on:
  schedule:
    - cron: "17 * * * *"      # stündlich, offset vom :05-Digest-Lauf
  workflow_dispatch:
    inputs:
      aktion:
        description: 'Aktion: nachgang (offene Bestätigungen senden). „bestaetigung“ ist ein Alias für nachgang.'
        type: choice
        options:
          - nachgang
          - bestaetigung
        default: 'nachgang'

permissions:
  contents: write

concurrency:
  group: newsletter-lifecycle
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}
        # Der Nachgang und die Bestätigung lesen/durchlaufen IMMER main:
        # das Versandjournal (data/newsletter_journal.jsonl) und der Worker-
        # Stand gehören zusammen, und ein Dispatch kommt nie mit Zweig.

      - name: Python bereitstellen
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Mailer-Selbsttest (Transport, Bestätigung, Journal)
        run: python3 scripts/newsletter_versand.py --selftest

      - name: Bestätigung senden oder Nachgang fahren
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_HASH_KEY: ${{ secrets.NEWSLETTER_HASH_KEY }}
          NEWSLETTER_WORKER_BASE: ${{ vars.NEWSLETTER_WORKER_BASE }}
          NEWSLETTER_WORKER_EXPORT_KEY: ${{ secrets.NEWSLETTER_WORKER_EXPORT_KEY }}
          # Getrennter Schreibschluessel (F-08): Tokenhaltige Exporte sind nur
          # damit freigegeben. Fehlt das Secret oder ist es identisch mit dem
          # Leseschluessel, stoppt der Versand fail-closed; kein Rueckfall.
          NEWSLETTER_WORKER_WRITE_KEY: ${{ secrets.NEWSLETTER_WORKER_WRITE_KEY }}
          NEWSLETTER_ABSENDER: ${{ vars.NEWSLETTER_ABSENDER }}
          NEWSLETTER_TRANSPORT: ${{ vars.NEWSLETTER_TRANSPORT || '' }}
          NEWSLETTER_SMTP_HOST: ${{ secrets.NEWSLETTER_SMTP_HOST }}
          NEWSLETTER_SMTP_PORT: ${{ secrets.NEWSLETTER_SMTP_PORT }}
          NEWSLETTER_SMTP_USER: ${{ secrets.NEWSLETTER_SMTP_USER }}
          NEWSLETTER_SMTP_PASS: ${{ secrets.NEWSLETTER_SMTP_PASS }}
          # Eingabe als ENV statt als Interpolation im Skripttext.
          EINGABE_AKTION: ${{ github.event_name == 'workflow_dispatch' && inputs.aktion || 'nachgang' }}
        run: |
          AKTION="$EINGABE_AKTION"
          case "$AKTION" in
            bestaetigung|nachgang)
              # Seit 14.10.2026 identisch: der Nachgang sendet frische
              # Anmeldungen sofort (Token nie im Log, Audit H-05).
              set +e
              python3 scripts/newsletter_versand.py --nachgang | tee /tmp/nl_lc.log
              rc=${PIPESTATUS[0]}
              set -e
              if [ "$rc" -ne 0 ]; then
                echo "::warning::Nachgang unvollständig (Exit $rc) – nächster Durchgang wiederholt."
              fi
              ;;
            *)
              echo "⚠ Unbekannte Aktion $AKTION – erlaubt: bestaetigung, nachgang."
              exit 2
              ;;
          esac

      - name: Versandstatus protokollieren (Journal mit Adress-HASHES)
        # Der Nachgang bucht Zustellungen ins Journal (Hash statt Adresse) –
        # der nächste Lauf muss sie sehen, damit nichts doppelt nachgeschickt
        # wird. Deshalb `always()`: auch ein abgebrochener Lauf, der Mails
        # rausgebracht hat, darf seinen Beleg nicht verlieren.
        if: ${{ always() && !cancelled() }}
        run: |
          git config user.name "Newsletter-Bot"
          git config user.email "newsletter-bot@users.noreply.github.com"
          git add data/newsletter_journal.jsonl data/newsletter_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine Versandänderung – nichts zu committen."
          else
            git commit -m "newsletter: Lifecycle-Zustand (Bestätigung/Nachgang) festschreiben"
            scripts/git_sync.sh --push-only || { echo "::error::LIFECYCLE-ZUSTAND nicht gesichert – Nachgang-Resume ist unvollständig."; exit 1; }
          fi
