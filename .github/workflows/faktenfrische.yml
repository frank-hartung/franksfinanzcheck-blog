# ============================================================
#  FAKTENFRISCHE – Bestands-Recherche (Agent Reach + Claude)
#  Auftrag Frank, 27.09.2026: „Bestehende und zukünftige
#  Blogartikel automatisch … bei Content-Erstellung UND in
#  sinnvollen Abständen im Internet recherchieren."
#
#  ZWEI TAKTE, EIN SKRIPT:
#    Erstellung → .github/workflows/content-engine-v2.yml
#                 (Phase 3, `--neu --apply`)
#    Bestand    → DIESER Workflow, TÄGLICH 06:40 MESZ.
#                 Rotation nach Fälligkeit aus
#                 data/agent_reach/faktenfrische.yaml
#                 (YMYL 45 Tage, saisonal 30, Standard 90).
#
#  WARUM TÄGLICH (Reparatur #912, 29.10.2026)
#  ------------------------------------------
#  Der Bestand braucht 2,4–2,6 Faktenprüfungen je Tag (Σ 1/Intervall
#  über ~106 Seiten). Der Takt lieferte Di + Do je 3 = 0,86 je Tag:
#  33 % Deckung. Damit wurden JEDE WOCHE zwölf Seiten mehr überfällig
#  als geprüft – die Release-Scorecard konnte nie grün werden und
#  Ticket #912 nie schließen. Ein Dauer-Alarm ohne Schließpfad, den
#  die eigene Governance (C14) verbietet.
#
#  Die Intervalle bleiben unangetastet (weniger messen wäre keine
#  Heilung). Stattdessen: täglicher Takt + Budget, das die Deckungs-
#  rechnung selbst bestimmt (`budget.auto_skalierung`, Obergrenze
#  `hartes_limit_pro_lauf`), + Vorlauf `planung.vorlauf_tage`, damit
#  Arbeit VOR der roten Kante beginnt.
#
#  Der Lauf schreibt NUR Frontmatter (`quellen`, `faktencheck`)
#  und Dossiers unter data/research/artikel/. Artikeltexte
#  ändert er nie – fachliche Befunde gehen als Issue an einen
#  Menschen (KI-Redaktions-Statut).
#
#  Manuell starten: GitHub → Actions → „Faktenfrische (Bestand)"
# ============================================================
name: Faktenfrische (Bestand)

on:
  schedule:
    # Täglich 06:40 MESZ – freier Slot zwischen Newsletter (06:30)
    # und Content-Engine; entzerrt gegenüber agent-reach-research (Mo).
    # Die Deckung rechnet mit DIESER Zeile (faktenfrische_kapazitaet.py
    # parst den cron) – wer den Plan ändert, ändert die Rechnung mit.
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Artikel in diesem Lauf (auto = Deckungsrechnung entscheidet)"
        required: false
        default: "auto"

permissions:
  contents: write
  issues: write

concurrency:
  group: faktenfrische
  cancel-in-progress: false

jobs:
  recherche:
    runs-on: ubuntu-24.04
    # 91 s für 3 Seiten (Lauf 2026-10-27) ≈ 30 s/Seite – das harte
    # Budget-Limit 10 braucht also ~5 min. 25 min ist die Reserve für
    # langsame Kanäle, nicht die Regel (#912).
    timeout-minutes: 25
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          # Kein Node/npm: Die Fachprüfung läuft über scripts/llm_client.py
          # (reine Standardbibliothek) mit den Schlüsseln der KI-Redaktion.
          python3 -m pip install -q --disable-pip-version-check --require-hashes -r "$GITHUB_WORKSPACE/requirements-ci.txt"

      - name: Selbsttest (Sabotage-Schutz – kein Schreiben ohne grünen Lauf)
        run: python3 scripts/faktenfrische.py --selftest

      - name: Recherche + Fachprüfung
        id: lauf
        continue-on-error: true   # Artefakte/Diagnose sichern, danach Fehler melden
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EINGABE_MAX: ${{ github.event.inputs.max || 'auto' }}
        run: |
          # „auto“ = die Deckungsrechnung bestimmt das Budget (Sockel
          # budget.max_artikel_pro_lauf, Obergrenze hartes_limit_pro_lauf).
          # Eine Zahl schaltet die Skalierung für diesen Lauf bewusst ab.
          if [ "${EINGABE_MAX}" = "auto" ] || [ -z "${EINGABE_MAX}" ]; then
            python3 scripts/faktenfrische.py --apply
          else
            python3 scripts/faktenfrische.py --apply --max "${EINGABE_MAX}"
          fi

      - name: Belege & Dossiers committen
        env:
          GIT_USER: Faktenfrische-Bot
          GIT_MAIL: faktenfrische-bot@users.noreply.github.com
        run: |
          # Der gesamte Commit-/Push-Weg läuft über git_sync.sh. Dadurch
          # werden parallele Bot-Commits per Fetch-Retry + Rebase-Runden
          # eingeordnet; die Faktenfrische darf nicht an einem kurzen
          # Non-Fast-Forward oder an einem fehlenden optionalen Dossier-Ordner
          # rot werden.
          #
          # content/ und data/ existieren immer. Die Prüfung über die beiden
          # Wurzelverzeichnisse vermeidet den früheren pathspec-Fehler, wenn
          # in einem Lauf kein Dossier erzeugt wurde. Gestagt werden danach
          # ausschließlich die fachlich-owned Pfade.
          if git status --porcelain -- content/ data/ FAKTENFRISCHE-REPORT.md | grep -q .; then
            bash scripts/git_sync.sh \
              "content(fakten): Belegkette aufgefrischt (Agent Reach + Claude)" \
              content/ \
              data/research/artikel \
              data/faktenfrische_queue.json \
              data/faktenfrische_history.jsonl \
              FAKTENFRISCHE-REPORT.md
          else
            echo "Keine Änderungen."
          fi

      # ------------------------------------------------------------
      # Deckungs-Nachweis (Reparatur #912): Der Lauf ist erst fertig,
      # wenn der Rückstand FRISTGERECHT abbaubar ist. Das ist der
      # Schließpfad des Alarms – grün, sobald der Plan konvergiert.
      # Dieselbe Rechnung wie im Report (eine Regel, C19).
      # ------------------------------------------------------------
      - name: Deckungs-Nachweis (Rückstand fristgerecht abbaubar?)
        id: deckung
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/faktenfrische_kapazitaet.py --wache | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: faktenfrische-report
          path: |
            FAKTENFRISCHE-REPORT.md
            data/faktenfrische_queue.json
            data/research/artikel/*.md
          if-no-files-found: ignore

      - name: Fachliche Befunde melden (nur Menschen entscheiden über Text)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Governance C12: Label VOR der Issue-Erzeugung anlegen (HTTP 422).
          gh label create faktenfrische --repo "$GITHUB_REPOSITORY" \
            --color "1d76db" \
            --description "Faktenfrische: fachliche Befunde aus der Recherche" --force || true
          ANZAHL=$(python3 -c "import json;d=json.load(open('data/faktenfrische_queue.json'));print(sum(len(l['befunde']) for l in d['laeufe']))" 2>/dev/null || echo 0)
          SCHWELLE=$(python3 -c "import yaml;print((yaml.safe_load(open('data/agent_reach/faktenfrische.yaml')).get('melden') or {}).get('issue_ab_befunden',3))" 2>/dev/null || echo 3)
          if [ "$ANZAHL" -ge "$SCHWELLE" ]; then
            TITEL="Faktenfrische: $ANZAHL fachliche Befunde ($(date +%F))"
            if ! gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                 --search "in:title \"Faktenfrische:\"" | grep -q .; then
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "$TITEL" --label faktenfrische \
                --body-file FAKTENFRISCHE-REPORT.md
            else
              echo "Offenes Faktenfrische-Ticket existiert – kein Duplikat."
            fi
          else
            echo "$ANZAHL Befunde (< $SCHWELLE) – kein Ticket."
          fi

      # Nach allen Schreib- und Meldeschritten: Eine Unterdeckung ist ein
      # eigener, lauter Befund – kein stiller Ausfall eines Schritts.
      - name: Unterdeckung melden (letzter Schritt = roter Job)
        if: steps.deckung.outcome == 'failure'
        run: |
          echo "::error::Faktenfrische unterdeckt – der Rückstand ist nicht fristgerecht abbaubar (#912). Details im Schritt davor, im Report und in RELEASE-SCORECARD.md."
          exit 1

      - name: Unvollständige Recherche melden
        if: steps.lauf.outcome == 'failure'
        run: |
          echo "::error::Faktenfrische nicht abgeschlossen. Details stehen im Lauf und im Report; betroffene Artikel bleiben unverändert."
          exit 1
