name: Deploy-Catchup

# ============================================================
#  DEPLOY-CATCHUP – Profi-Agentur-Level Drift- & Deploy-Schutz
#  ------------------------------------------------------------
#  Schließt zwei fundamentale Drift-Lücken (Befund Issue #433, 28.09.2026):
#
#  1. GITHUB_TOKEN-Commits: GitHub Actions triggert KEINE Folge-Workflows
#     für Commits, die von Bots/Workflows mit GITHUB_TOKEN gepusht werden.
#     Wartungs-Workflows (SEO, Layout-AI, Backlinks, etc.) committen Fixes,
#     die ohne Catchup nicht live gehen würden.
#
#  2. Skip-Deploy / Verdrängungs-Drift (#433): Ein `deploy.yml`-Push-Lauf,
#     dessen `deploy`-Job wegen reiner State-/Doku-Änderungen übersprungen
#     wurde (`deploy: skipped`), schloss bisher als Workflow-„success“ ab.
#     Der alte Catchup verglich main-HEAD nur mit `listWorkflowRuns(status: success)`
#     und wurde von dem übersprungenen Lauf getäuscht („main == lastRun.head_sha“).
#
#  PREMIUM-ARCHITEKTUR (SSOT: gh-pages Deployed-SHA + Job-Ebene):
#    • Primär: Liest den tatsächlichen Live-Stand direkt aus der Commit-Message
#      des `gh-pages`-Branches (`deploy: <SHA>`).
#    • Fallback/Zweitprüfung: Durchsucht die letzten `deploy.yml`-Läufe nach
#      einem Lauf, dessen `deploy`-Job tatsächlich `conclusion == 'success'` hatte.
#    • Diff-Filter: Wenn main vom Live-Stand abweicht, prüft der Catchup via
#      Compare-API gegen die STATE_ONLY-Negativliste. Reine State-Änderungen
#      lösen keinen unnötigen Deploy aus; jede Site-Änderung triggert SOFORT.
#    • In-Flight-Schutz: Verhindert doppeltes Auslösen, wenn bereits ein
#      Deploy-Lauf aktiv oder in der Warteschlange ist.
#    • Schedule-Backstop: Läuft zusätzlich stündlich als Sicherheitsnetz.
# ============================================================

on:
  workflow_dispatch: {}
  schedule:
    - cron: "20 * * * *"   # Stündlich als ausfallsichere Drift-Wache
  workflow_run:
    workflows:
      - "Wöchentliche SEO-Optimierung"
      - "Content-Engine v2"
      - "Kadenz-Endkontrolle (Mo/Mi/Fr – 2–3 LIVE erzwingen)"
      - "Affiliate-Health (Wochenwache)"
      - "Backlink-Automation"
      - "Layout-AI"
      - "Quartalsweises Artikel-Update"
      - "Wöchentliches Nach-Pinnen"
      - "Mastodon-Profil-Sync"
      - "Mastodon-Manueller-Post"
      - "Social-Media-AI"
      - "Pinterest-AI"
      - "Pinterest-Watchdog"
      - "FrankAutoOps-Report"
      - "Affiliate-Integritäts-Wache (täglich)"
      - "Saisonaler Hero-Refresh (Agent Reach + Claude)"
      - "Blog-Gesundheits-Check (täglich)"
      - "Mastodon-SEO"
      - "Premium-Governance"
      # AUDIT 30.09. (Redundanz-/Lückenprüfung): Diese fünf Läufe committen
      # Content-Heilungen per GITHUB_TOKEN – sie lösen selbst keinen Deploy
      # aus und fehlten im Schnellpfad. Ohne Eintrag warteten ihre Fixes
      # bis zur stündlichen Backstop-Runde statt Minuten nach Commit.
      - "Hemingway-Lesbarkeitscheck (Mo/Mi/Fr)"   # Offline-Kette heilt Grammatik/Glätte und meldet Lesbarkeit
      - "ZEIT-Niveau Rechtschreib-Wache"  # heilt eindeutige Rechtschreib-Fälle
      - "Redaktions-Standard Bestand (Capital/WiWo/ZEIT)"   # KI-Hebung von 3 Altartikeln/Woche
      - "Faktenfrische (Bestand)"         # aktualisiert Zahlen/Daten im Bestand
      - "Redaktions-Politur (Sprachglatt + Grammatik, offline)"  # manueller Notlauf, committet content/
    types:
      - completed

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-catchup
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Live-Stand (gh-pages) und Deploy-Job-Erfolg mit main vergleichen, ggf. anstoßen
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 1) Aktuellen HEAD von main ermitteln
            const mainRef = await github.rest.git.getRef({
              owner, repo, ref: 'heads/main',
            });
            const mainSha = mainRef.data.object.sha;
            console.log(`🔍 Aktueller main HEAD: ${mainSha.slice(0, 7)}`);

            // 2) Live-Deploy-SHA direkt aus dem gh-pages Branch ermitteln (SSOT)
            let liveDeploySha = null;
            try {
              const ghPagesCommit = await github.rest.repos.getCommit({
                owner, repo, ref: 'gh-pages',
              });
              const msg = ghPagesCommit.data.commit.message || '';
              const match = msg.match(/deploy:\s*([0-9a-f]{40})/i);
              if (match) {
                liveDeploySha = match[1].toLowerCase();
                console.log(`🌐 Live auf gh-pages : ${liveDeploySha.slice(0, 7)}`);
              } else {
                console.log(`ℹ️ gh-pages Commit-Message enthält keine SHA ("${msg.slice(0, 60)}...")`);
              }
            } catch (err) {
              console.log(`⚠️ Konnte gh-pages Ref nicht lesen: ${err.message}`);
            }

            // 3) Letzten Lauf ermitteln, dessen deploy-JOB wirklich 'success' war
            let lastSuccessfulJobSha = null;
            try {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'deploy.yml', status: 'success', per_page: 15,
              });
              for (const run of runs.data.workflow_runs || []) {
                const jobs = await github.rest.actions.listJobsForWorkflowRun({
                  owner, repo, run_id: run.id,
                });
                const deployJob = jobs.data.jobs.find(j => j.name === 'deploy' || j.name.toLowerCase().startsWith('deploy'));
                if (deployJob && deployJob.conclusion === 'success') {
                  lastSuccessfulJobSha = run.head_sha.toLowerCase();
                  console.log(`🏗️ Letzter echter Deploy-Job-Erfolg: Run ${run.id} auf ${lastSuccessfulJobSha.slice(0, 7)}`);
                  break;
                }
              }
            } catch (err) {
              console.log(`⚠️ Konnte Deploy-Workflow-Jobs nicht prüfen: ${err.message}`);
            }

            // Effektive Basis für den Vergleich wählen:
            const baseSha = liveDeploySha || lastSuccessfulJobSha;
            console.log(`📊 Effektive Deploy-Basis: ${baseSha ? baseSha.slice(0, 7) : 'keine (Erst-Deploy nötig)'}`);

            // 4) Wenn main exakt dem Live-Stand entspricht -> nichts zu tun
            if (baseSha === mainSha) {
              console.log(`✅ main (${mainSha.slice(0, 7)}) ist deckungsgleich mit dem Live-Stand – kein Handlungsbedarf.`);
              return;
            }

            // 5) Prüfen, ob bereits ein Deploy-Lauf aktiv oder in der Warteschlange ist
            try {
              const activeRuns = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'deploy.yml', per_page: 5,
              });
              const inFlight = (activeRuns.data.workflow_runs || []).filter(
                r => r.status === 'in_progress' || r.status === 'queued' || r.status === 'waiting' || r.status === 'pending'
              );
              if (inFlight.length > 0) {
                console.log(`⏳ Deploy-Lauf ist bereits aktiv/in Warteschlange (Run IDs: ${inFlight.map(r => r.id).join(', ')}) – überspringe Trigger.`);
                return;
              }
            } catch (err) {
              console.log(`Hinweis beim Prüfen aktiver Läufe: ${err.message}`);
            }

            // 6) Relevanz-Prüfung via Compare-API (falls Basis vorhanden)
            const STATE_ONLY_PATTERN = '^(\\.github/.*|docs/.*|scripts/.*|e2e/.*|data/social/.*|data/research/.*|data/audit/.*|data/[^/]*_state\\.json|data/[^/]*_history\\.jsonl|data/[^/]*\\.meta\\.json|data/social_log\\.jsonl|data/secrets_state\\.json|data/pinterest_token_state\\.json|data/integrity_lock\\.json|data/governance_status\\.json|data/governance_history\\.jsonl|data/alerting_heartbeat\\.json|data/revenue_funnel\\.json|static/images/social/.*|\\.[^/]*_state\\.json|\\.casing_report\\.json|\\.indexnow_submitted\\.json|\\.meta_cache\\.json|\\.affiliate_integrity_state\\.json|\\.gitignore|package\\.json|package-lock\\.json|[A-Za-z0-9._-]+\\.md)$';
            const STATE_ONLY = new RegExp(STATE_ONLY_PATTERN);

            let needsDeploy = true;
            if (baseSha) {
              try {
                const comparison = await github.rest.repos.compareCommits({
                  owner, repo, base: baseSha, head: mainSha,
                });
                const changedFiles = (comparison.data.files || []).map(f => f.filename);
                const relevantFiles = changedFiles.filter(f => !STATE_ONLY.test(f));

                if (changedFiles.length > 0 && relevantFiles.length === 0) {
                  console.log(`ℹ️ main (${mainSha.slice(0, 7)}) weicht von der Deploy-Basis (${baseSha.slice(0, 7)}) ab, aber alle ${changedFiles.length} geänderten Dateien sind reine Zustands-/Doku-Pfade. Kein Deploy nötig.`);
                  needsDeploy = false;
                } else if (relevantFiles.length > 0) {
                  console.log(`🚀 ${relevantFiles.length} deploy-relevante Datei(en) zwischen ${baseSha.slice(0, 7)} und ${mainSha.slice(0, 7)} gefunden:`);
                  relevantFiles.slice(0, 10).forEach(f => console.log(`   • ${f}`));
                  needsDeploy = true;
                } else {
                  console.log(`ℹ️ Compare ergab 0 Datei-Änderungen zwischen ${baseSha.slice(0, 7)} und ${mainSha.slice(0, 7)}.`);
                  needsDeploy = false;
                }
              } catch (err) {
                console.log(`⚠️ Compare fehlgeschlagen (${err.message}) – Trigger Deploy (Fehlsicherheit).`);
                needsDeploy = true;
              }
            } else {
              console.log('🚀 Keine Deploy-Basis vorhanden – Trigger Erst-Deploy.');
              needsDeploy = true;
            }

            if (!needsDeploy) {
              return;
            }

            // 7) Deploy anstoßen
            console.log(`🚀 Stoße Deploy-Workflow auf main (${mainSha.slice(0, 7)}) an...`);
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'deploy.yml', ref: 'main',
            });
            console.log('✅ Deploy-Workflow erfolgreich ausgelöst (Drift behoben).');
