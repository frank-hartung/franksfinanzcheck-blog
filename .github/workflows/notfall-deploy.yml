# ============================================================
#  NOTFALL-DEPLOY – Auslieferung ohne Redaktions-Gates
#
#  Sicherheitsaudit 14.10.2026 (M-12): Zwischen 07.10. und 14.10. scheiterten
#  11 von 26 Deploys an einem redaktionellen Schritt (Quote-Nachfüllung).
#  Eine redaktionelle Zielgröße darf nie eine Rechtskorrektur, einen
#  Sicherheitsfix oder eine Löschpflicht (DSGVO Art. 17, Abmahnung) aufhalten.
#
#  Dieser Workflow baut `main` und liefert ihn direkt an GitHub Pages aus –
#  OHNE Quote, Scorecard, Stil- und Redaktions-Gates. Er behält nur, was die
#  Sicherheit betrifft: verifizierter Hugo-Download (Prüfsumme), Roh-HTML-
#  Gate (Skript-/Event-Handler-Injektion in Inhalten), erfolgreicher Build.
#
#  Audio und andere Laufzeit-Artefakte (Vorlese-Dateien) übernimmt er aus
#  dem letzten Live-Stand (Branch gh-pages), damit nichts verschwindet.
#
#  Auslösen: Actions → „Notfall-Deploy“ → Run workflow → Grund eintragen,
#  Bestätigung exakt „NOTFALL“. Nur Personen mit Schreibrecht können das.
#  Der reguläre Deploy läuft beim nächsten Push wieder vollständig.
# ============================================================
name: Notfall-Deploy (ohne Redaktions-Gates)

on:
  workflow_dispatch:
    inputs:
      grund:
        description: "Grund (erscheint im Protokoll), z. B. „Rechtskorrektur Impressum“"
        required: true
        type: string
      bestaetigung:
        description: "Zur Bestätigung exakt NOTFALL eintragen"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    name: Bauen (nur Sicherheits-Gates)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # ASSET-VERSION (Live-Probe 25.10.2026, gleichlautend mit deploy.yml):
    # Der Notfall-Pfad muss dieselbe Auslieferungsqualität liefern wie der
    # reguläre Deploy – sonst rotiert ausgerechnet im Notfall die
    # sw.js-Cache-Generation nicht (VERSION="dev") und Asset-URLs tragen
    # kein ?v=<sha>.
    env:
      HUGO_JSDELIVR_SHA: ${{ github.sha }}
    steps:
      - name: Bestätigung prüfen
        env:
          GRUND: ${{ inputs.grund }}
          BESTAETIGUNG: ${{ inputs.bestaetigung }}
        run: |
          set -euo pipefail
          if [ "$BESTAETIGUNG" != "NOTFALL" ]; then
            echo "::error::Bestätigung fehlt – exakt NOTFALL eintragen."
            exit 1
          fi
          if [ "${#GRUND}" -lt 5 ]; then
            echo "::error::Bitte einen nachvollziehbaren Grund angeben."
            exit 1
          fi
          {
            echo "## 🚨 Notfall-Deploy"
            echo ""
            echo "- Grund: ${GRUND}"
            echo "- Ausgelöst von: ${GITHUB_ACTOR}"
            echo "- Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Repository auschecken (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Letzten Live-Stand holen (gh-pages, für Audio-Dateien)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: .live
          persist-credentials: false
        continue-on-error: true

      - name: Python bereitstellen
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Roh-HTML-Gate (Sicherheit, fail-closed)
        run: python3 scripts/roh_html_gate.py --gate

      - name: Hugo installieren (Extended, Prüfsumme verifiziert)
        uses: ./.github/actions/install-hugo
        with:
          version: "0.168.0"

      - name: Build
        uses: ./.github/actions/hugo-build
        with:
          args: "--minify"
          label: "Notfall-Build"

      - name: Laufzeit-Artefakte aus dem Live-Stand übernehmen
        run: |
          set -euo pipefail
          if [ -d .live ]; then
            # Nur Dateien, die der neue Build NICHT erzeugt (z. B. Vorlese-Audio).
            rsync -a --ignore-existing --exclude '.git' .live/ public/
            echo "Übernommen: $(cd .live && find . -type f -not -path './.git/*' | wc -l) Dateien geprüft."
          else
            echo "::warning::gh-pages nicht lesbar – Auslieferung ohne Vorlese-Audio."
          fi

      - name: Manifest-Wache (package.json & Lockfile vor npm ci)
        run: |
          python3 scripts/manifest_guard.py --selftest
          python3 scripts/manifest_guard.py

      - name: Node bereitstellen
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Suchindex erzeugen
        run: |
          set -euo pipefail
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npm run --silent suchindex
          test -s public/pagefind/pagefind.js

      - name: Pages konfigurieren
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public
          # Versteckte Dateien mitnehmen (Begründung ausführlich in
          # deploy.yml): ohne diese Option liefert /.well-known/security.txt
          # live 404 (upload-pages-artifact v4+ schließt Dotfiles per
          # --exclude=.[^/]* aus).
          include-hidden-files: true

  ausliefern:
    name: An GitHub Pages ausliefern
    needs: bauen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deployment auslösen
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
