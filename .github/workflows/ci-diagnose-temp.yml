name: CI-Diagnose (temporär, wird wieder entfernt)

# NUR zur Fehlersuche am 04.11.2026: Der Job `regression` ist auf einem Branch
# rot, lokal aber grün, und die Job-Logs sind über die API nicht abrufbar
# (EOF). Dieser Lauf wiederholt genau Schritt 10 und schreibt den Befund in
# die Step-Summary, die per API lesbar ist.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install -q --require-hashes -r "$GITHUB_WORKSPACE/requirements-ci.txt"
      - name: Hugo Extended installieren
        uses: ./.github/actions/install-hugo
        with:
          version: "0.168.0"
      - name: Echter Hugo-Produktionsbuild (kein Mock)
        uses: ./.github/actions/hugo-build
        with:
          args: --minify --destination public --cleanDestinationDir
      - name: Schritt 10 en bloc – Befund in die Summary
        if: ${{ always() }}
        run: |
          set +e
          {
            echo '## Reproduktion Schritt 10 (Code-Regression)'
            echo ''
            echo '```'
            python3 -V
            python3 -c "import yaml; print('pyyaml', yaml.__version__)"
            echo '--- Suite (nur Ergebnis) ---'
            python3 -m unittest discover -s scripts/tests 2>&1 | tail -60
            echo "suite_exit=$?"
            for s in engine_generate reserve_pool cadence_guard fm_boundary_guard social_studio; do
              echo "--- $s --selftest ---"
              python3 "scripts/$s.py" --selftest 2>&1 | tail -25
              echo "${s}_exit=$?"
            done
            echo '--- fm_boundary_guard --check ---'
            python3 scripts/fm_boundary_guard.py --check 2>&1 | tail -25
            echo "check_exit=$?"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
