# ============================================================
#  BACKLINK-AUTOMATION (wöchentlich, Montag 08:00 MESZ)
#
#  Der Scout prüft die kuratierten Backlink-Opportunities
#  (data/backlink_prospects.yaml), priorisiert sie nach Passung
#  und generiert personalisierte Outreach-Texte in
#  BACKLINK-REPORT.md. Das ABSENDEN bleibt bewusst manuell
#  (Qualitäts-Gate – automatisches Posten wäre Spam).
#
#  Der Report wird als CI-Artefakt gesichert (seit dem Profi-Cleanup
#  31.08.2026 bewusst nicht mehr versioniert); der CRM-Stand
#  data/backlink_state.json wird weiterhin committet.
#
#  Zeitzonen: GitHub-Cron läuft UTC. MESZ = UTC+2, MEZ = UTC+1.
#    Sommerzeit: 06:00 UTC = 08:00 MESZ
#    Winterzeit: 07:00 UTC = 08:00 MEZ
# ============================================================
name: Backlink-Automation

on:
  schedule:
    - cron: "0 9 * * 1"    # Mo 11:00 MESZ – entzerrt (Profi-Cleanup 20.08.)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:          # AUDIT-FIX
  group: backlink
  cancel-in-progress: false

jobs:
  backlink-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python + Abhängigkeiten
        run: pip install -q pyyaml

      - name: Backlink-Scout ausführen
        run: python3 scripts/backlink_automation.py

      - name: Report + Status committen
        run: |
          git config user.name "Backlink-Bot"
          git config user.email "backlink-bot@users.noreply.github.com"
          # BACKLINK-REPORT.md ist seit dem Profi-Cleanup (31.08.2026)
          # bewusst ignoriert (.gitignore) und wird im nächsten Schritt
          # als CI-Artefakt gesichert – ein git add darauf würde den Lauf
          # mit Exit 1 abbrechen (Fix #205-Klasse). Versioniert wird nur
          # der CRM-Stand in data/backlink_state.json (data/backlink_prospects.yaml
          # bleibt kuratiert und wird vom Scout nie überschrieben).
          git add data/backlink_state.json data/backlink_prospects.yaml
          if git diff --cached --quiet; then
            echo "Keine Änderungen – Report ist aktuell."
          else
            git commit -m "backlinks: wöchentlicher Scout-Report generiert"
            scripts/git_sync.sh --push-only
          fi

      - name: Backlink-Report als Artefakt sichern (bewusst nicht versioniert)
        uses: actions/upload-artifact@v7
        with:
          name: backlink-report-${{ github.run_id }}
          path: BACKLINK-REPORT.md
          if-no-files-found: warn
          retention-days: 90
