# ============================================================
#  PINTEREST-WATCHDOG – täglicher Profi-Check mit Selbstheilung
#  ------------------------------------------------------------
#  Läuft täglich 05:30 UTC + manuell:
#    python3 scripts/pinterest_check.py --fix
#  - prüft alle Pinterest-Signale (robots.txt, Domain-Verify,
#    Pin-Button, Description-Einzigartigkeit, Media, Rich-Pin-Meta,
#    Hashtags, Profil-Link)
#  - heilt automatisch (Selbstheilung) mit Sabotage-Schutz
#    (Selbsttest vor jeder Fix-Aktion; Exit 2 = nichts verändert)
#  - bei verbleibenden Problemen: GitHub-Issue (Label "pinterest")
#  - Report: PINTEREST-REPORT.md (Commit + Push)
# ============================================================
name: Pinterest-Watchdog

on:
  schedule:
    - cron: "30 4 * * *"   # 06:30 MESZ – entzerrt (Profi-Cleanup 20.08.)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: pinterest-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Hugo installieren
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true
          
      - name: Pinterest/Google-SEO-Healer (Titel, Cover, Pin-Texte)
        # Frontmatter heilen BEVOR Hugo baut – Pin-Button + og-Tags lesen
        # pin_description/Titel aus dem geheilten Content.
        continue-on-error: true
        run: |
          python3 -m pip install -q pyyaml cryptography pillow pillow-avif-plugin 2>/dev/null || true
          python3 scripts/pinterest_seo_healer.py --fix || true

      - name: Seite bauen (für Pin-Button-/og-Checks)
        env:
          HUGO_JSDELIVR_SHA: ${{ github.sha }}
        run: hugo --minify

      - name: Spam-Wache (Google/Pinterest – Blog, Feed, CSV, API + Live-Pin-Sync)
        # Dauerauftrag (26.08.2026): täglich ALLE 4 Kanäle prüfen + heilen:
        #   Blog (Claims/Stuffing/Disclosure/Originalität/Klon),
        #   RSS-Feed /index.xml (Quelle des Pinterest-Auto-Publish),
        #   CSV (falls vorhanden), API (Rate-Limits + Pause-Zustand).
        # --sync-pins registriert die LIVE-Pins der Boards (inkl. RSS-Auto-
        # Publish) in data/pin_history.jsonl → API- und CSV-Kanal dürfen nie
        # denselben Artikel (< 30 Tage) erneut pinnen. Repeat-Pin ist das
        # häufigste Spam-Signal gegen das Konto.
        # Selftest-Schutz: ohne grünen Selftest wird NICHTS verändert.
        env:
          PINTEREST_TOKEN_KEY: ${{ secrets.PINTEREST_TOKEN_KEY }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: |
          python3 scripts/spam_guard.py --selftest
          python3 scripts/spam_guard.py --check blog feed csv api --fix || true
          python3 scripts/spam_guard.py --sync-pins || true

      - name: Pinterest-Check mit Selbstheilung
        id: check
        run: |
          set +e
          python3 scripts/pinterest_check.py --fix
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e

      # Täglicher Nachweis für die Secrets-Wache (#206): der Pinterest-Token läuft
      # nach 30 Tagen ab. Der Governance-Lauf prüft wöchentlich – dieser Lauf
      # bestätigt ihn täglich live, damit „Token tot" nie erst nach Wochen auffällt.
      # Erneuert wird NICHT hier, sondern in `pinterest-token.yml` (eine Stelle,
      # ein Refresh-Token, keine Rotations-Kollisionen).
      - name: Pinterest-Token live verifizieren (Nachweis für die Secrets-Wache)
        if: always()
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_TOKEN_KEY: ${{ secrets.PINTEREST_TOKEN_KEY }}
        run: |
          python3 scripts/secrets_age_guard.py --verify-only PINTEREST_ACCESS_TOKEN --quiet \
            || echo "::warning::Pinterest-Token nicht bestätigt (401/403 = erneuern: scripts/pinterest_auth.py --auth-url)"

      - name: Report committen + pushen
        if: always()
        run: |
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: Pinterest-Selbstheilung + Report"
            scripts/git_sync.sh --push-only
          fi

      # 07.09.2026 (#209): Der Lauf vom 07.09. ist NICHT am Pinterest-Check
      # gescheitert, sondern an dieser Meldung: `gh issue create --label pinterest`
      # mit einem Label, das im Repository nie angelegt wurde → HTTP 422 → roter
      # Lauf → Fehler-Alerting öffnet ein Issue über das Issue, das nicht
      # geschrieben werden konnte. Ein Melder, der am Melden scheitert, ist der
      # teuerste Fehler im ganzen Betrieb. Deshalb: Label immer erst sicherstellen
      # (Governance-Vertrag C12 prüft das ab jetzt für jeden Workflow).
      - name: Label sicherstellen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create pinterest --repo "$GITHUB_REPOSITORY" --color "e60023" \
            --description "Pinterest-Kanal: Befunde des Watchdogs" --force || true

      - name: Issue bei Problemen eröffnen
        if: steps.check.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --state open --label pinterest \
            --json number --jq '.[0].number' 2>/dev/null || echo "")
          TS=$(date -u '+%Y-%m-%d %H:%M UTC')
          if [ -z "$EXISTING" ]; then
            gh issue create --title "Pinterest-Check: Probleme gefunden" \
              --label pinterest \
              --body "**$TS** – Der Pinterest-Watchdog hat Probleme gefunden (Exit ${{ steps.check.outputs.exit }}). Details im PINTEREST-REPORT.md."
            echo "Issue erstellt"
          else
            gh issue comment "$EXISTING" \
              --body "**$TS** – weiterhin Probleme (Exit ${{ steps.check.outputs.exit }})."
            echo "Issue kommentiert"
          fi

      - name: Issue bei Erfolg schließen
        if: steps.check.outputs.exit == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --state open --label pinterest \
            --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" \
              --comment "✅ **$(date -u '+%Y-%m-%d %H:%M UTC')** – alle Pinterest-Signale im Profi-Bereich."
            echo "Issue geschlossen"
          fi
