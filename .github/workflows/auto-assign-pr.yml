name: 🤖 Auto-Assign PR zu frank-hartung

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  auto-assign:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: auto-assign-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const actor = context.actor;
            const bots = ['arena-ai-coding-agent[bot]', 'dependabot[bot]'];
            
            if (bots.includes(actor)) {
              github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                assignees: ['frank-hartung']
              });
              console.log('✅ PR assigned to @frank-hartung');
            }