# ============================================================
#  LAYOUT-AI (Layout-Automatisierung, Top-Level)
#
#  Prüft die gebaute Website automatisch auf Layout-Integrität:
#    - Statisches Audit (layout_audit.py):
#        · interne Links (404-Finder)
#        · Cover-Varianten, Alt-Texte im gerenderten Inhalt
#        · Schema-JSON-LD, og:image, Meta, H1
#        · DOM-BUDGET für JEDE Seite (dom_audit.py, browser-treu, ohne
#          Chrome): Kinder je Element, Kinder im <head>, Tiefe, Elemente
#        · Chunker-Vertrag (Text-Teilung greift nur auf Blockebene)
#    - Browser-Audit (layout_browser_check.js, Puppeteer/Chrome):
#        Startseite + 3 neueste Artikel + die statisch schwersten Seiten
#        in Desktop & Mobile – HTTP-Fehler, JS-Fehler, DOM-Budgets,
#        Titel/H1, Ladezeit. Rechnet die Browser-Messwerte gegen die
#        statischen Parser-Werte (Parser-Drift wird sichtbar).
#    - Auto-Heilung: fehlende Cover-Varianten werden nachgezogen
#      (check_covers.py --fix) und committet
#    - Report: LAYOUT-REPORT.md im Repo (gitignored, Lauf-Artefakt)
#    - Bei Befunden: Issue mit Marker aktualisieren (nie duplizieren),
#      bei Grün automatisch schließen – kein Dauer-Issue wie #338.
#
#  UMBau 21.09.2026 (Issue #338 – „Layout-Automatisierung meldet
#  Probleme", dauerhafte Behebung):
#    1. Der Bau läuft jetzt mit `hugo --minify` – ALSO DER AUSGELIEFERTE
#       Stand (deploy.yml baut identisch). Vorher maß der Audit einen
#       unminifizierten Baum, den niemand zu sehen bekommt.
#    2. Kritische Befunde sind kein stiller Report mehr: der Lauf wird
#       rot UND das Issue trägt die Zahlen. Frühwarnungen bleiben grün
#       (sie stehen im Report) – sonst entsteht wieder ein Dauer-Alarm.
#    3. Grün schließt das offene Issue. Ein Issue, das nach der Heilung
#       offen bleibt, ist ein Alarm ohne Schließpfad (Regel #272).
#
#  Läuft: wöchentlich (Mo 09:00 MESZ), manuell – bei Pull Requests, die
#  Layout/Struktur anfassen (layouts/, assets/css/, die Audit-Skripte) – und
#  bei Merges auf `main`, die dieselben Pfade betreffen.
#
#  WARUM DER PUSH-TRIGGER (Meldung #900, 30.10.2026): Die Heilung eines
#  Layout-Befunds reist über einen Pull Request. Der PR-Lauf darf keine Issues
#  pflegen (siehe unten), also blieb die Meldung nach dem Merge OFFEN – bis zum
#  nächsten Montag, im Fall #900 sogar über den Merge von PR #937 hinaus. Ein
#  geheilter Alarm, der eine Woche offen steht, ist genau der Dauer-Alarm, den
#  dieser Workflow abschaffen soll (Regel #272). Der Push-Lauf schließt die
#  Meldung dort, wo sie entsteht: auf `main`, mit demselben Bau und demselben
#  Audit wie der Wochenlauf.
#
#  KEINE ENDLOSSCHLEIFE: Die Pfadliste ist eng (Layout, CSS, Audit-Skripte,
#  dieser Workflow). Deploy- und Inhalts-Commits lösen nichts aus, und die
#  Auto-Heilung (die selbst committet) läuft NUR bei `schedule` und
#  `workflow_dispatch` – ein Push-Lauf schreibt nie. Damit kann sich der Lauf
#  nicht selbst anstoßen, und `git_sync.sh` bleibt der einzige Schreiber.
#
#  Die Pfadliste enthält bewusst auch die Wachen selbst (Audit-Skripte, ihre
#  Tests, Annotationen-Übersetzer): Ändert jemand die Prüfung, prüft die
#  Prüfung das mit. Sonst wäre ein Commit an `test_dom_audit.py` oder
#  `layout_annotations.py` der einzige, der nie gegen einen echten Lauf läuft.
#
#  Pull-Request-Modus: identischer Bau + identischer Audit (inkl. Browser),
#  aber OHNE Auto-Heilung und OHNE Issue-Pflege – ein PR darf keine Commits
#  in den Branch schreiben und keine Alarm-Issues erzeugen. Befunde machen
#  den Lauf rot (Gate); Befundbericht steht in der Job-Summary.
# ============================================================
name: Layout-AI

on:
  schedule:
    - cron: "0 7 * * 1"    # Montag 09:00 MESZ (07:00 UTC)
  workflow_dispatch: {}
  # Merge auf main = der Stand, der ausgeliefert wird. Nur diese Pfade lösen
  # aus; die Liste MUSS der PR-Liste entsprechen – sonst prüft der Push-Lauf
  # etwas anderes als der PR (Wächter: test_layout_ai_bauausfall.py).
  push:
    branches: ["main"]
    paths:
      - "layouts/**"
      - "assets/css/**"
      - "assets/css/extended/**"
      - "scripts/dom_audit.py"
      - "scripts/layout_audit.py"
      # WF-9FD5: Der Bau prüft das Frontmatter (scripts/frontmatter_wache.py).
      # Ändert jemand die Wache, muss dieser Lauf sie prüfen.
      - "scripts/frontmatter_wache.py"
      - "scripts/tests/test_frontmatter_wache.py"
      - ".github/actions/hugo-build/**"
      - "scripts/layout_browser_check.js"
      - "scripts/layout_annotations.py"
      - "scripts/check_covers.py"
      - "scripts/tests/test_dom_audit.py"
      - "scripts/tests/test_layout_annotations.py"
      - "scripts/tests/test_workflow_yaml.py"
      - "scripts/tests/test_layout_ai_bauausfall.py"
      - "scripts/tests/test_layout_audit_bau_basis.py"
      - ".github/workflows/layout-ai.yml"
  pull_request:
    paths:
      - "layouts/**"
      - "assets/css/**"
      - "assets/css/extended/**"
      - "scripts/dom_audit.py"
      - "scripts/layout_audit.py"
      - "scripts/frontmatter_wache.py"
      - "scripts/tests/test_frontmatter_wache.py"
      - ".github/actions/hugo-build/**"
      - "scripts/layout_browser_check.js"
      - "scripts/layout_annotations.py"
      - "scripts/check_covers.py"
      - "scripts/tests/test_dom_audit.py"
      - "scripts/tests/test_layout_annotations.py"
      - "scripts/tests/test_workflow_yaml.py"
      - "scripts/tests/test_layout_ai_bauausfall.py"
      - "scripts/tests/test_layout_audit_bau_basis.py"
      - ".github/workflows/layout-ai.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: layout-ai
  cancel-in-progress: false

jobs:
  layout-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Job-Ebene: Composite-Actions sehen Job-Variablen, Schritt-`env:` nicht.
      HUGO_JSDELIVR_SHA: ${{ github.sha }}
      ISSUE_MARKER: "<!-- layout-ai-report -->"
      ISSUE_TITLE: "⚠ Layout-Automatisierung: Probleme gefunden"
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hugo installieren (Extended, verifiziert, mehrquellig)
        uses: ./.github/actions/install-hugo
        with:
          version: "0.168.0"

      # WF-9FD5 (Meldung #901, 26.10.2026): Ein toter Bau ist KEIN „Befund".
      # Damals starb dieser Schritt an einem unquotierten Doppelpunkt im
      # Frontmatter EINER Content-Datei; die Folgeschritte liefen weiter, der
      # Bericht blieb leer und der Schluss-Schritt meldete „kritische Befunde
      # (Exit 1)" – eine erfundene Zahl (STATIC_EXIT war nie gesetzt). Die
      # Meldung riet deshalb zu „API-Key abgelaufen".
      # Jetzt: id + tolerierter Fehlschlag, damit Bericht, Summary und Meldung
      # noch geschrieben werden – rot wird der Lauf am Ende, mit der ECHTEN
      # Ursache aus `erste-fehlerzeile`.
      - name: "Website bauen (identisch zur Produktion, minifiziert)"
        id: build
        continue-on-error: true
        uses: ./.github/actions/hugo-build
        with:
          args: "--minify"
          label: "Layout-Audit-Build"

      # Eine Wahrheit für alle Folgeschritte. Nur der Exit-Code wandert in die
      # Umgebung (Zahl, nichts Ausführbares); die Fehlerzeile selbst reist als
      # `env:` in die Schritte, die sie anzeigen – niemals als Shell-Text.
      - name: "Bauergebnis verankern (nicht raten)"
        if: ${{ always() }}
        env:
          BAU_RC: ${{ steps.build.outputs.rc }}
          FM_RC: ${{ steps.build.outputs.frontmatter }}
        run: |
          bau_rc="${BAU_RC:-}"
          if [ -z "$bau_rc" ]; then
            # Kein rc = die Action kam nicht bis zum Bau (Vorprüfung schon rot).
            # Das ist ein eigener Zustand, keine 0.
            bau_rc="unbekannt"
          fi
          echo "BAU_EXIT=${bau_rc}" >> "$GITHUB_ENV"
          echo "FM_EXIT=${FM_RC:-}" >> "$GITHUB_ENV"
          echo "Bau: ${bau_rc} · Frontmatter-Vorprüfung: ${FM_RC:-nicht gelaufen}"

      # ============ STATISCHES AUDIT ============
      - name: Statisches Layout-Audit (Links, Covers, Alt-Texte, DOM-Budget)
        id: static
        # Ohne gebaute Seite gibt es nichts zu vermessen. Vorher lief der
        # Schritt gegen ein leeres `public/` und lieferte Befunde über Seiten,
        # die es nicht gab.
        if: ${{ !cancelled() && env.BAU_EXIT == '0' }}
        run: |
          set +e
          python3 scripts/layout_audit.py 2>&1 | tee /tmp/layout-audit.log
          code=${PIPESTATUS[0]}
          set -e
          echo "STATIC_EXIT=$code" >> "$GITHUB_ENV"
          if [ "$code" -eq 0 ]; then
            echo "✅ Statisches Audit ohne kritische Befunde."
          else
            echo "::error::Statisches Layout-Audit: kritische Befunde (Exit $code)."
          fi
          # Der Lauf wird erst im letzten Schritt rot: Report, Issue und
          # Summary sollen auch bei Befunden noch geschrieben werden.
          exit 0

      # ============ AUTO-HEILUNG: Cover nachziehen ============
      # Schreibt Commits und pusht sie – das darf NUR der geplante bzw. der
      # ausdrücklich gestartete Lauf. Ein Push-Lauf (Merge auf main) prüft und
      # meldet, aber schreibt nie: sonst stieße er über `git_sync.sh` den
      # nächsten Push-Lauf an (Endlosschleife) und würde im Namen des Merges
      # ungefragt Inhalte ändern.
      - name: Auto-Heilung – fehlende Cover-Varianten nachziehen
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.event_name != 'push' }}
        continue-on-error: true
        run: |
          pip install -q --require-hashes -r "$GITHUB_WORKSPACE/requirements-ci.txt"
          python3 scripts/check_covers.py --fix || true
          git config user.name "Layout-Bot"
          git config user.email "layout-bot@users.noreply.github.com"
          git add -A static/ content/
          if git diff --cached --quiet; then
            echo "Keine Cover-Fixes nötig."
          else
            git commit -m "fix: Layout-Automatisierung – Cover-Varianten nachgezogen"
            scripts/git_sync.sh --push-only
            echo "✅ Cover-Fixes gepusht"
          fi

      # ============ BROWSER-AUDIT (Puppeteer) ============
      - name: Browser-Audit (Chrome headless – Performance & Fehler)
        id: browser
        # Ohne `public/` gibt es keine Seite zu laden. Der Audit meldete
        # vorher „übersprungen" – ein Skip, der wie ein grünes Ergebnis aussah.
        if: ${{ !cancelled() && env.BAU_EXIT == '0' }}
        run: |
          # Robuste Einrichtung: apt-get-Update zuerst, Fehler dürfen den
          # Step NICHT crashen (exit 100 bei fehlendem Paket-Index) – der
          # Browser-Audit ist weich (sauberer Skip mit Exit 2).
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq libnspr4 libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libxdamage1 libxkbcommon0 libasound2 libatspi2.0-0 libxcomposite1 libxrandr2 \
            libgbm1 libdrm2 libcups2 libpango-1.0-0 libcairo2 >/dev/null 2>&1 || true
          # Lieferkette (Audit 14.10.2026, M-09): Versionen fest, keine Install-Skripte.
          npm install -g --ignore-scripts puppeteer-core@25.14.0 >/dev/null 2>&1 || true
          export NODE_PATH=$(npm root -g)
          CHROME_DIR=$(npx -y @puppeteer/browsers@3.2.5 install chrome-headless-shell@stable 2>/dev/null | grep -oE '/[^ ]+chrome-headless-shell$' | tail -1) || true
          echo "CHROME: $CHROME_DIR"
          if [ -z "$CHROME_DIR" ]; then
            echo "::warning::Chrome konnte nicht installiert werden – Browser-Audit übersprungen (das statische DOM-Budget hat trotzdem JEDE Seite vermessen)."
            echo "BROWSER_EXIT=2" >> "$GITHUB_ENV"
            exit 0
          fi
          set +e
          # Kein fester Port mehr: der Audit nimmt einen freien (LAYOUT_PORT=0)
          # – eine Portkollision war früher ein Werkzeugfehler, kein Befund.
          # Exit 3 = kein messbarer Bau (fail-closed), 2 = ohne Chrome
          # übersprungen. Das Skript unterscheidet beides seit #900.
          LAYOUT_BASE=$PWD/public CHROME_PATH="$CHROME_DIR" \
            node scripts/layout_browser_check.js > /tmp/browser-audit.json 2>/tmp/browser-audit.log
          code=$?
          set -e
          cat /tmp/browser-audit.log || true
          cat /tmp/browser-audit.json || true
          echo "BROWSER_EXIT=$code" >> "$GITHUB_ENV"
          exit 0

      # ============ BEFUNDE ALS ANNOTATIONEN ============
      # Befunde gehören dorthin, wo entschieden wird: in die Checks-/PR-Ansicht.
      # Vorher standen sie nur im Log und im Job-Summary – genau deshalb wurde
      # #338 zum Dauer-Issue. Kritische Befunde werden ::error:: (rot), Früh-
      # warnungen ::warning:: (gelb, ohne roten Lauf), plus eine ::notice:: mit
      # den Kennzahlen des Laufs.
      - name: Befunde als Annotationen veröffentlichen
        if: ${{ always() }}
        run: |
          python3 scripts/layout_annotations.py --dom .cache/layout/dom-audit.json --browser /tmp/browser-audit.json

      # ============ BERICHT IN DIE JOB-SUMMARY ============
      - name: Bericht in die Job-Summary übernehmen
        if: ${{ always() }}
        env:
          # Untrusted Text reist als Umgebungsvariable, nie als Shell-Quelltext.
          BAU_URSACHE: ${{ steps.build.outputs.erste-fehlerzeile }}
        run: |
          if [ "${BAU_EXIT:-}" != "0" ]; then
            {
              echo "## ⛔ Kein Bau – keine Messung"
              echo ""
              echo "Der Schritt **„Website bauen (identisch zur Produktion, minifiziert)\"** "
              echo "ist gescheitert (Exit \`${BAU_EXIT:-unbekannt}\`). Es wurde **nichts** "
              echo "gemessen: kein DOM-Budget, keine Links, kein Browser-Audit."
              echo ""
              echo "**Erste Fehlerzeile**"
              echo ""
              echo '```'
              echo "${BAU_URSACHE:-(keine Fehlerzeile überliefert – siehe Schritt-Log)}"
              echo '```'
              echo ""
              echo "Häufigste Ursache seit 26.10.2026 (WF-9FD5): ein unquotierter "
              echo "Doppelpunkt im Frontmatter einer Inhaltsdatei. Die Vorprüfung "
              echo "\`scripts/frontmatter_wache.py\` nennt Datei und Zeile und heilt "
              echo "die Klasse mit \`--fix\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f LAYOUT-REPORT.md ]; then
            {
              echo "## 📐 LAYOUT-REPORT (Layout-Automatisierung)"
              echo ""
              cat LAYOUT-REPORT.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f /tmp/browser-audit.json ]; then
            {
              echo ""
              echo "## 🌐 Browser-Audit (Puppeteer)"
              echo ""
              echo '```json'
              cat /tmp/browser-audit.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ============ ISSUE: AKTUALISIEREN / SCHLIESSEN ============
      - name: Issue aktualisieren oder schließen (Dedupe über Marker)
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        continue-on-error: true
        env:
          BAU_EXIT: ${{ env.BAU_EXIT }}
          FM_EXIT: ${{ env.FM_EXIT }}
          BAU_URSACHE: ${{ steps.build.outputs.erste-fehlerzeile }}
        with:
          script: |
            const fs = require('fs');
            const marker = process.env.ISSUE_MARKER;
            // WF-9FD5: Der Bau-Exit ist die ERSTE Frage, nicht die letzte.
            // Vorher stand hier `STATIC_EXIT ?? '1'` – war der Bau gestorben
            // (dann läuft das statische Audit nie), behauptete die Meldung
            // „Statisches Audit: Exit 1" und „kritische Befunde". Eine
            // erfundene Zahl, die drei Stunden Fehlersuche kostete.
            const bauExit = (process.env.BAU_EXIT ?? '').trim();
            const bauOk = bauExit === '0';
            const bauUrsache = (process.env.BAU_URSACHE ?? '').trim();
            const fmExit = (process.env.FM_EXIT ?? '').trim();
            const staticRoh = (process.env.STATIC_EXIT ?? '').trim();
            const browserRoh = (process.env.BROWSER_EXIT ?? '').trim();
            const staticExit = staticRoh === '' ? null : Number(staticRoh);
            const browserExit = browserRoh === '' ? null : Number(browserRoh);
            const staticLief = staticExit !== null;
            const browserLief = browserExit !== null;
            // 0 = grün · 1 = Befunde · 2 = Browser-Audit übersprungen (weich)
            const browserToolError = browserLief && !(browserExit === 0 || browserExit === 1 || browserExit === 2);
            const green = bauOk && staticExit === 0
              && (!browserLief || browserExit === 0 || browserExit === 2);

            const report = fs.existsSync('LAYOUT-REPORT.md')
              ? fs.readFileSync('LAYOUT-REPORT.md', 'utf8') : '_Kein Report erzeugt._';
            let browser = null;
            try { browser = JSON.parse(fs.readFileSync('/tmp/browser-audit.json', 'utf8')); } catch (e) {}
            let browserLog = '';
            try { browserLog = fs.readFileSync('/tmp/browser-audit.log', 'utf8').slice(0, 2000); } catch (e) {}

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });
            // Dedupe über Marker ODER unseren festen Titel: So übernimmt die
            // Automatik auch Issues, die eine ältere Workflow-Version ohne
            // Marker angelegt hat (genau der Fall #338). Ohne diesen Zweig
            // bliebe der alte Alarm offen UND der neue Lauf legte einen
            // zweiten an – zwei Alarme für einen Befund.
            const title = (process.env.ISSUE_TITLE || '').trim();
            const existing = open.filter(i => !i.pull_request
              && ((i.body || '').includes(marker) || (i.title || '').trim() === title));

            if (green) {
              for (const issue of existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `${marker}\n✅ **Layout-Automatisierung grün** `
                    + `(${new Date().toISOString()}, Lauf [${context.runId}]`
                    + `(${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})):\n`
                    + `keine kaputten Links, keine fehlenden Cover, DOM-Budget und `
                    + `Chunker-Vertrag auf allen Seiten eingehalten`
                    + (browserExit === 2 ? ' (Browser-Audit an diesem Lauf übersprungen).' : ' (inkl. Browser-Audit).')
                    + '\n\nIssue wird automatisch geschlossen.',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, state: 'closed', state_reason: 'completed',
                });
                console.log(`✅ Issue #${issue.number} geschlossen (Audit grün).`);
              }
              if (!existing.length) console.log('✅ Audit grün, kein offenes Issue vorhanden.');
              return;
            }

            const bauText = bauOk ? '✅ grün'
              : `⛔ gescheitert (Exit ${bauExit || 'unbekannt'})`;
            const staticText = !staticLief ? 'nicht gelaufen (Bau rot)'
              : (staticExit === 0 ? '✅ ohne kritische Befunde' : `⚠️ Exit ${staticExit}`);
            const browserText = !browserLief ? 'nicht gelaufen (Bau rot)'
              : (browserExit === 2 ? 'übersprungen (kein Chrome)'
                : (browserExit === 0 ? '✅ ohne Befund'
                  : (browserExit === 3 ? '⛔ Werkzeugfehler: kein messbarer Bau (Exit 3)'
                    : `⚠️ Exit ${browserExit}`)));

            const parts = [
              marker,
              bauOk ? '## ⚠️ Layout-Automatisierung meldet Probleme'
                    : '## ⛔ Layout-Automatisierung: der Bau ist gescheitert',
              '',
              `**Lauf:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
                + ` · **Commit:** \`${context.sha.slice(0, 8)}\``,
              `**Bau:** ${bauText} · **Statisches Audit:** ${staticText}`
                + ` · **Browser-Audit:** ${browserText}`,
              '',
            ];
            if (!bauOk) {
              // WF-9FD5: Die Ursache steht im Klartext in der Meldung, nicht
              // hinter einem Link auf ein Rohlog, das nicht überall abrufbar ist.
              parts.push('### Die Website wurde nicht gebaut – es fand KEINE Prüfung statt');
              parts.push('');
              parts.push('**Erste Fehlerzeile:**');
              parts.push('```');
              parts.push(bauUrsache || '(keine Fehlerzeile überliefert – Schritt „Website bauen" im Lauf ansehen)');
              parts.push('```');
              parts.push('');
              if (fmExit === '1') {
                parts.push('Die **Frontmatter-Vorprüfung** hat den Bau gestoppt: Eine Inhaltsdatei '
                  + 'würde Hugo beim Parsen töten. Heilung: '
                  + '`python3 scripts/frontmatter_wache.py --fix` (zitiert die betroffenen Werte, '
                  + 'ohne den Text zu ändern), danach erneut prüfen.');
              } else {
                parts.push('Häufigste Ursache seit 26.10.2026 (WF-9FD5): ein unquotierter '
                  + 'Doppelpunkt im Frontmatter einer Inhaltsdatei. Die Vorprüfung '
                  + '`scripts/frontmatter_wache.py` nennt Datei und Zeile; `--fix` heilt die Klasse.');
              }
              parts.push('');
              parts.push('> Diese Meldung behauptet **keine** Layout-Befunde: Ohne gebaute Seite '
                + 'gibt es keine Messung. Sie schließt sich beim ersten grünen Lauf.');
              parts.push('');
            }
            if (bauOk && staticLief) {
            if (staticExit !== 0) {
              parts.push('### Statisches Audit (vollständiger LAYOUT-REPORT)');
              parts.push('```');
              parts.push(report.slice(0, 4000));
              parts.push('```', '');
            }
            if (browser && browser.criticalPages && browser.criticalPages.length) {
              parts.push('### Browser-Audit');
              for (const p of browser.criticalPages) {
                parts.push(`- **${p.url}** (${p.viewport}): ${p.issues.join('; ')}`);
              }
              parts.push('');
            }
            if (browser && browser.parserCheck && browser.parserCheck.drift.length) {
              parts.push('### Parser-Drift (statischer Audit stimmt nicht mit dem Browser)');
              for (const d of browser.parserCheck.drift.slice(0, 5)) {
                parts.push(`- ${d.url} (${d.viewport}): ${d.drift.join('; ')}`);
              }
              parts.push('');
            }
            if (browserToolError) {
              parts.push('### Werkzeugfehler (fail-closed)');
              parts.push('Der Browser-Audit ist nicht sauber durchgelaufen – '
                + 'der Lauf ist rot, obwohl oben ggf. keine Befunde stehen:');
              parts.push('```');
              parts.push(browserLog || '(kein Log)');
              parts.push('```', '');
            }
            }
            parts.push(`<sub>Report-Artefakt: \`LAYOUT-REPORT.md\` (gitignored) · `
              + `Zahlen: \`.cache/layout/dom-audit.json\` · `
              + `Budget-Quelle: \`scripts/dom_audit.py\`</sub>`);
            const body = parts.join('\n');

            if (existing.length) {
              const issue = existing[0];
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `${marker}\n🔄 Befund aktualisiert (Lauf [${context.runId}]`
                  + `(${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})).`,
              });
              console.log(`🔄 Issue #${issue.number} aktualisiert.`);
              for (const dup of existing.slice(1)) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: dup.number, state: 'closed', state_reason: 'duplicate',
                });
              }
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: process.env.ISSUE_TITLE,
              body,
            });
            console.log('✅ Issue erstellt.');

      # ============ FAIL-CLOSED: ROTER LAUF BEI BEFUNDEN ============
      - name: Lauf rot stellen, wenn Befunde offen sind
        if: ${{ always() }}
        env:
          BAU_URSACHE: ${{ steps.build.outputs.erste-fehlerzeile }}
        run: |
          # Reihenfolge = Wahrheitsreihenfolge (WF-9FD5): erst der Bau, dann
          # die Prüfungen. Ein fehlender Wert ist „nicht gelaufen" – und das
          # ist ein eigener Befund, keine 1 und keine 0.
          bau_exit="${BAU_EXIT:-unbekannt}"
          static_exit="${STATIC_EXIT:-}"
          browser_exit="${BROWSER_EXIT:-}"
          fail=0
          if [ "$bau_exit" != "0" ]; then
            echo "::error title=Bau gescheitert::Die Website wurde nicht gebaut (Exit ${bau_exit}). Es fand KEINE Layout-Prüfung statt. Erste Fehlerzeile: ${BAU_URSACHE:-(nicht überliefert)}"
            fail=1
          else
            if [ -z "$static_exit" ]; then
              echo "::error::Bau grün, aber das statische Layout-Audit ist nicht gelaufen – fail-closed (eine ausgefallene Prüfung ist kein Freibrief)."
              fail=1
            elif [ "$static_exit" != "0" ]; then
              echo "::error::Statisches Layout-Audit: kritische Befunde (Exit $static_exit) – Details in LAYOUT-REPORT.md und im Issue."
              fail=1
            fi
            if [ -z "$browser_exit" ]; then
              echo "::error::Bau grün, aber der Browser-Audit hat kein Ergebnis hinterlassen – fail-closed."
              fail=1
            elif [ "$browser_exit" = "1" ]; then
              echo "::error::Browser-Audit: Befunde auf den geprüften Seiten (Details im Issue)."
              fail=1
            elif [ "$browser_exit" != "0" ] && [ "$browser_exit" != "2" ]; then
              echo "::error::Browser-Audit ist mit Werkzeugfehler abgebrochen (Exit $browser_exit) – fail-closed."
              fail=1
            fi
          fi
          exit $fail
