# CodeQL-Sicherheitswache – die dauerhafte Code-Scanning-Pipeline.
#
# ERSETZT das GitHub-Default-Setup. Nach dem ersten Merge dieses Workflows
# EINMAL das Default-Setup deaktivieren, sonst analysieren zwei Engines
# parallel und die Alert-Liste verdoppelt sich.
#
# Klick-Weg (GitHub-UI, Stand 10/2026). ACHTUNG: Die Einstellungsseite hieß
# bis 2025 "Code security and analysis" – unter diesem Namen ist sie NICHT
# mehr zu finden. Sie heißt jetzt "Advanced Security":
#   Repo → Settings → Seitenleiste, Abschnitt "Security and quality"
#   → Advanced Security → Abschnitt "Code Security"
#   → Zeile "CodeQL analysis" → "..."-Menü rechts → Disable CodeQL
# Direktlink: https://github.com/<owner>/<repo>/settings/security_analysis
#
# Danach einmalig die stale gewordene Konfiguration entfernen, sonst bleiben
# ihre Alerts dauerhaft offen stehen: Reiter "Security and quality"
# → Code scanning → Alert öffnen → "Affected branches" → main
# → Dialog "Configurations analyzing" → alte Konfiguration löschen → Save.
# Diese Wache übernimmt ab dann.
#
# Betriebsmodus:
#   · pull_request auf main : Analyse + hartes Gate (keine Security-Fundstellen
#     im Diff-Zustand), SARIF bleibt im Lauf (kein Upload)
#   · push auf main         : Analyse + SARIF-Upload in die Security-Tab
#   · montags 03:30 UTC     : Freshness-Lauf (neue Queries finden alten Code)
#
# LEHRE AUS ALERT #80: Solange das Default-Setup parallel aktiv ist, kann
# GitHub den SARIF-Upload dieser Advanced-Konfiguration ablehnen. Deshalb läuft
# zusätzlich `klartext-wache`: eine lokale, fail-closed Kontrolle beider
# Python-Clear-Text-Regeln über den ganzen Bestand. Sie hängt weder vom Upload
# noch von der GitHub-Konfiguration ab und verbietet Inline-Unterdrückungen.
#
# Gate-Regel: Jedes Finding mit Security-Severity (js/xss, py/clear-text-…
# usw.) lässt den Lauf FEHLSCHLAGEN und blockiert damit den Pull Request.
# LEHRE AUS ALERT Nr. 87 (26.10.2026): `py/redos` trägt security-severity
# 7.5 – es ist KEIN Qualitäts-Hinweis. Die vier ReDoS-Regeln für Python und
# JavaScript stehen deshalb zusätzlich namentlich in DOKU_SEC, damit das Gate
# auch dann hart bleibt, wenn ein SARIF-Dialekt die Regel-Metadaten weglässt.
# Der eigene Job `redos-wache` prüft die historische Struktur lokal, ohne
# SARIF-Upload und ohne Alert-API. Bericht:
# CODE-SCANNING-ALERT-87-REDAUERHEILUNG-HIGHEND-2026-10-26.md.
name: CodeQL-Sicherheitswache

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  # Top-Level strikt lesend (Least Privilege); Schreibrechte nur im Job `analyze`.
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      # security-events für den SARIF-Upload auf main, pull-requests für die
      # Bilanz-Kommentare der Wache auf Pull Requests.
      contents: read
      security-events: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, python]
    env:
      # KERNEINSTELLUNG DER WACHE – nicht entfernen.
      #
      # Seit codeql-action v3.28 analysiert die Action bei `pull_request`
      # standardmäßig NUR die im Diff berührten Zeilen („diff-informed
      # queries“; die Cleartext-Queries tragen dafür
      # `observeDiffInformedIncrementalMode`). Folge im Echtbetrieb:
      # Ein Pull Request, der die betroffene Datei nicht anfasst, meldete
      # „0 Funde – Gate grün“, während derselbe Commit beim push auf main
      # mit 6 Sicherheits-Fundstellen rot ging (Alert #78: PR #575 grün,
      # derselbe Commit auf main rot). Das Gate war damit keine Wache,
      # sondern eine Diff-Vorschau.
      #
      # `false` erzwingt in JEDEM Ereignis die Vollanalyse des gesamten
      # Codebestands. Ein PR ist nur dann grün, wenn das Repository als
      # Ganzes sauber ist – das ist die Zusage, die dieses Gate gibt.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml
          # Kein queries-Parameter: Die Suiten stehen in der Config-Datei
          # (Default-Suite + security-extended seit 14.10.2026, I-10).
          # AlertSuppression.ql wird ÜBER die Config-Datei geladen (dort mit
          # Sprach-Keys) – NICHT über den packs-Input: der Input überschreibt
          # die Konfiguration und ließ in einem Testlauf die Default-Suite
          # stillschweigend wegfallen (0 Funde trotz 14 realer Funde).

      - name: CodeQL analysieren
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
          # Upload erfolgt erst nach dem Filter-Schritt unten – unterdrückte
          # Funde dürfen nie die Security-Tab erreichen.
          upload: false

      - name: SARIF-Diagnose (Transparenz der Analyse)
        run: |
          set -euo pipefail
          for f in sarif-results/*.sarif; do
            [ -e "$f" ] || { echo "Keine SARIF-Datei – Analyse unvollständig."; exit 1; }
            GESAMT="$(jq '[.runs[].results[]?] | length' "$f")"
            UNTER="$(jq '[.runs[].results[]? | select((.suppressions // []) != [])] | length' "$f")"
            REGLER="$(jq '[.runs[].tool.driver.rules[]?, .runs[].tool.extensions[]?.rules[]?] | length' "$f")"
            echo "::notice::${f}: ${GESAMT} Funde (${UNTER} unterdrückt), ${REGLER} Regeln mit Metadaten"
            echo "${f}: gesamt=${GESAMT} unterdrueckt=${UNTER} regeln=${REGLER}"
          done

      # Kein SARIF-Artefakt mehr (Audit 14.10.2026, I-10): Artefakte
      # oeffentlicher Repos kann jeder angemeldete GitHub-Nutzer laden –
      # offene Fundstellen samt Datei und Zeile waeren vor dem Fix
      # oeffentlich. Die Diagnose oben (Zahlen im Log) und die Security-Tab
      # (nur Maintainer) reichen.

      - name: Unterdrückungen sind selbst ein Befund (Upload & Gate)
        run: |
          set -euo pipefail
          # KEINE Regel darf mehr per Code-Kommentar unterdrückt werden
          # (10.10.2026, Alert #83). Bis dahin standen hier die beiden
          # `incomplete-url-substring-sanitization`-Regeln als „begründete
          # Ausnahme". Genau diese Ausnahme stand sechs Tage später wieder
          # als offener Alert in der Security-Tab: Das parallel laufende
          # GitHub-Default-Setup kennt weder `paths-ignore` noch
          # `# codeql[...]`-Kommentare. Eine Unterdrückung versteckt einen
          # Fund also nur in EINER von zwei Sichten – sie heilt nichts.
          #
          # Folge: Dieser Schritt filtert nichts mehr heraus. Er macht
          # Unterdrückungen sichtbar und lässt den Lauf daran scheitern.
          # CodeQL wertet auch ein nacktes `# noqa`/`# lgtm` als
          # Unterdrückung JEGLICHER Alerts der Zeile – auch das ist hier
          # ein Befund, nicht ein Freibrief.
          GESAMT_UNTERDRUECKT=0
          for f in sarif-results/*.sarif; do
            [ -e "$f" ] || { echo "Keine SARIF-Datei – Analyse unvollständig."; exit 1; }
            jq -r '
              [ .runs[].results[]? | select((.suppressions // []) != []) ]
              | map("- `" + .ruleId + "` "
                    + (.locations[0].physicalLocation.artifactLocation.uri // "?") + ":"
                    + ((.locations[0].physicalLocation.region.startLine // 0) | tostring)
                    + " – " + ((.suppressions[0].justification // "Code-Kommentar") | .[0:120]))
              | .[]
            ' "$f" > "/tmp/$(basename "$f").unterdrueckt" || true
            ANZ="$(jq '[.runs[].results[]? | select((.suppressions // []) != [])] | length' "$f")"
            GESAMT_UNTERDRUECKT=$((GESAMT_UNTERDRUECKT + ANZ))
            echo "${f}: ${ANZ} unterdrückte Fundstelle(n)"
            if [ "$ANZ" -gt 0 ]; then
              jq -r '
                .runs[].results[]? | select((.suppressions // []) != [])
                | . as $r
                | ($r.locations[0].physicalLocation // {}) as $loc
                | "::error file=\($loc.artifactLocation.uri // "unbekannt")"
                  + ",line=\($loc.region.startLine // 1)"
                  + ",title=Unterdrückung statt Heilung (\($r.ruleId))"
                  + "::Diese Fundstelle ist per Code-Kommentar unterdrückt. "
                  + "Das GitHub-Default-Setup sieht sie trotzdem. Ursache heilen "
                  + "statt unterdrücken – siehe CODE-SCANNING-ALERT-83-DAUERHEILUNG-PREMIUM-2026-10-10.md."
              ' "$f"
            fi
          done
          if [ "$GESAMT_UNTERDRUECKT" -gt 0 ]; then
            echo "::error::${GESAMT_UNTERDRUECKT} unterdrückte Fundstelle(n) – Unterdrückung ist keine Heilung (Alert #83)."
            exit 1
          fi

      - name: SARIF in Security-Tab hochladen
        id: upload
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: sarif-results/${{ matrix.language }}.sarif
          category: /language:${{ matrix.language }}

      - name: Upload-Ergebnis sichtbar machen (Default-Setup-Konflikt)
        if: github.ref == 'refs/heads/main' && steps.upload.outcome != 'success'
        env:
          MATRIX_LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          # Der Upload steht bewusst auf continue-on-error: Ein blockierter
          # Upload darf die Analyse nicht verschlucken. Er darf aber auch
          # nicht STILL scheitern – sonst zeigt die Security-Tab monatelang
          # Alerts aus einer zweiten, parallel laufenden Engine.
          #
          # Häufigste Ursache (und genau die, die hier auftrat):
          #   "CodeQL analyses from advanced configurations cannot be
          #    processed when the default setup is enabled"
          # Das GitHub-Default-Setup ist dann noch aktiv und blockiert den
          # Upload dieser Wache. Solange das so ist, stammen die Alert-
          # Nummern in der Security-Tab vom DEFAULT-Setup, nicht von hier.
          {
            echo "### ⚠ SARIF-Upload blockiert (${MATRIX_LANGUAGE})"
            echo ""
            echo "Die Analyse lief vollständig, der Upload in die Security-Tab wurde abgelehnt."
            echo ""
            echo "**Einmalige Handlung des Betreibers (Klick-Weg, Stand 10/2026):**"
            echo ""
            echo "1. <https://github.com/${GITHUB_REPOSITORY}/settings/security_analysis>"
            echo "   (manuell: Repo → **Settings** → Seitenleiste \"Security and quality\" →"
            echo "   **Advanced Security**. Die Seite hieß bis 2025 \"Code security and"
            echo "   analysis\" – unter dem alten Namen ist sie nicht mehr zu finden.)"
            echo "2. Abschnitt **\"Code Security\"** → Zeile **\"CodeQL analysis\"**"
            echo "3. Rechts das **\"...\"-Menü** öffnen → **Disable CodeQL**"
            echo "   (Steht dort \"Switch to advanced\", ist das Default-Setup bestätigt aktiv."
            echo "   Trotzdem **Disable CodeQL** wählen – \"Switch to advanced\" legt eine"
            echo "   zweite, generierte codeql.yml an und macht das Problem schlimmer.)"
            echo "4. Nachsorge, sonst bleiben die alten Alerts dauerhaft offen:"
            echo "   Reiter **Security and quality** → **Code scanning** → einen Alert öffnen"
            echo "   → rechts **\"Affected branches\"** → \`main\` → Dialog"
            echo "   **\"Configurations analyzing\"** → alte Konfiguration per Papierkorb"
            echo "   löschen (die Einträge \`/language:…\` dieser Wache stehen lassen) → **Save changes**"
            echo ""
            echo "Danach übernimmt diese Wache die Security-Tab."
            echo ""
            echo "Bis dahin gilt das Gate dieses Laufs als maßgeblich – es prüft denselben"
            echo "Bestand und schlägt bei jeder Security-Fundstelle fehl."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=SARIF-Upload blockiert::Default-Setup vermutlich noch aktiv – Settings → Advanced Security → Code Security → Zeile 'CodeQL analysis' → ...-Menü → Disable CodeQL. Analyse und Gate liefen trotzdem vollständig."

      - name: Sicherheits-Gate (null Security-Fundstellen)
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX_LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          # Sicherheitsrelevant ist ein Fund, wenn seine Regel eine
          # security-severity trägt. Die Metadaten stehen je SARIF-Dialekt
          # in tool.driver.rules ODER tool.extensions[].rules – wir suchen
          # dynamisch in beiden und vereinen das mit einer dokumentierten
          # Regel-Liste (Fallback, falls ein Dialekt die Metadaten
          # vollständig weglässt; siehe Strategie-Doc).
          DOKU_SEC='js/xss js/xss-through-dom js/path-injection
          js/incomplete-multi-character-sanitization
          js/incomplete-url-substring-sanitization js/hardcoded-credentials
          js/redos js/polynomial-redos
          py/path-injection py/clear-text-logging-sensitive-data
          py/clear-text-storage-sensitive-data
          py/incomplete-url-substring-sanitization py/insecure-protocol
          py/hardcoded-credentials py/redos py/polynomial-redos'
          TOTAL=0
          SECURITY=0
          QUALITY=0
          for f in sarif-results/*.sarif; do
            [ -e "$f" ] || { echo "Keine SARIF-Datei – Analyse unvollständig."; exit 1; }
            ANZ="$(jq --arg doku "$DOKU_SEC" '
              . as $sarif
              | ($doku | split("\n") | join(" ") | split(" ") | map(select(length > 0))) as $doku
              | [ $sarif.runs[].tool.driver.rules[]?, $sarif.runs[].tool.extensions[]?.rules[]? ]
              | map(select(.properties["security-severity"]? != null) | .id) | unique + $doku | unique
              | . as $secids
              | [ $sarif.runs[].results[]? | select(.ruleId as $id | $secids | index($id)) ] | length
            ' "$f")"
            ALLE="$(jq -r '[.runs[].results[]?] | length' "$f")"
            TOTAL=$((TOTAL + ALLE))
            SECURITY=$((SECURITY + ANZ))
            QUALITY=$((QUALITY + ALLE - ANZ))
            if [ "$ANZ" -gt 0 ]; then
              echo "::error::${ANZ} Sicherheits-Fundstelle(n) in ${f}:"
              jq -r '.runs[].results[]? | "\(.ruleId) → \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' "$f" | sort -u | head -20 | while IFS= read -r ZEILE; do
                echo "::error::  ${ZEILE}"
              done
              # Jede einzelne Fundstelle wird zusätzlich als Datei-Annotation
              # ausgegeben. Grund: Die Zeilen oben stehen nur im Lauf-LOG –
              # erreichbar praktisch nur als ZIP-Download. Annotationen stehen
              # an der Codezeile im PR-Diff, im Lauf-Kopf UND maschinenlesbar
              # in der Checks-API. So kennt jeder (Mensch wie Automat) die
              # Fundstelle ohne Log-Download (Lehre aus Alert #78, der über
              # mehrere „grüne“ PRs hinweg unbemerkt blieb).
              jq -r '
                .runs[].results[]?
                | . as $r
                | ($r.locations[0].physicalLocation // {}) as $loc
                | "::error file=\($loc.artifactLocation.uri // "unbekannt")"
                  + ",line=\($loc.region.startLine // 1)"
                  + ",title=CodeQL \($r.ruleId)"
                  + "::\($r.ruleId) – "
                  + (($r.message.text // "") | gsub("[\r\n]+"; " ") | .[0:400])
              ' "$f" | sort -u
            fi
          done
          BILANZ="CodeQL-Bilanz (${MATRIX_LANGUAGE}): ${TOTAL} Funde – ${SECURITY} sicherheitsrelevant, ${QUALITY} Qualitäts-Hinweise."
          echo "$BILANZ"
          # Bilanz als PR-Kommentar festhalten (nur bei Pull Requests) –
          # macht die Gate-Entscheidung ohne Log-Download nachvollziehbar:
          # Zahlen, verbleibende Funde und die unterdrückten Ausnahmen.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            PR="$(gh pr list --head "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --json number --jq '.[0].number' 2>/dev/null || true)"
            if [ -n "${PR:-}" ]; then
              VERBLEIBEND="$(for f in sarif-results/*.sarif; do
                jq -r '.runs[].results[]? | "- \(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' "$f" 2>/dev/null
              done | sort -u)"
              UNTERDRUECKT="$(cat /tmp/*.sarif.unterdrueckt 2>/dev/null | sort -u || true)"
              {
                echo "<!-- arena-wache-bilanz:${MATRIX_LANGUAGE} -->"
                echo "## Sicherheitswache (${MATRIX_LANGUAGE})"
                echo ""
                echo "${BILANZ}"
                if [ -n "$VERBLEIBEND" ]; then
                  echo ""
                  echo "**Verbleibende Funde (an GitHub gemeldet):**"
                  echo "$VERBLEIBEND"
                fi
                if [ -n "$UNTERDRUECKT" ]; then
                  echo ""
                  echo "**Verbotene Unterdrückungen (seit Alert #83 ein Befund, kein Freibrief):**"
                  echo "$UNTERDRUECKT"
                fi
              } > wache-bilanz.md
              gh pr comment "$PR" --body-file wache-bilanz.md || true
            fi
          fi
          if [ "$SECURITY" -gt 0 ]; then
            echo "::error::Sicherheits-Gate verletzt: ${SECURITY} Security-Fundstellen. Beheben (kein Dismiss ohne Begründung – siehe CODE-SCANNING-HEILUNG-PREMIUM-2026-10-04.md)."
            exit 1
          fi

  klartext-wache:
    name: Klartext-Wache (unabhängig vom SARIF-Upload)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python bereitstellen
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Eigenprüfung (Positiv- und Gegenproben)
        run: python3 scripts/clear_text_logging_guard.py --selftest

      - name: Alle Python-Dateien auf Klartext-Flüsse prüfen
        run: python3 scripts/clear_text_logging_guard.py

      - name: Sicherheitsvertrag zu Alert 77/78/80
        run: python3 -m unittest scripts.tests.test_clear_text_logging_security -v

  url-wache:
    name: URL-Wache (unabhängig vom SARIF-Upload)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # LEHRE AUS ALERT #83: Die beiden `incomplete-url-substring-sanitization`-
      # Regeln waren bis 10.10.2026 per Code-Kommentar unterdrückt. Das
      # GitHub-Default-Setup kennt solche Kommentare nicht – es hielt die
      # Fundstellen weiter offen, während das Gate hier „0 Funde" meldete.
      # Diese Wache prüft denselben Bestand lokal, fail-closed und ohne
      # jede Abhängigkeit von CodeQL, dessen Upload oder der Alert-API.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python bereitstellen
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Node bereitstellen (für die CORS-Tests des Workers)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Eigenprüfung der Wache (Positiv-, Gegen- und Musterproben)
        run: |
          python3 scripts/url_host.py --selftest
          python3 scripts/url_substring_guard.py --selftest

      - name: Python, JavaScript und HTML auf URL-Substring-Prüfungen abklopfen
        run: python3 scripts/url_substring_guard.py

      - name: Sicherheitsvertrag zu Alert 83
        run: python3 -m unittest scripts.tests.test_url_substring_security -v

      - name: CORS-Vertrag des KI-Assistent-Workers
        run: |
          python3 scripts/ki_assistent_gate.py --selftest
          node --test cloudflare/ki-assistent/test/worker.test.mjs

  redos-wache:
    name: ReDoS-Wache (unabhängig vom SARIF-Upload)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # LEHRE AUS ALERT Nr. 87: Ein `py/redos`-Fund stand in der Security-Tab,
      # während der Workflow-Kopf ReDoS noch als „Quality“ beschrieb. Diese
      # Wache hängt weder am Upload noch an der Alert-API: Sie erkennt die
      # historische Pumpe im Quelltext und prüft den geheilten Zeilenparser.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python bereitstellen
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Eigenprüfung der Rückfallsperre (Positiv- und Gegenproben)
        run: python3 scripts/redos_guard.py --selftest

      - name: Python-Bestand auf Alert-Nr.-87-Strukturen prüfen
        run: python3 scripts/redos_guard.py

      - name: Sicherheitsvertrag zu Alert Nr. 87
        run: |
          python3 -m unittest scripts.tests.test_redos_security -v
          python3 -m unittest scripts.tests.test_gsc_abdeckung

      - name: Linearer Frontmatter-Parser der GSC-Abdeckung
        run: python3 scripts/gsc_abdeckung.py --selftest
