# ============================================================
#  QUALITÄTS-GATE: Build + interne Links prüfen
#
#  Macht den Blog fehlerresistenter: Jeder Build wird zusätzlich
#  auf DEFEKTE INTERNE LINKS geprüft (Rendering-Ebene – erkennt auch
#  Theme-Links, /go/-Weiterleitungen, Bilder und Menü-Links).
#
#  Meldet (Label auto-report, ohne Duplikate, automatisch geschlossen bei Grün):
#    · kaputte interne Links   → "🔗 Defekte interne Links gefunden"
#    · Schema-/SEO-Funde       → "🧠 Schema-/SEO-Gate meldet Funde"
#    · roter Selbsttest/Vertrag/Build
#                              → "🚨 Qualitäts-Gate rot (Selbsttests, Vertrag
#                                 oder Build)"   ← seit 18.09.2026, weil das
#                                 zentrale Fehler-Alerting für die nächtlichen
#                                 Läufe dieses Gates nachweislich nicht griff
#                                 (17./18.09. rot – ohne eine einzige Meldung).
#
#  Läuft: bei Push auf main/master, bei Pull Requests, täglich um 01:15 UTC
#  (03:15 MESZ) und manuell. Die Kopfzeile nannte lange „05:00 UTC" – eine
#  veraltete Dokumentation ist dieselbe Fehlerklasse wie eine veraltete
#  Wachen-Liste: Sie beschreibt nicht, was läuft. Maßgeblich ist der Cron unten.
#  (Affiliate-/Extern-/Anker-Links werden bewusst NICHT geprüft.)
# ============================================================
name: Qualitäts-Gate (Build + interne Links)

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "15 1 * * *"   # 03:15 MESZ – nachts (kein Push, nur Prüfung+Issue)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: linkcheck-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      #  GOVERNANCE-VERTRAG + SELBSTTESTS (seit 07.09.2026, Befund #206)
      #  Die Governance-Wachen werden hier bei JEDEM Push/PR geprüft, damit ein
      # kaputter Wächter, eine falsche Schritt-Reihenfolge oder ein
      # .duplizierendes Issue den main-Zweig nicht mehr erreichen kann.
      # ------------------------------------------------------------
      - name: Python-Abhängigkeiten (für Governance-Skripte)
        run: python3 -m pip install -q --break-system-packages pyyaml pillow 2>/dev/null || python3 -m pip install -q pyyaml pillow 2>/dev/null || true

      - name: Governance-Selbsttests (alle Wachen – entdeckt, uhrfest, schreibfrei)
        # ------------------------------------------------------------
        #  WARUM hier keine Bash-Liste mehr steht
        #  (18.09.2026 · Run 35312783057 · Commit 83526d5 · Gate rot auf main)
        #
        #  1. Die Liste war eine HANDKOPIE des Regelwerks – und bereits still
        #     veraltet: readability_check, pinterest_auth, social_studio,
        #     alert_router und affiliate_integrity_gate standen in
        #     governance_contract.GUARDS, liefen im Gate aber nicht mehr mit.
        #     Der Kommentar über der alten Liste warnte wortwörtlich vor genau
        #     diesem Fall („eine Wache, die nicht läuft, weil sie im Loop
        #     vergessen wurde, ist der teurere Fehler").
        #  2. `draft_triage --selftest` war sechs Tage nach dem Einbau rot, ohne
        #     dass jemand den Code angefasst hätte: Fixtures von der echten
        #     Wanduhr, Erwartung aus einem eingefrorenen Testdatum. Dieselbe
        #     Bombe lag scharf in `audio_coverage_check` (Verfallsdatum
        #     24.12.2026). Ein Selbsttest, der die Wanduhr liest, ist kein Test,
        #     sondern eine Verabredung mit dem Kalender.
        #
        #  Der Runner (scripts/selftest_runner.py, selbst selbsttestend)
        #    · entdeckt die Wachen im Dateibaum statt sie abzutippen,
        #    · gleicht mit governance_contract.GUARDS ab (eine Quelle),
        #    · läuft jeden Selbsttest zusätzlich unter einer um 97 und 1461 Tage
        #      VORGESTELLTEN Uhr → Datums-Abhängigkeiten kippen am Tag des
        #      Einbaus, nicht an einem Feiertag in drei Monaten,
        #    · führt nur Skripte, die `--selftest` WIRKLICH implementieren
        #      (eine bloße Erwähnung im Kommentar würde die Standard-Aktion
        #      starten – real passiert: publish_gate stufte einen LIVE-Artikel
        #      auf draft herab),
        #    · meldet es als Befund, wenn ein Selbsttest in den Arbeitsbaum
        #      schreibt (Vertragsregel C15: ein Prüf-Aufruf heilt nicht).
        #  Laufzeit: ~50 s für 74 Wachen + 148 Uhr-Proben.
        # ------------------------------------------------------------
        run: |
          set -o pipefail
          python3 scripts/selftest_runner.py | tee selbsttests.log

      # Namens-Nachzug 18.09.2026: Der Vertrag umfasst längst C1–C16 (der Schritt
      # hieß noch „C1–C12"). Ein Schritt-Name, der den Inhalt untertreibt, ist
      # dieselbe Klasse wie eine Wachen-Liste, die nicht mehr stimmt.
      - name: Governance-Vertrag C1–C16 (Reihenfolge, Issue-Policy, Nachweise, Token-Lebenszyklus)
        run: python3 scripts/governance_contract.py --quick

      - name: Hugo installieren (Extended, verifiziert, mehrquellig)
        uses: ./.github/actions/install-hugo
        with:
          version: "0.164.0"

      - name: Seite bauen
        run: hugo --minify

      - name: Interne Links prüfen
        id: links
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/check_internal_links.sh | tee linkcheck.log

      # ------------------------------------------------------------
      #  SCHEMA-/SEO-GATE (neu, 11.09.2026)
      #  Prüft am Build: JSON-LD (Article/FAQ/CollectionPage) inkl.
      #  Doppel-Escaping, Werte-/Typ-/Datum-/URL-Plausibilität, Open-Graph- und
      #  Twitter-Signale inkl. og:image-Maßen gegen die echte Bilddatei,
      #  Indexierungs-Hygiene (noindex für Archiv-/Pager-/404-Seiten),
      #  Sitemap-Vollständigkeit und -Reinheit, die Robots-Politik für
      #  Pinterest und KI-Antwortmaschinen, LCP-Preload gegen gerenderte Bilder
      #  und das PWA-Manifest.
      #  Anlass: ein doppeltes `| jsonify` in layouts/_partials/schema_article.html
      #  hatte die Article-Schema ALLER Live-Artikel unbrauchbar gemacht
      #  ("@id": "\"https://…\""). Der Build blieb grün – kein Prüfer hatte je in
      #  ein <script type="application/ld+json"> geschaut. Ein Fix ohne Wache ist
      #  eine Leihgabe.
      # ------------------------------------------------------------
      - name: Schema-/SEO-Gate (JSON-LD, Social-Tags, Indexierungs-Hygiene)
        id: schema
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/schema_seo_gate.py | tee schemagate.log

      - name: Label sicherstellen
        if: steps.links.outcome == 'failure' || steps.schema.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create auto-report --repo "$GITHUB_REPOSITORY" \
            --color "d73a4a" \
            --description "Automatisch erkannte Fehlermeldung" --force || true

      - name: Funde melden (Issue pro Prüfer)
        # Ein Schritt, zwei Melder: der Titel entscheidet, welche Meldung
        # geöffnet bzw. aktualisiert wird. Getrennte Schritte pro Prüfer sind
        # der klassische Weg zu zwei YAML-Schritten mit doppeltem `run:`-Schlüssel
        # (letzter gewinnt, still) – deshalb hier ein Schritt mit Verzweigung.
        if: steps.links.outcome == 'failure' || steps.schema.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.links.outcome }}" = "failure" ]; then
            TITLE="🔗 Defekte interne Links gefunden"
            LOG=linkcheck.log
            MUSTER='KAPUTT:'
          else
            TITLE="🧠 Schema-/SEO-Gate meldet Funde"
            LOG=schemagate.log
            MUSTER='❌'
          fi
          FUNDE="$(grep "$MUSTER" "$LOG" 2>/dev/null | sed 's/^/  /' | head -n 40 || true)"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          BODY=$(cat <<EOF
          ## ${TITLE}

          **Run:** [${GITHUB_RUN_ID}](${RUN_URL})
          **Commit:** \`${GITHUB_SHA:0:8}\`

          \`\`\`
          ${FUNDE:-Details im Run-Log oben.}
          \`\`\`

          Der vollständige Bericht steht im Run-Log; bei Schema-Funden zusätzlich in
          \`SCHEMA-SEO-REPORT.md\` (lokal: \`python3 scripts/schema_seo_gate.py\`).
          Diese Meldung wird automatisch geschlossen, sobald der Prüfer wieder grün
          durchläuft, und nach der Aufräum-Frist dauerhaft gelöscht.
          EOF
          )

          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label auto-report \
            --json number,title \
            | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .number' | head -n 1)"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --body "Erneuter Fund bei [Run ${GITHUB_RUN_ID}](${RUN_URL}) (Commit \`${GITHUB_SHA:0:8}\`)."
            echo "→ Bestehendes Issue #${EXISTING} aktualisiert."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --label auto-report --body "$BODY"
            echo "→ Neues Issue erstellt."
          fi


      # ------------------------------------------------------------
      #  EIGENE FEHLER-MELDUNG DES GATES (18.09.2026)
      #
      #  Befund: Dieses Gate ist in zwei aufeinanderfolgenden Nächten rot
      #  gewesen – 17.09. 06:09:16 UTC (Run 35188605416) und 18.09. 05:56:22 UTC
      #  (Run 35312783057) – und hat in BEIDEN Fällen keinen einzigen
      #  Fehler-Alerting-Lauf ausgelöst. Es entstand kein Issue, niemand wurde
      #  informiert; der Betreiber erfuhr es durch Nachschauen. Der Vergleich
      #  zeigt, dass es nicht am `schedule`-Auslöser liegt: Uptime-Monitor
      #  (ebenfalls schedule) hat am 18.09. 01:32:43 sehr wohl einen
      #  Alerting-Lauf ausgelöst. Das zentrale Alerting hängt damit an einem
      #  Namens-Matching über `workflow_run`, das für dieses Gate nicht greift –
      #  und ein Gate, dessen Rot niemandem gemeldet wird, ist kein Gate.
      #
      #  Deshalb meldet sich das Gate jetzt SELBST, unabhängig von jedem
      #  Fremd-Workflow: gleicher Dedupe-/Schließ-Pfad wie die beiden
      #  Fach-Meldungen unten (Label auto-report, aktualisieren statt duplizieren,
      #  schließen bei Grün). Bewusst NICHT bei Link-/Schema-Funden – dafür gibt
      #  es die präziseren Meldungen, doppelt wäre Lärm.
      # ------------------------------------------------------------
      - name: Gate-Fehlschlag melden (Selbsttests, Vertrag oder Build)
        if: ${{ failure() && steps.links.outcome != 'failure' && steps.schema.outcome != 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITEL="🚨 Qualitäts-Gate rot (Selbsttests, Vertrag oder Build)"
          # Welche Schritte sind wirklich gefallen? (API statt Raterei)
          SCHRITTE="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json jobs --jq '.jobs[].steps[] | select(.conclusion=="failure") | .name' \
            2>/dev/null | paste -sd', ' - || true)"
          FUNDE="$(grep -E '❌|🛑|::error::' selbsttests.log 2>/dev/null | head -n 40 || true)"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          BODY=$(cat <<EOF
          ## ${TITEL}

          **Run:** [${GITHUB_RUN_ID}](${RUN_URL})
          **Commit:** \`${GITHUB_SHA:0:8}\` · **Branch:** \`${GITHUB_REF_NAME}\`
          **Gefallene Schritte:** ${SCHRITTE:-siehe Run-Log}

          \`\`\`
          ${FUNDE:-Details im Run-Log oben.}
          \`\`\`

          Dieses Gate meldet sich selbst, weil das zentrale Fehler-Alerting für
          seine nächtlichen Läufe nachweislich nicht ausgelöst wurde (17./18.09.2026).
          Die Meldung wird automatisch geschlossen, sobald das Gate wieder grün ist.
          EOF
          )

          gh label create auto-report --repo "$GITHUB_REPOSITORY" \
            --color "d73a4a" --description "Automatisch erkannte Fehlermeldung" --force || true

          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label auto-report \
            --json number,title \
            | jq -r --arg t "$TITEL" '.[] | select(.title == $t) | .number' | head -n 1)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --body "Erneuter Fehlschlag bei [Run ${GITHUB_RUN_ID}](${RUN_URL}) (Commit \`${GITHUB_SHA:0:8}\`, Schritte: ${SCHRITTE:-unbekannt})."
            echo "→ Bestehendes Issue #${EXISTING} aktualisiert."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITEL" --label auto-report --body "$BODY"
            echo "→ Neues Issue erstellt."
          fi

      - name: Meldung schließen (alles grün)
        # Alle Melder werden geschlossen, wenn der Job grün ist – sonst bleibt
        # eine erledigte Meldung offen stehen und das nächste Gate-Ergebnis wirkt
        # älter, als es ist. `success()` ist strenger als die alte Bedingung
        # (beide Prüfer grün) und umfasst ausdrücklich auch Selbsttests, Vertrag
        # und Build: Ein Gate, das vorn rot ist und hinten nicht lief, darf keine
        # alte „erledigt"-Meldung stehen lassen.
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for TITLE in "🔗 Defekte interne Links gefunden" "🧠 Schema-/SEO-Gate meldet Funde" \
                       "🚨 Qualitäts-Gate rot (Selbsttests, Vertrag oder Build)"; do
            for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label auto-report \
              --json number,title \
              | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .number'); do
              gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
                --comment "✅ Behoben: Prüfung wieder grün im [Run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
              echo "→ Issue #$n geschlossen ($TITLE)."
            done
          done

      - name: Gate-Status (rot bei kaputten Links oder Schema-Funden)
        if: steps.links.outcome == 'failure' || steps.schema.outcome == 'failure'
        run: |
          [ "${{ steps.links.outcome }}" = "failure" ] \
            && echo "❌ Defekte interne Links gefunden (siehe Issue + Log oben)."
          [ "${{ steps.schema.outcome }}" = "failure" ] \
            && echo "❌ Schema-/SEO-Gate meldet harte Funde (siehe Issue + Log oben)."
          exit 1
