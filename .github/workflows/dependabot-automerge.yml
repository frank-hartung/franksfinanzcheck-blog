# ============================================================
#  DEPENDABOT AUTO-MERGE – nur GitHub-Actions, nie Pakete
#
#  Sicherheitsregel (Audit 14.10.2026, H-02 – PR #708 wurde nach 19 s
#  gemergt, ein npm-Paket mit Install-Skripten):
#    ✅ github_actions PATCH + MINOR -> approve + GitHub-Auto-Merge.
#       Der Auto-Merge WARTET auf die Pflicht-Checks des Rulesets.
#    🛡️ alles andere (npm, pip, Docker, jede MAJOR-Version) -> Kommentar,
#       Mensch prüft und mergt.
#    ❌ KEIN Direkt-Merge-Fallback mehr: Kann GitHub den Auto-Merge nicht
#       aktivieren (keine Pflicht-Checks im Ruleset), bleibt der PR offen.
#
#  Technik:
#    - pull_request_target: läuft mit Base-Repo-Rechten und checkt KEINEN
#      PR-Code aus (sicheres Muster laut GitHub-Doku).
#    - Bedingung auf den PR-AUTOR (I-05), nicht auf github.actor – der ist
#      bei einem Re-Run derjenige, der neu startet.
#    - dependabot/fetch-metadata prüft zusätzlich, dass der PR wirklich von
#      Dependabot stammt, und liefert Ökosystem + Semver-Stufe.
#    - Alle Werte gehen per env in die Shell (keine Template-Injection).
# ============================================================
name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Update-Typ und Ökosystem ermitteln
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: GitHub-Actions Patch/Minor -> Auto-Merge (wartet auf Pflicht-Checks)
        if: >-
          steps.meta.outputs.package-ecosystem == 'github_actions' &&
          steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -uo pipefail
          gh pr review --approve "$PR_URL" \
            || echo "::notice::Approve nicht möglich (Repo-Einstellung „Allow GitHub Actions to create and approve pull requests“)."
          if ausgabe=$(gh pr merge --auto --squash --delete-branch "$PR_URL" 2>&1); then
            echo "✔ Auto-Merge aktiviert – GitHub mergt, sobald die Pflicht-Checks grün sind."
          else
            echo "$ausgabe"
            echo "::notice title=Auto-Merge nicht aktiviert::Ohne Pflicht-Checks im Ruleset kann GitHub nicht warten. Der PR bleibt offen und wird von Hand gemergt – bewusst KEIN Direkt-Merge (Audit H-02)."
          fi

      - name: Alles andere -> kommentieren statt mergen
        if: >-
          steps.meta.outputs.package-ecosystem != 'github_actions' ||
          steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PAKETE: ${{ steps.meta.outputs.dependency-names }}
          OEKOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          STUFE: ${{ steps.meta.outputs.update-type }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_URL" --body "🛡️ **Manuelle Prüfung nötig** (${OEKOSYSTEM}, ${STUFE}: ${PAKETE}). Auto-Merge gilt nur für Patch-/Minor-Updates von GitHub-Actions. Bitte Changelog und Release-Herkunft prüfen, dann von Hand mergen."
          echo "Wartet auf manuelle Prüfung: $OEKOSYSTEM / $STUFE"
