      - "Cloudflare-Worker deployen"   # WF-E813 (26.10.2026): Der Deploy ist der Heilungsschritt der Sicherheits-Wache (Runbook D2) und stand dennoch seit 25.10. still rot – fail-closed wegen fehlendem Produktions-Zugang, ohne eine einzige Meldung
      # WF-829B/#922 (29.10.2026): Der Prüfknopf zum Deploy-Zugang. Er liest
      # nur (Token-Gültigkeit + bestehende Bindungen) und ändert nichts. Ein
      # Rot hier ist dieselbe Ursache wie ein roter Deploy – und genau deshalb
      # darf dieser Kanal nicht still sein: Ohne ihn wäre der Zugang nur über
