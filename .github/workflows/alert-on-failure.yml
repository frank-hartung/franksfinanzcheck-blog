# ============================================================
#  ZENTRALES FEHLER-ALERTING (Profi-Monitoring)
#
#  Beobachtet ALLE automatischen Workflows. Schlägt einer fehl
#  (z. B. abgelaufener API-Key, Deploy-Fehler, SEO-Gate), wird
#  automatisch ein GitHub-Issue erstellt – du erfährst es ohne
#  manuelles Prüfen der Actions-Seite.
#
#  So funktioniert's: workflow_run-Trigger feuert NACH Abschluss
#  jedes gelisteten Workflows. Bei conclusion=failure/cancelled
#  → Issue mit Workflow-Name, Run-Link und Log-Auszug.
#
#  Kein manuelles Zutun nötig – das System meldet sich selbst.
# ============================================================
name: Fehler-Alerting

on:
  workflow_run:
    workflows:
      - "Automatische Content-Generierung"
      - "Deploy auf GitHub Pages"
      - "Wöchentliche SEO-Optimierung"
      - "Backlink-Automation"
      - "Wöchentliches Einzigartigkeits-Audit"
      - "Wöchentliches Nach-Pinnen"
      - "Quartalsweises Artikel-Update"
      - "Bot-Watchdog"
    types:
      - completed

permissions:
  issues: write

jobs:
  alarm:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' }}
    steps:
      - name: Issue bei fehlgeschlagenem Workflow erstellen
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const wfName = run.name || 'Unbekannter Workflow';
            const conclusion = run.conclusion;
            const runUrl = run.html_url;
            const branch = run.head_branch || 'main';
            const created = new Date(run.created_at).toLocaleString('de-DE', { timeZone: 'Europe/Berlin' });
            const headSha = run.head_sha ? run.head_sha.slice(0, 8) : '?';

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const open = existing.filter(i => i.title && i.title.indexOf('Workflow fehlgeschlagen: ' + wfName) !== -1 && !i.pull_request);
            if (open.length > 0) {
              console.log('Offenes Issue existiert bereits (#' + open[0].number + ') – kein Duplikat.');
              return;
            }

            const lines = [
              '## ' + wfName + ' ist fehlgeschlagen (' + conclusion + ')',
              '',
              '- **Workflow:** ' + wfName,
              '- **Branch:** ' + branch + ' · **Commit:** `' + headSha + '`',
              '- **Zeit:** ' + created,
              '- **Run:** [Details ansehen](' + runUrl + ')',
              '',
              '### Was du tun solltest',
              '1. Öffne den Run-Link oben und schaue in das Log des fehlgeschlagenen Schritts.',
              '2. Häufigste Ursachen:',
              '   - **API-Key abgelaufen** (GROQ/GEMINI) → Secrets in den Repo-Einstellungen aktualisieren',
              '   - **GitHub-Ausfall** → auf https://www.githubstatus.com prüfen',
              '   - **Transienter Fehler** → Workflow manuell neu starten (Actions → Run workflow)',
              '',
              '---',
              '*Automatisch erstellt vom Fehler-Alerting-Workflow – du musst nichts manuell prüfen.*'
            ];
            const body = lines.join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Workflow fehlgeschlagen: ' + wfName + ' (' + conclusion + ')',
              body: body
            });
            console.log('✅ Issue erstellt für ' + wfName);
