permissions:
  contents: read  # Checkout der Identitäts-Quelle (scripts/alert_issue_identity.py)
  issues: write
  actions: read   # Issue #218: Jobs/Schritte eines Runs lesen, um verdrängte Läufe zu erkennen

jobs:
  alarm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure' ||
          github.event.workflow_run.conclusion == 'timed_out' ||
          github.event.workflow_run.conclusion == 'cancelled' }}
    steps:
      - name: Repository auschecken (Identitäts-Quelle)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Selbsttest der Namensgebung (ein blinder Namensgeber wäre schlimmer)
        run: python3 scripts/alert_issue_identity.py --selftest

      - name: Markenneutrale Identität der Meldung bestimmen
        env:
          WF_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          python3 scripts/alert_issue_identity.py --workflow "$WF_NAME" --json > /tmp/alarm-identitaet.json
          cat /tmp/alarm-identitaet.json

      - name: Issue bei fehlgeschlagenem Workflow erstellen
        # v7 – unveränderlich gepinnt (Supply-Chain-Schutz)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Der workflow_run-Payload kann bei einem Scheduler-Abbruch einen
            // veralteten Zwischenstand tragen (z. B. `failure`, obwohl der
            // Lauf inzwischen als verdrängtes `cancelled` abgeschlossen ist).
            // Deshalb niemals aus dem Webhook-Snapshot alarmieren: der
            // Abschlusszustand wird unmittelbar vor der Diagnose einmal live
            // nachgeladen. Das verhindert Phantom-Issues wie WF-A3AD/#604.
            const eventRun = context.payload.workflow_run;
            let run = eventRun;
            try {
              const fresh = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: eventRun.id,
              });
              run = fresh.data;
            } catch (e) {
              // Fail-open: Bei einem API-Ausfall bleibt der ursprüngliche
              // Fehler sichtbar; die nachgelagerte Job-Abfrage diagnostiziert
              // weiterhin so sicher wie möglich.
              console.log('Live-Abfrage des Runs fehlgeschlagen (' + e.message + ') – nutze Payload.');
            }
            const wfName = run.name || 'Unbekannter Workflow';
            const conclusion = run.conclusion;
            const runUrl = run.html_url;
            const branch = run.head_branch || '';
            const event = run.event || '?';

            // ================================================================
            //  KANAL-HYGIENE (Sicherheitsaudit 15.10.2026, F-09)
            //  --------------------------------------------------------------
            //  `workflow_run.name` und `.head_branch` stammen aus dem Webhook
            //  und landeten unverändert in Titel und Body eines öffentlichen
            //  Issues. Ein Zweigname wie  x` @name [Text](http://boese)  ist
            //  damit Markdown-Eingabe von außen: gefälschte Links,
            //  @-Benachrichtigungen (Spam an Dritte), gesprengte Zitatblöcke.
            //  Das PRODUKTIONS-SCOPING unten verkleinert das Fenster, schließt
            //  es aber nicht. Deshalb werden beide Werte EINMAL zentral
            //  entschärft; die Rohwerte bleiben nur dort stehen, wo exakt
            //  verglichen wird (Dedupe/Alt-Titel, Workflow-Erkennung).
            // ================================================================
            const kanalRein = (roh, grenze = 120) => {
              const text = String(roh == null ? '' : roh)
                .replace(/[\u0009\u000a\u000b\u000c\u000d]/g, ' ')
                .replace(/[\u0000-\u001f\u007f\u200b-\u200f\u202a-\u202e\ufeff]/g, '')
                .replace(/[`<>\[\]*_|]/g, '·')
                .replace(/@/g, '@\u2060')   // Mention-Schutz (Word-Joiner trennt den Namen)
                .trim();
              return text.length > grenze ? text.slice(0, grenze - 1) + '…' : text;
            };
            const wfNameRein = kanalRein(wfName);
            const branchRein = kanalRein(branch, 80);
            const created = new Date(run.created_at).toLocaleString('de-DE', { timeZone: 'Europe/Berlin' });
            const headSha = run.head_sha ? run.head_sha.slice(0, 8) : '?';

            // ================================================================
            //  PRODUKTIONS-SCOPING (Reparatur Fehlalarm-Klasse #343, 21.09.2026)
            //  --------------------------------------------------------------
            //  Ein Alarm ist ein Vorfall in der PRODUKTION. Läufe auf Arbeits-/
            //  PR-Zweigen (pull_request-Events, push auf arena/*, dependabot/*)
            //  sind Entwicklung: rot ist dort eine Zwischenstufe, sichtbar als
            //  Check am PR – kein Grund, den Betreiber zu wecken. Belegt durch
            //  Issue #343: „Layout-AI fehlgeschlagen" für einen PR-Zweig-Lauf,
            //  der 57 Minuten später von selbst grün war; während das Issue
            //  offen stand, hätte der Dedupe-Filter einen ECHTEN main-Fehler
            //  desselben Workflows verschluckt, und geschlossen wurde es durch
            //  einen grünen ZWEIG-Lauf ohne jeden Produktionsbeweis.
            //  Regel: Alarm nur bei head_branch == default_branch UND Event
            //  != pull_request. (workflow_run läuft immer auf der main-Version
            //  dieser Datei – die Regel gilt damit für alle Zweige repo-weit.)
            // ================================================================
            const defaultBranch = (context.payload.repository && context.payload.repository.default_branch) || 'main';
            const isProdRun = branch === defaultBranch && event !== 'pull_request';
            if (!isProdRun) {
              console.log('Kein Produktions-Lauf: Branch „' + (kanalRein(branch, 80) || '(leer)') + '“ ≠ „' + defaultBranch + '“ oder Event „' + kanalRein(event, 20) + '“.');
              console.log('Rote Dev-/PR-Läufe sind als Checks am PR/Zweig sichtbar – kein Owner-Alarm (Regel aus Fehlalarm #343, 21.09.2026).');
              return;
            }

            // Jobs EINMAL holen – werden zweimal gebraucht: Phantoms-Filter
            // (Issue #218) und Diagnose-Abschnitt (INCIDENT-2026-09-19).
            let jobs = [];
            let jobsKnown = false;
            try {
              jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 100 }
              );
              jobsKnown = true;
            } catch (e) {
              // Im Zweifel lieber melden als eine echte Störung verschlucken.
              console.log('Job-Abfrage fehlgeschlagen (' + e.message + ') – Diagnose entfällt, Meldung wird sicherheitshalber erstellt.');
            }

            // ================================================================
            //  PHANTOM-FILTER (Reparatur Issue #218, 08.09.2026)
            //  --------------------------------------------------------------
            //  Befund: Issue #218 meldete einen "fehlgeschlagenen" Deploy, der
            //  in Wahrheit NIE GELAUFEN ist. GitHub haelt je Concurrency-Gruppe
            //  genau einen wartenden Lauf vor; trifft ein neuerer Push ein,
            //  wird der wartende Lauf mit `cancelled` verdraengt – ohne eine
            //  einzige Zeile auszufuehren. Geprueft an den echten Runs:
            //  34148140778 (= Issue #218), 34123667405, 34217052055 und
            //  34218421327 hatten allesamt NULL Jobs.
            //
            //  Fachlich ist das voellig unkritisch: `main` ist linear, der
            //  verdraengende Lauf veroeffentlicht denselben Stand inklusive
            //  der neueren Commits. Eine Fehlermeldung dafuer ist ein
            //  Fehlalarm – und ein teurer, denn der Dedupe-Filter unten
            //  unterdrueckt danach ECHTE Meldungen desselben Workflows,
            //  solange das Phantom-Issue offen steht. Genau das ist passiert.
            //
            //  Unterscheidungsmerkmal: Hat der Lauf ueberhaupt etwas
            //  ausgefuehrt? Ein echter Abbruch (z. B. Timeout wie Run
            //  34140579736, 6 h) hat erfolgreich beendete Schritte, ein
            //  verdraengter Lauf hat keine. Nur `cancelled` wird so geprueft –
            //  `failure` meldet weiterhin immer.
            // ================================================================
            if (conclusion === 'cancelled' && jobsKnown) {
              const ranSomething = jobs.some(j =>
                (j.steps || []).some(s => s.conclusion === 'success')
              );
              if (!ranSomething) {
                console.log('Verdrängter Wartelauf (' + jobs.length + ' Jobs, kein ausgeführter Schritt) – kein Fehlalarm.');
                console.log('Der nachfolgende Lauf veröffentlicht denselben Stand inkl. neuerer Commits.');
                return;
              }
              console.log('Echter Abbruch: Der Lauf hatte bereits ausgeführte Schritte – Meldung wird erstellt.');
            }

            // ================================================================
            //  DIAGNOSE: Welche Jobs/Schritte sind wirklich rot?
            //  (Lehre aus INCIDENT-2026-09-19: Eine Meldung, die nur „API-Key?
            //  GitHub-Ausfall?" rät, obwohl der Run den toten Schritt kennt,
            //  schickt den Menschen auf Ratesuche. Deshalb: Namen + Log-Links
            //  der fehlgeschlagenen Jobs/Schritte direkt ins Issue.)
            // ================================================================
            const failedJobs = jobs
              .filter(j => j.conclusion === 'failure' || j.conclusion === 'timed_out' || j.conclusion === 'cancelled')
              .map(j => ({
                name: j.name,
                url: j.html_url,
                steps: (j.steps || [])
                  .filter(s => s.conclusion === 'failure' || s.conclusion === 'timed_out' || s.conclusion === 'cancelled')
                  .map(s => s.name),
              }));

            // Dedupe: offenes Alarm-Issue desselben Workflows? Paginiert –
            // eine einzelne 100er-Seite wäre wieder eine blinde Stelle,
            // sobald das Repo mehr offene Issues trägt.
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            // ================================================================
            //  FACHKANAL-STUMMSCHALTUNG FÜR TAGESDEFIZITE (WF-1F8C #602)
            //  --------------------------------------------------------------
            //  Die Kadenz-Endkontrolle muss bei einem echten Quotendefizit rot
            //  bleiben (keine grüne Lüge), erstellt/aktualisiert dafür aber
            //  bereits das auto-schließende Fach-Issue `engine-deficit` mit
            //  Lage, Slugs und Slot-Protokoll. Genau diese ehrliche rote
            //  Schlussstufe erzeugte #602: ein zweites, generisches
            //  `auto-report`-Issue mit API-Key-/Transient-Runbook – also
            //  Rauschen statt Entscheidung.
            //
            //  Regel: Nur wenn der Workflow selbst den Fehler ausdrücklich als
            //  „TAGESDEFIZIT – Fachmeldung engine-deficit ist zuständig“
            //  klassifiziert UND dieses Fach-Issue offen sowie für diesen Lauf
            //  frisch aktualisiert nachweisbar ist, schweigt das zentrale
            //  Fehler-Alerting. Fehlt der Fachkanal (Token/API kaputt, Label
            //  weg, Marker fehlt, veraltetes Issue), bleibt es fail-open und
            //  legt das generische Issue an. Release-/Build-Crashs haben andere
            //  Schritt-Namen und werden weiterhin gemeldet.
            // ================================================================
            const failedStepNames = failedJobs.flatMap(j => j.steps || []);
            // WF-7B6B / #654 (08.10.2026): Ein fehlgeschlagener Install-Schritt ist
            // fast nie der API-Key. Der Vorfall: package.json war ungültiges JSON
            // (Merge-Rest), npm ci brach in Sekunde 1 ab – die Meldung riet trotzdem
            // zu API-Schlüsseln. Install- und Manifest-Schritte bekommen deshalb die
            // Manifest-Diagnose. Die übrigen Ratschläge bleiben unverändert.
            const installFailed = failedStepNames.some(s =>
              /Abhängigkeiten|npm ci|npm install|Manifest/i.test(String(s)));
            // ================================================================
            //  WF-E813 (15.10.2026): EIN RAT, DER NIE ZUTREFFEN KANN, IST
            //  KEINE DIAGNOSE
            //  --------------------------------------------------------------
            //  Der erste planmäßige Lauf der Sicherheits-Wache wurde rot, und
            //  die Meldung bot als „häufigste Ursachen" einen abgelaufenen
            //  Schlüssel, einen GitHub-Ausfall und einen transienten Fehler
            //  an. Diese Wache misst HTTP-Kopfzeilen der eigenen Seite: Sie
            //  kennt keinen Schlüssel, kein Modell und keine Registry. Drei
            //  angebotene Ursachen, von denen keine zutreffen kann, kosten
            //  genau die Zeit, die der eine wirkliche Schritt braucht (A1 im
            //  Cloudflare-Dashboard). Deshalb bekommt dieser Kanal eine eigene
            //  Triage – abgeleitet aus der Klassifikation der Wache selbst,
            //  die BEFUND (gemessen und mangelhaft) von STOERUNG (nicht
            //  gemessen) unterscheidet.
            // ================================================================
            const istSicherheitsWache = wfName === 'Sicherheits-Wache';
            const headerGateFailed = istSicherheitsWache &&
              failedStepNames.some(s => String(s).includes('Sicherheits-Header'));
            // #809: Zwei rote Messungen brauchen zwei Handlungswege. Der
            // Header-Rat darf den unabhängigen Worker-Befund nicht verdecken.
            const workerGateFailed = istSicherheitsWache &&
              failedStepNames.some(s => String(s).includes('Worker-Zustand'));
            const liveNachweisFailed = istSicherheitsWache &&
              failedStepNames.some(s => String(s).includes('Live-Nachweis abschließen'));
            // WF-A535 #632 / Content-Engine v2: the final status step is a
            // classifier, not necessarily the root cause. Phase 0.5 has a
            // more specific signature; otherwise its ::error:: annotation
            // names the class (deficit, release crash, sync loss, early abort).
            // Scope both checks to this workflow so similarly named steps in
            // unrelated workflows keep their own runbooks.
            const isContentEngine = wfName === 'Content-Engine v2';
            const enginePhase05Failed = isContentEngine &&
              failedStepNames.some(s => String(s).includes('Phase 0.5 – Kadenz-Gate sicherstellen'));
            const engineFinalClassifierFailed = isContentEngine &&
              failedStepNames.some(s => String(s).includes('Do not report a quota deficit as success'));
            // WF-9E5A / #761 (15.10.2026): Offsite-Backup. „Voraussetzungen
            // prüfen“ ist absichtlich rot, solange ein Zugang fehlt, falsch oder
            // abgelaufen ist (fail-closed) – eine Einrichtungsaufgabe, bei der
            // weder ein Neustart noch GROQ/GEMINI-Schlüssel helfen. Die
            // Job-Zusammenfassung nennt jeden offenen Punkt (E1–E8) mit Link.
            // „Fristwarnung“ heißt: Sicherung gelaufen, ein Zugang läuft bald ab.
            // Nur für diesen Workflow – gleichnamige Schritte anderswo behalten
            // ihr eigenes Runbook.
            const isBackup = wfName === 'Offsite-Backup';
            const backupEinrichtung = isBackup &&
              failedStepNames.some(s => String(s).includes('Voraussetzungen prüfen'));
            const backupFrist = isBackup && !backupEinrichtung &&
              failedStepNames.some(s => String(s).includes('Fristwarnung'));
            // HIGHEND 24.10.2026: Operative RPO-Wache – misst ob JÜNGST gesichert wurde.
            // E1–E8 prüfen Konfiguration, Fristen prüfen Ablauf, Frischwache prüft Ausführung.
            const isBackupFrisch = wfName === 'Backup-Frischwache (operative RPO-Wache)';
            const backupFrisch = isBackupFrisch;
            // ================================================================
            //  WF-53E2 / #780 (16.10.2026): EIN ROTER SELBSTTEST IST EINE
            //  CODE-REGRESSION – KEIN SCHLÜSSEL, KEIN AUSFALL, KEIN NEUSTART
            //  --------------------------------------------------------------
            //  Die Affiliate-Wache stand fail-closed, weil ihr Detektor-
            //  Selbsttest seit einem Merge rot war (#776 hatte den geprüften
            //  Vertrag umgeschrieben). Die Meldung riet zu GROQ/GEMINI und zum
            //  Neustart – beides kann einen Selbsttest nicht rot machen und
            //  nicht grün: Selbsttests laufen offline, mit Attrappen-Schlüsseln
            //  (KI-Probe, #138), und urteilen über den Code. Am selben Tag gab
            //  derselbe Merge drei weitere Meldungen mit demselben falschen Rat
            //  (#777, #778, #783). Maßgeblich ist der ERSTE rote Schritt – die
            //  Schlussbewertung danach („Lauf bewerten“) ist nur die Folge.
            //  Spezifische Klassen oben (Engine, Backup, Installation,
            //  Sicherheits-Wache) behalten Vorrang.
            // ================================================================
            const ersterRoterSchritt = String(failedStepNames[0] || '');
            const selbsttestFailed = /Selbsttest|Selftest/i.test(ersterRoterSchritt);
            // ================================================================
            //  KLASSE DES RATS (WF-9E5A / #761, 15.10.2026)
            //  --------------------------------------------------------------
            //  Eine Quelle für beides: die Wahl des Runbooks unten UND den
            //  unsichtbaren Marker im Body. Daran erkennt der nächste rote
            //  Lauf, ob der Rat in einer offenen Meldung noch stimmt. Eine neue
            //  Runbook-Klasse braucht hier einen eigenen Namen – sonst bliebe
            //  in offenen Meldungen der alte Rat stehen.
            // ================================================================
            const runbookKlasse = enginePhase05Failed ? 'engine-fruehabbruch'
              : engineFinalClassifierFailed ? 'engine-schlussklassifikation'
              : backupEinrichtung ? 'backup-einrichtung'
              : backupFrist ? 'backup-frist'
              : isBackup ? 'backup'
              : backupFrisch ? 'backup-frisch'
              : installFailed ? 'installation'
              // WF-E813 (15.10.2026): Eigene Namen für die Sicherheits-Wache.
              // Die Header-Wache trennt BEFUND von STOERUNG; wechselt die
              // Klasse in einer offenen Meldung, muss der Rat neu geschrieben
              // werden. Ohne eigenen Namen bliebe er stehen (Schaden aus
              // WF-9E5A #761) – deshalb ist die Kette hier die einzige Quelle.
              : headerGateFailed && workerGateFailed ? 'sicherheit-live'
              : headerGateFailed ? 'sicherheit-header'
              : workerGateFailed ? 'sicherheit-worker'
              : liveNachweisFailed ? 'sicherheit-nachweis'
              : istSicherheitsWache ? 'sicherheit-wache'
              // WF-53E2 / #780: roter Selbsttest = Code-Regression (Rat unten).
              : selbsttestFailed ? 'selbsttest'
              : 'allgemein';
            const runbookMarker = '<!-- alert-runbook: ' + runbookKlasse + ' -->';
            const labelsOf = issue => (issue.labels || [])
              .map(l => typeof l === 'string' ? l : (l && l.name) || '')
              .filter(Boolean);
            const routedToEngineDeficit = failedStepNames.some(s =>
              String(s).includes('TAGESDEFIZIT') && String(s).includes('engine-deficit')
            );
            const freshForThisRun = issue => {
              const issueUpdated = Date.parse(issue.updated_at || issue.updatedAt || '');
              const runCreated = Date.parse(run.created_at || '');
              return !Number.isNaN(issueUpdated) && !Number.isNaN(runCreated) &&
                issueUpdated >= (runCreated - 10 * 60 * 1000);
            };
            const engineDeficitIssue = existing.find(i =>
              !i.pull_request &&
              labelsOf(i).includes('engine-deficit') &&
              String(i.body || '').includes('<!-- engine-deficit-id: tagesdefizit -->') &&
              freshForThisRun(i)
            );
            if (routedToEngineDeficit && engineDeficitIssue) {
              console.log('Tagesdefizit ist bereits im Fachkanal engine-deficit (#' +
                engineDeficitIssue.number + ') gemeldet – kein generisches auto-report-Duplikat.');
              return;
            }
            if (routedToEngineDeficit && !engineDeficitIssue) {
              console.log('Tagesdefizit-Schritt gefunden, aber kein offenes engine-deficit-Issue – fail-open: generische Meldung wird erstellt.');
            }

            // ================================================================
            //  IDENTITÄT: Marker statt Titel (Marken-Oberfläche #496)
            //  Der Titel ist jetzt markenneutral und taugt nicht mehr als
            //  Schlüssel. Erkannt wird an (a) dem unsichtbaren Marker im Body
            //  und (b) – für Meldungen aus der Zeit davor – am Alt-Titel.
            //  Fällt (b) weg, bevor alle Alt-Meldungen geschlossen sind,
            //  entstünden Doppel-Issues; deshalb bleibt es bis dahin stehen.
            // ================================================================
            // Pfad über die Umgebung, damit die Verhaltens-Simulation
            // (scripts/tests/sim/alert_scoping_sim.mjs) dieselbe Identitäts-
            // Quelle einspielen kann wie der echte Lauf – ein Test, der eine
            // andere Namensgebung benutzt als die Produktion, prüft nichts.
            const identPfad = process.env.ALARM_IDENTITAET || '/tmp/alarm-identitaet.json';
            const ident = JSON.parse(require('fs').readFileSync(identPfad, 'utf8'));
            const altTitel = 'Workflow fehlgeschlagen: ' + wfName;
            const open = existing.filter(i => !i.pull_request && (
              (i.body && i.body.indexOf(ident.marker) !== -1) ||
              (i.title && i.title.indexOf(altTitel) !== -1)
            ));
            let nachzufuehren = null;
            // Stille Frischhaltung (WF-9E5A / #761, 26.10.2026): Gleicher Rat,
            // aber der Body zeigt noch auf einen älteren Lauf. Die Meldung
            // wird dann mit frischen Laufdaten neu geschrieben, ohne den Rat
            // anzutasten – kein Duplikat, kein Kommentar, keine Benachrichtigung.
            let aufzufrischen = null;
            if (open.length > 0) {
              const treffer = open[0];
              console.log('Offenes Issue existiert bereits (#' + treffer.number + ') – kein Duplikat.');
              // Still migrieren: Alt-Meldung bekommt den neutralen Titel und den
              // Marker, damit der nächste Lauf sie ohne Titel-Vergleich findet.
              if (!treffer.body || treffer.body.indexOf(ident.marker) === -1) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: treffer.number,
                  title: ident.titel,
                  body: ident.marker + '\n' + (treffer.body || '')
                });
                console.log('↻ Alt-Meldung #' + treffer.number + ' auf markenneutralen Titel migriert.');
                return;
              }
              // ==============================================================
              //  LAGEBILD NACHFÜHREN (WF-9E5A / #761, 15.10.2026)
              //  Hat sich die Klasse geändert (oder fehlt der Klassen-Marker
              //  noch: Bestand vor dieser Regel), wird die Meldung unten mit
              //  Rat, Lauf und Schritten DIESES Laufs neu geschrieben. Nummer,
              //  Titel und Identität bleiben; eine Body-Änderung benachrichtigt
              //  niemanden.
              //  Nur bei bekannter Job-Lage: Ohne Schritte fiele jede Klasse auf
              //  den allgemeinen Rat zurück und überschriebe einen präziseren.
              // ==============================================================
              if (!jobsKnown) {
                console.log('Job-Lage unbekannt – der Rat in #' + treffer.number + ' bleibt unverändert.');
                return;
              }
              if (treffer.body.indexOf(runbookMarker) !== -1) {
                // ============================================================
                //  STILLE FRISCHHALTUNG (WF-9E5A / #761, 26.10.2026)
                //  Der Rat stimmt noch – aber eine offene Meldung, deren
                //  Lauf-Link zehn Tage alt ist, widerspricht ihrem eigenen
                //  Satz „Rat und Lauf oben sind aktuell“. Zeigt der Body
                //  bereits auf GENAU diesen Lauf (Webhook-Redelivery,
                //  Neuversuch desselben Runs), bleibt er unangetastet. Sonst
                //  wird er mit derselben Klasse, aber frischen Laufdaten
                //  (Run-Link, Zeit, Commit, fehlgeschlagene Jobs) neu
                //  geschrieben. Der alert-jobs-Marker bleibt so ebenfalls
                //  aktuell – der Auto-Close prüft danach den jüngsten Befund.
                // ============================================================
                if (treffer.body.indexOf(runUrl) !== -1) {
                  console.log('Rat und Lauf in #' + treffer.number + ' sind bereits aktuell (Lauf ' + run.id + ') – keine Umschrift.');
                  return;
                }
                aufzufrischen = treffer;
              } else {
                nachzufuehren = treffer;
              }
            }

            const lines = [
              ident.marker,
              runbookMarker,
              // JOB-MARKER FÜR DEN AUTO-CLOSE (WF-E813 / #809, 19.10.2026):
              // „Behoben“ heißt künftig: jeder hier genannte Job ist im
              // auflösenden Lauf vorhanden und grün (scripts/alert_resolve_gate.py).
              // Ohne diesen Marker kennt resolve nur den Workflow-Namen – genau
              // so schloss ein Push-Lauf die Meldung der Sicherheits-Wache,
              // deren Live-Job in jenem Lauf ausgesetzt war (#782/#798/#809).
              // `<` und `>` gehen als JSON-Escapes in den Kommentar, damit kein
              // Job-Name die HTML-Kommentar-Schranke sprengen kann (F-09).
              '<!-- alert-jobs: ' + JSON.stringify(failedJobs.map(j => String(j.name)))
                .replace(/</g, '\\u003c').replace(/>/g, '\\u003e') + ' -->',
              '> Vorgang **' + ident.code + '** · Bereich *' + ident.bereich + '* · Zuordnung: ' +
                '`python3 scripts/alert_issue_identity.py --tabelle`',
              '',
              '## ' + wfNameRein + ' ist fehlgeschlagen (' + kanalRein(conclusion, 20) + ')',
              '',
              '- **Workflow:** ' + wfNameRein,
              '- **Branch:** ' + branchRein + ' · **Commit:** `' + headSha + '`',
              '- **Zeit:** ' + created + ' · **Event:** `' + event + '`' + (run.run_attempt > 1 ? ' · **Versuch:** ' + run.run_attempt : ''),
              '- **Run:** [Details ansehen](' + runUrl + ')'
            ];
            // Sowohl der Klassenwechsel (nachzufuehren) als auch die stille
            // Frischhaltung (aufzufrischen) schreiben eine bestehende Meldung
            // neu – das „Offen seit“-Datum bleibt das der Erstanlage.
            const bestehendeMeldung = nachzufuehren || aufzufrischen;
            if (bestehendeMeldung) {
              const seit = Date.parse(bestehendeMeldung.created_at || '');
              lines.push('- **Offen seit:** ' +
                (Number.isNaN(seit) ? 'unbekannt' : new Date(seit).toLocaleString('de-DE', { timeZone: 'Europe/Berlin' })) +
                ' · *Mit dem jüngsten Lauf nachgeführt – Rat und Lauf oben sind aktuell.*');
            }
            lines.push('');
            if (failedJobs.length > 0) {
              lines.push('### Fehlgeschlagene Schritte (direkt aus dem Lauf)');
              for (const j of failedJobs) {
                const steps = j.steps.length ? ' – ' + j.steps.map(s => '„' + s + '“').join(' → ') : '';
                lines.push('- Job **„' + j.name + '“** ([Log](' + j.url + '))' + steps);
              }
              lines.push('');
            }
            // Links statt bloßer Pfade: Meldungen werden oft am Telefon gelesen.
            // Workflow-Datei und Anleitung sichert test_alert_scoping.py ab.
            const repoUrl = (context.serverUrl || 'https://github.com') + '/' +
              context.repo.owner + '/' + context.repo.repo;
            const backupAnleitung = '[`docs/ANLEITUNG-OFFSITE-BACKUP.md`](' + repoUrl +
              '/blob/' + encodeURI(defaultBranch) + '/docs/ANLEITUNG-OFFSITE-BACKUP.md)';
            const backupLaeufe = repoUrl + '/actions/workflows/backup-offsite.yml';
            const handlung = runbookKlasse === 'engine-fruehabbruch'
              ? [
                  '1. **Frühabbruch vor der Endabnahme:** Phase 0.5 ist der fehlgeschlagene Pflichtschritt. Falls „Do not report a quota deficit as success“ ebenfalls rot ist, ist es nur die Schlussklassifikation. Das belegt weder ein Tagesdefizit noch einen API-Key-Ausfall.',
                  '2. Öffne das Log von „Phase 0.5 – Kadenz-Gate sicherstellen“. Die ERR-Annotation nennt den exakten Befehl und Exit-Code.',
                  '3. Bei einem Selbsttest-Exit 2: `python3 scripts/selftest_ki.py --trap <skript>` ausführen. Schlüssel nur ändern, wenn der Pre-Flight-Schritt den Key ausdrücklich als Ursache nennt.'
                ]
              : runbookKlasse === 'engine-schlussklassifikation'
                ? [
                    '1. **Einordnung:** „Do not report a quota deficit as success“ ist der Abschluss-Classifier, nicht automatisch die Fehlerursache.',
                    '2. Öffne dessen Log und lies die `::error::`-Annotation. Sie unterscheidet FRÜHABBRUCH, TAGESDEFIZIT, RELEASE-CRASH und SYNCHRONVERLUST und nennt den zuständigen Schritt.',
                    '3. Folge der dort genannten Diagnose. API-Schlüssel nur ändern, wenn der Pre-Flight-Schritt den Key ausdrücklich als Ursache nennt.'
                  ]
                : runbookKlasse === 'backup-einrichtung'
                ? [
                    '1. **Einrichtung unvollständig – ein Neustart hilft nicht.** „Voraussetzungen prüfen“ ist absichtlich rot (fail-closed): Mindestens ein Zugang oder Ziel der Sicherung fehlt, ist falsch oder abgelaufen. Bis das erledigt ist, werden Abonnenten und Einwilligungsnachweise NICHT gesichert.',
                    '2. Den **jüngsten** Lauf öffnen ([Läufe von „Offsite-Backup“](' + backupLaeufe + '), oberster Eintrag) → **Summary**: Die Checkliste E1–E8 nennt jeden offenen Punkt mit dem Link, unter dem er erledigt wird. Schritt für Schritt: ' + backupAnleitung + '.',
                    '3. Danach Actions → „Offsite-Backup“ → „Run workflow“ (Branch `main`). Der erste grüne Lauf schließt diese Meldung automatisch.'
                  ]
                : runbookKlasse === 'backup-frist'
                ? [
                    '1. **Die Sicherung ist gelaufen.** Rot ist nur die Fristwarnung: Ein Zugang läuft in weniger als 14 Tagen ab.',
                    '2. Welcher, nennt die Annotation des Schritts „Fristwarnung“. Neuen Zugang erzeugen und das Secret im Environment `backup` ersetzen: ' + backupAnleitung + ', Abschnitt „Zugänge erneuern“.',
                    '3. Der nächste grüne Lauf (nachts oder per „Run workflow“) schließt diese Meldung automatisch.'
                  ]
                : runbookKlasse === 'backup'
                ? [
                    failedJobs.length > 0
                      ? '1. Öffne das Log des oben rot markierten Schritts – seine Annotation nennt die Ursache.'
                      : '1. Öffne den Run-Link oben und schaue in das Log des fehlgeschlagenen Schritts.',
                    '2. Häufig: ein vorübergehender Ausfall von GitHub oder Cloudflare (https://www.githubstatus.com · https://www.cloudflarestatus.com) → Actions → „Offsite-Backup“ → „Run workflow“. Oder ein Zugang wurde widerrufen bzw. hat zu wenig Rechte – dann nennt ihn die Annotation.',
                    '3. Fehlerbilder und Abhilfe: ' + backupAnleitung + ', Abschnitt „Fehlerbilder“.'
                  ]
                : runbookKlasse === 'backup-frisch'
                ? [
                    '1. **Operative RPO-Wache rot:** Die Konfiguration (E1–E8) kann grün sein, aber die Sicherung hat seit >52 h kein frisches Release erzeugt. RPO von 24 h ist verletzt – kein Scheduler-Problem ignorieren.',
                    '2. In der Job-Zusammenfassung des Laufs „Backup-Frischwache“ steht, welche Familie fehlt oder wie alt sie ist (`backup-*` / `kv-backup-*`). Läuft „Offsite-Backup“ noch täglich 03:00 UTC? Scheduler-Verspätungen bis 12:03 MESZ sind belegt – ab 13:00 UTC muss dennoch ein Release da sein.',
                    '3. Häufigste Ursachen: Scheduler-Hänger (Actions → „Offsite-Backup“ → jüngster Lauf fehlt → `Run workflow` auf `main`), still widerrufenes Token ohne Ablaufdatum (E2/E5 prüfen), Branch-Regel am Environment `backup` blockiert `main`. Details: ' + backupAnleitung + ', Abschnitte „Fehlerbilder“ und „Betriebszusagen (SLA·RPO·RTO)“. ' + backupLaeufe + ' liefert die Gegenseite.',
                    '4. Nach der Korrektur liefert der nächste grüne Lauf von „Backup-Frischwache“ den Beweis – er schließt diese Meldung automatisch. Gelb (>36 h) ist nur Frühwarnung, noch kein Ausfall.'
                  ]
                : runbookKlasse === 'installation'
                  ? [
                      '1. **Abhängigkeiten nicht installierbar.** Zum Installieren braucht der Lauf keinen API-Key – die Ursache liegt im Paketstand. Bei npm ist meist `package.json` oder `package-lock.json` defekt (z. B. ein Merge-Rest): `python3 scripts/manifest_guard.py` (oder `npm run manifest:check`) nennt Datei, Zeile und Ursache.',
                      '2. Bei pip: Paketname und Version im roten Schritt prüfen. Erst danach einen Registry- oder GitHub-Ausfall prüfen (https://www.githubstatus.com) und den Lauf neu starten.'
                    ]
                  : runbookKlasse === 'sicherheit-live'
                    ? [
                        '1. **Zwei unabhängige Live-Prüfungen sind rot:** F-01 (Sicherheits-Header) UND Worker-Zustand (F-02/F-03/F-08). Nur die Header zu reparieren reicht nicht. Die einzelnen Messbefunde stehen als Annotationen und in der Lauf-Zusammenfassung; die bereinigten Berichte liegen im Artefakt `sicherheits-live-nachweis`.',
                        '2. **F-01:** BEFUND = es wurde gemessen, und etwas fehlt. Ohne aktiven Proxy kann die Header-Regel nicht wirken: `docs/SICHERHEIT-BETRIEB-RUNBOOK.md`, A1 (beide DNS-Hosts Proxied, SSL Full oder Full (strict), Regel `FF Sicherheits-Header` mit acht Kopfzeilen aus `cloudflare/edge-schutz.md` – per `npm run edge:freigabe:apply`, danach `npm run edge:b7:apply`). Bei STOERUNG nichts an Cloudflare auf Verdacht ändern.',
                        '3. **Worker:** Die Worker-Annotation nennt die konkrete Abweichung oder STOERUNG (Deploy-Diagnose über `/healthz`-Build-Stempel `bau` vs. Zugangs-Diagnose `NEWSLETTER_WORKER_EXPORT_KEY`). Runbook A3/A4 und D2: Widget UND Prüfung abgleichen, Tagesdeckel prüfen, bei unvollständigem authentifiziertem Betriebsbild den tatsächlich ausgeführten Worker-Deploy und den Leseschlüssel prüfen. Der Deploy-Resolver liest nach der Environment-Freigabe die bestehende `ABO`-Bindung aus `ff-newsletter`; fehlende/mehrdeutige Bindungen brechen rot ab. `KV_NAMESPACE_ID_ABO` ist dafür nur optionaler Bootstrap, für das separate Backup weiterhin erforderlich. Ein grüner Plan mit übersprungenem Deploy ist kein Deploy-Nachweis. Keine Schlüssel veröffentlichen und keinen Bot-Schutz abschalten.',
                        '4. **Abschluss:** Nach den belegten Korrekturen die Sicherheits-Wache auf `main` manuell starten. Nur ein vollständiger erfolgreicher Live-Nachweis schließt diesen Vorgang; ein grüner Offline-/Push-Lauf, fehlender Leseschlüssel oder TEILWEISE genügt nicht.'
                      ]
                  : runbookKlasse === 'sicherheit-worker'
                    ? [
                        '1. **Worker-Zustand (F-02/F-03/F-08):** Dieser Schritt prüft das authentifizierte Betriebsbild, nicht die HTTP-Kopfzeilen des Blogs. Die einzelne Worker-Annotation und die Lauf-Zusammenfassung nennen die Ursache; `worker-live.md/json` im Artefakt `sicherheits-live-nachweis` enthalten keine Abonnentendaten oder Schlüssel.',
                        '2. **BEFUND:** Den belegten Widerspruch beheben: Turnstile-Site-Key und Worker-Secret müssen zusammenpassen (A3); Budget und Schlüsselrollen mit dem Soll abgleichen (A4/D2 in `docs/SICHERHEIT-BETRIEB-RUNBOOK.md`). Kein Secret entfernen, um die Prüfung grün zu bekommen.',
                        '3. **STOERUNG:** Fehlender/abgelehnter Leseschlüssel, öffentliche/minimale oder veraltete /healthz-Antwort und Netzstörung sind ausdrücklich NICHT geprüft, kein belegter Sicherheitsbefund. Die Deploy-/Zugangs-Annotation unterscheidet anhand von `bau` deterministisch zwischen übersprungenem/altem Worker-Deploy und falschem Leseschlüssel – nicht GROQ/GEMINI und nicht die Header-Regel. Der Deploy-Resolver liest die bestehende `ABO`-Bindung automatisch; `KV_NAMESPACE_ID_ABO` ist nur noch optionaler Bootstrap bzw. separater Backup-Vertrag.',
                        '4. **WACHE-FEHLER:** Fehlender/kaputter Bericht oder widersprüchlicher Exit-Code bedeutet eine defekte Prüfung. Diese reparieren; keine Worker-Einstellung auf Verdacht ändern.',
                        '5. Danach die Sicherheits-Wache auf `main` mit Live-Messung starten; nur ihr vollständiger erfolgreicher Live-Nachweis schließt die Meldung.'
                      ]
                  : runbookKlasse === 'sicherheit-nachweis'
                    ? [
                        '1. **Live-Nachweis unvollständig:** Die Einzelmessungen sind kein vollständiger Abschlussbeweis (zum Beispiel F-01 TEILWEISE, offener Datenschutz-B7 oder ein fehlender/ungültiger Messbericht). Das ist kein zusätzlicher Sicherheitsbefund.',
                        '2. Lauf-Zusammenfassung „Live-Nachweis“ prüfen; sie nennt das fehlende Ziel, den Abschlussblocker oder den WACHE-FEHLER. Messung/Prüfung wiederherstellen und erneut live messen; keine Sicherheitsregel auf Verdacht abschalten. Bei offenem B7 den Datenschutztext mit `npm run edge:b7:apply` angleichen, committen und danach erneut live nachweisen.',
                        '3. Abschlussvertrag und Rückfallschutz: `docs/SICHERHEIT-BETRIEB-RUNBOOK.md`, D1/D2; `python3 -m unittest scripts.tests.test_sicherheits_nachweis`.'
                      ]
                  : runbookKlasse === 'sicherheit-header'
                    ? [
                        '1. **Einordnung:** Dieser F-01-Schritt misst ausschließlich HTTP-Kopfzeilen der eigenen Seite. Sie braucht keinen Schlüssel und kein Modell – ein abgelaufener GROQ- oder GEMINI-Schlüssel kann diesen Schritt nicht auslösen.',
                        '2. **Die Klasse steht im Log und in der Lauf-Zusammenfassung.** BEFUND = es wurde gemessen, und etwas fehlt. STOERUNG = es wurde nichts gemessen; das ist ausdrücklich keine Aussage über die Sicherheit, sondern eine ausgefallene Messung.',
                        '3. **Bei BEFUND:** Steht in der Zusammenfassung „Proxy nicht aktiv" (kein `cf-ray`), kann die Header-Regel gar nicht wirken → `docs/SICHERHEIT-BETRIEB-RUNBOOK.md`, A1 Schritt 1 (Wolke auf *Proxied*) und Schritt 2 (SSL-Modus `Full (strict)` oder `Full`, niemals `Flexible`), danach Schritt 3. Steht dort „Proxy aktiv", ist die Regel unvollständig → `cloudflare/edge-schutz.md`, Abschnitt A1 (Regel `FF Sicherheits-Header`, acht Kopfzeilen).',
                        '4. **Bei STOERUNG:** Erreichbarkeit prüfen (`curl -sI https://franksfinanzcheck.de/`) und den Lauf neu starten. Kein Eingriff in Cloudflare nötig – ohne Messung ist keine Lücke belegt.',
                        '5. **Bei WACHE-FEHLER:** Die Prüfung selbst ist defekt (z. B. leerer Exit-Code oder fehlender Bericht). Workflow und Skript prüfen; keine Cloudflare-Regel auf Verdacht ändern. Regressionstest: `python3 -m unittest scripts.tests.test_blog_header_gate scripts.tests.test_sicherheits_nachweis` (einschließlich echter Shell-Ausführung mit Bash `-e`).',
                        '6. **Abschluss nur mit Live-Nachweis:** Ein grüner Offline-/Push-Lauf schließt diesen Vorgang nicht. Nach der Korrektur die Sicherheits-Wache auf `main` mit Live-Messung starten.'
                      ]
                    : runbookKlasse === 'sicherheit-wache'
                      ? [
                          '1. **Einordnung:** Die Sicherheits-Wache prüft das Repository gegen die Befunde F-01 bis F-10 (`SICHERHEITSAUDIT-PREMIUM-2026-10-14.md`) sowie die gepinnten Abhängigkeiten (`docs/SICHERHEIT-BETRIEB-RUNBOOK.md`, Abschnitt E). Rot heißt: eine Wache hat angeschlagen – kein Schlüssel- und kein Kapazitätsthema.',
                          '2. Öffne das Log des oben rot markierten Schritts. Jede Wache nennt Fundstelle und Regel, nicht nur „rot".',
                          '3. Alle Wachen lokal nachfahren: `npm run test:sicherheit` (Inhalts-HTML, Header-Vorlage, Edge-Freigabe, Worker-Betrieb, Deploy-Vorbereitung, n8n-Kette und Abhängigkeits-Pins – jeweils mit Selbsttest, offline; Online-Advisory-Audit: `npm run deps:audit`).'
                        ]
                      : runbookKlasse === 'selbsttest'
                        ? [
                            '1. **Einordnung: Code-Regression, kein Betriebsausfall.** Rot ist ein Selbsttest – die Wache hat ihr eigenes Prüfwerkzeug geprüft und für defekt befunden. Selbsttests laufen offline und mit Attrappen-Schlüsseln (KI-Probe, #138): Ein abgelaufener GROQ-/GEMINI-Schlüssel oder ein GitHub-Ausfall löst diesen Schritt nicht aus, und ein Neustart liefert dasselbe Rot.',
                            '2. **Nachfahren:** `python3 scripts/selftest_runner.py` prüft alle Wachen wie das Qualitäts-Gate; die Zeile mit ❌ nennt Skript und gebrochenen Vertrag. Einzeln: `python3 scripts/<wache>.py --selftest`.',
                            '3. **Ursache eingrenzen:** `git log -5 --format="%h %ad %s" --date=short -- scripts/<wache>.py`. Ist zugleich die Meldung „Qualitätsprüfung rot (Selbsttests, Vertrag oder Aufbau)“ offen, kam der Fehler mit einem Merge – der Qualitäts-Gate-Lauf jenes Commits zeigt dieselbe Zeile.',
                            '4. **Heilen:** den Code reparieren und erst mit grünen Checks mergen. Diese Meldung schließt sich beim nächsten grünen Lauf auf `main` selbst.'
                          ]
                      : [
                        failedJobs.length > 0
                          ? '1. Öffne das Log des oben rot markierten Schritts – es nennt die echte Ursache.'
                          : '1. Öffne den Run-Link oben und schaue in das Log des fehlgeschlagenen Schritts.',
                        '2. Häufigste Ursachen:',
                        '   - **API-Key abgelaufen** (GROQ/GEMINI) → Secrets in den Repo-Einstellungen aktualisieren',
                        '   - **GitHub-Ausfall** → auf https://www.githubstatus.com prüfen',
                        '   - **Transienter Fehler** → Workflow manuell neu starten (Actions → Run workflow)'
                      ];
            lines.push(
              '### Was du tun solltest',
              ...handlung,
              '',
              '---',
              istSicherheitsWache
                ? '*Automatisch erstellt. Der Vorgang bleibt bis zum vollständigen erfolgreichen Live-Nachweis offen.*'
                : '*Automatisch erstellt vom Fehler-Alerting-Workflow – du musst nichts manuell prüfen.*'
            );
            const body = lines.join('\n');

            if (bestehendeMeldung) {
              const istFrischhaltung = !nachzufuehren;
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: bestehendeMeldung.number,
                  title: ident.titel,
                  body: body
                });
                console.log('↻ Meldung #' + bestehendeMeldung.number
                  + (istFrischhaltung
                    ? ' still frisch gehalten: Rat „' + runbookKlasse + '“ bleibt, Laufdaten aktualisiert aus Lauf ' + run.id + '.'
                    : ' nachgeführt: Rat „' + runbookKlasse + '“ aus Lauf ' + run.id + '.'));
              } catch (e) {
                // Fail-open: Die Meldung bleibt offen und auffindbar, nur ihr Rat
                // bleibt alt. Ein Absturz hier stellte das Alerting selbst rot.
                console.log((istFrischhaltung ? 'Frischhaltung' : 'Nachführen') + ' von #'
                  + bestehendeMeldung.number + ' fehlgeschlagen (' + e.message
                  + ') – Meldung bleibt unverändert offen.');
              }
              return;
            }

            // Label "auto-report" sicherstellen (zentrales Fehlermeldungs-Label).
            // Darüber werden erledigte Meldungen später automatisch aufgeräumt.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'auto-report',
                color: 'd73a4a',
                description: 'Automatisch erkannte Fehlermeldung'
              });
            } catch (e) { /* Label existiert bereits – ok */ }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: ident.titel,
              body: body,
              labels: ['auto-report']
            });
            console.log('✅ Meldung erstellt: ' + ident.titel + ' (' + wfNameRein + ')');

  # ------------------------------------------------------------
  #  AUTO-CLOSE: Behobene Fehlermeldungen automatisch schließen
  #
  #  Läuft der beobachtete Workflow wieder GRÜN, wird das zugehörige
  #  offene Issue (Label auto-report) geschlossen. Die dauerhafte
  #  Löschung übernimmt der Workflow "Erledigte Fehlermeldungen
  #  dauerhaft löschen" nach Ablauf der Schonfrist.
  #
  #  PRODUKTIONS-SCOPING (Fehlalarm-Klasse #343, 21.09.2026):
  #  Geschlossen wird ein Alarm NUR durch einen grünen Lauf AUF DEM
  #  DEFAULT-BRANCH – symmetrisch zur Erzeugung. Ein grüner Zweig-/
  #  PR-Lauf beweist nichts über die Produktion; genau so wurde #343
  #  von einem Lauf des Zweigs arena/01a0c4dc-… geschlossen, ohne
  #  dass sich am Produktionsstand irgendetwas geändert hätte.
  #
  #  JOBBEWEIS (WF-E813 / #809, 19.10.2026) – die zweite Hälfte
  #  derselben Regel: Ein grüner Lauf beweist auch dann nichts über
  #  den Fehler der Meldung, wenn er den betroffenen Job gar nicht
  #  ausgeführt hat. Die Sicherheits-Wache führt ihren Live-Job nur
  #  bei schedule/workflow_dispatch aus; Push-Läufe sind grün, ohne
  #  je gemessen zu haben – und schlossen #782 und #798 mit „✅
  #  Behoben: Der Vorgang läuft wieder fehlerfrei“. WF-E813 meldete
  #  sich daraufhin innerhalb von fünf Tagen zum vierten Mal (#809).
  #  Seitdem entscheidet scripts/alert_resolve_gate.py: Jeder Job,
  #  den die Meldung als fehlgeschlagen benannt hat (Marker
  #  <!-- alert-jobs: [...] -->, Altform: die Job-Zeilen im Body),
  #  muss im auflösenden Lauf vorhanden und `success` sein. Sonst
  #  bleibt die Meldung offen – mit Grund, statt mit einer Lüge.
  # ------------------------------------------------------------
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == (github.event.repository.default_branch || 'main') &&
          github.event.workflow_run.event != 'pull_request' }}
    steps:
      - name: Repository auschecken (Identitäts-Quelle)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Behobene Fehlermeldung schließen (Marker-Identität, Job-Beweis, Alt-Titel inbegriffen)
        env:
          GH_TOKEN: ${{ github.token }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail

          # WF-E813/#809: Ein Offline-Push auf main schloss #798, obwohl
          # der Live-Job übersprungen war. Erfolg ist nur mit ausgeführten
          # Messungen UND erfolgreichem Live-Nachweis ein Abschlussbeweis.
          # Die API-Lage ist fail-closed: ohne Nachweis bleibt das Issue offen.
          if [ "$WF_NAME" = "Sicherheits-Wache" ]; then
            if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100" \
              --jq '.jobs[]' | jq -s . > sicherheits-jobs.json; then
              echo "::warning::Live-Job-Lage nicht abrufbar – Sicherheitsmeldung bleibt offen."
              exit 0
            fi
            if ! python3 scripts/sicherheits_nachweis.py --abschluss sicherheits-jobs.json --ereignis "$RUN_EVENT"; then
              echo "Kein vollständiger Live-Nachweis – Sicherheitsmeldung bleibt offen."
              exit 0
            fi
          fi

          # Identität aus derselben Quelle wie beim Anlegen – ein zweiter,
          # abweichender Namensgeber wäre die klassische Stelle, an der
          # Meldungen für immer offen stehen bleiben.
          MARKER="$(python3 scripts/alert_issue_identity.py --workflow "$WF_NAME" --json | jq -r .marker)"
          ALT_TITEL="⚠️ Workflow fehlgeschlagen: ${WF_NAME}"
          # Kanal-Hygiene (Sicherheitsaudit 15.10.2026, F-09): Der Zweigname
          # stammt aus dem Webhook und geht in einen Markdown-Kommentar. Beim
          # VERGLEICH bleibt er unverändert (sonst passte er nicht mehr zum
          # bestehenden Issue), in der AUSGABE wird er entschärft.
          RUN_BRANCH_SAUBER="$(python3 scripts/alert_issue_identity.py --saeubern "$RUN_BRANCH")"
          WF_NAME_SAUBER="$(python3 scripts/alert_issue_identity.py --saeubern "$WF_NAME")"
          echo "Schlüssel: ${MARKER} · Übergangsform: ${ALT_TITEL}"

          # Body UND Titel prüfen: Marker (neu) oder Alt-Titel (Übergang).
          # Ohne den Alt-Pfad bliebe jede vor der Umstellung erzeugte Meldung
          # für immer offen – genau der Fehler, den diese Umstellung vermeiden soll.
          gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label auto-report --limit 200 --json number,title,body > /tmp/offene.json
          NUMMERN="$(jq -r --arg m "$MARKER" --arg t "$ALT_TITEL" \
              '.[] | select((.body // "" | contains($m)) or (.title // "" | startswith($t))) | .number' \
              /tmp/offene.json)"

          if [ -z "$NUMMERN" ]; then
            echo "Keine offene Meldung zu diesem Vorgang – nichts zu schließen."
            exit 0
          fi

          # JOBBEWEIS DIESES LAUFS (WF-E813 / #809): „Behoben“ braucht den
          # Job, der rot war – nicht irgendeinen grünen Lauf. Die Job-Liste
          # wird nur geholt, wenn eine Meldung überhaupt Jobs nennt
          # (scripts/alert_resolve_gate.py --nennt-jobs); Meldungen der
          # Übergangsform ohne Job-Nennung behalten ihren bisherigen
          # Schließpfad (Vertrag: die übrigen Workflows behalten ihren
          # Abschlussweg). Scheitert die Abfrage, lautet die Entscheidung
          # fail-safe: offen, nie „Behoben“ ohne Beweis.
          LAUF_JOBS=""

          for n in $NUMMERN; do
            jq -r --argjson nr "$n" \
              '.[] | select(.number == $nr) | .body // ""' /tmp/offene.json \
              > "/tmp/meldung-${n}.md"
            if ! python3 scripts/alert_resolve_gate.py \
                 --body "/tmp/meldung-${n}.md" --nennt-jobs; then
              gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
                --comment "✅ Behoben: Der Vorgang läuft wieder fehlerfrei auf \\`${RUN_BRANCH_SAUBER}\\` ([Run](${RUN_URL})). Diese Meldung wird nach der Aufräum-Frist dauerhaft gelöscht."
              echo "→ Issue #$n geschlossen (Übergangsform ohne Job-Nennung)."
              continue
            fi
            if [ -z "$LAUF_JOBS" ]; then
              if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
                   --paginate --jq '.jobs[] | {name, conclusion}' \
                   | jq -s '{jobs: .}' > /tmp/lauf-jobs.json; then
                LAUF_JOBS="/tmp/lauf-jobs.json"
              else
                echo '{ "jobs": [] }' > /tmp/lauf-jobs.json
                LAUF_JOBS="/tmp/lauf-jobs.json"
                echo "::notice::Job-Liste des Laufs nicht abrufbar – ohne Beweis bleibt jede Meldung offen."
              fi
            fi
            ENTSCHEID="$(python3 scripts/alert_resolve_gate.py \
              --body "/tmp/meldung-${n}.md" --jobs /tmp/lauf-jobs.json --json \
              || echo '{"schliessen": false, "grund": "Entscheidung nicht möglich (Werkzeugfehler) – ohne Beweis kein Behoben."}')"
            if [ "$(jq -r '.schliessen' <<<"$ENTSCHEID")" = "true" ]; then
              gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
                --comment "✅ Behoben: Der Vorgang läuft wieder fehlerfrei auf \`${RUN_BRANCH_SAUBER}\` ([Run](${RUN_URL})). Diese Meldung wird nach der Aufräum-Frist dauerhaft gelöscht."
              echo "→ Issue #$n geschlossen: $(jq -r '.grund' <<<"$ENTSCHEID")"
            else
              GRUND="$(jq -r '.grund' <<<"$ENTSCHEID")"
              echo "::notice::Issue #${n} bleibt offen: ${GRUND}"
              echo "→ Issue #${n} bleibt offen: ${GRUND}"
            fi
          done
          echo "Auto-Close-Prüfung abgeschlossen."
