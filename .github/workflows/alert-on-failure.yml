# ============================================================
#  ZENTRALES FEHLER-ALERTING (Profi-Monitoring)
#
#  Beobachtet ALLE automatischen Workflows. Schlägt einer fehl
#  (z. B. abgelaufener API-Key, Deploy-Fehler, SEO-Gate), wird
#  automatisch ein GitHub-Issue erstellt – du erfährst es ohne
#  manuelles Prüfen der Actions-Seite.
#
#  So funktioniert's: workflow_run-Trigger feuert NACH Abschluss
#  jedes gelisteten Workflows. Bei conclusion=failure/cancelled
#  → Issue mit Workflow-Name, Run-Link, Event UND den konkret
#  fehlgeschlagenen Jobs/Schritten (Diagnose statt Raten – Lehre
#  aus INCIDENT-2026-09-19: „die Meldung riet, das Log hätte es
#  gewusst").
#
#  Kein manuelles Zutun nötig – das System meldet sich selbst.
#
#  PRODUKTIONS-SCOPING (Reparatur der Fehlalarm-Klasse #343,
#  21.09.2026 – docs/INCIDENT-2026-09-21-layout-ai-fehlalarm-343.md):
#  Gemeldet wird NUR, was die Produktion betrifft:
#    · Lauf auf dem Default-Branch (main)  → Alarm
#    · Lauf auf einem Arbeits-/PR-Zweig    → KEIN Alarm
#  Rote Dev-Läufe sind als Checks am PR bzw. Zweig sichtbar und
#  gehören zum Handwerk – sie sind kein Vorfall. Drei Folgefehler
#  der alten Regel „jeder rote Lauf = Issue" verschwinden damit
#  strukturell:
#    1) FEHLALARM-LÄRM: #343 meldete „Layout-AI fehlgeschlagen"
#       für einen pull_request-Lauf eines Zweigs, der mitten in
#       der Entwicklung rot war und 57 Minuten später aus sich
#       heraus grün wurde – Produktion war nie betroffen.
#    2) DEDUPE-VERGIFTUNG: Solange so ein Dev-Issue offen stand,
#       unterdrückte der Dedupe-Filter ECHTE main-Fehler desselben
#       Workflows (gleiche Blindstelle wie Issue #218: ein offenes
#       Fehlalarm-Issue schluckt die echte Meldung).
#    3) FALSCH-GRÜN-SCHLUSS: Der resolve-Job schloss Alarme, wenn
#       IRGENDEIN Lauf des Workflows grün wurde – auch ein Zweig-
#       Lauf. Ein grüner Zweig beweist nichts über main; #343 wurde
#       genau so geschlossen. Deshalb schließt resolve ebenfalls
#       nur bei Grün AUF DEM DEFAULT-BRANCH (symmetrische Regel).
#  Der workflow_run-Vertrag (Wacht-Liste, types: [completed],
#  Name „Fehler-Alerting") bleibt unangetastet – der Alerting-
#  Herzschlag (alerting_heartbeat.py) liest ihn aus dieser Datei.
#
#  BEWUSST NICHT ÜBERWACHT:
#    - "Fehler-Alerting" selbst (kann sich nicht selbst beobachten)
#    - "Textverständnis-Patches einspielen (einmalig)" (Einmal-Aktion)
#    - "Alerting-Herzschlag (workflow_run-Zustellung)" – er ist die Wache
#      ÜBER DIESEN KANAL: zählt täglich per cron nach, ob die Ereignisse
#      überhaupt ankommen (Befund E des Gate-Vorfalls 18.09.2026: ~35 %
#      kamen nie an). Ihn über eben diesen Kanal beobachten hieße, im
#      Störungsfall ausgerechnet dann zu schweigen. Er meldet sich selbst.
# ============================================================
name: Fehler-Alerting

on:
  workflow_run:
    workflows:
      - "Deploy auf GitHub Pages"
      - "Qualitäts-Gate (Build + interne Links)"   # PREM-AUDIT: war blind – rote Runs + Issues #85 nur zufällig auffällig
      - "Deploy-Catchup"                            # PREM-AUDIT: ohne ihn treibt ein Bot-Commit den Live-Stand nie nach
      - "Wöchentliche SEO-Optimierung"
      - "AGC-Autopilot (Recherche & Kalender)"    # PREM-AUDIT 08.09.: war blind – Recherche/Planung fiele still aus
      - "Backlink-Automation"
      - "Wöchentliches Nach-Pinnen"
      - "Quartalsweises Artikel-Update"
      - "Bot-Watchdog"
      - "Social-Media-AI"
      - "Content-Reserve (täglicher Vorrat)"
      - "Publication Delivery (öffentlicher Nachweis)"
      - "Publication reliability regression tests"  # PREM-AUDIT 08.09.: CI-Regression war blind
      - "Content-Engine v2"          # Herzstück (ersetzt daily-content, entfernt 2026-08-10)
      - "KI-Redaktion"           # PREM-AUDIT 08.09.: Redaktions-Stilautomatik war blind
      - "Pinterest-AI"           # Pins würden still ausfallen
      - "Pinterest-Token-Wache"  # PREM-AUDIT 08.09.: Lebenszyklus-Wache war blind (#219-Klasse)
      - "Pinterest-Watchdog"     # PREM-AUDIT: Spam-/SEO-Wache lief still aus
      - "Layout-AI"              # Layout-Regressionen still
      - "FrankAutoOps-Report"
      - "Affiliate-Health (Wochenwache)"
      - "Affiliate-Integritäts-Wache (täglich)"    # CTA-Link-Selbstheilung (14.08.)
      - "Willkommenstext-Refresh"     # SEO-Unique-Content-Automatik Startseite (14.08.)
      - "Blog-Gesundheits-Check (täglich)"   # tägliche Selbstheilung – hatte kein eigenes Alerting
      - "Uptime-Monitor"         # PREM-AUDIT: Site-Ausfall nur per Zufall bemerkt
      - "Mastodon-Profil-Sync"   # PREM-AUDIT: Social-Kanal still
      - "Mastodon-SEO"           # PREM-AUDIT: Social-Kanal still
      - "Offsite-Backup"         # PREM-AUDIT: Backup-Versagen wäre still fatal
      - "Issues aufräumen (Triage)"          # PREM-AUDIT: Vollabdeckung
      - "Erledigte Fehlermeldungen dauerhaft löschen"
      - "Dependabot Auto-Merge"
      - "Produktions-Wache (Content-Engine)"
      - "Premium-Governance"
      - "Lesehilfen-Gate (Vorlesen + Kurzfassung)"
      - "Kadenz-Endkontrolle (Mo/Mi/Fr – 2–3 LIVE erzwingen)"
      - "Fristen-Check (Recht)"
      - "Redaktions-Standard Bestand (Capital/WiWo/ZEIT)"
      - "Redaktions-Standard neu (Capital/WiWo/ZEIT)"
      - "Mastodon-Manueller-Post"
      - "Newsletter-Daily (Capture-Wache + Digest)"   # PREM-AUDIT 23.09.: Lauf #14 rot = Versand-Pfad kaputt – aber kein Issue: die Wache war blind für genau den Workflow, der Emails verschickt
      - "Newsletter-Kadenz-Wache"   # PREM-AUDIT 23.09.: sie holt still verworfene Crons nach – kann sie das nicht, muss es laut werden
      - "Claude-Stilpolitur (Mo/Mi/Fr)"   # PREM-AUDIT 25.09.: Gratis-Claude-Lane darf nie still ausfallen (Watch-Name = Workflow-`name:`, exakt)
    types:
      - completed

permissions:
  issues: write
  actions: read   # Issue #218: Jobs/Schritte eines Runs lesen, um verdrängte Läufe zu erkennen

jobs:
  alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' }}
    steps:
      - name: Issue bei fehlgeschlagenem Workflow erstellen
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const wfName = run.name || 'Unbekannter Workflow';
            const conclusion = run.conclusion;
            const runUrl = run.html_url;
            const branch = run.head_branch || '';
            const event = run.event || '?';
            const created = new Date(run.created_at).toLocaleString('de-DE', { timeZone: 'Europe/Berlin' });
            const headSha = run.head_sha ? run.head_sha.slice(0, 8) : '?';

            // ================================================================
            //  PRODUKTIONS-SCOPING (Reparatur Fehlalarm-Klasse #343, 21.09.2026)
            //  --------------------------------------------------------------
            //  Ein Alarm ist ein Vorfall in der PRODUKTION. Läufe auf Arbeits-/
            //  PR-Zweigen (pull_request-Events, push auf arena/*, dependabot/*)
            //  sind Entwicklung: rot ist dort eine Zwischenstufe, sichtbar als
            //  Check am PR – kein Grund, den Betreiber zu wecken. Belegt durch
            //  Issue #343: „Layout-AI fehlgeschlagen" für einen PR-Zweig-Lauf,
            //  der 57 Minuten später von selbst grün war; während das Issue
            //  offen stand, hätte der Dedupe-Filter einen ECHTEN main-Fehler
            //  desselben Workflows verschluckt, und geschlossen wurde es durch
            //  einen grünen ZWEIG-Lauf ohne jeden Produktionsbeweis.
            //  Regel: Alarm nur bei head_branch == default_branch UND Event
            //  != pull_request. (workflow_run läuft immer auf der main-Version
            //  dieser Datei – die Regel gilt damit für alle Zweige repo-weit.)
            // ================================================================
            const defaultBranch = (context.payload.repository && context.payload.repository.default_branch) || 'main';
            const isProdRun = branch === defaultBranch && event !== 'pull_request';
            if (!isProdRun) {
              console.log('Kein Produktions-Lauf: Branch „' + (branch || '(leer)') + '“ ≠ „' + defaultBranch + '“ oder Event „' + event + '“.');
              console.log('Rote Dev-/PR-Läufe sind als Checks am PR/Zweig sichtbar – kein Owner-Alarm (Regel aus Fehlalarm #343, 21.09.2026).');
              return;
            }

            // Jobs EINMAL holen – werden zweimal gebraucht: Phantoms-Filter
            // (Issue #218) und Diagnose-Abschnitt (INCIDENT-2026-09-19).
            let jobs = [];
            let jobsKnown = false;
            try {
              jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 100 }
              );
              jobsKnown = true;
            } catch (e) {
              // Im Zweifel lieber melden als eine echte Störung verschlucken.
              console.log('Job-Abfrage fehlgeschlagen (' + e.message + ') – Diagnose entfällt, Meldung wird sicherheitshalber erstellt.');
            }

            // ================================================================
            //  PHANTOM-FILTER (Reparatur Issue #218, 08.09.2026)
            //  --------------------------------------------------------------
            //  Befund: Issue #218 meldete einen "fehlgeschlagenen" Deploy, der
            //  in Wahrheit NIE GELAUFEN ist. GitHub haelt je Concurrency-Gruppe
            //  genau einen wartenden Lauf vor; trifft ein neuerer Push ein,
            //  wird der wartende Lauf mit `cancelled` verdraengt – ohne eine
            //  einzige Zeile auszufuehren. Geprueft an den echten Runs:
            //  34148140778 (= Issue #218), 34123667405, 34217052055 und
            //  34218421327 hatten allesamt NULL Jobs.
            //
            //  Fachlich ist das voellig unkritisch: `main` ist linear, der
            //  verdraengende Lauf veroeffentlicht denselben Stand inklusive
            //  der neueren Commits. Eine Fehlermeldung dafuer ist ein
            //  Fehlalarm – und ein teurer, denn der Dedupe-Filter unten
            //  unterdrueckt danach ECHTE Meldungen desselben Workflows,
            //  solange das Phantom-Issue offen steht. Genau das ist passiert.
            //
            //  Unterscheidungsmerkmal: Hat der Lauf ueberhaupt etwas
            //  ausgefuehrt? Ein echter Abbruch (z. B. Timeout wie Run
            //  34140579736, 6 h) hat erfolgreich beendete Schritte, ein
            //  verdraengter Lauf hat keine. Nur `cancelled` wird so geprueft –
            //  `failure` meldet weiterhin immer.
            // ================================================================
            if (conclusion === 'cancelled' && jobsKnown) {
              const ranSomething = jobs.some(j =>
                (j.steps || []).some(s => s.conclusion === 'success')
              );
              if (!ranSomething) {
                console.log('Verdrängter Wartelauf (' + jobs.length + ' Jobs, kein ausgeführter Schritt) – kein Fehlalarm.');
                console.log('Der nachfolgende Lauf veröffentlicht denselben Stand inkl. neuerer Commits.');
                return;
              }
              console.log('Echter Abbruch: Der Lauf hatte bereits ausgeführte Schritte – Meldung wird erstellt.');
            }

            // ================================================================
            //  DIAGNOSE: Welche Jobs/Schritte sind wirklich rot?
            //  (Lehre aus INCIDENT-2026-09-19: Eine Meldung, die nur „API-Key?
            //  GitHub-Ausfall?" rät, obwohl der Run den toten Schritt kennt,
            //  schickt den Menschen auf Ratesuche. Deshalb: Namen + Log-Links
            //  der fehlgeschlagenen Jobs/Schritte direkt ins Issue.)
            // ================================================================
            const failedJobs = jobs
              .filter(j => j.conclusion === 'failure' || j.conclusion === 'cancelled')
              .map(j => ({
                name: j.name,
                url: j.html_url,
                steps: (j.steps || [])
                  .filter(s => s.conclusion === 'failure' || s.conclusion === 'cancelled')
                  .map(s => s.name),
              }));

            // Dedupe: offenes Alarm-Issue desselben Workflows? Paginiert –
            // eine einzelne 100er-Seite wäre wieder eine blinde Stelle,
            // sobald das Repo mehr offene Issues trägt.
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const open = existing.filter(i => i.title && i.title.indexOf('Workflow fehlgeschlagen: ' + wfName) !== -1 && !i.pull_request);
            if (open.length > 0) {
              console.log('Offenes Issue existiert bereits (#' + open[0].number + ') – kein Duplikat.');
              return;
            }

            const lines = [
              '## ' + wfName + ' ist fehlgeschlagen (' + conclusion + ')',
              '',
              '- **Workflow:** ' + wfName,
              '- **Branch:** ' + branch + ' · **Commit:** `' + headSha + '`',
              '- **Zeit:** ' + created + ' · **Event:** `' + event + '`' + (run.run_attempt > 1 ? ' · **Versuch:** ' + run.run_attempt : ''),
              '- **Run:** [Details ansehen](' + runUrl + ')',
              ''
            ];
            if (failedJobs.length > 0) {
              lines.push('### Fehlgeschlagene Schritte (direkt aus dem Lauf)');
              for (const j of failedJobs) {
                const steps = j.steps.length ? ' – ' + j.steps.map(s => '„' + s + '“').join(' → ') : '';
                lines.push('- Job **„' + j.name + '“** ([Log](' + j.url + '))' + steps);
              }
              lines.push('');
            }
            lines.push(
              '### Was du tun solltest',
              failedJobs.length > 0
                ? '1. Öffne das Log des oben rot markierten Schritts – es nennt die echte Ursache.'
                : '1. Öffne den Run-Link oben und schaue in das Log des fehlgeschlagenen Schritts.',
              '2. Häufigste Ursachen:',
              '   - **API-Key abgelaufen** (GROQ/GEMINI) → Secrets in den Repo-Einstellungen aktualisieren',
              '   - **GitHub-Ausfall** → auf https://www.githubstatus.com prüfen',
              '   - **Transienter Fehler** → Workflow manuell neu starten (Actions → Run workflow)',
              '',
              '---',
              '*Automatisch erstellt vom Fehler-Alerting-Workflow – du musst nichts manuell prüfen.*'
            );
            const body = lines.join('\n');

            // Label "auto-report" sicherstellen (zentrales Fehlermeldungs-Label).
            // Darüber werden erledigte Meldungen später automatisch aufgeräumt.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'auto-report',
                color: 'd73a4a',
                description: 'Automatisch erkannte Fehlermeldung'
              });
            } catch (e) { /* Label existiert bereits – ok */ }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Workflow fehlgeschlagen: ' + wfName + ' (' + conclusion + ')',
              body: body,
              labels: ['auto-report']
            });
            console.log('✅ Issue erstellt für ' + wfName);

  # ------------------------------------------------------------
  #  AUTO-CLOSE: Behobene Fehlermeldungen automatisch schließen
  #
  #  Läuft der beobachtete Workflow wieder GRÜN, wird das zugehörige
  #  offene Issue (Label auto-report) geschlossen. Die dauerhafte
  #  Löschung übernimmt der Workflow "Erledigte Fehlermeldungen
  #  dauerhaft löschen" nach Ablauf der Schonfrist.
  #
  #  PRODUKTIONS-SCOPING (Fehlalarm-Klasse #343, 21.09.2026):
  #  Geschlossen wird ein Alarm NUR durch einen grünen Lauf AUF DEM
  #  DEFAULT-BRANCH – symmetrisch zur Erzeugung. Ein grüner Zweig-/
  #  PR-Lauf beweist nichts über die Produktion; genau so wurde #343
  #  von einem Lauf des Zweigs arena/01a0c4dc-… geschlossen, ohne
  #  dass sich am Produktionsstand irgendetwas geändert hätte.
  # ------------------------------------------------------------
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == (github.event.repository.default_branch || 'main') &&
          github.event.workflow_run.event != 'pull_request' }}
    steps:
      - name: Behobene Fehlermeldung schließen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WF_NAME="${{ github.event.workflow_run.name }}"
          RUN_URL="${{ github.event.workflow_run.html_url }}"
          RUN_BRANCH="${{ github.event.workflow_run.head_branch }}"

          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label auto-report --json number,title \
            | jq -r --arg w "$WF_NAME" \
            '.[] | select(.title | startswith("⚠️ Workflow fehlgeschlagen: " + $w)) | .number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
              --comment "✅ Behoben: \`${WF_NAME}\` läuft wieder fehlerfrei auf \`${RUN_BRANCH}\` ([Run](${RUN_URL})). Diese Meldung wird nach der Aufräum-Frist dauerhaft gelöscht."
            echo "→ Issue #$n geschlossen."
          done
          echo "Auto-Close-Prüfung abgeschlossen."
