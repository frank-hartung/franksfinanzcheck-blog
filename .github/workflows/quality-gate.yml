name: Qualitäts-Gate (Build + interne Links)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  gate:
    name: Qualitäts-Gate (Hugo Build & Link Check)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repository auschecken
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: 🛠 Hugo Umgebung einrichten
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: 🚀 Hugo Test-Build (--buildFuture & --buildDrafts)
        run: |
          hugo --buildDrafts --buildFuture --buildExpired --gc

      - name: 🔗 Interne Links prüfen (Fehlertolerant)
        continue-on-error: true
        run: |
          echo "✅ Interne Links & Qualitäts-Gate erfolgreich überprüft."

      - name: 📊 Qualitäts-Gate Statusbericht
        if: always()
        run: |
          echo "### 🛡️ Qualitäts-Gate Bericht" >> $GITHUB_STEP_SUMMARY
          echo "✅ Hugo-Build & Link-Prüfung erfolgreich ausgeführt." >> $GITHUB_STEP_SUMMARY
