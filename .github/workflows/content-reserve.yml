# ============================================================
#  CONTENT-RESERVE (täglicher Vorrat) – Produktionslinie v2
#
#  REPARATUR 15.09.2026, NACHZUG (Fehler #295, Run 34967470666 – der Lauf
#  war NACH der ersten Reparatur erneut rot, 5/6 statt 6/6):
#    5. EINE CTA ÜBER ZWEI ZEILEN machte einen Kandidaten dauerhaft unreif.
#       Realer Befund im Pool (2026-09-15-finanzieller-puffer-…):
#           > 💶 **Spar‑Tipp zwischendurch:** … in wenigen Minuten –
#           > [**Vergleichen & sparen**](/go/allgemein/)
#       Die Affiliate-Wache prüft ZEILENWEISE (AI1) und meldete korrekt
#       „Kein vollständiger Markdown-Link in CTA-Zeile“. Heilen durfte sie
#       nicht: Die Zertifizierung läuft im STRICT-DRY-RUN, und die Wache sah
#       ohnehin nur Live-Artikel – Pool-Kandidaten sind bewusst Entwürfe.
#       Kein Heiler der Kette kannte die Klasse, also blieb der Fund: 5/6,
#       End-Gate rot, Nacht für Nacht.
#       Fix: affiliate_integrity_gate.py --heal --file <pfad> (Entwürfe
#       erlaubt, Markdown-Ebene, kein Build), zweimal in der Heiler-Kette.
#       Der Heiler fasst den Block erst zusammen (Link in der Folgezeile =
#       er gehört zur CTA) und entfernt ihn nur komplett, wenn eine intakte
#       CTA derselben Art bereits im Artikel steht – halbe Reparaturen
#       (Marker weg, Link-Zeile bleibt als Waise) sind ausdrücklich verboten.
#    6. EIN DAUER-BLOCKER machte das Ziel strukturell unerreichbar. Der
#       Konvergenz-Nachschub fand kein freies Thema mehr (Themen-Dedup), der
#       Pool stand bei 6 Entwürfen – ein einziger unreparierbarer Kandidat
#       hält den Stand dann für immer unter RESERVE_TARGET. Fix:
#       scripts/reserve_quarantine.py mustert nach RESERVE_QUARANTINE_HITS
#       (Default 2) Zertifizierungen mit DEMSELBEN Fund aus (nur
#       deterministische Content-Funde, nie Werkzeug-/API-Ausnahmen). Der
#       Entwurf bleibt im Bestand, verliert nur die reserve-Fahne und ist in
#       draft_triage weiter sichtbar – nichts wird gelöscht.
#    7. DIE DIAGNOSE WAR EIN PLATZHALTER. Das Zertifikat schrieb nur
#       „publish_gate/hugo abgelehnt – Details im Workflow-Log“, und Logs
#       verfallen. reserve_readiness.py liest die Gate-Ausgabe jetzt mit und
#       schreibt den KONKRETEN Fund (reason) plus alle Funde (details).
#
#  REPARATUR 15.09.2026 (Fehler #295, „dauerhaft auf Premium-Level“):
#  Der Lauf (Run 34949097389) hatte VIER Befunde – alle vier sind behoben:
#    1. Der Zielbestand war UNERREICHBAR. Der Top-up produzierte höchstens
#       EINEN Kandidaten pro Nacht, während Publikationstage 1–3 aus dem
#       Pool verbrauchen; zusätzlich blockierte der In-Flight-Schutz den
#       Nachschub derselben Nacht (die Veredelung hebt jeden offenen
#       Kandidaten auf HEUTE). Der Pool pendelte bei 5/6, der harte
#       End-Gate wurde jede Nacht rot. Jetzt fährt Stufe 4 die BEGRENZTE,
#       ZIELGERICHTETE Konvergenz (scripts/reserve_converge.py, max. 3
#       Runden, Batch = exakter Fehlbestand, Dedup + Kapazitätsdeckel).
#    2. Pool-Kandidaten wurden nie verlängert: check_length.py übersprang
#       Entwürfe (wie früher spellcheck/grammar/polish, „Reserve #4“) – zwei
#       Kandidaten hingen mit 1.134/1.149 Wörtern dauerhaft unter dem
#       Struktur-Gate (0.70). Der Finisher ruft die Längenheilung jetzt
#       datei-bezirkelt mit --include-drafts.
#    3. Der Sicherungs-Schritt staggte mit `git add -A` auch LIVE-Content und
#       Live-Cover, die korpusweite Heiler nebenbei „geheilt“ hatten. Diese
#       Fremd-Änderungen kollidierten beim Rebase mit dem parallel laufenden
#       Deploy-/Auslieferungslauf -> „Rebase-Konflikt … Kein Push“ -> roter
#       Lauf, obwohl Pool und Content gesund waren. Jetzt: Isolation-Wächter
#       (reserve_finisher, stellt Fremd-Änderungen bytegenau zurück),
#       Staging-Politik (reserve_stage_guard) und Auto-Heilung für
#       maschinengenerierte Artefakte (git_sync: Zertifikat, Cover-Manifest).
#    4. Ein veraltetes Zertifikat konnte Frische vortäuschen – der End-Gate
#       prüft jetzt zusätzlich das Alter (RESERVE_CERT_MAX_AGE_H, Default 36 h).
#
#  REPARATUR 11.09.2026 (Fehler #247, „dauerhaft auf Premium-Level“):
#  Drei Befunde ließen den Lauf nachts dauerhaft rot werden, obwohl der
#  Pool fast voll war:
#    1. KI-Polish verklebte die kanonische Partner-CTA („Ddiebesten“)
#       IMMER WIEDER NEU – die deterministische CTA-Hygiene lief nur
#       VOR der Kette. Sie läuft jetzt mehrfach (fix_cta_hygiene.py in
#       der Finisher-Kette, nach jedem KI-Schritt + am Ende) und ebenso
#       in der Live-Engine.
#    2. Mehrere harte Publish-Gate-Regeln hatten in der Reserve-Kette
#       kein Gegenstück: R5-ABSATZ-HART (r5_absatz_splitter.py war in
#       KEINEM Workflow verdrahtet), R5-Titel-Truncation (falsches
#       „prüfe“-Endwort), absolute/fehlgeroutete /go/-Links
#       (tagesgeld in einem Gas-Artikel, ohne rel=sponsored) und
#       verwaiste Hard-Breaks in Listen/FAQ (Typografie-Score).
#    3. Die Nachproduktion lief VOR der Veredelung: waren am Morgen
#       noch unveredelte Kandidaten vom Vortag da, blockierte der
#       In-Flight-Schutz jede Neuproduktion – auch NACHDEM die Charge
#       im selben Lauf zertifiziert war. Stufe 4 (Konvergenz) prüft das
#       frische Zertifikat und schiebt GENAU die fehlende Stückzahl
#       nach, veredelt und zertifiziert sie im selben Lauf.
#
#  Drei Stufen + Konvergenz, spiegelbildlich zur Content-Engine v2:
#    Stufe 1 – PRODUKTION:   engine_generate.py --reserve-only
#    Stufe 2 – VEREDELUNG:   reserve_finisher.py --finish
#    Stufe 3 – ZERTIFIZIERUNG: reserve_readiness.py (echte Gates,
#                             hash-gesicherte Zertifikate)
#    Stufe 4 – KONVERGENZ:   Nachschub bis RESERVE_TARGET, dann erneut
#                             Stufe 1–3 (höchstens eine Zusatzrunde)
#
#  Der harte End-Gate „Stock shortage must not look successful“ liest
#  das geschriebene Zertifikat (data/reserve-readiness.json), nicht einen
#  Step-Exit-Code: erst ≥ RESERVE_TARGET gate-fertige Kandidaten = grün.
# ============================================================
name: Content-Reserve (täglicher Vorrat)

on:
  schedule:
    - cron: "25 3 * * *"
  workflow_dispatch: { }

permissions:
  contents: write

concurrency:
  group: content-bot
  cancel-in-progress: false

jobs:
  reserve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 120 statt 90 Minuten (15.09.2026, #295): Die Konvergenz-Stufe darf bis
    # 60 Minuten arbeiten; „sichern“ + End-Gate brauchen danach garantiert
    # noch Platz. Der Deckel ist reine Reserve – ein gesunder Lauf braucht
    # ~10–25 Minuten.
    timeout-minutes: 120
    env:
      RESERVE_TARGET: ${{ vars.RESERVE_TARGET || '6' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml cryptography pillow pillow-avif-plugin fonttools brotli
      # Hugo Extended, verifiziert + PyPI-Fallback (Flake-Klasse #209/#220)
      - uses: ./.github/actions/install-hugo
        with:
          version: "0.164.0"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq hunspell hunspell-de-de

      # ================= SABOTAGESCHUTZ =================
      # Jeder Heiler, der den Pool umbaut, muss erst seinen Selbsttest
      # bestehen (gleicher Kodex wie die Live-Engine): ein kaputter
      # Gate-/Heiler darf nicht still weiterarbeiten.
      #
      # 18.09.2026 (Folge-Befund 3 des Qualitäts-Gate-Vorfalls): Hier stand
      # dieselbe HANDKOPIERTE Selbsttest-Liste wie vorher im Qualitäts-Gate –
      # und genau diese Fehlerklasse hatte das Gate sechs Tage lang rot
      # werden lassen (Befund C: eine abgetippte Wachen-Liste altert still).
      # Deshalb läuft jetzt auch hier der Runner: ER ENTDECKT die Selbsttests
      # statt sie abzutippen, gleicht mit governance_contract.GUARDS ab
      # (eine Quelle), legt jeden Selbsttest zusätzlich unter eine um 97 und
      # 1461 Tage vorgestellte Uhr (Datumsbomben kippen am Tag des Einbaus)
      # und meldet es als Befund, wenn ein Selbsttest den Arbeitsbaum
      # schreibt (C15). Kosten: ~1 Minute in einem 120-Minuten-Lauf.
      - name: Selbsttests aller Wachen (entdeckt, uhrfest, schreibfrei)
        run: |
          set -o pipefail
          python3 scripts/selftest_runner.py | tee selbsttests.log

      # affiliate_marketer.py hat bewusst KEINEN --selftest-Schalter (ein
      # Aufruf mit der Flagge würde seine Standard-Aktion starten – siehe
      # GEFAHREN-Liste im Runner); der nackte Aufruf ist sein dokumentierter
      # Routing-Nachweis und read-only.
      - name: Affiliate-Marketer Routing-Nachweis (read-only)
        run: python3 scripts/affiliate_marketer.py

      # ================= RUNDE 0 (BESTAND) =================
      # NEU 26.09.2026 (#387): Bevor eine einzige KI-Anfrage Geld kostet,
      # bekommt der Pool zurück, was ihm gehört. Am 25.09. verlor er zwei
      # zertifizierte Kandidaten allein dadurch, dass ein fremder Commit
      # ihr Frontmatter neu schrieb und die `reserve`-Fahne wegließ – der
      # Lauf produzierte danach Ersatz für Artikel, die noch im Repo lagen,
      # und wurde trotzdem rot. Der Wächter ist kein Gate (kein
      # Abbruch-Recht), er stellt nur die Fahne wieder her und legt
      # Rückläufer der Redaktion vor.
      - name: Stufe 0 – Bestands-Wächter (verlorene Reserve-Fahnen heilen)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python3 scripts/reserve_custody.py --heal
          python3 scripts/reserve_custody.py --md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo "::warning::Bestands-Bericht nicht schreibbar – Details im Log"

      # ================= RUNDE 1 =================
      # Stufe 1 – PRODUKTION
      - name: Stufe 1 – Kandidaten erzeugen (nur bei echtem Bedarf)
        id: stock
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_AUTHOR: ${{ vars.BLOG_AUTHOR }}
          AFFILIATE_URL: ${{ vars.AFFILIATE_URL }}
        run: python3 scripts/engine_generate.py --reserve-only

      # Stufe 2 – VEREDELUNG
      - name: Stufe 2 – Kandidaten veredeln (Phase-2/3-Kette, nur Pool)
        id: finish
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_AUTHOR: ${{ vars.BLOG_AUTHOR }}
          AFFILIATE_URL: ${{ vars.AFFILIATE_URL }}
        run: python3 scripts/reserve_finisher.py --finish

      # Stufe 3 – ZERTIFIZIERUNG
      - name: Stufe 3 – Reife durch Produktions-Gates beweisen
        id: readiness
        continue-on-error: true
        run: python3 scripts/reserve_readiness.py

      # ================= RUNDE 2 (KONVERGENZ) =================
      # REPARATUR 15.09.2026 (#295): Die frühere Fassung war ein EINZELNER
      # Nachschub-Block und lief garantiert ins Leere – die Veredelungs-Stufe
      # hebt jeden offenen Kandidaten auf HEUTE, damit galt danach jeder
      # unzertifizierte Kandidat als „in flight“ und der In-Flight-Schutz
      # blockierte die Nachproduktion derselben Nacht. Ergebnis: Der Pool
      # erreichte RESERVE_TARGET nie (5/6 seit Tagen), der harte End-Gate
      # wurde jede Nacht rot.
      #
      # Jetzt: BEGRENZTE, ZIELGERICHTETE Schleife (scripts/reserve_converge.py)
      #   brauche := Ziel − zertifiziert
      #   solange brauche > 0 und Fortschritt und Runde ≤ 3:
      #     Produktion (force, Batch = exakter Fehlbestand, max. 4)
      #     → Veredelung → Zertifizierung
      # Die Schleife bricht bei Zielerreichung ODER ohne Fortschritt ab
      # (keine Endlosschleife, keine unbegrenzten API-Kosten) und meldet
      # ehrlich, was erreicht wurde – die Bewertung macht der End-Gate.
      - name: Stufe 4 – Konvergenz-Nachschub bis zum Zielbestand
        id: convergence
        if: ${{ !cancelled() }}
        continue-on-error: true
        # Zeitdeckel doppelt gesichert (Nachtrag 15.09.2026, #295): Die Stufe
        # bricht selbst nach 45 Minuten sauber ab (--max-minuten) und dieser
        # Step-Timeout ist der Notausgang, falls ein einzelner Kindprozess
        # hängt. In BEIDEN Fällen laufen „sichern“ und End-Gate weiter – sonst
        # würde der 90-Minuten-Job gekillt und der erarbeitete Pool-Stand wäre
        # verloren, ohne dass der Lauf seine Diagnose schreiben könnte.
        timeout-minutes: 60
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_AUTHOR: ${{ vars.BLOG_AUTHOR }}
          AFFILIATE_URL: ${{ vars.AFFILIATE_URL }}
          RESERVE_TARGET: ${{ vars.RESERVE_TARGET || '6' }}
        run: python3 scripts/reserve_converge.py --runden 3 --max-minuten 45

      # ================= RUNDE 3 (TRIAGE) =================
      # Reserve heißt nicht Stapel. Jeder Entwurf bekommt einen begründeten
      # Zustand: REIF (kann raus), BLOCKIERT (Konkretes Hindernis), WARTET
      # (Zukunftsdatum), VERWAIST (reif, aber seit 21 Tagen unbearbeitet).
      # Kein Blocker – was wann erscheint, entscheidet die Redaktion, nicht
      # die Automation. Aber die Automation legt die Entscheidungsliste täglich
      # vor, statt 17 Schubladen ungeöffnet zu lassen.
      - name: Stufe 5 – Reserve triagieren (Entscheidungsdruck statt Stapel)
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/draft_triage.py --selftest
          python3 scripts/draft_triage.py --md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo "::warning::Triage-Tabelle nicht schreibbar – Details im Log"
          python3 scripts/draft_triage.py --check-decisions \
            || echo "::warning::Reife Entwürfe verfallen oder Quellen sind defekt – Liste in der Lauf-Zusammenfassung"

      - name: Entwürfe, Zertifikate und Reporte sichern (auch bei Engpass)
        if: ${{ !cancelled() }}
        run: |
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"

          # REPARATUR 15.09.2026 (#295) – warum NICHT mehr `git add -A`:
          #   `git add -A` staggte alles, was irgendein korpusweit laufender
          #   Heiler im Arbeitsbaum hinterlassen hat (Live-Posts, Live-Cover,
          #   Manifeste). Genau diese Fremd-Änderungen kollidierten beim Rebase
          #   mit dem parallel laufenden Deploy-/Auslieferungslauf -> „Kein
          #   Push“ -> roter Lauf trotz gesundem Pool.
          #   Staging-Politik liegt jetzt in einem eigenen, selbsttestenden
          #   Skript (drei Lagen greifen unabhängig voneinander):
          #     1. reserve_finisher.py  – Isolation-Wächter um die Heiler-Kette,
          #     2. reserve_stage_guard.py – stagt nur Pool-Pfade, nimmt Fremd-
          #        Content wieder aus dem Index und meldet, was liegen bleibt,
          #     3. git_sync.sh          – heilt Rebase-Konflikte auf den
          #        maschinengenerierten Artefakten (Zertifikat, Cover-Manifest).
          echo "── Arbeitsbaum vor dem Commit ──────────────────────────────"
          git status --porcelain | head -40
          python3 scripts/reserve_stage_guard.py
          echo "── Gestagte Änderungen ─────────────────────────────────────"
          git diff --cached --stat | tail -15
          if ! git diff --cached --quiet; then
            git commit -m "content: unabhängige Redaktionsreserve auffüllen"
            # git_sync pusht mit Retries, Auto-Rebase und Auto-Heilung für
            # maschinengenerierte Artefakte (u. a. das Zertifikat selbst –
            # genau der Konflikt, der diesen Lauf am 15.09. rot machte).
            scripts/git_sync.sh --push-only || {
              echo "::error::Push der Reserve nach main fehlgeschlagen. Der Lauf bleibt rot, WEIL der zertifizierte Pool sonst nicht in main ankommt (nächster Lauf könnte sonst erneut 0/6 lesen). Ursache im git_sync-Log oben."
              exit 1
            }
          else
            echo "Keine Änderungen am Pool – nichts zu committen."
          fi

      # ================= HARTES END-GATE =================
      - name: Stock shortage must not look successful
        if: ${{ !cancelled() }}
        run: python3 scripts/reserve_gate.py
