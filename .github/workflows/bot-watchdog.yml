# ============================================================
#  BOT-WATCHDOG – Profi-Agentur-Level Selbstüberwachung
#  ------------------------------------------------------------
#  Version: 2.0 – Reparatur #227 + Profi-Optimierung (08.09.2026)
#
#  Schließt die größte Lücke: Wenn der Content-Bot GAR NICHT läuft
#  (Cron verworfen, Workflow deaktiviert, GitHub-Ausfall, stiller
#  Fehler), meldet sich sonst niemand – es käme einfach kein Artikel.
#
#  UMFANG (Profi-Agentur-Level):
#    1) META: Läuft die Produktions-Wache noch? (26h Fenster)
#    1b) Publikationstag-Bilanz (Mo/Mi/Fr, cadence_guard SSOT)
#    2) Skript-Syntax (py_compile)
#    3) Live-Site: neuester Artikel wirklich live? (Redirect-follow, Retry)
#    4) GitHub-TLS-Zertifikat (Cloudflare Full strict Hinweis)
#    5) Affiliate-Manager: Affiliate-Integritäts-Wache aktiv + Report gesund?
#    6) Pinterest-Experte: Pinterest-Watchdog aktiv?
#    7) Pinterest-Token Lebenszyklus (Broker-Status, kein monatlicher Tod)
#    8) Content-Reserve Gesundheit (Pool >=4)
#    9) Pinterest Duplikat-Sperre (Spam-Signal)
#
#  REPARATUR #227 (08.09.2026):
#    - Lauf 34229150161 failte im Schritt "Issue bei Problemen erstellen"
#      (github-script). Ursache: fragiles Env-Handling (EOF-Collision möglich),
#      stray \"-Zeichen im Issue-Body, keine try-catch → Workflow rot statt
#      gelb, Fehler-Alerting öffnet #227 über den Melder, der am Melden scheitert.
#    - Fix: Python-Skript scripts/bot_watchdog.py als SSOT, sichere Delimiter,
#      try-catch in allen github-script Schritten, Label-Garantie (C12),
#      continue-on-error für Melder, robuste Live-Prüfung mit -L + Retry.
#
#  PROFILIERT NACH:
#    - Governance-Vertrag C12 (Label-Garantie, #209)
#    - Affiliate-Integritäts-Wache #220 (Hugo-Flake darf Wache nicht töten)
#    - Deploy-Warteschlange #218 (Phantom-Alarme)
#    - Pinterest-Token-Lebenszyklus #206 (30-Tage-Tod)
#
#  Bei Problemen: automatisch GitHub-Issue (Dedupe, kein Spam).
#  Manuell: Actions → Bot-Watchdog → Run workflow
# ============================================================
name: Bot-Watchdog

on:
  schedule:
    - cron: "30 8 * * *"    # 10:30 MESZ – nach dem Morgen-Artikel (08:10)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: read      # für gh run list (Meta-Check)

concurrency:
  group: bot-watchdog
  cancel-in-progress: false

env:
  MIN_ARTIKEL_PRO_TAG: ${{ vars.MIN_ARTIKEL_PRO_TAG || '2' }}
  MAX_ARTIKEL_PRO_TAG: ${{ vars.MAX_ARTIKEL_PRO_TAG || '3' }}

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          pip install --quiet pyyaml
          # gh CLI ist auf ubuntu-latest vorinstalliert

      - name: Selftest (Wache muss sehen können)
        run: |
          python3 scripts/bot_watchdog.py --selftest
          python3 scripts/cadence_guard.py --selftest
          python3 scripts/watchdog_check4_tls.py --help 2>&1 | head -n 5 || true

      - name: Watchdog-Prüfungen (Profi-Level)
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "=== Bot-Watchdog 2.0 – Profi-Agentur-Level ==="
          python3 scripts/bot_watchdog.py --emit-env
          echo "--- Env Dump ---"
          cat /tmp/bot_watchdog.env || true
          echo "--- Problems ---"
          cat /tmp/problems.txt || echo "(keine)"
          # Zusätzlich klassische Checks für Rückwärtskompatibilität in GITHUB_ENV laden
          # bot_watchdog.py schreibt bereits ins GITHUB_ENV via emit-env

      - name: Zusammenfassung
        if: always()
        run: |
          echo "## 🤖 Watchdog-Ergebnis (Profi-Agentur-Level)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat BOT-WATCHDOG-REPORT.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "Report fehlt" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "### Raw Env" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/bot_watchdog.env 2>/dev/null || echo "kein env" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------
      #  Label-Garantie (C12): Jeder Melder legt sein Label vorher an.
      #  Bot-Watchdog nutzt kein Pflicht-Label, aber für Konsistenz
      #  und für das zentrale auto-report Handling legen wir Labels an.
      # ------------------------------------------------------------
      - name: Labels sicherstellen (C12)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create bot-watchdog --repo "$GITHUB_REPOSITORY" --color "0e8a16" --description "Bot-Watchdog: Meta-Überwachung der Automatisierung" --force || true
          gh label create auto-report --repo "$GITHUB_REPOSITORY" --color "d73a4a" --description "Automatisch erkannte Fehlermeldung" --force || true
          gh label create pinterest --repo "$GITHUB_REPOSITORY" --color "e60023" --description "Pinterest-Kanal" --force || true

      - name: Issue bei fertigem GitHub-Zertifikat (Hinweis Full strict)
        if: ${{ env.CHECK4 == 'OK' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data: existing } = await github.paginate(
                github.rest.issues.listForRepo,
                { owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 }
              );
              const open = existing.filter(i => i.title && i.title.includes('GitHub-Zertifikat') && !i.pull_request);
              if (open.length > 0) {
                console.log(`Hinweis-Issue existiert bereits (#${open[0].number}).`);
                return;
              }
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '✅ GitHub-Zertifikat für franksfinanzcheck.de ist da',
                body: [
                  'Das TLS-Zertifikat von GitHub Pages für **franksfinanzcheck.de** ist jetzt ausgestellt.',
                  '',
                  '**Empfohlener Schritt (1 Min):**',
                  '1. Cloudflare → franksfinanzcheck.de → SSL/TLS → Overview',
                  '2. Modus von **"Full"** auf **"Full (strict)"** umstellen',
                  '3. Fertig – maximale Sicherheit (Cloudflare verifiziert das Origin-Zertifikat)',
                  '',
                  'Dieses Issue kann danach geschlossen werden.',
                  '',
                  '---',
                  '*Automatisch erstellt vom Bot-Watchdog (Profi-Level).*'
                ].join('\n')
              });
              console.log('✅ Hinweis-Issue erstellt');
            } catch (e) {
              console.log('⚠️ Zertifikat-Hinweis konnte nicht erstellt werden: ' + e.message);
              // Nicht failen – Melder darf nicht selbst zum Incident werden
            }

      - name: Issue bei Problemen erstellen (mit Dedupe, robust)
        if: ${{ env.PROBLEMS != '' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const problems = process.env.PROBLEMS || '';
              console.log('Probleme erkannt, prüfe Dedupe...');
              // Pagination-sicher: alle offenen Issues holen
              const existing = await github.paginate(
                github.rest.issues.listForRepo,
                { owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 }
              );
              const open = existing.filter(i => i.title && i.title.includes('Bot-Watchdog') && !i.pull_request);
              if (open.length > 0) {
                console.log(`Offenes Watchdog-Issue existiert bereits (#${open[0].number}) – kein Duplikat.`);
                console.log('Aktuelle Probleme bleiben offen: ' + problems.slice(0,500));
                // Optional: Kommentar mit aktuellem Stand
                try {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: open[0].number,
                    body: `**Update ${new Date().toISOString()}** – weiterhin Probleme:\n\n${problems}\n\n---\n*Auto-Update vom Bot-Watchdog.*`
                  });
                } catch (cErr) {
                  console.log('Kommentar konnte nicht erstellt werden: ' + cErr.message);
                }
                return;
              }
              // Profi-Body ohne stray Zeichen, mit Affiliate + Pinterest Kontext
              const body = [
                '## 🤖 Bot-Watchdog hat Probleme festgestellt (Profi-Agentur-Level)',
                '',
                'Folgende Checks sind fehlgeschlagen:',
                '',
                problems,
                '',
                '### Nächste Schritte (nach Priorität)',
                '1. **Artikel-Bilanz ansehen:** `PRODUKTIONS-STATUS.md` + `BOT-WATCHDOG-REPORT.md` im Repo',
                '2. **Workflow-Log ansehen:** Actions → "Content-Engine v2" → letzter Lauf → Phase 1',
                '3. **Affiliate-Check:** `AFFILIATE-INTEGRITY-REPORT.md` – CTA-Boxen/Linkziele (tägliche Wache 06:00 MESZ)',
                '4. **Pinterest-Check:** `PINTEREST-REPORT.md` + `data/pinterest_token_state.json` – Token-Lebenszyklus (täglich 04:40 MESZ)',
                '5. **API-Keys prüfen:** Settings → Secrets and variables → Actions (GROQ/GEMINI)',
                '6. **Manuell nachhelfen:** Actions → "Content-Engine v2" → Run workflow',
                '7. **Deploy prüfen:** Actions → "Deploy auf GitHub Pages" → letzter Lauf (Catchup bei Queue-Stau)',
                '8. **Nur Mo/Mi/Fr:** Di/Do/Wochenende sind publikationsfrei – dort ist "kein Artikel" korrekt.',
                '',
                '### Kontext (Profi-Agentur)',
                '- **Affiliate-Manager:** Prüfe, ob `affiliate-integrity-daily.yml` in den letzten 30h lief und ob der Render-Beweis (Hugo Extended) grün ist. Ein toter Affiliate-Link kostet Provision.',
                '- **Pinterest-Experte:** Prüfe Token-Broker (`scripts/pinterest_token.py --status`), Watchdog-Liveness und Duplikat-Sperre. Repeat-Pin <30 Tage = Spam-Signal.',
                '- **Content-Reserve:** Sollte >=4 Artikel enthalten (2 Tage × 2 Mindestziel).',
                '',
                'Das Issue wird automatisch geschlossen, sobald der nächste Watchdog-Lauf alles grün meldet.',
                '',
                '---',
                '*Automatisch erstellt vom Bot-Watchdog 2.0 (täglich 10:30 MESZ, Profi-Agentur-Level, inkl. Affiliate + Pinterest).*'
              ].join('\n');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ Bot-Watchdog: Probleme mit der Content-Automatisierung',
                body: body,
                labels: ['bot-watchdog']
              });
              console.log('✅ Watchdog-Issue erstellt');
            } catch (e) {
              console.log('❌ Fehler beim Erstellen des Watchdog-Issues: ' + e.message);
              console.log(e.stack || '');
              // Workflow soll NICHT rot werden, weil das Melden scheitert – das war Ursache #227
              // Wir loggen, aber werfen nicht
            }

      - name: Offenes Watchdog-Issue schließen (alles wieder grün)
        if: ${{ env.PROBLEMS == '' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const existing = await github.paginate(
                github.rest.issues.listForRepo,
                { owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 }
              );
              const open = existing.filter(i => i.title && i.title.includes('Bot-Watchdog') && !i.pull_request);
              for (const issue of open) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `✅ **${new Date().toISOString()}** – alle Checks grün (Profi-Level): Produktions-Wache lebt, Live-Site aktuell, Affiliate- und Pinterest-Kanäle im grünen Bereich.\n\n*Auto-Close vom Bot-Watchdog 2.0.*`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed'
                });
                console.log(`✅ Watchdog-Issue #${issue.number} geschlossen (alles grün).`);
              }
              if (open.length === 0) console.log('Kein offenes Watchdog-Issue.');
            } catch (e) {
              console.log('⚠️ Konnte Watchdog-Issue nicht schließen: ' + e.message);
            }

      # REPORT: BOT-WATCHDOG-REPORT.md ist seit dem Premium-Audit 12.09.2026
      # gitignored und nicht versioniert (bleibt im Lauf-Log). Der frühere
      # „Report committen“-Schritt ist entfallen.
