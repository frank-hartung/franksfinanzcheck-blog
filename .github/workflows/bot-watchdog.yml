# ============================================================
#  BOT-WATCHDOG – Profi-Agentur-Level Selbstüberwachung
#  ------------------------------------------------------------
#  Version: 2.0 – Reparatur #227 + Profi-Optimierung (08.09.2026)
#
#  Schließt die größte Lücke: Wenn der Content-Bot GAR NICHT läuft
#  (Cron verworfen, Workflow deaktiviert, GitHub-Ausfall, stiller
#  Fehler), meldet sich sonst niemand – es käme einfach kein Artikel.
#
#  UMFANG (Profi-Agentur-Level):
#    1) META: Läuft die Produktions-Wache noch? (26h Fenster)
#    1b) Publikationstag-Bilanz (Mo/Mi/Fr, cadence_guard SSOT)
#    2) Skript-Syntax (py_compile)
#    3) Live-Site: neuester Artikel wirklich live? (Redirect-follow, Retry)
#    4) GitHub-TLS-Zertifikat (Cloudflare Full strict Hinweis)
#    5) Affiliate-Manager: Affiliate-Integritäts-Wache aktiv + Report gesund?
#    6) Pinterest-Experte: Pinterest-Watchdog aktiv?
#    7) Pinterest-Token Lebenszyklus (Broker-Status, kein monatlicher Tod)
#    8) Content-Reserve Gesundheit (Pool >=4)
#    9) Pinterest Duplikat-Sperre (Spam-Signal)
#
#  REPARATUR #227 (08.09.2026):
#    - Lauf 34229150161 failte im Schritt "Issue bei Problemen erstellen"
#      (github-script). Ursache: fragiles Env-Handling (EOF-Collision möglich),
#      stray \"-Zeichen im Issue-Body, keine try-catch → Workflow rot statt
#      gelb, Fehler-Alerting öffnet #227 über den Melder, der am Melden scheitert.
#    - Fix: Python-Skript scripts/bot_watchdog.py als SSOT, sichere Delimiter,
#      try-catch in allen github-script Schritten, Label-Garantie (C12),
#      continue-on-error für Melder, robuste Live-Prüfung mit -L + Retry.
#
#  PROFILIERT NACH:
#    - Governance-Vertrag C12 (Label-Garantie, #209)
#    - Affiliate-Integritäts-Wache #220 (Hugo-Flake darf Wache nicht töten)
#    - Deploy-Warteschlange #218 (Phantom-Alarme)
#    - Pinterest-Token-Lebenszyklus #206 (30-Tage-Tod)
#
#  REPARATUR #272 (12.09.2026) – Alarm-Routing statt Dauer-Alarm:
#    Der Watchdog kannte genau EINEN Meldeweg für ALLE Befunde. Ein toter
#    Pinterest-Token (nur per Browser-OAuth heilbar) stand damit als
#    „Problem mit der Content-Automatisierung" im Briefkasten – obwohl
#    Kadenz, Live-Site und Reserve kerngesund waren. Schlimmer: der
#    automatische Schließpfad war konstruktiv unmöglich (Grün erst durch
#    den Menschen, der Lauf durfte aber nie grün melden) → täglich ein
#    neues Issue (#251 → #272 → …), ein Melder als Dauerläufer.
#    Jetzt trennt scripts/alert_router.py nach BESITZ:
#      · Maschine heilt  → Automations-Ticket (Label `bot-watchdog`)
#      · Mensch heilt    → Fach-Ticket mit Runbook + Eskalationsleiter
#        (Label `pinterest-parked` / `pinterest-token` …), maximal ein
#        Kommentar pro Stufe und frühestens alle 72 h.
#    Menschliche Befunde halten das Automations-Ticket NIE offen –
#    damit hat jedes Ticket einen Schließpfad.
#
#  Bei Problemen: automatisch GitHub-Issue (Besitz, Kadenz, Auto-Close).
#  Manuell: Actions → Bot-Watchdog → Run workflow
# ============================================================
name: Bot-Watchdog

on:
  schedule:
    - cron: "30 8 * * *"    # 10:30 MESZ – nach dem Morgen-Artikel (08:10)
  workflow_dispatch: {}

permissions:
  contents: write    # für den Routing-Zustand (data/alert_router_state.json)
  issues: write
  actions: write     # Status lesen UND die zuständige Reparatur-Workflow dispatchen

concurrency:
  group: bot-watchdog
  cancel-in-progress: false

env:
  MIN_ARTIKEL_PRO_TAG: ${{ vars.MIN_ARTIKEL_PRO_TAG || '2' }}
  MAX_ARTIKEL_PRO_TAG: ${{ vars.MAX_ARTIKEL_PRO_TAG || '3' }}

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          pip install --quiet pyyaml
          # gh CLI ist auf ubuntu-latest vorinstalliert

      - name: Selftest (Wache muss sehen können)
        run: |
          python3 scripts/bot_watchdog.py --selftest
          python3 scripts/watchdog_recovery.py --selftest
          python3 scripts/cadence_guard.py --selftest
          python3 scripts/watchdog_check4_tls.py --help 2>&1 | head -n 5 || true

      - name: Watchdog-Prüfungen (Profi-Level)
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "=== Bot-Watchdog 2.0 – Profi-Agentur-Level ==="
          python3 scripts/bot_watchdog.py --emit-env
          echo "--- Env Dump ---"
          cat /tmp/bot_watchdog.env || true
          echo "--- Problems ---"
          cat /tmp/problems.txt || echo "(keine)"
          # Zusätzlich klassische Checks für Rückwärtskompatibilität in GITHUB_ENV laden
          # bot_watchdog.py schreibt bereits ins GITHUB_ENV via emit-env

      # REPARATUR 08.10.2026 (Issue #661): Der Dispatch stand bis hier vorn –
      # und damit VOR der billigen Selbstheilung. Folge: Der Watchdog stieß
      # jeden Tag den 45–90-Minuten-Produktionslauf an UND schrieb im selben
      # Lauf sein eigenes Zertifikat nach main (`Reserve-Zertifikat
      # nachziehen`). Zwei Schreiber, eine Datei, eine Nacht – der Rebase des
      # Reserve-Laufs kollidierte damit per Konstruktion (zehn von zwölf
      # Läufen rot). Jetzt gilt die Reihenfolge: erst der billige Weg
      # (Snapshot heilen, Nachzertifizieren), dann NEU messen, und nur wenn
      # der Engpass WIRKLICH noch steht, die Produktionslinie anstoßen. Der
      # Dispatch-Schritt steht deshalb weiter unten hinter der Nachmessung.

      # ------------------------------------------------------------
      #  SELBSTHEILUNG #462 (30.09.2026) – „Automatisierung braucht Eingriff"
      #  ------------------------------------------------------------
      #  Zwei Befunde kamen täglich zurück, weil der Melder sie zwar sehen,
      #  aber niemand sie heilen konnte:
      #    a) Zertifikats-Drift der Reserve: Heiler-Läufe (Stilpolitur,
      #       Rechtschreibung, Pinterest-SEO) fassen zertifizierte Entwürfe
      #       an – das hash-gebundene Zertifikat verfällt, obwohl der Artikel
      #       fachlich fertig ist. Geheilt wird er hier mit derselben
      #       Messvorschrift wie im Nachtlauf (nur die betroffenen Entwürfe).
      #    b) Pinterest-Report-Provenienz: Der Report entsteht um 04:30 UTC,
      #       der Morgen-Artikel um 08:10 – beim Watchdog um 08:30 war der
      #       Nachweis per Konstruktion alt. Der Fingerabdruck deckt seit
      #       #462 nur noch den pin-relevanten Quellenstand ab; ein neuer
      #       Artikel bleibt aber eine echte Änderung und wird hier mit einem
      #       vollwertigen Lauf (Hugo-Build + --fix) nachgezogen.
      #  Beide Schritte laufen NUR bei Befund, sind idempotent und dürfen den
      #  Melder nie röten (continue-on-error).
      - name: Hugo installieren (für echte Nachmessungen)
        if: ${{ contains(env.CHECK8, 'WARN') || contains(env.CHECK9B, 'FAIL') || contains(env.CHECK9B, 'WARN') }}
        uses: ./.github/actions/install-hugo
        with:
          version: "0.164.0"

      - name: Reserve-Zertifikat nachziehen (#462)
        if: ${{ contains(env.CHECK8, 'WARN') }}
        continue-on-error: true
        run: |
          python3 -m pip install -q pyyaml 2>/dev/null || true
          # VOLLSTÄNDIGE Messkette – ohne hunspell wertet quality_score
          # spelling als „unbekannt" (0.5) und würde gesunde Kandidaten
          # abwerten. reserve_recert.py bricht dann fail-closed ab (Exit 3);
          # dieser Schritt sorgt dafür, dass es gar nicht erst dazu kommt.
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq hunspell hunspell-de-de || true
          python3 scripts/reserve_recert.py --selftest
          set +e
          # #661, Schritt 1 – der NACHWEIS selbst. Ist das Zertifikat oder
          # eines der Gedächtnisse unlesbar, kann die Nachzertifizierung gar
          # nicht anfangen (sie liest dieselben Dateien). Der Snapshot-Heiler
          # zieht sie deshalb VORHER neu: aus dem Bestand, ohne erfundenes
          # READY, atomar und mit Gegenprobe. Bei intaktem Snapshot tut er
          # nichts – Idempotenz ist Teil seines Selbsttests.
          python3 scripts/reserve_snapshot_heiler.py --selftest
          python3 scripts/reserve_snapshot_heiler.py --fix
          echo "snapshot_heiler_exit=$?" >> "$GITHUB_STEP_SUMMARY"
          # Schritt 2 – die echte Nachmessung der betroffenen Entwürfe (#462).
          python3 scripts/reserve_recert.py --fix
          echo "recert_exit=$?" >> "$GITHUB_STEP_SUMMARY"
          set -e
          GIT_USER="Bot-Watchdog" GIT_MAIL="bot-watchdog@users.noreply.github.com" \
            scripts/git_sync.sh "chore(reserve): Zertifikat nachgezogen (#462)" \
            data/reserve-readiness.json data/reserve-custody.json \
            data/reserve-quarantine.json data/reserve-history.jsonl

      - name: Abhängigkeiten für den Pinterest-Report
        if: ${{ contains(env.CHECK9B, 'FAIL') || contains(env.CHECK9B, 'WARN') }}
        continue-on-error: true
        run: python3 -m pip install -q pyyaml 2>/dev/null || true

      # Vorher: `hugo --minify || true`. Der Bau DARF hier scheitern (der
      # Watchdog soll trotzdem messen), aber er darf es nicht lautlos tun –
      # „toleriert" und „unbemerkt" sind zwei verschiedene Dinge.
      - name: Seite bauen (Fehlschlag toleriert, aber sichtbar)
        if: ${{ contains(env.CHECK9B, 'FAIL') || contains(env.CHECK9B, 'WARN') }}
        uses: ./.github/actions/hugo-build
        with:
          args: "--minify"
          label: "Bot-Watchdog (Pinterest-Report)"
          weiter-bei-fehler: "true"

      - name: Pinterest-Report nachziehen (#462)
        if: ${{ contains(env.CHECK9B, 'FAIL') || contains(env.CHECK9B, 'WARN') }}
        continue-on-error: true
        run: |
          set +e
          python3 scripts/pinterest_check.py --fix
          echo "pinterest_exit=$?" >> "$GITHUB_STEP_SUMMARY"
          set -e
          GIT_USER="Bot-Watchdog" GIT_MAIL="bot-watchdog@users.noreply.github.com" \
            scripts/git_sync.sh "chore(pinterest): Report nachgezogen (#462)" \
            PINTEREST-REPORT.md content/posts static/robots.txt

      # Nach der Selbstheilung wird NEU gemessen – sonst meldet das Routing
      # einen Zustand, den dieser Lauf bereits repariert hat (ein Ticket für
      # ein gelöstes Problem ist derselbe Vertrauensverlust wie ein
      # übersehener Fehler).
      - name: Nachmessung (geheilte Befunde dürfen kein Ticket erzeugen)
        if: ${{ contains(env.CHECK8, 'WARN') || contains(env.CHECK9B, 'FAIL') || contains(env.CHECK9B, 'WARN') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/bot_watchdog.py --emit-env
          echo "--- Befunde nach Selbstheilung ---"
          cat /tmp/problems.txt || echo "(keine)"

      # REPARATUR 08.10.2026 (Issue #661): Erst JETZT, nach billiger Heilung
      # und Nachmessung, wird die Produktionslinie angestoßen – und nur, wenn
      # CHECK8 hier immer noch WARNT. Vorher wurde sie blind am Laufanfang
      # gestartet: Der Reserve-Lauf lief dann 45–90 Minuten, während dieser
      # Lauf sein eigenes Zertifikat nach main schrieb. Der Rebase des
      # Reserve-Laufs kollidierte damit per Konstruktion; der frisch
      # gemessene Pool kam nie in main an, das Ticket kam am nächsten Tag
      # wieder. Ein Engpass, den eine Nachzertifizierung schließt, kostet
      # jetzt keine Produktionsnacht mehr.
      - name: Content-Reserve bei echtem Engpass selbst heilen
        if: ${{ contains(env.CHECK8, 'WARN') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/watchdog_recovery.py --reserve

      - name: Zusammenfassung
        if: always()
        run: |
          echo "## 🤖 Watchdog-Ergebnis (Profi-Agentur-Level)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat BOT-WATCHDOG-REPORT.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "Report fehlt" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "### Raw Env" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/bot_watchdog.env 2>/dev/null || echo "kein env" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------
      #  Label-Garantie (C12): Jeder Melder legt sein Label vorher an.
      #  Bot-Watchdog nutzt kein Pflicht-Label, aber für Konsistenz
      #  und für das zentrale auto-report Handling legen wir Labels an.
      # ------------------------------------------------------------
      - name: Labels sicherstellen (C12)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create bot-watchdog --repo "$GITHUB_REPOSITORY" --color "0e8a16" --description "Bot-Watchdog: Meta-Überwachung der Automatisierung" --force || true
          gh label create auto-report --repo "$GITHUB_REPOSITORY" --color "d73a4a" --description "Automatisch erkannte Fehlermeldung" --force || true
          gh label create pinterest --repo "$GITHUB_REPOSITORY" --color "e60023" --description "Pinterest-Kanal" --force || true

      - name: Issue bei fertigem GitHub-Zertifikat (Hinweis Full strict)
        if: ${{ env.CHECK4 == 'OK' }}
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            try {
              const { data: existing } = await github.paginate(
                github.rest.issues.listForRepo,
                { owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 }
              );
              const open = existing.filter(i => i.title && i.title.includes('GitHub-Zertifikat') && !i.pull_request);
              if (open.length > 0) {
                console.log(`Hinweis-Issue existiert bereits (#${open[0].number}).`);
                return;
              }
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '✅ GitHub-Zertifikat für franksfinanzcheck.de ist da',
                body: [
                  'Das TLS-Zertifikat von GitHub Pages für **franksfinanzcheck.de** ist jetzt ausgestellt.',
                  '',
                  '**Empfohlener Schritt (1 Min):**',
                  '1. Cloudflare → franksfinanzcheck.de → SSL/TLS → Overview',
                  '2. Modus von **"Full"** auf **"Full (strict)"** umstellen',
                  '3. Fertig – maximale Sicherheit (Cloudflare verifiziert das Origin-Zertifikat)',
                  '',
                  'Dieses Issue kann danach geschlossen werden.',
                  '',
                  '---',
                  '*Automatisch erstellt vom Bot-Watchdog (Profi-Level).*'
                ].join('\n')
              });
              console.log('✅ Hinweis-Issue erstellt');
            } catch (e) {
              console.log('⚠️ Zertifikat-Hinweis konnte nicht erstellt werden: ' + e.message);
              // Nicht failen – Melder darf nicht selbst zum Incident werden
            }

      # ------------------------------------------------------------
      #  Alarm-Routing (#272): Besitz, Kadenz, Schließpfad – eine Stelle,
      #  ein Code-Pfad (scripts/alert_router.py), statt Melde-Logik im YAML.
      #  Der Melder darf nie selbst zum Vorfall werden: der Schritt ist
      #  immer erfolgreich, Fehler stehen als ::error:: im Lauf-Log.
      # ------------------------------------------------------------
      - name: Alarm-Routing (Besitz · Kadenz · Auto-Close)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/bot_watchdog.py --route
          echo "exit=$?" >> "$GITHUB_STEP_SUMMARY"
          set -e

      - name: Routing-Zustand sichern (Kadenz/Eskalation überlebt den Lauf)
        if: always()
        continue-on-error: true    # ein Push-Rennen darf den Melder nicht röten
        run: |
          git config user.name "Bot-Watchdog"
          git config user.email "bot-watchdog@users.noreply.github.com"
          git add data/alert_router_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Routing-Zustand unverändert."
          else
            git commit -m "chore(watchdog): Alarm-Routing-Zustand"
            scripts/git_sync.sh --push-only
          fi

      # REPORT: BOT-WATCHDOG-REPORT.md ist seit dem Premium-Audit 12.09.2026
      # gitignored und nicht versioniert (bleibt im Lauf-Log). Der frühere
      # „Report committen“-Schritt ist entfallen.
