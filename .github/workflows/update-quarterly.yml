# ============================================================
#  ARTIKEL-UPDATE-ROUTINE (quartalsweise – Frische-Signal)
#
#  Aktualisiert alle 3 Monate automatisch die Top-10-Artikel:
#  neue Zahlen, aktuelle Formulierungen, "Stand:"-Angaben –
#  als Frische-Signal an Google (article:modified_time + sitemap).
#
#  Ablauf:
#    1. Skript priorisiert die 10 wichtigsten Artikel
#       (SEO-Qualität + Alter + interne Links + Tarif-Relevanz,
#       Rotation: erst kürzlich aktualisierte werden übersprungen)
#    2. KI (Gemini, Fallback Groq) überarbeitet den Text
#       (Struktur/FAQ/Affiliate-Links bleiben erhalten – Verifikation!)
#    3. lastmod wird gesetzt → Hugo rendert article:modified_time
#    4. Einzigartigkeits-Gate + Meta-Fix + Commit + Deploy + IndexNow
#    5. Report wird committet (ARTIKEL-UPDATE-REPORT.md)
#
#  Cron: 1. Januar/April/Juli/Oktober, 07:00 MESZ (06:00 UTC).
#    Winterzeit (MEZ): 06:00 UTC = 07:00 MEZ (Kommentar unten).
#
#  Manuell: GitHub → Actions → "Quartalsweises Artikel-Update"
# ============================================================
name: Quartalsweises Artikel-Update

on:
  schedule:
    - cron: "0 6 1 1,4,7,10 *"    # 1. Jan/Apr/Jul/Okt 07:00 MESZ (06:00 UTC)
    # Winterzeit-Fallback: 1 Stunde später in UTC, damit es weiterhin
    # ~07:00 MEZ ist:
    - cron: "0 7 1 1,4,7,10 *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:          # AUDIT-FIX
  group: update-quarterly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python-Abhängigkeiten installieren
        run: |
          python3 -m pip install -q pyyaml cryptography 2>/dev/null || true
      - name: Top-Artikel aktualisieren (KI, Qualitäts-Verifikation)
        id: update
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/update_articles.py --apply --max 10 | tee /tmp/update_log.txt
          exit ${PIPESTATUS[0]}

      - name: Einzigartigkeits-Gate (Bestand, mit Issue-Lebenszyklus)
        id: uniqueness
        continue-on-error: true
        run: |
          # Der tägliche Gesundheitslauf ist die Hauptwache. Dieser Quartalslauf
          # bleibt eine zweite, unabhängige Messung direkt NACH der KI-Aktualisierung.
          # Ein bestehender Live-Befund (Exit 1) hält Meta-/Deploy-Nachpflege nicht
          # an, wird aber als EIN deduplizierter Vorgang mit Audit-Beleg geführt.
          # Ein kaputter Selbsttest (Exit >= 2) ist kein Inhaltsbefund, sondern
          # ein Vertrauensbruch der Wache und stoppt den Lauf hart im Folgeschritt.
          set +e
          python3 scripts/check_uniqueness.py | tee /tmp/update_uniqueness.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Audit-Sabotage-Schutz erzwingen
        if: steps.uniqueness.outputs.exit_code != '0' && steps.uniqueness.outputs.exit_code != '1'
        run: |
          echo "🛑 Einzigartigkeits-Audit konnte sich nicht selbst beweisen (Exit ${{ steps.uniqueness.outputs.exit_code }})."
          exit 2

      # Ein Skript für Tages- UND Quartalslauf: Aktualisiert denselben
      # kanonischen Vorgang mit vollem Log und schließt ihn beim nächsten
      # grünen Produktionsbeweis. Das passiert VOR jeder nachgelagerten
      # Netzarbeit; ein IndexNow-Fehler darf den redaktionellen Befund nicht
      # unsichtbar machen. Arbeitsbranches dürfen niemals ein echtes
      # Produktions-Issue schließen oder still überschreiben.
      - name: Kritischen Bestandsbefund als einen Vorgang führen
        if: steps.uniqueness.outputs.exit_code == '1' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNIQUE_PRODUCTION_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: python3 scripts/uniqueness_issue_sync.py --status critical --report /tmp/update_uniqueness.txt

      - name: Erledigten Bestandsbefund automatisch schließen
        if: steps.uniqueness.outputs.exit_code == '0' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNIQUE_PRODUCTION_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: python3 scripts/uniqueness_issue_sync.py --status clean

      - name: Meta-Daten der aktualisierten Artikel nachziehen
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/meta_optimizer.py --fix --ai || true
          python3 scripts/meta_report.py || true

      - name: Änderungen committen & pushen
        run: |
          git config user.name "Update-Bot"
          git config user.email "update-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Artikel aktualisiert."
          else
            git commit -m "content: Quartalsweises Artikel-Update – Top-Artikel aufgefrischt (Frische-Signal)"
            scripts/git_sync.sh --push-only
          fi

      - name: Aktualisierte Artikel bei IndexNow einreichen
        run: python3 scripts/submit_indexnow.py

      - name: Issue bei Fehlern erstellen (nur wenn Update fehlschlug)
        if: steps.update.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let details = 'Artikel-Update fehlgeschlagen.';
            try { details = fs.readFileSync('/tmp/update_log.txt', 'utf-8'); } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔄 Artikel-Update fehlgeschlagen',
              body: '```\n' + details + '\n```\n\n---\nAutomatisch erstellt vom Quartals-Workflow.'
            });
            console.log('✅ Issue erstellt');
