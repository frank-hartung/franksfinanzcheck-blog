name: Automations-Simulator

# Simuliert TÄGLICH die gesamte Blog-Automatik End-to-End (Themen-Pool ->
# Artikel-Lifecycle -> Tags/Keywords/Provider -> Publish-Gate ->
# Social-Posting -> Kadenz-Steuerung) und prüft insbesondere, ob zentrale
# Lade-Funktionen noch die tatsächliche Artikelzahl finden (Regressionsschutz
# gegen die Bugklasse vom 13.08.2026: Skripte, die fehlerfrei durchlaufen,
# dabei aber still 0 statt N echte Artikel verarbeiten).
#
# Selbstheilung: nur sichere, mechanische Fälle (korrupte topics.yaml wird
# aus dem letzten Commit wiederhergestellt, fehlende Report-Dateien werden
# neu erzeugt). Echte Code-Bugs oder Redaktionsentscheidungen werden NICHT
# blind gepatcht, sondern lassen den Lauf fehlschlagen -> Fehler-Alerting
# erstellt automatisch ein GitHub-Issue.
#
# Ergänzt scripts/blog_doctor.py (der prüft Artikel-TEXT-Qualität), nicht
# ersetzt ihn: hier geht es um die Pipeline-MASCHINERIE selbst.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"   # täglich 04:00 UTC, vor den Content-Läufen

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install --quiet pyyaml

      - name: Automations-Simulation ausführen
        id: sim
        run: python3 scripts/automation_simulator.py

      - name: Report + evtl. Selbstheilung committen
        if: always()
        run: |
          git config user.name "FrankAutoOps Bot"
          git config user.email "actions@users.noreply.github.com"
          git add SIMULATION-REPORT.md data/topics.yaml *-REPORT.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: Automations-Simulation – Report/Selbstheilung [skip ci]"
          git push
