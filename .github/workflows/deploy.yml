# ============================================================
#  DEPLOY AUF GITHUB PAGES (Branch gh-pages)
#
#  Baut die Hugo-Website bei jedem Push auf 'main' sowie bei
#  manueller / Workflow-Auslösung (workflow_dispatch) und
#  pusht das erzeugte public/ in den Branch 'gh-pages'.
#
#  Hosting: GitHub Pages (Custom Domain: franksfinanzcheck.de)
# ============================================================
name: Deploy auf GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      audio_backfill:
        # Runbook (wann sinnvoll, Dauer, Kontrolle, Abbruch):
        # docs/AUDIO-BACKFILL-RUNBUCH.md
        description: 'Vorlese-Audio: alle fehlenden Tonspuren neu vertonen (sonst max. 25 je Lauf)'
        type: boolean
        default: false
      audio_backend:
        description: 'TTS-Backend für die Vorlese-Tonspur'
        type: choice
        default: auto
        options: [auto, edge, piper]
      audio_profile:
        description: 'Stimmen-Profil (news = deutscher Nachrichtensprecher, natural = Multilingual v2, narrator = Conrad)'
        type: choice
        default: news
        options: [news, natural, narrator]
      audio_limit_new:
        description: 'Maximal neu zu vertonende Artikel je Lauf (ignoriert, wenn audio_backfill=true)'
        type: string
        default: '25'
      audio_max_minutes:
        description: 'Zeitbudget für NEUE Vertonungen in Minuten (leer/0 = automatisch: 20 normal, 90 bei Backfill)'
        type: string
        default: ''
      audio_order:
        description: 'Reihenfolge für Archiv-Backfill und limitierte Queue'
        type: choice
        default: newest
        options: [newest, oldest, path]
      audio_voice_de:
        description: 'Optionale explizite DE-Stimme (überschreibt das Profil)'
        type: string
        default: ''
      audio_voice_en:
        description: 'Optionale explizite EN-Stimme (überschreibt das Profil)'
        type: string
        default: ''

permissions:
  contents: write

# ============================================================
#  WARTESCHLANGE (Befund Issue #218, 08.09.2026)
#  ------------------------------------------------------------
#  `cancel-in-progress: false` bleibt BEWUSST stehen: Ein laufender
#  Deploy darf nicht mitten in der Vertonung abgeschossen werden –
#  er wuerde Rechenzeit verbrennen, ohne eine Spur zu hinterlassen.
#
#  Wichtig zu wissen (das war die Ursache der Phantom-Meldungen):
#  GitHub haelt je Gruppe genau EINEN wartenden Lauf vor. Trifft ein
#  weiterer Push ein, wird der bis dahin WARTENDE Lauf mit
#  `cancelled` beendet – er hat nie eine Zeile ausgefuehrt. Das ist
#  KEIN Fehler, sondern gewolltes Verdraengen: Da `main` linear ist,
#  enthaelt der neuere Commit den aelteren bereits, der spaetere Lauf
#  veroeffentlicht also einen Superset-Stand. Verloren geht nichts.
#  Das Fehler-Alerting unterscheidet diesen Fall seit dem 08.09.2026
#  sauber von einem echten Abbruch (siehe alert-on-failure.yml).
#
#  Die eigentliche Reparatur ist deshalb nicht die Warteschlange,
#  sondern die Laufzeit: Sie wird unten hart gedeckelt, damit die
#  Warteschlange gar nicht erst volllaeuft.
# ============================================================
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # SICHERHEITSNETZ (Issue #218): Ohne eigenes Limit gilt GitHubs
    # Voreinstellung von 360 Minuten. Lauf 34140579736 hat sie voll
    # ausgeschoepft und die Deploy-Warteschlange SECHS STUNDEN blockiert –
    # in dieser Zeit ging kein einziger Artikel live. 150 Minuten liegen
    # komfortabel ueber dem groessten geplanten Lauf (Backfill: 90 min
    # Tonspur-Budget + Build + Deploy) und geben die Gruppe im Stoerfall
    # trotzdem schnell wieder frei.
    timeout-minutes: 150
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Merge-Marker-Schutz
        # PREM-AUDIT 26.08.2026: Das alte Muster (grep "<<" "<<" "<<")
        # behandelte die doppelten Anführungszeichen als DATEINAMEN →
        # Exit 2 (Datei fehlt), das in der if-Sicht "kein Fund" bedeutete:
        # der Schutz war SILENT inaktiv. Jetzt: echtes Git-Marker-Pattern
        # (<<<<<<</>>>>>>> mit Branch-Zeile), nur Textdateien, saubere
        # Exit-Codes.
        run: |
          if grep -rnE '^(<{7,} |={7,}$|>{7,} )' content/ layouts/ static/ hugo.toml \
              --include='*.md' --include='*.html' --include='*.toml' --include='*.yaml' --include='*.yml'; then
            echo "FEHLER: Unaufgelöste Merge-Marker gefunden! Build abgebrochen."
            exit 1
          fi
          echo "✅ Keine Merge-Marker."

      # ================= HARTES VOR-VERÖFFENTLICHUNGSGATE (26.08.2026) =================
      # ZWANGSVORGABE: Vor JEDEM Publish muss der Blog die Publikationsroutine
      # (nur Mo/Mi/Fr, 2–3 Artikel/Tag – CADENCE-REPORT.md Regel 2) und die
      # Titel-/Cover-Komplettheit erfüllen. Verstoß → SOFORTIGE SELBSTHEILUNG:
      #   • Kadenz-Verstoß  → Zurückstufung auf draft + Re-Queue
      #     (cadence_guard.py --fix) – der Live-Blog wird sofort korrekt
      #   • Titel-Verstoß   → deterministische Fixes (check_titles --fix);
      #     R5 (unvollständig) → publish_gate verworfen (neu) bzw.
      #     zurückgestuft (Re-Queue)
      #   • Cover-Mängel    → Varianten/Stale/Brand/Text neu gerendert
      #     (check_covers.py --fix)
      # So kann ein Verstoß NIEMALS live gehen – egal welcher Pfad
      # (manueller Commit, publish.py, Bot, …) ihn in main gebracht hat.
      # Die Heilungen werden gepusht (konvergent: der ausgelöste
      # Folge-Deploy findet einen sauberen Zustand und pusht nichts mehr).
      - name: Py-Abhängigkeiten für Gate-Chain
        run: python3 -m pip install -q pyyaml pillow pillow-avif-plugin 2>/dev/null || python3 -m pip install -q --break-system-packages pyyaml pillow pillow-avif-plugin

      # Die alte R9-Bestandsprüfung war nur ein Report (Exit 0), neue
      # Artikel-Gates übersprangen _index.md. Navigation immer hart prüfen.
      - name: Themenwelten – Quellvertrag (sechs Themen, saubere Texte)
        run: python3 scripts/themenwelten_guard.py --source-only

      # ===== URL-HYGIENE-GATE (PREMIUM-FIX 03.09.2026) =====================
      # Kernbefund Mi 02.09.2026: Ein fertiger Artikel wurde wegen einer
      # Markdown-URL mit Leerzeichen (R8-URL-LEERZEICHEN, „…-zu Hause/“
      # statt „…-zuhause/“) am Publish-Gate gestoppt und der Tag blieb mit
      # 1 statt 2–3 Artikeln. Dieses deterministische Gate heilt die Klasse
      # VOR dem Publish-Gate: (1) Leerzeichen-URLs werden gegen die echten
      # Post-Slugs aufgelöst, (2) ausschließlich dadurch blockierte
      # „hold“-Posts werden nachweislich in die Re-Queue gelegt – die
      # Promotion entscheidet weiter allein cadence_guard. Danach kann
      # R8-URL-LEERZEICHEN keinen Kandidaten mehr dauerhaft blockieren.
      - name: URL-Hygiene-Selbsttest (Heiler muss lauffähig sein)
        run: python3 scripts/fix_url_hygiene.py --selftest

      - name: URL-Hygiene-Gate (Leerzeichen-URLs selbstheilend)
        run: python3 scripts/fix_url_hygiene.py --fix || echo "⚠ URL-Hygiene – Restfunde siehe Log"

      - name: URL-Hygiene – deterministisch heilbare holds entblocken
        run: python3 scripts/fix_url_hygiene.py --heal-holds

      - name: Kadenz-Selbsttest (Gate muss lauffähig sein, sonst kein Build)
        run: python3 scripts/cadence_guard.py --selftest

      - name: Kadenz-Gate (Mo/Mi/Fr, 2–3/Tag – heilt Verstöße, Report)
        run: python3 scripts/cadence_guard.py --fix

      - name: Titel-Gate (R1–R5, inkl. Truncation-Wächter, selbstheilend)
        run: python3 scripts/check_titles.py --fix || echo "⚠ Titel-Gate – Funde im Log (R5 heilt nicht automatisch, publish_gate greift)"

      - name: Cover-Gate (Varianten, Stale, Brand, C4 Text-Komplettheit – selbstheilend)
        run: python3 scripts/check_covers.py --fix || echo "⚠ Cover-Gate – Funde im Log"

      # ================= DRAFT-LINK-GATE (PREM-AUDIT 26.08.2026) =================
      # Kadenz-Heilung stuft Posts auf draft (Re-Queue) zurück – ihre URLs
      # verschwinden aus dem Build, kontextuelle Links in live Artikeln
      # wären dann LIVE defekt (Issue #85: 19 tote Links). Der Heiler
      # entlinkt solche Ziele BEVOR dem Build (Ankertext bleibt 1:1,
      # idempotent). Safety-Net für jeden Pfad (manueller Commit, Bot, …).
      - name: Draft-Link-Selbsttest (Gate muss lauffähig sein)
        run: python3 scripts/draft_link_healer.py --selftest

      - name: Draft-Link-Gate (defekte Post-Ziele entlinken, Report)
        run: python3 scripts/draft_link_healer.py --fix

      # ================= FM-GRENZEN-GATE (Befund 11.09.2026) =================
      # Der Deploy starb drei Läufe in Folge nach Sekunden im Build-Schritt:
      # eine pin_description begann unquotiert mit dem UWG-Prefix
      # „*Werbung | …“ – in YAML startet „*“ einen ALIAS, Hugo verliert das
      # Frontmatter und `hugo --minify` bricht ab (Exit 1). Fatal daran ist
      # die WIRKUNG: Frontmatter-Fehler stoppen den ganzen Build, also auch
      # Spam-Gate, Publish-Gate, Anker-Wache, Vorlesen UND den Publish –
      # ohne Report, ohne verwertbares Alert, nur ein toter Deploy.
      # Die Wache prüft den FM-BLOCK so wie Hugo (Grenzen + YAML-Parse) und
      # heilt ausschließlich die Wert-Ebene (Quote) – nachweislich konvergent
      # und ohne Schema-Eingriff (eine Liste darf nie zum String werden).
      - name: FM-Grenzen-Selbsttest (Wache muss lauffähig sein, sonst kein Build)
        run: python3 scripts/fm_boundary_guard.py --selftest

      - name: FM-Gate (Frontmatter-Grenzen – selbstheilend, VOR dem Build)
        run: python3 scripts/fm_boundary_guard.py --fix

      - name: Hugo installieren (Extended, verifiziert, mehrquellig)
        uses: ./.github/actions/install-hugo
        with:
          version: "0.164.0"

      - name: Build (für Publish-Gate + Publish)
        run: hugo --minify

      # ================= SPAM-WACHE (Google + Pinterest, 26.08.2026) =================
      # Dauerauftrag: Blog, RSS-Feed (/index.xml = Quelle des Pinterest-
      # Auto-Publish), CSV-Upload und Pinterest-API spamfrei halten.
      # --fix heilt SOFORT (Blog: Disclosure/Pin-Kennzeichnung einfügen oder
      # Spam-Artikel auf draft, Feed: Spezial-Heiler; CSV: Neu-Schreibung;
      # API: Rate-Zustand). Niemals Content-Verlust. Heilungen + Report
      # landen über das Gate-Heilungsdiff automatisch im Repo.
      - name: Spam-Selftest (Wache muss lauffähig sein)
        run: python3 scripts/spam_guard.py --selftest

      - name: Spam-Gate (Blog, RSS-Feed, CSV, API – selbstheilend)
        run: python3 scripts/spam_guard.py --check blog feed csv api --fix || echo "⚠ Spam-Gate – Funde in SPAM-REPORT.md (selbstgeheilt, kein Content-Verlust)"

      - name: Publish-Gate (5 harte Prüfungen inkl. Cover-Text-Komplettheit)
        run: python3 scripts/publish_gate.py

      - name: Gate-Heilungsdiff merken (alle Gates, inkl. Publish-Gate)
        id: gate_diff
        run: |
          if git status --short | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Gate hat den Bestand geheilt – Commit + Rebuild folgen."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate-Heilungen committen (konvergent)
        run: |
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Gate: keine Heilungen nötig."
          else
            git commit -m "fix(gate): Kadenz-/Titel-/Cover-Heilungen vor Veröffentlichung (automatisch)"
            scripts/git_sync.sh --push-only
            echo "✅ Gate-Heilungen gepusht – Folge-Deploy prüft erneut (konvergent)."
          fi

      - name: Rebuild nach Heilungen (nur wenn sich Content geändert hat)
        if: steps.gate_diff.outputs.changed == 'true'
        run: hugo --minify

      # NACH ALLEN Content-Heilungen und dem letzten Rebuild: prüft genau
      # das auszuliefernde HTML, auch /posts/page/2/, Links und Live-Zähler.
      # Kein || true / continue-on-error: defekte Navigation geht nicht live.
      - name: Themenwelten – finales Veröffentlichungs-Gate
        run: python3 scripts/themenwelten_guard.py --public public

      # ================= ANKER-WACHE (Befund 10.09.2026) =================
      # Der Abschnitts-Knopf „Link kopieren“ trug ein „§“ als TEXT in
      # JEDER Überschrift. Kurzfassung („In diesem Artikel“), Tabellen-
      # Titel, Klartext-Kopie, Mini-Verzeichnis, die Vorlese-Engine,
      # Screenreader (Überschriften-Name) und Suchmaschinen lasen es mit.
      # Die Wache prüft die QUELLE und die gerade gebauten Seiten in
      # public/ – ein Fund stoppt den Deploy. Der Selbsttest sichert die
      # Bau-Prüfung selbst (Befund 13:44: sie flaggte zunächst den
      # legitimen, versteckten Theme-Anker auf jeder Seite).
      - name: Anker-Wache – Selbsttest (Bau-Prüfung lauffähig)
        run: python3 scripts/heading_anchor_guard.py --selftest

      - name: Anker-Wache (kein § in Überschriften, Kurzfassung & Vorlesen)
        run: python3 scripts/heading_anchor_guard.py

      # ================= VORLESE-AUDIO (FF Voice Studio, 05.09.2026) ========
      # Vorab vertonte Artikel mit einem MÄNNLICHEN DEUTSCHEN
      # NACHRICHTENSPRECHER – wie bei zeit.de. Die Tonspur (MP3) läuft über
      # das native HTML5-<audio>-Element und klingt damit IDENTISCH auf
      # iPhone, Mac, Tablet, Android, PC und in jedem Browser, unabhängig
      # von den Stimmen des Betriebssystems. NUR-DEUTSCH-VERTRAG
      # (Befund 07.09.2026): Die Vorlese-Funktion spricht ausschließlich
      # Deutsch; englische Begriffe liest der Nachrichtensprecher.
      #
      # KOSTENLOS & OHNE KEY: Eine Backend-Kette ohne Abo und ohne
      # Pflicht-Secret:
      #   edge  -> Microsoft-Edge-Neuralstimmen über das offene Paket edge-tts
      #            (Profil news: de-DE-ConradNeural — nüchterner
      #            Nachrichtenoton; Profil natural:
      #            de-DE-FlorianMultilingualNeural mit Mehrsprachigkeit
      #            für englische Fachbegriffe im deutschen Satz)
      #   piper -> lokale ONNX-Stimmen (de_DE-thorsten-high),
      #            offline, unbegrenzt, lizenzsauber
      #   (Das englische Groq-Notnagel-Backend ist mit dem Nur-Deutsch-
      #    Vertrag ersatzlos entfallen — GROQ_API_KEY wird für die Tonspur
      #    nicht mehr gelesen; die Content-Workflows nutzen es unberührt.)
      #
      # Robustheit: (1) Ohne verfügbares Backend wird keine Tonspur
      # geschrieben; der Reader bleibt automatisch auf der lokalen
      # Browserstimme - der Deploy bricht NIEMALS wegen der Tonspur ab.
      # (2) Inkrementell: unveränderte Artikel werden per Inhalts-Fingerprint
      # (inkl. Backend, Stimme und Rezept-Version) aus dem letzten
      # gh-pages-Stand wiederverwendet. (3) --limit-new begrenzt die
      # Neuvertonung je Lauf.
      - name: Vorlese-Audio-Selbsttests (Generator + Stimmen-Kette + Parität)
        run: |
          python3 scripts/ff_voice_audio.py --selftest || echo "⚠ Generator-Selftest – Funde im Log (kein Deploy-Stopp)"
          python3 scripts/ff_voice_backends.py --selftest || echo "⚠ Backends-Selftest – Funde im Log (kein Deploy-Stopp)"
          python3 scripts/ff_voice_parity_check.py || echo "⚠ Paritäts-Gate – Funde im Log (kein Deploy-Stopp)"

      - name: TTS-Backend installieren (Dekoder, edge-tts, optional piper-tts)
        run: |
          # ---- DEKODER ZUERST ---------------------------------------
          # Befund 07.09.2026: edge-tts liefert einen MP3-Strom. Ohne
          # Dekoder wurde daraus eine unlesbare .wav – jedes Segment fiel
          # aus, veröffentlicht wurde reine Digitalstille. ffmpeg (bzw.
          # miniaudio als Reserve) ist daher KEIN Komfort, sondern die
          # Voraussetzung für hörbaren Ton.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq \
              && sudo apt-get install -y -qq ffmpeg \
              || echo "⚠ ffmpeg nicht installierbar → miniaudio muss greifen"
          fi
          python3 -m pip install -q miniaudio 2>/dev/null \
            || python3 -m pip install -q --break-system-packages miniaudio \
            || echo "⚠ miniaudio nicht installierbar (ffmpeg bleibt Hauptweg)"
          # edge-tts: kostenlos, kein Key, männliche Neuralstimmen DE/EN.
          python3 -m pip install -q edge-tts 2>/dev/null \
            || python3 -m pip install -q --break-system-packages edge-tts \
            || echo "⚠ edge-tts nicht installierbar → Piper/Browser-Fallback"
          # piper-tts: lokale Offline-Stimmen als lizenzsichere zweite Stufe.
          python3 -m pip install -q piper-tts 2>/dev/null \
            || python3 -m pip install -q --break-system-packages piper-tts \
            || echo "⚠ piper-tts nicht installierbar → edge/Browser-Fallback"
          ffmpeg -version | head -1 || echo "⚠ ffmpeg fehlt → nur WAV ohne Mastering"
          # Zeigt Engines, Rezept-Version UND den gefundenen Dekoder an.
          python3 scripts/ff_voice_audio.py --engines || true

      - name: Vorlese-Tonspuren erzeugen (männliche deutsche Nachrichtensprecher-Stimme, kostenlos)
        # WANDUHR FÜR DEN SCHLIMMSTEN FALL (Härtung 10.09.2026):
        # Normal braucht dieser Schritt Budget (20 Min., Backfill 90)
        # plus Anlauf/Überlauf (Cache-Fetch, ein Segment-Überhang von
        # höchstens ~12 Min.). 120 Min. decken beides mit Reserve ab.
        # Bleibt der Schritt DENNOCH hängen (unvorhergesehener Hänger
        # außerhalb der gedeckelten Synthese), stirbt der Deploy NICHT
        # erst an der Job-Wanduhr (150 Min.): continue-on-error lässt
        # ihn mit Cache- + Browser-Fallback weiterlaufen, die
        # Nachmessung (--heal) räumt Teilausgaben weg. Ton darf den
        # Livegang verzögern, aber nie verhindern.
        timeout-minutes: 120
        continue-on-error: true
        run: |
          mkdir -p /tmp/ff-voice-cache
          # Vorherige Tonspuren vom letzten Deploy holen (inkrementell).
          # `+` erzwingt das Update: seit dem force_orphan-Fix (Issue #179)
          # ist gh-pages ein einzelner Orphan-Commit und damit KEIN
          # Fast-Forward mehr – ohne `+` würde dieser Fetch stets scheitern
          # und der Audio-Cache jeden Lauf neu vertonen.
          if git fetch --quiet origin +gh-pages:refs/remotes/origin/gh-pages 2>/dev/null; then
            git restore --source=origin/gh-pages -- audio/articles 2>/dev/null || true
            if [ -d audio/articles ]; then
              cp -r audio/articles/. /tmp/ff-voice-cache/ 2>/dev/null || true
              rm -rf audio
            fi
          fi
          AUDIO_BACKEND="${{ github.event.inputs.audio_backend || 'auto' }}"
          AUDIO_PROFILE="${{ github.event.inputs.audio_profile || 'news' }}"
          AUDIO_ORDER="${{ github.event.inputs.audio_order || 'newest' }}"
          AUDIO_LIMIT_NEW="${{ github.event.inputs.audio_limit_new || '25' }}"
          case "$AUDIO_LIMIT_NEW" in
            ''|*[!0-9]*) AUDIO_LIMIT_NEW=25 ;;
          esac
          if [ "${{ github.event.inputs.audio_backfill }}" = "true" ]; then
            LIMIT_NEW=0
          else
            LIMIT_NEW="$AUDIO_LIMIT_NEW"
          fi

          # ---- ZEITBUDGET (Reparatur Issue #218, 08.09.2026) -------------
          # Messung an echten Laeufen: Dieser eine Schritt brauchte 63 min
          # (Run 34129128450) bzw. 151 min (Run 34121113112), waehrend der
          # KOMPLETTE Rest des Deploys – Checkout, alle Gates, Hugo-Build
          # und gh-pages-Push – zusammen nur rund 90 Sekunden dauert. Die
          # Vertonung stellte also 97-99 % der Laufzeit und hat die
          # Deploy-Warteschlange dauerhaft verstopft; wartende Laeufe
          # wurden verdraengt (`cancelled`) und der Livegang verzoegerte
          # sich um Stunden.
          #
          # Die Stueckgrenze --limit-new konnte das nicht verhindern, weil
          # die Dauer je Artikel stark schwankt. --max-seconds ist die
          # fehlende Wanduhr: Sie deckelt NUR die Neusynthese. Fertige
          # Spuren bleiben, alle uebrigen Artikel behalten ihre Spur aus
          # dem Cache, und der naechste Lauf setzt die Warteschlange genau
          # dort fort (konvergent, kein Verlust).
          AUDIO_MAX_MINUTES="${{ github.event.inputs.audio_max_minutes || '' }}"
          case "$AUDIO_MAX_MINUTES" in
            ''|*[!0-9]*) AUDIO_MAX_MINUTES=0 ;;
          esac
          if [ "$AUDIO_MAX_MINUTES" -eq 0 ]; then
            # Automatik: Ein bewusst angestossener Backfill darf laenger
            # arbeiten, der normale Push-Deploy bleibt schnell.
            if [ "${{ github.event.inputs.audio_backfill }}" = "true" ]; then
              AUDIO_MAX_MINUTES=90
            else
              AUDIO_MAX_MINUTES=20
            fi
          fi
          MAX_SECONDS=$(( AUDIO_MAX_MINUTES * 60 ))

          echo "🔧 Tonspuren: backend=$AUDIO_BACKEND profile=$AUDIO_PROFILE order=$AUDIO_ORDER limit_new=$LIMIT_NEW budget=${AUDIO_MAX_MINUTES}min"
          python3 scripts/ff_voice_audio.py \
            --html-dir public \
            --out-dir public/audio/articles \
            --cache-dir /tmp/ff-voice-cache \
            --backend "$AUDIO_BACKEND" \
            --profile "$AUDIO_PROFILE" \
            --order "$AUDIO_ORDER" \
            --limit-new "$LIMIT_NEW" \
            --max-seconds "$MAX_SECONDS" \
            || echo "⚠ Vorlese-Tonspuren unvollständig – Deploy läuft weiter (Browser-Fallback aktiv)"
          echo "✅ Vorlese-Audio-Schritt abgeschlossen."

      # Endkontrolle VOR der Veröffentlichung: Jede Tonspur wird gemessen
      # (Pegel, hörbarer Anteil, Laufzeit) und ihre Chunk-Karte gegen den
      # Artikeltext geprüft. Wer durchfällt, verliert Datei und
      # Konfigurationsblock (--heal) – dann liest die Gerätestimme vor.
      # Lieber ehrliche Browserstimme als eine stumme Studiospur.
      - name: Tonspuren nachmessen und stumme Spuren entfernen
        run: |
          python3 scripts/ff_voice_audio.py --verify --heal \
            --html-dir public \
            --out-dir public/audio/articles \
            || echo "⚠ Nachmessung mit Funden – Deploy läuft weiter"
          # Zweiter Durchgang rein zur Protokollierung: Danach darf nichts
          # Beanstandetes mehr im Veröffentlichungsstand liegen.
          python3 scripts/ff_voice_audio.py --verify \
            --html-dir public \
            --out-dir public/audio/articles \
            || echo "⚠ Es bleiben beanstandete Spuren – bitte im Log nachsehen"

      # NACHWEIS FÜR DEN AUDIO-BACKFILL (Runbook: docs/AUDIO-BACKFILL-RUNBUCH.md)
      # Wer `audio_backfill=true` auslöst, startet bewusst einen Lauf von bis zu
      # 90 Minuten Vertonung. Die Frage danach ist immer dieselbe: „Hat es was
      # gebracht?" – und die soll sich beantworten lassen, ohne eine Stunde Log
      # zu wälzen. Gemessen wird deshalb zweimal: VORHER aus dem gh-pages-Stand,
      # aus dem der Audio-Cache gefüllt wurde, NACHHER aus dem Build, der gleich
      # veröffentlicht wird. Beide Zahlen landen in der Lauf-Zusammenfassung.
      # Rein berichtend: der Schritt kann den Livegang nicht aufhalten (eine
      # fehlende Studiospur bedeutet Gerätestimme, keinen Ausfall).
      - name: Audio-Abdeckung in die Lauf-Zusammenfassung
        continue-on-error: true
        run: |
          {
            echo "## 🎧 Studio-Tonspuren (Vorlese-Audio)"
            echo ""
            echo "**Vorher** – Stand auf \`gh-pages\` vor diesem Lauf:"
            echo '```'
            python3 scripts/audio_coverage_check.py --ref origin/gh-pages \
              || echo "(kein Vorher-Nachweis: gh-pages nicht erreichbar)"
            echo '```'
            echo ""
            echo "**Nachher** – dieser Build, wird veröffentlicht:"
            echo '```'
            # Ohne Verzeichnis wäre die Ausgabe „0/31“ – das ist keine
            # Aussage über den Bestand, sondern nur ein fehlender Fundort.
            if [ -d public/audio/articles ]; then
              python3 scripts/audio_coverage_check.py --dir public/audio/articles \
                || echo "(nicht messbar)"
            else
              echo "(Vertonungsschritt hat in diesem Lauf kein Audio-Verzeichnis erzeugt)"
            fi
            echo '```'
            echo ""
            echo "_Lücken schließen: Deploy mit \`audio_backfill=true\` erneut auslösen_"
            echo "_(Runbook: \`docs/AUDIO-BACKFILL-RUNBUCH.md\`)._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy auf gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          # PREMIUM-FIX 06.09.2026 (Issue #179): gh-pages ist ein
          # REGENERIERBARES Build-Artefakt. Ohne force_orphan sammelte
          # sich dort eine 169-Commits-History mit unkomprimierten
          # Vorlese-WAVs (~3,5 GB) an – dadurch sprengte das tägliche
          # Offsite-Backup (`git bundle --all`) die 2-GiB-Release-Grenze
          # und fiel dauerhaft aus. force_orphan hält den Branch bei
          # GENAU EINEM Commit (aktueller Build): keine History-Explosion,
          # der inkrementelle Audio-Cache (Vorlese-Schritt oben) liest
          # weiterhin korrekt aus dem letzten gh-pages-Stand.
          force_orphan: true
          cname: franksfinanzcheck.de
