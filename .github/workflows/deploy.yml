# ============================================================
#  KOSTENLOSES DEPLOYMENT AUF GITHUB PAGES – BRANCH-METHODE
#
#  Robuster als deploy-pages: Der Build wird direkt auf den
#  gh-pages-Branch gepusht. GitHub Pages deployed von dort –
#  ohne die anfällige deploy-pages-Action (heutige Ausfälle:
#  "Deployment cancelled" durch GitHub-Pages-Überlastung).
#
#  VORAUSSETZUNG (einmalig, per API erledigt):
#    Settings → Pages → Source: "Deploy from a branch" → gh-pages
#
#  Queue statt Cancel: parallele Deploys warten
# ============================================================
name: Deploy auf GitHub Pages

on:
  push:
    branches: ["main"]
    # Deploy-Flut-Bremse (11.08. Spaet, Audit-Punkt 3): Nur Nutzer-Sichtbares
    # baut die Seite neu. Report-/Bot-Haushalts-Commits, Skripte, CI-Dateien
    # und data/-Tagebuecher triggen KEINEN Rebuild mehr (halbiert Builds).
    paths-ignore:
      - "scripts/**"
      - ".github/**"
      - "data/**"
      - "/*.md"          # Root-Reports (alle *-REPORT.md, STATUS, REGELWERK)
      - "/.polish_cache.json"
      - "/.affiliate_report.json"
      - "/.meta_report.json"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Hugo installieren
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Seite bauen
        env:
          # Bild-URLs fürs jsDelivr-CDN versionieren (Cache: 1 Jahr + immutable)
          HUGO_JSDELIVR_SHA: ${{ github.sha }}
        run: hugo --minify

      - name: Auf gh-pages-Branch veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          cname: ""  # Keine eigene Domain (github.io)
