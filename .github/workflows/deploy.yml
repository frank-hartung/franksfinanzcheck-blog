# ============================================================
#  KOSTENLOSES DEPLOYMENT AUF GITHUB PAGES – BRANCH-METHODE
#
#  Robuster als deploy-pages: Der Build wird direkt auf den
#  gh-pages-Branch gepusht. GitHub Pages deployed von dort –
#  ohne die anfällige deploy-pages-Action (heutige Ausfälle:
#  "Deployment cancelled" durch GitHub-Pages-Überlastung).
#
#  VORAUSSETZUNG (einmalig, per API erledigt):
#    Settings → Pages → Source: "Deploy from a branch" → gh-pages
#
#  Queue statt Cancel: parallele Deploys warten
# ============================================================
name: Deploy auf GitHub Pages

on:
  push:
    branches: ["main"]
    # Deploy-Flut-Bremse (11.08. Spaet, Audit-Punkt 3): Nur Nutzer-Sichtbares
    # baut die Seite neu. Report-/Bot-Haushalts-Commits, Skripte, CI-Dateien
    # und data/-Tagebuecher triggen KEINEN Rebuild mehr (halbiert Builds).
    paths-ignore:
      - "scripts/**"
      - ".github/**"
      - "data/**"
      - "/*.md"          # Root-Reports (alle *-REPORT.md, STATUS, REGELWERK)
      - "docs/**"        # Einmal-Doku (Profi-Cleanup 20.08.) – kein Deploy nötig
      - "/.polish_cache.json"
      - "/.affiliate_report.json"
      - "/.meta_report.json"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Hugo installieren
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Vorbau-Wache (Merge-Marker duerfen den Build nie mehr toeten)
        # 12.08. Nacht: HaIr-Guard, rewischen bis gueltig. Bei Fund: auto-heilen
        # + commiten statt roter Build; das Depot baut immer.
        run: |
          python3 - <<'PYE'
          import pathlib, re, subprocess, sys
          MARK = re.compile(r"(?ms)^<<<<<<<[^\n]*\n(.*?)^=======$\n(.*?)^>>>>>>>[^\n]*$")
          def pick(m):
              a, b = m.group(1), m.group(2)
              la = len([x for x in a.split("\n") if x.strip()]); lb = len([x for x in b.split("\n") if x.strip()])
              return a if la >= lb else b
          done = 0
          for f in pathlib.Path("content").rglob("*.md"):
              t = f.read_text(encoding="utf-8")
              if "^<<<<<<<" in t or "^>>>>>>>" in t:
                  f.write_text(MARK.sub(pick, t), encoding="utf-8"); done += 1
          if done:
              subprocess.run(["git","config","user.name","Deploy-Guard"], check=False)
              subprocess.run(["git","config","user.email","deploy-guard@users.noreply.github.com"], check=False)
              subprocess.run(["git","add","-A"], check=False)
              subprocess.run(["git","commit","-m","chore: Deploy-Guard heilt Merge-Marker in content/"], check=False)
              print(f"✅ {done} Dateien geheilt; Build laeuft dann korrekt.")
          print("Vorbau-Wache: sauber" if not done else f"geheilt: {done}")
          PYE

      - name: Seite bauen
        env:
          # Bild-URLs fürs jsDelivr-CDN versionieren (Cache: 1 Jahr + immutable)
          HUGO_JSDELIVR_SHA: ${{ github.sha }}
        run: hugo --minify

      - name: Auf gh-pages-Branch veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          cname: ""  # Keine eigene Domain (github.io)
