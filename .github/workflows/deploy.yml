# ============================================================
#  DEPLOY AUF GITHUB PAGES (Branch gh-pages + offizielles Pages-Deployment)
#
#  Baut die Hugo-Website bei jedem Push auf 'main' sowie bei
#  manueller / Workflow-Auslösung (workflow_dispatch), pusht das
#  erzeugte public/ zur Archivierung/Vertonungs-Cache in den Branch
#  'gh-pages' UND liefert es zusätzlich über das offizielle GitHub-
#  Pages-Deployment (Environment "github-pages") aus.
#
#  Hosting: GitHub Pages (Custom Domain: franksfinanzcheck.de)
#
#  ------------------------------------------------------------
#  PREMIUM-FIX 03.10.2026 (Issue #537 – öffentliche Auslieferung
#  dauerhaft unter Mindestziel):
#  Die Pages-Konfiguration dieses Repos steht auf `build_type: workflow`
#  und das Environment "github-pages" ist bereits mit einer
#  Branch-Policy (main, gh-pages) angelegt – GitHub erwartet also ein
#  offizielles Actions-Pages-Deployment (`actions/deploy-pages`), NICHT
#  nur einen Push auf den `gh-pages`-Branch. Der reine `peaceiris`-Push
#  wurde von GitHub Pages seit dem 30.09.2026 ~13:00 UTC schlicht
#  ignoriert (letztes automatisches Pages-Deployment/Build:
#  f641f413, 2026-09-30T13:00:07Z) – jeder Deploy-Lauf meldete danach
#  "success", ohne dass je wieder ein Artikel öffentlich ausgeliefert
#  wurde. `deploy_drift_guard.py` und das `deploy-gate` oben werten den
#  `gh-pages`-Branch weiterhin als Cache-/Audit-Spur aus (Diff-Basis,
#  Audio-Cache, Offsite-Backup) – das bleibt unverändert und schadet
#  nicht, ist aber NICHT mehr die Quelle der Wahrheit für das, was
#  öffentlich erreichbar ist. Das ist jetzt ausschließlich das Ergebnis
#  des `actions/deploy-pages`-Jobs unten (Job `pages-deployment`),
#  sichtbar über `GET /repos/.../deployments?environment=github-pages`.
#  Siehe docs/publication-reliability.md (Befund 03.10.2026).
# ============================================================
name: Deploy auf GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      audio_backfill:
        # Runbook (wann sinnvoll, Dauer, Kontrolle, Abbruch):
        # docs/AUDIO-BACKFILL-RUNBUCH.md
        description: 'Vorlese-Audio: alle fehlenden Tonspuren neu vertonen (sonst max. 25 je Lauf)'
        type: boolean
        default: false
      audio_backend:
        description: 'TTS-Backend für die Vorlese-Tonspur'
        type: choice
        default: auto
        options: [auto, elevenlabs, edge, piper]
      audio_profile:
        description: 'Stimmen-Profil (news = Conrad/Andrew, natural = Multilingual v2, narrator = Kilian/Brian)'
        type: choice
        default: news
        options: [news, natural, narrator]
      audio_limit_new:
        description: 'Maximal neu zu vertonende Artikel je Lauf (ignoriert, wenn audio_backfill=true)'
        type: string
        default: '25'
      audio_max_minutes:
        description: 'Zeitbudget für NEUE Vertonungen in Minuten (leer/0 = automatisch: 20 normal, 90 bei Backfill)'
        type: string
        default: ''
      audio_order:
        description: 'Reihenfolge für Archiv-Backfill und limitierte Queue'
        type: choice
        default: newest
        options: [newest, oldest, path]
      audio_voice_de:
        description: 'Optionale explizite DE-Stimme (überschreibt das Profil)'
        type: string
        default: ''
      audio_voice_en:
        description: 'Optionale explizite EN-Stimme (überschreibt das Profil)'
        type: string
        default: ''

permissions:
  contents: write
  # Für das offizielle GitHub-Pages-Deployment (Job "pages-deployment",
  # Issue #537 – ohne diese zwei Rechte bleibt `actions/deploy-pages`
  # wirkungslos und die Site friert trotz "erfolgreichem" Lauf ein).
  pages: write
  id-token: write

# ============================================================
#  WARTESCHLANGE (Befund Issue #218, 08.09.2026)
#  ------------------------------------------------------------
#  `cancel-in-progress: false` bleibt BEWUSST stehen: Ein laufender
#  Deploy darf nicht mitten in der Vertonung abgeschossen werden –
#  er wuerde Rechenzeit verbrennen, ohne eine Spur zu hinterlassen.
#
#  Wichtig zu wissen (das war die Ursache der Phantom-Meldungen):
#  GitHub haelt je Gruppe genau EINEN wartenden Lauf vor. Trifft ein
#  weiterer Push ein, wird der bis dahin WARTENDE Lauf mit
#  `cancelled` beendet – er hat nie eine Zeile ausgefuehrt. Das ist
#  KEIN Fehler, sondern gewolltes Verdraengen: Da `main` linear ist,
#  enthaelt der neuere Commit den aelteren bereits, der spaetere Lauf
#  veroeffentlicht also einen Superset-Stand. Verloren geht nichts.
#  Das Fehler-Alerting unterscheidet diesen Fall seit dem 08.09.2026
#  sauber von einem echten Abbruch (siehe alert-on-failure.yml).
#
#  Die eigentliche Reparatur ist deshalb nicht die Warteschlange,
#  sondern die Laufzeit: Sie wird unten hart gedeckelt, damit die
#  Warteschlange gar nicht erst volllaeuft.
# ============================================================
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  # ============================================================
  #  DEPLOY-ENTLASTUNG (Premium-Audit 12.09.2026)
  #  ------------------------------------------------------------
  #  Groesste Selbstbehinderung der Automation: DIESER Deploy hat
  #  keinen Pfade-Filter, also loeste JEDER Push auf main einen
  #  kompletten Lauf aus (Gates + Hugo-Build + bis zu 20 Min.
  #  TTS + gh-pages-Push). Der Social-Autopilot committet z. B.
  #  alle 2 h nur data/social/ + Pin-Bilder, dazu Newsletter-,
  #  Fristen-, Mastodon- und Status-Commits: ~8 Deploys pro Tag
  #  ohne eine einzige Content-Aenderung – sie verstopften die
  #  pages-deploy-Warteschlange (Befund Issue #218) und verdraengten
  #  echte Artikel-Deploys.
  #
  #  Die Gate-JOBS verlieren durch den Sprung nichts an Abdeckung:
  #  blog-health-daily (taeglich 07:45 MESZ) faehrt dieselbe
  #  Heilkette, und die Content-Workflows pruefen vor jedem Slot.
  #  Fehlsicherheit: Bei Unklarheit (Erst-Push, API-Fehler,
  #  Force-Push, manueller Lauf) wird IMMER deployed.
  # ============================================================
  deploy-gate:
    name: Relevante Aenderungen pruefen (Deploy-Entlastung)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pages-deploy-gate
      cancel-in-progress: true
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - name: Relevante Aenderungen?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1) Manueller Lauf: immer Deploy (Audio-Backfill & Co. muessen
          #    erreichbar bleiben).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manuell ausgeloest – Deploy laeuft immer."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2) Ziel-Commit dieses Laufs (HEAD von main)
          AFTER="${{ github.event.after }}"
          if [ -z "$AFTER" ] || [ "$AFTER" = "0000000000000000000000000000000000000000" ]; then
            AFTER="$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha' 2>/dev/null || echo "")"
          fi
          if [ -z "$AFTER" ]; then
            echo "Ziel-Commit nicht ermittelbar – Deploy laeuft (Fehlsicherheit)."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3) Zwei ausdrücklich getrennte Wahrheiten ermitteln:
          #    a) gh-pages = Build-Cache/Audit-Spur und damit Diff-Basis (#433)
          #    b) Environment github-pages, ref main, Status success = der Stand,
          #       den actions/deploy-pages TATSÄCHLICH öffentlich ausgeliefert hat.
          #
          #    PREMIUM-FIX WF-7C1F / #538 (03.10.2026): #537 ergänzte zwar
          #    actions/deploy-pages, das Entlastungs-Gate vertraute beim nächsten
          #    Push aber weiterhin allein auf den aktuellen gh-pages-Cache. Weil
          #    dieser Cache schon frisch war, übersprang es Build UND den neuen
          #    Pages-Job. Es gab weiterhin kein einziges Workflow-Deployment.
          #    Deshalb darf die Pfad-Entlastung erst greifen, wenn Cache-SHA und
          #    nachweislich erfolgreiches Pages-Deployment dieselbe Source-SHA
          #    tragen. API-/Status-Unklarheit ist fail-safe: deploy=true.
          LIVE_DEPLOY_SHA=""
          gh_pages_msg="$(gh api "repos/${{ github.repository }}/commits/gh-pages" --jq '.commit.message' 2>/dev/null || echo "")"
          if [ -n "$gh_pages_msg" ]; then
            LIVE_DEPLOY_SHA="$(echo "$gh_pages_msg" | grep -oE '[0-9a-f]{40}' | head -1 || echo "")"
          fi

          PAGES_DEPLOYMENT_ID=""
          PAGES_DEPLOY_SHA=""
          PAGES_DEPLOY_STATUS=""
          pages_deployment="$(gh api \
            "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=100" \
            --jq '[.[] | select(.ref == "main" or .ref == "refs/heads/main")][0] | if . == null then "" else "\(.id) \(.sha)" end' \
            2>/tmp/pages-deployment.err || true)"
          if [ -n "$pages_deployment" ]; then
            read -r PAGES_DEPLOYMENT_ID PAGES_DEPLOY_SHA <<< "$pages_deployment"
            PAGES_DEPLOY_STATUS="$(gh api \
              "repos/${{ github.repository }}/deployments/${PAGES_DEPLOYMENT_ID}/statuses?per_page=1" \
              --jq '.[0].state // ""' 2>/tmp/pages-status.err || true)"
          fi

          echo "Status-Uebersicht:"
          echo "  • Cache auf gh-pages        : ${LIVE_DEPLOY_SHA:-unbekannt}"
          echo "  • Offizielles Pages-Deploy  : ${PAGES_DEPLOY_SHA:-nicht vorhanden} (${PAGES_DEPLOY_STATUS:-kein Erfolgsstatus})"
          echo "  • Ziel-Stand main           : ${AFTER}"
          echo "  • Push before               : ${{ github.event.before }}"

          # 4) Harte Auslieferungs-Invariante VOR jeder Entlastung:
          #    Nur ein erfolgreiches offizielles Deployment derselben Source-SHA
          #    beweist, dass der Cache öffentlich ist. Fehlt dieser Beleg, muss
          #    selbst ein reiner Workflow-/Doku-Push den vollständigen Deploy
          #    ausführen. Genau das bootstrapped den Fix nach dem Merge von #538.
          if [ -z "$LIVE_DEPLOY_SHA" ]; then
            echo "Kein belastbarer gh-pages-Cache – vollständiger Deploy (fail-safe)."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PAGES_DEPLOY_STATUS" != "success" ] || [ "$PAGES_DEPLOY_SHA" != "$LIVE_DEPLOY_SHA" ]; then
            echo "Öffentliches Pages-Deployment fehlt/ist nicht erfolgreich oder hinkt dem Cache hinterher."
            echo "Cache ${LIVE_DEPLOY_SHA:0:7}, Pages ${PAGES_DEPLOY_SHA:0:7} (${PAGES_DEPLOY_STATUS:-unbekannt}) – Reparatur-Deploy läuft."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Erst NACH dem öffentlichen Nachweis darf ein identischer Zielstand
          # entlastet werden. gh-pages allein ist ausdrücklich kein Live-Beleg.
          if [ "$LIVE_DEPLOY_SHA" = "$AFTER" ]; then
            echo "Cache und offizielles Pages-Deployment sind auf Stand ${AFTER:0:7} – kein Deploy noetig."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 5) Basis für den Datei-Diff bestimmen:
          #    Primär: LIVE_DEPLOY_SHA (schützt vor Lücken durch abgebrochene/übersprungene Vorläufe, #433)
          #    Fallback: github.event.before (wenn gh-pages neu/leer ist)
          BASE_SHA=""
          if [ -n "$LIVE_DEPLOY_SHA" ]; then
            BASE_SHA="$LIVE_DEPLOY_SHA"
            echo "Vergleiche Live-Stand (${LIVE_DEPLOY_SHA:0:7}) mit Ziel (${AFTER:0:7}) …"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${{ github.event.before }}"
            echo "Kein Live-Stand auf gh-pages gefunden – Fallback auf Push-Before (${BASE_SHA:0:7}) …"
          fi

          if [ -z "$BASE_SHA" ]; then
            echo "Erst-Push / keine Basis vorhanden – Deploy laeuft (Fehlsicherheit)."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 6) Dateien zwischen BASE_SHA und AFTER diffen
          files="$(gh api "repos/${{ github.repository }}/compare/${BASE_SHA}...${AFTER}" \
            --paginate --jq '.files[].filename' 2>/tmp/compare.err)" || files=""

          if [ -z "$files" ]; then
            # Wenn Compare gegen LIVE_DEPLOY_SHA fehlschlägt (z. B. nach Rebase/Force-Push
            # kein gemeinsamer Vorfahre), Fallback auf Push-Before versuchen:
            if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "$BASE_SHA" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              echo "Compare gegen Live-Stand fehlgeschlagen – versuche Fallback auf Push-Before …"
              files="$(gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${AFTER}" \
                --paginate --jq '.files[].filename' 2>/tmp/compare_fb.err)" || files=""
            fi
          fi

          if [ -z "$files" ]; then
            # API nicht erreichbar o. a. -> Fehlsicherheit: Deploy laeuft.
            echo "⚠ Compare-API nicht erreichbar ($(head -c 200 /tmp/compare.err 2>/dev/null)) – Deploy laeuft (Fehlsicherheit)."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Veraenderte Pfade (${BASE_SHA:0:7}..${AFTER:0:7}):"
          echo "$files" | sed 's/^/  /'

          # 7) Negativliste: NUR bekannte Zustands-/Doku-Pfade sind
          #    deploy-irrelevant. Alles Neue (content/..., static/...,
          #    data/themenwelten.json, hugo.toml, layouts/...) ist per
          #    Default RELEVANT – so kann kein zukuenftiger State-Pfad
          #    versehentlich den Livegang stoppen.
          #
          #    `.affiliate_integrity_state.json` (#281, 15.09.2026): Der
          #    Zustand der Affiliate-Wache wird jetzt bei JEDEM Lauf als
          #    Lebenszeichen mitgepusht (Herzschlag statt eingefrorenem
          #    Zeitstempel). Er liegt im Wurzelverzeichnis und hat null
          #    Site-Wirkung – ohne diesen Eintrag koennte ein reines
          #    Lebenszeichen einen vollen Deploy samt Vertonung anstossen
          #    (genau die Queue-Belastung aus dem Premium-Audit 12.09.).
          #
          #    NEBENBEFUND 15.09.2026 (beim Absichern des Herzschlags
          #    aufgefallen): Die Verzeichnis-Eintraege hiessen `docs/`,
          #    `scripts/`, `.github/` … – mit den Ankern ^…$ matcht das nur
          #    eine Datei, die exakt so heisst. Verzeichnis-Pushes (docs/,
          #    scripts/, data/social/, …) galten damit als deploy-relevant
          #    und loesten den vollen Deploy aus, obwohl die Intention (und
          #    der Audit-Befund F1) genau das Gegenteil war. Jetzt `dir/.*`.
          #    Vertrag: tests/test_deploy_gate_paths.py friert beide
          #    Richtungen ein (Lebenszeichen irrelevant, Site-Pfade relevant).
          STATE_ONLY='^(\.github/.*|docs/.*|scripts/.*|e2e/.*|data/social/.*|data/research/.*|data/audit/.*|data/[^/]*_state\.json|data/[^/]*_history\.jsonl|data/[^/]*\.meta\.json|data/social_log\.jsonl|data/secrets_state\.json|data/pinterest_token_state\.json|data/integrity_lock\.json|data/governance_status\.json|data/governance_history\.jsonl|data/alerting_heartbeat\.json|data/revenue_funnel\.json|static/images/social/.*|\.[^/]*_state\.json|\.casing_report\.json|\.indexnow_submitted\.json|\.meta_cache\.json|\.affiliate_integrity_state\.json|\.gitignore|package\.json|package-lock\.json|[A-Za-z0-9._-]+\.md)$'
          relevant="$(echo "$files" | grep -vE "$STATE_ONLY" || true)"
          if [ -n "$relevant" ]; then
            echo "Deploy-relevante Pfade:"
            echo "$relevant" | sed 's/^/  /'
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nur Zustands-/Doku-Aenderungen seit letztem Livegang – Build+Vertonung wird uebersprungen."
            echo "(Gates laufen weiter: blog-health-daily + Content-Workflows.)"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: deploy-gate
    if: needs.deploy-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # SICHERHEITSNETZ (Issue #218): Ohne eigenes Limit gilt GitHubs
    # Voreinstellung von 360 Minuten. Lauf 34140579736 hat sie voll
    # ausgeschoepft und die Deploy-Warteschlange SECHS STUNDEN blockiert –
    # in dieser Zeit ging kein einziger Artikel live. 150 Minuten liegen
    # komfortabel ueber dem groessten geplanten Lauf (Backfill: 90 min
    # Tonspur-Budget + Build + Deploy) und geben die Gruppe im Stoerfall
    # trotzdem schnell wieder frei.
    timeout-minutes: 150
    # ============================================================
    #  AUSLIEFERUNG VOR SIEGEL (Dauerheilung #676, 10.10.2026)
    #  ------------------------------------------------------------
    #  Befund: Zwischen 02:12 und 17:43 UTC am 09.10.2026 scheiterte der
    #  `deploy`-Job 20× in Folge (plus ein verdrängter Lauf) am Schritt
    #  „Release-Scorecard (Produktionswahrheit versiegeln, fail-closed)“.
    #  Weil die Scorecard VOR der Auslieferung steht, sprangen die Schritte
    #  50–60 – inkl. „Artefakt für offizielles Pages-Deployment hochladen“ –
    #  und damit der Job `pages-deployment` komplett. Öffentlich ging vom
    #  08.10. 22:35 bis zum 09.10. 18:13 UTC nichts raus (19 h 38 min); der
    #  um 14:02 UTC veröffentlichte Artikel lieferte 4 h 11 min HTTP 404
    #  (Ticket #676, „Neuester Artikel nicht live“).
    #
    #  Die Scorecard ist ein BEWEISLAUF ohne Heilung. Ihr Exit-Vertrag
    #  trennt zwei grundverschiedene Dinge:
    #    · Exit 1 = heutige Kandidaten fachlich BLOCKIERT  → echter
    #      Inhaltsbefund, die Auslieferung MUSS stehen bleiben.
    #    · Exit 2 = WERKZEUGFEHLER                          → die Messung
    #      selbst ist kaputt. Das ist kein Inhaltsbefund – und darf die
    #      öffentliche Auslieferung nie als Geisel nehmen.
    #  Deshalb wird der Werkzeugfehler hier als Job-Output nach außen
    #  gegeben und der Lauf erst NACH der Auslieferung rot (Job
    #  `release-seal`). Fail-closed bleibt erhalten: nichts wird
    #  verschluckt, das zentrale Fehler-Alerting meldet weiterhin. Nur
    #  die Reihenfolge stimmt jetzt: erst liefern, dann siegeln.
    # ============================================================
    outputs:
      artefakt_ok: ${{ steps.artefakt.outputs.artefakt_ok }}
      scorecard_exit: ${{ steps.scorecard.outputs.exit_code }}
      scorecard_werkzeugfehler: ${{ steps.scorecard.outputs.werkzeugfehler }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Merge-Marker-Schutz
        # PREM-AUDIT 26.08.2026: Das alte Muster (grep "<<" "<<" "<<")
        # behandelte die doppelten Anführungszeichen als DATEINAMEN →
        # Exit 2 (Datei fehlt), das in der if-Sicht "kein Fund" bedeutete:
        # der Schutz war SILENT inaktiv. Jetzt: echtes Git-Marker-Pattern
        # (<<<<<<</>>>>>>> mit Branch-Zeile), nur Textdateien, saubere
        # Exit-Codes.
        run: |
          if grep -rnE '^(<{7,} |={7,}$|>{7,} )' content/ layouts/ static/ hugo.toml \
              --include='*.md' --include='*.html' --include='*.toml' --include='*.yaml' --include='*.yml'; then
            echo "FEHLER: Unaufgelöste Merge-Marker gefunden! Build abgebrochen."
            exit 1
          fi
          echo "✅ Keine Merge-Marker."

      # WF-7B6B / #654 (08.10.2026): Ein Merge-Rest in package.json ließ jeden
      # Deploy zwischen 10:41 und 12:50 UTC im Schritt „Suchindex bauen“ sterben,
      # ohne Hinweis auf die Datei. Diese Wache stoppt den Lauf VOR dem ersten
      # Gate und dem Build und nennt Datei, Zeile und Ursache. Fail-closed.
      # Runbook: docs/ANLEITUNG-MANIFEST-WACHE.md
      - name: Manifest-Schutz (package.json & Lockfile – fail-closed)
        run: |
          python3 scripts/manifest_guard.py --selftest
          python3 scripts/manifest_guard.py

      # ================= HARTES VOR-VERÖFFENTLICHUNGSGATE (26.08.2026) =================
      # ZWANGSVORGABE: Vor JEDEM Publish muss der Blog die Publikationsroutine
      # (nur Mo/Mi/Fr, 2–3 Artikel/Tag – CADENCE-REPORT.md Regel 2) und die
      # Titel-/Cover-Komplettheit erfüllen. Verstoß → SOFORTIGE SELBSTHEILUNG:
      #   • Kadenz-Verstoß  → Zurückstufung auf draft + Re-Queue
      #     (cadence_guard.py --fix) – der Live-Blog wird sofort korrekt
      #   • Titel-Verstoß   → deterministische Fixes (check_titles --fix);
      #     R5 (unvollständig) → publish_gate verworfen (neu) bzw.
      #     zurückgestuft (Re-Queue)
      #   • Cover-Mängel    → Varianten/Stale/Brand/Text neu gerendert
      #     (check_covers.py --fix)
      # So kann ein Verstoß NIEMALS live gehen – egal welcher Pfad
      # (manueller Commit, publish.py, Bot, …) ihn in main gebracht hat.
      # Die Heilungen werden gepusht (konvergent: der ausgelöste
      # Folge-Deploy findet einen sauberen Zustand und pusht nichts mehr).
      - name: Py-Abhängigkeiten für Gate-Chain
        run: python3 -m pip install -q pyyaml pillow pillow-avif-plugin 2>/dev/null || python3 -m pip install -q --break-system-packages pyyaml pillow pillow-avif-plugin

      # ---------------------------------------------------------------
      # PRODUKTIONSWACHE DESIGN-VARIANTEN (26.09.2026)
      # Muss VOR dem Build stehen: Sie beantwortet die Frage, ob die in
      # hugo.toml aktivierte Design-Variante überhaupt ausgeliefert
      # werden darf – freigegeben, unterschrieben, deckungsgleich mit
      # dem Register (data/design/varianten.yaml).
      # Ohne Variante (Normalfall) ist der Schritt eine Nulloperation.
      # Fail-closed: Ein Verstoß bricht den Deploy ab, statt ein
      # unfreigegebenes Design live zu stellen.
      # Runbook: docs/ANLEITUNG-DESIGN-VARIANTEN.md
      # ---------------------------------------------------------------
      - name: Design-Varianten – Produktionswache (fail-closed)
        run: python3 scripts/design_variant_gate.py --produktionswache

      # Die alte R9-Bestandsprüfung war nur ein Report (Exit 0), neue
      # Artikel-Gates übersprangen _index.md. Navigation immer hart prüfen.
      - name: Themenwelten – Quellvertrag (sechs Themen, saubere Texte)
        run: python3 scripts/themenwelten_guard.py --source-only

      # Produktvertrag: Der Fixkosten-Kompass ist die übergeordnete Methode;
      # das Cockpit darf weder zum bloßen Link noch zu einem Daten-Sink werden.
      - name: Fixkosten-Kompass – Quell- und Datenschutzvertrag
        run: |
          python3 scripts/fixkosten_kompass_guard.py --selftest
          python3 scripts/fixkosten_kompass_guard.py --source-only

      # Produktvertrag: Die acht Werkzeuge unter /werkzeuge/ sind nur dann
      # ein Vorsprung, wenn sie vollständig ohne Affiliate-Klick nutzbar
      # bleiben, lokal rechnen und ihre Formeln offenlegen. Diese Zusagen
      # sind unsichtbar – ohne Wache verschwinden sie beim nächsten Umbau.
      - name: Werkzeuge – Quell- und Datenschutzvertrag
        run: |
          python3 scripts/werkzeuge_gate.py --selftest
          python3 scripts/werkzeuge_gate.py --source-only

      # ===== ROBUSTHEITS-WACHE (Vertrag C31, 07.10.2026) ==================
      # Kernbefund: Die lauten Fehler fangen die Gates oben (Build, Kadenz,
      # Cover, H1). Die stillen nicht – ein Rechner, der beim Starten stirbt
      # und einen toten Knopf hinterlässt, ein Anmeldeformular, das
      # unbegrenzt auf einen hängenden Worker wartet, ein Service Worker,
      # dessen Cache-Fehler einen Request verschluckt. Die Seite BAUT in
      # allen vier Fällen, also sah sie keine Wache.
      # Diese Prüfung läuft VOR dem Build gegen die Quelle (ohne Hugo, < 1 s)
      # und fail-closed: Ein fehlendes Fangnetz stoppt den Deploy, statt
      # still auszuliefern. Der Selbsttest läuft zuerst – eine sabotierte
      # Prüflogik darf kein grünes Gate liefern.
      # Runbook: docs/ANLEITUNG-ROBUSTHEIT.md
      - name: Robustheit – Laufzeit-Fangnetze (fail-closed)
        run: |
          python3 scripts/robustheits_gate.py --selftest
          python3 scripts/robustheits_gate.py --source-only --strict

      # ===== H1-WACHE (Dauerheilung #623, 07.10.2026) ======================
      # Kernbefund: /presse/ und /studien/ trugen ZWEI H1 – das Layout
      # setzt die H1 aus dem Titel, das Markdown-Dokument lieferte eine
      # zweite `# …`-Zeile dazu. Screenreader und Inhaltsverzeichnis
      # verloren die Gliederung (WCAG 1.3.1). Die dritte Doppel-H1
      # (/studien/fixkosten-index-2026-q4/) stand im selben Build und
      # blieb UNSICHTBAR, weil das wöchentliche Audit nur 20 von 107
      # Seiten stichprobenartig prüfte.
      # Diese Wache läuft deshalb ZWEIMAL: hier als Quellprüfung VOR dem
      # Build (billig, ohne Hugo), nach dem Build als Prüfung der
      # gebauten Wahrheit (jede Seite: genau eine nicht-leere H1).
      # Sie heilt nie selbst – eine H1 zu löschen hieße, einen
      # redaktionellen Satz zu vernichten. Der Befund nennt Datei, Zeile
      # und den Handgriff (`heading:` ins Frontmatter).
      - name: H1-Wache – Quell- und Layoutvertrag (genau eine H1)
        run: |
          python3 scripts/h1_wache.py --selftest
          python3 -m unittest scripts.tests.test_h1_wache scripts.tests.test_a11y_audit
          python3 scripts/h1_wache.py --source-only

      # ===== URL-HYGIENE-GATE (PREMIUM-FIX 03.09.2026) =====================
      # Kernbefund Mi 02.09.2026: Ein fertiger Artikel wurde wegen einer
      # Markdown-URL mit Leerzeichen (R8-URL-LEERZEICHEN, „…-zu Hause/“
      # statt „…-zuhause/“) am Publish-Gate gestoppt und der Tag blieb mit
      # 1 statt 2–3 Artikeln. Dieses deterministische Gate heilt die Klasse
      # VOR dem Publish-Gate: (1) Leerzeichen-URLs werden gegen die echten
      # Post-Slugs aufgelöst, (2) ausschließlich dadurch blockierte
      # „hold“-Posts werden nachweislich in die Re-Queue gelegt – die
      # Promotion entscheidet weiter allein cadence_guard. Danach kann
      # R8-URL-LEERZEICHEN keinen Kandidaten mehr dauerhaft blockieren.
      - name: URL-Hygiene-Selbsttest (Heiler muss lauffähig sein)
        run: python3 scripts/fix_url_hygiene.py --selftest

      - name: URL-Hygiene-Gate (Leerzeichen-URLs selbstheilend)
        run: python3 scripts/fix_url_hygiene.py --fix || echo "⚠ URL-Hygiene – Restfunde siehe Log"

      - name: URL-Hygiene – deterministisch heilbare holds entblocken
        run: python3 scripts/fix_url_hygiene.py --heal-holds

      # HOLD-SELBSTHEILUNG (PREMIUM-FIX 25.09.2026, „stale Hold → 404“): Die
      # Gates in diesem Deploy heilen Content (Titel, Cover, Länge …), aber ein
      # früher gesetzter Hold (z. B. „publish-gate: Zeichenlänge nicht
      # bestanden“) blieb danach als draft:true liegen – die URL lieferte 404,
      # obwohl der Artikel längst alle Gates bestand. Niemand rearmte den Hold:
      # publish_gate prüft nur Kandidaten des HEUTIGEN Datums, check_length
      # überspringt Entwürfe. Dieser Schritt bewertet heilbare Holds neu und
      # legt reife Artikel in die Re-Queue (die Promotion entscheidet weiter
      # allein cadence_guard beim nächsten Slot – kein Direkt-Publish aus dem
      # Deploy).
      - name: Hold-Selbsttest (reife Holds erkennen, sonst kein Build)
        run: python3 scripts/requeue_quality_holds.py --selftest

      - name: Hold-Requeue (geheilte Holds → Re-Queue, kein Direkt-Publish)
        run: python3 scripts/requeue_quality_holds.py --fix || echo "⚠ Hold-Requeue – Funde im Log"

      - name: Kadenz-Selbsttest (Gate muss lauffähig sein, sonst kein Build)
        run: python3 scripts/cadence_guard.py --selftest

      - name: Kadenz-Gate (Mo/Mi/Fr, 2–3/Tag – heilt Verstöße, Report)
        run: python3 scripts/cadence_guard.py --fix

      - name: Titel-Gate (R1–R5, inkl. Truncation-Wächter, selbstheilend)
        run: python3 scripts/check_titles.py --fix || echo "⚠ Titel-Gate – Funde im Log (R5 heilt nicht automatisch, publish_gate greift)"

      - name: Cover-Gate (Varianten, Stale, Brand, C4 Text-Komplettheit – selbstheilend)
        run: python3 scripts/check_covers.py --fix || echo "⚠ Cover-Gate – Funde im Log"

      - name: Keyword-Gate (Premium #303 – Titel/Description/First-Para/H2/Dichte – selbstheilend)
        run: |
          python3 scripts/keyword_optimizer.py --selftest
          python3 scripts/keyword_optimizer.py --fix || echo "⚠ Keyword-Gate – Funde im Log (selbstgeheilt)"
          python3 scripts/keyword_gate.py --selftest
          python3 scripts/keyword_gate.py --fix || echo "⚠ Keyword-Gate (Premium) – Funde im Log (selbstgeheilt)"

      # ================= DRAFT-LINK-GATE (PREM-AUDIT 26.08.2026) =================
      # Kadenz-Heilung stuft Posts auf draft (Re-Queue) zurück – ihre URLs
      # verschwinden aus dem Build, kontextuelle Links in live Artikeln
      # wären dann LIVE defekt (Issue #85: 19 tote Links). Der Heiler
      # entlinkt solche Ziele BEVOR dem Build (Ankertext bleibt 1:1,
      # idempotent). Safety-Net für jeden Pfad (manueller Commit, Bot, …).
      - name: Draft-Link-Selbsttest (Gate muss lauffähig sein)
        run: python3 scripts/draft_link_healer.py --selftest

      - name: Draft-Link-Gate (defekte Post-Ziele entlinken, Report)
        run: python3 scripts/draft_link_healer.py --fix

      # ================= FM-GRENZEN-GATE (Befund 11.09.2026) =================
      # Der Deploy starb drei Läufe in Folge nach Sekunden im Build-Schritt:
      # eine pin_description begann unquotiert mit dem UWG-Prefix
      # „*Werbung | …“ – in YAML startet „*“ einen ALIAS, Hugo verliert das
      # Frontmatter und `hugo --minify` bricht ab (Exit 1). Fatal daran ist
      # die WIRKUNG: Frontmatter-Fehler stoppen den ganzen Build, also auch
      # Spam-Gate, Publish-Gate, Anker-Wache, Vorlesen UND den Publish –
      # ohne Report, ohne verwertbares Alert, nur ein toter Deploy.
      # Die Wache prüft den FM-BLOCK so wie Hugo (Grenzen + YAML-Parse) und
      # heilt ausschließlich die Wert-Ebene (Quote) – nachweislich konvergent
      # und ohne Schema-Eingriff (eine Liste darf nie zum String werden).
      - name: FM-Grenzen-Selbsttest (Wache muss lauffähig sein, sonst kein Build)
        run: python3 scripts/fm_boundary_guard.py --selftest

      - name: FM-Gate (Frontmatter-Grenzen – selbstheilend, VOR dem Build)
        run: python3 scripts/fm_boundary_guard.py --fix

      # ================= TAXONOMIE-WACHE (Index-Hygiene, 29.09.2026) =================
      # Befund: Die Search Console meldete 237 nicht indexierte Seiten. Ursache war
      # die Tag-Automatik der Content-Engine (`tags = keywords[:4]`): Keywords sind
      # long-tail und pro Artikel einmalig, also entstand mit JEDEM Artikel ein
      # neues Thin-Archiv. Nach 63 Artikeln: 217 Roh-Tags → 147 Tag-Archive, 193
      # davon mit genau einem Artikel, dazu 147 /page/1/-Weiterleitungen.
      # Die Wache läuft VOR dem Build, weil sie Frontmatter normalisiert
      # (Synonym → kanonischer Tag aus data/seo/tag_register.yaml).
      - name: Taxonomie-Selbsttest (Wache muss lauffähig sein)
        run: python3 scripts/tag_governance.py --selftest

      - name: Taxonomie-Gate (Tags kanonisieren – selbstheilend, VOR dem Build)
        run: python3 scripts/tag_governance.py --apply

      - name: Hugo installieren (Extended, verifiziert, mehrquellig)
        uses: ./.github/actions/install-hugo
        with:
          version: "0.164.0"

      - name: Build (für Publish-Gate + Publish)
        uses: ./.github/actions/hugo-build
        with:
          args: "--minify"
          label: "Produktions-Build (Publish-Gate)"

      # Zweiter Teil der H1-Wache (#623): die GEBAUTE Wahrheit. Die
      # Quellprüfung oben sieht nur Markdown und Templates – hier zählt
      # jede gerenderte Seite (ALLE, keine Stichprobe). Genau die
      # Stichprobe von 20 aus 107 Seiten hatte die dritte Doppel-H1 des
      # Befundtages verdeckt; deshalb ist dieser Schritt hart.
      - name: H1-Wache – gebaute Seiten (jede Seite genau eine H1)
        run: |
          set +e
          # Protokoll in $RUNNER_TEMP, nicht ins Repo: Maschinen-Artefakte
          # gehören nicht in den Baum (Hausregel seit #346, 22.09.2026).
          protokoll="${RUNNER_TEMP:-/tmp}/h1wache.log"
          python3 scripts/h1_wache.py --public public | tee "$protokoll"
          wache_status=${PIPESTATUS[0]}
          {
            echo "### H1-Wache (genau eine H1 pro Seite)"
            echo '```'
            sed -n '1,60p' "$protokoll"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$wache_status" -ne 0 ]; then
            echo "::error title=H1-Wache::Doppelte oder fehlende H1 im Build – Gliederung für Screenreader und Inhaltsverzeichnis beschädigt"
          fi
          exit "$wache_status"

      # ================= INDEX-HYGIENE (Crawl-Fläche, 29.09.2026) =================
      # Die bestehenden Wachen prüfen jede Seite EINZELN und korrekt
      # (schema_seo_gate S6: „Archive tragen noindex" war die ganze Zeit grün).
      # Niemand prüfte die MENGE der gebauten URLs – genau dort lag der Defekt.
      # Diese Wache misst die Crawl-Fläche des fertigen Builds gegen ein Budget:
      # /page/1/-Aliase, Tag-Archive, Kategorie-Archive, Sitemap-Deckung und das
      # Verhältnis indexierbar : nicht indexierbar. Läuft NACH dem Build, weil
      # sie public/ auswertet. Das Gate ist bewusst hart: Ein neuer URL-Leak
      # darf nicht erst nach Wochen in der Search Console auffallen. Die
      # Zusammenfassung wird auch bei Exit 1 geschrieben, danach stoppt der
      # Deploy vor dem Publish.
      - name: Index-Hygiene-Selbsttest (Wache muss lauffähig sein)
        run: python3 scripts/index_hygiene_gate.py --selftest

      - name: Index-Hygiene-Gate (Crawl-Fläche gegen Budget)
        run: |
          set +e
          python3 scripts/index_hygiene_gate.py | tee indexhygiene.log
          gate_status=${PIPESTATUS[0]}
          {
            echo "### Index-Hygiene (Crawl-Fläche)"
            echo '```'
            sed -n '1,80p' indexhygiene.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$gate_status" -ne 0 ]; then
            echo "::error title=Index-Hygiene::Crawl-Fläche über Budget – Deploy wird zum Schutz vor neuen GSC-URLs gestoppt"
          fi
          exit "$gate_status"

      # ================= SPAM-WACHE (Google + Pinterest, 26.08.2026) =================
      # Dauerauftrag: Blog, RSS-Feed (/index.xml = Quelle des Pinterest-
      # Auto-Publish), CSV-Upload und Pinterest-API spamfrei halten.
      # --fix heilt SOFORT (Blog: Disclosure/Pin-Kennzeichnung einfügen oder
      # Spam-Artikel auf draft, Feed: Spezial-Heiler; CSV: Neu-Schreibung;
      # API: Rate-Zustand). Niemals Content-Verlust. Heilungen + Report
      # landen über das Gate-Heilungsdiff automatisch im Repo.
      - name: Spam-Selftest (Wache muss lauffähig sein)
        run: python3 scripts/spam_guard.py --selftest

      - name: Spam-Gate (Blog, RSS-Feed, CSV, API – selbstheilend)
        run: python3 scripts/spam_guard.py --check blog feed csv api --fix || echo "⚠ Spam-Gate – Funde in SPAM-REPORT.md (selbstgeheilt, kein Content-Verlust)"

      # Faktenfrische ist eine Veröffentlichungs-Voraussetzung, nicht nur
      # ein nachgelagerter Report: Der Collector wird im Publish-Gate und in
      # der Release-Scorecard gemeinsam genutzt (WF-54C4/#583).
      - name: Faktenfrische-Selbsttest (Recherchevertrag vor Veröffentlichung)
        run: python3 scripts/faktenfrische.py --selftest

      - name: Publish-Gate (harte Qualitäts-, Affiliate-, Fakten- und YMYL-Freigaben)
        run: python3 scripts/publish_gate.py

      # ================= QUOTE-NACHFÜLLUNG NACH GATE-VERLUST (#287) =========
      # Kernbefund Mo 14.09.2026: publish_gate verwarf den neuen Tages-Artikel
      # (FM-Korruption „---TITEL:“) und ließ nur 1 LIVE-Post stehen. Die
      # Endkontrolle füllt die Quote – aber Deploy tat es nicht. Bis zum
      # nächsten Backstop (Stunden später) blieb die öffentliche Auslieferung
      # unter dem Mindestziel. Ab sofort: nach JEDEM Gate-Lauf deterministisch
      # Re-Queue + Reserve bis LIVE-Minimum nachschieben (ohne KI, fail-closed
      # pro Kandidat). Commit/Rebuild übernimmt der bestehende Gate-Diff-Pfad.
      - name: Quote-Nachfüllung nach Gate-Verlust (Re-Queue + Reserve → Min)
        run: |
          python3 scripts/publication_release.py --selftest
          python3 scripts/publication_release.py --refill-only

      # Bestands-Sicherheitsnetz: publish_gate prüft Kandidaten des heutigen
      # Slots. Diese zweite Wache prüft ALLE tatsächlich veröffentlichten
      # Artikel, damit auch ein manueller draft:false-Flip bei einem alten
      # YMYL-Text oder veralteten Artikelstand niemals ins Deploy gelangt.
      - name: YMYL-Bestand – nur fachlich freigegebene Live-Artikel
        run: python3 scripts/editorial_review_gate.py --published --strict

      - name: Gate-Heilungsdiff merken (alle Gates, inkl. Publish-Gate)
        id: gate_diff
        run: |
          if git status --short | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Gate hat den Bestand geheilt – Commit + Rebuild folgen."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate-Heilungen committen (konvergent)
        run: |
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Gate: keine Heilungen nötig."
          else
            git commit -m "fix(gate): Kadenz-/Titel-/Cover-Heilungen vor Veröffentlichung (automatisch)"
            # Publish-Priorität: nur State-Persistenz ist best effort. Build und
            # Inhalts-Gates bleiben hart; kein always()/continue-on-error am Deploy.
            if scripts/git_sync.sh --push-only; then
              echo "✅ Gate-Heilungen gepusht – Folge-Deploy prüft erneut (konvergent)."
            else
              echo "::error::Gate-Heilungen: State-Push abgelehnt/fehlgeschlagen; gh-pages-Deploy läuft nach den Inhalts-Gates trotzdem. Reparatur: docs/PFLICHT-CHECK-RUNBOOK.md"
            fi
          fi

      - name: Rebuild nach Heilungen (nur wenn sich Content geändert hat)
        if: steps.gate_diff.outputs.changed == 'true'
        uses: ./.github/actions/hugo-build
        with:
          args: "--minify"
          label: "Rebuild nach Gate-Heilungen"

      # NACH ALLEN Content-Heilungen und dem letzten Rebuild: prüft genau
      # das auszuliefernde HTML, auch /posts/page/2/, Links und Live-Zähler.
      # Kein || true / continue-on-error: defekte Navigation geht nicht live.
      - name: Themenwelten – finales Veröffentlichungs-Gate
        run: python3 scripts/themenwelten_guard.py --public public

      - name: Fixkosten-Kompass – finales Produkt-Gate
        run: python3 scripts/fixkosten_kompass_guard.py --public public

      # Prüft das auszuliefernde HTML: Versprechen wörtlich auf jeder
      # Werkzeugseite, kein Partnerlink, kein Formularziel, Methodik sichtbar.
      - name: Werkzeuge – finales Produkt-Gate
        run: python3 scripts/werkzeuge_gate.py --public public

      # ============ VERGLEICHS-GATE (Audit-Befund 8, 03.10.2026) ============
      # „So entstehen unsere Vergleiche" ist kein Text, sondern ein Vertrag:
      # Jede /go/-Route steht im öffentlichen Routen-Register, Einzelangebote
      # tragen den ehrlichen Zieltyp (nie „Marktvergleich"), die Provisions-
      # Antwort bleibt wörtlich „Nein", K.-o./Rangfolge spiegeln die
      # versionierte Methodik, und Footer/Transparenz/Methodik verlinken das
      # Raster. Selbsttest zuerst – eine sabotierte Wache darf kein grünes
      # Gate liefern. Kein || true: ein unwahres Raster geht nicht live.
      - name: Vergleichs-Selbsttest (Wache muss lauffähig sein)
        run: python3 scripts/vergleichsgrundsaetze_gate.py --selftest

      - name: Vergleichsgrundsätze – finales Transparenz-Gate
        run: python3 scripts/vergleichsgrundsaetze_gate.py --public public

      # ================= ANKER-WACHE (Befund 10.09.2026) =================
      # Der Abschnitts-Knopf „Link kopieren“ trug ein „§“ als TEXT in
      # JEDER Überschrift. Kurzfassung („In diesem Artikel“), Tabellen-
      # Titel, Klartext-Kopie, Mini-Verzeichnis, die Vorlese-Engine,
      # Screenreader (Überschriften-Name) und Suchmaschinen lasen es mit.
      # Die Wache prüft die QUELLE und die gerade gebauten Seiten in
      # public/ – ein Fund stoppt den Deploy. Der Selbsttest sichert die
      # Bau-Prüfung selbst (Befund 13:44: sie flaggte zunächst den
      # legitimen, versteckten Theme-Anker auf jeder Seite).
      - name: Anker-Wache – Selbsttest (Bau-Prüfung lauffähig)
        run: python3 scripts/heading_anchor_guard.py --selftest

      - name: Anker-Wache (kein § in Überschriften, Kurzfassung & Vorlesen)
        run: python3 scripts/heading_anchor_guard.py

      # ============ RELEASE-SCORECARD (Befund 10, 03.10.2026) ============
      # Die EINE sichtbare Produktionswahrheit, NACH allen Content-Gates
      # und VOR der Auslieferung: Acht Dimensionen pro Artikel (Technik,
      # Quellen, Faktenalter, Affiliate-Integrität, Redundanz, YMYL-Risiko,
      # menschliche Freigabe, nächste Überprüfung), gemessen über DIESELBEN
      # Collector-Funktionen wie das Publish-Gate – als Beweislauf ohne
      # Heilung. Deckt sich die Scorecard nicht mit dem Publish-Gate, ist
      # das ein Scheingrün-Befund und der Deploy stoppt (fail-closed).
      # Sie versiegelt den kompletten Live-Bestand (SHA-256 je Artikel +
      # Dimensionen + Deploy-Commit) – der Nachweis, dass die veröffentlichte
      # Version wirklich die geprüfte ist. Exit-Vertrag: 0 = ok ·
      # 1 = heutige Kandidaten blockiert · 2 = Werkzeugfehler (fail-closed).
      #
      # DAUERHEILUNG #676 (10.10.2026) – „Auslieferung vor Siegel":
      # Bis hierher galt pauschal „kein continue-on-error". Für Exit 1 ist
      # das richtig, für Exit 2 war es fatal: Als die Scorecard am
      # 09.10.2026 wegen einer eigenen, vom Publish-Gate abweichenden
      # Redundanz-Messung 20× in Folge rot lief (02:12–17:43 UTC), sprangen
      # die Schritte 50–60 samt „Artefakt für offizielles Pages-Deployment
      # hochladen" – 19 h 38 min ging öffentlich nichts raus, und der um
      # 14:02 UTC veröffentlichte Artikel blieb 4 h 11 min 404 (#676). Ein kaputtes
      # Messwerkzeug ist aber kein Inhaltsbefund. Deshalb wird der Exit-Code
      # jetzt AUSGEWERTET statt nur durchgereicht:
      #   · 0 → Siegel steht, weiter.
      #   · 1 → echter Inhaltsbefund: harter Stopp, nichts geht live
      #         (unverändert fail-closed).
      #   · 2 und jeder andere → WERKZEUGFEHLER: Die Auslieferung läuft
      #         weiter, der Lauf wird NACH der Veröffentlichung im Job
      #         `release-seal` rot. Der Befund bleibt laut und sichtbar –
      #         er nimmt nur nicht mehr die Live-Site als Geisel.
      # Runbook: docs/ANLEITUNG-RELEASE-SCORECARD.md
      - name: Release-Scorecard (Produktionswahrheit versiegeln, fail-closed)
        id: scorecard
        run: |
          set +e
          python3 scripts/release_scorecard.py --kandidaten --commit-sha "$GITHUB_SHA"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0)
              echo "✅ Release-Scorecard: Live-Bestand versiegelt."
              echo "werkzeugfehler=false" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "🛑 Release-Scorecard blockiert die heutigen Kandidaten – nichts geht live (fail-closed)."
              echo "werkzeugfehler=false" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
            *)
              echo "::error::Release-Scorecard meldet WERKZEUGFEHLER (Exit $code). Die Auslieferung läuft bewusst weiter; der Lauf wird nach der Veröffentlichung rot (Job release-seal, Dauerheilung #676)."
              echo "werkzeugfehler=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # Scorecard-Artefakte sichern (Report + Siegel-Zustand + Historie).
      # Alle drei Pfade sind deploy-irrelevant (STATE_ONLY im Deploy-Gate):
      # Der Commit löst keinen Folge-Deploy aus. State-Push ist best effort –
      # die Inhalts-Gates und die Auslieferung bleiben davon unberührt.
      - name: Release-Scorecard committen (Report, Siegel, Historie)
        run: |
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -- RELEASE-SCORECARD.md data/release_scorecard_state.json data/release_scorecard_history.jsonl
          if git diff --cached --quiet; then
            echo "Scorecard: keine Änderungen zu committen."
          else
            git commit -m "chore(scorecard): Release-Scorecard aktualisiert + Live-Bestand versiegelt [skip ci]"
            if scripts/git_sync.sh --push-only; then
              echo "✅ Release-Scorecard gepusht."
            else
              echo "::warning::Scorecard-Push fehlgeschlagen – Siegel liegt im Lauf-Log; nächster Lauf versiegelt erneut."
            fi
          fi

      # ================= VORLESE-AUDIO (FF Voice Studio, 05.09.2026) ========
      # Vorab vertonte Artikel mit einem MÄNNLICHEN DEUTSCHEN
      # NACHRICHTENSPRECHER – wie bei zeit.de. Die Tonspur (MP3) läuft über
      # das native HTML5-<audio>-Element und klingt damit IDENTISCH auf
      # iPhone, Mac, Tablet, Android, PC und in jedem Browser, unabhängig
      # von den Stimmen des Betriebssystems. NUR-DEUTSCH-VERTRAG
      # (Befund 07.09.2026): Die Vorlese-Funktion spricht ausschließlich
      # Deutsch; englische Begriffe liest der Nachrichtensprecher.
      #
      # PREMIUM-KETTE (12.09.2026, ohne Umschalter, männlich DE+EN):
      #   elevenlabs -> ElevenLabs Multilingual v2 (Adam pNInz6obpgDQGcFmaJgB)
      #                 — EINE Stimme für DE+EN, identischer Klang cross-device,
      #                 nur aktiv wenn ELEVENLABS_API_KEY als Secret gesetzt.
      #   edge       -> Microsoft-Edge-Neuralstimmen (Conrad de, Andrew/Brian/Ryan en)
      #                 über das offene Paket edge-tts; Fallback wenn kein Key.
      #   piper      -> lokale ONNX-Stimmen (de_DE-thorsten-high, en …),
      #                 offline, unbegrenzt, lizenzsauber; letzter Fallback.
      #   Ohne ELEVENLABS_API_KEY ist die Kette automatisch edge→piper
      #   (kostenlos, ohne Abo). GROQ_API_KEY wird für Tonspuren nicht mehr gelesen.
      #
      # Robustheit: (1) Ohne verfügbares Backend wird keine Tonspur
      # geschrieben; der Reader bleibt automatisch auf der lokalen
      # Browserstimme - der Deploy bricht NIEMALS wegen der Tonspur ab.
      # (2) Inkrementell: unveränderte Artikel werden per Inhalts-Fingerprint
      # (inkl. Backend, Stimme und Rezept-Version) aus dem letzten
      # gh-pages-Stand wiederverwendet. (3) --limit-new begrenzt die
      # Neuvertonung je Lauf.
      - name: Vorlese-Audio-Selbsttests (Generator + Stimmen-Kette + Parität)
        run: |
          python3 scripts/ff_voice_audio.py --selftest || echo "⚠ Generator-Selftest – Funde im Log (kein Deploy-Stopp)"
          python3 scripts/ff_voice_backends.py --selftest || echo "⚠ Backends-Selftest – Funde im Log (kein Deploy-Stopp)"
          python3 scripts/ff_voice_parity_check.py || echo "⚠ Paritäts-Gate – Funde im Log (kein Deploy-Stopp)"

      - name: TTS-Backend installieren (Dekoder, edge-tts, optional piper-tts)
        run: |
          # ---- DEKODER ZUERST ---------------------------------------
          # Befund 07.09.2026: edge-tts liefert einen MP3-Strom. Ohne
          # Dekoder wurde daraus eine unlesbare .wav – jedes Segment fiel
          # aus, veröffentlicht wurde reine Digitalstille. ffmpeg (bzw.
          # miniaudio als Reserve) ist daher KEIN Komfort, sondern die
          # Voraussetzung für hörbaren Ton.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq \
              && sudo apt-get install -y -qq ffmpeg \
              || echo "⚠ ffmpeg nicht installierbar → miniaudio muss greifen"
          fi
          python3 -m pip install -q miniaudio 2>/dev/null \
            || python3 -m pip install -q --break-system-packages miniaudio \
            || echo "⚠ miniaudio nicht installierbar (ffmpeg bleibt Hauptweg)"
          # edge-tts: kostenlos, kein Key, männliche Neuralstimmen DE/EN.
          python3 -m pip install -q edge-tts 2>/dev/null \
            || python3 -m pip install -q --break-system-packages edge-tts \
            || echo "⚠ edge-tts nicht installierbar → Piper/Browser-Fallback"
          # piper-tts: lokale Offline-Stimmen als lizenzsichere zweite Stufe.
          python3 -m pip install -q piper-tts 2>/dev/null \
            || python3 -m pip install -q --break-system-packages piper-tts \
            || echo "⚠ piper-tts nicht installierbar → edge/Browser-Fallback"
          ffmpeg -version | head -1 || echo "⚠ ffmpeg fehlt → nur WAV ohne Mastering"
          # Zeigt Engines, Rezept-Version UND den gefundenen Dekoder an.
          python3 scripts/ff_voice_audio.py --engines || true

      - name: Kostensperre belegen (vor jeder Geldflaeche)
        # WARUM VOR DER VERTONUNG (03.10.2026)
        # Dieser Job reicht ELEVENLABS_API_KEY durch. Frueher genuegte
        # ein gesetztes Secret, damit kostenpflichtig vertont wird – ein
        # vergessenes Secret waere eine monatliche Rechnung ohne
        # Fehlermeldung gewesen. Jetzt entscheidet data/kostensperre.yaml,
        # und dieser Schritt beweist, dass der Riegel verdrahtet ist,
        # BEVOR der teure Schritt laeuft. Fail-closed: Exit 1 stoppt.
        run: python3 scripts/kostensperre.py --pruefen

      - name: Vorlese-Tonspuren erzeugen (männlich, DE+EN ohne Umschalter – ElevenLabs Premium, kostenloser Fallback)
        # WANDUHR FÜR DEN SCHLIMMSTEN FALL (Härtung 10.09.2026):
        # Normal braucht dieser Schritt Budget (20 Min., Backfill 90)
        # plus Anlauf/Überlauf (Cache-Fetch, ein Segment-Überhang von
        # höchstens ~12 Min.). 120 Min. decken beides mit Reserve ab.
        # Bleibt der Schritt DENNOCH hängen (unvorhergesehener Hänger
        # außerhalb der gedeckelten Synthese), stirbt der Deploy NICHT
        # erst an der Job-Wanduhr (150 Min.): continue-on-error lässt
        # ihn mit Cache- + Browser-Fallback weiterlaufen, die
        # Nachmessung (--heal) räumt Teilausgaben weg. Ton darf den
        # Livegang verzögern, aber nie verhindern.
        timeout-minutes: 120
        continue-on-error: true
        env:
          # Das Secret wird weiter durchgereicht – aber es allein kann
          # nichts mehr ausloesen. Der Schreibschutz in
          # data/kostensperre.yaml entscheidet (Schritt davor belegt es).
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          mkdir -p /tmp/ff-voice-cache
          # Vorherige Tonspuren vom letzten Deploy holen (inkrementell).
          # `+` erzwingt das Update: seit dem force_orphan-Fix (Issue #179)
          # ist gh-pages ein einzelner Orphan-Commit und damit KEIN
          # Fast-Forward mehr – ohne `+` würde dieser Fetch stets scheitern
          # und der Audio-Cache jeden Lauf neu vertonen.
          if git fetch --quiet origin +gh-pages:refs/remotes/origin/gh-pages 2>/dev/null; then
            git restore --source=origin/gh-pages -- audio/articles 2>/dev/null || true
            if [ -d audio/articles ]; then
              cp -r audio/articles/. /tmp/ff-voice-cache/ 2>/dev/null || true
              rm -rf audio
            fi
          fi
          AUDIO_BACKEND="${{ github.event.inputs.audio_backend || 'auto' }}"
          AUDIO_PROFILE="${{ github.event.inputs.audio_profile || 'news' }}"
          AUDIO_ORDER="${{ github.event.inputs.audio_order || 'newest' }}"
          AUDIO_LIMIT_NEW="${{ github.event.inputs.audio_limit_new || '25' }}"
          case "$AUDIO_LIMIT_NEW" in
            ''|*[!0-9]*) AUDIO_LIMIT_NEW=25 ;;
          esac
          if [ "${{ github.event.inputs.audio_backfill }}" = "true" ]; then
            LIMIT_NEW=0
          else
            LIMIT_NEW="$AUDIO_LIMIT_NEW"
          fi

          # ---- ZEITBUDGET (Reparatur Issue #218, 08.09.2026) -------------
          # Messung an echten Laeufen: Dieser eine Schritt brauchte 63 min
          # (Run 34129128450) bzw. 151 min (Run 34121113112), waehrend der
          # KOMPLETTE Rest des Deploys – Checkout, alle Gates, Hugo-Build
          # und gh-pages-Push – zusammen nur rund 90 Sekunden dauert. Die
          # Vertonung stellte also 97-99 % der Laufzeit und hat die
          # Deploy-Warteschlange dauerhaft verstopft; wartende Laeufe
          # wurden verdraengt (`cancelled`) und der Livegang verzoegerte
          # sich um Stunden.
          #
          # Die Stueckgrenze --limit-new konnte das nicht verhindern, weil
          # die Dauer je Artikel stark schwankt. --max-seconds ist die
          # fehlende Wanduhr: Sie deckelt NUR die Neusynthese. Fertige
          # Spuren bleiben, alle uebrigen Artikel behalten ihre Spur aus
          # dem Cache, und der naechste Lauf setzt die Warteschlange genau
          # dort fort (konvergent, kein Verlust).
          AUDIO_MAX_MINUTES="${{ github.event.inputs.audio_max_minutes || '' }}"
          case "$AUDIO_MAX_MINUTES" in
            ''|*[!0-9]*) AUDIO_MAX_MINUTES=0 ;;
          esac
          if [ "$AUDIO_MAX_MINUTES" -eq 0 ]; then
            # Automatik: Ein bewusst angestossener Backfill darf laenger
            # arbeiten, der normale Push-Deploy bleibt schnell.
            if [ "${{ github.event.inputs.audio_backfill }}" = "true" ]; then
              AUDIO_MAX_MINUTES=90
            else
              AUDIO_MAX_MINUTES=20
            fi
          fi
          MAX_SECONDS=$(( AUDIO_MAX_MINUTES * 60 ))

          echo "🔧 Tonspuren: backend=$AUDIO_BACKEND profile=$AUDIO_PROFILE order=$AUDIO_ORDER limit_new=$LIMIT_NEW budget=${AUDIO_MAX_MINUTES}min"
          python3 scripts/ff_voice_audio.py \
            --html-dir public \
            --out-dir public/audio/articles \
            --cache-dir /tmp/ff-voice-cache \
            --backend "$AUDIO_BACKEND" \
            --profile "$AUDIO_PROFILE" \
            --order "$AUDIO_ORDER" \
            --limit-new "$LIMIT_NEW" \
            --max-seconds "$MAX_SECONDS" \
            || echo "⚠ Vorlese-Tonspuren unvollständig – Deploy läuft weiter (Browser-Fallback aktiv)"
          echo "✅ Vorlese-Audio-Schritt abgeschlossen."

      # Endkontrolle VOR der Veröffentlichung: Jede Tonspur wird gemessen
      # (Pegel, hörbarer Anteil, Laufzeit) und ihre Chunk-Karte gegen den
      # Artikeltext geprüft. Wer durchfällt, verliert Datei und
      # Konfigurationsblock (--heal) – dann liest die Gerätestimme vor.
      # Lieber ehrliche Browserstimme als eine stumme Studiospur.
      - name: Tonspuren nachmessen und stumme Spuren entfernen
        run: |
          python3 scripts/ff_voice_audio.py --verify --heal \
            --html-dir public \
            --out-dir public/audio/articles \
            || echo "⚠ Nachmessung mit Funden – Deploy läuft weiter"
          # Zweiter Durchgang rein zur Protokollierung: Danach darf nichts
          # Beanstandetes mehr im Veröffentlichungsstand liegen.
          python3 scripts/ff_voice_audio.py --verify \
            --html-dir public \
            --out-dir public/audio/articles \
            || echo "⚠ Es bleiben beanstandete Spuren – bitte im Log nachsehen"

      # NACHWEIS FÜR DEN AUDIO-BACKFILL (Runbook: docs/AUDIO-BACKFILL-RUNBUCH.md)
      # Wer `audio_backfill=true` auslöst, startet bewusst einen Lauf von bis zu
      # 90 Minuten Vertonung. Die Frage danach ist immer dieselbe: „Hat es was
      # gebracht?" – und die soll sich beantworten lassen, ohne eine Stunde Log
      # zu wälzen. Gemessen wird deshalb zweimal: VORHER aus dem gh-pages-Stand,
      # aus dem der Audio-Cache gefüllt wurde, NACHHER aus dem Build, der gleich
      # veröffentlicht wird. Beide Zahlen landen in der Lauf-Zusammenfassung.
      # Rein berichtend: der Schritt kann den Livegang nicht aufhalten (eine
      # fehlende Studiospur bedeutet Gerätestimme, keinen Ausfall).
      - name: Audio-Abdeckung in die Lauf-Zusammenfassung
        continue-on-error: true
        run: |
          {
            echo "## 🎧 Studio-Tonspuren (Vorlese-Audio)"
            echo ""
            echo "**Vorher** – Stand auf \`gh-pages\` vor diesem Lauf:"
            echo '```'
            python3 scripts/audio_coverage_check.py --ref origin/gh-pages \
              || echo "(kein Vorher-Nachweis: gh-pages nicht erreichbar)"
            echo '```'
            echo ""
            echo "**Nachher** – dieser Build, wird veröffentlicht:"
            echo '```'
            # Ohne Verzeichnis wäre die Ausgabe „0/31“ – das ist keine
            # Aussage über den Bestand, sondern nur ein fehlender Fundort.
            if [ -d public/audio/articles ]; then
              python3 scripts/audio_coverage_check.py --dir public/audio/articles \
                || echo "(nicht messbar)"
            else
              echo "(Vertonungsschritt hat in diesem Lauf kein Audio-Verzeichnis erzeugt)"
            fi
            echo '```'
            echo ""
            echo "_Lücken schließen: Deploy mit \`audio_backfill=true\` erneut auslösen_"
            echo "_(Runbook: \`docs/AUDIO-BACKFILL-RUNBUCH.md\`)._"
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------
      # SUCHE (Pagefind, 08.10.2026): Der Suchindex entsteht aus dem
      # FERTIGEN public/-Stand – nach dem letzten Hugo-Build und vor
      # beiden Veröffentlichungen (gh-pages und Pages-Artefakt). Die
      # Version ist in package.json exakt gepinnt (Lockfile). Fail-
      # closed: fehlt der Index, stoppt der Deploy, statt eine Suche
      # ohne Inhalt auszuliefern. Runbook: docs/ANLEITUNG-SUCHE-PAGEFIND.md
      # ------------------------------------------------------------
      - name: Suchindex bauen (Pagefind)
        run: |
          set -euo pipefail
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npm run --silent suchindex
          test -s public/pagefind/pagefind.js
          test -s public/pagefind/pagefind-entry.json
          echo "Suchindex: $(find public/pagefind -type f | wc -l) Dateien, $(du -sh public/pagefind | cut -f1)"

      - name: Deploy auf gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          # PREMIUM-FIX 06.09.2026 (Issue #179): gh-pages ist ein
          # REGENERIERBARES Build-Artefakt. Ohne force_orphan sammelte
          # sich dort eine 169-Commits-History mit unkomprimierten
          # Vorlese-WAVs (~3,5 GB) an – dadurch sprengte das tägliche
          # Offsite-Backup (`git bundle --all`) die 2-GiB-Release-Grenze
          # und fiel dauerhaft aus. force_orphan hält den Branch bei
          # GENAU EINEM Commit (aktueller Build): keine History-Explosion,
          # der inkrementelle Audio-Cache (Vorlese-Schritt oben) liest
          # weiterhin korrekt aus dem letzten gh-pages-Stand.
          force_orphan: true
          cname: franksfinanzcheck.de

      # ------------------------------------------------------------
      # PREMIUM-FIX 03.10.2026 (Issue #537): Der Push oben hält NUR den
      # `gh-pages`-Branch als Cache/Backup/Audit-Spur aktuell. Die Pages-
      # Konfiguration dieses Repos ist `build_type: workflow` – ausliefern
      # muss daher ein echtes Pages-Deployment (unten, Job
      # "pages-deployment"). `upload-pages-artifact` verpackt denselben
      # bereits fertigen `public/`-Stand (inkl. Vorlese-Audio) als
      # Artefakt für `actions/deploy-pages`.
      # ------------------------------------------------------------
      - name: GitHub Pages konfigurieren (Workflow-Quelle)
        uses: actions/configure-pages@v6

      - name: Artefakt für offizielles Pages-Deployment hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      # ------------------------------------------------------------
      # AUSLIEFERUNGS-BELEG (Dauerheilung #676, 10.10.2026)
      # ------------------------------------------------------------
      # Dieser Schritt läuft NUR, wenn das Artefakt wirklich hochgeladen
      # wurde – er ist damit der maschinenlesbare Beweis „die
      # Veröffentlichung ist raus". Der Job `release-seal` wertet ihn aus:
      # Fehlt der Beleg, obwohl das Deploy-Gate einen Deploy verlangt hat,
      # ist der Lauf rot, OHNE dass dafür ein Inhalts-Gate die Site
      # blockieren musste. So wird ein stiller Auslieferungsausfall
      # (Klasse #537/#676) zum eigenen, benannten Befund.
      # ------------------------------------------------------------
      - name: Auslieferungs-Artefakt bestätigen (Beleg für das Siegel)
        id: artefakt
        run: |
          echo "artefakt_ok=true" >> "$GITHUB_OUTPUT"
          echo "✅ Auslieferungs-Artefakt bestätigt – Veröffentlichung ist unterwegs."

  # ============================================================
  #  OFFIZIELLES PAGES-DEPLOYMENT (Premium-Fix 03.10.2026, Issue #537)
  #  ------------------------------------------------------------
  #  Eigener Job, weil `actions/deploy-pages` an das GitHub-Environment
  #  "github-pages" gebunden ist (eigene Deployment-Historie, eigene
  #  Branch-Policy main/gh-pages, eigene URL-Ausgabe). Ohne diesen Job
  #  bleibt die Live-Site exakt auf dem Stand des letzten Laufs
  #  einstehen, der hier tatsächlich deployt hat – unabhängig davon,
  #  wie viele `deploy`-Jobs danach "success" melden (siehe Befund
  #  oben: eingefroren seit 2026-09-30T13:00 UTC trotz täglich vieler
  #  erfolgreicher `gh-pages`-Pushes).
  # ============================================================
  pages-deployment:
    name: An GitHub Pages ausliefern (Environment github-pages)
    # WICHTIG: `deploy-gate` muss explizit in `needs` stehen, sonst ist
    # `needs.deploy-gate.outputs.deploy` im `if:` unten nicht auswertbar
    # und der Job würde NIE laufen (stiller Deploy-Ausfall, Issue-#537-Klasse).
    needs: [deploy-gate, deploy]
    if: needs.deploy-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deployment auslösen
        id: deployment
        uses: actions/deploy-pages@v5

  # ============================================================
  #  AUSLIEFERUNGS-SIEGEL (Dauerheilung #676, 10.10.2026)
  #  ------------------------------------------------------------
  #  Befund #676: Ein MESS-Schritt (Release-Scorecard) stand vor der
  #  Auslieferung und nahm sie 19 h 38 min lang als Geisel – 20 rote
  #  Läufe in Folge, kein einziger Artikel ging live, der neueste Artikel
  #  blieb 404.
  #
  #  Dieser Job dreht die Reihenfolge um, OHNE das Fail-closed-Prinzip
  #  aufzugeben:
  #    · Er läuft NACH `pages-deployment` und mit `if: always()`, also
  #      auch dann, wenn ein früherer Job rot war.
  #    · Er meldet einen Scorecard-WERKZEUGFEHLER rot – der Lauf bleibt
  #      damit sichtbar fehlerhaft und das zentrale Fehler-Alerting
  #      (`alert-on-failure.yml`) nennt Schritt und Job.
  #    · Er prüft zusätzlich den Auslieferungs-Beleg: War ein Deploy
  #      verlangt, aber kein Artefakt bestätigt, ist das ein eigener
  #      Befund („Auslieferung ausgeblieben"), kein stilles Grün.
  #  Ein Inhaltsbefund (Scorecard Exit 1) erreicht diesen Job gar nicht:
  #  Dort bricht der `deploy`-Job vorher hart ab, es wird kein Artefakt
  #  hochgeladen und `pages-deployment` liefert nichts aus.
  # ============================================================
  release-seal:
    name: Auslieferungs-Siegel (Beweis nach der Veröffentlichung)
    needs: [deploy-gate, deploy, pages-deployment]
    if: always() && needs.deploy-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Siegel auswerten (Auslieferung ist zu diesem Punkt bereits gelaufen)
        env:
          DEPLOY_ERGEBNIS: ${{ needs.deploy.result }}
          PAGES_ERGEBNIS: ${{ needs.pages-deployment.result }}
          ARTEFAKT_OK: ${{ needs.deploy.outputs.artefakt_ok }}
          SCORECARD_EXIT: ${{ needs.deploy.outputs.scorecard_exit }}
          SCORECARD_WERKZEUGFEHLER: ${{ needs.deploy.outputs.scorecard_werkzeugfehler }}
        run: |
          set -uo pipefail
          echo "## 🧾 Auslieferungs-Siegel (#676)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Prüfpunkt | Wert |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| deploy-Job | ${DEPLOY_ERGEBNIS:-unbekannt} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| pages-deployment | ${PAGES_ERGEBNIS:-unbekannt} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Auslieferungs-Artefakt | ${ARTEFAKT_OK:-nicht bestätigt} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release-Scorecard Exit | ${SCORECARD_EXIT:-unbekannt} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Verdrängter Lauf (Issue #218): Ein `cancelled` ist gewolltes
          # Verdrängen durch einen neueren Push – kein Befund.
          if [ "$DEPLOY_ERGEBNIS" = "cancelled" ]; then
            echo "ℹ️ Deploy-Lauf wurde von einem neueren Push verdrängt – kein Siegel-Befund."
            exit 0
          fi

          fehler=0

          if [ "$ARTEFAKT_OK" != "true" ]; then
            if [ "$DEPLOY_ERGEBNIS" = "failure" ]; then
              echo "::error::Deploy-Job VOR der Auslieferung abgebrochen (Scorecard-Exit ${SCORECARD_EXIT:-unbekannt}) – kein Artefakt, keine Veröffentlichung. Die Ursache steht im deploy-Job; die Live-Site bleibt auf dem letzten erfolgreichen Stand."
            else
              echo "::error::Auslieferung ausgeblieben: Deploy-Gate verlangte einen Deploy (deploy-Job: ${DEPLOY_ERGEBNIS:-unbekannt}), aber es wurde kein Auslieferungs-Artefakt bestätigt. Die Live-Site ist eingefroren, ohne dass ein Inhalts-Gate sie gestoppt hätte (Befundklasse #676)."
            fi
            fehler=1
          elif [ "$PAGES_ERGEBNIS" != "success" ]; then
            echo "::error::Artefakt bestätigt, aber das offizielle Pages-Deployment war '${PAGES_ERGEBNIS:-unbekannt}' – die Site ist nicht öffentlich ausgeliefert (Issue-#537-Klasse)."
            fehler=1
          else
            echo "✅ Auslieferung belegt: Artefakt hochgeladen und offizielles Pages-Deployment erfolgreich."
          fi

          if [ "$SCORECARD_WERKZEUGFEHLER" = "true" ]; then
            echo "::error::Release-Scorecard meldete einen WERKZEUGFEHLER (Exit ${SCORECARD_EXIT:-unbekannt}). Die Auslieferung ist bewusst weitergelaufen (Dauerheilung #676), das Siegel fehlt damit für diesen Stand – Runbook: docs/ANLEITUNG-RELEASE-SCORECARD.md"
            fehler=1
          fi

          if [ "$fehler" -ne 0 ]; then
            # Ehrliche Schlusszeile: „bereits raus" darf nur stehen, wenn die
            # Auslieferung wirklich belegt ist – sonst verschleiert das Siegel
            # genau den Zustand, den es melden soll.
            if [ "$PAGES_ERGEBNIS" = "success" ]; then
              echo "🛑 Auslieferungs-Siegel rot – die Veröffentlichung ist öffentlich raus, der Befund bleibt offen."
            else
              echo "🛑 Auslieferungs-Siegel rot – die öffentliche Auslieferung ist NICHT belegt, der Befund bleibt offen."
            fi
            exit 1
          fi
          echo "✅ Auslieferungs-Siegel grün."
