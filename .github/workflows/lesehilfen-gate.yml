# ============================================================
#  LESEHILFEN-GATE (Vorlesen + Kurzfassung) — dauerhaft aktiv
#  ------------------------------------------------------------
#  FF Voice Studio · Generation 2 · 05.09.2026
#
#  Dieses Gate sichert das neue Vorlese-Modell ab:
#    · männliche Stimme, Deutsch und Englisch ohne Umschalter
#    · zwei Tonpfade: Studio-Tonspur (MP3) + Browser-Engine
#    · Kurzfassung auf Verlagshaus-Niveau
#
#  Es läuft gegen eine ECHTE DOM (jsdom) mit der unveränderten
#  static/premium/ff-voice.js, dem echten Seiten-Skelett und echtem
#  Inhalt aus content/posts. Ergänzend prüfen vier weitere Suiten die
#  Stimmen-Regie, die Parität zwischen Tonspur und Browserstimme sowie
#  die Infrastruktur (Layout · Styling · Workflow · Rückbau).
#
#  Bricht eine Suite, wird der Deploy blockiert.
#
#  Auslösung: bei jedem Push/PR, der Lesehilfen oder Content berührt,
#  plus täglich als Wache gegen stillen Verfall.
# ============================================================
name: Lesehilfen-Gate (Vorlesen + Kurzfassung)

on:
  push:
    branches: ["**"]
    paths:
      - "static/premium/ff-voice.js"
      - "static/premium/ff-premium.js"
      - "static/premium/ff-summary-safety.js"
      - "scripts/heading_anchor_guard.py"
      - "assets/css/extended/ff-voice.css"
      - "assets/css/extended/z-premium-blog.css"
      - "layouts/_partials/ff_voice_toolbar.html"
      - "layouts/single.html"
      - "layouts/_default/single.html"
      - "layouts/pillar/single.html"
      - "layouts/shortcodes/**"
      - "scripts/ff_voice_functional_test.mjs"
      - "scripts/ff_voice_voice_test.js"
      - "scripts/ff_voice_repair_test.mjs"
      - "scripts/ff_voice_tts_hardening_test.mjs"
      - "scripts/ff_voice_browser_test.mjs"
      - "scripts/ff_voice_qa_lib.mjs"
      - "tools/ff-voice-browser/**"
      - "scripts/ff_voice_probe.mjs"
      - "scripts/ff_voice_parity_check.py"
      - "scripts/ff_voice_toolbar_check.py"
      - "scripts/ff_voice_audio.py"
      - "scripts/ff_voice_backends.py"
      - "tools/ff-voice-qa/**"
      - "content/posts/**"
      - "content/pillar/**"
      - ".github/workflows/lesehilfen-gate.yml"
  pull_request:
    paths:
      - "static/premium/ff-voice.js"
      - "static/premium/ff-premium.js"
      - "static/premium/ff-summary-safety.js"
      - "scripts/heading_anchor_guard.py"
      - "assets/css/extended/ff-voice.css"
      - "assets/css/extended/z-premium-blog.css"
      - "layouts/**"
      - "content/posts/**"
      - "content/pillar/**"
      - "scripts/ff_voice_audio.py"
      - "scripts/ff_voice_backends.py"
      - "scripts/ff_voice_functional_test.mjs"
      - "scripts/ff_voice_voice_test.js"
      - "scripts/ff_voice_repair_test.mjs"
      - "scripts/ff_voice_tts_hardening_test.mjs"
      - "scripts/ff_voice_browser_test.mjs"
  schedule:
    - cron: "20 6 * * *"   # 08:20 MESZ – tägliche Wache gegen stillen Verfall
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lesehilfen-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lesehilfen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Node bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python bereitstellen
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: QA-Abhängigkeiten installieren (jsdom)
        working-directory: tools/ff-voice-qa
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Browser-QA installieren (playwright-core, Chromium)
        working-directory: tools/ff-voice-browser
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx playwright-core install --with-deps chromium

      - name: Syntaxprüfung ff-voice.js
        run: node --check static/premium/ff-voice.js

      - name: Syntaxprüfung ff-premium.js & Sicherheitsnetz
        run: |
          node --check static/premium/ff-premium.js
          node --check static/premium/ff-summary-safety.js

      # ---- Echter Funktionstest (jsdom, echte Engine-Datei) ----
      - name: Funktionstest Vorlesen + Kurzfassung (echte DOM)
        run: node scripts/ff_voice_functional_test.mjs

      # ---- Anker-Wache (Befund 10.09.2026) ----
      # Der Abschnitts-Knopf „Link kopieren“ trug ein „§“ als Text in
      # JEDER Überschrift. Die Wache sichert Quelle, Engine, Theme und
      # die Regressionsgruppe dauerhaft ab.
      - name: Anker-Wache (kein § in Überschriften, Kurzfassung & Vorlesen)
        run: python3 scripts/heading_anchor_guard.py

      # ---- Reparatur-Pinne (Befund 06.09.2026: Tonspur-Wache,
      #      Fallback, ehrlicher Stopp, lazy Stimmbindung) ----
      - name: Reparatur-Pinne Vorlesen (Tonspur-/Fallback-/Stimm-Wachen)
        run: node scripts/ff_voice_repair_test.mjs

      # ---- TTS-Härtung (Befund 07.09.2026: stumme Engine, rasende
      #      Anzeige, verschlucktes speak(), hängende Tonspur) ----
      - name: TTS-Härtung Vorlesen (Stumm-Sweep, Physik-Deckel, Keep-Alive)
        run: node scripts/ff_voice_tts_hardening_test.mjs

      # ---- Echt-Browser-Test (Chromium): der Befund vom 06.09.2026 war
      #      in jsdom unsichtbar — echte Timer, echtes <audio>, echte WAV ----
      - name: Echt-Browser-Funktionstest (Chromium, echtes Audio)
        run: node scripts/ff_voice_browser_test.mjs

      # ---- Stimmen-Regie: männlich, DE & EN, ohne Umschalter ----
      - name: Stimmen-Regie (männlich, DE & EN, ohne Umschalter)
        run: node scripts/ff_voice_voice_test.js

      # ---- Serverseite: Aussprache, Prosodie, Audio-Werkzeuge ----
      - name: TTS-Backends – Selbsttest
        run: python3 scripts/ff_voice_backends.py --selftest

      # ---- Generator: Block-Extraktion & Injektion ----
      - name: Tonspur-Generator – Selbsttest
        run: python3 scripts/ff_voice_audio.py --selftest

      # ---- Parität: Tonspur ≡ Browser-Engine ----
      - name: Paritäts-Gate Tonspur ↔ Browserstimme
        run: python3 scripts/ff_voice_parity_check.py

      # ---- Infrastruktur: Layout, Styling, Workflow, Rückbau ----
      - name: Toolbar-, Barrierefreiheits- & Rückbau-Wache
        run: python3 scripts/ff_voice_toolbar_check.py

      # ---- Diagnose (kein Deploy-Stopp): welche Engines wären verfügbar? ----
      - name: TTS-Engines im CI (Diagnose)
        run: python3 scripts/ff_voice_audio.py --engines || true
