# Arena-Reproduktion: CodeQL-Analyse mit SARIF-Ausgabe als PR-Kommentar.
# Zweck: Exakte Abbildung der Code-Scanning-Fundstellen (Default-Setup-Queries),
# ohne selbst neue Alerts in der Security-Tab anzulegen (upload: false).
# Läuft ausschließlich auf dem Arena-Arbeitsbranch.
name: Arena CodeQL Reproduktion

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a106e4-franksfinanzcheck-blog

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    name: CodeQL Reproduktion (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Sprachen, die CodeQL hier auto-erkennt (siehe /languages-API):
        # Python (7,7 MB) + JavaScript (1,5 MB).
        language: [javascript, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Kein queries-Parameter => Standard-Query-Suite wie beim Default-Setup.

      - name: CodeQL-Analyse (SARIF lokal, kein Upload)
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
          upload: false

      - name: Fundstellen aufbereiten
        run: |
          set -euo pipefail
          {
            echo "<!-- arena-codeql-report:${{ matrix.language }} -->"
            echo "## CodeQL-Fundstellen (${{ matrix.language }}) – Rohdaten"
            echo ""
            echo "**Gesamt (${{ matrix.language }}):** $(jq '[.runs[0].results[]?] | length' sarif-results/*.sarif | paste -sd+ | bc)"
            echo ""
            for f in sarif-results/*.sarif; do
              echo '```json'
              # Result-Objekte mit kompakten Code-Flows (Source→Sink-Pfad je Fundstelle).
              jq -c '[.runs[0].results[]? | {ruleId, level, msg: ((.message.text // "") | .[0:200]), locations, flows: [(.codeFlows[0].threadFlows[0].locations[]?.location.physicalLocation | (.artifactLocation.uri + ":" + ((.region.startLine // 0) | tostring)))]}]' "$f"
              echo '```'
              echo ""
            done
          } > fundstellen.md
          wc -c fundstellen.md

      - name: Fundstellen als PR-Kommentar veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR="$(gh pr list --head "${GITHUB_REF_NAME}" --json number --jq '.[0].number')"
          if [ -z "$PR" ]; then
            echo "Kein PR für ${GITHUB_REF_NAME} – überspringe Kommentar."
            exit 0
          fi
          # PR-Kommentare sind auf 64 KiB begrenzt: ggf. aufteilen.
          split -b 60000 fundstellen.md fundstellen-teil-
          for teil in fundstellen-teil-*; do
            gh pr comment "$PR" --body-file "$teil"
          done
