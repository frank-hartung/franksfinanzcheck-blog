# Arena-Reproduktion: CodeQL-Analyse mit SARIF-Ausgabe als PR-Kommentar.
# Zweck: Exakte Abbildung der Code-Scanning-Fundstellen (Default-Setup-Queries),
# ohne selbst neue Alerts in der Security-Tab anzulegen (upload: false).
# Läuft ausschließlich auf dem Arena-Arbeitsbranch.
name: Arena CodeQL Reproduktion

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a106e4-franksfinanzcheck-blog

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    name: CodeQL Reproduktion (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Sprachen, die CodeQL hier auto-erkennt (siehe /languages-API):
        # Python (7,7 MB) + JavaScript (1,5 MB).
        language: [javascript, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Kein queries-Parameter => Standard-Query-Suite wie beim Default-Setup.

      - name: CodeQL-Analyse (SARIF lokal, kein Upload)
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
          upload: false

      - name: Fundstellen aufbereiten
        run: |
          set -euo pipefail
          {
            echo "<!-- arena-codeql-report:${{ matrix.language }} -->"
            echo "## CodeQL-Fundstellen (${{ matrix.language }})"
            echo ""
            echo "| Regel | Schwere | Datei | Zeile |"
            echo "|---|---|---|---|"
            for f in sarif-results/*.sarif; do
              jq -r '
                .runs[0].results[]? |
                [
                  ("`" + .ruleId + "`"),
                  ((.properties.problem.severity // .level // "note") | tostring),
                  ("`" + .locations[0].physicalLocations[0].artifactLocation.uri + "`"),
                  ((.locations[0].physicalLocations[0].region.startLine // 0) | tostring)
                ] | @tsv' "$f" | while IFS=$'\t' read -r rule sev path line; do
                  echo "| ${rule} | ${sev} | ${path} | ${line} |"
                done
              done
            echo ""
            echo "**Gesamt (${{ matrix.language }}):** $(jq '[.runs[0].results[]?] | length' sarif-results/*.sarif | paste -sd+ | bc)"
          } > fundstellen.md
          cat fundstellen.md

      - name: Fundstellen als PR-Kommentar veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR="$(gh pr list --head "${GITHUB_REF_NAME}" --json number --jq '.[0].number')"
          if [ -z "$PR" ]; then
            echo "Kein PR für ${GITHUB_REF_NAME} – überspringe Kommentar."
            exit 0
          fi
          # Alte Arena-Reports derselben Sprache entfernen (kein Spam)
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" \
            --jq ".[] | select(.body | startswith(\"<!-- arena-codeql-report:${{ matrix.language }} -->\")) | .id" \
          | while read -r cid; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${cid}" || true
          done
          gh pr comment "$PR" --body-file fundstellen.md
