# ============================================================
#  NEWSLETTER-KADENZ-WACHE – der planmäßige Lauf wird nachgezählt
#
#  WARUM (23.09.2026, Lauf fehlt still):
#  Der Cron des Newsletter-Daily (05:05 UTC, Di/Fr) kam an diesem
#  Werktag GAR NICHT – kein Lauf, kein Rotton, keine Meldung. GitHub
#  verwirft oder verschiebt schedule-Ereignisse unter Last (am Vortag
#  kam er erst ~10:05 UTC). Ein Lauf, der nie startet, kann nicht rot
#  werden: kein Ereignis für das Fehler-Alerting, keine Annotation,
#  nichts. „Ausgefallen ist nicht bestanden“ – diesmal für Workflows.
#
#  DIESE WACHE: zählt dienstags und freitags vormittags nach, ob der
#  Newsletter-Daily ÜBERHAUPT versucht wurde (Fenster ab 03:30 UTC).
#  Fehlt jeder Versuch, holt sie den Lauf mit `planmaessig=true` nach –
#  exakt die Freigabestufe des verpassten Crons, nicht mehr (der
#  Newsletter-Daily bleibt dreifach verriegelt: Secrets, Freigabe,
#  Double-Opt-in-Liste beim Anbieter). Ein FEHLGESCHLAGENER Lauf ist
#  kein Fall dieser Wache: er ist laut (Fehler-Alerting) und eine
#  Wiederholung ist Betreiber-Entscheid, nicht Automatik.
#
#  Doppel-Fall ungefährlich: kommt der verschobene Cron doch noch,
#  findet er einen leeren Digest vor – „nichts zu senden“, keine zweite
#  Kampagne (Duplikatschutz des Digest-Skripts).
#
#  Diese Wache steht in der Wacht-Liste des Fehler-Alertings: kann sie
#  selbst nicht nachholen (fehlende actions:write, Netz), wird der
#  Befund laut – ein Wächter, der schweigt, wäre die alte Lücke neu.
#
#  ZWEITER VORFALL (Freitag, 25.09.2026): Der 04:30-Cron blieb erneut aus
#  – und DIESE Wache gleich mit: ihr 08:11-Cron kam nie (null Läufe seit
#  ihrer Erstellung am 23.09.). Gemessen über alle Workflows des Repos
#  lieferte GitHubs Scheduler an diesem Tag jedes Ereignis 5–5,5 h zu spät
#  oder gar nicht (Backup 03:00 → 08:24, Affiliate 04:00 → 09:15, Uptime
#  */15 → 6 statt 96 Läufe). Ein Netz am selben Haken wie die Last ist
#  kein Netz. Seitdem gilt:
#    · Der Cloudflare-Worker (newsletter-worker/, Cron Trigger, minuten-
#      genau) ist der TAKTGEBER: 04:30 UTC startet er den Newsletter-Daily
#      (planmaessig=true), 05:05 UTC ruft er DIESE Wache per
#      workflow_dispatch. Fällig ist der Tag ab SOLL+30 min (05:00 UTC),
#      gerechnet in scripts/newsletter_cadence.py (FAELLIG_AB).
#    · Der GitHub-Cron 08:11 bleibt als drittes Netz stehen.
#    · push (nur bei Änderung dieser Wache selbst): Eine Wache, die sich
#      ändert, beweist sich sofort auf main – und holt, wenn sie an einem
#      Di/Fr nach 05:00 UTC merged wird und der Tag leer ist, den Planlauf
#      nach. Genau das ist am 25.09. der Heilungsweg für die ausgefallene
#      Ausgabe: Merge = Nachholen, ohne dass jemand die Actions-Seite
#      aufsuchen muss. Auf allen anderen Tagen ist es ein grüner Ruhetag.
# ============================================================
name: Newsletter-Kadenz-Wache

on:
  schedule:
    - cron: "11 8 * * 2,5"    # 08:11 UTC = 10:11 MESZ – drittes Netz hinter
                              # dem Worker-Taktgeber (05:05 UTC, s. o.)
  workflow_dispatch: {}       # Ruf des Worker-Taktgebers (und manuell)
  push:
    branches: [main]
    paths:                    # NUR die Wache selbst – kein Lauf pro Commit
      - ".github/workflows/newsletter-cadence.yml"
      - "scripts/newsletter_cadence.py"

permissions:
  contents: read
  actions: write    # der Nachhol-Dispatch (gh workflow run)

concurrency:
  group: newsletter-kadenz
  cancel-in-progress: false

jobs:
  kadenz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Python bereitstellen
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Wachen-Selbsttest (Fensterlogik, Ruhetag, Vorfall-Erkennung)
        run: python3 scripts/newsletter_cadence.py --selftest

      - name: Kadenz nachzählen (und verpassten Planlauf nachholen)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 scripts/newsletter_cadence.py --pruefen --md | tee /tmp/kadenz.log
          rc=$?
          cat /tmp/kadenz.log >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Befund laut machen (Annotation)
        if: failure()
        run: |
          BEFUND=$(grep -m1 "Kein einziger\|fehlgeschlagen" /tmp/kadenz.log | sed 's/^[[:space:]]*//' | cut -c1-350)
          echo "::error::Newsletter-Kadenz verletzt – der planmäßige Lauf fehlt und konnte nicht zuverlässig nachgeholt werden. ${BEFUND:-Details im Lauf-Log.}"
