name: Redaktions-Standard-Patch einspielen v3 (selbstheilend, 02.09.2026)

# V3 – warum V2 rot werden konnte und was hier anders ist:
#   V2 war abhängig von patches/redaktions-standard-2026-09-02-workflows.patch
#   im Repo. Existiert die Datei nicht auf main (z. B. weil PR #156 noch nicht
#   gemergt ist) oder weichen die beiden Workflow-Dateien inzwischen von dem
#   Stand ab, auf dem der Patch basiert (andere Bot-Patches), wurde V2 rot.
#   Auch ein ungültiges GH_PAT machte V2 rot.
#   V3 hat KEINE externen Abhängigkeiten mehr:
#   - Der komplette Verdrahtungs-Code steckt IN diesem Workflow (zeilenbasiert,
#     eindeutige Anker, idempotent über Marker).
#   - Es wird NUR das Standard-Token (github.token) genutzt – kein GH_PAT nötig.
#   - Jeder Schritt meldet klar, was passiert; bei einem Problem steht der
#     Grund direkt im Log.
#
# ANWENDUNG:
#   1. Diese Datei nach .github/workflows/apply-redaktions-standard-2026-09-02-v3.yml
#      legen (GitHub → "Add file" → "Create new file", Inhalt einfügen).
#   2. Actions → "Redaktions-Standard-Patch einspielen v3" → Run workflow.
#   3. Grüner Lauf = Engine + SEO-Weekly sind dauerhaft verdrahtet.
#   4. Die Datei darf danach gelöscht werden (optional).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Voraussetzung prüfen (Wachen-Skript muss auf main liegen)
        run: |
          if [ -f scripts/redaktions_standard.py ]; then
            echo "✅ scripts/redaktions_standard.py vorhanden – weiter."
          else
            echo "🛑 ABBRUCH: scripts/redaktions_standard.py fehlt auf main."
            echo "   Ursache: PR #156 (Redaktions-Standard) ist nicht gemergt."
            echo "   Lösung: PR #156 mergen und diesen Workflow erneut starten."
            exit 1
          fi

      - name: Engine-Verdrahtung (Content-Engine v2, idempotent)
        run: |
          python3 - <<'PYEOF'
          import io, sys
          path = ".github/workflows/content-engine-v2.yml"
          src = io.open(path, encoding="utf-8").read()
          marker = "redaktions_standard.py --gate --new-only"
          if marker in src:
              print("✅ Engine: bereits verdrahtet – nichts zu tun.")
              sys.exit(0)
          anchor = 'python3 scripts/profi_polish.py --new || echo'
          if src.count(anchor) != 1:
              print("🛑 Anker nicht eindeutig gefunden:", src.count(anchor), "Treffer.")
              print("   content-engine-v2.yml hat sich verändert – bitte diese")
              print("   Meldung an den Agenten senden (manueller Weg möglich).")
              sys.exit(1)
          block = [
              '          echo "== Redaktions-Standard (Capital/WiWo/ZEIT, 02.09.2026) =="',
              '          python3 scripts/redaktions_standard.py --selftest',
              '          python3 scripts/redaktions_standard.py --fix --ai --new-only || echo "⚠ Redaktions-Heilung (nicht kritisch)"',
              '          python3 scripts/redaktions_standard.py --gate --new-only || echo "⚠ Redaktions-Gate: harte Funde → Entwurf (siehe REDAKTIONS-STANDARD-REPORT.md)"',
          ]
          lines = src.splitlines()
          idx = next(i for i, l in enumerate(lines) if anchor in l)
          lines[idx+1:idx+1] = block
          io.open(path, "w", encoding="utf-8").write("\n".join(lines) + "\n")
          check = io.open(path, encoding="utf-8").read()
          assert marker in check
          print("✅ Engine: 4 Zeilen eingefügt und verifiziert.")
          PYEOF

      - name: Weekly-Verdrahtung (SEO-Weekly Bestands-Retrofit, idempotent)
        run: |
          python3 - <<'PYEOF'
          import io, sys
          path = ".github/workflows/seo-weekly.yml"
          src = io.open(path, encoding="utf-8").read()
          marker = "Redaktions-Standard (Capital/WiWo/ZEIT) – Bestands-Retrofit"
          if marker in src:
              print("✅ SEO-Weekly: bereits verdrahtet – nichts zu tun.")
              sys.exit(0)
          anchor = 'echo "✅ Cover-Fixes gepusht"'
          if src.count(anchor) != 1:
              print("🛑 Anker nicht eindeutig gefunden:", src.count(anchor), "Treffer.")
              print("   seo-weekly.yml hat sich verändert – bitte diese")
              print("   Meldung an den Agenten senden (manueller Weg möglich).")
              sys.exit(1)
          block = [
              '      - name: Redaktions-Standard (Capital/WiWo/ZEIT) – Bestands-Retrofit',
              '        id: redaktion',
              '        continue-on-error: true',
              '        env:',
              '          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}',
              '          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}',
              '        run: |',
              '          python3 scripts/redaktions_standard.py --selftest',
              '          python3 scripts/redaktions_standard.py --fix --ai --backlog 3 || echo "⚠ Redaktions-Retrofit: Rest-Funde im Report"',
              '          git config user.name "SEO-Bot"',
              '          git config user.email "seo-bot@users.noreply.github.com"',
              '          git add REDAKTIONS-STANDARD-REPORT.md content/ data/redaktions_standard_history.jsonl data/korrekturen.yaml 2>/dev/null || true',
              '          if git diff --cached --quiet; then',
              '            echo "Redaktions-Standard: keine Änderungen."',
              '          else',
              '            git commit -m "redaktion: Bestand auf Capital/WiWo/ZEIT-Standard gehoben (Kürze-Box, Faustregel, Frage-H2, Schritte)"',
              '            scripts/git_sync.sh --push-only',
              '            echo "✅ Redaktions-Retrofit gepusht"',
              '          fi',
          ]
          lines = src.splitlines()
          idx = next(i for i, l in enumerate(lines) if anchor in l)
          fi_idx = None
          for j in range(idx + 1, len(lines)):
              if lines[j].strip() == "fi":
                  fi_idx = j
                  break
          if fi_idx is None:
              print("🛑 Abschluss 'fi' des Cover-Schritts nicht gefunden –")
              print("   seo-weekly.yml hat sich verändert. Meldung an den Agenten.")
              sys.exit(1)
          lines[fi_idx+1:fi_idx+1] = block
          io.open(path, "w", encoding="utf-8").write("\n".join(lines) + "\n")
          check = io.open(path, encoding="utf-8").read()
          assert marker in check
          print("✅ SEO-Weekly: Retrofit-Schritt eingefügt und verifiziert.")
          PYEOF

      - name: Änderungen committen & pushen (mit Rebase-Wiederholung)
        run: |
          git config user.name "Frank (Patch-Bot)"
          git config user.email "frank@users.noreply.github.com"
          git add .github/workflows/content-engine-v2.yml .github/workflows/seo-weekly.yml
          if git diff --cached --quiet; then
            echo "✅ Beide Workflows waren bereits verdrahtet – grün, nichts gepusht."
            exit 0
          fi
          git commit -m "feat(redaktion): Redaktions-Standard Capital/WiWo/ZEIT in Engine + SEO-Weekly verdrahtet (V3, selbstheilend)"
          for i in 1 2 3; do
            if git push origin main; then
              echo "✅ Patch nach main gepusht."
              exit 0
            fi
            echo "⚠ Push-Versuch $i fehlgeschlagen (Bot-Parallelbetrieb?) – Rebase & neuer Versuch."
            git pull --rebase origin main
          done
          echo "🛑 Push nach 3 Versuchen nicht möglich – bitte dieses Log an den Agenten senden."
          exit 1
