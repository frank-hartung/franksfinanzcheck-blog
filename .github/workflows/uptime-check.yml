# ============================================================
#  UPTIME-CHECK (Lückenfüller aus AUTOMATION-AUDIT 2026-08-10)
#
#  Der Bot-Watchdog prüft „Bot schweigt" – aber niemand prüfte
#  „SEITE IST DOWN"! Alle 6 Stunden (plus manuell):
#    1) Startseite (200? wichtige Inhalte drin?)
#    2) 2 Representative Assets (Cover-JPG + CSS-Export/JS)
#    3) Antwortzeit (Warnung > 8 s)
#
#  SELBSTHEILUNG auf zwei Ebenen:
#    - Site wieder da → offenes Uptime-Issue wird AUTOMATISCH
#      geschlossen (Bug „vergessenes Issue" kann nicht entstehen).
#    - DNS/TLS-Glitch → Retry mit Backoff, erst dann Alarm.
#
#  Dedupe: Es gibt max. EIN offenes Uptime-Issue (Label: uptime).
#  Hinweis: bewusst NICHT in alert-on-failure (Doppel-Alarm!) –
#  dieses Workflow erzeugt sein Issue selbst.
# ============================================================
name: Uptime-Check

on:
  schedule:
    - cron: "17 */6 * * *"   # alle 6 Stunden, versetzt zu den Bot-Crons
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      - name: Website prüfen (2 Versuche mit Backoff)
        id: check
        run: |
          URL="https://franksfinanzcheck.de/"
          for attempt in 1 2; do
            CODE=$(curl -s -o /tmp/site.html -w "%{http_code}" --max-time 25 "$URL" || echo 000)
            if [ "$CODE" = "200" ] && grep -q "FranksFinanzcheck" /tmp/site.html; then
              TIME=$(curl -s -o /dev/null -w "%{time_total}" --max-time 25 "$URL")
              echo "ok=true" >> "$GITHUB_OUTPUT"
              echo "code=$CODE" >> "$GITHUB_OUTPUT"
              echo "time=$TIME" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Versuch $attempt fehlgeschlagen (HTTP $CODE) – Retry in 90 s …"
            [ "$attempt" = "1" ] && sleep 90
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Bei Ausfall kritischen Pfad prüfen & Issue erstellen (Dedupe)
        if: steps.check.outputs.ok == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'uptime', per_page: 5 });
            if (issues.length) { console.log('Issue existiert bereits – Dedupe.'); return; }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '🚨 WEBSITE DOWN: franksfinanzcheck.de nicht erreichbar',
              labels: ['uptime', 'kritisch'],
              body: `**Zeit:** ${new Date().toISOString()}\n**HTTP-Code:** ${{ steps.check.outputs.code }}\n\n` +
                    'Sofort prüfen:\n' +
                    '- GitHub-Status: https://www.githubstatus.com/\n' +
                    '- Pages-Deployments im Repo (Actions → pages build and deployment)\n' +
                    '- DNS bei deinem Anbieter (A-Records auf GitHub)\n' +
                    '- Pages-Tab: Custom Domain noch eingetragen?\n\n' +
                    '*Auto-Dedupe: Es gibt immer max. ein offenes Uptime-Issue. ' +
                    'Dieses Issue schließt sich selbst, sobald die Seite wieder 200 liefert.*'
            });
            console.log('🚨 Uptime-Issue erstellt.');

      - name: "Selbstheilung – bei Erholung offenes Uptime-Issue schließen"
        if: steps.check.outputs.ok == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'uptime', per_page: 10 });
            for (const i of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number,
                body: `✅ Seite ist wieder erreichbar (HTTP 200, ${{ steps.check.outputs.time }}s). Automatisch geschlossen.` });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed' });
              console.log('✅ Uptime-Issue #' + i.number + ' auto-geschlossen.');
            }
            console.log('Seite OK:', '${{ steps.check.outputs.time }}s Antwortzeit.');
