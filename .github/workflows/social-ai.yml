# ============================================================
#  SOCIAL-MEDIA-AI (automatisches Posten neuer Artikel)
#
#  Postet neue Artikel automatisch auf Mastodon (kostenlos) und
#  optional LinkedIn. Gleiche Kadenz wie der Blog (Mo/Mi/Fr),
#  jeweils NACH den Content-Crons:
#    - morgens 09:15 MESZ  (nach dem 08:10-Artikel)
#    - abends  20:45 MESZ  (nach dem 19:40-Artikel)
#  Di/Do/Sa/So: kein automatischer Toot (Skript-Wache + Cron).
#
#  Das Skript postet nur Artikel OHNE "social_posted: true" im
#  Front-Matter und setzt das Flag danach – keine Doppelposts.
#  Altbestand: einmalig lokal `python3 scripts/social_poster.py
#  --mark-all-posted` ausführen & pushen (siehe Anleitung).
#
#  OHNE Token: Lauf endet sauber (exit 0) mit Setup-Anleitung –
#  kein Fehler-Alerting. Setup: docs/ANLEITUNG-SOCIAL-MEDIA.md
#
#  Manuell starten: Actions → „Social-Media-AI" → Run workflow
# ============================================================
name: Social-Media-AI

# AB 12.09.2026 MANUELLER NOTLAUF – der Zeitplan wurde bewusst entfernt.
# Grund: Der Social-Autopilot (`.github/workflows/social-autopilot.yml`,
# scripts/social_studio.py) veröffentlicht seitdem VOLLAUTOMATISCH auf allen
# Kanälen – inklusive Mastodon, mit kanalnativen Texten, 14-Tage-Plan und
# hartem Gate. Zwei Bots auf demselben Kanal wären Doppelposts.
# Dieser Workflow bleibt als Handwerkzeug erhalten (z. B. um den Altbestand
# mit --mark-all-posted zu markieren oder einen Einzel-Toot abzusetzen).
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: social-media
  cancel-in-progress: false

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Neue Artikel auf Social Media posten
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE: ${{ vars.MASTODON_INSTANCE }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ vars.LINKEDIN_PERSON_URN }}
          SOCIAL_MAX_PRO_LAUF: ${{ vars.SOCIAL_MAX_PRO_LAUF || '4' }}
          SOCIAL_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python3 scripts/social_poster.py
      # Nachweis für die Secrets-Alters-Wache, dass der Mastodon-Kanal lebt –
      # als Live-Gegenprobe (0026#206: nur vermerken, statt zu prüfen, ist eine
      # Vermutung). Erfolg zählt erst, wenn verify_credentials mit 200 antwortet.
      - name: Mastodon-Secret live verifizieren
        if: success()
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE: ${{ vars.MASTODON_INSTANCE }}
        run: |
          if [ -n "${MASTODON_ACCESS_TOKEN:-}" ]; then
            python3 scripts/secrets_age_guard.py --verify-only MASTODON_ACCESS_TOKEN --quiet \
              || echo "::warning::Mastodon-Token live nicht bestätigt – die Secrets-Wache meldet das."
          fi

      - name: Flags & Status committen
        run: |
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nichts zu committen."
          else
            git commit -m "social: neue Artikel auf Social Media geteilt"
            scripts/git_sync.sh --push-only
            echo "✅ Social-Update gepusht"
          fi
