# ============================================================
#  TAGESZIEL 1 POST – Veröffentlichungs-Garantie an Publikationstagen
#  ------------------------------------------------------------
#  Betriebsregel (User, 13.08.2026 – reduziert von 2/Tag auf 1 Artikel an
#  4 Tagen/Woche): An Publikationstagen (Mo/Mi/Fr/Sa) mindestens 1 Post.
#  Grund für die Reduktion: tägliches Massen-Publizieren erhöht das Risiko,
#  von Google als "Scaled Content Abuse" eingestuft zu werden – besonders
#  bei einer jungen Domain. Qualität/Tiefe statt Menge (siehe README).
#
#  Drei Cron-Slots je Publikationstag (06:30 / 12:30 / 18:30 UTC) – damit
#  ist der Tag über mehrere Chancen abgedeckt (Selbstheilung: scheitert
#  ein Lauf an Rate-Limits o. Ä., übernimmt der nächste Slot).
#
#  Ablauf je Slot:
#    1) daily_post_guard.py --fill  – zählt heute qualitätsgeprüfte
#       Posts (unabhängig vom draft-Flag, siehe engine_generate.py),
#       generiert fehlende via Content-Engine (Profi→Relaxed→
#       Draft-Rettung; nie mehr als 1/Tag – Cap der Engine).
#    2) Qualitätskette (Spellcheck, Zeilenumbrüche, Titel, Cover,
#       Affiliate) – identisch zur Content-Engine Phase 2.
#    3) Commit + Push + Deploy-Dispatch (nur wenn Artikel entstanden).
#    4) Fehler → Exit 1 → alert-on-failure meldet (kein Stillversagen).
#
#  Concurrency: gleiche Gruppe wie content-engine-v2 ("content-bot") –
#  Läufe serialisieren sich, keine Doppel-Generierung.
# ============================================================
name: Tagesziel 1 Post

on:
  schedule:
    # Nur an Publikationstagen (Mo=1, Mi=3, Fr=5, Sa=6) – siehe
    # content-engine-v2.yml für dieselbe Tages-Auswahl.
    - cron: "30 6 * * 1,3,5,6"
    - cron: "30 12 * * 1,3,5,6"
    - cron: "30 18 * * 1,3,5,6"
  workflow_dispatch: {}

concurrency:
  group: content-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sicherstellen:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Zweistufige Freigabe (13.08.): Default "profi" = nur Artikel mit
      # bestandenem Profi-Qualitäts-Gate werden automatisch veröffentlicht,
      # "relaxed"-Artikel + Qualitäts-Rettungen bleiben Entwurf für Frank.
      # "0" = immer manuell, "1" = alte Vollautomatik (Settings -> Secrets
      # and variables -> Actions -> Variables -> AUTO_PUBLISH).
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'profi' }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Fehlende Posts generieren (Tagesziel-Guard, selbstheilend)
        id: guard
        run: |
          set +e
          OUTPUT=$(python3 scripts/daily_post_guard.py --fill)
          EXIT=$?
          echo "$OUTPUT"
          echo "EXIT=$EXIT" >> "$GITHUB_ENV"
          if echo "$OUTPUT" | grep -q "DRAFT_PENDING=true"; then
            echo "DRAFT_PENDING=true" >> "$GITHUB_ENV"
          else
            echo "DRAFT_PENDING=false" >> "$GITHUB_ENV"
          fi

      - name: Qualitätskette (nur wenn Artikel erstellt)
        if: env.EXIT == '0'
        run: |
          sudo apt-get install -y -qq hunspell hunspell-de-de >/dev/null 2>&1
          python3 scripts/fix_linebreaks.py || true
          python3 scripts/fix_spaces.py || true
          python3 scripts/spellcheck.py --fix || true
          python3 scripts/check_titles.py --fix || true
          python3 scripts/check_covers.py --fix || true
          python3 scripts/affiliate_link_check.py --fix || true
          python3 scripts/affiliate_profi_check.py --fix || true
          python3 scripts/internal_linker.py --apply --max 3 || true
          python3 scripts/pinterest_check.py --fix || true

      # Hartes Publish-Gate (13.08.2026): siehe content-engine-v2.yml für
      # die vollständige Begründung. Läuft NACH der Qualitäts-Kette (die
      # braucht public/ nicht) und VOR dem Commit, damit ein evtl.
      # zurückgestufter Artikel direkt mit draft:true committet wird.
      - name: Hugo installieren (für Publish-Gate)
        if: env.EXIT == '0'
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Publish-Gate (harte Vor-Veröffentlichungs-Kontrolle)
        if: env.EXIT == '0'
        run: |
          set +e
          hugo --minify
          python3 scripts/publish_gate.py --strict
          if [ $? -ne 0 ]; then
            echo "DRAFT_PENDING=true" >> "$GITHUB_ENV"
          fi

      - name: Artikel committen + pushen
        if: env.EXIT == '0'
        run: |
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine neuen Artikel – Ziel bereits erreicht."
          else
            git commit -m "content: Tagesziel 1 Post – fehlender Artikel automatisch generiert"
            git pull --rebase --autostash origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            git push
            echo "ARTIKEL_ERSTELLT=true" >> "$GITHUB_ENV"
          fi

      - name: Deploy anstoßen (nur bei neuem Content)
        if: env.ARTIKEL_ERSTELLT == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const last = execSync('git log -1 --format=%s').toString().trim();
            if (!last.startsWith('content:')) {
              console.log('Kein Content-Commit – kein Deploy nötig.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
            });
            console.log('✅ Deploy ausgelöst.');

      - name: Hinweis bei Entwurf (wenn tatsächlich einer wartet)
        if: env.DRAFT_PENDING == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/engine_issue.py || echo "⚠ Issue-Fehler (nicht kritisch)"

      - name: Ziel-Status loggen
        if: always()
        run: |
          python3 scripts/daily_post_guard.py
          echo "Tagesziel-Slot abgeschlossen."
