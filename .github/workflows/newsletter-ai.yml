# ============================================================
#  NEWSLETTER-AI (Brevo) – automatischer Tages-Digest
#
#  Jeden Abend 21:45 MESZ (nach allen Content-& Social-Bots):
#  EINE E-Mail mit den heutigen Artikeln an die Brevo-Liste.
#  Dedupe via Front-Matter-Flag `mailed: true` – nie doppelt.
#
#  Setup (~15 Min): siehe ANLEITUNG-NEWSLETTER.md
#    Secret  BREVO_API_KEY   · Variablen BREVO_LIST_ID (+ optional
#    BREVO_SENDER_NAME/EMAIL, BREVO_TEST_LIST_ID)
#  Ohne Keys: sauberer Skip (kein Fehler, kein Issue).
#  Test-Modus: Variable NEWSLETTER_TEST=1 → nur an Testliste.
#
#  Manuell starten: Actions → „Newsletter-AI" → Run workflow
# ============================================================
name: Newsletter-AI

on:
  schedule:
    - cron: "45 19 * * *"    # 21:45 MESZ (Sommer; MEZ 20:45)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tages-Digest bauen & versenden (Brevo)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          BREVO_TEST_LIST_ID: ${{ vars.BREVO_TEST_LIST_ID }}
          NEWSLETTER_TEST: ${{ vars.NEWSLETTER_TEST }}
          BREVO_SENDER_NAME: ${{ vars.BREVO_SENDER_NAME }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
        run: python3 scripts/newsletter_sender.py

      - name: mailed-Flags & Status committen
        if: ${{ !cancelled() }}
        run: |
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nichts gemailt – sauberer Tag."
          else
            git commit -m "newsletter: Tages-Digest versendet (Brevo)"
            git pull --rebase --autostash origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            git push || { sleep 20; git pull --rebase origin main && git push; }
          fi
