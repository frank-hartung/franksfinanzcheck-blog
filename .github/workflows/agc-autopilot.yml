# ============================================================
#  AGC-AUTOPILOT – tägliche Recherche + Redaktionskalender
#  ------------------------------------------------------------
#  AUFTRAG (Frank, 08.09.2026): Blog-Automatik nach dem
#  Funktionsumfang von AGC Studio. Dieser Workflow bereitet die
#  INTELLIGENZ vor, die die Content-Engine v2 beim Schreiben nutzt:
#
#    1) Brand Brain validieren          (fail-closed gegen brand_lock.yaml)
#    2) Recherche-Report erzeugen       (6 Teams, hybrid/deterministisch)
#    3) Redaktionskalender planen       (Mo/Mi/Fr, 4 Wochen Vorlauf)
#    4) Autopilot-Status schreiben      (Cockpit: AGC-AUTOPILOT-STATUS.md)
#
#  WICHTIG: Dieser Workflow VERÖFFENTLICHT NICHTS. Artikel gehen
#  ausschließlich über die Content-Engine v2 + ihre harten Gates live.
#  Er läuft täglich 05:45 MESZ – VOR dem Engine-Haupt-Slot (08:10 MESZ),
#  damit die Engine immer frische Recherche vorfindet.
# ============================================================
name: AGC-Autopilot (Recherche & Kalender)

on:
  schedule:
    # Täglich 05:45 MESZ (= 03:45 UTC)
    - cron: "45 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: agc-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python-Abhängigkeiten installieren
        run: python3 -m pip install -q pyyaml 2>/dev/null || true

      - name: Selftest (fail-closed)
        env:
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          SEARCH_API_PROVIDER: ${{ vars.SEARCH_API_PROVIDER || 'serper' }}
        run: python3 scripts/autopilot.py --selftest

      - name: Autopilot-Lauf (Recherche + Kalender + Status)
        env:
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          SEARCH_API_PROVIDER: ${{ vars.SEARCH_API_PROVIDER || 'serper' }}
        run: python3 scripts/autopilot.py --run

      - name: Commit & Push
        run: |
          git config user.name "AGC-Autopilot"
          git config user.email "agc-autopilot@users.noreply.github.com"
          # Dauerhafte Artefakte versionieren (Tagesreport/Status im Root sind
          # bewusst gitignored – sie werden bei jedem Lauf neu erzeugt).
          git add data/research/ data/editorial_calendar.yaml
          if git diff --cached --quiet; then
            echo "Keine Änderungen – Recherche/Kalender unverändert."
          else
            git commit -m "research: AGC-Tagesreport + Redaktionskalender aktualisiert"
            scripts/git_sync.sh --push-only
          fi
