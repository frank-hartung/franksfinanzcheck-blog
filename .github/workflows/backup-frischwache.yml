# ============================================================
#  BACKUP-FRISCHWACHE – operative RPO-Wache (Highend-Ergänzung)
#  ------------------------------------------------------------
#  WARUM (Profi-Agentur-Niveau, WF-9E5A #761 Dauerheilung 24.10.2026):
#    `backup-offsite.yml` (E1–E8) prüft OB die Sicherung laufen KANN,
#    `Fristwarnung` meldet ablaufende Tokens. Beides ist konfigurativ.
#    Fehlt der nächtliche Lauf aber ganz (Scheduler-Hänger, GitHub-
#    Verspätung, still widerrufenes Token ohne Ablaufdatum, Branch-
#    Regel unglücklich), bleibt das bis zur nächsten manuellen Frage
#    unbemerkt – RPO-Verletzung ohne Alarm.
#
#    Diese Wache schließt die operative Lücke: Sie liest nach dem
#    täglichen Sicherungsfenster die neuesten Releases im privaten
#    Backup-Repo (Entwürfe eingeschlossen, wie restore_drill.sh) und
#    misst deren Alter. 52 h rot (täglicher Lauf + belegte Scheduler-
#    Verspätung 09:53–12:03 MESZ vom 07.–15.10.2026), 36 h gelb. Das
#    Alerting kennt die Klasse `backup-frisch` mit eigenem Runbook.
#
#    Design-Prinzipien:
#      · Fail-closed wie die Einrichtungsprüfung (kein Schein-Grün)
#      · Keine zweite Sicherung, nur Messung (0 €, keine Secrets lecken)
#      · Selbsttest zuerst (defekte Wache darf nicht grün melden)
#      · Environment `backup` – Secrets nie in Klartext-Logs
#      · Branch-Filter: nur main ist Produktionsbeweis (alert-on-failure
#        schließt nur nach grünem main-Lauf)
#
#  BETRIEB:
#    Schedule: täglich 13:00 UTC (15:00 MESZ) – nach dem 03:00 UTC
#    Sicherungslauf plus Puffer für GitHub-Scheduler-Verspätung.
#    Manuell: Actions → Backup-Frischwache → Run workflow
#    Lokal:  npm run backup:frische
#            python3 scripts/backup_freshness_guard.py --selftest
#
#  SELBSTHEILUNG (Vorgang WF-3150 / Meldung #1030, 07.11.2026):
#    Bis hierher hat diese Wache GEMESSEN und GEMELDET – geheilt hat sie
#    nicht. Fiel der nächtliche Lauf aus (Scheduler-Aussetzer, still
#    widerrufenes Token, Environment-Regel nach einem Settings-Umbau),
#    blieb es bei der Meldung; der eine wirksame Schritt („Run workflow“)
#    war ein Handbefehl, den niemand kannte. Genau die Klasse, die am
#    06.11.2026 die GSC-Verlinkung geheilt hat: Heilung vorhanden, aber
#    nicht verdrahtet. Jetzt schließt der Lauf den Kreis selbst:
#      1. „Frische messen“ misst und fällt KEIN Urteil mehr (nur bei
#         fehlenden Eingaben rot – fail-closed bleibt).
#      2. „Selbstheilung“ stößt `backup-offsite.yml` genau einmal an,
#         wenn das Tagesfenster verpasst ist – nach fester Tabelle:
#         kein Anstoß bei laufender Sicherung, keiner im Mindestabstand,
#         höchstens drei Anstöße je 24 h, und nur mit lesbarer Historie
#         (ein blinder Anstoß könnte doppelt sichern).
#      3. „Urteil fällen“ entscheidet NACH der zweiten Messung. Grün
#         gibt es nur mit frischem Release – ein angestoßener Lauf ist
#         kein Nachweis (dieselbe Doktrin wie E1–E8).
#    Rechte: Der Job braucht dafür `actions: write` – genau ein Aufruf
#    (POST …/dispatches) in genau einem Schritt mit dem Lauf-Token. Die
#    Messung selbst bleibt beim fein eingeschränkten Ziel-Token; die
#    Endpunkt-Liste ist in scripts/backup_selbstheilung.py festgenagelt
#    und vertraglich geprüft.
#
#  SLA-Bezug: docs/ANLEITUNG-OFFSITE-BACKUP.md (RPO 24 h / 52 h)
#             docs/INFRASTRUKTUR.md Punkt 5
# ============================================================
name: Backup-Frischwache (operative RPO-Wache)

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}
  push:
    branches: ["main"]
    paths:
      - "scripts/backup_freshness_guard.py"
      # Trigger-Wache 27.10.2026 (W1): Die Frischwache ruft beide Prüfer auf.
      # Ohne diese Pfade startete sie bei einer Änderung daran nicht – sie
      # hätte dann über einen Code geurteilt, der gar nicht lief.
      - "scripts/backup_einrichtung.py"
      - "scripts/kv_backup.py"
      # Trigger-Wache W1 (01.11.2026, #923): Der Job führt seit diesem Stand
      # auch die Gegenprobe des Rückweg-Beweises aus. Ohne diesen Pfad würde
      # eine Änderung an restore_drill.sh den Lauf nicht auslösen – die
      # Prüfung liefe nie über den Code, den sie prüft.
      - "scripts/restore_drill.sh"
      # #923 (07.11.2026): Die Selbstheilung ist ein Prüfer dieses Laufs –
      # eine Änderung daran muss den Lauf auslösen, sonst urteilt er über
      # Code, der nicht lief (dieselbe Regel wie oben, Trigger-Wache W1).
      # 07.11.2026 (#1030): Die Selbstheilung ist ein eigener Prüfer. Ohne
      # diesen Pfad würde eine Änderung an ihr den Lauf nicht auslösen – sie
      # liefe nie über den Code, den sie prüft (Trigger-Wache W1).
      - "scripts/backup_selbstheilung.py"
      - "scripts/tests/test_backup_einrichtung.py"
      - "scripts/tests/test_backup_selbstheilung.py"
      - ".github/workflows/backup-frischwache.yml"
      - ".github/workflows/backup-offsite.yml"

permissions:
  contents: read

# ============================================================
#  NIE MITTEN IM HEILUNGSKREIS ABBRECHEN (#1030, 10.11.2026)
#  ----------------------------------------------------------
#  BEFUND: `cancel-in-progress: true` galt für JEDEN Lauf dieses Workflows.
#  Seit dem 07.11. ist der Lauf aber keine reine Messung mehr: Er stößt die
#  Sicherung selbst an und wartet bis zu 15 Minuten auf ihr Ergebnis. Traf
#  in dieser Zeit ein weiterer Lauf derselben Gruppe ein (der `push`-Trigger
#  unten feuert bei JEDER Änderung an einem der Prüfer), wurde der laufende
#  Lauf abgebrochen – und zwar GENAU an der Stelle, an der die Wache heilt.
#  Ein Heilungslauf, der sich selbst abwürgt, ist keine Heilung.
#  Der erste angestoßene Lauf läuft trotzdem zu Ende (`concurrency` von
#  backup-offsite.yml: `cancel-in-progress: false`) – abgebrochen wurde nur
#  der Zeuge.
#  JETZT: Der PLANMÄSSIGE Tageslauf darf nie abgebrochen werden (er trägt
#  die Selbstheilung), und auch ein manueller „Run workflow“ nicht – er ist
#  eine Entscheidung eines Menschen. Nur der `push`-Lauf (eine Code-Änderung
#  an einem Prüfer, ohne Betriebsabsicht) darf sich verdrängen: Er ist die
#  Qualitätsprobe des neuen Codes, nicht die Tageswache.
# ============================================================
concurrency:
  group: backup-frischwache-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  frischwache:
    name: Backup-Frische pruefen (RPO 24 h / 52 h)
    # Defense in depth for E8: workflow_dispatch on a non-production ref must
    # not receive the backup Environment. The Environment branch policy is
    # still required and is checked by the setup contract.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    # 07.11.2026 (#1030): 10 → 30 Minuten. Die Selbstheilung darf bis zu
    # 15 Minuten auf den angestoßenen Lauf warten (WARTEZEIT_S) und danach
    # erneut messen; mit dem alten Limit wäre der Job mitten in der Wartezeit
    # abgeschnitten worden – und ein Timeout sieht aus wie ein Ausfall.
    timeout-minutes: 30
    environment: backup
    permissions:
      contents: read
      # Die Einrichtungsprüfung (E8) liest die Schutzregeln des Environments
      # „backup“ (dafür `actions: read`), und die Selbstheilung startet bei
      # Bedarf einen Lauf im EIGENEN Repository (dafür `actions: write`).
      # Mehr Rechte braucht der Job nicht: keine Schreibzugriffe auf Inhalte,
      # keine fremden Repositories, keine Backup-Zugänge für den Dispatch.
      # E8 liest die Schutzregeln des Environments „backup“ (actions: read).
      # `write` kommt seit dem 07.11.2026 hinzu und ist ausschließlich für die
      # Selbstheilung nötig: GitHub kennt für `workflow_dispatch` kein
      # feineres Recht. Es liegt in EINEM Schritt („Selbstheilung …") und
      # betrifft EINEN Aufruf (dispatch von backup-offsite.yml). Die
      # Selbsttests und die Messung laufen ohne dieses Recht; die
      # Endpunkt-Liste ist vertraglich festgenagelt.
      actions: write
    env:
      BACKUP_REPO: ${{ vars.BACKUP_REPO }}
      GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
      # Spiegel der Eingaben, die `backup_einrichtung.py --pruefen` liest
      # (#923, 03.11.2026): Ohne diese Namen prüfte die Wache Variablen, die
      # sie nie erhielt. Belegt an Lauf 41533983322: E4 (CLOUDFLARE_ACCOUNT_ID)
      # meldete „fehlt“, obwohl das Secret existiert – und nach einer
      # vollständigen Einrichtung durch den Inhaber wären E1–E7 hier FÜR IMMER
      # „fehlt“ geblieben: eine dauerhaft rote Wache, die den Betreiber lehrt,
      # Rot zu ignorieren. Gleiche Ziel-Quellen wie im KV-Job (Vertrag:
      # test_backup_einrichtung.FrischwacheEinrichtungVertrag).
      ZIEL_REPO: ${{ vars.BACKUP_REPO }}
      ZIEL_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
      PASSWORT: ${{ secrets.BACKUP_PASSPHRASE }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_KV_BACKUP_TOKEN }}
      KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID_ABO }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python bereitstellen
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Selbsttest (Wache prueft sich selbst – fail-closed)
        run: |
          python3 scripts/backup_freshness_guard.py --selftest
          python3 scripts/kv_backup.py --selftest
          python3 scripts/backup_einrichtung.py --selftest
          # #923: Auch die Heilung beweist sich selbst, bevor sie urteilt.
          python3 scripts/backup_selbstheilung.py --selftest
          python3 scripts/backup_selbstheilung.py --vertrag

      # ================================================================
      #  EINRICHTUNG ALS BLOCK, NICHT ALS FUßNOTE (#923, 02.11.2026)
      #  ------------------------------------------------------------
      #  BEFUND: Dieser Schritt hieß „kein Block, nur Einordnung“ und endete
      #  fest mit `exit 0`. Belegt am Lauf 41335523844 (01.11.): E1/E2 waren
      #  offen (kein BACKUP_REPO, kein Ziel-Token), die Sicherung existierte
      #  nicht – und die RPO-Wache meldete zehnmal hintereinander **grün**.
      #  Der einzige sichtbare Hinweis war eine `notice` im Log, die kein
      #  Alerting liest. Eine Wache, die „keine Sicherung vorhanden“ als
      #  Erfolg ausgibt, ist die Umkehrung ihres Zwecks: Sie hätte den
      #  Ausfall, den sie überwacht, für alle Zeit verdeckt.
      #  Jetzt: rot mit eigenem Rat. Die Klasse „Einrichtung unvollständig“
      #  (Rückweg über „Voraussetzungen prüfen“) trägt weiterhin den
      #  Einrichtungs-Rat; hier steht derselbe Schrittname NICHT, damit der
      #  Rat des Offsite-Jobs nicht doppelt vergeben wird.
      # ================================================================
      - name: Voraussetzungen prüfen (fail-closed – kein Schein-Grün)
        # #1030 (10.11.2026): Dieser Schritt ist die EINZIGE Stelle, die weiß,
        # welche Einrichtungspunkte offen sind. Er sagt es in `GITHUB_OUTPUT`
        # (`offene_einrichtung`), und der Leerlauf-Schritt liest es. Bis heute
        # bekam der seinen Befund nicht – und antwortete mit einem zweiten,
        # falschen Rat (Lauf 42715328453).
        id: setup
        env:
          # E8 liest die Environment-Schutzregeln des QUELL-Repos. Der fein
          # eingeschränkte Backup-Token (nur das Ziel-Repo) darf genau das
          # nicht können – der Lauf-Token hat das Recht (actions: read oben),
          # wie im KV-Job von backup-offsite.yml.
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/backup_einrichtung.py --pruefen
          code=$?
          set -e
          # Die Ausgabe entsteht AUCH bei Rot (der Prüfer schreibt sie immer) –
          # sonst wüsste der nächste Schritt im wichtigsten Fall nichts.
          OFFEN="$(grep -m1 '^offene_einrichtung=' "$GITHUB_OUTPUT" 2>/dev/null | cut -d= -f2- || true)"
          if [ "$code" != "0" ]; then
            echo "::error::Die Offsite-Sicherung ist nicht eingerichtet (E1–E8 offen: ${OFFEN:-unbekannt}) – die Frischwache kann deshalb nichts messen und meldet NICHT grün. Siehe docs/ANLEITUNG-OFFSITE-BACKUP.md, Abschnitt „Live-Status“."
            exit 1
          fi

      - name: Frische messen (beide Release-Familien, Entwuerfe eingeschlossen)
        id: messung
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_REPO:-}" ] || [ -z "${GH_TOKEN:-}" ]; then
            {
              echo "## Backup-Frischwache"
              echo ""
              echo "Warnung: BACKUP_REPO oder BACKUP_REPO_TOKEN fehlt im Environment backup."
              echo "Die Frische kann nicht gemessen werden – das ist derselbe Zustand wie E1/E2 in der Einrichtungspruefung."
              echo "Einrichtung: docs/ANLEITUNG-OFFSITE-BACKUP.md"
              echo ""
              echo "- RPO-Soll: 24 h (Toleranz 52 h) · RTO: unter 60 Min."
              echo "- Erwartete Releases: backup-* + kv-backup-* (Entwuerfe, privat)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Backup-Frische nicht pruefbar – BACKUP_REPO oder BACKUP_REPO_TOKEN fehlt (E1/E2 offen)."
            exit 1
          fi
          # Getrennter Fehlerkanal: Bis zum 07.11.2026 lief `2>&1` in dieselbe
          # Datei wie das JSON. Eine einzige Warnzeile auf stderr machte das
          # Ergebnis unlesbar – und die alte Auswertung hätte das als „nicht
          # warnung“ stillschweigend grün gewertet. Stderr bleibt jetzt sichtbar,
          # das JSON bleibt rein.
          set +e
          python3 scripts/backup_freshness_guard.py --repo "$BACKUP_REPO" --json > /tmp/frische.json 2>/tmp/frische.err
          RC=$?
          set -e
          if [ -s /tmp/frische.err ]; then
            echo "Hinweise der Frische-Prüfung (stderr, nicht Teil der Messung):"
            sed 's/^/  /' /tmp/frische.err
          fi
          {
            echo "## Backup-Frischwache (RPO 24 h / Toleranz 52 h)"
            echo ""
            python3 << 'PYEOF'
          import json, pathlib
          p = pathlib.Path('/tmp/frische.json')
          try:
              d = json.loads(p.read_text())
              print(f"**Urteil:** {d.get('urteil','?')} – {d.get('text','')}")
              print("")
              for b in d.get('befunde', []):
                  sym = {'ok': 'OK', 'warnung': 'WARN', 'fehler': 'FEHLER'}.get(b.get('stufe'), '-')
                  print(f"- {sym} {b.get('praefix')} {b.get('text')}")
              if d.get('urteil') == 'warnung':
                  print("")
                  print("Gelb = Fruehwarnung (ueber 36 h), noch kein Ausfall. Scheduler-Haenger pruefen: Actions -> Offsite-Backup -> letzter Lauf.")
              print("")
              print("Anleitung: docs/ANLEITUNG-OFFSITE-BACKUP.md (RPO/RTO, Wiederherstellung)")
          except Exception as e:
              print(p.read_text() if p.exists() else str(e))
          PYEOF
          } >> "$GITHUB_STEP_SUMMARY"
          # Fail-closed in der Auswertung: Kein lesbares Urteil = kein Grün.
          URTEIL=""
          # Kein `|| true`: Die Zuweisung darf scheitern, sie darf nur nicht
          # den Lauf grün machen. Bleibt sie leer, ist das Urteil unten rot.
          if ! URTEIL="$(python3 -c "import json;d=json.load(open('/tmp/frische.json'));print(d.get('urteil','') if d.get('urteil') in ('ok','warnung','fehler') else '')" 2>/dev/null)"; then
            URTEIL=""
          fi
          if [ -z "$URTEIL" ]; then
            echo "::error::Die Frische-Pruefung lieferte kein lesbares Urteil (Exit $RC) – ohne Messung kein Gruen. Anleitung: docs/ANLEITUNG-OFFSITE-BACKUP.md"
            exit 1
          fi
          echo "urteil=$URTEIL" >> "$GITHUB_OUTPUT"
          echo "gemessen=true" >> "$GITHUB_OUTPUT"
          echo "Gemessenes Urteil: $URTEIL (Exit $RC) – das Schlussurteil faellt nach der Selbstheilung."
          exit 0

      # ================================================================
      #  SELBSTHEILUNG (WF-3150 / #1030, 07.11.2026)
      #  ------------------------------------------------------------
      #  Warum KEIN `if: failure()`: Die Messung ist kein Fehler mehr.
      #  Warum die Bedingung aus den Ausgaben statt aus `always()`:
      #  Ohne Messung (fehlende Eingaben, Einrichtung offen) gibt es
      #  nichts zu heilen – der Lauf ist dort schon an der richtigen
      #  Stelle rot.
      #  Warum der Schritt nicht selbst rot wird: Ein nicht geheilter
      #  Befund ist ein BEFUND, kein Werkzeugfehler. Rot macht ihn der
      #  Schritt „Urteil fällen“ – mit genau einer roten Stelle und dem
      #  Rat der Klasse `backup-frisch` (das Alerting erkennt die Klasse
      #  am Workflow, nicht am Wort „Voraussetzungen“).
      # ================================================================
      - name: Selbstheilung – fehlende Sicherung anstoßen (fail-closed)
        if: ${{ steps.messung.outputs.gemessen == 'true' && steps.messung.outputs.urteil != 'ok' }}
        env:
          # Nur dieser Schritt sieht das Recht, einen Lauf anzustoßen.
          AKTION_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Exit 1 heißt „nicht geheilt“ – das ist ein zulässiges Ergebnis und
          # wird vom Urteil-Schritt bewertet. Exit 2 heißt „die Heilung konnte
          # nicht entscheiden“ – das ist ein Werkzeugfehler und bleibt rot.
          set +e
          python3 scripts/backup_selbstheilung.py --heilen --ausgabe /tmp/frische_final.json
          RC=$?
          set -e
          if [ "$RC" -eq 2 ]; then
            echo "::error::Die Selbstheilung konnte nicht entscheiden (Aufruf- oder Selbsttestfehler) – Anleitung: docs/ANLEITUNG-OFFSITE-BACKUP.md"
            exit 1
          fi
          if [ ! -s /tmp/frische_final.json ]; then
            echo "::warning::Die Selbstheilung hat kein Ergebnis hinterlassen – das Urteil stuetzt sich auf die erste Messung (fail-closed)."
          fi
          exit 0

      # WF-9E5A / #923 (01.11.2026): Diese Kurzpruefung ist der EINZIGE
      # automatische Nachweis, dass der Rueckweg noch funktioniert. Sie traegt
      # deshalb den stabilen Wortteil „Wiederherstellbarkeit“ im Namen – das
      # Fehler-Alerting erkennt daran die Klasse `backup-restore` („gelaufen,
      # aber Rueckweg nicht belegt“) und riet sonst zu einem Neustart, der an
      # einem Syntaxfehler nichts aendert.
      - name: Kurzpruefung Wiederherstellbarkeit (strukturell, ohne Secrets)
        # #923 (07.11.2026) – EIN NACHWEIS, DER NUR NACH EINEM GRUENEN VORGÄNGER
        # LÄUFT, IST KEIN NACHWEIS.
        # ---------------------------------------------------------------
        # BEFUND (live, sechs Läufe in Folge, zuletzt 42282938395): In jedem
        # Lauf, in dem „Voraussetzungen prüfen“ rot war, stand dieser Schritt
        # als `skipped` im Lauf. Das ist GitHubs Standardbedingung
        # `success()` – der Rückweg-Nachweis hing damit am Ausgang einer
        # FREMDEN Frage. Genau so verschwindet eine Prüfung: Sie ist nicht
        # rot, sie ist nicht da, und niemand liest eine Lücke.
        # Warum das nicht „egal“ ist: Der Nachweis ist der einzige
        # automatisierte Beweis, dass ein Backup zurückzuspielen wäre. Fällt
        # er in genau dem Zustand aus, in dem die Sicherung schon nicht läuft,
        # gibt es über den Rückweg zwei Unbekannte statt einer.
        # JETZT: Der Schritt läuft IMMER (solange der Job nicht abgebrochen
        # ist) und ist ehrlich: Was strukturell prüfbar ist, wird geprüft
        # (Syntax, Selbsttests, Schein-Grün-Gegenprobe). Was ohne eingerichtetes
        # Ziel NICHT prüfbar ist, steht als Grund im Protokoll – der Schritt
        # wird dadurch nicht rot (die Einrichtung ist bereits Rot-Grund im
        # Schritt davor und trägt ihren eigenen Rat), aber er ist auch nicht
        # mehr stillschweigend weg.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # EHRLICHE ANSAGE ZUERST (#923, 07.11.2026): Ohne Ziel/Zugang/
          # Passphrase gibt es keine Sicherung, deren Rückweg man prüfen
          # könnte. Das wird GESAGT – nicht verschwiegen (vorher stand hier
          # in sechs Läufen nur „skipped“), und es macht aus der Lücke keine
          # zweite Rot-Stelle: Die Einrichtung selbst trägt ihren Rat im
          # Schritt „Voraussetzungen prüfen“.
          if [ -z "${ZIEL_REPO:-}" ] || [ -z "${ZIEL_TOKEN:-}" ] || [ -z "${PASSWORT:-}" ]; then
            echo "::warning title=Wiederherstellbarkeit nicht belegbar::Ohne Ziel, Zugang und Passphrase existiert keine Sicherung, deren Rückweg prüfbar wäre. Geprüft wird deshalb nur die STRUKTUR (Syntax, Selbsttest, Schein-Grün-Gegenprobe). Einrichtungs-Rat: docs/ANLEITUNG-OFFSITE-BACKUP.md (Schritte 1–7)."
          fi
          bash -n scripts/restore_drill.sh
          bash -n scripts/backup_einrichten_wizard.sh
          python3 scripts/kv_backup.py --selftest
          # Seit #923: Ein Drill ohne geprueste Familie darf nicht „bestanden“
          # heissen. Die Gegenprobe haelt genau diese Grenze fest.
          set +e
          AUSGABE="$(bash scripts/restore_drill.sh --repo probe/kein-zugriff --nur-git --nur-kv 2>&1)"
          RC=$?
          set -e
          if [ "$RC" -ne 2 ] || ! printf '%s' "$AUSGABE" | grep -q "NICHTS geprueft\|NICHTS geprüft"; then
            echo "::error::Der Restore-Drill meldet fuer einen Aufruf ohne gepruefte Familie kein Exit 2 (rc=$RC) – Schein-Gruen im Rueckweg-Beweis. Ausgabe: $AUSGABE"
            exit 1
          fi
          echo "Restore-Drill-Code geprueft (Syntax + Selbsttest gruen, Schein-Gruen ausgeschlossen)."
          {
            echo "## Wiederherstellbarkeit"
            echo ""
            echo "- Syntax `restore_drill.sh` / `backup_einrichten_wizard.sh`: ok"
            echo "- Selbsttest `kv_backup.py`: ok"
            echo "- Ein Drill ohne geprueste Familie endet mit Exit 2 (kein Schein-Gruen)."
            echo "- Echte Probe gegen das private Ziel: \`npm run backup:probe\` (Anleitung, Abschnitt „Wiederherstellung“)."
            if [ -n "${ZIEL_REPO:-}" ] && [ -n "${ZIEL_TOKEN:-}" ] && [ -n "${PASSWORT:-}" ]; then
              echo "- Ziel, Zugang und Passphrase sind gesetzt: die echte Probe ist jetzt möglich."
            else
              echo "- **Nicht prüfbar (ehrlich benannt):** Ohne Ziel/Zugang/Passphrase gibt es"
              echo "  keine Sicherung, deren Rückweg man prüfen könnte. Strukturell ist der"
              echo "  Rückweg bewiesen – die Wiederherstellung selbst nicht. Grund und Weg:"
              echo "  Schritt „Voraussetzungen prüfen“ bzw. docs/ANLEITUNG-OFFSITE-BACKUP.md."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ================================================================
      #  SELBSTHEILUNG (07.11.2026, #923) – Aktion mit Beweis, nicht Zusage
      #  ----------------------------------------------------------------
      #  Bis hierher galt die Kette als „wartet auf den Inhaber“. Das ist
      #  richtig für die Zugänge (E1–E8) – aber nicht für alles. Zwei
      #  Befunde sind ohne jeden Zugang reparierbar bzw. sichtbar zu machen:
      #    · Der nächtliche Lauf kommt verspätet oder gar nicht (belegt an
      #      24 Läufen: Soll 03:00 UTC, Start 07:37–10:28 UTC). Die DATEI ist
      #      in Ordnung, es fehlt der LAUF. Ein Dispatch holt ihn nach – und
      #      beweist sich selbst: Ein „angenommen“ der API ist kein Beweis,
      #      ein neuer Lauf in der Läufe-Liste ist einer.
      #    · Ein grüner Repo-Job ohne Ziel und ohne Passphrase sichert nichts
      #      (live belegt: Lauf 42359904795, Job „backup“ success mit den
      #      Warnungen „Kein dauerhaftes Offsite-Ziel“ / „Kein
      #      BACKUP_PASSPHRASE“). „Gelaufen“ ist wahr, „gesichert“ nicht.
      #  Die Grenze ist im Skript festgeschrieben (H1–H3): Nur beweisbar
      #  Kaputtes, nur ohne Zugang Reparierbares, immer mit Beweis. Was der
      #  Inhaber tun muss, wird benannt – nicht erfunden.
      # ================================================================
      # ================================================================
      #  LEERLAUF-PRÜFUNG (WF-9E5A / #923, 07.11.2026) – LESEND
      #  ------------------------------------------------------------
      #  Ein grüner Lauf, der nichts sichert, ist der SCHWERERE Befund als
      #  „bitte einrichten“: Er behauptet bereits Erfolg. Gemessen wird
      #  deshalb auf JOB-Ebene (Job „backup“) und am jüngsten Lauf, der
      #  SCHRITTE HAT – ein `skipped`-Lauf mit 0 Schritten (Job-Guard auf
      #  fremdem Branch) ist kein Zeuge, sondern ein Platzhalter.
      #
      #  Warum dieser Schritt NICHT anstößt: Das Dispatch-Recht liegt genau
      #  einmal, im Schritt „Selbstheilung – fehlende Sicherung anstoßen“
      #  darüber. Zwei Schritte mit Recht wären zwei Wege zu einem Doppellauf.
      #  Dieser Schritt liest nur (`--leerlauf`), startet nichts und ist damit
      #  auch dann harmlos, wenn die Heilung gerade einen Lauf angestoßen hat.
      #
      #  Der Name ist Absicht: Das Fehler-Alerting erkennt die Klasse
      #  `backup-leerlauf` am stabilen Wortteil „Leerlauf prüfen“ – nicht am
      #  Wort „Selbstheilung“, das hier zwei verschiedene Ursachen deckte
      #  (ein Werkzeugfehler der Heilung ist der Frische-Fall, kein Leerlauf).
      # ================================================================
      - name: Leerlauf prüfen – grüner Lauf ohne Sicherung (fail-closed)
        if: ${{ !cancelled() }}
        env:
          # Nur der Lauf-Token: Die Prüfung liest Läufe und Jobs des EIGENEN
          # Repos. Ziel und Passphrase sieht sie ausschließlich als „gesetzt /
          # nicht gesetzt“ – sie liest keine Werte und gibt keine aus.
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BACKUP_REPO: ${{ vars.BACKUP_REPO }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          # #1030: Der Befund der Einrichtungsprüfung – die Ursache, nicht die
          # Vermutung. Ist der Schritt oben rot geworden, steht hier die Liste
          # der offenen Punkte; ist er grün geworden, ist der Wert LEER
          # („geprüft, nichts offen“). Beides ist eine Auskunft.
          OFFENE_EINRICHTUNG: ${{ steps.setup.outputs.offene_einrichtung }}
          # Nachschärfung 12.11.2026: Ein leerer Wert oben sieht genauso aus,
          # wenn der Schritt übersprungen wurde oder abgestürzt ist. Erst
          # dieser Beleg („ja“) macht aus „leer“ die Auskunft „nichts offen“.
          EINRICHTUNG_GEPRUEFT: ${{ steps.setup.outputs.einrichtung_geprueft }}
        run: |
          # Ohne Beleg der Einrichtungsprüfung gibt es KEINE Auskunft: Die
          # Variable wird entfernt, der Prüfer liest „niemand weiß es“ und
          # endet mit Exit 2 (rot) – statt aus einem leeren Feld „alles
          # eingerichtet“ zu lesen und aus alten Jobs zu raten.
          if [ "${EINRICHTUNG_GEPRUEFT:-}" != "ja" ]; then
            unset OFFENE_EINRICHTUNG
          fi
          # #1030 (10.11.2026): Die Einrichtungsprüfung davor hat ihren Befund
          # in `OFFENE_EINRICHTUNG` hinterlassen. Sie bekommt Vorrang – sie ist
          # die URSACHE. Ohne sie gäbe es keinen einzigen Satz, der hier stimmt;
          # deshalb wird ohne Auskunft NICHT geraten (der Prüfer endet dann mit
          # Exit 2, geraten wäre er bei Exit 0 oder 4).
          if [ -n "${OFFENE_EINRICHTUNG:-}" ]; then
            echo "::notice title=Backup-Leerlauf::Die Einrichtung ist offen (${OFFENE_EINRICHTUNG}) – die Ursache trägt der Schritt „Voraussetzungen prüfen“. Hier wird deshalb kein zweiter Rat vergeben (ein grüner Job kann nicht entstehen, solange die Sicherung nicht eingerichtet ist)."
            exit 0
          fi
          set +e
          python3 scripts/backup_selbstheilung.py --leerlauf
          RC=$?
          set -e
          # 0 = kein Befund auf Job-Ebene                        → grün
          # 1 = Rückweg-Nachweis fehlt/übersprungen              → ROT (mit Beleg)
          # 2 = Prüfung nicht entscheidbar (API/Format)          → ROT (C33)
          # 4 = ein Lauf ist grün, gesichert wurde aber NICHTS   → ROT, eigener Rat
          if [ "$RC" = "1" ]; then
            echo "::error::Der Rückweg-Nachweis ist nicht belegt (Exit 1) – Details in der Job-Zusammenfassung."
            exit 1
          fi
          if [ "$RC" = "2" ]; then
            echo "::error::Die Leerlauf-Prüfung konnte nicht entscheiden (Exit 2) – Anleitung: docs/ANLEITUNG-OFFSITE-BACKUP.md"
            exit 1
          fi
          if [ "$RC" = "4" ]; then
            echo "::error title=Backup-Leerlauf::Ein Lauf ist grün, gesichert wurde aber nichts (kein dauerhaftes Ziel bzw. keine Passphrase). Das ist kein Erfolg: Es existiert nur eine 7-Tage-Kurzzeitkopie im selben Konto. Weg: docs/ANLEITUNG-OFFSITE-BACKUP.md, Schritte 1–7."
            exit 1
          fi
          exit 0

      #  SCHLUSSURTEIL (WF-3150 / #1030, 07.11.2026)
      #  ------------------------------------------------------------
      #  Der einzige Schritt, der wegen der Frische rot werden darf – und
      #  zwar NACH der Selbstheilung: Grün gibt es nur, wenn die zweite
      #  Messung ein frisches Release sieht. Ein angestoßener Lauf, ein
      #  „die Sicherung läuft schon“ oder ein lesbares Gefühl sind kein
      #  Nachweis. Unlesbares Ergebnis = rot (kein Freibrief).
      #  `always()`, damit ein Fehler in der Selbstheilung das Urteil
      #  nicht verschluckt – der Schritt beweist nichts nach, er liest nur.
      # ================================================================
      - name: Urteil fällen (fail-closed – ohne Nachweis kein Grün)
        if: ${{ always() && steps.messung.outputs.gemessen == 'true' }}
        run: |
          set -euo pipefail
          ENDGUELTIG=/tmp/frische.json
          if [ -s /tmp/frische_final.json ]; then ENDGUELTIG=/tmp/frische_final.json; fi
          echo "Urteilsgrundlage: $ENDGUELTIG"
          set +e
          python3 - "$ENDGUELTIG" <<'PYEOF'
          import json, sys
          from pathlib import Path
          pfad = Path(sys.argv[1])
          try:
              daten = json.loads(pfad.read_text(encoding="utf-8"))
              urteil = daten.get("urteil")
          except Exception as fehler:  # noqa: BLE001
              print("::error title=Backup-Frischwache::Urteil nicht lesbar "
                    f"({fehler}) – ohne Messung kein Gruen. Anleitung: docs/ANLEITUNG-OFFSITE-BACKUP.md")
              sys.exit(1)
          if urteil not in ("ok", "warnung", "fehler"):
              print("::error title=Backup-Frischwache::Das Urteil fehlt oder ist unbekannt – "
                    "ohne Messung kein Gruen. Anleitung: docs/ANLEITUNG-OFFSITE-BACKUP.md")
              sys.exit(1)
          if urteil == "fehler":
              print("::error title=Backup-Frischwache::Backup ueberfaellig oder unpruefbar – RPO verletzt. "
                    "Die Selbstheilung ist gelaufen (Entscheidung, Anstoss und zweite Messung stehen "
                    "in der Summary). Bleibt es rot, ist es eine echte Stoerung. "
                    "Anleitung: docs/ANLEITUNG-OFFSITE-BACKUP.md")
              sys.exit(1)
          if urteil == "warnung":
              print("::warning title=Backup-Frischwache::Fruehwarnung (ueber 36 h) – noch kein Ausfall, "
                    "aber beobachten. Die Selbstheilung hat nachgemessen.")
          sys.exit(0)
          PYEOF
          RC=$?
          set -e
          exit "$RC"
