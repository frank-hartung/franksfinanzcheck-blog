# ============================================================
#  BLOG-DOKTOR – Wochenvisite der gesamten Automatik (Profi-Level)
#
#  Frank-Beschluss 12.08.2026: ‚Selbstheilung mit Automatik auf
#  Profi-Level fuer die GESAMTE Blogautomatik.'
#
#  Einmal pro Woche (Mittwoch 08:45 MESZ) laeuft der Oberarzt die
#  komplette Wache-Kette in kanonischer Reihenfolge mit --fix.
#  Jede Wache hat eigenes Sabotage-Gate (Exit 2 = abbruchstark).
#  Der Doktor selbst bricht bei Exit 2 SOFORT ab + Issues bei Patrouille.
#
#  Nur wenn HARMLOSE Funde (Exit 1) heilen wurde, wird gecommittet.
# ============================================================
name: Blog-Doktor (Gesamt-Wochenvisite)

on:
  schedule:
    - cron: "45 6 * * 3"    # Mittwoch 08:45 MESZ (06:45 UTC)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: blog-doktor
  cancel-in-progress: false

jobs:
  doktor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Umgebung vorbereiten
        run: |
          python3 -m pip install -q fonttools brotli pillow pillow-avif-plugin 2>/dev/null || true

      - name: Oberarzt laeuft die komplette Kette durch (--fix)
        id: doc
        continue-on-error: true
        run: |
          python3 scripts/blog_doctor.py --fix 2>&1 | tee /tmp/doktor.txt
          exit ${PIPESTATUS[0]}

      - name: Dokumentation committen
        if: ${{ !cancelled() }}
        run: |
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add DOKTOR-REPORT.md data/doctor_history.jsonl data/*_history.jsonl
          git status --short || true
          # Nur heuristic Artefakte committen, wenn sich auch wirklich was getan hat.
          if git diff --cached --quiet; then
            echo "Kein Report-Update noetig."
          else
            git commit -m "chore: Wochenvisite BlogDoktor (Report + Rotations-Committen)"
            git pull --rebase --autostash origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            git push || { sleep 20; git pull --rebase origin main && git push; }
          fi

      - name: Issue bei Sabotage-Fehlschlag (Exit 2 einer Wache)
        if: ${{ steps.doc.outcome == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Mindestens eine Wache hat **Exit 2** gemeldet (Sabotage-Fehlschlag).\n\n';
            try { body += '```\n' + fs.readFileSync('/tmp/doktor.txt','utf-8').slice(-2000) + '\n```'; } catch(e) { body += '(Log-Schnitt nicht verfügbar)'; }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '🛑 Blog-Doktor: Wache hat Selbsttest fehlgeschlagen',
              body: body + '\n\n_Kein Schreiben wurde vorgenommen. Diese Wache ist programmiert NICHT zu starten._',
              labels: ['blog-doktor', 'sabotage'],
            });
            console.log('✅ Sirenen-Issue erstellt');
