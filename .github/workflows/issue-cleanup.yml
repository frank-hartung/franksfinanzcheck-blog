# ============================================================
#  ERLEDIGTE FEHLERMELDUNGEN ARCHIVIEREN (sperren statt löschen)
#
#  Sicherheitsaudit 14.10.2026 (M-08): Statt geschlossene Bot-Issues mit
#  einem Admin-PAT endgültig zu löschen, werden sie nach der Schonfrist
#  gesperrt und mit „archiviert“ gelabelt. Vorfallshistorie bleibt als
#  Nachweis erhalten; der GITHUB_TOKEN (issues: write) genügt.
#  Das Secret GH_PAT wird hier NICHT mehr benutzt – wenn kein anderer
#  Workflow es braucht, im Repo löschen und den PAT widerrufen.
#
#  Manuelle Ausführung: standardmäßig DRY-RUN.
# ============================================================
name: Erledigte Fehlermeldungen archivieren

on:
  schedule:
    - cron: "0 6 * * 1" # jeden Montag 06:00 UTC (Schonfrist 14 Tage)
  workflow_dispatch:
    inputs:
      grace_days:
        description: "Schonfrist in Tagen (0 = sofort archivieren)"
        required: false
        default: "14"
      dry_run:
        description: "Nur anzeigen ohne zu archivieren? (true/false)"
        required: false
        default: "true"

permissions:
  contents: read
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Geschlossene Fehlermeldungen archivieren (sperren + Label)
        env:
          GH_TOKEN: ${{ github.token }}
          GRACE_DAYS: ${{ github.event_name == 'schedule' && '14' || (github.event.inputs.grace_days || '14') }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (github.event.inputs.dry_run || 'true') }}
        run: bash scripts/cleanup_issues.sh
