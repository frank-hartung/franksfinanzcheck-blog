# ============================================================
#  CONTENT-ENGINE v2 (Autonome Content-Automatisierung, Top-Level)
#
#  WARUM NEU (08/2026): Die alte Automatisierung (daily-content.yml)
#  hatte 2 kritische Fehler:
#    1) Deploy-Trigger crashte (execSync ohne Import in
#       actions/github-script@v7) -> Artikel wurden committet, aber
#       NIE deployed.
#    2) Bei schwacher KI-Antwort: "3 Versuche ohne Profi-Niveau ->
#       Artikel wird übersprungen" -> 0 Artikel für den Tag.
#
#  LÖSUNG (Content-Engine v2):
#    - Fallback: Profi -> Relaxed (nur harte Kriterien) -> Draft-Rettung.
#      NIE ein Tag ohne neuen Artikel (im Zweifel als Entwurf).
#    - Multi-Modell-Rotation (Gemini <-> Groq) gegen Provider-Schwäche.
#    - ENGINE-STATUS.md + BOT-STATUS.md + Defizit-Issue (Phase 4).
#
#  Publikations-Frequenz (DAUERVORGABE): nur Mo/Mi/Fr, 2–3 LIVE-Artikel
#  (cadence_guard + MIN/MAX_ARTIKEL_PRO_TAG, Floor 2). Kein tägliches
#  Massen-Publizieren (Scaled-Content-Abuse-Risiko).
# ============================================================
name: Content-Engine v2

on:
  schedule:
    # Nur an Publikationstagen (Mo=1, Mi=3, Fr=5): 1 Haupt-Slot +
    # 2 Fallback-Slots im Tagesverlauf, falls ein Lauf an API-Limits o.ä.
    # scheitert (Selbstheilung).
    - cron: "10 6 * * 1,3,5"     # 08:10 MESZ – Haupt-Slot
    - cron: "10 14 * * 1,3,5"    # 16:10 MESZ – Fallback 1
    - cron: "40 17 * * 1,3,5"    # 19:40 MESZ – Fallback 2
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: content-bot
  cancel-in-progress: false

jobs:
  engine:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # WF-A535 (#590, 05.10.2026): Dieser Lauf schreibt 20–40 Minuten lang an
    # einem Bestand, an dem gleichzeitig Menschen (PR-Merges) und andere
    # Workflows arbeiten. Kollidiert eine maschinelle Heilung mit einer
    # fremden Fassung desselben Artikels, gewinnt die FREMDE, neuere Fassung
    # (`git_sync.sh`), der Artikel wird protokolliert und die Heilung
    # unmittelbar danach auf dem neuen Text nachgezogen
    # (`scripts/nachheilung.py`). Vorher starb daran der komplette
    # Tagesertrag: drei fertige Commits, nie gepusht (Run 37325495772).
    env:
      GIT_SYNC_BESTAND_POLICY: bestand-gewinnt
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7.0.1

      # COMMIT-IDENTITÄT FRÜH UND EINMAL (19.09.2026, Issue #316): Bisher setzte
      # jeder Commit-Schritt die Identität selbst. Läuft ein früher Schritt hart
      # ab (z. B. der Lock-HARD-STOP), werden die Phasen dazwischen übersprungen –
      # aber `if: ${{ !cancelled() }}`-Schritte wie „Persist final acceptance
      # corrections" laufen weiter und committen ohne Identität: Lauf und
      # Befund wurden dadurch schwerer lesbar als nötig (der echte Fehler war
      # Schritt 1, nicht der Commit). Eine Identität, einmal gesetzt, gilt für
      # alle späteren Schritte – der Befund bleibt sauber beim Verursacher.
      - name: Git-Identität für Bot-Commits setzen
        run: |
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"

      # ============ INTEGRITÄTS-LOCK (HARD STOP + BELEGTE SIGNATUR) ============
      # Zuerst der Safe, dann die Arbeit: Der Lock (integrity_guard.py)
      # bürgt, dass Kern-Layouts, CTA-Shortcodes und die Dienst-Wachen exakt
      # dem zuletzt SIGNIERTEN Stand entsprechen.
      #
      # 18.09.2026: Der Schritt hat KEIN `|| echo` – ein Sabotage-Verdacht,
      # der als „⚠ nicht kritisch" durchrutscht, ist kein Schutz, sondern
      # Deko (genau das war bis dahin im Oberarzt-Schritt der Fall).
      #
      # 19.09.2026 (Issue #316): Drift, der NUR daraus entsteht, dass eine
      # regulär gemergte Änderung nicht mit-signiert wurde, hat hier die
      # Produktion gestoppt (sechs FEST-Dateien aus PR #315). Deshalb heilt
      # dieser Schritt jetzt BELEGTES, committetes Drift der Klasse FEST
      # selbst (`--heal`) und committet die Signatur mit ihrer Akte – und
      # bleibt für alles andere hart:
      #   · KRITISCH (Sabotage-Schutz)     -> Exit 3, Mensch entscheidet
      #   · Laufzeit-Mutation (≠ HEAD)     -> Exit 3, Mensch entscheidet
      #   · neue kritische Datei ohne Sig. -> Exit 3, Mensch entscheidet
      # Zusätzlich hält das PR-Gate (integrity-lock.yml) den Drift schon
      # VOR dem Merge auf – hier bleibt er dann die Ausnahme.
      - name: Integritäts-Lock prüfen & belegten Drift signieren (HARD STOP bei Sabotage)
        run: |
          python3 scripts/integrity_guard.py --heal
          if ! git diff --quiet -- data/integrity_lock.json data/integrity_history.jsonl; then
            git config user.name "Content-Bot"
            git config user.email "content-bot@users.noreply.github.com"
            git add data/integrity_lock.json data/integrity_history.jsonl
            git commit -m "chore(integrity): Lock nach belegter Kernänderung neu signiert (Herkunft im Lock)"
            scripts/git_sync.sh --push-only
          fi

      - name: Python-Abhängigkeiten installieren
        run: |
          python3 -m pip install -q pyyaml cryptography pillow pillow-avif-plugin fonttools brotli
          sudo apt-get update -qq
          sudo apt-get install -y -qq hunspell hunspell-de-de

      # ================= PHASE 0: PRE-FLIGHT =================
      - name: Pre-Flight-Check (Syntax, Keys, Themenpool)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/bot_preflight.py
          echo "PREFLIGHT_OK=true" >> "$GITHUB_ENV"

      # ================= PHASE 0.5: KADENZ-SICHERUNG (26.08.2026) =================
      # SELBSTHEILUNG VOR JEDEM SLOT: (1) Kadenz-Gate muss lauffähig sein
      # (Selbsttest, sonst bricht der Lauf ab – ein kaputtes Gate darf
      # nicht still weiterarbeiten), (2) bestehende Verstöße gegen die
      # Dauervorgabe (Mo/Mi/Fr, 2–3/Tag, CADENCE-REPORT.md Regel 2) werden
      # SOFORT geheilt (Zurückstufung + Re-Queue), damit der heutige Slot
      # auf einer korrekten Tageszahl aufbaut und kein 4./5. Artikel live
      # gehen kann. Report: CADENCE-GATE-REPORT.md.
      #
      # URL-HYGIENE VOR DER KADENZ (PREMIUM-FIX 03.09.2026): Leerzeichen-
      # URLs (R8-URL-LEERZEICHEN) haben am 02.09.2026 einen fertigen
      # Re-Queue-Promotion-Kandidaten am Publish-Gate stoppen lassen. Hier
      # wird die Klasse deterministisch geheilt (--fix) und ausschließlich
      # dadurch blockierte holds werden entblockt (--heal-holds), BEVOR
      # cadence_guard promotet – so geht kein Post mit heilbarem
      # URL-Fehler live bzw. in die Kapazität.
      #
      # QUALITY-HOLD-SELBSTHEILUNG (PREMIUM-FIX #251, 11.09.2026): Holds mit
      # `cadence_grund: "quality-score: …"` stammten aus zwei behobenen
      # Score-Fehlern (Fazit-/FAQ-Schablonen → uniqueness 0.0; Wörterbuch-
      # Lücken → spelling 0.00). Sie werden hier NEU bewertet: erreicht der
      # Score wieder ≥ 0.80, wird der Hold in eine Re-Queue verwandelt
      # (cadence_wait: true) und durchläuft beim nächsten Schritt den vollen
      # Gate-Durchlauf. Falsch geparkte Artikel verstopfen so nie wieder
      # dauerhaft die Pipeline.
      - name: Phase 0.5 – Kadenz-Gate sicherstellen (Selbsttest + Selbstheilung)
        # PREM-AUDIT 26.08.2026: nach jeder Kadenz-Heilung (Zurückstufung
        # → draft, URL verschwindet aus dem Build) sofort die kontextuellen
        # Links auf die betroffenen Posts in andern live Artikeln entlinken
        # (draft_link_healer) – IM SELBEN COMMIT, damit der Push nie defekte
        # interne Links nach main bringt (Issue #85).
        #
        # WACHE-609: Die Hold-Requeue heilt seit dem 07.10.2026 auch die
        # Lesbarkeits-Klasse (Flesch ≥ 60) – dafür braucht sie DIESELBEN
        # Keys wie Phase 2. Ohne sie bliebe der Hold bis zur Phase-2-Heilung
        # liegen und der Slot bliebe in der Frühphase unbesetzt (genau die
        # 1/2-Lage, aus der die Produktions-Wache entstand).
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/fix_url_hygiene.py --selftest
          python3 scripts/fix_url_hygiene.py --fix
          python3 scripts/fix_url_hygiene.py --heal-holds
          python3 scripts/requeue_quality_holds.py --selftest
          python3 scripts/requeue_quality_holds.py --fix
          python3 scripts/fix_cta_hygiene.py --selftest
          python3 scripts/r5_absatz_splitter.py --selftest
          python3 scripts/cadence_guard.py --selftest
          python3 scripts/cadence_guard.py --fix
          python3 scripts/fm_boundary_guard.py --selftest
          python3 scripts/fm_boundary_guard.py --fix
          python3 scripts/draft_link_healer.py --selftest
          python3 scripts/draft_link_healer.py --fix
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          # 12.09.2026 (Premium-Audit): Die drei Gate-Reports sind gitignored
          # und nicht versioniert – `git add` darauf brach die Staging-Phase
          # hart ab und hätte die Kadenz-Heilungen in content/ SWELLEND
          # verworfen (schwerster Interferenzfall im Audit).
          git add content/
          if git diff --cached --quiet; then
            echo "Kadenz-Gate: Bestand bereits konform."
          else
            git commit -m "fix(cadence): Kadenz-Selbstheilung vor Slot (Zurückstufung + Re-Queue)"
            scripts/git_sync.sh --push-only
          fi

      # ================= PHASE 1: GENERIEREN (Multi-Fallback) =================
      - name: Phase 1 – Artikel generieren (Engine v2, 3 Ebenen)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_AUTHOR: ${{ vars.BLOG_AUTHOR }}
          AFFILIATE_URL: ${{ vars.AFFILIATE_URL }}
          MAX_ARTIKEL_PRO_TAG: ${{ vars.MAX_ARTIKEL_PRO_TAG || '3' }}
          MIN_ARTIKEL_PRO_TAG: ${{ vars.MIN_ARTIKEL_PRO_TAG || '2' }}
          # Freigabe-Modus (13.08.): Default "profi" = nur Artikel mit
          # bestandenem Profi-Qualitäts-Gate werden automatisch veröffentlicht.
          # Es gibt keine abgeschwächte Zwischenstufe mehr (Relaxed am
          # 13.08.2026 entfernt) – jede Qualitäts-Rettung bleibt Entwurf für Frank.
          # "0" = immer manuell, "1" = alte Vollautomatik (Settings -> Secrets
          # and variables -> Actions -> Variables -> AUTO_PUBLISH).
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'profi' }}
          PIN_TOPICS: "1"
        run: python3 scripts/engine_generate.py

      # INDEX-HYGIENE DEFENSE-IN-DEPTH (Issue #463): Die Content-Engine darf
      # keinen Entwurf mit Keyword-Tags committen. Der Deploy prüft den
      # fertigen Build erneut; hier stoppen wir die Quelle bereits vor Phase 1.
      - name: Taxonomie-Gate nach Generierung (kein Keyword-Tag-Leak)
        run: |
          python3 scripts/tag_governance.py --selftest
          python3 scripts/tag_governance.py --apply
          python3 scripts/tag_governance.py --check

      - name: Phase-1-Commit – sofort veröffentlichen (auch Entwürfe)
        run: |
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          # NUR committen, wenn sich wirklich etwas unter content/ geändert hat.
          # (ENGINE-STATUS.md etc. werden erst in Phase 5 committet – sonst
          # würde ARTIKEL_ERSTELLT fälschlich true und Phase 2/3 liefen ohne
          # neuen Artikel – inkl. unnötiger KI-API-Calls.)
          if git status --short content/ data/ | grep -q .; then
            # 12.09.2026 (Premium-Audit): pro Pfad ein eigener add-Aufruf
            # (Repo-Bugfix-Muster 14.08.2026) + Status-Dateien entfernt
            # (gitignored, nicht versioniert).
            git add content/ 2>/dev/null || true
            git add data/ 2>/dev/null || true
            git add static/images/covers/ 2>/dev/null || true
            git commit -m "content: neuer Artikel automatisch generiert und veröffentlicht"
            SYNC_OK_VAR=ARTIKEL_ERSTELLT scripts/git_sync.sh --push-only
            echo "✅ Phase-1-Commit: Artikel (oder Entwurf) veröffentlicht"
          else
            echo "Kein neuer Artikel – nichts zu committen."
            echo "ARTIKEL_ERSTELLT=false" >> "$GITHUB_ENV"
          fi

      # ================= PHASE 2: QUALITÄTS-KETTE (weich) =================
      - name: Phase 2 – Qualitäts-Kette (Hemingway, Gates, Cover)
        if: ${{ !cancelled() && env.ARTIKEL_ERSTELLT == 'true' }}
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "== Profi-Polish (KI) =="
          python3 scripts/profi_polish.py --new || echo "⚠ Polish-Fehler (nicht kritisch)"
          echo "== CTA-Hygiene direkt nach KI-Polish (kanonische Partner-Zeile, FIX #247) =="
          python3 scripts/fix_cta_hygiene.py --include-drafts || echo "⚠ CTA-Hygiene (nicht kritisch)"
          echo "== Zeilenumbruch-Generator (Profi-Level, selbstheilend) =="
          python3 scripts/fix_linebreaks.py || echo "⚠ Zeilenumbruch-Generator (nicht kritisch)"
          echo "== Gedankenstrich-vor-und-Generator (deterministisch, selbstheilend) =="
          python3 scripts/fix_dash_und.py --fix || echo "⚠ Gedankenstrich-Check (nicht kritisch)"
          echo "== Gedankenstrich-am-Zeilenende (deterministisch, selbstheilend) =="
          python3 scripts/fix_dash_eol.py --fix || echo "⚠ Gedankenstrich-EOL-Check (nicht kritisch)"
          echo "== Zeichenlängen-Gate (SSOT length_policy.py, Floor 10.000 Zeichen) =="
          python3 scripts/check_length.py --fix || echo "⚠ Längen-Check (nicht kritisch)"
          echo "== Leerzeichen-Generator (Profi-Level, selbstheilend) =="
          python3 scripts/fix_spaces.py || echo "⚠ Leerzeichen-Generator (nicht kritisch)"
          echo "== Rechtschreibung =="
          sudo apt-get install -y -qq hunspell hunspell-de-de >/dev/null 2>&1
          python3 scripts/spellcheck.py --fix || echo "⚠ Spellcheck-Fehler (nicht kritisch)"
          echo "== Grammatik (LT1–LT4, offline LanguageTool-Nachbau, ohne API) =="
          python3 scripts/grammar_check.py --fix --new-only || echo "⚠ Grammatik-Fehler (nicht kritisch)"
          echo "== Sprachglatt (DW1–DW9, offline DeepL-Write-Nachbau, ohne API, 25.09.2026) =="
          python3 scripts/sprachglatt.py --fix --new-only || echo "⚠ Sprachglatt (nicht kritisch)"
          echo "== Akronym-/Marken-/Tagschreibung (casing_guard: C1–C17 + T1, Selbsttest vor jedem Schreibvorgang) =="
          python3 scripts/casing_guard.py --fix --new-only || echo "⚠ Casing-Guard (nicht kritisch)"
          # CASING-VERBUND (PREMIUM 09.09.2026): Pin-Texte werden IMMER aus
          # data/pinterest_plan.yaml neu kopiert (pinterest_pin_text_sync).
          # Ohne Plan-Pass ware jede Casing-Heilung im Frontmatter nach dem
          # naechsten Sync weg – der Guard richtet daher zuerst die Quelle,
          # dann die Kopien, und prueft anschliessend als GATE: bleibt ein
          # harter Befund (C1/C4/C7/C9/C13/C15/T1), wird der Artikel als
          # Entwurf geparkt statt mit Sprachfehler live zu gehen.
          python3 scripts/casing_guard.py --fix --new-only --plan || echo "⚠ Casing-Guard Plan (nicht kritisch)"
          # STRUKTUR: Absatztext, der an eine Ueberschrift geklebt wurde, rendert
          # bei Hugo als fette Ueberschrift UEBER dem ganzen Absatz. Getrennt wird
          # nur an den drei beweisbaren Nahtstellen (Fettkoerper / Folgesatz nach
          # ?|! / Listenkopf mit Satzanfang + Verbbeleg); mehrdeutige Faelle
          # bleiben im Report stehen. Selbster Erklaerung: zweiter Lauf = 0.
          python3 scripts/casing_guard.py --split-headglue --new-only || echo "⚠ HeadGlue (nicht kritisch)"
          python3 scripts/pinterest_pin_text_sync.py --apply || echo "⚠ Pin-Sync (nicht kritisch)"
          python3 scripts/casing_guard.py --gate --new-only --plan || echo "🅿 Casing-Gate: Artikel bleibt Entwurf (Grund im CASING-REPORT)"
          echo "== Strich-Typografie (Dash-Guard: Duden-Niveau + KI-Schiedsrichter) =="
          python3 scripts/dash_guard.py --fix --ai --new-only || echo "⚠ Dash-Guard: Hinweise (nicht kritisch)"
          echo "== Komposita-Waechter (compound_guard.py: Keyword-Falle 'Preisgarantie Gas' etc.) =="
          python3 scripts/compound_guard.py --fix --ai --new-only || echo "⚠ Compound-Guard (nicht kritisch)"
          echo "== Einheiten-Guard (Hausstil: X € / X % mit NBSP) =="
          python3 scripts/unit_guard.py --fix --new-only || echo "⚠ Unit-Guard (nicht kritisch)"
          echo "== Emoji-Guard (Marken-Touchpoints + Mojibake-Scanner) =="
          python3 scripts/emoji_guard.py --fix || echo "⚠ Emoji-Guard (nicht kritisch)"
          echo "== Faktencheck-Schreibtisch (math_guard: Rechenbeispiele selbst verifizieren) =="
          python3 scripts/math_guard.py --fix --new-only || echo "⚠ Math-Guard (nicht kritisch)"
          echo "== Repetition-Guard (Premium: angrenzende Doppelwörter, idempotent) =="
          python3 scripts/repetition_guard.py --selftest
          python3 scripts/repetition_guard.py --fix --new-only || echo "⚠ Repetition-Guard (nicht kritisch)"
          echo "== Lektorat (Verlagsniveau: Doppelwoerter, Fuell-Phrasen, Person-Mix, Echo) =="
          python3 scripts/lektor_guard.py --fix --ai --new-only || echo "⚠ Lektorat (nicht kritisch)"
          echo "== Brand-Guard (Marken-Lock: Willkommenstext/Emojis/Disclaimer unantastbar) =="
          python3 scripts/brand_guard.py --fix || echo "⚠ Brand-Guard (nicht kritisch)"
          echo "== Laengen-Guard PILLAR-SCOPE (Silo-Seiten >= 2.500 Woerter) =="
          python3 scripts/length_guard.py --fix --ai --new-only --scope pillar || echo "⚠ Length-Guard Pillar (nicht kritisch)"
          echo "== Profi-Text-Gate =="
          python3 scripts/profi_text_check.py --new-only || echo "⚠ Profi-Gate (nicht blockierend)"
          echo "== Hemingway-Lesbarkeitscheck (kostenlos, lokal, ohne API) =="
          # Hemingway Editor bleibt die kostenlose manuelle Schlussrunde.
          # Der lokale Begleiter prüft nach allen Fixes deterministisch und
          # sendet keine Artikel an einen externen Dienst.
          python3 scripts/hemingway_check.py --new-only || echo "⚠ Hemingway-Gate (nicht blockierend)"
          echo "== Titel-Gate (check_titles, selbstheilend) =="
          python3 scripts/check_titles.py --fix || echo "⚠ Titel-Gate (nicht blockierend)"
          echo "== Keyword-Gate (Premium #303, Titel/Description/First-Para/H2/Dichte selbstheilend) =="
          python3 scripts/keyword_optimizer.py --selftest
          python3 scripts/keyword_optimizer.py --fix --new-only || echo "⚠ Keyword-Gate – Funde im Log (selbstgeheilt)"
          python3 scripts/keyword_gate.py --selftest
          python3 scripts/keyword_gate.py --fix --new-only || echo "⚠ Keyword-Gate (Premium) – Funde im Log (selbstgeheilt)"
          echo "== Cover generieren =="
          pip install -q pillow pillow-avif-plugin
          python3 scripts/generate_covers.py || echo "⚠ Cover-Fehler (nicht kritisch)"
          echo "== Einzigartigkeit =="
          python3 scripts/check_uniqueness.py || echo "⚠ Uniqueness (nicht blockierend)"
          echo "== Pinterest-Duplikat-Guard (P4 – Premium, 17.09.2026) =="
          python3 scripts/pinterest_duplicate_guard.py --fix || echo "⚠ Pinterest-Duplikat-Guard – Restfunde im Log"
          echo "== Same-Day-Zwillinge (Geburts-Wache, auto-heilend) =="
          python3 scripts/check_uniqueness.py --sameday --fix || echo "⚠ Same-Day-Twin geheilt: Zweitling → Entwurf (nicht kritisch)"
          echo "== Affiliate-Links (auto-korrigieren) =="
          python3 scripts/affiliate_link_check.py --fix || echo "⚠ Affiliate-Check (nicht blockierend)"
          echo "== Affiliate-Shield (/go/-Gateway + sponsored) =="
          python3 scripts/affiliate_shield.py --fix --new-only || echo "⚠ Affiliate-Shield (nicht kritisch)"
          python3 scripts/affiliate_marketer.py --fix --new-only || echo "⚠ Affiliate-Marketer (nicht kritisch)"
          echo "== Affiliate-Health Offline-Kontrakt (PIDs + Gateway-Drift + Selbsttest) =="
          python3 scripts/affiliate_health.py --no-net || echo "⚠ Affiliate-Kontrakt verletzt – Wochenwache repariert (siehe Report)"
          echo "== Link-Integritaet (relative Ziele + /go/-Register, Selbsttest) =="
          python3 scripts/link_guard.py --fix --new-only || echo "⚠ Link-Guard geheilt/gemeldet (nicht kritisch)"
          echo "== Font-Vertrag (die Datei beweist ihr Gewicht, nicht ihr Name) =="
          python3 -m pip install -q fonttools brotli 2>/dev/null || true
          python3 scripts/font_guard.py || echo "⚠ Font-Pakt (nicht kritisch)"
          echo "== Tabellen-Wache (Struktur + Zell-Splitter, Selbsttest) =="
          python3 scripts/table_guard.py --fix --new-only || echo "⚠ Tabellen-Funde gemeldet (nicht kritisch)"
          echo "== Redaktionelle Endabnahme (Profi-Gate G1-G5, Zertifikat) =="
          python3 scripts/redaktion_final.py || echo "⚠ Endabnahme: Funde im REDAKTION-FINAL-REPORT (nicht blockierend)"
          echo "== Oberarzt-Beweis nach der Geburt (Kette in Kanonfreiheit) =="
          # HARD STOP heißt HARD STOP (Folge-Befund 1, Qualitäts-Gate-
          # Vorfall 18.09.2026): Exit ≥ 2 des Doktors heißt Selbsttest- oder
          # Sabotage-Fehlschlag einer Wache – inkl. Exit 3 des Integritäts-
          # Locks, der in der Kette als Exit 2 weitergereicht wird. Der darf
          # NIEMALS in einem `|| echo "⚠ … (nicht kritisch)"` landen:
          # 15.–18.09. genau so geschehen – drei Tage HARD STOP, niemand
          # hat es gesehen. Funde (Exit 1) bleiben weich, wie gehabt.
          set +e
          python3 scripts/blog_doctor.py --new-only
          doktor_rc=$?
          set -e
          if [ "$doktor_rc" -ge 2 ]; then
            echo "::error::Blog-Doktor HARD STOP (Exit ${doktor_rc}): Sabotage-Verdacht oder gebrochener Integritäts-Lock. DOKTOR-REPORT.md / INTEGRITY-REPORT.md sichten, Lock ggf. neu signieren (python3 scripts/integrity_guard.py --set-current)."
            exit "$doktor_rc"
          fi
          if [ "$doktor_rc" -eq 1 ]; then
            echo "⚠ Doktor-Befund (nicht kritisch) – Funde im DOKTOR-REPORT.md"
          fi
          echo "== Qualitäts-Score (FrankAutoOps, Threshold >= 0.85) =="
          # S2-FIX (Agentur-Audit): `|| echo` gehörte auf dieselbe Zeile wie das
          # Heredoc-BEGINN. Vorher stand es als eigene Zeile nach `PYEOF` –
          # ungültige Shell-Syntax: Phase 2 lief ab hier "scheinbar grün" weiter,
          # aber Kommando nach `PYEOF` (Cover-Validierung, Kurzantworten,
          # Commit der Qualitäts-Fixes) wurden NIE ausgeführt.
          python3 - <<'PYEOF' || echo "⚠ Qualitäts-Score (nicht kritisch)"
          import glob, subprocess, sys, json, os
          import datetime
          sys.path.insert(0, "scripts")
          import quality_score as qs
          # SKOPUS-SCHUTZ (11.08. Spaet): nur HEUTE geborene Artikel bewerten.
          # Hintergrund: Der Block bewertete alle Posts; die Kombination aus
          # Schablonen-Blindheit + /go/-Blindheit parkte ploetzlich 42 Artikel.
          today = datetime.date.today().isoformat()
          files = []
          for f in sorted(glob.glob("content/posts/*/index.md")):
              head = open(f, encoding="utf-8").read()
              fm = head.split("---", 2)[1] if head.startswith("---") and head.count("---") >= 2 else ""
              if today in fm and "draft: false" in fm:
                  files.append(f)
          results = [qs.score_article(f) for f in files]
          low = [r for r in results if r["verdict"] == "draft+autofix"]
          review = [r for r in results if r["verdict"] == "human-review"]
          print(f"Qualitäts-Score: {len(results)} HEUTIGE Artikel | publish: {len(results)-len(low)-len(review)} | draft: {len(low)} | review: {len(review)}")
          if review:
              print(f"⚠ HUMAN REVIEW nötig: {[r['slug'] for r in review]}")
          # SABOTAGE-STOPFTRIEME: mehr als 3 Ein-Parkungen pro Lauf = Anomalie;
          # NIEMALS massenhaft parken (beim letzten Mal blog-breit 42 Artikel weg).
          if len(review) > 3 or len(low) > 3:
              print("🛑 QUALITY-CIRCUIT-BREAKER aktiv: Score-Anomalie erkannt – NICHTS wird geparkt/verworfen. Bitte Templates/Scorer prüfen (siehe QUALITAETS-REGELWERK).")
              sys.exit(0)
          # FIX 05.09.2026 (Wache #174): Die Review-Demotion setzt NICHT mehr
          # still draft:false→true. Ohne dokumentierten Grund galt der Post
          # als "manual"-Entwurf: unsichtbar für Kadenz-Wache, Re-Queue und
          # Heiler (Freitag 04.09.: 3 Profi-Artikel still demoted → Tag mit
          # 0 LIVE, Wache meldete "0 von Gates gehalten"). Jetzt: park_state.
          # hold() mit dokumentiertem Grund + schwächsten Score-Komponenten.
          try:
              import park_state as _ps
          except Exception:
              _ps = None
          for r in review:
              p = f"content/posts/{r['slug']}/index.md"
              c = open(p, encoding="utf-8").read()
              if "draft: false" in c:
                  schwach = ", ".join(
                      f"{k} {v:.2f}" for k, v
                      in sorted(r["parts"].items(), key=lambda kv: kv[1])[:3])
                  grund = (f"quality-score: Score {r['score']} < 0.80 "
                           f"(schwach: {schwach}) – Human-Review; "
                           f"Score-Defekte am 05.09. behoben (Wache #174)")
                  if _ps is not None:
                      _ps.hold(p, grund)
                  else:
                      open(p, "w", encoding="utf-8").write(
                          c.replace("draft: false", "draft: true", 1))
                  print(f"  → {r['slug']} auf draft+hold gesetzt "
                        f"(Score {r['score']}; {schwach})")
          PYEOF
          echo "== Cover-Validierung (auto-nachziehen) =="
          python3 scripts/check_covers.py --fix || echo "⚠ Cover-Varianten (nicht blockierend)"
          echo "== Kurzantworten (Featured-Snippet-Box) =="
          python3 scripts/generate_kurzantworten.py || echo "⚠ Kurzantworten (nicht kritisch)"
          echo "== URL-Hygiene (R8-URL-LEERZEICHEN selbstheilend, PREMIUM-FIX 03.09.2026) =="
          python3 scripts/fix_url_hygiene.py --fix || echo "⚠ URL-Hygiene – Restfunde siehe Log"
          echo "== Shortcode-Wache (WF-1F8C #522: keine Markdown-Links in Shortcode-Parametern) =="
          # Der Doktor oben ruft link_density_guard --fix und damit den Linker –
          # dieses Fangnetz verhindert, dass ein zerrissener Shortcode-Parameter
          # ({{< rechner typ="[…](…)"  >}} → Hugo-Build tot) jemals committet wird.
          python3 scripts/shortcode_guard.py --selftest
          python3 scripts/shortcode_guard.py --fix || echo "⚠ Shortcode-Wache – Restfunde siehe Log"
          # DUPLIKAT-GATE (Premium-Audit 12.09.2026): die Wache war nie
          # verdrahtet – dadurch konnten Intro-Duplikate KI-Entwuerfe
          # monatelang unentdeckt durchlaufen. Neue Artikel werden hier
          # deterministisch bereinigt VOR dem Commit; Restfunde (weiche
          # Near-Duplikate < 0.92) heilt die blog-health-daily naechstens.
          echo "== Duplikat-Wache (neue Artikel) =="
          python3 scripts/duplikat_guard.py --selftest
          python3 scripts/duplikat_guard.py --new-only --fix || echo "⚠ Duplikat-Wache – Restfunde im Log (naechste Heilung: blog-health-daily)"
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Qualitäts-Fixes."
          else
            git commit -m "content: Qualitäts-Fixes (Rechtschreibung, Grammatik, Cover, Polish)"
            scripts/git_sync.sh --push-only
            echo "✅ Folge-Commit: Qualitäts-Fixes gepusht"
          fi

      # ================= PHASE 3: SOFORT-OPTIMIERUNG =================
      - name: Phase 3 – Meta-Optimierung & interne Links
        if: ${{ !cancelled() && env.ARTIKEL_ERSTELLT == 'true' }}
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/meta_optimizer.py --fix --ai || echo "⚠ Meta-Fehler (nicht kritisch)"
          echo "== Keyword-Gate nach Meta-Optimierung (Premium #303, selbstheilend) =="
          python3 scripts/keyword_optimizer.py --fix --new-only || echo "⚠ Keyword-Gate – Funde im Log (selbstgeheilt)"
          python3 scripts/keyword_gate.py --fix --new-only || echo "⚠ Keyword-Gate (Premium) – Funde im Log (selbstgeheilt)"
          echo "== Titel-Gate nach Meta-Optimierung (selbstheilend) =="
          python3 scripts/check_titles.py --fix || echo "⚠ Titel-Gate (nicht blockierend)"
          echo "== Pinterest/Google-SEO-Healer (Titel, Cover-Text, Pin-SEO, Keywords) =="
          python3 scripts/pinterest_seo_healer.py --fix || echo "⚠ Pinterest-SEO-Healer (nicht blockierend)"
          echo "== Pinterest-Duplikat-Guard (finaler P4-Check nach Healer) =="
          python3 scripts/pinterest_duplicate_guard.py --fix || echo "⚠ Pinterest-Duplikat-Guard – Restfunde im Log"
          echo "== Cover-Stale-Erkennung: Titel geändert → Cover neu rendern =="
          python3 scripts/check_covers.py --fix || echo "⚠ Cover-Stale (nicht blockierend)"
          # Linker-Selbsttest VOR dem Schreiben (WF-1F8C #522: Shortcode-Parameter
          # sind Sperrzone) + Shortcode-Fangnetz danach – Schaden endet hier,
          # nie im Commit.
          python3 scripts/internal_linker.py --selftest
          python3 scripts/internal_linker.py --apply --max 5 || echo "⚠ Linker-Fehler (nicht kritisch)"
          python3 scripts/shortcode_guard.py --fix || echo "⚠ Shortcode-Wache – Restfunde siehe Log"
          echo "== Affiliate-Profi-Check (A1-A8, selbstheilend: CTA/E-E-A-T/Links) =="
          python3 scripts/affiliate_profi_check.py --fix || echo "⚠ Profi-Check (nicht blockierend)"
          echo "== URL-Hygiene nach Optimierung (R8-URL-LEERZEICHEN, PREMIUM-FIX 03.09.2026) =="
          python3 scripts/fix_url_hygiene.py --fix || echo "⚠ URL-Hygiene – Restfunde siehe Log"
          echo "== Finale CTA-Hygiene nach allen Rewrite-Heilern (FIX #247) =="
          python3 scripts/fix_cta_hygiene.py --include-drafts || echo "⚠ CTA-Hygiene – Restfunde siehe Log"
          echo "== Repetition-Wache nach allen Rewrite-Heilern (Issue #456) =="
          # Phase 2 heilt Doppelwoerter bereits VOR der Geburt (repetition_guard +
          # blog_doctor-Kette), aber Phase 3 schreibt danach noch einmal in den
          # Artikeltext (Keyword-Gate/-Optimizer ein zweites Mal, Pinterest-SEO-
          # Healer, interne Verlinkung, Affiliate-Profi-Check, CTA-Hygiene). Genau
          # eine erneute Keyword-Injektion war der reale Auslöser fuer "senken
          # senken" (#456) – ohne einen Sweep NACH diesen Heilern wuerde ein neu
          # entstandenes Doppelwort ungeheilt bis zur naechsten blog-health-daily
          # (naechster Tag) live bleiben statt schon vor DIESEM Commit zu heilen.
          python3 scripts/repetition_guard.py --selftest
          python3 scripts/repetition_guard.py --fix --new-only || echo "⚠ Repetition-Guard – Funde im Log (selbstgeheilt)"
          echo "== Faktenfrische: Erstrecherche BEI CONTENT-ERSTELLUNG (Agent Reach + Claude, 27.09.2026) =="
          # Auftrag Frank 27.09.2026: Jeder NEUE Artikel bekommt vor der
          # Veröffentlichung eine Internet-Recherche und eine Belegkette.
          # Geschrieben wird ausschließlich Frontmatter (`quellen`,
          # `faktencheck`) – der Artikeltext bleibt unberührt, fachliche
          # Befunde landen im FAKTENFRISCHE-REPORT.md.
          # Exit 3 = keine Quelle erreichbar → Warnung, kein Abbruch.
          # Der finale Publish-Gate-Collector ist dagegen hart: Ohne
          # `faktencheck` bleibt der Artikel als Hold erhalten und erreicht
          # weder Hugo-Auslieferung noch Release-Scorecard (WF-54C4/#583).
          python3 -m pip install -q feedparser >/dev/null 2>&1 || true
          python3 scripts/faktenfrische.py --selftest
          python3 scripts/faktenfrische.py --neu --apply || echo "⚠ Faktenfrische-Recherche nicht abgeschlossen – Publish-Gate hält Kandidaten zurück"
          echo "== Lesbarkeits-Heiler (Flesch >= 60, Tor T1-T4, fail-closed, WACHE-609) =="
          # Die Lesbarkeit ist ein HARTES Publish-Kriterium (#585) und war bis
          # zum 07.10.2026 der einzige Blocker ohne Heiler MIT Wirkung: Der
          # Vorrat stand bei 2/6, sieben Kandidaten allein an Flesch 53,1–59,9
          # geparkt, und der Publikationstag endete 1/2 (Produktions-Wache P2,
          # Issue #609). Der Heiler läuft hier auf die Artikel des Tages
          # (Phase 1) und lässt JEDEN Text byte-identisch liegen, den er nicht
          # nachweislich über die importierte Schwelle hebt – ein „Versuch“
          # schreibt sich nicht fest (fail-closed).
          python3 scripts/lesbarkeit_heiler.py --new-only --fix || echo "⚠ Lesbarkeits-Heiler – Restlücke im Log (fail-closed, nichts Halbfertiges geschrieben)"
          echo "== Politur-Ruinen-Heiler (R11/R13/R14, Tor T1-T4, fail-closed, WF-D4E0/#612) =="
          # Die Ruinen-Familie ist ein HARTES Publish-Kriterium (#482) und hatte
          # in KEINER Kette einen Schreiber: Der Kandidat
          # `2026-10-07-wie-smart-home-…` scheiterte einzig an „SATZ: | Thread |
          # …“ (Zertifikat: Qualität 0,95, alle übrigen Tore grün), blieb
          # liegen und der Reserve-Vorrat fiel unter das Ziel (roter
          # End-Gate). Der Heiler entfernt nur beweisbare Ruinen
          # (R11/R13/R14), lässt R12/R16 als Befund stehen und schreibt nie
          # etwas, das das Tor T1–T4 nicht erfüllt.
          python3 scripts/politur_ruine_heiler.py --new-only --fix || echo "⚠ Politur-Ruinen-Heiler – Restlücke im Log (fail-closed, nichts Halbfertiges geschrieben)"
          echo "== Hold-Requeue nach Heilung (PREMIUM-FIX 25.09.2026: Phase 0.5 rearmt VOR der Heilung – was Phase 2/3 heilt, würde sonst nie rearmt (stale Hold → 404)) =="
          python3 scripts/requeue_quality_holds.py --fix || echo "⚠ Hold-Requeue – Funde im Log"
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Optimierungs-Änderungen."
          else
            git commit -m "content: neuer Artikel sofort optimiert (Meta, interne Verlinkung)"
            scripts/git_sync.sh --push-only
            echo "✅ Optimierungs-Commit gepusht"
          fi

      - name: Phase 3 – IndexNow-Ping
        if: ${{ !cancelled() && env.ARTIKEL_ERSTELLT == 'true' }}
        continue-on-error: true
        run: python3 scripts/submit_indexnow.py || echo 

      - name: Hugo for final acceptance (Extended, verifiziert, mehrquellig)
        uses: ./.github/actions/install-hugo
        with:
          version: "0.164.0"

      # WF-A535 (#529, 02.10.2026): Alle drei Engine-Läufe des Tages starben
      # an derselben Stelle – nicht am Tagesdefizit, sondern am ERSTEN Build
      # der Endabnahme: Ein Markdown-Link in einem rechner-Shortcode-Parameter
      # (c181d75) tötete den Hugo-Build blog-weit, publication_release endete
      # im rohen Traceback, der Reserve-Refill lief nie – obwohl der Pool
      # 6/6 Kandidaten hatte. Der Linker ist seit WF-1F8C (#522) shortcode-
      # blind; diese Wache VOR der Endabnahme heilt auch bereits committeten
      # Schaden (gleiches Muster wie die Kadenz-Endkontrolle). publication_
      # release führt sie zusätzlich selbst aus – eine Quelle, alle Aufrufer.
      - name: "Shortcode-Wache vor der Endabnahme (WF-A535 #529)"
        run: |
          python3 scripts/shortcode_guard.py --selftest
          python3 scripts/shortcode_guard.py --fix

      - name: Final publication acceptance and reserve refill
        id: final_release
        continue-on-error: true
        run: |
          set +e
          python3 scripts/publication_release.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      # PRÄVENTION #462 (30.09.2026): Wer Entwürfe anfasst, erneuert ihren
      # Nachweis. Dieser Lauf heilt Reserve-Entwürfe (Politur, Rechtschreibung,
      # Links, Meta) und machte damit bisher das bytegebundene Reife-Zertifikat
      # ungültig – ohne es zu erneuern. Am nächsten Morgen meldete der
      # Bot-Watchdog „Zertifikat passt nicht mehr zum Entwurf" und die
      # Veröffentlichungslinie fand einen Pool, den sie nicht anfassen durfte.
      # Hier steht die komplette Messkette bereits (Hugo + hunspell), deshalb
      # kostet die Nachzertifizierung nur die tatsächlich geänderten Entwürfe.
      - name: Reserve-Zertifikat nachziehen (#462)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python3 scripts/reserve_recert.py --selftest
          python3 scripts/reserve_recert.py --fix || true

      # WF-A535 (#590, 05.10.2026): Dieser Schritt war die einzige Stelle der
      # Linie OHNE Fehlertoleranz – und damit die Stelle, an der ein Problem
      # sichtbar wurde, das 20 Minuten früher entstanden war. Er bleibt die
      # Wahrheitsinstanz (ein nicht gepushter Tagesertrag ist ehrlich rot),
      # aber er meldet die Ursache jetzt selbst, statt den Lauf wortlos
      # abzubrechen: `continue-on-error` + Auswertung im Abschluss-Schritt.
      # So laufen Nachheilung, Status und Defizit-Wache noch, und das
      # Fehlerticket nennt „Synchronisation" statt „API-Key prüfen".
      - name: Persist final acceptance corrections
        id: persist
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "content: finale Veröffentlichungsgates und geprüfte Reserve"
            scripts/git_sync.sh --push-only
          fi

      # WF-A535 (#590): Was der Bestand gewonnen hat, bekommt seine Heilung
      # zurück – im selben Lauf, auf dem NEUEN Text. Ohne diesen Schritt
      # bliebe ein fremd überschriebener Artikel bis zur nächsten
      # blog-health-daily ungeheilt (bis zu 24 h).
      - name: "Heilung nach Fremdänderung nachziehen (WF-A535 #590)"
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python3 scripts/nachheilung.py --selftest
          if python3 scripts/nachheilung.py --hat-arbeit; then
            python3 scripts/nachheilung.py --fix || echo "⚠ Nachheilung unvollständig – Auftrag bleibt im Protokoll"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "content: Heilung nach paralleler Bearbeitung nachgezogen"
              scripts/git_sync.sh --push-only
            else
              echo "Nachheilung ohne Änderung – der neue Textstand war bereits sauber."
            fi
          else
            echo "Kein Bestands-Artikel abgegeben – nichts nachzuheilen."
          fi

      # WF-A535 (#590): Ehrlichkeits-Wache. Ein Lauf, der lokal committet und
      # nie gepusht hat, sieht im Log aus wie ein Erfolg – genau das war der
      # Schaden. Diese Zeile macht den Unterschied zwischen „getan" und
      # „angekommen" sichtbar, auch wenn alles andere grün ist.
      - name: "Synchronstand prüfen (WF-A535 #590)"
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          git fetch -q origin main --prune --no-tags || true
          OFFEN=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 0)
          if [ "${OFFEN:-0}" -gt 0 ]; then
            echo "::warning::$OFFEN Commit(s) dieses Laufs sind NICHT auf main angekommen – siehe Schritt „Persist final acceptance corrections“ und git_sync-Meldung."
            git log --oneline origin/main..HEAD | sed 's/^/  nicht gepusht: /'
          else
            echo "✅ Synchron: alle Commits dieses Laufs liegen auf main."
          fi

      # ================= PHASE 4: STATUS & TAGESDEFIZIT (26.08.2026) =================
      # Reaktivierte verwaiste Wachen (Agentur-Audit S5): Der Lauf hält BOT-STATUS.md
      # aktuell und meldet am Tagesende ein Defizit gegen die Dauervorgabe
      # (Mo/Mi/Fr, MIN_ARTIKEL_PRO_TAG) als auto-zu-schließendes Issue. Läuft auch
      # nach Teilfehlern (if: always), damit ein Ausfall sichtbar wird.
      - name: Phase 4 – Status & Tagesdefizit-Wache
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_ARTIKEL_PRO_TAG: ${{ vars.MIN_ARTIKEL_PRO_TAG || '2' }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'profi' }}
        run: |
          python3 scripts/bot_status.py || echo "⚠ BOT-STATUS (nicht kritisch)"
          # Defizit-Wache: nur an Publikationstagen (Mo/Mi/Fr) einstellen, damit
          # Fr->So-Lücke (Wochenende) keinen Fehlalarm erzeugt.
          DOW=$(date +%u)
          if [ "$DOW" = "1" ] || [ "$DOW" = "3" ] || [ "$DOW" = "5" ]; then
            python3 scripts/engine_issue.py --deficit || echo "⚠ Defizit-Wache: kein Tagesdefizit (oder Fehler)"
          else
            echo "Kein Publikationstag ($DOW) – Defizit-Wache übersprungen."
          fi
          # 12.09.2026 (Premium-Audit): BOT-/ENGINE-STATUS sind gitignored und
          # nicht versioniert (bleiben im Lauf-Log/Audit-Report) – der frühere
          # Status-Commit wurde gestrichen. Status-Skripte laufen weiter.
          echo "BOT-STATUS/ENGINE-STATUS im Log verbleibend (nicht versioniert)."

      - name: Do not report a quota deficit as success
        if: ${{ !cancelled() }}
        run: |
          RC='${{ steps.final_release.outputs.rc }}'
          # WF-A535 (#590): Die dritte ehrlich rote Klasse ist der
          # SYNCHRONVERLUST – fertige Arbeit, die main nie erreicht hat.
          # Sie wird zuerst geprüft, weil sie die teuerste ist: Ein Lauf, der
          # produziert und nicht abliefert, sieht in jeder anderen Statistik
          # nach Erfolg aus (Run 37325495772: drei Commits, 23 Minuten Arbeit,
          # nichts auf main, Ticket riet zu API-Schlüsseln).
          if [ "${{ steps.persist.outcome }}" != 'success' ]; then
            echo "::error::SYNCHRONVERLUST (WF-A535 #590) – die Endabnahme konnte ihren Stand nicht nach main bringen. Ursache steht wörtlich im Schritt „Persist final acceptance corrections“ (git_sync.sh nennt Datei und Klasse: konflikt/schutz/auth/netzwerk). Kein Tagesdefizit, kein API-Key-Problem. Reparatur: docs/PFLICHT-CHECK-RUNBOOK.md bzw. den genannten Artikel von Hand angleichen."
            exit 1
          fi
          if [ "${{ steps.final_release.outcome }}" = 'success' ]; then
            exit 0
          fi
          # WF-A535 (#529): Die Endabnahme kennt zwei ehrlich rote Klassen –
          # Tagesdefizit (Exit 1) und Release-Crash (Exit 3). Die Klasse steht
          # als Annotation im Run, statt dass das Fehler-Ticket zu API-Keys
          # und GitHub-Status rät, während der Hugo-Build tot ist.
          case "$RC" in
            1)
              echo "::error::TAGESDEFIZIT – Endabnahme meldet LIVE unter dem Minimum (ehrlich rot). Lage und Ursachen: Schritt „Final publication acceptance“ bzw. python3 scripts/engine_capacity.py"
              ;;
            3)
              echo "::error::RELEASE-CRASH (WF-A535 #529) – Hugo-Build oder Gate-Werkzeug versagt; Diagnose und Hugo-Fehlerauszug stehen im Schritt „Final publication acceptance“. Kein Tagesdefizit, kein API-Key-Problem."
              ;;
            '')
              echo "::error::Endabnahme ohne Exit-Code fehlgeschlagen – siehe Schritt „Final publication acceptance“."
              ;;
            *)
              echo "::error::Endabnahme mit Exit $RC fehlgeschlagen – siehe Schritt „Final publication acceptance“."
              ;;
          esac
          exit 1
