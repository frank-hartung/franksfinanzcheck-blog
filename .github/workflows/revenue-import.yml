# ============================================================
#  REVENUE-IMPORT – die Umsatz-Pipeline abseits des Wochen-Takts
#
#  Warum ein eigener Workflow? Die Premium-Governance läuft wöchentlich (Mo).
#  Provisions-Aggregat und Klickzähler ändern sich aber zwischen zwei Montagen –
#  ein Trichter, der vier Tage alt ist, veraltet genau dort, wo er gebraucht
#  wird (Optimierungs-Entscheidungen, Sponsoring-Nachweise). Dieser Job liest
#  die versionierten Quellen und schreibt den Trichter neu; bewertet und
#  gemeldet wird weiterhin zentral über das Governance-Gate (Issue-Eskalation
#  = eine Stimme, nicht zwei).
#
#  Pipeline (2×/Tag): Abrechnungstabelle (Provisionen → Aggregat, nur wenn eine
#  Tabelle vorliegt) → Umsatz-Funnel. Die Klick-Quelle ist der eigene,
#  cookielose Zähler (data/klicks_eigen.json, scripts/klick_import.py); er ist
#  derzeit ausgeschaltet (data/klickmessung.yaml: `aktiv: false`) – der Funnel
#  meldet das als Betriebsgrenze, nicht als Fehler.
#  Der Trichter-Lauf erscheint zusätzlich in der Lauf-Zusammenfassung –
#  direkt lesbar, ohne Root-Müll (Reports sind gitignored).
#
#  Ehrliche Teilbarkeit (dasselbe Gesetz wie in den Skripten):
#    · Keine Tabelle / Zähler aus → Schritt sauber übersprungen, Lauf GRÜN,
#      der Funnel sagt „unbekannt“ (nie 0).
#    · Funnel-Lücken selbst → NIE rot; sie sind AMBER-Finding fürs Wochen-Gate.
#
#  Secrets: keine. Setup der Provisions-Tabelle: docs/UMSATZ-MESSUNG-PREMIUM.md
# ============================================================
name: Revenue-Import
on:
  schedule:
    # AUDIT 30.09. (Redundanz-Auflösung): war 4×/Tag (alle 6 h). Der
    # dokumentierte Bedarf ist TAGESFrische – kein Verbraucher im Repo liest
    # die Daten intraday (Scorecard/Funnel-Report wöchentlich, Kennzahlen-Radar
    # liest Research-Briefs, Pinterest-Feedback wöchentlich). 2×/Tag
    # (Morgenbericht + Abendbericht) genügt bei gleicher Aussagekraft; Montags
    # läuft zusätzlich die Messkette der Premium-Governance (05:15 UTC,
    # Nachweis-Prinzip).
    - cron: "10 4,16 * * *"   # 2×/Tag (06:10 + 18:10 MESZ)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: revenue-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python-Abhängigkeiten
        run: python3 -m pip install -q --require-hashes -r "$GITHUB_WORKSPACE/requirements-ci.txt" 2>/dev/null || true

      # Selbsttests zuerst: wenn ein Messer kaputt ist, sind alle Dateien
      # danach wertlos – lieber laut abbrechen als stille Falschdaten.
      - name: Selbsttests der Import-Skripte (Preflight)
        run: |
          fail=0
          for s in revenue_funnel click_chain_guard offline_import; do
            if ! python3 "scripts/$s.py" --selftest >/tmp/st_$s.log 2>&1; then
              echo "::error::Selbsttest $s fehlgeschlagen"; cat "/tmp/st_$s.log"
              fail=1
            fi
          done
          exit $fail

      # Die abgerechneten Monatssummen (data/provisionen/provisionen.csv,
      # gitignored – das Repo ist öffentlich) werden lokal gepflegt und mit
      # `npm run mess:import` in das versionierte Aggregat gezogen. Im CI liegt
      # die Roh-Tabelle nicht vor: der Schritt meldet dann „übersprungen“ und
      # der Trichter bleibt bei „unbekannt“ bzw. beim zuletzt committeten
      # Aggregat (nie bei 0).
      - name: Provisions-Abrechnung importieren (Monatssummen → Aggregat)
        run: |
          set +e
          python3 scripts/offline_import.py | tee /tmp/offline_import.log
          exit 0

      - name: Umsatz-Funnel neu berechnen (Lücken = Info, nicht Rot)
        run: |
          set +e
          python3 scripts/revenue_funnel.py | tee /tmp/funnel.log
          # Trichter meldet Messlücken bewusst als exit 1 – im Wochen-Gate ist
          # das ein AMBER-Finding, hier darf es den Import-Lauf nicht einfärben.
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 📈 Umsatz-Funnel (Laufzusammenfassung)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f REVENUE-FUNNEL-REPORT.md ]; then
            cat REVENUE-FUNNEL-REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            cat /tmp/funnel.log >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Aggregate committen
        if: always()
        run: |
          git config user.name "Revenue-Bot"
          git config user.email "revenue-bot@users.noreply.github.com"
          # Nur versionierte Datenpfade; die Roh-Tabelle ist gitignored (bewusst,
          # `git add` auf ignorierte Pfade würde das ganze Staging sprengen).
          git add data/revenue_funnel.json data/revenue_funnel_history.jsonl 2>/dev/null || true
          git add data/offline_import.meta.json data/provisionen_aggregat.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Revenue-Import: keine Änderungen."
          else
            git commit -m "revenue-import: Aggregate + Funnel (2× täglich)"
            scripts/git_sync.sh --push-only || echo "::warning::Push fehlgeschlagen – nächster Lauf versucht es erneut"
          fi
