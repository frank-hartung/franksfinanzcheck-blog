name: Blog-Gesundheits-Check (täglich)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: blog-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
      - run: pip install pyyaml
      - run: python3 scripts/blog_health_gate.py
      - run: |
          git config user.name "Agent (Arena.ai)"
          git config user.email "agent@franksfinanzcheck.de"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Änderungen – nichts zu pushen."
          else
            git commit -m "fix(auto): dauerhafte Blog-Gesundheit – Fehler geheilt"
            git pull --rebase --autostash origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            git push
          fi
