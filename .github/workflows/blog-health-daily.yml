name: Blog-Gesundheits-Check (täglich)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - run: pip install pyyaml
      - run: python3 scripts/blog_health_gate.py
      - run: |
          git config user.name "Agent (Arena.ai)"
          git config user.email "agent@franksfinanzcheck.de"
          git add -A
          git diff --cached --quiet || (git commit -m "fix(auto): dauerhafte Blog-Gesundheit – Fehler geheilt" && git push)
