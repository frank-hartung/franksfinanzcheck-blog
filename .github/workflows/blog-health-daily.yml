name: Blog-Gesundheits-Check (täglich)

on:
  schedule:
    - cron: "45 5 * * *"   # 07:45 MESZ – entzerrt (Profi-Cleanup 20.08.)
  workflow_dispatch: {}

permissions:
  contents: write
  # Das Einzigartigkeits-Audit führt seinen eigenen, deduplizierten Issue-
  # Lebenszyklus. Ohne diese eng begrenzte Berechtigung wäre ein kritischer
  # Live-Befund nur im Lauf-Log sichtbar und könnte unbemerkt liegen bleiben.
  issues: write

concurrency:
  group: blog-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - run: pip install -q --require-hashes -r "$GITHUB_WORKSPACE/requirements-ci.txt"

      # KADENZ-SICHERUNG (26.08.2026): die tägliche Wache stellt sicher,
      # dass die Dauervorgabe (Mo/Mi/Fr, 2–3 Artikel/Tag – CADENCE-REPORT.md
      # Regel 2) auch ZWISCHEN den Publishing-Slots eingehalten wird:
      # Selbsttest (Gate muss lauffähig sein) + Selbstheilung (Zurückstufung
      # + Re-Queue) + Titel-Gate (R1–R5) + Cover-Gate (Varianten, Stale,
      # Brand, C4 Text-Komplettheit). Heilungen landen im Commit unten.

      # URL-HYGIENE (PREMIUM-FIX 03.09.2026): R8-URL-LEERZEICHEN ist die
      # Fehlerklasse, die am 02.09.2026 einen fertigen Artikel am Publish-
      # Gate gestoppt hat (Tag: 1 statt 2–3 LIVE). Die Wache heilt solche
      # URLs deterministisch und entblockt ausschließlich dadurch gehaltene
      # Posts (Re-Queue) – VOR der Kadenz-Heilung, damit eine Promotion am
      # Publikationstag auf sauberem Content aufbaut.
      - run: python3 scripts/fix_url_hygiene.py --selftest
      - run: python3 scripts/fix_url_hygiene.py --fix || echo "⚠ URL-Hygiene – Restfunde siehe Log"
      - run: python3 scripts/fix_url_hygiene.py --heal-holds

      # CASING-GATE (PREMIUM 09.09.2026): Groß-/Kleinschreibung ist die
      # Fehlerklasse, die der KI-Pipeline am leichtesten durchrutscht
      # (Title-Case in Ueberschriften, „fritzbox“/„check24“ statt FRITZ!Box/
      # CHECK24, kleingeschriebene Tags). Laeuft ZWISCHEN den Publishing-Slots:
      # erst Selbsttest (die Wache muss decisiv sein), dann Heilung inkl.
      # Pinterest-Plan, dann die Gegenprobe. Ein harter Restbefund parkt den
      # Artikel nicht mehr – er ist laengst live –, sondern landet als
      # Report + Exit-1-Fingerabdruck im taeglichen Gesundheitsprotokoll.
      - run: python3 scripts/casing_guard.py --selftest
      - run: python3 scripts/casing_guard.py --fix --plan || echo "⚠ Casing – Restfunde im CASING-REPORT"
      - run: python3 scripts/casing_guard.py --split-headglue || echo "⚠ HeadGlue – mehrdeutige Fälle bleiben im Report"
      - run: python3 scripts/pinterest_pin_text_sync.py --apply || echo "⚠ Pin-Sync (nicht kritisch)"

      # GRAMMATIK-KONGRUENZ (Dauerbefund 30.10.2026, LT5/LT6): Der Artikel
      # 2026-10-24-etf-sparplan-… stand mit „Dein Schritt-für-Schritt-
      # Anleitung“ in Titel, H1, Cover und Pinterest – und alle Wachen meldeten
      # 0 Funde, weil LT1–LT4 Wendungen prüfen, keine Morphologie. Diese Stufe
      # prüft Kongruenz und Präpositions-Kasus gegen data/genus_lexikon.txt:
      #   1) Selbsttest (20 Fälle, Negativ-Fallen inklusive)
      #   2) Lexikon-Format (SSOT: Tags, Duplikate)
      #   3) Heilung im Fließtext und in der Description – nur bei genau einem
      #      zulässigen Ziel, nie bei mehrdeutigem Genus
      #   4) Titel-Heilung (`--fix-titel`) ebenfalls nur bei eindeutigem Beweis;
      #      der folgende check_covers-Schritt rendert die Bildvarianten neu,
      #      weil das Cover den Titel trägt. Idempotent: der zweite Lauf ist still.
      - name: Grammatik-Kongruenz (LT5/LT6, offline)
        run: |
          set -Eeuo pipefail
          python3 scripts/grammar_check.py --selftest
          python3 scripts/grammar_check.py --lexikon-pruefen
          python3 scripts/grammar_check.py --fix || echo "⚠ Grammatik – Restfunde siehe GRAMMATIK-REPORT.md"
          python3 scripts/grammar_check.py --fix-titel || echo "⚠ Titel-Kongruenz – Vorschlag steht im GRAMMATIK-REPORT.md"

      - run: python3 scripts/cadence_guard.py --selftest
      - run: python3 scripts/cadence_guard.py --fix
      - run: python3 scripts/check_titles.py --fix || echo "⚠ Titel-Gate – Funde im Log (R5 heilt nicht automatisch)"
      - run: python3 scripts/check_covers.py --fix || echo "⚠ Cover-Gate – Funde im Log"

      # ASSET-HEILUNG (Premium-Audit 11.09.2026): die Ratgeber-Seiten (pillar/*)
      # hatten gar keine Covers – og:image, Pin-It-Button und LCP-Bild fehlten
      # auf den wichtigsten Landingpages. generate_covers.py --pillars erzeugt
      # sie offline nach demselben Marken-Design wie die Artikelfcover (inkl.
      # 14 Varianten + cover:-Frontmatter mit preload: false, weil das
      # Pillar-Template das Cover nicht rendert). Der Lauf ist idempotent und
      # heilt damit auch nach einem manuellen Eingriff am nächsten Tag zurück.
      - run: python3 scripts/generate_covers.py --pillars || echo "⚠ Pillar-Cover – Funde im Log"
      # PWA-Grundlagen: Manifest + Icons werden aus hugo.toml abgeleitet – ohne
      # sie bleibt der registrierte Service Worker ohne Install-Prompt.
      - run: python3 scripts/generate_pwa_icons.py --selftest
      - run: python3 scripts/generate_pwa_icons.py || echo "⚠ PWA-Manifest/Icons – nichtkritisch"

      # TABELLEN-LESBARKEIT (30.09.2026, Frank-Befund Spar-Matrix): Die
      # Wache prüft, dass jede Tabelle AUSSERHALB von .post-content ihre
      # CSS-Lieferung wirklich bekommt (Klassen, Scope, Zellpolster,
      # Kopf-Fläche, Zeilentrenner, Mobilpfad) und kein toter Selektor
      # zurückbleibt. Kein Build, kein Browser – läuft in Sekunden.
      - run: python3 scripts/tabellen_lesbarkeit_guard.py --selftest
      - run: python3 scripts/tabellen_lesbarkeit_guard.py || echo "⚠ Tabellen-Lesbarkeit – Funde im TABELLEN-LESBARKEIT-REPORT.md"

      # ROOT-HYGIENE (12.09.2026): generierte Reports, die niemand liest, fliegen aus
      # dem Index (Datei bleibt auf der Platte, .gitignore deckt sie bereits), und
      # von Hand geschriebene Root-Berichte wandern nach docs/. Vor dem git add -A
      # unten, damit die Index-Änderung im selben Commit landet. Wache:
      # scripts/report_hygiene.py (--check prüft, --apply heilt).
      - run: python3 scripts/report_hygiene.py --selftest
      - run: python3 scripts/report_hygiene.py --apply || echo "⚠ Report-Hygiene – Restfunde im Log"

      # DRAFT-LINK-GATE (PREM-AUDIT 26.08.2026): heilt auch ZWISCHEN den
      # Publishing-Slots tote Post-Links (Kadenz-Heilung → URL weg aus dem
      # Build → kontextuelle Links defekt; Issue #85). Ankertext bleibt 1:1.
      - run: python3 scripts/draft_link_healer.py --selftest
      - run: python3 scripts/draft_link_healer.py --fix

      # TEXTVERSTÄNDNIS-WACHE (01.09.2026): hält das Premium-Level der
      # Textverständnis-Regeln R2–R8 DAUERHAFT – nicht nur am Publikationstag.
      # 1) Selbsttest (Guard muss lauffähig sein – Sabotage-Schutz)
      # 2) R8-Anker-Heiler (selbstheilend: Ankertext-Ziel-Kohärenz,
      #    deterministischer Kanon, kein freies KI-Rewriting)
      # 3) Komplett-Audit über alle Artikel → schreibt TEXTVERSTAENDNIS-REPORT.md
      #    (harte + weiche Funde; weiche Funde brechen den Workflow NICHT,
      #    werden aber im Report sichtbar und vom Heiler bereinigt).
      - run: python3 scripts/textverstaendnis_guard.py --selftest
      - run: python3 scripts/fix_r8_anker.py --selftest
      - run: python3 scripts/fix_r8_anker.py --fix || echo "⚠ R8-Anker-Heiler - Restfunde siehe TEXTVERSTAENDNIS-REPORT.md"
      - run: python3 scripts/textverstaendnis_guard.py

      # DUPLIKAT-WACHE (Premium-Audit 12.09.2026): Die Wache existierte,
      # war aber in KEINEM Workflow verdrahtet – 6 Artikel trugen Monate
      # lang Intro-Duplikate (KI-Fallback-Muster). Jetzt: taegliche
      # Selbstheilung im Bestand (exakte + Trennlinien-Muster + Nahe-
      # Kopien >= 0.92); Cross-Artikel-Check (D3/D4) ist Report-only.
      - run: python3 scripts/duplikat_guard.py --selftest
      - run: python3 scripts/duplikat_guard.py --fix || echo "⚠ Duplikat-Wache – Restfunde im Log"

      # KEYWORD-GATE (Premium #303): dauerhafte Heilung für Keyword-Lücken
      # (Titel/Description/First-Para/H2/Dichte) – nicht nur am Publikationstag.
      - run: python3 scripts/keyword_optimizer.py --selftest
      - run: python3 scripts/keyword_optimizer.py --fix || echo "⚠ Keyword-Gate – Restfunde im Log"
      - run: python3 scripts/keyword_gate.py --selftest
      - run: python3 scripts/keyword_gate.py --fix || echo "⚠ Keyword-Gate (Premium) – Restfunde im Log"

      # EINZIGARTIGKEITS-AUDIT (#490): Der Quartalslauf darf nicht der einzige
      # Ort sein, an dem ein Live↔Live-Duplikat auffällt. `continue-on-error`
      # ist hier bewusst: Ein bestehender Befund darf die deterministischen
      # Heilungen dieser täglichen Visite nicht am Commit hindern. Exit 1 wird
      # aber NICHT verschluckt, sondern direkt unterhalb als ein kanonisches
      # Issue mit vollem Beleg synchronisiert. Exit >= 2 bedeutet dagegen:
      # Selbsttest/Sabotage-Schutz defekt -> hart stoppen, nichts committen.
      - name: Einzigartigkeits-Audit (Bestand, täglich)
        id: uniqueness
        continue-on-error: true
        run: |
          set +e
          python3 scripts/check_uniqueness.py | tee /tmp/uniqueness_audit.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Audit-Sabotage-Schutz erzwingen
        if: steps.uniqueness.outputs.exit_code != '0' && steps.uniqueness.outputs.exit_code != '1'
        env:
          SCHRITT_UNIQUENESS_EXIT_CODE: ${{ steps.uniqueness.outputs.exit_code }}
        run: |
          echo "🛑 Einzigartigkeits-Audit konnte sich nicht selbst beweisen (Exit ${SCHRITT_UNIQUENESS_EXIT_CODE})."
          exit 2

      - name: Kritischen Bestandsbefund als einen Vorgang führen
        if: steps.uniqueness.outputs.exit_code == '1' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNIQUE_PRODUCTION_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: python3 scripts/uniqueness_issue_sync.py --status critical --report /tmp/uniqueness_audit.txt

      - name: Erledigten Bestandsbefund automatisch schließen
        if: steps.uniqueness.outputs.exit_code == '0' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNIQUE_PRODUCTION_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: python3 scripts/uniqueness_issue_sync.py --status clean

      - run: python3 scripts/blog_health_gate.py

      # ABGELEITETE ABBILDUNGEN (Dauerheilung 30.10.2026)
      # Die Bildzeilen der Top-20-Abbildungen werden aus Titel, Kernsätzen
      # und Abschnittsnamen ABGELEITET. Jeder Heiler oben (Titel-Gate,
      # Casing, Keyword-Optimizer, Duplikat-Wache, Lesbarkeit) kann sie
      # damit veralten lassen. Am 30.10.2026 stand genau das jedem fremden
      # Pull Request im Weg: FF5 meldete 21 Beiträge, obwohl der Fehler in
      # dieser Textpflege entstand. Deshalb hier – am Erzeuger, täglich:
      # erst Selbsttest (der Heiler muss sehen können), dann nachziehen,
      # dann die GEGENPROBE als hartes Gate. Was der Nachzug nicht heilen
      # kann, macht den Lauf rot – dann ist es ein echter Befund und kein
      # Nachziehfall.
      - run: python3 scripts/abbildungen_ableiten.py --selftest
      - run: python3 scripts/abbildungen_ableiten.py --nachzug
      - run: python3 scripts/abbildungen_ableiten.py --check

      # ROLLENPAARE (Dauerheilung 30.10.2026)
      # Zwei Seiten, die bewusst getrennt bleiben, sind eine Entscheidung –
      # und eine Entscheidung ohne Wache ist eine Behauptung. Diese Prüfung
      # verlangt für jedes dokumentierte Paar (Feld `paar` im
      # Entscheidungs-Register): eigene Struktur (keine gemeinsamen
      # Zwischenüberschriften, keine wörtlichen Sätze), eine nicht
      # überfällige Frist mit Eigentümer, den Rollenlink in beide Richtungen –
      # und ab 10 Impressionen eine Entscheidung, die die Nachfrage
      # beantwortet. Sie ersetzt keine Schwelle: Regel F bleibt unverändert
      # streng, die Alternative wird nur prüfbar.
      - run: python3 scripts/konsolidierung.py --selftest
      - run: python3 scripts/konsolidierung.py --rollenpaare

      - run: |
          git config user.name "Agent (Arena.ai)"
          git config user.email "agent@franksfinanzcheck.de"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Änderungen – nichts zu pushen."
          else
            git commit -m "fix(auto): dauerhafte Blog-Gesundheit – Fehler geheilt"
            scripts/git_sync.sh --push-only
          fi

      # FEHLTAG-WACHE (Dauerheilung #725, 13.10.2026): Als LETZTER Schritt –
      # nach Commit und Push, damit alle Heilungen oben gesichert sind –
      # prüft `--check` den Kalender. Ein Mindestziel-Fehltag (Mo/Mi/Fr mit
      # < 2 Live-Artikeln) im Prüffenster der letzten 3 Publikationstage macht
      # den Lauf ROT. `--fix` oben bleibt bewusst Heiler ohne Exit 1; erst
      # hier wird aus dem Report ein sichtbarer Alarm. Nachlieferung: siehe
      # Governance-Regel C23 und CADENCE-REPORT.md Regel 7.
      - name: Fehltag-Wache (Kadenz-Prüffenster, hartes Gate)
        run: python3 scripts/cadence_guard.py --check
