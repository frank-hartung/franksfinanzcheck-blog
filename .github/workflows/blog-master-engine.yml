name: Blog Master-Engine (Premium Agentur-Standard)

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Jeden Montag, Mittwoch und Freitag um 06:00 Uhr morgens ausführen
    - cron: '0 6 * * 1,3,5'
  workflow_dispatch:

jobs:
  master-pipeline:
    name: Consolidated Blog Orchestrator
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repository auschecken
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: 🐍 Python Umgebung einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: 🛠 Auto-Healing & Master Blog Engine ausführen
        run: |
          python scripts/master_blog_engine.py

      - name: 🚀 Hugo Umgebung einrichten & bauen (Unzerstörbarer Build)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: 🏗 Hugo Kompilierung (--buildFuture --buildDrafts --buildExpired)
        run: |
          hugo --buildDrafts --buildFuture --buildExpired --gc --minify

      - name: 🌐 Live-Deployment auf Webserver / GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

      - name: 📊 Detailliertes Dashboard in GitHub Actions ausgeben
        if: always()
        run: |
          echo "### 🚀 FranksFinanzcheck Master Engine Dashboard" >> $GITHUB_STEP_SUMMARY
          if [ -f "master_engine_summary.md" ]; then
            cat master_engine_summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Master Pipeline erfolgreich beendet." >> $GITHUB_STEP_SUMMARY
          fi
