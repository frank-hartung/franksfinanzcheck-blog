# ============================================================
#  TAGESZIEL 2 POSTS – tägliche Veröffentlichungs-Garantie
#  ------------------------------------------------------------
#  Betriebsregel (User, 12.08.2026): JEDEN Tag GENAU 2 Posts.
#
#  Drei Cron-Slots pro Tag (06:30 / 12:30 / 18:30 UTC) – damit ist
#  der Tag über mehrere Chancen abgedeckt (Selbstheilung: scheitert
#  ein Lauf an Rate-Limits o. Ä., übernimmt der nächste Slot).
#
#  Ablauf je Slot:
#    1) daily_post_guard.py --fill  – zählt heute veröffentlichte
#       Posts, generiert fehlende via Content-Engine (Profi→Relaxed
#       →Draft-Rettung; nie mehr als 2/Tag – Cap der Engine).
#    2) Qualitätskette (Spellcheck, Zeilenumbrüche, Titel, Cover,
#       Affiliate) – identisch zur Content-Engine Phase 2.
#    3) Commit + Push + Deploy-Dispatch (nur wenn Artikel entstanden).
#    4) Fehler → Exit 1 → alert-on-failure meldet (kein Stillversagen).
#
#  Concurrency: gleiche Gruppe wie content-engine-v2 ("content-bot") –
#  Läufe serialisieren sich, keine Doppel-Generierung.
# ============================================================
name: Tagesziel 2 Posts

on:
  schedule:
    - cron: "30 6 * * *"
    - cron: "30 12 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch: {}

concurrency:
  group: content-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sicherstellen:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Fehlende Posts generieren (Tagesziel-Guard, selbstheilend)
        id: guard
        run: |
          python3 scripts/daily_post_guard.py --fill
          echo "EXIT=$?" >> "$GITHUB_ENV"

      - name: Qualitätskette (nur wenn Artikel erstellt)
        if: env.EXIT == '0'
        run: |
          sudo apt-get install -y -qq hunspell hunspell-de-de >/dev/null 2>&1
          python3 scripts/fix_linebreaks.py || true
          python3 scripts/fix_spaces.py || true
          python3 scripts/spellcheck.py --fix || true
          python3 scripts/check_titles.py --fix || true
          python3 scripts/check_covers.py --fix || true
          python3 scripts/affiliate_link_check.py --fix || true
          python3 scripts/affiliate_profi_check.py --fix || true
          python3 scripts/internal_linker.py --apply --max 3 || true
          python3 scripts/pinterest_check.py --fix || true

      - name: Artikel committen + pushen
        if: env.EXIT == '0'
        run: |
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine neuen Artikel – Ziel bereits erreicht."
          else
            git commit -m "content: Tagesziel 2 Posts – fehlende Artikel automatisch generiert"
            git pull --rebase --autostash origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            git push
            echo "ARTIKEL_ERSTELLT=true" >> "$GITHUB_ENV"
          fi

      - name: Deploy anstoßen (nur bei neuem Content)
        if: env.ARTIKEL_ERSTELLT == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const last = execSync('git log -1 --format=%s').toString().trim();
            if (!last.startsWith('content:')) {
              console.log('Kein Content-Commit – kein Deploy nötig.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
            });
            console.log('✅ Deploy ausgelöst.');

      - name: Ziel-Status loggen
        if: always()
        run: |
          python3 scripts/daily_post_guard.py
          echo "Tagesziel-Slot abgeschlossen."
