# ============================================================
#  OFFSITE-BACKUP – privat, verschlüsselt, nachweisbar
#  ------------------------------------------------------------
#  MARKE (20.09.2026, Marken-Oberflächen-Wache):
#    Backups dieses Repos verlassen das Haus NIE öffentlich.
#    Bis 20.09.2026 legte dieser Workflow jeden Nachtlauf ein
#    öffentliches Release mit `backup.bundle` + `worktree.zip` an
#    (14 Releases, vollständiger Quellstand zum Download). Diese
#    Release-Seiten wurden von Suchmaschinen indexiert und standen
#    bei einer Markensuche ("FranksFinanzcheck Frank Hartung") über
#    der Expertenpositionierung des Blogs. Die 14 Altbestände sind
#    auf ENTWURF gestuft (privat, Assets erhalten) – Wache:
#    `scripts/brand_surface_guard.py` (fail-closed, mit Selbsttest).
#
#  KORREKTUR SICHERHEITSAUDIT 14.10.2026 (M-11):
#    · Artefakte ÖFFENTLICHER Repos kann jeder angemeldete GitHub-Nutzer
#      herunterladen – sie sind NICHT privat. Und sie liegen im selben
#      Konto: Bei Kontoverlust oder Repo-Löschung sind sie mit weg, also
#      kein Offsite-Schutz. Das Artefakt heißt deshalb jetzt ehrlich
#      „Kurzzeit-Kopie“, enthält nur unverschlüsselten öffentlichen Code
#      und lebt 7 statt 90 Tage.
#    · Die UNERSETZLICHEN Daten (Abonnenten, Einwilligungsnachweise nach
#      Art. 7 Abs. 1 DSGVO, Zähler) liegen in Cloudflare KV/D1. Sie sichert
#      der Job `kv-backup` – verschlüsselt und NUR in das private
#      Backup-Repo, NIE als Artefakt. Fehlen Ziel, Passphrase oder
#      Cloudflare-Zugang, wird der Job ROT (kein Schein-Grün).
#
#  WO DAS BACKUP HIN GEHT:
#    1. Kurzzeit-Kopie – Artefakt dieses Laufs, nur wenn kein dauerhaftes
#                Ziel konfiguriert ist und nur unverschlüsselter
#                öffentlicher Code (sonst würde die Passphrase offline
#                angreifbar). Kein Offsite-Schutz.
#    2. DAUERHAFT – privates Backup-Repository, wenn konfiguriert:
#                Repository-Variable `BACKUP_REPO` (z. B.
#                `frank-hartung/franksfinanzcheck-backup`) plus Secret
#                `BACKUP_REPO_TOKEN` (PAT mit Schreibrecht auf genau
#                dieses private Repo). Dort entsteht ein ENTWURF-Release.
#                Prüfung VOR dem Upload: Ist das Ziel öffentlich, bricht
#                der Lauf ab (fail-closed) – ein Backup darf keine
#                zweite Markenfläche werden.
#
#  VERSCHLÜSSELUNG:
#    Gesetztes Secret `BACKUP_PASSPHRASE` → alle Artefakte werden
#    AES-256 (PBKDF2, 200k Iterationen) verschlüsselt, mit
#    Entschlüsselungs-Probe gegen SHA-256 vor dem Upload. Ohne
#    Passphrase bleibt der Upload in ein dauerhaftes Ziel gesperrt,
#    solange nicht `BACKUP_UNVERSCHLUESSERT_OK=1` als
#    Repository-Variable bewusst gesetzt wurde.
#
#  QUELLE DES BACKUPS:
#    immer `main`. `gh-pages` ist ein regenerierbares Build-Artefakt
#    (deploy.yml, force_orphan) und hat keinen Backup-Wert – die
#    frühere `--all`-Falle (3,58 GB Bundle über der 2-GiB-Release-
#    Grenze, Issue #179) bleibt damit geschlossen.
#
#  WAS DER LAUF BEWEIST (statt es zu behaupten):
#    · Bundle verifiziert (`git bundle verify`), Archiv geprüft (`unzip -t`)
#    · Plausibilitätsgrenzen vor dem Upload (zu klein / zu groß = Abbruch)
#    · Verschlüsselung mit Rückweg-Probe (entschlüsseln + SHA-256-Vergleich)
#    · Ziel-Release nach dem Upload nachgelesen (Assets + Größen + `draft=true`)
#    · Regelprüfung am Ende: keine öffentliche Backup-Spur im Quell-Repo
#
#  EINRICHTUNG & DIAGNOSE (Vorgang WF-9E5A / #761, 15.10.2026):
#    Anleitung: docs/ANLEITUNG-OFFSITE-BACKUP.md (10 Minuten, Links
#    vorbelegt). Der KV-Job prüft jede Voraussetzung live mit
#    `scripts/backup_einrichtung.py` (E1–E8) und nennt in der
#    Job-Zusammenfassung zu jedem offenen Punkt den Link, unter dem er
#    erledigt wird. Ablaufende Zugänge melden sich 14 Tage vorher
#    (Schritt „Fristwarnung“) – nach der Sicherung, nicht statt ihr.
#    Beide Jobs laufen im Environment „backup“: Dort liegen die Secrets,
#    erreichbar nur für die freigegebenen Branches (Einstellung: nur main).
#
#  KOSTEN: 0 € (Artefakt-Speicher im Free-Kontingent, private Repos
#  unbegrenzt). Trigger: täglich 03:00 UTC + manuell.
# ============================================================
name: Offsite-Backup

on:
  schedule:
    # Täglich 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: offsite-backup
  cancel-in-progress: false

jobs:
  backup:
    # Defense in depth for E8: a workflow_dispatch from a feature branch must
    # never even start a job that receives backup credentials. The Environment
    # policy is still required, but this versioned ref gate prevents a changed
    # workflow file on another ref from reaching the secrets if that policy drifts.
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # WF-9E5A: Ohne dieses Environment sähe der Job die dort abgelegten
    # Secrets nicht und fiele still auf die Kurzzeit-Kopie zurück.
    environment: backup
    env:
      SRC_BRANCH: main
      # Ziel-Repository (privat!) aus der Repository-Variable – leer = nur Artefakt
      ZIEL_REPO: ${{ vars.BACKUP_REPO }}
      # Bewusstes Opt-in für unverschlüsselte Ablage in einem privaten Ziel
      UNVERSCHLUESSELT_OK: ${{ vars.BACKUP_UNVERSCHLUESSERT_OK }}
      PASSWORT: ${{ secrets.BACKUP_PASSPHRASE }}
      ZIEL_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
    steps:
      - name: Repository auschecken (komplette History)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The repo job uses a dedicated target token inline; do not leave
          # the source GITHUB_TOKEN in .git/config for later shell commands.
          persist-credentials: false

      - name: Bundle + Arbeitskopie erstellen, verifizieren, verschlüsseln
        run: |
          set -euo pipefail

          # Lokalen Source-Ref sicherstellen (workflow_dispatch auf Feature-Branch)
          git fetch --quiet origin "$SRC_BRANCH":refs/heads/"$SRC_BRANCH" 2>/dev/null || true

          git bundle create backup.bundle "$SRC_BRANCH"
          git bundle verify backup.bundle
          git archive --format=zip -o worktree.zip "$SRC_BRANCH"
          unzip -t worktree.zip > /dev/null

          BSIZE=$(stat -c%s backup.bundle)
          ZSIZE=$(stat -c%s worktree.zip)
          LIMIT=$((2 * 1024 * 1024 * 1024))   # 2 GiB (GitHub-Hartgrenze je Asset)
          WARN=$((1 * 1024 * 1024 * 1024))
          echo "backup.bundle = ${BSIZE} Bytes · worktree.zip = ${ZSIZE} Bytes"
          if [ "$BSIZE" -lt 100000 ] || [ "$ZSIZE" -lt 50000 ]; then
            echo "::error::Artefakt verdächtig klein (bundle=${BSIZE}, zip=${ZSIZE}) – Abbruch statt Schein-Backup."
            exit 1
          fi
          if [ "$BSIZE" -gt "$LIMIT" ]; then
            echo "::error::Bundle ${BSIZE} Bytes überschreitet die GitHub-Grenze (2 GiB). History aufräumen (git filter-repo) statt Backup umgehen."
            exit 1
          fi
          if [ "$BSIZE" -gt "$WARN" ]; then
            echo "::warning::Bundle ungewöhnlich groß (> 1 GiB) – Ursache prüfen."
          fi

          # Verschlüsselung (Standardweg, sobald das Secret gesetzt ist)
          if [ -n "$PASSWORT" ]; then
            for DATEI in backup.bundle worktree.zip; do
              openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
                -in "$DATEI" -out "$DATEI.enc" -pass env:PASSWORT
            done
            # Rückweg-Probe: Entschlüsseln und gegen den Klartext prüfen.
            for DATEI in backup.bundle worktree.zip; do
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
                -in "$DATEI.enc" -out "$DATEI.probe" -pass env:PASSWORT
              if ! cmp -s "$DATEI" "$DATEI.probe"; then
                echo "::error::Verschlüsselung von $DATEI ist nicht umkehrbar – Upload gestoppt."
                exit 1
              fi
              rm -f "$DATEI" "$DATEI.probe"
              echo "🔐 $DATEI.enc verifiziert (Entschlüsselung bytegleich, SHA-256 $(sha256sum "$DATEI.enc" | cut -c1-16)…)"
            done
            echo "VERSCHLUESSELT=1" >> "$GITHUB_ENV"
            echo "::notice::Backup verschlüsselt (AES-256/PBKDF2). Entschlüsseln: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in backup.bundle.enc -out backup.bundle"
          else
            echo "VERSCHLUESSELT=0" >> "$GITHUB_ENV"
            echo "::warning::Kein BACKUP_PASSPHRASE gesetzt – das Backup liegt unverschlüsselt (privat, aber ohne zweiten Boden)."
          fi

          # Welche Dateien gehen ins Backup? Genau die, die jetzt existieren –
          # Liste und Soll-Größen wandern in die Umgebung, damit die Nachprüfung
          # nach dem Upload gegen dieselbe Quelle vergleicht (kein Wunschdenken).
          ARTEFAKTE=""
          ERWARTET=""
          for DATEI in backup.bundle.enc backup.bundle worktree.zip.enc worktree.zip; do
            [ -f "$DATEI" ] || continue
            ARTEFAKTE="${ARTEFAKTE}${ARTEFAKTE:+ }$DATEI"
            ERWARTET="${ERWARTET}${ERWARTET:+,}$DATEI:$(stat -c%s "$DATEI")"
          done
          if [ -z "$ARTEFAKTE" ]; then
            echo "::error::Keine Backup-Datei erzeugt – Lauf abgebrochen."
            exit 1
          fi
          ERWARTET=$(printf '%s' "$ERWARTET" | tr ',' '\n' | sort | paste -sd, -)
          {
            echo "ARTEFAKTE=$ARTEFAKTE"
            echo "ERWARTET=$ERWARTET"
          } >> "$GITHUB_ENV"
          echo "Backup-Dateien: $ARTEFAKTE · Soll: $ERWARTET"

      # Audit M-11: Artefakte öffentlicher Repos sind für jeden angemeldeten
      # GitHub-Nutzer abrufbar und liegen im selben Konto. Deshalb nur als
      # Kurzzeit-Kopie, nur ohne dauerhaftes Ziel und nur unverschlüsselt
      # (öffentlicher Code) – verschlüsselte Dateien würden die Passphrase
      # offline angreifbar machen.
      - name: Kurzzeit-Kopie als Artefakt (öffentlicher Code, gleiches Konto – kein Offsite-Schutz)
        if: env.ZIEL_REPO == '' && env.VERSCHLUESSELT != '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repo-kurzzeitkopie-${{ github.run_number }}
          path: |
            backup.bundle
            worktree.zip
          retention-days: 7
          if-no-files-found: error

      - name: "Dauerhaftes Ziel – privates Backup-Repository (nur wenn konfiguriert)"
        id: offsite
        run: |
          set -euo pipefail

          if [ -z "${ZIEL_REPO:-}" ]; then
            echo "ZIEL=artefakt" >> "$GITHUB_OUTPUT"
            echo "::warning::Kein dauerhaftes Offsite-Ziel gesetzt – es gibt nur eine 7-Tage-Kurzzeitkopie im selben Konto (kein Offsite-Schutz). Repository-Variable BACKUP_REPO (privates Repo) + Secret BACKUP_REPO_TOKEN setzen: docs/ANLEITUNG-OFFSITE-BACKUP.md"
            exit 0
          fi

          if [ -z "${ZIEL_TOKEN:-}" ]; then
            echo "::error::BACKUP_REPO ist gesetzt, aber BACKUP_REPO_TOKEN fehlt – der aktuelle GITHUB_TOKEN darf kein Offsite-Ziel ersetzen. Upload gestoppt. Anleitung: docs/ANLEITUNG-OFFSITE-BACKUP.md"
            exit 1
          fi
          # Niemals auf den kurzlebigen GITHUB_TOKEN des Quell-Repos
          # zurückfallen: Er beweist weder Zugriff auf das Ziel noch dessen
          # Trennung. Der fein eingeschränkte Ziel-Token ist Pflicht.
          TOKEN="$ZIEL_TOKEN"
          echo "ZIEL=repo" >> "$GITHUB_OUTPUT"

          # 1) Privatheit des Ziels VOR dem Upload beweisen – fail-closed.
          #    Bei Fehlern die echte API-Antwort nennen (WF-9E5A): „Not Found“
          #    heißt Repo fehlt oder Token ohne Zugriff, „Bad credentials“
          #    Token ungültig/abgelaufen – nicht „öffentlich“.
          SICHTBAR=$(curl -sS -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$ZIEL_REPO" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('private') if 'private' in d else 'UNBEKANNT, API: ' + str(d.get('message', 'keine Antwort'))[:80])")
          if [ "$SICHTBAR" != "True" ]; then
            echo "::error::Ziel $ZIEL_REPO ist nicht nachweislich privat (Antwort: $SICHTBAR). Ein Backup wird nicht öffentlich abgelegt – Abbruch. Not Found = Repo fehlt oder BACKUP_REPO_TOKEN ohne Zugriff, Bad credentials = Token ungültig/abgelaufen. Anleitung: docs/ANLEITUNG-OFFSITE-BACKUP.md"
            exit 1
          fi
          echo "✅ Ziel $ZIEL_REPO ist privat (live geprüft über die API)."

          # 2) Unverschlüsselt in ein dauerhaftes Ziel nur mit bewusstem Opt-in.
          if [ "${VERSCHLUESSELT}" != "1" ] && [ "${UNVERSCHLUESSELT_OK}" != "1" ]; then
            echo "::error::Weder BACKUP_PASSPHRASE noch Opt-in BACKUP_UNVERSCHLUESSERT_OK gesetzt – dauerhafte Ablage gestoppt. Entweder Passphrase setzen (empfohlen) oder das Opt-in bewusst eintragen."
            exit 1
          fi

          TAG="backup-$(date +%Y%m%d-%H%M)"
          SHA=$(git rev-parse --short "$SRC_BRANCH")
          NOTES="Offsite-Backup (privat) · Quelle: main @ $SHA · $([ "$VERSCHLUESSELT" = "1" ] && echo 'AES-256/PBKDF2 verschlüsselt' || echo 'unverschlüsselt, Opt-in') · Entwurf bleibt privat"

          # 3) ENTWURF anlegen – nie ein öffentliches Release.
          GH_TOKEN="$TOKEN" gh release create "$TAG" \
            --repo "$ZIEL_REPO" \
            --draft \
            --title "Backup $TAG" \
            --notes "$NOTES"

          upload_mit_wiederholung() {
            local datei="$1" n
            for n in 1 2 3; do
              if GH_TOKEN="$TOKEN" gh release upload "$TAG" "$datei" --repo "$ZIEL_REPO" --clobber; then
                return 0
              fi
              echo "::warning::Upload von $datei fehlgeschlagen (Versuch $n/3) – neuer Versuch in 15 s"
              sleep 15
            done
            return 1
          }

          fehler=0
          for DATEI in $ARTEFAKTE; do
            upload_mit_wiederholung "$DATEI" || fehler=1
          done

          # 4) Nachprüfung: exakt die erwarteten Assets in exakter Größe UND
          #    Release weiterhin Entwurf (privat). Beides wird gelesen, nichts behauptet.
          GEMELDET=$(GH_TOKEN="$TOKEN" gh release view "$TAG" --repo "$ZIEL_REPO" \
            --json assets \
            --jq '[.assets[] | .name + ":" + (.size|tostring)] | sort | join(",")' 2>/dev/null || echo "kein-zugriff")
          ENTWURF=$(GH_TOKEN="$TOKEN" gh release view "$TAG" --repo "$ZIEL_REPO" \
            --json isDraft --jq '.isDraft' 2>/dev/null || echo "kein-zugriff")
          echo "Nachprüfung: draft=$ENTWURF · assets=$GEMELDET · soll=$ERWARTET"
          if [ "$fehler" -ne 0 ] || [ "$ENTWURF" != "true" ] || [ "$GEMELDET" != "$ERWARTET" ]; then
            echo "::error::Release $TAG ist unvollständig oder NICHT als Entwurf markiert (draft=$ENTWURF · ist=$GEMELDET · soll=$ERWARTET). Teil-Release wird entfernt."
            GH_TOKEN="$TOKEN" gh release delete "$TAG" --repo "$ZIEL_REPO" --yes --cleanup-tag || true
            exit 1
          fi
          echo "✅ Offsite-Backup $TAG liegt privat (Entwurf) und ist verifiziert: $GEMELDET"

      - name: Alte Backups aufräumen (letzte 14 je Ziel, Entwürfe eingeschlossen)
        if: ${{ always() }}
        run: |
          set -euo pipefail
          KEEP=14
          if [ -z "${ZIEL_REPO:-}" ]; then
            echo "Kein dauerhaftes Ziel – nichts aufzuräumen (die Kurzzeit-Kopie löscht GitHub nach 7 Tagen selbst)."
            exit 0
          fi
          if [ -z "${ZIEL_TOKEN:-}" ]; then
            # The upload step already failed closed. Never use the source
            # repository token merely to delete or enumerate an offsite repo.
            echo "::notice::Aufräumen übersprungen – BACKUP_REPO_TOKEN fehlt; kein Quell-Repo-Token wird für das Ziel verwendet."
            exit 0
          fi
          TOKEN="$ZIEL_TOKEN"
          GH_TOKEN="$TOKEN" python3 - "$ZIEL_REPO" "$KEEP" <<'PY'
          import json, os, subprocess, sys, urllib.request

          repo, keep = sys.argv[1], int(sys.argv[2])
          token = os.environ["GH_TOKEN"]
          anfrage = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases?per_page=100",
              headers={"Authorization": f"Bearer {token}",
                       "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(anfrage, timeout=30) as antwort:
              releases = json.load(antwort)

          # Entwürfe zählen mit – `gh release list` zeigt sie NICHT, deshalb die API.
          backups = sorted([r for r in releases if str(r.get("tag_name", "")).startswith("backup-")],
                           key=lambda r: r.get("created_at", ""))
          if len(backups) <= keep:
              print(f"Backup-Anzahl ({len(backups)}) im Rahmen (max. {keep}) – nichts zu löschen.")
              raise SystemExit(0)

          for alt in backups[: len(backups) - keep]:
              tag = alt["tag_name"]
              subprocess.run(["gh", "release", "delete", tag, "--repo", repo, "--yes", "--cleanup-tag"],
                             check=False)
              print(f"Altes Backup gelöscht: {tag}")
          PY

      - name: Regelprüfung – keine öffentliche Backup-Spur im Quell-Repository
        if: ${{ always() }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Doppelboden: selbst wenn ein Release-Pfad je wieder öffentlich schreibt,
          # schlägt dieser Lauf laut fehl (und die Wache heilt in ihrem Tageslauf).
          python3 scripts/brand_surface_guard.py --only releases --gate

      - name: Laufbericht in die Job-Zusammenfassung
        if: ${{ always() }}
        run: |
          {
            echo "## Offsite-Backup"
            echo ""
            echo "- Quelle: \`$SRC_BRANCH\` @ $(git rev-parse --short "$SRC_BRANCH" 2>/dev/null || echo '?')"
            echo "- Verschlüsselung: $([ "${VERSCHLUESSELT:-0}" = "1" ] && echo 'AES-256/PBKDF2 (Rückweg geprüft)' || echo 'keine (Passphrase fehlt)')"
            if [ -n "${ZIEL_REPO:-}" ]; then
              echo "- Dauerhaftes Ziel: \`$ZIEL_REPO\` (privat, Entwurf, nachgeprüft)"
            else
              echo "- Dauerhaftes Ziel: **nicht konfiguriert** – nur 7-Tage-Kurzzeitkopie als Artefakt (öffentlich abrufbar für angemeldete Nutzer, gleiches Konto, KEIN Offsite-Schutz)."
              echo "- Empfehlung: Variable \`BACKUP_REPO\` (privates Repo) + Secret \`BACKUP_REPO_TOKEN\` + Secret \`BACKUP_PASSPHRASE\`."
            fi
            echo "- Öffentliche Spur: keine (Regelprüfung \`brand_surface_guard.py\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  #  KV-/D1-BACKUP (Sicherheitsaudit 14.10.2026, M-11)
  #  ------------------------------------------------------------
  #  Sichert Abonnenten, Tokens und Einwilligungsnachweise aus Workers KV
  #  (optional D1) – verschlüsselt (AES-256/PBKDF2) und ausschließlich in
  #  das PRIVATE Backup-Repo (Entwurf-Release). NIE als Artefakt.
  #  Fail-closed: Fehlt eine Voraussetzung, ist der Job rot.
  #
  #  Einrichtung (einmalig): docs/ANLEITUNG-OFFSITE-BACKUP.md
  #    Secret   CF_KV_BACKUP_TOKEN   Cloudflare-API-Token NUR mit
  #                                  „Workers KV Storage: Read“ (+ „D1: Read“)
  #    Variable KV_NAMESPACE_ID_ABO  ID des KV-Namespace ABO
  #    Variable D1_DATABASE_ID       optional (Klick-Zähler)
  #    Secret   CLOUDFLARE_ACCOUNT_ID (vorhanden)
  #    Variable BACKUP_REPO + Secret BACKUP_REPO_TOKEN + Secret BACKUP_PASSPHRASE
  #  Secrets gehören in das Environment „backup“ (Branch-Regel: nur main).
  #  Prüfung: scripts/backup_einrichtung.py (E1–E8, live, mit Abhilfe-Links).
  # ============================================================
  kv-backup:
    name: KV-/D1-Backup (Abonnenten + Einwilligungsnachweise)
    # Defense in depth for E8: do not grant Environment secrets to a manual
    # dispatch on any ref other than the production branch. The live policy
    # remains part of the fail-closed setup contract and is checked separately.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: backup
    permissions:
      contents: read
      # Nur lesend: Die Einrichtungsprüfung (E8) liest die Schutzregeln des
      # Environments „backup“ – der Endpunkt verlangt „actions: read“.
      actions: read
    env:
      ZIEL_REPO: ${{ vars.BACKUP_REPO }}
      PASSWORT: ${{ secrets.BACKUP_PASSPHRASE }}
      ZIEL_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_KV_BACKUP_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID_ABO }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Selbsttest (Export, Probe, Einrichtungsprüfung – fail-closed)
        run: |
          python3 scripts/kv_backup.py --selftest
          python3 scripts/backup_einrichtung.py --selftest

      # WF-9E5A / #761: Statt nur „gesetzt?“ prüft jeder Punkt live, ob er
      # WIRKT (Ziel privat und erreichbar, Token aktiv, Namespace mit genau
      # diesem Token lesbar, Ablaufdaten). Offene Punkte → Annotation plus
      # Checkliste mit Links in der Job-Zusammenfassung, Exit 1. Der
      # Schrittname bleibt stabil: Das Alerting erkennt daran die Klasse
      # „Einrichtung unvollständig“ (Neustart hilft nicht).
      - name: Voraussetzungen prüfen (fail-closed – kein Schein-Grün)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/backup_einrichtung.py --pruefen

      - name: Exportieren, verschlüsseln, Rückweg prüfen
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/kv_backup.py --out kv-export.json
          python3 scripts/kv_backup.py --pruefen kv-export.json
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in kv-export.json -out kv-export.json.enc -pass env:PASSWORT
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in kv-export.json.enc -out kv-export.probe -pass env:PASSWORT
          cmp -s kv-export.json kv-export.probe || { echo "::error::Verschlüsselung nicht umkehrbar – Abbruch."; exit 1; }
          shred -u kv-export.json kv-export.probe 2>/dev/null || rm -f kv-export.json kv-export.probe
          echo "🔐 kv-export.json.enc ($(stat -c%s kv-export.json.enc) Bytes) – Entschlüsseln: openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in kv-export.json.enc -out kv-export.json"

      - name: Im privaten Backup-Repo ablegen (Entwurf) und nachprüfen
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          TAG="kv-backup-$(date -u +%Y%m%d-%H%M)"
          SOLL=$(stat -c%s kv-export.json.enc)
          # Teil-Releases nie stehen lassen: Sonst zählte die Aufbewahrung
          # unten eine kaputte Sicherung als gültige mit.
          aufraeumen() {
            gh release delete "$TAG" --repo "$ZIEL_REPO" --yes --cleanup-tag >/dev/null 2>&1 || true
          }
          if ! gh release create "$TAG" kv-export.json.enc --repo "$ZIEL_REPO" --draft \
              --title "$TAG" --notes "KV/D1-Export (verschlüsselt, AES-256/PBKDF2 600k). Lauf ${GITHUB_RUN_ID}."; then
            echo "::error::Ablage in $ZIEL_REPO fehlgeschlagen – hat BACKUP_REPO_TOKEN „Contents: Read and write“ auf genau dieses Repo? Teil-Release wird entfernt. Anleitung: docs/ANLEITUNG-OFFSITE-BACKUP.md"
            aufraeumen
            exit 1
          fi
          # Nachprüfung wie im Repo-Job: Größe UND Entwurf werden gelesen, nicht behauptet.
          GROESSE=$(gh release view "$TAG" --repo "$ZIEL_REPO" --json assets \
            --jq '.assets[] | select(.name=="kv-export.json.enc") | .size' 2>/dev/null || echo "kein-zugriff")
          ENTWURF=$(gh release view "$TAG" --repo "$ZIEL_REPO" --json isDraft --jq '.isDraft' 2>/dev/null || echo "kein-zugriff")
          if [ "$GROESSE" != "$SOLL" ] || [ "$ENTWURF" != "true" ]; then
            echo "::error::KV-Backup $TAG unvollständig oder kein Entwurf (Größe $GROESSE statt $SOLL Bytes · draft=$ENTWURF) – Teil-Release wird entfernt."
            aufraeumen
            exit 1
          fi
          echo "✅ $TAG abgelegt und nachgeprüft ($SOLL Bytes, Entwurf – privat)."
          # Aufbewahrung: die letzten 35 KV-Backups (5 Wochen täglich).
          gh api "repos/$ZIEL_REPO/releases?per_page=100" --jq '[.[] | select(.tag_name | startswith("kv-backup-"))] | sort_by(.created_at) | reverse | .[35:] | .[].tag_name' \
            | while read -r alt; do gh release delete "$alt" --repo "$ZIEL_REPO" --yes --cleanup-tag || true; done

      # WF-9E5A: Ein auslaufender Zugang meldet sich 14 Tage VORHER über das
      # normale Alerting – nach der Sicherung (nur wenn alles davor grün war),
      # statt die Sicherung eines Nachts still zu beenden. Unter 30 Tagen:
      # Hinweis; unter 14 Tagen: dieser Schritt rot, die Sicherung ist trotzdem da.
      - name: Fristwarnung – Zugänge rechtzeitig erneuern
        run: python3 scripts/backup_einrichtung.py --fristen
