# ============================================================
#  OFFSITE-BACKUP (kostenlos, GitHub-Releases)
#  ------------------------------------------------------------
#  Täglicher vollständiger Snapshot der QUELLE des Blogs als Release:
#    - backup.bundle  = komplette Git-History des main-Branches
#                       (git bundle main – eigenständiges Format,
#                        per `git clone backup.bundle` wiederherstellbar)
#    - worktree.zip   = Arbeitskopie (alle getrackten Dateien)
#
#  WARUM NUR `main` UND NICHT `--all`?  (Issue #179, 06.09.2026)
#    `--all` hat zusätzlich den Build-Branch `gh-pages` gebündelt.
#    Dessen History war durch unkomprimierte Vorlese-WAVs (~3,5 GB)
#    aufgebläht. GitHub begrenzt EIN Release-Asset hart auf 2 GiB
#    (docs.github.com: "Each file included in a release must be
#    under 2 GiB"). Das 3,58-GB-Bundle konnte deshalb NIE hochgeladen
#    werden → der Backup-Lauf fiel dauerhaft rot aus.
#    `gh-pages` ist aber zu 100 % regenerierbar (hugo --minify +
#    Vorlese-Audio aus deploy.yml) und hat keinerlei Backup-Wert –
#    es ist ein Build-Artefakt, keine Quelle. Deshalb wird hier nur
#    die Quelle gesichert. Zusätzlich deployt deploy.yml den
#    Build-Branch ab sofort mit force_orphan (ein einziger Commit),
#    damit sich dort nie wieder Multi-GB-History ansammeln kann.
#
#  Kosten: 0 € – GitHub Free erlaubt Releases ohne Limit.
#  Trigger: täglich 03:00 UTC + manuell (workflow_dispatch).
#
#  GEHÄRTET (05.09.2026 + 06.09.2026):
#    1. Artefakte werden VOR dem Upload verifiziert
#       (git bundle verify + unzip -t + Mindest-/Höchstgrößen).
#    2. Uploads laufen einzeln mit Retry (transiente Hickser
#       fallen nicht mehr direkt auf den Nachtlauf durch).
#    3. NACH dem Upload wird das Release hart verifiziert: beide
#       Assets müssen mit exakter Größe vorhanden sein, sonst
#       wird das Teil-Release gelöscht und der Job schlägt LAUT
#       fehl (Fehler-Alerting) statt ein Schein-Backup zu melden.
#    4. Die Retention läuft mit `if: always()` – sie fällt nicht
#       mehr mit einem fehlgeschlagenen Backup aus.
#    5. Das Bundle darf die 2-GiB-Grenze nie wieder erreichen:
#       eine Plausibilitäts-Obergrenze schlägt VOR dem Upload an
#       (klare Meldung statt stillem Upload-Abbruch).
# ============================================================
name: Offsite-Backup

on:
  schedule:
    # Täglich 03:00 UTC (nach Issue #179 wieder auf den Regelbetrieb gesetzt)
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Quelle des Backups. Immer 'main': gh-pages ist ein regenerierbares
      # Build-Artefakt (deploy.yml) und wird bewusst NICHT gesichert
      # (Root-Cause von Issue #179, siehe Header-Kommentar).
      SRC_BRANCH: main
    steps:
      - name: Repository auschecken (komplette History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git-Bundle (main) + Arbeitskopie erstellen und verifizieren
        run: |
          set -euo pipefail

          # Lokalen Source-Ref sicherstellen. Beim schedule läuft der Job
          # zwar auf main, bei manueller Ausführung (workflow_dispatch auf
          # einem Feature-Branch) existiert 'main' aber nicht als lokaler
          # Branch – ohne diesen Fetch würde der Bundle-Schritt abbrechen.
          git fetch --quiet origin "$SRC_BRANCH":refs/heads/"$SRC_BRANCH" 2>/dev/null || true

          # Nur die QUELLE sichern (main). `--all` würde den
          # regenerierbaren Build-Branch gh-pages mitziehen und das
          # Bundle über die 2-GiB-Release-Grenze treiben (Issue #179).
          git bundle create backup.bundle "$SRC_BRANCH"

          # Integrität des Bundles prüfen: kaputte Bundles werden gar
          # nicht erst hochgeladen.
          git bundle verify backup.bundle

          # Arbeitskopie (nur getrackte Dateien, ohne .git)
          git archive --format=zip -o worktree.zip "$SRC_BRANCH"
          unzip -t worktree.zip > /dev/null

          # Plausibilitäts-Checks: verdächtig kleine ODER zu große
          # Artefakte = Fehler. Obergrenze bewusst deutlich unter der
          # GitHub-Hartgrenze von 2 GiB je Asset.
          BSIZE=$(stat -c%s backup.bundle)
          ZSIZE=$(stat -c%s worktree.zip)
          LIMIT=$((2 * 1024 * 1024 * 1024))   # 2 GiB (GitHub-Hartgrenze)
          WARN=$((1 * 1024 * 1024 * 1024))    # 1 GiB (Frühwarnung)
          echo "backup.bundle = ${BSIZE} Bytes · worktree.zip = ${ZSIZE} Bytes"
          if [ "$BSIZE" -lt 100000 ] || [ "$ZSIZE" -lt 50000 ]; then
            echo "::error::Artefakt verdächtig klein (bundle=${BSIZE}, zip=${ZSIZE}) – Abbruch statt Schein-Backup."
            exit 1
          fi
          if [ "$BSIZE" -gt "$LIMIT" ]; then
            echo "::error::Bundle ${BSIZE} Bytes überschreitet die GitHub-Release-Grenze (2 GiB). Die History von main enthält zu große Binärdateien – bitte aufräumen (z. B. git filter-repo), nicht das Backup umgehen."
            exit 1
          fi
          if [ "$BSIZE" -gt "$WARN" ]; then
            echo "::warning::Bundle ${BSIZE} Bytes ist ungewöhnlich groß (> 1 GiB) – Ursache der Aufblähung prüfen, bevor die 2-GiB-Grenze erreicht wird."
          fi

      - name: Backup-Release erstellen und Upload verifizieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="backup-$(date +%Y%m%d-%H%M)"
          SHA=$(git rev-parse --short "$SRC_BRANCH")
          FILES=$(git ls-tree -r --name-only "$SRC_BRANCH" | wc -l)
          NOTES="Automatisches Offsite-Backup von franksfinanzcheck-blog | Quelle: main (Commit: $SHA) | Getrackte Dateien: $FILES | backup.bundle = Git-History von main, worktree.zip = Arbeitskopie | Upload verifiziert (Namen + Groessen) | gh-pages ist regenerierbar und wird bewusst nicht gesichert"

          # 1) Erwartete Asset-Größen merken (für die spätere Verifikation)
          EXPECT_BUNDLE=$(stat -c%s backup.bundle)
          EXPECT_ZIP=$(stat -c%s worktree.zip)

          # 2) Release anlegen (noch ohne Assets)
          gh release create "$TAG" \
            --title "Backup $TAG" \
            --notes "$NOTES"

          # 3) Assets einzeln mit Retry hochladen (transiente Upload-Hickser
          #    des GitHub-Release-Service auffangen)
          upload_with_retry() {
            local f="$1" n
            for n in 1 2 3; do
              if gh release upload "$TAG" "$f" --clobber; then
                return 0
              fi
              echo "::warning::Upload von $f fehlgeschlagen (Versuch $n/3) – neuer Versuch in 15 s"
              sleep 15
            done
            return 1
          }

          upload_failed=0
          upload_with_retry backup.bundle || upload_failed=1
          upload_with_retry worktree.zip || upload_failed=1

          # 4) HARTE VERIFIKATION: Das Release ist nur dann ein Backup, wenn
          #    beide Assets vollständig angekommen sind. Sonst: Teil-Release
          #    aufräumen und laut fehlschlagen (Fehler-Alerting greift).
          REMOTE=$(gh release view "$TAG" --json assets \
            --jq '[.assets[] | .name + ":" + (.size | tostring)] | sort | join(",")' \
            2>/dev/null || echo "")
          WANT=$(printf 'backup.bundle:%s,worktree.zip:%s' "$EXPECT_BUNDLE" "$EXPECT_ZIP")
          if [ "$upload_failed" -ne 0 ] || [ "$REMOTE" != "$WANT" ]; then
            echo "::error::Release $TAG ist unvollständig (erwartet: $WANT · erhalten: ${REMOTE:-kein Zugriff})."
            echo "Räume Teil-Release auf, damit das nächste Backup sauber startet."
            gh release delete "$TAG" --yes --cleanup-tag || true
            exit 1
          fi
          echo "✅ Release $TAG erstellt und verifiziert: $REMOTE"

      - name: Alte Backups aufräumen (nur die letzten 14 behalten)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEEP=14
          TAGS=$(gh release list --limit 100 --json tagName \
            --jq '.[] | select(.tagName | startswith("backup-")) | .tagName' | sort)
          COUNT=$(echo "$TAGS" | grep -c . || true)
          if [ "$COUNT" -gt "$KEEP" ]; then
            TO_DELETE=$(echo "$TAGS" | head -n $((COUNT - KEEP)))
            for t in $TO_DELETE; do
              echo "Lösche altes Backup $t"
              gh release delete "$t" --yes --cleanup-tag
            done
          else
            echo "Backup-Anzahl ($COUNT) im Rahmen (max. $KEEP)."
          fi
