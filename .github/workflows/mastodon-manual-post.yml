name: Mastodon-Manueller-Post

# Postet einen bestehenden, bereits veröffentlichten Artikel gezielt manuell
# auf Mastodon (z. B. an Tagen ohne neuen Blogartikel als "Spotlight-Post").
# Rührt "social_posted" NICHT an -> beeinflusst die normale Automatik
# (scripts/social_poster.py, .github/workflows/social-ai.yml) nicht.
#
# Auslösen: Actions -> "Mastodon-Manueller-Post" -> Run workflow,
# slug + optional intro-Text angeben.
#
# Benötigt Secret MASTODON_ACCESS_TOKEN (Scope 'write:statuses'+'write:media').

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Ordnername unter content/posts/, z.B. 2026-08-12-preisgarantie-gas-so-sicherst-du-dir-guenstige-tarife-fuer-2026"
        required: true
      intro:
        description: "Einleitungssatz (leer lassen = Standard-Spotlight-Hinweis bei neuem Post; explizit leer + edit_status_id = unverändert lassen)"
        required: false
        default: ""
      edit_status_id:
        description: "Optional: vorhandenen Status bearbeiten (PUT) statt neu zu posten – z.B. um Hashtags zu korrigieren"
        required: false
        default: ""
      dry_run:
        description: "Nur anzeigen, nichts senden (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Manuellen Mastodon-Post senden
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE: ${{ vars.MASTODON_INSTANCE }}
          POST_SLUG: ${{ github.event.inputs.slug }}
          POST_INTRO: ${{ github.event.inputs.intro }}
          POST_EDIT_ID: ${{ github.event.inputs.edit_status_id }}
          POST_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          CMD=(python3 scripts/mastodon_manual_post.py --slug "$POST_SLUG")
          if [ -n "$POST_EDIT_ID" ]; then
            # Beim Bearbeiten IMMER --intro mitgeben (auch leer!), damit das
            # Skript nicht den Standard-Spotlight-Satz einfügt, sondern
            # exakt das gewünschte Format (leer = wie automatischer Post).
            CMD+=(--edit-status-id "$POST_EDIT_ID" --intro "$POST_INTRO")
          elif [ -n "$POST_INTRO" ]; then
            CMD+=(--intro "$POST_INTRO")
          fi
          if [ "$POST_DRY_RUN" = "true" ]; then
            CMD+=(--dry-run)
          fi
          "${CMD[@]}"


      - name: Log committen
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "FrankAutoOps Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/social_log.jsonl
          git diff --cached --quiet || git commit -m "chore: manueller Mastodon-Post geloggt [skip ci]"
          git push
