# ============================================================
#  SKRIPT-SYNTAX – der liegende Stand muss kompilieren
#  ------------------------------------------------------------
#  WARUM ES DIESEN LAUF GIBT (Bot-Watchdog #864, 25.10.2026)
#
#  Am 25.10.2026 stand `scripts/redaktions_standard.py` mit einem
#  IndentationError auf main. Entstanden ist er beim ZUSAMMENFÜHREN:
#  Der Squash-Merge von PR #869 traf eine zwischenzeitlich gewanderte
#  `main`; Kopf und Rumpf derselben Funktion kamen aus zwei Fassungen.
#
#  Danach passierte vier Commits lang … nichts:
#    · Die PR-Prüfung sieht den PR-Stand, nicht das Ergebnis des Merge.
#    · Die Unit-Tests sehen die Module, die sie importieren.
#    · Der Hugo-Build sieht überhaupt kein Python.
#    · `bot_preflight.py` läuft nur in der Content-Engine.
#    · Der Bot-Watchdog sah den Fehler – und sein Selbsttest starb daran
#      (also kein Bericht, keine Heilung: siehe bot-watchdog.yml).
#
#  Dieser Lauf schließt die Lücke an der Wurzel: Er kompiliert ALLE
#  Python-Skripte, so wie sie im Repo liegen – bei jedem Push auf main,
#  bei jeder PR und auf Zuruf. Er ist absichtlich winzig (Sekunden,
#  keine Abhängigkeiten außer Python), damit er nie der Grund ist,
#  warum eine Prüfung ausbleibt.
#
#  Fail-closed: Ein einziger Syntaxfehler macht den Lauf rot. Das ist
#  die unterste Stufe – für halbe Fassungen (gültig, aber mit Namen
#  ins Leere) ist `scripts/wachen_vertrag.py` zuständig.
#
#  Heilung: `python3 scripts/skript_syntax_heiler.py --fix --commit`
#  stellt die letzte kompilierbare Fassung her (Audit-Ledger unter
#  data/skript_syntax_heilungen.jsonl). Der Bot-Watchdog tut das
#  selbst, sobald der Befund steht.
# ============================================================
name: Skript-Syntax (liegender Stand)

on:
  # Trigger-Wache (27.10.2026): Die Workflow-Dateien selbst gehören in den
  # Filter – sie legen fest, WAS geprüft wird. Ohne diesen Pfad hätte eine
  # Änderung an einem Trigger keinen Lauf ausgelöst, der sie prüft.
  push:
    branches: [main]
    paths:
      - 'scripts/**.py'
      - 'requirements*.txt'
      - '.github/workflows/**.yml'
  pull_request:
    paths:
      - 'scripts/**.py'
      - 'requirements*.txt'
      - '.github/workflows/**.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: skript-syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python einrichten
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Erst der Detektor, dann der Prüfling: Eine Wache, deren Selbsttest
      # nicht läuft, darf nicht „grün" melden (dieselbe Reihenfolge wie im
      # Markenflächen-Haken).
      - name: Wache selbst prüfen
        run: python3 scripts/skript_syntax_wache.py --selftest

      - name: Alle Skripte kompilieren (fail-closed)
        run: |
          set +e
          python3 scripts/skript_syntax_wache.py --md >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/skript_syntax_wache.py --check
          code=$?
          if [ "$code" != "0" ]; then
            echo "::error::Mindestens ein Skript kompiliert nicht. Heilung: python3 scripts/skript_syntax_heiler.py --fix --commit (letzte kompilierbare Fassung, Audit in data/skript_syntax_heilungen.jsonl)."
          fi
          exit "$code"

      # WORKFLOW-JS-WACHE (WF-829B/#922, 29.10.2026)
      # Der Block IN einem Workflow ist JavaScript, lebt in YAML und wird von
      # keiner Python-Prüfung berührt. Am 29.10.2026 stand in
      # alert-on-failure.yml ein Zusammenschnitt (zwei Zeichenketten ohne
      # Komma) – das gesamte Fehler-Alerting starb an einem SyntaxError,
      # also genau der Kanal, der solche Ausfälle meldet. Diese Stufe
      # kompiliert jeden github-script-Block mit `node --check`.
      - name: Workflow-JS – jeder github-script-Block muss kompilieren
        run: |
          set +e
          python3 scripts/workflow_js_wache.py --md >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/workflow_js_wache.py --selftest
          selbst=$?
          python3 scripts/workflow_js_wache.py --check
          befund=$?
          if [ "$selbst" = "2" ]; then
            echo "::error::Selbsttest der Workflow-JS-Wache rot – die Prüfung selbst ist defekt (Exit 2)."
          elif [ "$befund" = "2" ]; then
            echo "::error::Workflow-JS-Wache nicht durchführbar (node fehlt). Eine ausgefallene Messung ist kein Grün (C33)."
          elif [ "$befund" != "0" ]; then
            echo "::error::Mindestens ein github-script-Block kompiliert nicht. Heilung: die betroffene Workflow-Datei in beiden Fassungen vergleichen – typisch ist ein Zusammenschnitt beim Zusammenführen (fehlendes Komma, verwaiste Zeile). Lokal: python3 scripts/workflow_js_wache.py --check"
          fi
          [ "$selbst" = "0" ] && [ "$befund" = "0" ]

      # TRIGGER-WACHE (WF-E813/#815, 27.10.2026)
      # Eine Wache springt nur an, wenn ihr `paths`-Filter die geänderte Datei
      # nennt. Diese Prüfung hält beides zusammen: Was ein Workflow aufruft,
      # muss ihn auch auslösen (W1), kein Filter darf auf eine verschwundene
      # Datei zeigen (W2), und push/pull_request müssen dieselbe Liste tragen
      # (W3). Am 27.10.2026 fand sie 36 solche Stellen in neun Workflows.
      - name: Trigger-Wache – was ein Lauf prüft, muss ihn auslösen
        run: |
          set +e
          python3 scripts/trigger_wache.py --md >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/trigger_wache.py --selftest
          selbst=$?
          python3 scripts/trigger_wache.py --check
          befund=$?
          if [ "$selbst" != "0" ]; then
            echo "::error::Selbsttest der Trigger-Wache rot – die Prüfung selbst ist defekt (Exit $selbst). Keine Filter auf Verdacht ändern; Befund steht im Job-Log."
          elif [ "$befund" != "0" ]; then
            echo "::error::Trigger-Wache: mindestens ein Workflow ruft einen Prüfer auf, den sein paths-Filter nicht auslöst (oder umgekehrt). Heilung: Datei in BEIDEN Listen ergänzen – npm run trigger:check nennt Workflow, Ereignis und Pfad."
          fi
          [ "$selbst" = "0" ] && [ "$befund" = "0" ]

      # Der Heiler ist Teil des Vertrags, nicht nur der Wache: Sein
      # Selbsttest läuft hier mit, damit ein kaputter Heiler auffällt,
      # bevor der Watchdog ihn im Ausfall braucht.
      - name: Heiler selbst prüfen
        run: python3 scripts/skript_syntax_heiler.py --selftest
