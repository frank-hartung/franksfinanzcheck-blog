# ============================================================
#  TEMPORÄR: Build-Diagnose für PR #321 (19.09.2026)
#
#  Zweck: `hugo --minify` scheitert im Qualitäts-Gate, aber die Run-Logs sind
#  aus der Arbeitsumgebung nicht lesbar (results-receiver-Host blockiert).
#  Dieser Workflow baut die Seite, zerlegt den Fehler per Bisect auf die
#  einzelnen geänderten Baustellen (Templates, Datendatei, Content) und
#  postet das Ergebnis als PR-Kommentar. Wird nach der Fehlerbehebung
#  wieder gelöscht – er ist Diagnose-Werkzeug, kein Dauer-Bestandteil.
#
#  Auslösen: gh workflow run build-diagnose.yml --ref <branch>
# ============================================================
name: Build-Diagnose (temporär)

on:
  push:
    branches:
      - "arena/01a0ba19-franksfinanzcheck-blog"
  workflow_dispatch:
    inputs:
      pr:
        description: "PR-Nummer für den Kommentar"
        default: "321"
      basis:
        description: "Basis-Commit für den Bisect"
        default: "146e9a7"

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    name: Hugo-Build zerlegen
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hugo installieren
        uses: ./.github/actions/install-hugo
        with:
          version: "0.164.0"

      - name: Build + Bisect
        id: bisect
        run: |
          BASIS="${{ github.event.inputs.basis || '146e9a7' }}"
          PR="${{ github.event.inputs.pr || '321' }}"
          hugo version | tee /tmp/diagnose.txt
          echo "" >> /tmp/diagnose.txt

          bauen() {
            ziel="/tmp/pub-$RANDOM"
            hugo --minify --destination "$ziel" >/tmp/build.log 2>&1
            rc=$?
            rm -rf "$ziel"
            return $rc
          }

          echo "## Build auf HEAD ($(git rev-parse --short HEAD))" >> /tmp/diagnose.txt
          if bauen; then
            echo "Ergebnis: GRUEN (exit 0)" >> /tmp/diagnose.txt
          else
            echo "Ergebnis: ROT (exit $?) – letzte 60 Zeilen:" >> /tmp/diagnose.txt
            echo '```' >> /tmp/diagnose.txt
            tail -60 /tmp/build.log >> /tmp/diagnose.txt
            echo '```' >> /tmp/diagnose.txt
            cp /tmp/build.log /tmp/build-head.log

            echo "" >> /tmp/diagnose.txt
            echo "## Bisect (eine Baustelle auf $BASIS zurück, Rest bleibt HEAD)" >> /tmp/diagnose.txt
            for f in \
              layouts/_default/_markup/render-link.html \
              layouts/_partials/affiliate_anchor_attrs.html \
              layouts/pillar/list.html \
              data/affiliate_ziele.yaml \
              static/go \
              content
            do
              if git cat-file -e "$BASIS:$f" 2>/dev/null; then
                git checkout "$BASIS" -- "$f"
              else
                rm -rf "$f"
              fi
              if bauen; then
                echo "- ZURUECKGENOMMEN $f -> Build GRUEN  <<< VERURSACHER" >> /tmp/diagnose.txt
              else
                echo "- zurueckgenommen $f -> bleibt rot" >> /tmp/diagnose.txt
              fi
              git checkout HEAD -- "$f" 2>/dev/null || true
            done

            echo "" >> /tmp/diagnose.txt
            echo "## Fehlermeldung im Detail (erste 40 Zeilen des HEAD-Builds)" >> /tmp/diagnose.txt
            echo '```' >> /tmp/diagnose.txt
            head -40 /tmp/build-head.log >> /tmp/diagnose.txt
            echo '```' >> /tmp/diagnose.txt
          fi

      - name: Ergebnis in den PR kommentieren
        run: |
          PR="${{ github.event.inputs.pr || '321' }}"
          {
            echo "### 🔬 Build-Diagnose (automatisch, Workflow wird wieder entfernt)"
            echo ""
            cat /tmp/diagnose.txt
          } > /tmp/kommentar.md
          gh pr comment "$PR" --body-file /tmp/kommentar.md
