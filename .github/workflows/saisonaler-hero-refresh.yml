# ============================================================
#  SAISONALER HERO – Agent Reach + Claude, SEO/GEO-Premium
#  ------------------------------------------------------------
#  Der alte statische Willkommenstext wurde vollständig entfernt.
#  Die aktive Saison in data/saisons.yaml liefert stattdessen die einzige
#  Startseiten-H1 und ihren Antwort-zuerst-Lead. Dieser Lauf poliert die
#  beiden Felder automatisiert, aber eng begrenzt und nachweisbar:
#
#    1. Agent Reach erzeugt einen frischen, rein lesenden Signal-Brief.
#    2. Claude Sonnet 5 (Puter.js, kostenlos ohne Anthropic-API) schreibt
#       nur H1 + Lead in Franks Stil; keine neuen Fakten werden erlaubt.
#    3. saisonaler_hero_refresh.py validiert SEO/GEO, Markenstimme,
#       Faktenbremse und Neuheit; bei Fehlern wird nichts geschrieben.
#    4. Hugo + saisonale Startseitenwache beweisen das gerenderte Resultat.
#
#  Layout und Design sind absichtlich NICHT KI-autonom: Die freigegebene
#  v-hero-premium-Variante bleibt Version/Review-pflichtig. So kann Content
#  saisonal frisch werden, ohne CSS, CWV oder den Freigabe-Vertrag zu ändern.
# ============================================================
name: Saisonaler Hero-Refresh (Agent Reach + Claude)

on:
  schedule:
    # täglich 07:27 MESZ: Saisonwechsel wird unmittelbar aufgegriffen;
    # das Skript spart Claude-Aufrufe, solange der Hero noch frisch ist.
    # AUDIT 30.09. (Kollision entzerrt): war 05:15 UTC – montags gleichzeitig
    # mit Premium-Governance (beide bauen Hugo; 05:27 entzerrt das).
    - cron: "27 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Claude-Textprüfung auch vor Ablauf der 21-Tage-Rotation erzwingen"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: saisonaler-hero-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Python und Node 24 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Hugo Extended installieren (Render-Beweis)
        uses: ./.github/actions/install-hugo
        with:
          version: "0.164.0"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Agent Reach und Puter-Brücke installieren
        run: |
          # Agent Reach stammt ausschließlich aus dem gepinnten GitHub-Archiv;
          # das gleichnamige PyPI-Paket ist bewusst verboten.
          python3 -m pip install -q --disable-pip-version-check -r requirements-agent-reach.txt pyyaml
          npm install --no-save @heyputer/puter.js

      - name: Verträge vor dem Schreiben prüfen
        run: |
          python3 scripts/agent_reach_gate.py
          python3 scripts/saisonaler_hero_refresh.py --selftest
          python3 scripts/saisonale_startseite_guard.py --source-only
          python3 scripts/design_variant_gate.py --produktionswache

      - name: Agent-Reach-Signal-Brief (nur lesen)
        id: research
        run: |
          python3 scripts/agent_reach_research.py \
            --plan data/agent_reach/saisonaler_hero.yaml \
            --out-dir data/research/saisonal

      - name: Claude-Textprüfung – nur H1 und GEO-Lead
        id: politur
        env:
          PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="--force"; fi
          set +e
          python3 scripts/saisonaler_hero_refresh.py --fix $ARGS
          CODE=$?
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          # Das Skript unterscheidet selbst zwischen gelb (geprüfte Basis bleibt
          # live, Kette pausiert) und rot (Live-Hero defekt, Überalterung oder
          # Ausfall-Serie). Nur rot darf den Lauf kippen – sonst entsteht täglich
          # ein Fehlalarm, obwohl die Startseite einwandfrei ausgeliefert wird.
          exit $CODE

      - name: Render-Beweis und Premium-Layout-Gates
        run: |
          hugo --minify
          python3 scripts/saisonale_startseite_guard.py --public public
          python3 scripts/design_variant_gate.py --produktionswache

      - name: Diagnose in die Lauf-Zusammenfassung schreiben
        if: always()
        run: |
          {
            echo "## Saisonaler Hero"
            echo
            if [ -f SAISONALER-HERO-REPORT.md ]; then
              cat SAISONALER-HERO-REPORT.md
            else
              echo "_Kein Report erzeugt – der Lauf brach vor der Textprüfung ab._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Saisontext, Nachweis und Recherche committen
        if: always() && steps.politur.conclusion != 'skipped'
        run: |
          if git status --porcelain -- \
               data/saisons.yaml data/saisonaler_hero_state.json \
               data/saisonaler_hero_history.jsonl data/research/saisonal/ | grep -q .; then
            git config user.name "Saison-Hero-Bot"
            git config user.email "saison-hero-bot@users.noreply.github.com"
            git add data/saisons.yaml data/saisonaler_hero_state.json \
                    data/saisonaler_hero_history.jsonl data/research/saisonal/
            git commit -m "content(home): saisonalen Hero mit Agent Reach + Claude poliert"
            scripts/git_sync.sh --push-only
          else
            echo "✅ Keine versionierbaren Änderungen – Hero ist aktuell."
          fi

      - name: Report als Lauf-Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: saisonaler-hero-report
          path: |
            SAISONALER-HERO-REPORT.md
            data/research/saisonal/*.md
            data/research/saisonal/*.json
          if-no-files-found: ignore

      # ------------------------------------------------------------
      #  ISSUE-HYGIENE (Premium-Fix 02.10.2026)
      #  Vorher: jeder rote Lauf legte ein Issue an, aber niemand schloss es
      #  wieder – ein einmal geöffnetes Issue blieb auch dann stehen, wenn der
      #  nächste Lauf längst grün war. Jetzt gilt: genau EIN Vorgang je Störung,
      #  mit Diagnose als Kommentar, und er schließt sich selbst, sobald die
      #  Kette wieder sauber durchläuft.
      # ------------------------------------------------------------
      - name: Ausfall sichtbar machen (kein stiller Fallback)
        if: failure() && steps.politur.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create saisonaler-hero --repo "$GITHUB_REPOSITORY" \
            --color "0e8a16" \
            --description "Saisonaler SEO/GEO-Hero: Agent-Reach- oder Claude-Lauf" --force || true
          {
            echo "Der saisonale Hero wurde nicht als Agent-Reach + Claude-poliert veröffentlicht."
            echo "Die kuratierte Saisonbasis bleibt absichtlich unverändert sichtbar; es gab"
            echo "keinen stillen KI- oder Fakten-Fallback."
            echo
            echo "**Lauf:** $LAUF"
            echo
            if [ -f SAISONALER-HERO-REPORT.md ]; then
              echo "<details><summary>Diagnose-Report</summary>"
              echo
              cat SAISONALER-HERO-REPORT.md
              echo
              echo "</details>"
            fi
            echo
            echo "Prüfreihenfolge: 1. Diagnose-Report oben (Kettennachweis),"
            echo "2. \`PUTER_AUTH_TOKEN\` (Secret gesetzt und gültig?),"
            echo "3. Agent-Reach-Quellen in \`data/agent_reach/saisonaler_hero.yaml\`,"
            echo "4. \`python3 scripts/saisonaler_hero_refresh.py --check --json\` lokal."
          } > /tmp/hero-issue.md
          NUMMER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label saisonaler-hero --search "in:title \"Saisonaler Hero-Refresh: Aktion nötig\"" \
            --json number --jq '.[0].number // empty')"
          if [ -n "$NUMMER" ]; then
            gh issue comment "$NUMMER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/hero-issue.md
            echo "Bestehender Vorgang #$NUMMER um die aktuelle Diagnose ergänzt."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Saisonaler Hero-Refresh: Aktion nötig ($(date +%F))" \
              --label saisonaler-hero --body-file /tmp/hero-issue.md
          fi

      - name: Behobene Störung selbst schließen
        if: success() && steps.politur.outputs.ampel == 'gruen'
        env:
          GH_TOKEN: ${{ github.token }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for NUMMER in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label saisonaler-hero --search "in:title \"Saisonaler Hero-Refresh: Aktion nötig\"" \
            --json number --jq '.[].number'); do
            gh issue close "$NUMMER" --repo "$GITHUB_REPOSITORY" \
              --comment "Automatisch geschlossen: Der saisonale Hero-Lauf ist wieder grün ($LAUF). Zustand und Kettennachweis stehen im Lauf-Summary und in SAISONALER-HERO-REPORT.md."
          done
