# ============================================================
#  SAISONALER HERO – Agent Reach + Claude, SEO/GEO-Premium
#  ------------------------------------------------------------
#  Der alte statische Willkommenstext wurde vollständig entfernt.
#  Die aktive Saison in data/saisons.yaml liefert stattdessen die einzige
#  Startseiten-H1 und ihren Antwort-zuerst-Lead. Dieser Lauf poliert die
#  beiden Felder automatisiert, aber eng begrenzt und nachweisbar:
#
#    1. Agent Reach erzeugt einen frischen, rein lesenden Signal-Brief.
#    2. Claude Sonnet 5 (Puter.js, kostenlos ohne Anthropic-API) schreibt
#       nur H1 + Lead in Franks Stil; keine neuen Fakten werden erlaubt.
#    3. saisonaler_hero_refresh.py validiert SEO/GEO, Markenstimme,
#       Faktenbremse und Neuheit; bei Fehlern wird nichts geschrieben.
#    4. Hugo + saisonale Startseitenwache beweisen das gerenderte Resultat.
#
#  Layout und Design sind absichtlich NICHT KI-autonom: Die freigegebene
#  v-hero-premium-Variante bleibt Version/Review-pflichtig. So kann Content
#  saisonal frisch werden, ohne CSS, CWV oder den Freigabe-Vertrag zu ändern.
# ============================================================
name: Saisonaler Hero-Refresh (Agent Reach + Claude)

on:
  schedule:
    # täglich 07:15 MESZ: Saisonwechsel wird unmittelbar aufgegriffen;
    # das Skript spart Claude-Aufrufe, solange der Hero noch frisch ist.
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Claude-Politur auch vor Ablauf der 21-Tage-Rotation erzwingen"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: saisonaler-hero-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Python und Node 24 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Hugo Extended installieren (Render-Beweis)
        uses: ./.github/actions/install-hugo
        with:
          version: "0.164.0"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Agent Reach und Puter-Brücke installieren
        run: |
          # Agent Reach stammt ausschließlich aus dem gepinnten GitHub-Archiv;
          # das gleichnamige PyPI-Paket ist bewusst verboten.
          python3 -m pip install -q --disable-pip-version-check -r requirements-agent-reach.txt pyyaml
          npm install --no-save @heyputer/puter.js

      - name: Verträge vor dem Schreiben prüfen
        run: |
          python3 scripts/agent_reach_gate.py
          python3 scripts/saisonaler_hero_refresh.py --selftest
          python3 scripts/saisonale_startseite_guard.py --source-only
          python3 scripts/design_variant_gate.py --produktionswache

      - name: Agent-Reach-Signal-Brief (nur lesen)
        id: research
        run: |
          python3 scripts/agent_reach_research.py \
            --plan data/agent_reach/saisonaler_hero.yaml \
            --out-dir data/research/saisonal

      - name: Claude-Politur – nur H1 und GEO-Lead
        env:
          PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="--force"; fi
          python3 scripts/saisonaler_hero_refresh.py --fix $ARGS

      - name: Render-Beweis und Premium-Layout-Gates
        run: |
          hugo --minify
          python3 scripts/saisonale_startseite_guard.py --public public
          python3 scripts/design_variant_gate.py --produktionswache

      - name: Saisontext, Nachweis und Recherche committen
        run: |
          if git status --porcelain -- \
               data/saisons.yaml data/saisonaler_hero_state.json \
               data/saisonaler_hero_history.jsonl data/research/saisonal/ | grep -q .; then
            git config user.name "Saison-Hero-Bot"
            git config user.email "saison-hero-bot@users.noreply.github.com"
            git add data/saisons.yaml data/saisonaler_hero_state.json \
                    data/saisonaler_hero_history.jsonl data/research/saisonal/
            git commit -m "content(home): saisonalen Hero mit Agent Reach + Claude poliert"
            scripts/git_sync.sh --push-only
          else
            echo "✅ Keine versionierbaren Änderungen – Hero ist aktuell."
          fi

      - name: Report als Lauf-Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: saisonaler-hero-report
          path: |
            SAISONALER-HERO-REPORT.md
            data/research/saisonal/*.md
            data/research/saisonal/*.json
          if-no-files-found: ignore

      - name: Ausfall sichtbar machen (kein stiller Fallback)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create saisonaler-hero --repo "$GITHUB_REPOSITORY" \
            --color "0e8a16" \
            --description "Saisonaler SEO/GEO-Hero: Agent-Reach- oder Claude-Lauf" --force || true
          TITEL="Saisonaler Hero-Refresh: Aktion nötig ($(date +%F))"
          if ! gh issue list --repo "$GITHUB_REPOSITORY" --state open \
               --search "in:title \"Saisonaler Hero-Refresh: Aktion nötig\"" | grep -q .; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITEL" \
              --label saisonaler-hero \
              --body "Der saisonale Hero wurde nicht als Agent-Reach + Claude-poliert veröffentlicht. Prüfe den Lauf, die Agent-Reach-Quellen und PUTER_AUTH_TOKEN. Die kuratierte Saisonbasis bleibt absichtlich unverändert sichtbar; es gab keinen stillen KI- oder Fakten-Fallback."
          else
            echo "Offenes Saison-Hero-Issue existiert bereits."
          fi
