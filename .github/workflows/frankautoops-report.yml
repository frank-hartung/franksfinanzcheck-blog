# ============================================================
#  FRANKAUTOOPS – TÄGLICHER REPORT & AUDIT
#
#  Erzeugt täglich den maschinenlesbaren Ops-Report (JSON) und
#  aktualisiert OPS-REPORT.md (menschliche Kurzfassung) im Repo.
#  Führt die Audit-Log-Retention durch (90 Tage / kritisch 1 Jahr).
#
#  Läuft: täglich 06:00 UTC (08:00 MESZ) + manuell.
# ============================================================
name: FrankAutoOps-Report

# HINWEIS (11.08. Spaet): Cron 07:35 MESZ statt 08:00 – raus aus dem
# Push-Rennen mit Pinterest-AI (08:00) + Content-Engine (08:10), beide
# committen ebenfalls. Weniger Rebase-Larm, weniger Wartezeit.
on:
  schedule:
    - cron: "35 5 * * *"   # 07:35 MESZ (vor dem 08:00-Pulk aus Pinterest/Engine)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: frankautoops-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Audit-Retention durchsetzen
        run: |
          python3 scripts/audit_log.py --cleanup || true

      - name: Ops-Report erzeugen (JSON + Markdown)
        run: |
          # JSON (maschinenlesbar) als Artefakt speichern
          python3 scripts/ops_report.py > ops-report.json
          # Menschliche Kurzfassung in OPS-REPORT.md
          python3 scripts/ops_report.py --summary > OPS-REPORT.md
          echo "Report erzeugt:"
          cat ops-report.json | head -30

      - name: Report committen
        run: |
          git config user.name "FrankAutoOps"
          git config user.email "frankautoops@users.noreply.github.com"
          git add ops-report.json OPS-REPORT.md data/audit/
          if git diff --cached --quiet; then
            echo "Report unverändert."
          else
            git commit -m "chore: FrankAutoOps-Report $(date +%F)"
            git pull --rebase --autostash origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            git push
            echo "✅ Report gepusht"
          fi

      - name: Audit-Events für den Lauf loggen
        run: |
          python3 - <<'EOF'
          import sys; sys.path.insert(0, "scripts")
          from audit_log import log_event
          log_event(module="ops_report", action="daily-report",
                    input={"cron": True}, output={"status": "ok"}, status="ok")
          print("Audit-Event geschrieben")
          EOF
