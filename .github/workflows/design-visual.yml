# ============================================================
#  DESIGN-VISUAL – Visueller Grossflaechen-Vergleich (Publisher-Methode)
#
#  Samstags 09:30 MESZ: Screenshots von Startseite, /ueber/ + den 3
#  neuesten Artikeln (Desktop + Mobile) – Perceptual-Hash-Diff gegen
#  Baseline (data/design_baseline.json). Abweichung > Schwelle = Issue.
#
#  Laechelt sich selbst (Baseline heilt sich mit leichtem Drift weiter),
#  aber bei Sturzflug -> GitHub-Issue mit IHM uebergeben (Dedupe: Label
#  'design-visual').
#
#  Netto-Speicherverbrauch im Repo: nur eine JSON mit 64-Bit-Hashes – 0 KB
#  Screenshot-Muell (Publisher-Trick fuer Git-reine Baselines).
# ============================================================
name: Design-Visual (Screenshot-Regression)

on:
  schedule:
    - cron: "30 7 * * 6"    # Samstag 09:30 MESZ (07:30 UTC)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: design-visual
  cancel-in-progress: false

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hugo installieren (Match mit Deploy!)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Seite bauen
        run: hugo --minify

      - name: Node + Chrome
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Chrome installieren (headless)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser 2>/dev/null || sudo apt-get install -y -qq chromium
          echo "CHROME_PATH=$(which chromium || which chromium-browser)" >> $GITHUB_ENV
          pip install -q pillow
          npm install --no-save puppeteer-core --silent

      - name: Statisches Design-QA (design_guard)
        continue-on-error: true
        run: python3 scripts/design_guard.py --fix || echo "Design-Funde (siehe Report)"

      - name: Visuelle Regression (Screenshots + pHash)
        continue-on-error: true
        run: python3 scripts/design_visual.py || echo "Drift-Fund(e) bebildert"

      - name: Issue bei sichtbarer Regression (Dedupe via Label)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const open = fs.readFileSync('DESIGN-VISUAL-REPORT.md', 'utf8');
            if (!open.includes('Abweichung!') && !open.includes('❗')) { console.log('keine Abweichung'); return; }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'design-visual', per_page: 5 });
            if (issues.length) { console.log('Dedupe – existierende Issue #' + issues[0].number); return; }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '👁️ Design-Visual: Regression erkannt (Screenshot-Diff)',
              labels: ['design-visual'],
              body: '```\n' + open + '\n```\n\n_Eigenes Baseline-Update erfolgt nur bei akzeptabler Drift._\n' });
            console.log('Issue erstellt!');

      - name: Reports committen
        if: ${{ !cancelled() }}
        run: |
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add DESIGN-REPORT.md DESIGN-VISUAL-REPORT.md data/design_history.jsonl data/design_baseline.json
          if git diff --cached --quiet; then
            echo "Nichts zu committen."
          else
            git commit -m "chore: Design-Reports (statisch + visuell)"
            git pull --rebase --autostash origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            git push || { sleep 20; git pull --rebase origin main && git push; }
          fi
