# ============================================================
#  CADENCE-MANAGER – automatische Anpassung der Publikationsfrequenz
#  ------------------------------------------------------------
#  Betriebsregel (Frank, 13.08.2026): "Die Anzahl der Artikel soll auf die
#  Entscheidung von Profi-Affiliate-Marketer und Profi-SEO-Manager dauerhaft
#  automatisch angepasst werden." Läuft wöchentlich (Sonntagnacht) und
#  schreibt die Cron-Tage in content-engine-v2.yml + tagesziel-1-post.yml
#  neu, basierend auf Domain-Alter (Ramp) und interner Erfolgsquote
#  (Sicherheitsbremse). Siehe scripts/cadence_manager.py für die vollständige
#  fachliche Begründung und CADENCE-REPORT.md für die jeweils letzte
#  Entscheidung.
# ============================================================
name: Cadence-Manager

on:
  schedule:
    - cron: "0 5 * * 0"  # Sonntag 05:00 UTC, vor der neuen Woche
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  anpassen:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Kadenz berechnen und Cron-Zeiten aktualisieren
        run: python3 scripts/cadence_manager.py

      - name: Änderung committen + pushen
        run: |
          git config user.name "Cadence-Manager"
          git config user.email "cadence-manager@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Kadenz-Änderung diese Woche."
          else
            git commit -m "ops: Publikationsfrequenz automatisch angepasst (Cadence-Manager)"
            git pull --rebase --autostash origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            git push
          fi
