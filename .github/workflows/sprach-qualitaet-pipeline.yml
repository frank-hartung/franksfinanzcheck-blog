name: Sprach-Qualitäts-Pipeline (Highend, Profi-Agentur)

# ============================================================================
#  SPRACH-QUALITÄTS-PIPELINE – kombinierter Highend-Durchlauf aller
#  sprachlichen Engines für FranksFinanzcheck (de-DE, YMYL).
#
#  Führt in fixer Reihenfolge aus:
#    1. Selbsttests aller Engines (Sabotage-Schutz, fail-closed, Exit 2)
#    2. grammar_check (LT1–LT4)        – Grammatik/Rechtschreibung offline
#    3. hardcases_guard (H1–H9)        – deutsche Fest-Fehler
#    4. zeit_rechtschreibung           – ZEIT-Niveau (Premium/offline)
#    5. sprachglatt (DW1–DW9 + V1)     – Glättung (DeepL-Write-Nachbau)
#    6. lektor_guard (L1–L12)          – Verlags-Lektorat
#    7. readability_check              – Flesch-Amstad, Satzlänge, …
#
#  Strict-Modus: Exit 1 bei offenen kritischen Funden → Issue, Lauf bleibt grün.
#  Exit 2 (Sabotage/Selbsttest rot) ist immer fail-closed: kein History-Push.
#  Reports werden als Workflow-Artefakte gespeichert; History bleibt versioniert.
#
#  Reparatur 31.10.2026 (Highend-Audit, PR nach #977):
#    · `${{ }}` vollständig aus allen `run:`-Blöcken entfernt (Template-
#      Injection, Test `test_unabhaengiger_tiefencheck`). Eingaben kommen über
#      `env:`, Ausgaben über `$GITHUB_OUTPUT`.
#    · `gate_exit_code` wurde falsch erfasst: `… || true` und danach `echo $?`
#      las den Exit von `echo` (immer 0) – der Strict-Modus konnte nie greifen.
#      Jetzt `set +e` + `RC=$?`, plus Beweisschutz gegen leere/ungültige Codes.
#    · `git push || true` ersetzt durch `scripts/git_sync.sh --push-only`
#      (Push-Wache, Retry + Rebase gegen Parallel-Bots) und
#      `permissions: contents: write` – vorher war ein Push technisch
#      unmöglich und der Fehler wurde verschluckt.
#    · Labels `qualitaet`/`sprach-qualitaet`/`automatisiert` werden vor dem
#      Issue angelegt (C12: `gh issue` scheitert mit HTTP 422, wenn ein Label
#      fehlt – #209).
#    · `actions/setup-python` auf den repo-weit einheitlichen Pin gehoben
#      (v7.0.0 statt v5.1.1; Test `test_setup_python_is_uniform`).
#
#  Zeitplan: täglich 04:30 UTC (nach der Redaktions-Politur 03:45 UTC).
#  Manuell auslösbar: Actions → „Sprach-Qualitäts-Pipeline“ → Run.
# ============================================================================

on:
  schedule:
    - cron: "30 4 * * *"   # täglich 04:30 UTC
  workflow_dispatch:
    inputs:
      modus:
        description: "report (Default) | fix | strict"
        required: false
        default: "report"
      scope:
        description: "bestand (alle Artikel) | new-only (heute) | file (einzelner Pfad)"
        required: false
        default: "bestand"
      file_pfad:
        description: "Pfad zum einzelnen Artikel (nur bei scope=file)"
        required: false
        default: ""

permissions:
  contents: write   # History-Commit über scripts/git_sync.sh --push-only
  issues: write     # für automatische Issue-Erstellung bei Qualitätsverstoß

concurrency:
  group: sprach-qualitaet-pipeline
  cancel-in-progress: false

jobs:
  sprach-qualitaet:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Python-Umgebung einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren (gepinnt, --require-hashes)
        run: |
          python3 -m pip install --upgrade pip
          pip install --require-hashes -r requirements-ci.txt

      - name: Copy-Editing-Gate (Selbsttest + alle Engines)
        id: gate
        env:
          # Eingaben ausschließlich über die Umgebung – nie per `${{ }}` im
          # Skript (Template-Injection-Freiheit).
          EINGABE_MODUS: ${{ inputs.modus }}
          EINGABE_SCOPE: ${{ inputs.scope }}
          EINGABE_DATEI: ${{ inputs.file_pfad }}
        run: |
          set -u
          MODUS="${EINGABE_MODUS:-report}"
          SCOPE="${EINGABE_SCOPE:-bestand}"
          DATEI="${EINGABE_DATEI:-}"

          ARGS=(--report COPY-EDITING-REPORT.md --json)
          case "$MODUS" in
            report) ;;
            fix)    ARGS+=(--fix) ;;
            strict) ARGS+=(--strict) ;;
            *)
              echo "🛑 Unbekannter Modus: »$MODUS« (erlaubt: report | fix | strict)"
              exit 2
              ;;
          esac
          case "$SCOPE" in
            bestand) ;;
            new-only) ARGS+=(--new-only) ;;
            file)
              if [ -z "$DATEI" ]; then
                echo "🛑 scope=file ohne file_pfad – nichts zu prüfen."
                exit 2
              fi
              if [ ! -f "$DATEI" ]; then
                echo "🛑 Datei nicht gefunden: »$DATEI«"
                exit 2
              fi
              ARGS+=(--file "$DATEI")
              ;;
            *)
              echo "🛑 Unbekannter Scope: »$SCOPE« (erlaubt: bestand | new-only | file)"
              exit 2
              ;;
          esac

          echo ">>> copy_editing_gate.py ${ARGS[*]}"
          # Exit-Code ECHT erfassen: `cmd || true` würde den Code verlieren und
          # `$?` läse anschließend den von `true` (immer 0) – der Strict-Modus
          # war dadurch wirkungslos.
          set +e
          python3 scripts/copy_editing_gate.py "${ARGS[@]}"
          RC=$?
          set -e
          echo "Gate-Exit: $RC"
          echo "gate_exit_code=$RC" >> "$GITHUB_OUTPUT"

      - name: Qualitäts-Status auswerten
        id: status
        env:
          GATE_EXIT: ${{ steps.gate.outputs.gate_exit_code }}
          EINGABE_MODUS: ${{ inputs.modus }}
        run: |
          set -u
          MODUS="${EINGABE_MODUS:-report}"
          GATE_EXIT="${GATE_EXIT:-}"

          if [ -z "$GATE_EXIT" ]; then
            # Kein Code = keine Bewertung. Fail-closed statt „ok“ raten.
            echo "🛑 Kein Gate-Exit-Code übergeben – der Lauf ist nicht bewertbar."
            echo "qualitaet=sabotage" >> "$GITHUB_OUTPUT"
            exit 2
          fi

          case "$GATE_EXIT" in
            0)
              echo "✅ Pipeline durchgelaufen (Modus: $MODUS, keine kritischen Funde)."
              echo "qualitaet=ok" >> "$GITHUB_OUTPUT"
              ;;
            1)
              if [ "$MODUS" = "strict" ]; then
                echo "⚠️ Strict-Modus: offene kritische Funde – Qualitätsverstoß."
                echo "qualitaet=verstoß" >> "$GITHUB_OUTPUT"
              else
                echo "ℹ️ Offene Funde im Report-Modus (Modus: $MODUS) – kein Verstoß."
                echo "qualitaet=ok" >> "$GITHUB_OUTPUT"
              fi
              ;;
            2)
              echo "🛑 Selbsttest rot – Sabotage verhindert, Pipeline abgebrochen."
              echo "qualitaet=sabotage" >> "$GITHUB_OUTPUT"
              exit 2
              ;;
            *)
              echo "🛑 Unerwarteter Gate-Exit-Code $GATE_EXIT – fail-closed."
              echo "qualitaet=sabotage" >> "$GITHUB_OUTPUT"
              exit 2
              ;;
          esac

      - name: Labels sicherstellen (C12)
        # C12: Ein Melder, der am Melden scheitert, ist schlimmer als kein
        # Melder. `gh issue` mit unbekanntem Label endet in HTTP 422 (#209).
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create qualitaet --repo "$GITHUB_REPOSITORY" \
            --color "0e8a16" --description "Sprach- und Inhaltsqualität" --force || true
          gh label create sprach-qualitaet --repo "$GITHUB_REPOSITORY" \
            --color "1d76db" --description "Sprach-Qualitäts-Pipeline (Grammatik, Lektorat, Lesbarkeit)" --force || true
          gh label create automatisiert --repo "$GITHUB_REPOSITORY" \
            --color "5319e7" --description "Automatisch erzeugte Meldung" --force || true

      - name: Issue bei Qualitätsverstoß eröffnen (strict)
        if: steps.status.outputs.qualitaet == 'verstoß'
        uses: peter-evans/create-issue-from-file@433e51abf769039ee20ba1293a088ca19d573b7f # v4.0.1
        with:
          title: "🚨 Sprach-Qualität: offene kritische Funde (Copy-Editing-Gate)"
          content-filepath: COPY-EDITING-REPORT.md
          # `labels`/`assignees` sind bei dieser Action kommagetrennte
          # ZEICHENKETTEN – keine YAML-Liste. Eine Liste hier macht die
          # GANZE Datei ungültig: „(Line: 205, Col: 19): A sequence was
          # not expected“, der Workflow wird verworfen und jeder Push
          # erzeugt einen Lauf mit 0 Jobs. Genau das war er.
          labels: "qualitaet, sprach-qualitaet, automatisiert"
          assignees: ""

      - name: Reports als Artefakte sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sprach-qualitaet-reports
          path: |
            COPY-EDITING-REPORT.md
            .copy_editing_report.json
            GRAMMATIK-REPORT.md
            .grammar_report.json
            HARDCASES-REPORT.md
            ZEIT-RECHTSCHREIBUNG-REPORT.md
            .zeit_rechtschreibung_report.json
            SPRACHGLATT-REPORT.md
            .sprachglatt_report.json
            LEKTOR-REPORT.md
          retention-days: 30

      - name: History-Commit (versioniert, dedupliziert)
        # Nur wenn der Lauf beweisbar gesund war: Ein roter Selbsttest darf
        # keine Spuren in die Historie schreiben (C15) – auch nicht „zur
        # Dokumentation“.
        if: steps.status.outputs.qualitaet != 'sabotage'
        run: |
          set -u
          git config user.name "franksfinanzcheck-bot"
          git config user.email "bot@franksfinanzcheck.de"

          # Nur vorhandene Pfade stagen. `git add` auf einen fehlenden Pfad
          # bricht die GANZE Staging-Phase ab (Exit 1, alle Pfade desselben
          # Befehls) – deshalb die Existenzprüfung statt `2>/dev/null || true`.
          HISTORIE="data/copy_editing_history.jsonl
          data/hardcases_history.jsonl
          data/sprachglatt_history.jsonl
          data/zeit_rechtschreibung_history.jsonl
          data/lektor_history.jsonl
          data/grammar_whitelist.txt"
          for pfad in $HISTORIE; do
            if [ -f "$pfad" ]; then
              git add "$pfad"
            else
              echo "ℹ️  übersprungen (nicht vorhanden): $pfad"
            fi
          done

          if git diff --cached --quiet; then
            echo "✅ Keine History-Änderung – nichts zu committen."
            exit 0
          fi

          git commit -m "chore(sprache): Copy-Editing-Highend History-Update [skip ci]"
          # Push-Wache: einzig sanktionierter Push-Weg (Retry, Rebase gegen
          # Parallel-Bots, Auto-Heilung generierter Dateien). Kein roher
          # `git push`, kein `|| true` – ein gescheiterter Push muss sichtbar
          # rot werden und nicht still liegen bleiben.
          scripts/git_sync.sh --push-only

      - name: Verstoß als roten Lauf werten (strict, fail-closed)
        # Reihenfolge ist Absicht: Issue, Artefakte und History müssen VOR dem
        # roten Exit gelaufen sein. Ein fehlgeschlagener Schritt beendet den
        # Job nicht, aber jeder folgende Schritt ohne `always()`/`if:` wird
        # übersprungen – deshalb steht das Urteil ganz am Ende.
        if: steps.status.outputs.qualitaet == 'verstoß'
        run: |
          echo "🛑 Strict-Modus: offene kritische Funde."
          echo "   Issue wurde eröffnet, Artefakte gesichert, History committet."
          echo "   Der Lauf endet rot, damit der Verstoß nicht still bleibt."
          exit 1
