# ============================================================
#  ⚡ n8n & WHISPER BRIDGE (0 € Automation)
#  ------------------------------------------------------------
#  Verbindet das selbst gehostete n8n (Docker / Localhost / VPS)
#  und lokale Whisper-Diktate mit dem GitHub Actions & Pages Betrieb.
#
#  Trigger:
#    - repository_dispatch (event_type: n8n_bridge / whisper_ingest)
#    - workflow_dispatch (manuell mit Eingabefeldern)
#    - schedule (Wachhund alle 2 Stunden zur Synchronisation)
# ============================================================
name: n8n & Whisper Bridge

on:
  repository_dispatch:
    types: [n8n_bridge, whisper_ingest, omnichannel_dispatch]
  workflow_dispatch:
    inputs:
      aktion:
        description: "Aktion ausführen"
        required: true
        default: "status"
        type: choice
        options:
          - "status"
          - "inbox_verarbeiten"
          - "orchestrator_lauf"
      payload_json:
        description: "Optionaler JSON Payload"
        required: false
        default: "{}"
  schedule:
    - cron: "15 */2 * * *"

permissions:
  contents: write

# Der Zwei-Stunden-Wächter darf sich nicht selbst mit einem parallel laufenden
# Lauf um denselben State/Draft-Commit bekämpfen. Wartende Läufe werden bewusst
# nicht abgebrochen, sondern seriell abgearbeitet.
concurrency:
  group: n8n-whisper-bridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Code auschecken
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Python 3.11 einrichten
        # v7 nutzt die aktuelle Node-Runtime der Actions-Plattform. Kein
        # pip-cache: Der Bridge-Job ist klein; ein Cache-Ausfall darf den
        # produktiven Watchdog nicht bereits beim Runtime-Setup blockieren.
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          check-latest: false

      - name: Grund-Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --retries 5 --timeout 30 \
            -r requirements-n8n-bridge.txt

      - name: Selbsttest aller 3 Säulen (Fail-Closed)
        run: |
          python3 scripts/whisper_engine.py --selftest
          python3 scripts/n8n_bridge.py --selftest
          python3 scripts/blogautomatik_orchestrator.py --selftest

      - name: Eingehenden Webhook / Dispatch verarbeiten
        env:
          EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          INPUT_ACTION: ${{ github.event.inputs.aktion }}
          INPUT_PAYLOAD: ${{ github.event.inputs.payload_json }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "📥 Verarbeite repository_dispatch: ${{ github.event.action }}"
            python3 scripts/n8n_bridge.py --receive-payload "$EVENT_PAYLOAD"
          elif [ "${INPUT_ACTION}" = "inbox_verarbeiten" ]; then
            echo "🎙 Verarbeite Whisper-Inbox..."
            python3 scripts/whisper_engine.py --watch-dir data/whisper_inbox/
          elif [ "${INPUT_ACTION}" = "orchestrator_lauf" ]; then
            echo "🚀 Starte Master-Orchestrator..."
            python3 scripts/blogautomatik_orchestrator.py --pipeline voice-to-publish
          else
            echo "📊 Ermittle System-Status..."
            python3 scripts/blogautomatik_orchestrator.py --status
          fi

      - name: Änderungen festschreiben (Drafts, Logs, State)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/drafts/ data/ data/whisper_inbox/ || true
          if git diff --staged --quiet; then
            echo "Keine Änderungen zum Committen."
          else
            git commit -m "chore(n8n-bridge): Automatisierte Synchronisation [skip ci]"
            # REPARATUR 04.10.2026 (Issue #547 – Vorgang WF-C545, Restfall):
            # Hier stand `git push origin HEAD:<ref> || echo "…"`. Zwei
            # Mängel in einer Zeile: (1) roher Push ohne Retry/Rebase,
            # obwohl dieser Wachhund alle 2 Stunden mitten im Takt der
            # übrigen Bots läuft; (2) `|| echo` verschluckte JEDEN
            # Fehlschlag als harmlose Notiz – Drafts, Whisper-Inbox und
            # State blieben unbemerkt liegen, der Lauf blieb grün.
            # git_sync.sh pusht auf denselben Branch (BRANCH-Default =
            # GITHUB_REF_NAME) und bringt Retries, Rebase-Runden und eine
            # präzise Fehlermeldung mit (inkl. Auth-Erkennung, falls dem
            # Lauf wirklich einmal die Schreibrechte fehlen).
            if scripts/git_sync.sh --push-only; then
              echo "✅ Bridge-Stand gesichert."
            else
              echo "::warning::Bridge-Stand nicht gepusht – der nächste Lauf (alle 2 h) holt ihn nach."
            fi
          fi
