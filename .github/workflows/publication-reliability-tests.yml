name: Publication reliability regression tests
on:
  pull_request:
    paths:
      # Die Regressionstests prüfen ausdrücklich den gesamten Content-Bestand
      # (u. a. Affiliate-Intent). Content-only-Korrekturen müssen sie deshalb
      # genauso auslösen wie Änderungen am Detektor selbst (#493).
      - 'content/**'
      # Originalbilder und ihre Provenienz sind Teil des Publikationsvertrags.
      - 'static/**'
      - 'layouts/**'
      - 'assets/**'
      - 'themes/**'
      - 'hugo.toml'
      - 'requirements*.txt'
      - '.github/actions/**'
      # #634: Auch reine Zustands-/Merge-Vertragsänderungen brauchen den
      # Offline-Nachweis; content-reserve läuft auf PR-Refs absichtlich nicht.
      - 'data/reserve-*.json'
      - '.gitattributes'
      - 'scripts/**'
      # Die Dependabot-Policy wird in der Suite strukturell geprüft.
      - '.github/dependabot.yml'
      - '.github/workflows/**'
      # Die Commit-Sperre der Markenfläche und ihre Selbstscharfstellung
      # werden hier mitgeprüft (WF-A4E0): Änderungen am Haken müssen die
      # Regressionstests auslösen, sonst prüft niemand die Leitplanke.
      - '.githooks/**'
      # Der Zugangs-Namensvertrag (Code-Scanning-Alert #78) liest das
      # Kanal-Playbook direkt: Eine Änderung an data/social/** muss die
      # Regressionstests auslösen, sonst könnte das Feld `pflicht_env:`
      # unbemerkt wieder `secrets:` heißen.
      - 'data/social/**'
      # Das Manifest wird gegen den Live-Bestand geprüft; auch eine isolierte
      # Änderung daran muss die Regressionstests auslösen (#1041).
      - 'data/lcp_images.json'
      # Search-Console-Daten (24.10.2026): Am 21.10. reiste eine Datei nach
      # main, die zwei Läufe übereinander enthielt. Der PR, der sie brachte,
      # hat KEINEN Test ausgelöst – `data/gsc/` stand in keiner Pfadliste.
      # tests/test_gsc_artefakte.py prüft genau diese Dateien; ohne diesen
      # Eintrag liefe der Test bei genau den Änderungen nicht, für die er da ist.
      - 'data/gsc/**'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    # 08.11.2026: 30 -> 45 Minuten. Die Suite läuft in diesem Job ZWEIMAL
    # (Code-Regression und Uhr-Probe an fremden Kalendertagen). Am aufgenommenen
    # Stand brauchten die beiden Schritte 8m33s und 8m28s; seitdem ist die Suite
    # um rund 230 Tests gewachsen und braucht lokal gemessen 14m29s je Lauf
    # (5676 Tests, echter Hugo-Build, Hugo 0.168.0). Zwei solche Läufe plus
    # Build, Reserve-Snapshot und KI-Probe sprengen 30 Minuten allein durch
    # Rechenzeit – Lauf 42504141712 wurde bei 30m0s abgeschnitten, obwohl der
    # Code-Regression-Schritt durch war. Die Grenze ist eine Notbremse gegen
    # Hänger, keine Messung; die Prüfungen selbst bleiben unverändert. Wer sie
    # wieder senkt, muss die Schrittdauern im letzten grünen Lauf nachweisen.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install -q --require-hashes -r "$GITHUB_WORKSPACE/requirements-ci.txt"
      - name: Hugo Extended installieren
        uses: ./.github/actions/install-hugo
        with:
          version: "0.168.0"
      - name: Echter Hugo-Produktionsbuild (kein Mock)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/hugo-build
        with:
          args: --minify --destination public --cleanDestinationDir
      - name: KI-Cover – Provenienz des PR-Bestands
        if: ${{ !cancelled() }}
        run: python3 scripts/ki_cover_provenienz.py --gate
      # Harte, verständliche Vorprüfung für die Actions-Kontrollfläche. Das
      # Unit-Test-Netz darunter enthält zusätzlich Sabotageproben des Audits.
      - name: Workflow-Permissions und Betriebsverträge prüfen
        run: python3 scripts/automation_premium_audit.py --strict
      # MESSEN STATT SIEGEL LESEN (26.10.2026)
      # Das Zertifikat ist eine Messung über BYTES. Sobald ein Kandidat
      # redaktionell (oder durch einen Frontmatter-Fix) geändert wird, ist der
      # alte Hash zu Recht ungültig – der PR wäre blockiert, bis der nächtliche
      # Reserve-Lauf auf main neu zertifiziert. Genau das ist am 26.10. passiert:
      # ein YAML-Fix in `description` entwertete den Nachweis eines fertigen
      # Entwurfs. Die Prüfung darf deshalb nicht das alte Siegel bewerten,
      # sondern die FÄHIGKEIT, ein neues zu erzeugen: Kandidaten werden mit der
      # echten Kette nachgemessen, das Ergebnis geprüft und der Mess-Schreib-
      # zugriff danach verworfen (kein Repo-Commit, keine stille Reife).
      - name: Reserve-Snapshot – Nachweis am gemessenen Stand statt am alten Siegel (#634)
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq hunspell hunspell-de-de
          python3 scripts/reserve_recert.py --fix | tee /tmp/reserve-recert.log
          python3 scripts/reserve_artifacts.py --check
          # Die Nachmessung darf Spuren in Zustand UND Beweis-Ledger hinterlassen
          # (reserve_quarantine.audit() schreibt nach data/audit). Beides wird
          # vollständig zurückgesetzt: C27 verbietet jedem Testlauf, Beweise zu
          # schreiben – auch einem, der selbst ein Beweis ist.
          git checkout -- data/reserve-readiness.json data/reserve-history.jsonl \
            data/reserve-quarantine.json data/reserve-custody.json data/audit 2>/dev/null || true
          git clean -qfd data/audit 2>/dev/null || true
          if [ -n "$(git status --porcelain -- data/audit data/reserve-readiness.json)" ]; then
            echo "🛑 Nachmessung hat den Repo-Stand verändert – Nachweis nicht isoliert."
            git status --porcelain -- data/audit data/reserve-readiness.json
            exit 1
          fi
      # BLUSTRADIUS (Dauerheilung #676, 09.10.2026): Dieser Job ist der
      # EINZIGE Ort, an dem die volle Unit-Test-Suite läuft. Am 09.10. war
      # der Reserve-Snapshot oben rot – zwei alte SHA-256-Zertifikate, ein
      # reiner DATEN-Befund – und die Suite darunter wurde `skipped`. Damit
      # prüfte kein Lauf mehr, ob der Code noch tut, was die Regeln
      # versprechen; auch die neuen Tests aus #674 und #676 liefen nie.
      # Ein Befund über einen Zustand darf nicht die Prüfung des Codes
      # einfrieren (dieselbe Klasse wie #676: ein Artikel blockierte die
      # Auslieferung aller 75). Der Job bleibt über den Snapshot rot –
      # fail-closed im Sinne von #634 – aber er liefert wieder Signal.
      # `!cancelled()` ist das Haus-Muster, siehe Beweis-Ledger-Schritt unten.
      - name: Code-Regression – Suite und Selbsttests
        if: ${{ !cancelled() }}
        run: |
          # EIN ROTER TEST MUSS SEINEN NAMEN SAGEN (08.11.2026).
          # „Process completed with exit code 1" ist keine Diagnose: Ohne den
          # Testnamen beginnt jede Ferndiagnose mit Raten – und wer die Logs
          # nicht abrufen kann (Sandbox, Aufbewahrungsfrist), kommt gar nicht
          # an die Ursache. Jeder rote Test wird deshalb als Annotation an den
          # Lauf gehängt (lesbar über die Check-Runs-API, unabhängig vom Log).
          set +e
          python3 -m unittest discover -s scripts/tests -v > /tmp/suite.log 2>&1
          SUITE_RC=$?
          set -e
          tail -120 /tmp/suite.log
          if [ "$SUITE_RC" != "0" ]; then
            # Name UND Behauptung: Der Name sagt, WER rot ist, der Rumpf sagt,
            # WARUM. Ohne beides endet jede Ferndiagnose in „nochmal raten".
            python3 - <<'PYANNO'
          import re
          import pathlib

          def ent(text: str) -> str:
              # GitHub-Annotation: %, Zeilenumbrüche und CR maskieren.
              return (text.replace('%', '%25').replace('\r', '')
                          .replace('\n', '%0A'))[:1500]

          log = pathlib.Path('/tmp/suite.log').read_text(errors='ignore')
          muster = re.compile(r'^(FAIL|ERROR): (\S+) \((.*?)\)\n-+\n(.*?)'
                              r'(?=\n(?:={20,}|-{20,}|Ran \d+ tests))', re.S | re.M)
          for art, name, ort, rumpf in list(muster.findall(log))[:10]:
              print(f"::error title=Code-Regression::{ent(name)} ({ent(ort)})"
                    f" %0A{ent(rumpf)}")
          PYANNO
            exit 1
          fi
          python3 scripts/engine_generate.py --selftest
          python3 scripts/reserve_pool.py --selftest
          python3 scripts/cadence_guard.py --selftest
          python3 scripts/fm_boundary_guard.py --selftest
          python3 scripts/social_studio.py --selftest
          python3 scripts/fm_boundary_guard.py --check
      # Zeitbomben-Schutz (Nebenbefund zu #614): Am 01.10.2026 wurde genau
      # diese Prüfung rot, ohne dass jemand Code angefasst hatte –
      # test_social_perf_feedback baute seine Fixtures von der echten Wanduhr
      # und plante gleichzeitig für den 14.09.2026 (drei Wochen später lag
      # jeder Artikel hinter allen Slots). Als `--selftest`-Skript hätte die
      # Uhr-Probe das am ersten Tag gefunden; Testmodule kannte sie nicht.
      # Jetzt läuft die ganze Suite ein zweites Mal unter einer um 97 Tage
      # vorgestellten Uhr: dieselben Tests, fremdes Datum, gleiches Ergebnis.
      - name: Uhr-Probe – die Suite muss an jedem Kalendertag grün sein
        if: ${{ !cancelled() }}   # Blustradius #676: Daten-Befund schaltet Code-Prüfung nicht aus
        run: python3 scripts/selftest_clock.py --trap-discover scripts/tests --offset 97
      # KI-PROBE (Dauerheilung Content-Engine v2 #138, 08.10.2026): Jeder
      # Selbsttest, den irgendein Workflow aufruft, läuft hier mit Attrappen-
      # Schlüsseln und gesperrtem Netz. Hier fehlen echte Schlüssel – in der
      # Produktion nicht. Ein Selbsttest, der dann das Modell fragt, urteilt
      # nach Tagesform des Modells statt nach dem Code (Run 37694986440: Lauf
      # tot vor Phase 1). Die Probe meldet jeden Netzversuch mit Datei/Zeile,
      # auch wenn der Aufrufer die Ausnahme schluckt.
      - name: KI-Probe – kein Selbsttest darf am Modell oder am Netz hängen (#138)
        if: ${{ !cancelled() }}   # Blustradius #676
        run: |
          python3 scripts/selftest_ki.py --selftest
          python3 scripts/selftest_ki.py --trap-workflows
      # Ledger-Isolation (C27, Nebenbefund zu #610): audit_log trägt den
      # Vertrag, repo_isolation stellt die Sandbox für Tests. Beide prüfen in
      # beide Richtungen – Umlenkung wirkt UND Normalfall bleibt scharf.
      - name: Beweis-Ledger-Isolation (Selbsttests)
        if: ${{ !cancelled() }}   # Blustradius #676
        run: |
          python3 scripts/audit_log.py --selftest
          python3 scripts/repo_isolation.py --selftest
      # Empirische Leitplanke statt statischer Regel: data/audit/ ist ein
      # versioniertes, append-only bewachtes BEWEIS-Ledger (history_guard H6).
      # Bis 07.10.2026 schrieben drei Unit-Tests echte Zeilen hinein – u. a.
      # einen gate-Entscheid für den Fixture-Artikel `2026-09-07-r5-live`, der
      # am 03.10.2026 committet wurde. Der Schritt läuft auch nach einem
      # fehlgeschlagenen Testlauf: Gerade dann ist die Frage interessant, ob
      # das Buch sauber geblieben ist.
      - name: Beweis-Ledger muss nach den Tests unberührt sein
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$(git status --porcelain -- data/audit)" ]; then
            echo "🛑 C27 verletzt: Ein Testlauf hat ins versionierte Beweis-Ledger geschrieben."
            echo "   data/audit/ ist append-only (history_guard H6) – ein Testeintrag ist ein fabrizierter Beweis."
            git status --porcelain -- data/audit
            git diff --stat -- data/audit
            echo "   Heilung: Den Aufruf in \`with beweis_ledger_unangetastet(…)\` fassen"
            echo "   (scripts/repo_isolation.py). Die Wache test_audit_ledger_isolation.py"
            echo "   meldet denselben Befund bereits mit Datei und Zeile."
            exit 1
          fi
          echo "✅ data/audit/ unverändert – die Tests schreiben keine Beweise."
