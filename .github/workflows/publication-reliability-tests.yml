name: Publication reliability regression tests
on:
  pull_request:
    paths:
      # Die Regressionstests prüfen ausdrücklich den gesamten Content-Bestand
      # (u. a. Affiliate-Intent). Content-only-Korrekturen müssen sie deshalb
      # genauso auslösen wie Änderungen am Detektor selbst (#493).
      - 'content/**'
      # #634: Auch reine Zustands-/Merge-Vertragsänderungen brauchen den
      # Offline-Nachweis; content-reserve läuft auf PR-Refs absichtlich nicht.
      - 'data/reserve-*.json'
      - '.gitattributes'
      - 'scripts/**'
      - '.github/workflows/**'
      # Die Commit-Sperre der Markenfläche und ihre Selbstscharfstellung
      # werden hier mitgeprüft (WF-A4E0): Änderungen am Haken müssen die
      # Regressionstests auslösen, sonst prüft niemand die Leitplanke.
      - '.githooks/**'
      # Der Zugangs-Namensvertrag (Code-Scanning-Alert #78) liest das
      # Kanal-Playbook direkt: Eine Änderung an data/social/** muss die
      # Regressionstests auslösen, sonst könnte das Feld `pflicht_env:`
      # unbemerkt wieder `secrets:` heißen.
      - 'data/social/**'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m pip install -q pyyaml pillow cryptography
      # Harte, verständliche Vorprüfung für die Actions-Kontrollfläche. Das
      # Unit-Test-Netz darunter enthält zusätzlich Sabotageproben des Audits.
      - name: Workflow-Permissions und Betriebsverträge prüfen
        run: python3 scripts/automation_premium_audit.py --strict
      - name: Reserve-Snapshot – vollständiger Nachweis statt Merge-Chimäre (#634)
        run: python3 scripts/reserve_artifacts.py --check
      - run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/engine_generate.py --selftest
          python3 scripts/reserve_pool.py --selftest
          python3 scripts/cadence_guard.py --selftest
          python3 scripts/fm_boundary_guard.py --selftest
          python3 scripts/social_studio.py --selftest
          python3 scripts/fm_boundary_guard.py --check
      # Zeitbomben-Schutz (Nebenbefund zu #614): Am 01.10.2026 wurde genau
      # diese Prüfung rot, ohne dass jemand Code angefasst hatte –
      # test_social_perf_feedback baute seine Fixtures von der echten Wanduhr
      # und plante gleichzeitig für den 14.09.2026 (drei Wochen später lag
      # jeder Artikel hinter allen Slots). Als `--selftest`-Skript hätte die
      # Uhr-Probe das am ersten Tag gefunden; Testmodule kannte sie nicht.
      # Jetzt läuft die ganze Suite ein zweites Mal unter einer um 97 Tage
      # vorgestellten Uhr: dieselben Tests, fremdes Datum, gleiches Ergebnis.
      - name: Uhr-Probe – die Suite muss an jedem Kalendertag grün sein
        run: python3 scripts/selftest_clock.py --trap-discover scripts/tests --offset 97
      # KI-PROBE (Dauerheilung Content-Engine v2 #138, 08.10.2026): Jeder
      # Selbsttest, den irgendein Workflow aufruft, läuft hier mit Attrappen-
      # Schlüsseln und gesperrtem Netz. Hier fehlen echte Schlüssel – in der
      # Produktion nicht. Ein Selbsttest, der dann das Modell fragt, urteilt
      # nach Tagesform des Modells statt nach dem Code (Run 37694986440: Lauf
      # tot vor Phase 1). Die Probe meldet jeden Netzversuch mit Datei/Zeile,
      # auch wenn der Aufrufer die Ausnahme schluckt.
      - name: KI-Probe – kein Selbsttest darf am Modell oder am Netz hängen (#138)
        run: |
          python3 scripts/selftest_ki.py --selftest
          python3 scripts/selftest_ki.py --trap-workflows
      # Ledger-Isolation (C27, Nebenbefund zu #610): audit_log trägt den
      # Vertrag, repo_isolation stellt die Sandbox für Tests. Beide prüfen in
      # beide Richtungen – Umlenkung wirkt UND Normalfall bleibt scharf.
      - name: Beweis-Ledger-Isolation (Selbsttests)
        run: |
          python3 scripts/audit_log.py --selftest
          python3 scripts/repo_isolation.py --selftest
      # Empirische Leitplanke statt statischer Regel: data/audit/ ist ein
      # versioniertes, append-only bewachtes BEWEIS-Ledger (history_guard H6).
      # Bis 07.10.2026 schrieben drei Unit-Tests echte Zeilen hinein – u. a.
      # einen gate-Entscheid für den Fixture-Artikel `2026-09-07-r5-live`, der
      # am 03.10.2026 committet wurde. Der Schritt läuft auch nach einem
      # fehlgeschlagenen Testlauf: Gerade dann ist die Frage interessant, ob
      # das Buch sauber geblieben ist.
      - name: Beweis-Ledger muss nach den Tests unberührt sein
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$(git status --porcelain -- data/audit)" ]; then
            echo "🛑 C27 verletzt: Ein Testlauf hat ins versionierte Beweis-Ledger geschrieben."
            echo "   data/audit/ ist append-only (history_guard H6) – ein Testeintrag ist ein fabrizierter Beweis."
            git status --porcelain -- data/audit
            git diff --stat -- data/audit
            echo "   Heilung: Den Aufruf in \`with beweis_ledger_unangetastet(…)\` fassen"
            echo "   (scripts/repo_isolation.py). Die Wache test_audit_ledger_isolation.py"
            echo "   meldet denselben Befund bereits mit Datei und Zeile."
            exit 1
          fi
          echo "✅ data/audit/ unverändert – die Tests schreiben keine Beweise."
