# Risikobasierte Redaktion: Bestand sichtbar halten, neue YMYL-Publikationen
# blockiert zusätzlich das in publish_gate.py verdrahtete harte Gate.
#
# Prüfqueue #826 (24.10.2026 · gehärtet 03.11.2026, #1024):
# Das Gate prüft den TEXT, nicht das NETZ. Eine zitierte Quelle kann
# verschwinden oder – schlimmer – unter derselben Adresse durch einen anderen
# Artikel ersetzt werden; das Siegel bleibt dabei formal gültig. Deshalb prüft
# der zweite Job zusätzlich die Belegketten (URLs) der Hochrisiko-Artikel.
# Das Arbeits-Ticket wird erst geschlossen, wenn BEIDE Prüfungen grün sind
# (Gate-Queue leer UND Belegketten-Wache Exit 0).
#
# Härtung #1024:
#  · `belegketten_wache.py --selftest` läuft explizit offline vor dem Live-Lauf
#    (und ist in `governance_contract.py` C6 sowie `selftest_ki.py` verankert).
#  · Kein `continue-on-error` auf dem Messschritt: Exit-Code wird deterministisch
#    über `|| rc=$?` erfasst; Exit 0 = grün, Exit 1 = offener Beleg-Prüfauftrag
#    im Ticket, Exit >= 2 = echter Werkzeugfehler (Lauf schlägt am Ende hart fehl).
#  · `GH_TOKEN` speist den `api.github.com`-Zweitweg des Bundesrechts-Spiegels
#    mit authentifiziertem Kontingent, falls `raw.githubusercontent.com` drosselt.
name: Redaktionelle YMYL-Prüfung

on:
  schedule:
    - cron: "20 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redaktionelle-ymyl-pruefung
  cancel-in-progress: false

jobs:
  pruefung:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      open: ${{ steps.audit.outputs.open }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Abhängigkeit installieren
        run: python3 -m pip install -q --require-hashes -r "$GITHUB_WORKSPACE/requirements-ci.txt"

      - name: Regelwerk selbst prüfen
        run: |
          python3 scripts/editorial_review_gate.py --selftest
          python3 scripts/belegketten_wache.py --selftest
          python3 -m unittest discover -s scripts/tests -p 'test_editorial_review_gate.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_ymyl_write_contract.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_ymyl_maintenance_writers.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_belegketten_wache.py' -v

      - name: Bestand prüfen und Review-Queue erzeugen
        id: audit
        run: |
          python3 scripts/editorial_review_gate.py --all --report --json > ymyl-review.json
          cat REDAKTIONELLE-PRUEFUNG-REPORT.md >> "$GITHUB_STEP_SUMMARY"
          OPEN=$(python3 -c 'import json; d=json.load(open("data/editorial_review_queue.json", encoding="utf-8")); print(d["open_live"] + d["open_drafts"])')
          echo "open=$OPEN" >> "$GITHUB_OUTPUT"

      - name: Prüfbericht sichern
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redaktionelle-ymyl-pruefung
          path: |
            REDAKTIONELLE-PRUEFUNG-REPORT.md
            data/editorial_review_queue.json
            ymyl-review.json

  # Belegketten-Wache (Prüfqueue #826 / #1024). Sie schreibt nichts und
  # entscheidet nichts: Sie meldet tote oder umgezogene Zitate. Netzfehler
  # gelten als „unklar“, nicht als tote Quelle. Für die automatische
  # Ticket-Erledigung müssen aber auch diese Prüfaufträge geklärt sein.
  belegketten:
    needs: pruefung
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Abhängigkeit installieren
        run: python3 -m pip install -q --require-hashes -r "$GITHUB_WORKSPACE/requirements-ci.txt"

      - name: Selbsttest der Belegketten-Wache (ohne Netz)
        run: python3 scripts/belegketten_wache.py --selftest

      - name: Belegketten der Hochrisiko-Artikel prüfen
        id: wache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rc=0
          python3 scripts/belegketten_wache.py --nur-hochrisiko --report --strict --require-complete || rc=$?
          echo "exit=$rc" >> "$GITHUB_OUTPUT"

      - name: Befund sichern (auch bei offenem Prüfauftrag)
        if: always()
        run: |
          if [ -f BELEGKETTEN-WACHE-REPORT.md ]; then
            cat BELEGKETTEN-WACHE-REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Kein Wache-Bericht erzeugt – siehe Job-Protokoll." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Bericht hochladen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: belegketten-wache
          path: BELEGKETTEN-WACHE-REPORT.md
          if-no-files-found: ignore

      - name: Redaktionellen Bericht aus dem vorherigen Job laden
        if: always() && needs.pruefung.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: redaktionelle-ymyl-pruefung
          path: gate-bericht

      # Ein Arbeits-Ticket für beide Befunde. Fail-closed: ist die Gate-Zahl
      # unbekannt oder der Exit-Code der Wache ungleich 0, bleibt das Ticket offen.
      - name: Arbeits-Ticket pflegen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_RESULT: ${{ needs.pruefung.result }}
          GATE_OPEN: ${{ needs.pruefung.outputs.open }}
          WACHE_EXIT: ${{ steps.wache.outputs.exit }}
        run: |
          set -euo pipefail
          gh label create redaktionelle-pruefung --repo "$GITHUB_REPOSITORY" \
            --color "B42318" \
            --description "YMYL-Fachprüfung vor Freigabe oder Review überfällig" --force || true
          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label redaktionelle-pruefung --json number --jq '.[0].number // empty')

          TICKET_OFFEN=0
          [ "${GATE_OPEN:-}" != "0" ] && TICKET_OFFEN=1
          [ "${GATE_RESULT:-}" != "success" ] && TICKET_OFFEN=1
          [ "${WACHE_EXIT:-}" != "0" ] && TICKET_OFFEN=1

          if [ "$TICKET_OFFEN" = "1" ]; then
            {
              echo "> **Status der Prüfqueue:** Gate=\`${GATE_RESULT:-unbekannt}\` (offene Freigaben: **${GATE_OPEN:-?}**)" \
                   "· Belegketten-Wache Exit=\`${WACHE_EXIT:-—}\`"
              echo
              if [ -f gate-bericht/REDAKTIONELLE-PRUEFUNG-REPORT.md ]; then
                cat gate-bericht/REDAKTIONELLE-PRUEFUNG-REPORT.md
              else
                printf '# Redaktionelle YMYL-Prüfqueue\n\nGate-Bericht fehlt; keine automatische Erledigung.\n'
              fi
              if [ "${WACHE_EXIT:-}" != "0" ]; then
                printf '\n\n---\n\n'
                if [ -f BELEGKETTEN-WACHE-REPORT.md ]; then
                  cat BELEGKETTEN-WACHE-REPORT.md
                else
                  printf '# Belegketten-Wache\n\n🛑 Wache hat keinen Bericht erzeugt (Exit `%s`) – Werkzeugfehler im Laufprotokoll prüfen.\n' "${WACHE_EXIT:-—}"
                fi
              fi
            } > ticket-body.md
            if [ -n "$ISSUE" ]; then
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" \
                --title "Redaktionelle YMYL-Prüfqueue" \
                --body-file ticket-body.md
            else
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "Redaktionelle YMYL-Prüfqueue" \
                --label redaktionelle-pruefung \
                --body-file ticket-body.md
            fi
            echo "Ticket offen: Gate=$GATE_OPEN, WacheExit=${WACHE_EXIT:-—}"
          else
            gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --label redaktionelle-pruefung --json number --jq '.[].number' \
              | while read -r issue; do
                  [ -z "$issue" ] && continue
                  gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
                    --comment "Alle dokumentierten YMYL-Freigaben und Review-Termine sind grün, und alle zitierten Belegketten sind ohne offene Abrufbefunde erreichbar (keine tote, unklare oder umgeleitete Quelle)."
                done
          fi

      - name: Werkzeug-Integrität der Belegketten-Wache
        if: always()
        env:
          WACHE_EXIT: ${{ steps.wache.outputs.exit }}
        run: |
          set -euo pipefail
          case "${WACHE_EXIT:-}" in
            0|1)
              echo "Belegketten-Wache regulär beendet (Exit ${WACHE_EXIT})."
              ;;
            *)
              echo "::error::Belegketten-Wache mit Werkzeugfehler abgebrochen (Exit '${WACHE_EXIT:-—}') – Code/Protokoll prüfen."
              exit 1
              ;;
          esac
