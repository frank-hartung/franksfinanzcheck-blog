name: Unique-Content-Guard

# ============================================================
#  Wöchentliche Profi-Level-Prüfung auf Unique Content (14.08.2026,
#  Frank: "Tool zur Prüfung von Unique Content mit Selbstheilung").
#
#  W1-W4 (web_uniqueness_guard.py): Web-Duplikat-Suche (optional, Google
#  Programmable Search Engine), technischer Duplicate-Content-Crawl der
#  eigenen Website (Titel/Description/Canonical), Indexierungs-Audit
#  (robots-Meta/Sitemap/IndexNow-Konsistenz).
#
#  D1-D3 (content_depth_guard.py): Themen-Tiefe – Folgefragen (FAQ),
#  Sonderfälle/Ausnahmen, Teilaspekt-Breite. KI-gestützte Selbstheilung
#  (ergänzt fehlende FAQ/Sonderfälle automatisch, mit Rollback-Schutz
#  bei Qualitätsproblemen).
#
#  Ergänzt scripts/plagiat_guard.py (interne Duplikate, bereits in
#  blog_doktor.py) um die externe/technische/inhaltliche Tiefen-Ebene.
#
#  Aktueller Rechts-/Regelstand: SEO-STANDARDS-2026.md.
# ============================================================

on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 5 * * 4"   # Donnerstag 07:30 MESZ (05:30 UTC)

permissions:
  contents: write
  issues: write

concurrency:
  group: unique-content-guard
  cancel-in-progress: false

jobs:
  uniqueness:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Hugo installieren
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hugo-Build (für Crawl + Sitemap-Check)
        run: hugo --minify

      - name: Web-Uniqueness-Guard (Web-Duplikate, Site-Crawl, Indexierung)
        id: web
        continue-on-error: true
        env:
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_CX: ${{ vars.GOOGLE_CSE_CX }}
        run: |
          python3 scripts/web_uniqueness_guard.py | tee /tmp/web_uniqueness_log.txt
          exit ${PIPESTATUS[0]}

      - name: Web-Uniqueness-Fixes + Report committen
        run: |
          git config user.name "SEO-Bot"
          git config user.email "seo-bot@users.noreply.github.com"
          # BUGFIX (14.08.2026, im Live-Test gefunden): 'git add' bricht mit
          # einem FATAL-Fehler UND OHNE IRGENDEINE Datei zu stagen ab, wenn
          # auch nur EIN Pfad im selben Aufruf nicht existiert (anders als
          # bei .gitignore-Treffern, die git add nur überspringt) – hier
          # existiert data/web_uniqueness_cache.json nur, wenn der optionale
          # Web-Duplikat-Check mit API-Key lief. Ohne Key wurde durch das
          # gemeinsame 'git add ... || true' bisher STILL GAR NICHTS
          # committet, auch nicht der immer vorhandene Report. Deshalb: pro
          # Pfad ein eigener add-Aufruf.
          git add content/ 2>/dev/null || true
          git add WEB-UNIQUENESS-REPORT.md 2>/dev/null || true
          git add data/web_uniqueness_cache.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Web-Uniqueness-Guard: keine Änderungen."
          else
            git commit -m "seo: Web-Uniqueness-Guard – Duplikate/Indexierung geprüft und geheilt"
            git pull --rebase --autostash origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            git push
          fi

      - name: Issue bei ungelösten Web-Uniqueness-Funden
        if: steps.web.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let details = 'Web-Uniqueness-Guard hat Funde gemeldet.';
            try { details = fs.readFileSync('WEB-UNIQUENESS-REPORT.md', 'utf-8'); } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '🔍 Web-Uniqueness-Guard: Duplicate-Content/Indexierungs-Funde',
              body: details + '\n\n---\nAutomatisch erstellt vom Unique-Content-Guard-Workflow.'
            });

      - name: Content-Depth-Guard (Folgefragen, Sonderfälle, Themenbreite)
        id: depth
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/content_depth_guard.py | tee /tmp/content_depth_log.txt
          exit ${PIPESTATUS[0]}

      - name: Content-Depth-Fixes + Report committen
        run: |
          git config user.name "SEO-Bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add content/ 2>/dev/null || true
          git add CONTENT-DEPTH-REPORT.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Content-Depth-Guard: keine Änderungen."
          else
            git commit -m "content: Content-Depth-Guard – Folgefragen/Sonderfälle KI-gestützt ergänzt"
            git pull --rebase --autostash origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            git push
          fi

      - name: Issue bei verbleibenden Tiefe-Lücken
        if: steps.depth.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let details = 'Content-Depth-Guard hat Lücken gemeldet.';
            try { details = fs.readFileSync('CONTENT-DEPTH-REPORT.md', 'utf-8'); } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '🧠 Content-Depth-Guard: Themen-Tiefe braucht Aufmerksamkeit',
              body: details + '\n\n---\nAutomatisch erstellt vom Unique-Content-Guard-Workflow. Nicht automatisch heilbare Funde (z. B. Themenbreite) brauchen redaktionelle Ergänzung.'
            });
