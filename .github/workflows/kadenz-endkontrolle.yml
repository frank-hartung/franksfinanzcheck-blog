name: Kadenz-Endkontrolle (Mo/Mi/Fr – 2–3 LIVE erzwingen)

on:
  schedule:
    # Early recovery gives deployment and retries time before the UTC deadline.
    - cron: "35 10,16,19,21 * * 1,3,5"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  actions: write

# Same lock as the engine: never allocate the same daily slots concurrently.
concurrency:
  group: content-bot
  cancel-in-progress: false

env:
  MIN_ARTIKEL_PRO_TAG: ${{ vars.MIN_ARTIKEL_PRO_TAG || '2' }}
  MAX_ARTIKEL_PRO_TAG: ${{ vars.MAX_ARTIKEL_PRO_TAG || '3' }}

jobs:
  endkontrolle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ./.github/actions/install-hugo
        with:
          version: "0.164.0"
      - name: Dependencies (fail visibly, not best effort)
        run: |
          pip install pyyaml cryptography pillow pillow-avif-plugin fonttools brotli
          sudo apt-get update -qq
          sudo apt-get install -y -qq hunspell hunspell-de-de
      - name: Recover deterministic holds and queue
        run: |
          # Shortcode-Wache ZUERST (WF-1F8C #522): ein Markdown-Link in einem
          # Shortcode-Parameter toetet den Hugo-Build blog-weit – genau das
          # liess beide Endkontrollen am 02.10. rot laufen. Selbstheilung hier
          # macht die Endkontrolle immun gegen bereits committeten Schaden.
          python3 scripts/shortcode_guard.py --selftest
          python3 scripts/shortcode_guard.py --fix
          python3 scripts/fix_url_hygiene.py --fix
          python3 scripts/fix_url_hygiene.py --heal-holds
          python3 scripts/cadence_guard.py --fix
      - name: Final gates and validated reserve (no AI dependency)
        id: release
        continue-on-error: true
        run: |
          set +e
          python3 scripts/check_covers.py --fix
          covers_rc=$?
          if [ "$covers_rc" -ne 0 ]; then
            echo "::error::KADENZ-VORPRÜFUNG – Cover-/Artikelkorrektur scheitert vor der Endabnahme. Kein Tagesdefizit, sondern ein Gate-Crash."
            echo "rc=$covers_rc" >> "$GITHUB_OUTPUT"
            echo "class=cover-crash" >> "$GITHUB_OUTPUT"
            exit "$covers_rc"
          fi

          python3 scripts/publication_release.py
          rc=$?
          case "$rc" in
            0) klasse=ok ;;
            1) klasse=tagesdefizit ;;
            3) klasse=release-crash ;;
            *) klasse=unknown ;;
          esac
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "class=$klasse" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Persist accepted articles and gate corrections even on deficit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "Kadenz-Backstop"
          git config user.email "kadenz-backstop@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "content: final geprüfte Reserve und Kadenz-Korrekturen"
            scripts/git_sync.sh --push-only
          fi
      - name: Deploy even on unchanged source (previous delivery may have failed)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
      - name: Reconcile final source quota and deficit issue
        id: quota
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          # Der Zustandskanal wird VOR der Klassifikation belegt (WF-1F8C #608):
          # engine_issue.py misst seit dem 07.10.2026 an JEDEM Tag den jüngsten
          # Publikationstag (SSOT cadence_guard.letzter_publikationstag), belegt
          # den Fachkanal `engine-deficit` und öffnet ihn wieder, wenn er
          # geschlossen wurde, obwohl der gemessene Tag rot ist. Genau das
          # fehlte am 06.10.2026 (Ruhetag, #601 per Merge geschlossen): Der
          # verspätete Montags-Slot meldete hier ehrlich rot, das zentrale
          # Fehler-Alerting fand aber keinen offenen, frischen Fachkanal und
          # legte fail-open das generische Wartungs-Issue #608 mit
          # API-Key-Runbook an.
          python3 scripts/engine_issue.py --deficit
          issue_rc=$?
          python3 scripts/publication_check.py
          check_rc=$?
          echo "issue_rc=$issue_rc" >> "$GITHUB_OUTPUT"
          echo "check_rc=$check_rc" >> "$GITHUB_OUTPUT"
          if [ "$issue_rc" -ne 0 ]; then
            echo "::warning::Zustandskanal konnte nicht belegt werden (Exit $issue_rc) – ohne offenen, frischen Fachkanal meldet das Fehler-Alerting fail-open generisch. Das ist ein Melder-Defekt, kein Quotendefekt."
          fi
          if [ "$check_rc" -eq 0 ]; then
            echo "✅ Source-Tagesziel erfüllt; keine rote Kadenz-Meldung nötig."
          else
            echo "::notice::Source-Tagesziel noch unter Minimum; engine-deficit ist der Fachkanal."
          fi
          exit 0

      - name: RELEASE-CRASH – Endabnahme blockiert
        if: ${{ !cancelled() && steps.release.outputs.class == 'release-crash' }}
        run: |
          echo "::error::RELEASE-CRASH (WF-1F8C) – Hugo-Build oder Gate-Werkzeug versagt in der Kadenz-Endabnahme. Das ist KEIN Tagesdefizit; Diagnose steht im Schritt „Final gates and validated reserve“."
          exit 1

      - name: KADENZ-GATE-CRASH – Vorprüfung oder Endabnahme unklassifiziert
        if: ${{ !cancelled() && steps.release.outcome != 'success' && steps.release.outputs.class != 'tagesdefizit' && steps.release.outputs.class != 'release-crash' }}
        run: |
          echo "::error::KADENZ-GATE-CRASH (WF-1F8C) – die Kadenz-Endkontrolle scheitert vor/innerhalb der Endabnahme ohne Tagesdefizit-Klasse. Log des Schritts „Final gates and validated reserve“ prüfen; kein API-Key-Rateversuch."
          exit 1

      - name: TAGESDEFIZIT – Fachmeldung engine-deficit ist zuständig
        if: ${{ !cancelled() && (steps.release.outputs.class == 'tagesdefizit' || (steps.release.outputs.class == 'ok' && steps.quota.outputs.check_rc != '' && steps.quota.outputs.check_rc != '0')) }}
        run: |
          echo "::error::TAGESDEFIZIT (WF-1F8C) – Source liegt unter dem Mindestziel. Der Fachkanal ist das auto-schließende Issue mit Label engine-deficit; kein zweites Wartungs-Issue und kein API-Key-Runbook."
          exit 1
