# ============================================================
#  KI-REDAKTION (Blog-Automatik nach dem Schema
#  „Claude = lange Artikel, ChatGPT = schnelle News, Jasper = SEO")
#
#  KOSTEN-REGEL (Dauervorgabe): Dieser Workflow nutzt AUSSCHLIESSLICH
#  die Gratis-Zugänge GROQ_API_KEY und GEMINI_API_KEY (bereits für die
#  Content-Engine v2 vorhanden). Es werden KEINE Paid-APIs
#  (Anthropic/OpenAI/Jasper) angerufen – die Integration kostet 0 €.
#
#  Die drei Rollen laufen als kostenfreies Funktions-Äquivalent:
#    Rolle Claude  → scripts/claude_writer.py  (lange Premium-Artikel)
#    Rolle ChatGPT → scripts/news_writer.py    (schnelle News-Kompakt)
#    Rolle Jasper  → scripts/jasper_seo.py     (SEO-Pass, deterministisch)
#
#  WICHTIG: Es entsteht NIE ein zweiter Veröffentlicher. Alle Ausgaben
#  sind Entwürfe (draft: true, ohne cadence_wait). Live geht nur, was
#  Frank bewusst freigibt (ki_redaktion.py --promote) – dann über den
#  bewährten cadence_guard (Mo/Mi/Fr, 2–3 Artikel/Tag).
# ============================================================
name: KI-Redaktion

on:
  schedule:
    # Lange Premium-Artikel + SEO-Pass an Publikationstagen (Mo/Mi/Fr),
    # VOR der Content-Engine (08:10 MESZ), damit der Entwurf bereitliegt.
    - cron: "30 4 * * 1,3,5"    # 06:30 MESZ
    # Schnelle News an den Zwischen-Tagen (Di/Do) – nur als Entwurf.
    - cron: "30 4 * * 2,4"      # 06:30 MESZ
  workflow_dispatch:
    inputs:
      rolle:
        description: "Welche Rolle laufen soll"
        type: choice
        options: [alle, lang, news, seo]
        default: alle

permissions:
  contents: write

concurrency:
  group: ki-redaktion
  cancel-in-progress: false

jobs:
  redaktion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Abhängigkeiten installieren
        run: python3 -m pip install -q pyyaml

      - name: Selbsttest (fail-closed)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/ki_redaktion.py --selftest

      - name: Rolle bestimmen
        id: rolle
        run: |
          ROLLE="${{ github.event.inputs.rolle }}"
          if [ -z "$ROLLE" ]; then
            DOW=$(date -u +%u)   # 1=Mo … 7=So (UTC)
            if [ "$DOW" = "1" ] || [ "$DOW" = "3" ] || [ "$DOW" = "5" ]; then
              ROLLE="lang"       # Mo/Mi/Fr: lange Artikel + SEO
            else
              ROLLE="news"       # Di/Do/So: schnelle News
            fi
          fi
          echo "ROLLE=$ROLLE" >> "$GITHUB_ENV"
          echo "Rolle: $ROLLE"

      - name: KI-Redaktion ausführen
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_AUTHOR: ${{ vars.BLOG_AUTHOR }}
          AFFILIATE_URL: ${{ vars.AFFILIATE_URL }}
        run: |
          if [ "$ROLLE" = "lang" ]; then
            python3 scripts/claude_writer.py || echo "::warning::Rolle Claude lief nicht durch"
            python3 scripts/jasper_seo.py --new-only --fix || echo "::warning::SEO-Pass lief nicht durch"
          elif [ "$ROLLE" = "news" ]; then
            python3 scripts/news_writer.py || echo "::warning::Rolle ChatGPT/News lief nicht durch"
            python3 scripts/jasper_seo.py --new-only || echo "::warning::SEO-Pass lief nicht durch"
          else
            python3 scripts/ki_redaktion.py --run --rolle "$ROLLE" --fix || true
          fi

      - name: Entwürfe committen (drafts only)
        run: |
          git config user.name "Content-Bot"
          git config user.email "content-bot@users.noreply.github.com"
          # 12.09.2026 (Premium-Audit): Reports gitignored/nicht versioniert;
          # pro Pfad eigener add-Aufruf (Repo-Bugfix-Muster 14.08.2026).
          git add content/ 2>/dev/null || true
          git add data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine Änderungen – nichts zu committen."
          else
            git commit -m "content(ki-redaktion): neuer KI-Entwurf (draft, Rolle $ROLLE)"
            # 12.09.2026 (Premium-Audit): zentrales git_sync.sh statt rohem
            # `git push` – roter Non-Fast-Forward bei parallelen Bots war
            # sonst nur ein Warning, und der Entwurf-Commit ging verloren.
            scripts/git_sync.sh --push-only || echo "::warning::Push fehlgeschlagen – nächster Lauf versucht es erneut"
          fi
