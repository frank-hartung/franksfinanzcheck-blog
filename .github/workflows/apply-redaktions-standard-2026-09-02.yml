name: Redaktions-Standard-Patch einspielen v2 (einmalig, 02.09.2026)

# V2 – warum diese Korrektur: Der erste Versuch (v1) holte die Patch-Datei
# per `git fetch origin arena/…` aus dem Arena-Branch. Nach dem Merge von
# PR #156 löscht GitHub den Quell-Branch oft automatisch → der Fetch schlug
# fehl → Workflow rot. V2 braucht KEINEN Branch-Fetch mehr: Die Patch-Datei
# liegt nach dem Merge bereits im Repo auf main unter
# patches/redaktions-standard-2026-09-02-workflows.patch.
#
# Was V2 verdrahtet:
#   1. Content-Engine v2 Phase 2: redaktions_standard.py --selftest +
#      --fix --ai --new-only (Heilung bei der Geburt) + --gate --new-only
#      (harte Funde RS1-RS7 → Entwurf statt Publikation, Circuit-Breaker).
#   2. SEO-Weekly: Bestands-Retrofit --fix --ai --backlog 3 (hebt
#      wöchentlich die 3 Artikel mit den meisten offenen Modulen auf
#      Capital/WiWo/ZEIT-Standard).
#
# Robustheit:
#   - Token: GH_PAT wird bevorzugt, fehlt er, greift automatisch das
#     Standard-Actions-Token (github.token) – kein geheimer Schlüssel nötig.
#   - Idempotenz: Ist der Patch schon aktiv, endet der Lauf grün mit
#     „bereits aktiv“ statt mit einem Fehler.
#   - Transparenz: Passt der Patch nicht mehr auf den aktuellen Stand,
#     wird der Konflikt klar gemeldet (und man sieht genau, warum).
#
# ANWENDUNG:
#   1. Die bestehende Datei
#      .github/workflows/apply-redaktions-standard-2026-09-02.yml
#      im GitHub-Web-Editor öffnen (Stift-Symbol „Edit“), den kompletten
#      Inhalt durch diesen V2-Inhalt ersetzen und committen.
#   2. Actions → „Redaktions-Standard-Patch einspielen v2“ → Run workflow.
#   3. Danach ist alles dauerhaft verdrahtet; die Datei darf gelöscht werden.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Patch-Datei im Repo prüfen
        run: |
          ls -la patches/redaktions-standard-2026-09-02-workflows.patch

      - name: Patch anwendbar?
        run: |
          if git apply --check patches/redaktions-standard-2026-09-02-workflows.patch 2>/tmp/apply_err.txt; then
            echo "PATCH_ZUSTAND=anwendbar" >> "$GITHUB_ENV"
          elif grep -q "Redaktions-Standard (Capital/WiWo/ZEIT" .github/workflows/content-engine-v2.yml \
               && grep -q "Redaktions-Standard (Capital/WiWo/ZEIT) – Bestands-Retrofit" .github/workflows/seo-weekly.yml; then
            echo "PATCH_ZUSTAND=schon-aktiv" >> "$GITHUB_ENV"
          else
            echo "PATCH_ZUSTAND=konflikt" >> "$GITHUB_ENV"
            echo "---- Details, warum der Patch nicht passt: ----"
            cat /tmp/apply_err.txt
          fi

      - name: "Ergebnis: bereits aktiv"
        if: env.PATCH_ZUSTAND == 'schon-aktiv'
        run: echo "✅ Der Redaktions-Standard ist bereits verdrahtet – nichts zu tun."

      - name: "Ergebnis: Konflikt melden"
        if: env.PATCH_ZUSTAND == 'konflikt'
        run: |
          echo "🛑 Der Patch passt nicht mehr auf den aktuellen Stand der beiden Workflow-Dateien."
          echo "   Bitte die Fehlermeldung oben kopieren und an den Agenten weitergeben."
          exit 1

      - name: Patch anwenden
        if: env.PATCH_ZUSTAND == 'anwendbar'
        run: |
          git apply patches/redaktions-standard-2026-09-02-workflows.patch
          echo "✅ Patch angewendet:"
          git status --short

      - name: Committen & nach main pushen
        if: env.PATCH_ZUSTAND == 'anwendbar'
        run: |
          git config user.name "Frank (Patch-Bot)"
          git config user.email "frank@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Änderungen – Patch war offenbar schon aktiv."
          else
            git commit -m "feat(redaktion): Redaktions-Standard Capital/WiWo/ZEIT in Engine + SEO-Weekly verdrahtet (Patch 02.09.2026)"
            git push origin main
            echo "✅ Patch nach main gepusht."
          fi
