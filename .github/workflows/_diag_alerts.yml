# TEMPORÄR · Diagnose (24.10.2026) · wird vor dem Merge gelöscht.
# WARUM: Der REST-Zugriff des Agenten-Tokens auf die Alarm-Endpunkte ist
# 403 (fehlende security-events-Berechtigung), Job-Logs und Artefakte sind
# aus der Arbeitsumgebung nicht abrufbar. Dieser Lauf holt die Wahrheit mit
# dem GITHUB_TOKEN und legt sie als Check-Run-Zusammenfassung ab – lesbar
# über die Checks-API. Gemessen wird mit dem Bestand, nicht mit dem Gefühl.
name: _Diagnose Alarme

on:
  push:
    branches: [arena/b83dd984-franksfinanzcheck-blog]
  workflow_dispatch:

permissions:
  contents: read
  security-events: read
  checks: write

jobs:
  lesen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Alarme lesen und als Check-Run ablegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOPF_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["KOPF_SHA"]

          def hole(pfad):
              url = f"https://api.github.com/repos/{repo}/{pfad}"
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with urllib.request.urlopen(req, timeout=60) as antwort:
                      return json.loads(antwort.read())
              except Exception as fehler:  # noqa: BLE001 – Diagnose, kein Betrieb
                  return {"fehler": f"{type(fehler).__name__}: {fehler}"}

          dep = hole("dependabot/alerts?state=open&per_page=100")
          cs = hole("code-scanning/alerts?state=open&per_page=100")
          sec = hole("secret-scanning/alerts?state=open&per_page=100")

          def schlank(alert):
              adv = alert.get("security_advisory") or {}
              vuln = alert.get("security_vulnerability") or {}
              paket = (vuln.get("package") or {})
              return {
                  "nummer": alert.get("number"),
                  "schwere": adv.get("severity"),
                  "ghsa": adv.get("ghsa_id"),
                  "paket": paket.get("name"),
                  "oekosystem": paket.get("ecosystem"),
                  "bereich": vuln.get("vulnerable_version_range"),
                  "fix": (vuln.get("first_patched_version") or {}).get("identifier"),
                  "manifest": alert.get("dependency", {}).get("manifest_path"),
                  "scope": alert.get("dependency", {}).get("scope"),
                  "titel": (adv.get("summary") or "")[:120],
              }

          zusammenfassung = {
              "dependabot": [schlank(a) for a in dep] if isinstance(dep, list) else dep,
              "code_scanning": [
                  {"nummer": a.get("number"), "regel": (a.get("rule") or {}).get("id"),
                   "schwere": (a.get("rule") or {}).get("security_severity_level"),
                   "pfad": (a.get("most_recent_instance") or {}).get("location", {}).get("path"),
                   "zeile": (a.get("most_recent_instance") or {}).get("location", {}).get("start_line")}
                  for a in cs
              ] if isinstance(cs, list) else cs,
              "secret_scanning": [
                  {"nummer": a.get("number"), "typ": a.get("secret_type"),
                   "pfad": (a.get("first_location_detected") or {}).get("path")}
                  for a in sec
              ] if isinstance(sec, list) else sec,
          }

          text = json.dumps(zusammenfassung, ensure_ascii=False, indent=1)
          print(text)

          if len(text) > 60000:
              text = text[:60000] + "\n… (gekürzt)"

          kopf = {
              "name": "DIAGNOSE Alarmbestand",
              "head_sha": sha,
              "status": "completed",
              "conclusion": "neutral",
              "output": {
                  "title": f"{len(zusammenfassung['dependabot']) if isinstance(zusammenfassung['dependabot'], list) else '?'} offene Dependabot-Alarme",
                  "summary": "Vollständiger Alarmbestand des Default-Branch, gelesen mit dem Repository-Token (Diagnose 24.10.2026).",
                  "text": text,
              },
          }
          anfrage = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/check-runs",
              data=json.dumps(kopf).encode(),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urllib.request.urlopen(anfrage, timeout=60) as antwort:
              print("Check-Run:", antwort.status)
          PY
