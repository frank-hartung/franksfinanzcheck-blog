# Dependabot – hält Actions, npm-, pip- und Docker-Abhängigkeiten aktuell.
# P1 aus AUTOMATION-AUDIT.md (2026-08-10); ausgebaut nach Sicherheitsaudit
# 14.10.2026 (N-12, H-02):
#   - cooldown 7 Tage: Ein frisch veröffentlichtes (evtl. bösartiges) Release
#     wird erst nach einer Woche vorgeschlagen – genug Zeit, bis die
#     Community oder die Registry einen Supply-Chain-Angriff bemerkt.
#     Sicherheitsupdates sind davon NICHT betroffen (kommen sofort).
#   - Auto-Merge (dependabot-automerge.yml) gilt NUR für github_actions;
#     npm/pip/Docker-PRs werden immer von Hand geprüft und gemergt.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" = .github/workflows; dazu die Composite-Actions.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    # Gebuendelt statt haeppchenweise (Lehre aus #571): Einzel-PRs je Action
    # fuehrten zu Teil-Merges und damit zu Versions-Drift zwischen den
    # Workflows (setup-python@v6 neben @v7). Ein PR je Woche haelt den
    # Bestand einheitlich; scripts/actions_version_guard.py bewacht es.
    # Seit 14.10.2026 sind alle Actions auf Commit-SHA gepinnt (M-09);
    # Dependabot aktualisiert SHA und Versionskommentar gemeinsam.
    groups:
      github-actions:
        patterns: ["*"]

  # E2E-Tests (Playwright) – Design-Skills-Rollout 12.09.2026.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]

  # Cloudflare-Worker und lokale Werkzeuge (Audit N-12).
  - package-ecosystem: "npm"
    directories:
      - "/cloudflare/klick-zaehler"
      - "/cloudflare/ki-assistent"
      - "/newsletter-worker"
      - "/tools/ff-voice-qa"
      - "/tools/ff-voice-browser"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    groups:
      npm-werkzeuge:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Python: requirements-*.txt im Repo-Root (Audit N-12, I-07).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # WF-E813 / #972 (01.11.2026): Die 2026-10-31 noch AD HOC installierten
  # Pakete (Poppy-Werkbank, TTS-Kette) stehen jetzt in eigenen Manifesten.
  # Ohne diesen Block würde der Audit sie zwar prüfen, Dependabot sie aber
  # nie aktualisieren – ein Pin ohne Update-Weg veraltet still.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    # Eigene Gruppe, damit die Wochen-PRs der CI-Pins nicht mit den
    # optionalen Werkbank-Paketen in einem PR landen (ein PR = ein Risiko).
    groups:
      python-optionale-werkbank:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    allow:
      - dependency-name: "pyyaml"
      - dependency-name: "feedparser"
      - dependency-name: "pypdf"
      - dependency-name: "youtube-transcript-api"
      - dependency-name: "trafilatura"
      - dependency-name: "lxml_html_clean"
      - dependency-name: "edge-tts"
      - dependency-name: "miniaudio"
      - dependency-name: "piper-tts"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  # (Die Manifeste liegen in /: requirements-poppy.txt, requirements-tts.txt)

  # n8n-Host: Image-Tags in docker-compose.yml und das Whisper-Dockerfile.
  - package-ecosystem: "docker-compose"
    directory: "/tools/n8n"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]

  - package-ecosystem: "docker"
    directory: "/tools/n8n"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
