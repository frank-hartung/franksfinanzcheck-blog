# Dependabot – hält die GitHub-Actions in den Workflows automatisch aktuell.
# P1 aus AUTOMATION-AUDIT.md (2026-08-10). Erstellt wöchentliche PRs, die du
# nur noch mergen musst (oder auto-mergen lassen kannst).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    # Gebuendelt statt haeppchenweise (Lehre aus #571): Einzel-PRs je Action
    # fuehrten zu Teil-Merges und damit zu Versions-Drift zwischen den
    # Workflows (setup-python@v6 neben @v7). Ein PR je Woche haelt den
    # Bestand einheitlich; scripts/actions_version_guard.py bewacht es.
    groups:
      github-actions:
        patterns: ["*"]

  # E2E-Tests (Playwright) – Design-Skills-Rollout 12.09.2026:
  # Root-Paket pflegen (@playwright/test), Minor/Patch automatisch.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
