# Dependabot – hält Actions, npm-, pip- und Docker-Abhängigkeiten aktuell.
# P1 aus AUTOMATION-AUDIT.md (2026-08-10); ausgebaut nach Sicherheitsaudit
# 14.10.2026 (N-12, H-02):
#   - cooldown 7 Tage: Ein frisch veröffentlichtes (evtl. bösartiges) Release
#     wird erst nach einer Woche vorgeschlagen – genug Zeit, bis die
#     Community oder die Registry einen Supply-Chain-Angriff bemerkt.
#     Sicherheitsupdates sind davon NICHT betroffen (kommen sofort).
#   - Auto-Merge (dependabot-automerge.yml) gilt NUR für github_actions;
#     npm/pip/Docker-PRs werden immer von Hand geprüft und gemergt.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" = .github/workflows; dazu die Composite-Actions.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    # Gebuendelt statt haeppchenweise (Lehre aus #571): Einzel-PRs je Action
    # fuehrten zu Teil-Merges und damit zu Versions-Drift zwischen den
    # Workflows (setup-python@v6 neben @v7). Ein PR je Woche haelt den
    # Bestand einheitlich; scripts/actions_version_guard.py bewacht es.
    # Seit 14.10.2026 sind alle Actions auf Commit-SHA gepinnt (M-09);
    # Dependabot aktualisiert SHA und Versionskommentar gemeinsam.
    # Seit #1014: Major-Updates getrennt halten. Sonst blockiert ein Major
    # die gesamte Gruppe, obwohl Patch/Minor automatisch prüfbar wären.
    # Beide Gruppen zusammen decken jeden Semver-Typ ab; die Wache verlangt
    # trotzdem EINEN SHA je Action über alle Workflows/Composite-Actions.
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      github-actions-major:
        patterns: ["*"]
        update-types: ["major"]

  # E2E-Tests (Playwright) – Design-Skills-Rollout 12.09.2026.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]

  # Cloudflare-Worker und lokale Werkzeuge (Audit N-12).
  - package-ecosystem: "npm"
    directories:
      - "/cloudflare/klick-zaehler"
      - "/cloudflare/ki-assistent"
      - "/newsletter-worker"
      - "/tools/ff-voice-qa"
      - "/tools/ff-voice-browser"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    groups:
      npm-werkzeuge:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Python: requirements-*.txt im Repo-Root (Audit N-12, I-07).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    # Ein Eintrag pro Ecosystem/Verzeichnis/Branch: zwei pip-Blöcke für
    # / lehnt Dependabot ab. Gruppen unterscheiden Paketnamen, NICHT Dateien;
    # gemeinsam mit CI verwendete Pakete landen daher in der ersten Gruppe.
    # Nicht zugeordnete (u. a. Major-)Updates bleiben einzelne PRs zur Prüfung.
    groups:
      python-optionale-werkbank:
        patterns:
          - "pyyaml"
          - "feedparser"
          - "pypdf"
          - "youtube-transcript-api"
          - "trafilatura"
          - "lxml-html-clean"
          - "edge-tts"
          - "miniaudio"
          - "piper-tts"
        update-types: ["minor", "patch"]
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Piper-Major-Versionen weiterhin nicht automatisch als Versionsupdate
    # vorschlagen; Sicherheitsupdates sind von dieser SemVer-Regel ausgenommen.
    ignore:
      - dependency-name: "piper-tts"
        update-types: ["version-update:semver-major"]

  # n8n-Host: Image-Tags in docker-compose.yml und das Whisper-Dockerfile.
  - package-ecosystem: "docker-compose"
    directory: "/tools/n8n"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]

  - package-ecosystem: "docker"
    directory: "/tools/n8n"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
