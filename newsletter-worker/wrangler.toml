# ============================================================
# ff-newsletter – Cloudflare Worker (Newsletter-Backend)
# ------------------------------------------------------------
# Einmaliges Setup (Details: docs/ANLEITUNG-NEWSLETTER-EIGENBETRIEB.md):
#
#   1) cd newsletter-worker
#   2) npx wrangler login
#   3) npx wrangler kv namespace create ABO --jurisdiction=eu
#        -> wrangler ergänzt id + placement automatisch unten
#   4) npx wrangler secret put GITHUB_PAT    (Fine-Grained-PAT, nur dieses
#      Repo, Berechtigung "Actions: Read and write" – das ist das Recht,
#      workflow_dispatch auszuloesen. "Workflows: write" reicht NICHT: das
#      ist das Recht, Workflow-DATEIEN zu aendern. Quelle:
#      docs.github.com/rest/actions/workflows#create-a-workflow-dispatch-event)
#   5) npx wrangler secret put EXPORT_KEY    (beliebiger 32+ Zeichen
#      Zufallsstring; GLEICHER Wert als GitHub-Secret
#      NEWSLETTER_WORKER_EXPORT_KEY)
#   6) npx wrangler deploy      (aktiviert auch die Cron-Triggers unten;
#      Free-Plan: max. 5 Cron-Triggers pro ACCOUNT – hier 3)
#   7) Zone: hostname abos.franksfinanzcheck.de (custom_domain unten
#      aktivieren ODER über Dashboard -> Workers -> Custom Domain)
#   8) Takt pruefen: https://abos.franksfinanzcheck.de/healthz zeigt
#      unter `takt.letzte` den letzten Dispatch je Takt (digest/kadenz/
#      nachgang); Cloudflare -> Worker -> Settings -> Trigger Events
#      listet die Cron-Ausfuehrungen.
# ============================================================
name = "ff-newsletter"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Audit 14.10.2026 (M-14): Der Worker ist NUR ueber abos.franksfinanzcheck.de
# erreichbar. Eine zweite Adresse (*.workers.dev, Preview-URLs) umginge
# Zonen-Regeln (WAF, Bot-Schutz, Header-Transform) und Logs der Zone.
# VOR dem ersten Deploy mit dieser Einstellung: Dashboard -> Workers ->
# ff-newsletter -> Settings -> Domains & Routes muss abos.franksfinanzcheck.de
# als "Custom Domain" zeigen (sonst zuerst den routes-Eintrag unten deployen).
workers_dev = false
preview_urls = false

# Eigene Subdomain als Workers Custom Domain (TLS + DNS-Eintrag stellt
# Cloudflare automatisch). Der fruehere Block [custom_domain] war kein
# gueltiger wrangler-Schluessel und wurde beim Deploy still ignoriert.
# Besteht fuer abos. noch ein manueller CNAME, verweigert wrangler das
# Anlegen – dann den CNAME im Dashboard loeschen und erneut deployen.
routes = [
  { pattern = "abos.franksfinanzcheck.de", custom_domain = true }
]

# Workers Logs (Free: 200.000 Zeilen/Tag) – fuer Missbrauchs- und
# Fehleranalyse. Der Worker loggt keine Adressen, keine Tokens, keine IPs.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
# Urspruenge, denen der Worker CORS antwortet (Komma getrennt).
SITE_ORIGIN = "https://franksfinanzcheck.de"
# Repo + Workflow, die die Bestaetigungs-Mail senden (workflow_dispatch).
GITHUB_REPO = "frank-hartung/franksfinanzcheck-blog"
GITHUB_WORKFLOW = "newsletter-lifecycle.yml"
GITHUB_REF = "main"
# Erlaubte Themen-IDs – exakt data/themenwelten.json (Wache:
# scripts/newsletter_studio.py --brand haelt beide deckungsgleich).
THEMEN_IDS = "strom-sparen,internet-dsl,versicherungen,konto-karten,frugalismus,mietwagen"

# Labels fuer die Praeferenzsseite (JSON id -> Label); Fallback ohne diesen Eintrag = die ID selbst.
THEMEN_LABELS = "{\"strom-sparen\":\"Strom & Gas sparen\",\"internet-dsl\":\"Internet & DSL\",\"versicherungen\":\"Versicherungen\",\"konto-karten\":\"Konto & Karten\",\"frugalismus\":\"Frugalismus & Minimalismus\",\"mietwagen\":\"Mietwagen & Co.\"}"
# Tage, bis eine offene Anmeldung ablaeuft (Double-Opt-In-Frist).
BESTAETIGUNG_TAGE = "14"

# Feedback darf hoechstens so viele KV-Schreibzugriffe pro Tag verbrauchen
# (Free-Plan: 1.000 Writes/Tag fuer das GANZE Konto, Audit H-03).
FEEDBACK_MAX_PRO_TAG = "200"

# Secrets (NICHT hier eintragen):
#   GITHUB_PAT        Fine-Grained, nur dieses Repo, "Actions: Read and write"
#   EXPORT_KEY        32+ Zeichen Zufall, = GitHub-Secret NEWSLETTER_WORKER_EXPORT_KEY
#   TURNSTILE_SECRET  optional (Audit M-02): sobald gesetzt, verlangt
#                     /anmeldung ein gueltiges Feld `cf-turnstile-response`.
#                     ERST setzen, wenn das Widget im Formular ausgeliefert
#                     wird (Site-Key + Datenschutzerklaerung), sonst scheitert
#                     jede Anmeldung.

# Rate-Limiting ohne KV-Schreibzugriffe (Audit H-03): 5 Anfragen je IP und
# Minute fuer /anmeldung und /abmeldung. namespace_id ist eine frei
# gewaehlte, kontoweit eindeutige Zahl (kein Dashboard-Objekt noetig).
# Fehlt das Binding, faellt der Worker auf den KV-Zaehler zurueck.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1401"
simple = { limit = 5, period = 60 }

# TAKTGEBER (25.09.2026): GitHubs `schedule`-Ereignisse kamen an diesem
# Repo 5-5,5 h zu spaet oder gar nicht (Fr 25.09.: kein Digest-Lauf, keine
# Kadenz-Wache). Cloudflare Cron Triggers feuern minutengenau (UTC). Der
# Worker startet die Workflows per workflow_dispatch (src/index.js,
# Tabelle TAKT) - mit derselben Freigabestufe wie der GitHub-Cron.
#   30 4 * * TUE,FRI  -> newsletter-daily.yml   (planmaessig=true)  06:30 MESZ / 05:30 MEZ
#    5 5 * * TUE,FRI  -> newsletter-cadence.yml (zaehlt nach, holt nach, wird laut)
#   17 * * * *        -> newsletter-lifecycle.yml (aktion=nachgang)
#   13 2 * * *        -> taegliche Datenschutz-Pflege im Worker (kein Dispatch)
# ACHTUNG Wochentage: Cloudflare zaehlt 1=SO..7=SA (Quartz). "2,5" waere
# Mo/Do. Deshalb Namen (TUE,FRI). Crons muessen TAKT + PFLEGE_CRON
# in src/index.js entsprechen (Test haelt beides deckungsgleich).
[triggers]
crons = ["30 4 * * TUE,FRI", "5 5 * * TUE,FRI", "17 * * * *", "13 2 * * *"]

# KV-Speicher: EU-Jurisdiktion muss BEI Erstellung gesetzt sein. Ein
# placement-Feld belegt KEINEN EU-Speicherort. Bestehende Produktion im
# Dashboard pruefen, ggf. neue EU-Namespace anlegen + Daten migrieren.
# npx wrangler kv namespace create ABO --jurisdiction=eu
[[kv_namespaces]]
binding = "ABO"
id = "HIER-DIE-ID-NACH-ERSTELLUNG"
