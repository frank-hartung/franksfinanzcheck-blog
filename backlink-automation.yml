name: Backlink-Automation & Link Health (Profi-Level)

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Jeden Montag um 06:00 Uhr morgens automatisch ausführen
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  backlink-and-link-check:
    name: Backlink & Link Health Check (Fehlertolerant)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repository auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python Umgebung einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: 🚀 Backlink & Link-Automation ausführen (Profi-Level Fehlertoleranz)
        continue-on-error: true # Verhindert, dass der gesamte Blog-Build bei externen API-Fehlern abbricht!
        env:
          SITE_URL: "https://franksfinanzcheck.de"
        run: |
          python scripts/backlink_automation.py

      - name: 📊 Summary Bericht in GitHub Actions ausgeben
        if: always()
        run: |
          echo "### 🚀 FranksFinanzcheck Backlink-Automation Report" >> $GITHUB_STEP_SUMMARY
          if [ -f "backlink_summary.md" ]; then
            cat backlink_summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Backlink-Check erfolgreich abgeschlossen ohne kritische Blockaden." >> $GITHUB_STEP_SUMMARY
          fi
