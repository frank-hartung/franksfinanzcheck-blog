# ============================================================
#  🍂 SAISONS – Single Source of Truth für die saisonale Startseite
#  ------------------------------------------------------------
#  Auftrag (20.09.2026): Die Startseite soll die Jahreszeit
#  widerspiegeln – Hero-Badge/Saison-Hinweis oben UND ein
#  saisonal priorisierter Teaser-Block („Saison-Fokus") – ohne
#  dass dafür jedes Quartal jemand ein Template anfasst.
#
#  WARUM EINE EIGENE DATEI (und kein Eingriff in hugo.toml):
#    hugo.toml ist DOPPELT gesperrt: brand_guard.py schützt
#    homeInfoParams.Title/Content als Marke, integrity_guard.py
#    signiert die ganze Datei (KRITISCH-Klasse → jede Abweichung
#    ist ein HARTER Stop, den nur ein Mensch zeichnen darf). Der
#    Willkommenstext selbst bleibt deshalb UNANGETASTET und weiter
#    exklusiv Sache von scripts/willkommenstext_guard.py. Die
#    Saison-Ebene dockt stattdessen als eigener Baustein an
#    (layouts/_partials/home_season.html + home_info.html) und hat
#    mit data/saisons.yaml ihre eigene, frei pflegbare Quelle.
#
#  AUSWAHL DER ARTIKEL (deterministisch, zwei Stufen):
#    1. `keywords` (klein geschrieben, Teilstring-Treffer in Titel,
#       Beschreibung, Tags und Keywords eines Artikels) ergeben einen
#       Relevanz-Wert; die drei besten Artikel der Saison gewinnen,
#       bei Gleichstand entscheidet das neuere Datum.
#    2. Reicht das nicht für `min_artikel` Treffer, fällt die Auswahl
#       auf die neuesten Artikel der `saison_pillars` zurück (gleiche
#       Logik, nur ohne Relevanz-Filter) – die Startseite zeigt also
#       NIEMALS einen leeren oder halben Saison-Block.
#    Entwürfe (draft: true) und Artikel mit `hiddenInHomeList` zählen
#    nicht, genau wie in der normalen Teaser-Liste.
#
#  FARBEN (Regel aus PRODUCT.md/DESIGN.md: Gelb ist NIEMALS Text auf
#  hellem Grund; jede Farbe braucht eine Dark-Variante):
#    akzent         Text/Akzent auf HELLER Fläche  (Ziel ≥ 4.5:1 auf #FFFFFF)
#    akzent_dunkel  Text/Akzent auf DUNKLER Fläche (Ziel ≥ 4.5:1 auf #25272A)
#    hero_text      Text auf dem Smaragd-Hero      (Ziel ≥ 4.5:1 auf #145744)
#    linie          dekorative Linie/Kante auf HELL (kein Text → ≥ 3:1)
#    linie_dunkel   dasselbe auf DUNKLER Fläche (≥ 3:1)
#  Gemessen – nicht geraten – von scripts/saisonale_startseite_gate.py
#  (WCAG 2.x, gleiche Formel wie e2e/design-metrics.mjs).
#
#  FELDER je Eintrag:
#    id             eindeutiger Schlüssel (herbst|winter|fruehling|sommer)
#    name           Anzeigename der Saison
#    emoji          ein Saison-Emoji (Deko, im Markup aria-hidden)
#    ab / bis       Gültigkeit als MM-DD (inklusive). `bis` >= `ab` =
#                   Fenster innerhalb eines Jahres; `bis` < `ab` =
#                   Fenster über den Jahreswechsel (Winter). Die vier
#                   Fenster MÜSSEN das Jahr lücken- und überlappungsfrei
#                   abdecken (Gate prüft alle 366 Tage).
#    zeitraum       Klartext-Zeitraum für die Anzeige (keine Datums-Magie)
#    badge          Kurztext des Hero-Badges (max. ~46 Zeichen)
#    headline       H2 des Saison-Fokus-Blocks
#    hinweis        1–2 Sätze saisonaler Kontext im Hero (Klartext-Verlagston,
#                   du-Form, keine Angstmache, keine erfundenen Zahlen)
#    tipp           „Franks Tipp" am Ende des Blocks (vgl. data/themenwelten.json)
#    saison_pillars Pillar-IDs (müssen unter content/pillar/ live sein);
#                   die ERSTE ist der Haupt-Ratgeber des Saison-Blocks
#    pillar_link    Text des Ratgeber-Links im Block-Kopf
#    keywords       Relevanz-Begriffe für die Artikel-Auswahl (lowercase)
#    min_artikel    so viele Artikel müssen mindestens zusammenkommen
#    akzent/akzent_dunkel/hero_text/linie/linie_dunkel  Farbwerte (siehe oben)
#
#  Pflege: Werte ändern → `python3 scripts/saisonale_startseite_gate.py`
#  (prüft Schema, Kalender-Abdeckung, Farben, Pillar-Ziele, Render-Beweis)
#  → `hugo --destination public` → committen. Keine Template-Änderung nötig.
# ============================================================

version: 1
min_artikel_default: 3

saisons:
