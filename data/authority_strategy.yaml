    - "Zwei hilfreiche Community-Beiträge ohne Linkpflicht"
    - "Gewonnene Erwähnungen mit URL und Datum belegen"
  monthly:
    - "GSC-Leistungsdaten exportieren und aggregiert importieren"
    - "Newsletter-, Conversion- und Returning-Reader-Kennzahlen belegen"
    - "Markensuche sowie unverlinkte Erwähnungen prüfen"
    - "Presse-/Expertenliste und Follow-ups bereinigen"
  quarterly:
    - "Mindestens ein zitierfähiges Asset mit Datensatz, Methodik und Presseformat veröffentlichen"
    - "Asset nach Quellenaktualität prüfen und Outreach-Winkel erneuern"

policies:
  - "Keine gekauften Links, Linktauschprogramme oder automatisierten Pitches."
  - "Keine Kooperation oder Mediennennung ohne öffentliche bzw. intern belegte URL behaupten."
  - "Jede Kennzahl braucht Zeitraum, Stand und Evidenz; unbekannt bleibt null."
  - "Rohdaten mit Suchanfragen oder Empfängerbezug werden nicht versioniert; nur Aggregate."
  - "Affiliate-Partner sind keine unabhängige Studienquelle."
