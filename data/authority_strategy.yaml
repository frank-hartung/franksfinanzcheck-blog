# Externe Autorität & Distribution – verbindlicher Betriebsvertrag
# Zahlen bleiben null, bis ein belegter Import vorliegt. Keine Hochrechnungen.
#
# Messvertrag (seit 05.11.2026, #1076):
#   Jede Kennzahl hat GENAU EINE Quelle mit einem Modus. Der Radar fordert nur,
#   was auch erhebbar ist:
#     automatisch   – wird aus dem Repo abgeleitet (GSC-Tages-Ledger)
#     manuell       – monatlicher Export, fällig am manual_due_day des Folgemonats
#     nicht_messbar – bewusst keine Messung (Grund + Entscheidungsdatum Pflicht)
#     nicht_aktiv   – Kanal ist nicht in Betrieb (Grund + Entscheidungsdatum Pflicht)
#   Eine Quelle ohne Beleg bleibt `—` im Report. `null` ist niemals `0`.
