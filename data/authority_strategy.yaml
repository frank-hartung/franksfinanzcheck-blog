    title: "Fixkosten-Index Deutschland: Energie-Baseline Q4 2026"
    canonical: /studien/fixkosten-index-2026-q4/
    status: live
    published: 2026-10-02
    owner: Frank Hartung
    methodology: /studien/fixkosten-index-2026-q4/#methodik
    dataset: /downloads/fixkosten-index-2026-q4.csv
    press_asset: /downloads/fixkosten-index-2026-q4-pressegrafik.svg
    source_urls:
      - https://www.bdew.de/service/daten-und-grafiken/bdew-strompreisanalyse/
      - https://www.bdew.de/service/daten-und-grafiken/bdew-gaspreisanalyse/
    refresh_days: 105
