# --- Grenzen des Budgets ------------------------------------------------
# `budget_kb` ist die Summe der Beschreibungen für Skills mit Thema. K9 in
# scripts/skills_vertrag.py begrenzt die Gesamtsumme; P3 begrenzt den Teil,
# der einem Thema dient. Zwei Grenzen, zwei Bedeutungen – und die zweite
# ist die, die sagt: so viel Themenbetrieb leisten wir uns.
budget_kb: 56.0
