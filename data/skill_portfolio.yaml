# ============================================================
#  SKILL-PORTFOLIO – welches Fremd-Skill dient welchem Thema?
#
#  WARUM DIESE DATEI (01.11.2026)
#  ------------------------------
#  Am 01.11.2026 wurde die Fremd-Bibliothek auf 53 Skills erweitert, drei
#  wieder entfernt und danach gefragt: „Wenn 11.790 Tokens zu teuer sind,
#  welche Themen bedient der Blog überhaupt?" Die Frage war richtig, der
#  Ort für die Antwort fehlte. Ohne Antwort zahlt jede Session die
#  Beschreibung jedes Skills, auch der elf, die hier kein Thema haben –
#  und niemand kann sagen, welcher Skill gehen darf.
#
#  Diese Datei ist dieser Ort. Sie ist die EINE Zuordnung:
#    · Produktion (`themen`) – ein oder mehrere Blog-Themen je Skill
#    · Ausschluss (`ausgeschlossen`) – mit Grund, Entscheidung und Frist,
#      also nachprüfbar statt „brauchen wir nicht"
#  Die Themen-IDs sind NICHT neu erfunden: sie stammen aus
#  `data/themenwelten.json` (die sechs Themenwelten der Website) plus zwei
#  Redaktions-Achsen, die der Blog nachweislich bedient (Suche/KI,
#  Werkzeuge). Geprüft von `scripts/skills_portfolio.py` (P1–P6).
#
#  Kern-Regel: Ein Skill, das weder unter `themen` noch unter
#  `ausgeschlossen` steht, ist ein Befund (P1) – es zahlt Dauerlast ohne
#  Zweck. Ein Skill, dessen Thema keinen Belegpfad hat, ist ebenfalls ein
#  Befund (P2): das Thema wird dann nicht bedient, sondern behauptet.
#
#  Aufruf:  python3 scripts/skills_portfolio.py  |  npm run skills:portfolio
# ============================================================

schema: 1

# --- Themen des Blogs, jedes mit einem Beleg im Baum ---------------------
# `quelle` ist der Pfad, der die Behauptung „dieses Thema existiert" trägt.
# Fehlt die Datei, prüft P2 das Thema als ungedeckt und meldet es.
#
# `art` beantwortet eine Frage, die P4 sonst falsch stellt:
#   inhalt  – eine der sechs Themenwelten. Sie wird von der Content-Engine
#             mit Artikeln bedient (140 Dateien, Engine + Reserve), NICHT von
#             einem Marketing-Skill. Ein „Thema ohne Marketing-Skill" ist hier
#             der Normalfall, kein Loch; der Beleg ist die Artikelzahl (P4).
#   kanal   – Redaktions-Achsen (Suche, Text, Werkzeuge, Verbreitung,
#             Messung, Wettbewerb). Hier MUSS ein Skill hängen, sonst wird
#             die Achse behauptet.
# Die Trennlinie ist die eigentliche Antwort auf „welche Themen bedient der
# Blog": sechs Inhaltswelten, sechs Kanäle – und nur für die Kanäle kauft
# der Blog Fremd-Skills ein.
