# ============================================================
#  📣 KAMPAGNEN – Single Source of Truth (AGC-Parität, Stufe 3)
#  ------------------------------------------------------------
#  AGC Studio unterscheidet:
#    type: promo       – Angebots-/Aktions-Kampagnen (eigener CTA, schnell)
#    type: researched  – Thought-Leadership-/Themen-Kampagnen (Research-gestützt)
#
#  FELDER:
#    id            eindeutiger Schlüssel (nie wiederverwenden)
#    type          promo | researched
#    name          Anzeigename
#    goal          Ziel (für dich + Reports)
#    cta           Kampagnen-CTA (überschreibt default_cta aus brand_brain;
#                  leer = default_cta verwenden)
#    pillars       zugeordnete Pillars (Themen-Auswahl + Routing)
#    start / end   Gültigkeitszeitraum (ISO-Datum)
#    status        active | paused | draft
#                  ⚠️ Nur `active` wirkt auf CTA + Kalender. Neue Kampagnen
#                  starten als `paused`, damit nichts ungewollt publiziert.
#    topics_hint   optionale Themenliste für den Kalender (promo)
#
#  AKTIVIEREN: status: active setzen → dann wirkt die Kampagne automatisch
#  über scripts/campaign_manager.py (Kalender) und scripts/agc_context.py
#  (CTA im Artikel). Kein Code-Edit nötig.
# ============================================================

campaigns:
