# Entscheidungs-Register der GSC-Triage
#
# Hier steht, was mit einer gemeldeten URL passiert ist – und wann
# nachgesehen wird, ob es gewirkt hat. Der Automat schlägt vor
# (Vorschlag je Zeile in redaktions_queue.md), entschieden wird hier.
#
# Felder: url · entscheidung · am · wiedervorlage · erwartung
#         (indexiert | impressionen | keine) · eigentuemer · begruendung
#
# Anlegen mit:
#   python3 scripts/gsc_abdeckung.py --entscheiden "/posts/…/" \
#     --entscheidung "Rolle festlegen" --begruendung "…" --wiedervorlage 2026-11-25
#
# Nach Ablauf der Wiedervorlage prüft `--triage` die Wirkung:
#   lastmod der Seite > Entscheidungsdatum → Änderung ist live,
#                                            Indexierung erneut anfragen (P2)
#   lastmod unverändert                    → Entscheidung nicht umgesetzt (P1)
#   URL nicht mehr in der Liste            → Wirkung belegt, Eintrag schließen (P3)
- {url: "/posts/2026-08-21-haushaltsbuch-fuehren-app-excel-oder-papier/", entscheidung: "Rolle bestätigt: Alltagssystem (K7) – kein Umbau, keine Zusammenführung", am: "2026-10-26", wiedervorlage: "2026-11-25", erwartung: "indexiert", eigentuemer: "redaktion", begruendung: "Die Seite beantwortet die Methode (App, Excel, Papier), nicht die Budgetregel. Titel-Überschneidung mit dem Jahresplan 0,00 bei Regel F – zwei Rollen, nicht zwei Dubletten."}
- {url: "/posts/2026-10-12-dein-weg-zu-geringeren-monatskosten-schritt-fuer-schritt/", entscheidung: "Rolle getrennt: Jahresplan (K3) – nicht konsolidieren", am: "2026-10-26", wiedervorlage: "2026-11-25", erwartung: "indexiert", eigentuemer: "redaktion", begruendung: "Regel F verweigert die Zusammenführung mit /posts/2026-10-12-haushaltskosten-reduzieren-…/: Titel-Überschneidung 0,00, Themenfeld frugalismus. Belegte Nachfrage: 1 Impression, Position 7,0 (28 Tage bis 19.10.2026); 3 redaktionelle Inlinks. Beobachten statt umbauen."}
