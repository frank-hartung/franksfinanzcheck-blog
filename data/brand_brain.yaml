audience:
  primary: Privathaushalte in Deutschland, die ihre Fixkosten senken wollen – ohne
    Fachchinesisch und ohne Verkaufsdruck.
  secondary: Wechsel-Interessierte (Strom, Gas, DSL, Konto, Versicherung), Frugalismus-Einsteiger,
    Vielbeschäftigte mit wenig Zeit.
  pain_points:
  - Nachzahlungen von Strom-/Gasrechnung (vor allem im Herbst/Winter)
  - Versteckte Gebühren und Preiserhöhungen bei Konto, Handy und Versicherungen
  - Überforderung im Tarifdschungel (zu viele Angebote, unklare Bedingungen)
  - Angst vor Wechselfallen (Kündigungsfristen, Preisgarantie-Kleingedrucktes)
  - Kein Überblick über die eigenen laufenden Kosten
  reading_level: verständliche Alltagssprache, kurze Sätze, ein Gedanke pro Absatz
hard_rules:
- KEINE erfundenen Studien, Umfragen, Experten, Gesetze/Paragraphen oder exakten Preise
  (Haftungsrisiko).
- 'E-E-A-T: eigene Erfahrung als Formulierung erlaubt, Fakten nur als Allgemeinwissen
  oder aus kuratierten Quellen.'
- Affiliate-Links NUR über das /go/-Gateway, mit rel="sponsored" (Werbekennzeichnung).
- Recherche-Hooks (data/research) sind Anregungen, keine zitierten Fakten – Quellenkennzeichnung
  im Report.
- 'Kadenz DAUERVORGABE: Publikation nur Mo/Mi/Fr, 2–3 Artikel pro Tag (cadence_guard).'
frameworks:
  editorial:
  - Das Wichtigste in Kürze (fettes Label + 3–4 Bullets) direkt nach der Einleitung
  - Mindestens 2 H2-Überschriften als Fragen, direkt beantwortet
  - Mindestens eine markierte Faustregel (**Faustregel:** …)
  - Mindestens eine nummerierte Schrittfolge (3–6 Schritte)
  - 'Zahlen-Ehrlichkeit: Spannen + Einordnung statt erfundener Präzision'
  - FAQ-Bereich (## Häufige Fragen, 5 Fragen als H3)
  openings:
  - Schritt-für-Schritt-Versprechen
  - Zahlen-These
  - Irrtum widerlegen
  - Vergleich/Analogie
  - Warnung + Konsequenz
  - Mini-Geschichte
  - 'Checkliste-Vorab („Drei Dinge zählen: …“)'
  - Frage an den Leser
  hooks:
  - 6-Wort-Haken
  - Frage-Hook
  - Zahl-Hook
  - Irrtum-Hook
  - Vorher/Nachher-Hook
version: 1
