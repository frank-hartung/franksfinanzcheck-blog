#
# Regeln (verbindlich für Folgearbeit):
#  R1  Keine Zusammenführung, Löschung oder Umbenennung der URL (Slug), solange keine
#      301-Weiterleitungen existieren (hugo.toml: disableAliases = true; Punkt 1 nicht beauftragt).
#  R2  Die Keywords im Frontmatter steuern nur intern (Schlagworte). Google wertet sie nicht aus.
#      Die Abgrenzung erfolgt über Titel, Description, H1 und Einleitung.
#  R3  Entwürfe (draft: true) werden nicht veröffentlicht, solange ihre Rolle mit einem
#      Live-Beitrag kollidiert. Die Veröffentlichungsentscheidung liegt bei Frank Hartung.
#  R4  Ein Cluster gilt erst als aufgelöst, wenn jeder Beitrag eine eigene Rolle hat
#      und die Titel sich in den ersten 40 Zeichen unterscheiden.
#
# Status-Kürzel: umgesetzt | offen (Name nennt den Verantwortlichen)

