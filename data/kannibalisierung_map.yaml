# Kannibalisierungs-Map (Stand 23.11.2026)
#
# Zweck: Je Cluster ist festgelegt, welcher Beitrag welche Suchabsicht bedient.
# Ein Beitrag = eine Rolle. Abgrenzung läuft über Titel, Description und Einleitung.
#
# Regeln (verbindlich für Folgearbeit):
#  R1  Keine Zusammenführung, Löschung oder Umbenennung der URL (Slug), solange keine
#      301-Weiterleitungen existieren (hugo.toml: disableAliases = true; Punkt 1 nicht beauftragt).
#  R2  Die Keywords im Frontmatter steuern nur intern (Schlagworte). Google wertet sie nicht aus.
#      Die Abgrenzung erfolgt über Titel, Description, H1 und Einleitung.
#  R3  Entwürfe (draft: true) werden nicht veröffentlicht, solange ihre Rolle mit einem
#      Live-Beitrag kollidiert. Die Veröffentlichungsentscheidung liegt bei Frank Hartung.
#  R4  Ein Cluster gilt erst als aufgelöst, wenn jeder Beitrag eine eigene Rolle hat
#      und die Titel sich in den ersten 40 Zeichen unterscheiden.
#
# Status-Kürzel: umgesetzt | offen (Name nennt den Verantwortlichen)
#
# Hinweis zu "titel": Der Eintrag ist ein Stand-Foto (19.10.2026 bzw. Datum der
# Rollenvergabe) und keine Quelle der Wahrheit. Verbindlich ist der Titel im
# Frontmatter des Beitrags; R2/R4 werden am gebauten Beitrag geprüft.

stand: "2026-11-23"
regeln_quelle: "data/kannibalisierung_map.yaml (dieses Dokument); Entscheidungen: data/entscheidungen.yaml"

# Abdeckung (neu 23.11.2026)
#  Jeder Live-Beitrag ab pflicht_ab braucht eine Rolle in dieser Map; sonst ist der
#  Test scripts/tests/test_inhalts_register.py::KannibalisierungMapTests rot.
#  vollstaendige_pillars: Themenwelten, die vollständig kuratiert sind – dort muss
#  jeder Live-Beitrag des Pillars in einem der genannten Cluster stehen.
abdeckung:
  pflicht_ab: "2026-11-23"
  vollstaendige_pillars:
    - pillar: "internet-dsl"
      cluster: ["K5-dsl-internet", "K6-dns"]
  # Pillars ohne eigenen Cluster: hier gilt die Rollenpflicht noch nicht.
  # Jede Ausnahme braucht Grund und Prüfdatum; der Test erzwingt beides.
  ausnahmen:
    - pillar: "strom-sparen"
      grund: "kein Cluster vorhanden (32 Live-Beiträge am 23.11.2026); Kuratierung offen"
      pruefung: "2026-12-15"
    - pillar: "mietwagen"
      grund: "kein Cluster vorhanden (8 Live-Beiträge am 23.11.2026)"
      pruefung: "2026-12-15"
    - pillar: "versicherungen"
      grund: "kein Cluster vorhanden (4 Live-Beiträge am 23.11.2026)"
      pruefung: "2026-12-15"

