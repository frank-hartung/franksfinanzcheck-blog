# Weiterleitungen (301-Ziel je Alt-URL) – Quelle der Wahrheit
# Stand: 19.10.2026
#
# Was daraus wird (nicht von Hand ändern, siehe scripts/weiterleitungen.py):
#   static/<von>/index.html  → Weiterleitungsseite (Meta-Refresh 0 s, canonical, noindex,follow).
#                              GitHub Pages kann keine echten HTTP-301 setzen. Diese Seite ist ein
#                              Ersatz, kein Äquivalent zum 301.
#   cloudflare/redirects/    → Bulk-CSV für echte 301 über Cloudflare. Wird NUR erzeugt, wenn der
#                              Cloudflare-Proxy vor franksfinanzcheck.de aktiv ist (Flag --cloudflare).
#
# Befehle:
#   python3 scripts/weiterleitungen.py --check     Quelle validieren (Ziele live, keine Ketten, keine Schleifen)
#   python3 scripts/weiterleitungen.py --build     static/-Seiten erzeugen (Überschreiben nur eigener Seiten)
#   python3 scripts/weiterleitungen.py --verify    erzeugte Seiten gegen Quelle prüfen (kein Schreiben)
#   python3 scripts/weiterleitungen.py --selftest  Selbsttest
#
# Regeln (Zuordnung je Eintrag, Feld "regel"):
#   A  Gleicher Artikel, nur Ordner umbenannt (Datumskorrektur) oder Dublette "(1)" mit gleichem Titel.
#   B  Gleiches Thema und gleiche Suchabsicht. Ziel ist ein Live-Beitrag. Zuordnung manuell geprüft.
#      Die Begründung steht je Eintrag im Feld "grund". Bei Teilüberschneidung steht das ausdrücklich dabei.
#   C  Kein gleichwertiger Live-Beitrag. Ziel ist die Pillar-Seite des Themas, NIE die Startseite.
#   F  Konsolidierung: zwei Seiten mit identischer Suchabsicht werden zu einer. Nur zulässig mit
#      ALLEN drei Belegen (Suchabsicht identisch, Nachfrage belegt, kein redaktioneller Link auf
#      die Quelle). Prüfen mit:  python3 scripts/konsolidierung.py --vorschlag "/posts/<quelle>/"
#      Die Wache (weiterleitungen.py --check) rechnet dieselben Belege erneut. Details:
#      docs/ANLEITUNG-WEITERLEITUNGEN.md, Abschnitt 3a.
#   Ziele sind immer Live-Seiten (draft: false). Entwürfe sind als Ziel verboten.
#   Ketten (Ziel ist selbst Quelle) und Schleifen sind verboten.
#   Alt-URLs ohne passendes Ziel stehen in data/url_entfallen.yaml (bewusst 404, Regel D) und
#   tag-Archive (Regel E). Tag-Archive bleiben nach der Entscheidung "Index-Hygiene" (29.09.2026) 404.
#
# Umfang: 118 ehemals veröffentlichte Post-URLs fehlen aktuell im Build. 115 haben hier ein passendes Ziel,
# 3 bleiben bewusst 404 in data/url_entfallen.yaml (Regel D).
# Stand 27.10.2026: 136 Einträge aus dem GSC-Kandidatenraum ergänzt (Regel A).
#
# Quelle der Liste: Git-Historie (git log --all -M -- content/posts), ergänzt um die geprüften
# Alt-URLs aus data/url_snapshot.json. Stand 19.10.2026.

