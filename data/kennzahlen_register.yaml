# ============================================================
#  KENNZAHLEN-REGISTER – Frühwarn-Radar für harte Kennzahlen
#  (Quick Win H5 aus der Konkurrenz-Analyse Finanztip,
#   28.09.2026: „Veränderungen früher erkennen“)
#
#  WARUM: Finanztip baut laut Stellenanzeige genau diese Maschine
#  („(Senior) Product Data & AI Automation Manager – Änderungs-
#  erkennung bis Aufbereitung“). Frank hat sie mit diesem Register
#  + scripts/kennzahlen_radar.py für 0 € Personal: Der Radar
#  prüft, welche Kennzahlen fällig sind, ob die Agent-Reach-Briefs
#  (data/research/) ein neueres Signal erwähnen und welche
#  Artikel älter sind als ihr Kennzahlenstand.
#
#  SSOT-VERTRAG (wie data/agent_reach/*.yaml):
#    * Diese Datei ist MENSCHLICH KURATIERT.
#      Die Maschine (scripts/kennzahlen_radar.py) LIEST sie,
#      schreibt sie aber NIE.
#    * `ist_wert`/`stand` pflegt Frank nach einer Prüfung von
#      Hand (oder übernimmt sie aus einem Faktenfrische-Befund).
#      Nur belegte Werte eintragen – nichts aus dem Gedächtnis.
#    * Jede `quelle.url` muss auf der Allowlist in
#      data/agent_reach/faktenfrische.yaml stehen (Rang 1–3).
#      Affiliate-Partner sind als Kennzahlenquelle verboten.
#    * `betroffene_slugs`: Posts als Slug (Ordnername unter
#      content/posts/), Ratgeber-Seiten mit Präfix „pillar/“.
#      Der Radar validiert, dass jeder Slug existiert.
#
#  Felder je Kennzahl:
#    id, name, einheit          – Identität
#    ist_wert                   – zuletzt geprüfter Wert (String) oder null
#    stand                      – Datum der letzten Prüfung (YYYY-MM-DD)
#    quelle.name / quelle.url   – Beleg (Allowlist-Domain!)
#    rhythmus_tage              – Prüfintervall (danach gilt: fällig)
#    toleranz                   – erlaubte Abweichung vor Alarm (null = jede Änderung)
#    ymyl                       – verschärft die Priorität im Report
#    suchbegriffe               – Trigger-Wörter für die Agent-Reach-Briefs
#    betroffene_slugs           – Artikel/Ratgeber, deren Zahlen davon abhängen
# ============================================================

