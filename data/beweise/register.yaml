  - id: ms-standby-haushalt-2026
    typ: messreihe
    titel: "Standby-Messreihe: 10 Gerätegruppen, 14 Tage, Energiekostenmessgerät"
    themenbereich: strom-sparen
    belegklasse: erfahrung
    status: in-erhebung
    angelegt: "2026-10-01"
    kurzfazit: >-
      Eigene Messreihe ersetzt die bisher zitierten Pauschalwerte zu
      Standby-Verbräuchen durch selbst gemessene Watt- und
      Jahreskostenwerte je Gerätegruppe.
    messaufbau:
      geraet: "Zwischenstecker-Energiekostenmessgerät (Messbereich ab 0,1 W, Genauigkeitsklasse laut Hersteller ±1 %)"
      zeitraum: "14 Tage je Gerätegruppe, Oktober–November 2026"
      protokoll:
        - "Je Gerätegruppe: Standby-Leistung in Watt (Mittelwert aus 3 Ablesungen) und Aus-Zustand"
        - "Hochrechnung: kWh/Jahr = Watt × 24 h × 365 ÷ 1000, bewertet mit dem BDEW-Durchschnittspreis (Kennzahl bdew-haushaltsstrompreis, Stand-Datum wird mitveröffentlicht)"
        - "Gerätegruppen: Router, TV, Spielkonsole, Kaffeevollautomat, Mikrowelle, PC+Monitor, Soundbar, Drucker, Ladegeräte, Smart-Home-Hub"
        - "Rohdaten erscheinen als versionierter Datensatz unter data/datasets/ (CC BY 4.0)"
    dokumentationsplan: >-
      Messung läuft im realen Haushalt; veröffentlicht werden
      Rohwerte, Rechenweg und Gerätegenerationen (ohne Marken-
      Einzelbewertung). Bis dahin tragen Standby-Artikel weiterhin
      die Belegklasse A/M an jeder Zahl – nicht E.
    faellig: "2026-11-30"
