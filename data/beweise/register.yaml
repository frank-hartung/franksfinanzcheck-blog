  - id: wp-internet-dsl-2026
    typ: wechselprotokoll
    titel: "Dokumentierter eigener DSL-Anbieterwechsel (mit Rechnungen)"
    themenbereich: internet-dsl
    belegklasse: erfahrung
    status: in-erhebung
    angelegt: "2026-10-01"
    kurzfazit: >-
      Eigener Anbieterwechsel wird vollständig protokolliert:
      jedes Datum, jede Rechnung, jede Hürde – als öffentlicher
      Beleg für die im Ratgeber beschriebenen Abläufe.
    pflichtfelder:
      - "Auftragsdatum, bestätigter Schalttermin, tatsächlicher Schalttermin"
      - "Letzte Rechnung Altanbieter und erste Rechnung Neuanbieter (anonymisierte Scans; Originale intern archiviert)"
      - "Ausfallzeit in Stunden am Wechseltag"
      - "Bonus beantragt am / gutgeschrieben am (Nachweis der Auszahlungshürden)"
      - "Effektivpreis-Nachrechnung nach Formel mr-dsl-effektivpreis-24m mit den realen Beträgen"
    dokumentationsplan: >-
      Protokoll läuft seit Oktober 2026 mit dem Kündigungsfenster des
      Bestandsvertrags. Veröffentlicht wird der Eintrag erst, wenn die
      erste Rechnung des Neuanbieters vorliegt – vorher wäre das
      Ergebnis eine Behauptung, kein Beleg.
    faellig: "2026-12-15"

