      Zwischen Girokonto (0 €) und gut verzinstem Tagesgeld (465 €)
      liegen im Modell 465 € Bruttozins pro Jahr – bei identischer
      Verfügbarkeit des Geldes.
    rechenweg: >-
      Bruttoertrag = 15.000 € × Modellzinssatz pro Jahr; Modellsätze:
      Girokonto 0,00 %, Sparbuch 0,40 %, Tagesgeld 1,90 %,
      Top-Tagesgeld 3,10 %, Festgeld 12 Monate 3,40 %.
    annahmen:
