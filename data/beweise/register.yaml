  - id: fs-dsl-modellfall-2026
    typ: fallstudie
    titel: "Modellfall: Bestandskunde zahlt 44,95 € – was bringt der Wechsel wirklich?"
    themenbereich: internet-dsl
    belegklasse: markt
    status: modellfall
    angelegt: "2026-10-01"
    stand: "2026-10-01"
    kurzfazit: >-
      Der Modellfall zeigt den typischen Entscheidungsweg: Nicht der
      Werbepreis (29,99 €), sondern der Effektivpreis (41,24 €)
      entscheidet – der Wechsel lohnt sich hier trotzdem, bringt aber
      real 44,52 € pro Jahr statt der suggerierten 179,52 €.
    ausgangslage: >-
      Bestandstarif nach Ablauf der Aktionsphase: 44,95 € pro Monat
      für DSL 100, Vertrag monatlich kündbar. Ein Portal bewirbt
      einen Neuvertrag mit „29,99 €“.
    entscheidung: >-
      Statt auf den Werbepreis zu reagieren, wird der Effektivpreis
      über 24 Monate gerechnet (Formel siehe Modellrechnung
      mr-dsl-effektivpreis-24m): 41,24 € pro Monat inklusive
      Preisstufe ab Monat 13, Routermiete, Bereitstellung und Bonus.
    ergebnis: >-
      Ersparnis real 3,71 € pro Monat (44,52 € pro Jahr) statt der
      suggerierten 14,96 € pro Monat. Der Wechsel bleibt sinnvoll –
      die Entscheidung fällt aber auf Basis der ehrlichen Rechnung,
      nicht des Lockpreises.
    zeitraum: "Modellzeitraum: 24 Monate Vertragslaufzeit"
    anonymisierung: >-
      Durchgerechneter Modellfall mit typischen Marktkonditionen
      (Stand 09/2026) – keine reale Einzelperson, keine realen
      Vertragsdaten. Reale, anonymisierte Fallstudien sind im
      Backlog dieses Registers terminiert.
    grenzen:
      - "Kein realer Einzelfall – Ausgangstarif und Konditionen sind typisiert"
      - "Regionale Verfügbarkeit und individuelle Boni können das Ergebnis verschieben"
    quellen:
      - name: "Zugrunde liegende Modellrechnung (Formel, Annahmen, Datensatz)"
        url: "https://franksfinanzcheck.de/posts/2026-08-19-dsl-vergleich-so-findest-du-guenstigeres-internet/#der-24-monats-taschenrechner-den-vergleichsportale-nicht-zeigen"
    changelog:
      - datum: "2026-10-01"
        notiz: "Erstfassung als ausgewiesener Modellfall auf Basis der verifizierten Modellrechnung mr-dsl-effektivpreis-24m."

