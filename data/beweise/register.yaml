  - id: mr-dsl-effektivpreis-24m
    typ: modellrechnung
    titel: "DSL-Effektivpreis über 24 Monate (Werbepreis vs. echter Monatspreis)"
    themenbereich: internet-dsl
    belegklasse: markt
    status: verifiziert
    angelegt: "2026-09-28"
    stand: "2026-09-28"
    kurzfazit: >-
      Ein mit 29,99 € beworbener DSL-Tarif kostet im dokumentierten
      Modellfall über die volle Laufzeit 41,24 € pro Monat – der
      Werbepreis unterschätzt die echten Kosten um 37 Prozent.
    rechenweg: >-
      Effektivpreis = (12 × 29,99 € + 12 × 44,99 € + 120 € Router
      + 69,99 € Bereitstellung − 100 € Bonus) ÷ 24 Monate = 41,24 €.
    annahmen:
      - "24 Monate Mindestlaufzeit, Preisstufe ab Monat 13 laut Preisliste"
      - "Routermiete 5 €/Monat über die gesamte Laufzeit (120 €)"
      - "Wechselbonus wird vollständig ausgezahlt (Auszahlungshürden siehe Grenzen)"
    grenzen:
      - "Modellfall mit typischen Konditionen – kein Angebotsvergleich und keine Preisprognose"
      - "Boni mit Auszahlungshürden (Portal-Registrierung, Fristen) können den Effektivpreis real verschlechtern"
    dataset: dsl_effektivpreis_modell
    quellen:
      - name: "Rechenweg im Artikel (Abschnitt „24-Monats-Taschenrechner“)"
        url: "https://franksfinanzcheck.de/posts/2026-08-19-dsl-vergleich-so-findest-du-guenstigeres-internet/#der-24-monats-taschenrechner-den-vergleichsportale-nicht-zeigen"
      - name: "Versionierter Datensatz mit Changelog (CC BY 4.0)"
        url: "https://github.com/frank-hartung/franksfinanzcheck-blog/blob/main/data/datasets/dsl_effektivpreis_modell.yaml"
    changelog:
      - datum: "2026-09-28"
        notiz: "Erstfassung; Werte gegen die im Artikel offengelegte Rechnung geprüft (redaktioneller Rechencheck)."

