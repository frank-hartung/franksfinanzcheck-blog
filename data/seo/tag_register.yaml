# =====================================================================
#  KANONISCHES TAG-REGISTER  ·  Indexierungs-Hygiene der Taxonomie
#  Angelegt 29.09.2026 (Befund: 237 nicht indexierte Seiten in der GSC)
# ---------------------------------------------------------------------
#  WARUM ES DIESES REGISTER GIBT
#  scripts/engine_generate.py hat die Tags eines Artikels blind aus
#  seinen SEO-Keywords abgeleitet (`tags = kws[:4]`). Keywords sind aber
#  per Definition long-tail und pro Artikel einmalig – jeder neue Artikel
#  hat damit ~4 brandneue Tags erzeugt. Ergebnis nach 63 Artikeln:
#    217 Roh-Tags → 147 Tag-Archive, 193 davon mit genau EINEM Artikel,
#    dazu 147 zusätzliche /page/1/-Alias-Weiterleitungen.
#  Das sind ~294 URLs ohne eigenen Suchwert, die Google crawlt, als
#  „nicht indexiert" meldet und die Crawl-Budget von den 58 echten
#  Money-Pages abziehen.
#
#  DIE REGEL AB JETZT
#  Tags sind ein KURATIERTES Navigationsraster, kein Keyword-Abfallprodukt.
#  Ein Artikel darf nur Tags tragen, die hier stehen. Neue Tags entstehen
#  durch eine redaktionelle Entscheidung (Eintrag hier), nicht durch einen
#  Generator.
#
#  ROLLENVERTEILUNG IM SEITENBAUM (Entscheidung 29.09.2026, Frank)
#    Pillar-Seiten  = die sechs indexierbaren Themen-Hubs (sollen ranken)
#    Tag-ARCHIVE    = abgeschafft. Die Taxonomie `tags` ist in hugo.toml
#                     abgeschaltet; es entsteht keine /tags/-URL mehr.
#                     Die Themen-Navigation am Artikelende zeigt über
#                     layouts/_partials/themenwelt_chips.html auf die
#                     Pillar-Ratgeber – indexierbare Ziele statt noindex.
#    Tag-FELD       = bleibt im Frontmatter und bleibt wichtig:
#                     Hugos Related-Matching ([related], Gewicht 80) baut
#                     daraus die Verwandten-Karten, das Article-Schema
#                     nutzt es als Keyword-Rückfall.
#  Ein Tag ist also ein ÄHNLICHKEITS-SIGNAL, kein URL-Erzeuger. Deshalb
#  bleibt `min_artikel_pro_tag` gültig: ein Tag mit nur einem Artikel kann
#  keine zwei Artikel verbinden und ist fürs Matching totes Gewicht.
#
#  PFLEGE
#    python3 scripts/tag_governance.py --report   Bestand ansehen
#    python3 scripts/tag_governance.py --check    Wache (CI, Exit 1 = Fund)
#    python3 scripts/tag_governance.py --apply    Frontmatter normalisieren
#  Ein neuer Tag braucht: name, pillar, mindestens `min_artikel_pro_tag`
#  Artikel – sonst ist er fürs Related-Matching wirkungslos (Regel T4).
# =====================================================================

politik:
  # Wie viele Tags darf ein Artikel tragen? Mehr Tags = mehr Archive.
  max_tags_pro_artikel: 4
  # Ab wie vielen Artikeln kann ein Tag überhaupt etwas verbinden?
  # Unter 2 verknüpft er nichts und ist fürs Related-Matching wirkungslos.
  min_artikel_pro_tag: 2
  # Tag-Namen sind Navigationslabels, keine Überschriften. Alles, was
  # länger ist, war in der Praxis ein versehentlich kopierter Artikeltitel.
  max_tag_laenge: 32
  # Zeichen, die in einem Tag-Namen nie vorkommen dürfen: sie erzeugen
  # entweder kaputte Slugs (U+202F/U+00A0 → %E2%80%AF in der URL) oder
  # verraten einen kopierten Titel (Doppelpunkt, Gedankenstrich, Ausrufezeichen).
  verbotene_zeichen: [":", "–", "—", "!", "?", "\u202f", "\u00a0", "\u2009"]
  # Kategorien sind die grobe Publikationsart – nicht das Thema.
  erlaubte_kategorien: ["Ratgeber", "News"]
  # Tag-Archive gibt es nicht mehr (Taxonomie in hugo.toml abgeschaltet).
  archive: "abgeschaltet"

