# Monetarisierungsquellen des Blogs.
provider: umami-only

# Umami ist als Messquelle vorbereitet, aber im Browser derzeit per leerer
# websiteId in hugo.toml aus Datenschutzgründen deaktiviert. Erst nach
# Rechts-/Live-Prüfung und ausdrücklicher Freigabe wieder aktivieren.
# Kostenfreie Betriebsgrenze: Umami Cloud Free bietet keinen API-Zugang.
# Der API-Import ist daher bewusst deaktiviert (keine API-Anfragen, kein Token nötig).
analytics: umami
umami_api_import_enabled: false
