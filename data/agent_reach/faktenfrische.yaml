# ============================================================
#  FAKTENFRISCHE – Recherche-Vertrag für Blogartikel
#  (Auftrag Frank, 27.09.2026: „Bestehende und zukünftige
#   Blogartikel automatisch mit Agent Reach und Claude fachlich
#   und inhaltlich auf Premium-Level einer Profi-Agentur
#   optimieren – bei Content-Erstellung und in sinnvollen
#   Abständen mit Internet-Recherche.“)
#
#  SSOT für scripts/faktenfrische.py. Diese Datei ist – wie
#  data/agent_reach/themenplan.yaml – MENSCHLICH KURATIERT.
#  Die Maschine liest sie, schreibt sie aber nie.
#
#  Leitplanken (KI-Redaktions-Statut, CLAUDE.md):
#    * Recherche NUR LESEND über Agent-Reach-Kanäle.
#    * Claude darf ausschließlich BELEGTE Quellen nennen: Jede
#      URL im Vorschlag muss im Recherche-Dossier stehen
#      (Anti-Halluzinations-Vertrag, siehe scripts/faktenfrische.py).
#    * Artikeltext wird NIE automatisch umgeschrieben. Automatisch
#      gepflegt werden nur Frontmatter-Felder `faktencheck` und
#      `quellen` (Belegkette) – Textänderungen sind eine
#      redaktionelle Entscheidung und landen in der Queue.
#    * `lastmod` wird NIE von diesem Skript gesetzt (Frische-
#      Inflation, siehe layouts/_partials/article_dates.html).
# ============================================================

version: 1

# --- Wann ist ein Artikel wieder recherche-fällig? -----------------
# „Sinnvolle Abstände“ = nach Risikoklasse, nicht nach Gießkanne.
intervalle:
  # YMYL-Themen (Geld, Versicherung, Verträge, Fristen, Zinsen):
  # kurze Halbwertszeit, weil Preise/Gesetze/Stichtage kippen.
  ymyl_tage: 45
  # Alles andere (Haushalt, Gewohnheiten, Mindset).
  standard_tage: 90
  # Saisonale Artikel (Heizung, Kfz-Stichtag 30.11., Jahreswechsel)
  # werden im Saisonfenster zusätzlich vorgezogen.
  saison_tage: 30
  # Erstrecherche bei Content-Erstellung: Ein neuer Artikel ohne
  # `faktencheck` ist IMMER fällig (Priorität 0).
  erstrecherche_bei_erstellung: true

budget:
  # EIN Schlüssel, EIN Wert (A5/C32): Am 03.11.2026 stand die
  # `max_artikel_pro_lauf`-Zeile doppelt in der Datei (Rest eines
  # Heil-Laufs, #1021). PyYAML nimmt still den letzten Wert – der
  # Artefakt-Wächter hat den Doppel-Schlüssel gefunden.
  max_artikel_pro_lauf: 11      # Sockel = Untergrenze; Automatik hebt bis zum Limit
  # NACHMESSUNG 26.11.2026 (#1376, 150 Artikel im Bestand): Bei Sockel 10
  # reißt der 7-Tage-Ausfall ab Tag 3 drei Saison-Fristen (30-Tage-Intervall
  # ab 03.11. → 05.12.); Sockel 11 ist die kleinste gemessene Untergrenze mit
  # 0 Verletzungen auf allen Starttagen (3, 10 und 20). Fachintervalle und
  # Prüfkriterien bleiben unverändert.
  # 02.11.2026 (#912): 112 Seiten benötigen 3,01 Prüfungen/Tag bei
  # 110 % Mindestdeckung – Sockel 3 → 4. 04.11.2026 (#1039): 4 → 12.
  # 06.11.2026 (#1107): Die Bündel-Begründung von #1039 war ein MESSFEHLER
  # (Projektion ab dem eingefrorenen Prüfstand). Gemessen als Trajektorie ab
  # heute: Sockel 4 trägt alle 52 Montage (0 rot); Sockel 3 → 12 rot.
  # Herausgeber-Entscheidung 06.11.2026: Sockel 12 → 4.
  # NACHMESSUNG 10.11.2026 (gesamte Regression, 126 Artikel): Ein 7-Tage-
  # Ausfall ab Tag 10 ließ zwei YMYL-Fristen um einen Tag reißen (SLA-Test).
  # Sockel 5 ist die kleinste getestete Änderung, die alle drei Ausfallstarts
  # (Tag 3/10/20) ohne Fristverletzung trägt. Das ist +1 Prüfung/Tag im
  # Normalbetrieb, keine Änderung der Fachintervalle oder Prüfkriterien.
  # Limit 16 war beim +97-Tage-Vollrückstand zugleich das empfohlene Budget:
  # keine Reserve (C45). Limit 18 lässt zwei Plätze Reserve; Sockel bleibt
  # elastisch und das harte Limit wird nur bei echtem Rückstand ausgeschöpft.
  # Gemessen: tests/test_faktenfrische_kapazitaet.py, echte Workflow-Kadenz.
  # Historie 04.11.2026: Der +97-Tage-Stresstest fand zunächst Limit 10 zu
  # klein; die Kalenderrechnung stieg auf 14, danach auf 16. Die erneute
  # Messung mit 126 Artikeln vom 10.11.2026 belegt Limit 18 (16 + 2 Reserve).
  # Prüffristen, Rechercheintervalle, Takt, Nachholfrist und Mindestdeckung
  # bleiben unverändert.
  # NACHMESSUNG 18.11.2026 (aktueller Bestand nach den neuen Entwürfen):
  # Der 7-Tage-Ausfalltest meldet 14 Fristverletzungen bei Sockel 5 ab Tag 3;
  # Sockel 10 ist die kleinste gemessene Untergrenze mit 0 Verletzungen bei
  # den Starttagen 3, 10 und 20. Limit 19 allein ändert das Messergebnis nicht.
  # NACHMESSUNG 14.11.2026 (132 Artikel, 131 mit Frist): Der Stresstest
  # rechnet seinen Tag jetzt aus dem Bestand (späteste Frist + Nachholfrist,
  # `faktenfrische_kapazitaet.vollrueckstand_stichtag`) statt aus der
  # Konstante 09.02.2027, die seit der ersten Prüfung nach dem 04.11.2026
  # keinen Vollrückstand mehr beschrieb. Gemessen am 18.02.2027: nötiges
  # Budget 17, Abbau in 7 Tagen, 0 Folgefristen gerissen. Limit 18 ließ damit
  # nur noch einen Reserveplatz; nach der Regel vom 10.11.2026 (nötig + 2)
  # gilt Limit 19. Je 8 weitere Seiten steigt das nötige Budget um 1 – ab
  # 144 Seiten mit Frist meldet der Test die aufgebrauchte Reserve.
  max_treffer_je_artikel: 6     # so viele Fundstellen ins Dossier
  max_quellen_frontmatter: 4    # so viele Belege in den Artikel
  web_max_zeichen: 1800         # Klartext-Auszug je Webseite
  # ----------------------------------------------------------------
  #  DECKUNGSRECHNUNG (29.10.2026, #912 „Produktionswahrheit rot“)
  #  ------------------------------------------------------------
  #  Befund: Das Budget war die einzige Mengengrenze des Bestands-
  #  Takts – 3 Artikel je Lauf, zwei Läufe je Woche. Der Bestand
  #  braucht nach den Intervallen oben aber rund 18 Prüfungen je
  #  Woche (2,6 je Tag bei 106 Seiten). Die Kadenz war damit
  #  strukturell unterdeckt (33 %): Jede Woche wurden zwölf Seiten
  #  mehr überfällig, als geprüft werden konnten. Die Release-
  #  Scorecard konnte deshalb NIE grün werden – ein Dauer-Alarm
  #  ohne Schließpfad (C14), der am Ende nur noch Rauschen war.
  #
  #  Die Heilung ist nicht „weniger messen“: Die Intervalle oben
  #  bleiben unangetastet. Es wird mehr geliefert.
  auto_skalierung: true         # Budget folgt dem Bedarf (unten)
  hartes_limit_pro_lauf: 21     # 19 nötige + 2 Reserveplätze im Vollrückstands-Stresstest (22.11.2026)
  #  22.11.2026: 19 → 21. Gemessen mit `empfohlenes_budget` über den heutigen
  #  Bestand im Vollrückstand (139 Seiten überfällig, Stichtag 22.02.2027):
  #  nötig sind 19 Prüfungen pro Lauf, Abbau in 7 Tagen (erlaubt 7). Bei
  #  Limit 19 bliebe kein einziger Reserveplatz – die Deckungs-Wache hat genau
  #  das gemeldet (`test_vollrueckstand_nach_97_tagen_behaelt_reserve`).
  #  Die Regel vom 10.11.2026 (gemessener Bedarf plus zwei Plätze) ist
  #  unverändert; der Sockel bleibt 10, der Normalbetrieb ändert sich nicht.
  #  Das harte Limit ist der Vertrag mit der Deckungs-Wache
  #  (scripts/faktenfrische_kapazitaet.py, Governance C45): Es muss
  #  den Bedarf auch an einem Spitzentag decken. Reicht es nicht
  #  mehr, wird der Bau rot, BEVOR der Bestand rot wird.

# --- Deckungsrechnung: Vorlauf, Nachholfrist, Horizont ---------------
#  Warum ein Vorlauf? Ein Artikel wird nicht an dem Tag fällig, an
#  dem er rot wird, sondern eine Woche vorher arbeitbar. Wer erst am
#  Stichtag anfängt, arbeitet an einer roten Scorecard.
planung:
  # Arbeit beginnt, wenn die Frist so viele Tage entfernt ist.
  # 06.11.2026 (#1107): 7 → 14. Der Vorlauf beginnt die Arbeit vor der Frist.
  # Nachmessung 10.11.2026: Sockel 5 + Vorlauf 14 trägt die geprüften
  # 7-Tage-Ausfallstarts (Tag 3/10/20); mit Sockel 4 rissen zwei Fristen.
  # Die Testgarantie gilt ausdrücklich nicht für Ausfallstart Tag 0–2.
  vorlauf_tage: 14
  # Ein Rückstand (bereits überfällige Seiten) muss binnen so vielen
  # Tagen abgebaut sein – sonst ist der Lauf rot (Schließpfad).
  nachhol_frist_tage: 7
  # So weit rechnet die Simulation voraus (Sichtbarkeit, nicht Wahrheit).
  horizont_tage: 120
  # Statische Mindestdeckung für die Wache: Kapazität/Bedarf. 110 %
  # lässt Luft für Spitzen (viele Seiten mit demselben Prüfdatum).
  min_deckung_prozent: 110

# --- Vertrauenswürdige Belegquellen --------------------------------
# Rang 1 = amtlich/normsetzend, Rang 2 = etablierte Verbraucher-/
# Fachinstanz, Rang 3 = seriöse Wirtschaftsredaktion.
# NUR Domains aus dieser Liste dürfen als Beleg in einen Artikel.
# Affiliate-Partner (CHECK24, Tarifcheck …) sind bewusst NICHT
# belegfähig – Provisionsquelle ≠ Faktenquelle.
quellen_allowlist:
  - domain: bundesnetzagentur.de
    herausgeber: "Bundesnetzagentur"
    rang: 1
  - domain: destatis.de
    herausgeber: "Statistisches Bundesamt"
    rang: 1
