# ============================================================
#  KI-REDAKTION – Konfiguration (Single Source of Truth)
#  ------------------------------------------------------------
#  Blog-Automatik nach dem Schema „Claude für lange Artikel +
#  ChatGPT für schnelle News + Jasper für SEO" – als kostenfreie
#  Funktions-Abbildung (siehe KI-REDAKTION.md).
#
#  KOSTEN-REGEL (Dauervorgabe Frank, 08.09.2026):
#  In den Anbieter-Ketten dürfen NUR Gratis-Provider stehen
#  (groq, gemini). Der Selbsttest (ki_redaktion.py --selftest)
#  bricht mit Exit 2 ab, sobald hier ein Paid-Provider als
#  alleinige Option konfiguriert ist.
# ============================================================

# Rollen-Ketten: erster erreichbarer Provider gewinnt.
# groq = GPT-OSS 120B (kostenlos), gemini = Gratis-Tier.
anbieter_kette_lang: [groq, gemini]
anbieter_kette_news: [groq, gemini]

# Zeichen-Korridore (müssen den length_policy-Floor 10.000 erfüllen)
zeichenvorgabe_lang:
  min: 11000
  ziel: 14000
  max: 18000
zeichenvorgabe_news:
  min: 10500
  ziel: 12000
  max: 15000

# Dauervorgabe: Die KI-Redaktion veröffentlicht NIE selbst.
# true wird vom Orchestrator aktiv ignoriert und im Report angemerkt.
auto_veroeffentlichen: false

max_artikel_pro_lauf: 1

# ------------------------------------------------------------
#  STILPOLITUR – KOSTENLOSE Claude-Lane (ausdrücklicher Auftrag
#  Frank, 25.09.2026): „Nutze für jeden bestehenden und
#  zukünftigen Blogartikel nach der Offline-Optimierung zusätzlich
#  automatisch täglich Claude mit einem personalisierten Prompt
#  für meinen eigenen Schreibstil auf Premium-Level einer
#  Profi-Agentur." Nachtrag selben Tages: „Claude sollte nur ohne
#  API genutzt werden. Dafür sollte das aktuell beste
#  kostenlose Claude-Modell gewählt werden."
#
#  ZUGANG: Puter.js „Free, Unlimited Claude API" (User-Pays) –
#  KEINE Anthropic-API, KEIN Modell-Key, KEINE Kosten. Auth nur
#  PUTER_AUTH_TOKEN (kostenloser Puter-Account mit monatlichem
#  Gratis-Kontingent), Brücke: scripts/puter_chat.mjs. Die Lane
#  bleibt damit IMMER innerhalb der Kosten-Regel des Repos.
#
#  MODELL-AUSWAHL (Auftrag: „aktuell beste kostenlose Claude-
#  Modell", Stand 25.09.2026): claude-fable-5-1 (Fable 5.1,
#  Spitze der kostenlosen Modellkarte) → Fallbacks:
#  claude-opus-5-5 → claude-sonnet-5 (Free-Tier-Workhorse,
#  sparsamstes Kontingent). Override: STILPOLITUR_MODEL.
#  Der Selbsttest (claude_stilpolitur.py ST3) weist alles ab,
#  was nicht in der Frei-Liste des Puter-Katalogs steht.
#
#  Verbrauch (Cost-Guard): Jeder Lauf prüft jeden Artikel, schreibt
#  aber nur bei Bedarf (Fingerprint in data/claude_stil_state.json:
#  neu · geändert · älter als auffrischung_tage).
# ------------------------------------------------------------
stilpolitur:
  modell: "claude-fable-5-1"
  modell_fallback: ["claude-opus-5-5", "claude-sonnet-5"]
  temperatur: 0.5
  max_tokens: 8192
  timeout: 300
  max_artikel_pro_tag: 12
  auffrischung_tage: 7
