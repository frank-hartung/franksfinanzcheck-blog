# ============================================================
#  KI-REDAKTION – Konfiguration (Single Source of Truth)
#  ------------------------------------------------------------
#  Blog-Automatik nach dem Schema „Claude für lange Artikel +
#  ChatGPT für schnelle News + Jasper für SEO" – als kostenfreie
#  Funktions-Abbildung (siehe KI-REDAKTION.md).
#
#  KOSTEN-REGEL (Dauervorgabe Frank, 08.09.2026):
#  In den Anbieter-Ketten dürfen NUR Gratis-Provider stehen
#  (groq, gemini). Der Selbsttest (ki_redaktion.py --selftest)
#  bricht mit Exit 2 ab, sobald hier ein Paid-Provider als
#  alleinige Option konfiguriert ist.
# ============================================================

# Rollen-Ketten: erster erreichbarer Provider gewinnt.
# groq = GPT-OSS 120B (kostenlos), gemini = Gratis-Tier.
anbieter_kette_lang: [groq, gemini]
anbieter_kette_news: [groq, gemini]

# Zeichen-Korridore (müssen den length_policy-Floor 10.000 erfüllen)
zeichenvorgabe_lang:
  min: 11000
  ziel: 14000
  max: 18000
zeichenvorgabe_news:
  min: 10500
  ziel: 12000
  max: 15000

# Dauervorgabe: Die KI-Redaktion veröffentlicht NIE selbst.
# true wird vom Orchestrator aktiv ignoriert und im Report angemerkt.
auto_veroeffentlichen: false

max_artikel_pro_lauf: 1

# ------------------------------------------------------------
#  STILPOLITUR – separater PAID-LANE (ausdrücklicher Auftrag Frank,
#  25.09.2026): „Nutze für jeden bestehenden und zukünftigen
#  Blogartikel nach der Offline-Optimierung zusätzlich automatisch
#  täglich Claude 3.5 Sonnet mit einem personalisierten Prompt
#  für meinen eigenen Schreibstil auf Premium-Level einer
#  Profi-Agentur."
#
#  KOSTEN-REGEL-ABGRENZUNG: Diese Lane ist bewusst KEIN Teil der
#  Anbieter-Ketten oben. Die Gratis-Regel für die ARTIKEL-
#  GENERIERUNG (anbieter_kette_lang/news) bleibt unangetastet –
#  Claude 3.5 Sonnet läuft ausschließlich für die Stil-Politur
#  nach der Offline-Optimierung (grammar_check + sprachglatt) und
#  nur mit gesetztem ANTHROPIC_API_KEY.
#
#  Modell-Bindung: Ausdrücklich Claude 3.5 SONNET (Auftrag),
#  NICHT der Sonnet-4.5-Default aus llm_client.py. Override:
#  STILPOLITUR_MODEL (z. B. claude-3-5-sonnet-20241022 als
#  fixe Datums-Version, falls das -latest-Alias entfällt).
#
#  Verbrauch (Cost-Guard): Jeder Lauf prüft jeden Artikel, schreibt
#  aber nur bei Bedarf (Fingerprint in data/claude_stil_state.json:
#  neu · geändert · älter als auffrischung_tage).
# ------------------------------------------------------------
stilpolitur:
  modell: "claude-3-5-sonnet-latest"
  temperatur: 0.5
  max_tokens: 8192
  timeout: 300
  max_artikel_pro_tag: 12
  auffrischung_tage: 7
