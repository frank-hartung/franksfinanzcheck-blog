# ============================================================
#  VARIANTEN-REGISTER – jede Layoutvariante mit Herkunft, Hypothese
#  und Freigabe-Akte. (Rollout 26.09.2026)
#
#  Diese Datei ist MENSCHLICH KURATIERT – wie data/topics.yaml.
#  Eine KI darf Einträge VORSCHLAGEN (scripts/design_reach_briefing.py
#  schreibt Hypothesen nach data/design/briefings/), aber der Eintrag
#  hier und vor allem der Block `freigabe:` entstehen von Hand.
#
#  LEBENSLAUF EINER VARIANTE
#  -------------------------
#    entwurf  →  gemessen  →  freigegeben  →  live
#                    ↓
#                verworfen  (bleibt stehen: ein beerdigter Versuch ist
#                            Wissen, kein Müll)
#
#  Pflichtfelder je Variante:
#    id          Kleinbuchstaben/Ziffern/Bindestrich; = Dateiname des CSS
#    titel       ein Satz, den ein Mensch versteht
#    hypothese   WAS soll besser werden und WORAN erkennt man es
#    oberflaeche welche Seiten die Variante berührt
#    herkunft    woher der Entwurf stammt (Figma / Relume / KI / Hand)
#    status      siehe regelwerk.yaml → freigabe.erlaubte_status
#    css         Pfad relativ zu assets/ (leer bei der Basis)
#    freigabe    Akte; bei status=freigegeben/live vollständig Pflicht
#
#  WICHTIG: `aktiv` unten ist DOKUMENTATION, kein Schalter. Scharf
#  geschaltet wird ausschließlich über den Hugo-Parameter
#  `designVariante` (Umgebungsvariable HUGO_PARAMS_DESIGNVARIANTE oder
#  ein bewusster Eintrag in hugo.toml). Das Gate prüft, dass beides
#  zusammenpasst – auseinanderlaufende Wahrheiten sind der Anfang jeder
#  Design-Havarie.
# ============================================================

version: 1
stand: "2026-09-26"

# Welche Variante läuft laut Register in Produktion? "" = Basis.
# Scharf geschaltet am 26.09.2026 – muss mit params.designVariante in
# hugo.toml übereinstimmen, sonst meldet die Produktionswache P1-Drift.
aktiv: "v-hero-conversion"

varianten:

  # ----------------------------------------------------------------
  # Die Kontrollgruppe. Existiert als echter Eintrag, damit jede
  # Messung einen Gegner hat und kein Vergleich gegen „gefühlt früher“
  # läuft.
  # ----------------------------------------------------------------
  - id: basis
    titel: "Basis – das ausgelieferte Design (Kontrollgruppe)"
    hypothese: >
      Keine. Die Basis ist der Referenzwert: Jede Variante wird gegen
      ihre Messwerte verglichen, nicht gegen eine Wunschzahl.
    oberflaeche:
      - "/"
      - "/posts/"
      - "artikel"
    herkunft: "Bestand (PaperMod + assets/css/extended/)"
    status: live
    css: ""
    freigabe:
      mensch: true
      name: "Frank Hartung"
      datum: "2026-09-26"
      kommentar: >
        Der Bestand ist per Definition freigegeben – er ist das, was
        seit Monaten ausgeliefert wird und alle Gates besteht.

  # ----------------------------------------------------------------
  # Beispielvariante: beweist die Kette End-zu-Ende und bleibt bewusst
  # klein. Sie ist NICHT freigegeben – genau das ist der Punkt.
  # ----------------------------------------------------------------
  - id: v-hero-conversion
    titel: "Hero-Fokus: eine klare Primärhandlung statt drei gleichlauter CTAs"
    hypothese: >
      Die Startseite bietet im Hero drei optisch fast gleichwertige
      Buttons an (Ratgeber / Strom & Gas / Versicherungen). Drei
      gleichrangige Angebote sind keine Führung, sondern eine Abfrage.
      Erwartung: Wenn „Alle Ratgeber entdecken“ sichtbar die
      Primärhandlung ist und die beiden Themen-Einstiege als ruhigere
      Sekundärwege danebenstehen, steigt die Klickrate auf
      cta_click/home-ratgeber, ohne dass die Themen-CTAs einbrechen.
      Messbar an Umami (cta_click je slug) über 14 Tage; Abbruch, wenn
      die Summe aller drei CTAs sinkt.
    oberflaeche:
      - "/"
    herkunft: "KI-Entwurf (Relume-Muster „Hero mit Primär-/Sekundärhandlung“), von Hand auf die Marken-Tokens zurückgeschnitten"
    status: live
    css: "css/varianten/v-hero-conversion.css"
    notizen: >
      Bewusst nur Hierarchie (Gewicht, Fläche, Ruhe) – keine neuen
      Farben, keine neuen Radien, kein zusätzliches Element. Damit ist
      sie rückabwickelbar, indem man eine Datei löscht.
      Freigegeben und am 26.09.2026 scharf geschaltet (Runbook
      Schritt 6): `aktiv: "v-hero-conversion"` hier, dazu
      `designVariante = "v-hero-conversion"` in hugo.toml. Beide
      Stellen müssen übereinstimmen – die Produktionswache prüft das.
      BEOBACHTUNGSFENSTER bis 10.10.2026: cta_click je slug in Umami.
      Rückbau, wenn die Summe aller drei Hero-CTAs sinkt.
    freigabe:
      mensch: true
      name: "Frank Hartung"
      datum: "2026-09-26"
      messprotokoll: "design/messungen/v-hero-conversion-2026-09-26.json"
      kommentar: >
        Freigegeben auf Basis des Messprotokolls vom 26.09.2026. Alle
        Budgets gehalten: Kontrast 7,53 (min. 4,5), kleinstes Tap-Ziel
        26,4 px (min. 24), CLS 0, Lighthouse mobil Performance 0,99 /
        LCP 1774 ms (Budget 2500), desktop 1,00 / 545 ms,
        Accessibility 0,96, SEO 1,00. Die Messkette bleibt vollständig:
        3 von 3 CTAs mit data-umami-event, Affiliate-rel intakt,
        Pflicht-Bausteine vorhanden. CSS-Zuwachs +1292 Bytes
        (erlaubt +6144), ein zusätzliches head-Kind.
        WAS DAMIT NICHT BELEGT IST: dass die Variante mehr Klicks
        bringt. Das Labor sagt „darf ausgeliefert werden", nicht „ist
        besser". Die Hypothese wird nach dem Scharfschalten 14 Tage an
        Umami (cta_click je slug) geprüft; Abbruch und Rückbau, wenn
        die Summe aller drei CTAs sinkt.
