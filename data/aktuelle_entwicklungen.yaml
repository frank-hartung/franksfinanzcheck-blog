# ============================================================
#  AKTUELLE-ENTWICKLUNGEN – kuratierter Signal-Pool für den
#  Willkommenstext (scripts/willkommenstext_guard.py)
#  ------------------------------------------------------------
#  Auftrag (Frank, 14.08.2026): Der Willkommenstext soll "aktuelle
#  Entwicklungen, neue Regelungen, frische Erkenntnisse,
#  Marktveränderungen" widerspiegeln – ohne dass eine KI dafür
#  konkrete Gesetze/Paragraphen/Preise HALLUZINIERT (Haftungsrisiko:
#  ein falsch zitiertes Gesetz oder ein erfundener Preis wäre
#  schlimmer als ein etwas generischerer Text).
#
#  DESHALB: Dieser Pool ist die SINGLE SOURCE OF TRUTH für "harte"
#  Aufhänger – von einem Menschen (oder einem Agenten mit Web-
#  Recherche-Zugriff, siehe SEO-STANDARDS-2026.md als Vorbild für
#  diese Arbeitsweise) geprüft und eingetragen. Die KI-Generierung
#  in willkommenstext_guard.py DARF NUR aus diesem Pool zitieren/
#  paraphrasieren, NICHT eigene Fakten erfinden (siehe Prompt-Regeln
#  im Skript).
#
#  ROTATION: willkommenstext_guard.py wählt pro Lauf EINEN Eintrag
#  aus (nach Kalenderwoche, deterministisch – siehe SIGNAL_INDEX in
#  data/willkommenstext_history.jsonl), damit der Aufhänger nicht
#  jede Woche der gleiche ist, aber reproduzierbar bleibt.
#
#  FRISCHHALTUNG (analog SEO-STANDARDS-2026.md Kapitel 5): Wenn ein
#  Eintrag durch `bis` abgelaufen ist, wird er von der Rotation
#  automatisch übersprungen (siehe skip_expired() im Skript) – die
#  Datei braucht deshalb regelmäßigen Nachschub, sonst schrumpft der
#  Pool über die Zeit. Frank/Agent sollte bei jeder größeren Zins-,
#  Energiepreis- oder Gesetzesänderung einen neuen Eintrag ergänzen
#  ("Aktualisiere data/aktuelle_entwicklungen.yaml um <Thema>").
#
#  Felder je Eintrag:
#    id        eindeutiger Schlüssel (nie wiederverwenden, auch nach
#              Ablauf nicht – History-Einträge referenzieren ihn)
#    kategorie energie | versicherung | konto | internet | saisonal |
#              seo_qualitaet (rein intern, siehe Skript-Kommentar –
#              beeinflusst NUR den Ton/Rahmen, taucht nie wörtlich
#              als Jargon im Besuchertext auf)
#    ab        gültig ab (ISO-Datum) – vor diesem Datum nicht wählbar
#    bis       gültig bis (ISO-Datum, leer = unbefristet/evergreen)
#    hook      der eigentliche Aufhänger: eine kurze, SICHERE (nicht
#              überprüfbare Einzelfakten wie Paragraphen/exakte Cent-
#              Beträge enthaltende) Beobachtung, die die KI natürlich
#              in 1 Satz einbauen darf/soll.
# ============================================================

- id: energie-herbst-nachzahlung
  kategorie: energie
  ab: "2026-01-01"
  bis: ""
  hook: "Im Herbst und Winter flattern die meisten Nachzahlungen der Energieversorger ins Haus – der beste Zeitpunkt für einen Tarifcheck ist aber schon vorher."

