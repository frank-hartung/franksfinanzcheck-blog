# ============================================================
#  AKTUELLE-ENTWICKLUNGEN – kuratierter Signal-Pool für die
#  Recherche- und Themenplanung (scripts/research_engine.py)
#  ------------------------------------------------------------
#  Der frühere statische Willkommenstext und seine eigene Automation
#  wurden am 27.09.2026 vollständig entfernt. Diese Datei bleibt
#  unabhängig davon die von Menschen kuratierte Faktenbasis für die
#  Recherche-Engine und ihre historischen Recherchearchive.
#
#  Jeder Eintrag ist ein geprüfter, vorsichtig formulierter Aufhänger.
#  Recherche- und KI-Werkzeuge dürfen daraus keine neuen Zahlen,
#  Gesetze, Preise oder Einzelfakten ableiten. Für den saisonalen Hero
#  ist diese Datei KEINE Quelle: dessen Agent-Reach-Workflow gibt nur
#  kuratierte Saison-Themen an Claude weiter und bleibt faktenfrei.
#
#  FRISCHHALTUNG: Ist ein Eintrag durch `bis` abgelaufen, überspringt
#  research_engine.py ihn. Bei belegten Veränderungen kann Frank oder
#  ein Recherche-Agent einen neuen Eintrag ergänzen.
#
#  Felder je Eintrag:
#    id        eindeutiger Schlüssel (nie wiederverwenden, auch nach
#              Ablauf nicht – History-Einträge referenzieren ihn)
#    kategorie energie | versicherung | konto | internet | saisonal |
#              seo_qualitaet (rein intern, siehe Skript-Kommentar –
#              beeinflusst NUR den Ton/Rahmen, taucht nie wörtlich
#              als Jargon im Besuchertext auf)
#    ab        gültig ab (ISO-Datum) – vor diesem Datum nicht wählbar
#    bis       gültig bis (ISO-Datum, leer = unbefristet/evergreen)
#    hook      der eigentliche Aufhänger: eine kurze, SICHERE (nicht
#              überprüfbare Einzelfakten wie Paragraphen/exakte Cent-
#              Beträge enthaltende) Beobachtung, die die KI natürlich
#              in 1 Satz einbauen darf/soll.
# ============================================================

