do_not:
  - Linkkauf, PBNs, Guest-Post-Farmen, Linktausch-Schemes
  - Blog-Verzeichnisse / allgemeinen Katalog-Spam
  - Automatisches Einreichen oder Bot-Kommentare
  - Exact-Match-Anker auf Affiliate-Seiten (/go/)
  - Gastbeitrag = 1:1-Republish eines Live-Artikels (Duplicate Content)
  - nackte CHECK24-Links als Pitch-Ziel
  - mehr als 5 Outreach-Aktionen pro Woche (Kapazität + Spam-Fußabdruck)

