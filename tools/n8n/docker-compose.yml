version: "3.8"

# ============================================================
#  0 € LAUFENDE KOSTEN STACK (FranksFinanzcheck Automation)
#  Whisper lokal + n8n self-hosted + GitHub Pages
# ============================================================

# ------------------------------------------------------------
#  SICHERHEIT (Sicherheitsaudit 14.10.2026, H-06 / N-11):
#   · Ports nur auf 127.0.0.1 – n8n und Whisper sind NICHT aus dem Netz
#     erreichbar. Zugriff von außen nur über einen Tunnel/Reverse-Proxy mit
#     Anmeldung (z. B. Cloudflare Access), nie per Portfreigabe.
#   · Image fest auf eine geprüfte Version (kein :latest).
#   · Execute-Command/LocalFileTrigger hart gesperrt, kein Zugriff auf
#     Umgebungsvariablen aus Ausdrücken/Code-Knoten, Dateizugriff nur in
#     den beiden Arbeitsordnern.
#   · Das Blog-Repo ist NUR LESEND eingehängt – n8n kann keine Dateien im
#     Repo ändern und keine Skripte mit Schreibrecht ausführen.
#   · Alle Workflows sind im Repo auf active:false gestellt; Abschaltung
#     auf dem Rechner: tools/n8n/abschalten.sh
# ------------------------------------------------------------
services:
  # --- n8n Workflow Automation Hub (Self-Hosted Community Edition) ---
  n8n:
    # Docker Hub statt docker.n8n.io: dasselbe offizielle Image, aber Dependabot
    # kann die Tags nur über die Registry-API von Docker Hub abfragen.
    image: n8nio/n8n:2.44.3
    container_name: ff-n8n-automation
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - NODES_EXCLUDE=["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger","n8n-nodes-base.ssh"]
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/home/node/workflows;/data/whisper_inbox
      - N8N_RUNNERS_ENABLED=true
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-true}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_PUBLIC_API_DISABLED=true
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - NODE_ENV=production
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      # Webhook-Empfang nur mit Secret (F-04): n8n-Header-Auth je Webhook-Knoten
      # plus dieses Secret fuer den Python-Bridge-Server. Fehlt es, nehmen weder
      # n8n-Workflows noch die Bridge Anfragen an (fail closed).
      - N8N_WEBHOOK_TOKEN=${N8N_WEBHOOK_TOKEN:?N8N_WEBHOOK_TOKEN fehlt – bitte openssl rand -hex 32 in tools/n8n/.env eintragen}
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336 # 14 Tage History
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows:ro
      - ../../data/whisper_inbox:/data/whisper_inbox
      - ../..:/workspace/blog:ro
    depends_on:
      whisper-api:
        condition: service_healthy
    networks:
      - blog-net

  # --- Lokaler Whisper Spracherkennungs-Dienst (0 € Cloud-Kosten) ---
  whisper-api:
    build:
      context: .
      dockerfile: Dockerfile.whisper
    container_name: ff-whisper-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - PORT=8765
      - HOST=0.0.0.0
      - MAX_UPLOAD_MB=${WHISPER_MAX_UPLOAD_MB:-50}
      # PFLICHT (Sicherheitsaudit 15.10.2026, F-04): Ohne Token verweigert
      # der Dienst die Arbeit (fail closed) – vorher war der Leerfall der
      # Standard und der Dienst damit offen für jede besuchte Webseite.
      - WHISPER_TOKEN=${WHISPER_TOKEN:?WHISPER_TOKEN fehlt – bitte openssl rand -hex 32 in tools/n8n/.env eintragen}
      - TZ=Europe/Berlin
    volumes:
      - whisper_models:/home/whisper/.cache/huggingface
      - ../../data/whisper_inbox:/data/inbox:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - blog-net

volumes:
  n8n_data:
    name: ff_n8n_data
  whisper_models:
    name: ff_whisper_models

networks:
  blog-net:
    name: ff_blog_automation_net
    driver: bridge
