# ============================================================
#  VORLAGE – GSC-Tagesimport (NICHT aktiv)
#  Umsetzung: Datei nach .github/workflows/gsc-import.yml kopieren, per PR
#  (Freigabe durch Frank). Erst nach Anlegen der Secrets aus
#  docs/ANLEITUNG-GSC-API-ZUGRIFF.md, Schritt 6, aktivieren.
#  ------------------------------------------------------------
#  Ablauf: täglich, Daten ändern sich nur in data/gsc/. Der Lauf öffnet
#  einen PR. Ein PR wird NICHT automatisch gemergt. main deployt live.
#  Der Lauf nutzt nur das GITHUB_TOKEN dieses Repos, keinen Agenten-Token.
#  Ohne Secrets endet der Lauf mit Status "nicht_konfiguriert" ohne Fehler.
# ============================================================
name: GSC-Tagesimport

on:
  schedule:
    - cron: "17 5 * * *"    # täglich 05:17 UTC (≈ 07:17 Berlin)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Erstbefüllung: 480 Tage statt 90"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gsc-tagesimport
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: GSC-Daten holen
        env:
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python3 scripts/gsc_import.py --backfill
          else
            python3 scripts/gsc_import.py
          fi

      - name: PR öffnen, wenn sich Daten geändert haben
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/gsc/; then
            echo "Keine Änderungen."; exit 0
          fi
          BRANCH="automation/gsc-tagesdaten-$(date -u +%Y%m%d)"
          git config user.name "gsc-import"
          git config user.email "gsc-import@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/gsc/
          git commit -m "GSC-Tagesdaten $(date -u +%F)"
          git push --force-with-lease origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "GSC-Tagesdaten $(date -u +%F)" \
            --body "Automatischer Import (aggregiert, nur Kennzahlen). Bitte prüfen und mergen." \
            || gh pr view "$BRANCH" --json url -q .url
