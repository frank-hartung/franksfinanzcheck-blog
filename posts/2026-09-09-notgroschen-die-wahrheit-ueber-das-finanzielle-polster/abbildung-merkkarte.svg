<svg xmlns="http://www.w3.org/2000/svg" width="800" height="438" viewBox="0 0 800 438" role="img" aria-label="Merkkarte: Notgroschen: Die Wahrheit über das finanzielle Polster"><rect width="100%" height="100%" fill="#f6f9fc"/><text x="40" y="66" font-size="26" font-weight="700" fill="#1f3a5f">Auf einen Blick</text><line x1="40" y1="90" x2="760" y2="90" stroke="#d7e0ea" stroke-width="2"/><text x="40" y="140" font-size="21" fill="#222">•  Ein Notgroschen sollte mindestens drei- bis sechs-mal deine</text><text x="40" y="172" font-size="21" fill="#222">    monatlichen Fixkosten betragen – bei 1 000 € Fixausgaben also</text><text x="40" y="204" font-size="21" fill="#222">    etwa 3 000 € bis 6 000 €.</text><text x="40" y="248" font-size="21" fill="#222">•  Wenn du ein geringes Einkommen hast, reicht ein Startpolster</text><text x="40" y="280" font-size="21" fill="#222">    von rund 1 000 €.</text><text x="40" y="324" font-size="21" fill="#222">•  Passe die Summe an deine persönliche Ausgaben- und</text><text x="40" y="356" font-size="21" fill="#222">    Risikosituation an.</text><text x="40" y="414" font-size="16" fill="#6b7a8c">FranksFinanzcheck · Zusammenfassung des Beitrags</text></svg>