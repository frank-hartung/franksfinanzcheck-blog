<svg xmlns="http://www.w3.org/2000/svg" width="800" height="374" viewBox="0 0 800 374" role="img" aria-label="Merkkarte: DSL-Tarif für dein Zuhause: Das passende Angebot finden"><rect width="100%" height="100%" fill="#f6f9fc"/><text x="40" y="66" font-size="26" font-weight="700" fill="#1f3a5f">Auf einen Blick</text><line x1="40" y1="90" x2="760" y2="90" stroke="#d7e0ea" stroke-width="2"/><text x="40" y="140" font-size="21" fill="#222">•  Den passenden DSL-Tarif findest du über deinen echten Bedarf,</text><text x="40" y="172" font-size="21" fill="#222">    nicht über die größte Werbezahl.</text><text x="40" y="216" font-size="21" fill="#222">•  Für 1 bis 2 Personen reichen oft 50 bis 100 Mbit/s.</text><text x="40" y="260" font-size="21" fill="#222">•  Familien und Homeoffice-Haushalte fahren meist mit 100 bis 250</text><text x="40" y="292" font-size="21" fill="#222">    Mbit/s gut.</text><text x="40" y="350" font-size="16" fill="#6b7a8c">FranksFinanzcheck · Zusammenfassung des Beitrags</text></svg>