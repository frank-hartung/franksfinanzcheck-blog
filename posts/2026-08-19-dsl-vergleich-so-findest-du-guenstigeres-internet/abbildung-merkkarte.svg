<svg xmlns="http://www.w3.org/2000/svg" width="800" height="406" viewBox="0 0 800 406" role="img" aria-label="Merkkarte: DSL-Vergleich: So findest du den günstigsten Internettarif"><rect width="100%" height="100%" fill="#f6f9fc"/><text x="40" y="66" font-size="26" font-weight="700" fill="#1f3a5f">Auf einen Blick</text><line x1="40" y1="90" x2="760" y2="90" stroke="#d7e0ea" stroke-width="2"/><text x="40" y="140" font-size="21" fill="#222">•  Vergleiche dieselbe Bandbreite am selben Anschluss.</text><text x="40" y="184" font-size="21" fill="#222">•  Addiere über die gewünschte Laufzeit alle Grundpreise,</text><text x="40" y="216" font-size="21" fill="#222">    Anschluss- und Routerkosten und ziehe nur tatsächlich nutzbare</text><text x="40" y="248" font-size="21" fill="#222">    Gutschriften ab.</text><text x="40" y="292" font-size="21" fill="#222">•  Die Differenz hängt vom alten Vertrag und dem konkreten</text><text x="40" y="324" font-size="21" fill="#222">    Angebot ab.</text><text x="40" y="382" font-size="16" fill="#6b7a8c">FranksFinanzcheck · Zusammenfassung des Beitrags</text></svg>