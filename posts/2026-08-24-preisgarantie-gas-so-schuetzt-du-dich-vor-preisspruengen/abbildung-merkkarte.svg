<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-label="Merkkarte: Preisgarantie Gas: Was du jetzt tun kannst – Gaspreissprünge"><rect width="100%" height="100%" fill="#f6f9fc"/><text x="40" y="66" font-size="26" font-weight="700" fill="#1f3a5f">Auf einen Blick</text><line x1="40" y1="90" x2="760" y2="90" stroke="#d7e0ea" stroke-width="2"/><text x="40" y="140" font-size="21" fill="#222">•  Eine Gaspreisgarantie dämpft Preissprünge nur bei den</text><text x="40" y="172" font-size="21" fill="#222">    vertraglich geschützten Bestandteilen.</text><text x="40" y="216" font-size="21" fill="#222">•  Erhöht der Anbieter trotzdem den Preis, vergleichst du</text><text x="40" y="248" font-size="21" fill="#222">    Änderungsgrund und Klausel, notierst das Wirksamkeitsdatum und</text><text x="40" y="280" font-size="21" fill="#222">    prüfst dein Sonderkündigungsrecht.</text><text x="40" y="324" font-size="21" fill="#222">•  Reagiere auf dein konkretes Schreiben – nicht auf kurzfristige</text><text x="40" y="356" font-size="21" fill="#222">    Börsenmeldungen, die nicht eins zu eins im Endkundenpreis</text><text x="40" y="388" font-size="21" fill="#222">    landen.</text><text x="40" y="446" font-size="16" fill="#6b7a8c">FranksFinanzcheck · Zusammenfassung des Beitrags</text></svg>