<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-label="Merkkarte: 50-30-20-Regel: Beherrsche dein Budget – Fixkosten senken"><rect width="100%" height="100%" fill="#f6f9fc"/><text x="40" y="66" font-size="26" font-weight="700" fill="#1f3a5f">Auf einen Blick</text><line x1="40" y1="90" x2="760" y2="90" stroke="#d7e0ea" stroke-width="2"/><text x="40" y="140" font-size="21" fill="#222">•  Die 50-30-20-Regel teilt dein Nettoeinkommen in drei Blöcke:</text><text x="40" y="172" font-size="21" fill="#222">    50 % für notwendige Ausgaben, 30 % für Wünsche und 20 % für</text><text x="40" y="204" font-size="21" fill="#222">    Sparen oder Schuldenabbau.</text><text x="40" y="248" font-size="21" fill="#222">•  Die Methode funktioniert besonders gut, wenn du den Sparanteil</text><text x="40" y="280" font-size="21" fill="#222">    direkt nach Gehaltseingang automatisierst und deinen</text><text x="40" y="312" font-size="21" fill="#222">    Fixkostenblock regelmäßig prüfst.</text><text x="40" y="356" font-size="21" fill="#222">•  Schon bei 2.800 € netto entstehen so 560 € pro Monat für</text><text x="40" y="388" font-size="21" fill="#222">    Rücklagen und Vermögensaufbau.</text><text x="40" y="446" font-size="16" fill="#6b7a8c">FranksFinanzcheck · Zusammenfassung des Beitrags</text></svg>