<svg xmlns="http://www.w3.org/2000/svg" width="800" height="406" viewBox="0 0 800 406" role="img" aria-label="Merkkarte: Last Minute Urlaub: So findest du echte Reiseschnäppchen"><rect width="100%" height="100%" fill="#f6f9fc"/><text x="40" y="66" font-size="26" font-weight="700" fill="#1f3a5f">Auf einen Blick</text><line x1="40" y1="90" x2="760" y2="90" stroke="#d7e0ea" stroke-width="2"/><text x="40" y="140" font-size="21" fill="#222">•  Last-Minute-Angebote können günstiger sein, sind aber keine</text><text x="40" y="172" font-size="21" fill="#222">    Spargarantie.</text><text x="40" y="216" font-size="21" fill="#222">•  Wer bei Reiseziel, Abflugort und Reisezeit flexibel bleibt,</text><text x="40" y="248" font-size="21" fill="#222">    kann mehr Angebote vergleichen.</text><text x="40" y="292" font-size="21" fill="#222">•  Entscheidend ist der Gesamtpreis inklusive Gepäck, Transfers,</text><text x="40" y="324" font-size="21" fill="#222">    Unterkunft und Zusatzkosten – nicht der Rabatt-Aufdruck.</text><text x="40" y="382" font-size="16" fill="#6b7a8c">FranksFinanzcheck · Zusammenfassung des Beitrags</text></svg>