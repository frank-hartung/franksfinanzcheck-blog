<svg xmlns="http://www.w3.org/2000/svg" width="800" height="374" viewBox="0 0 800 374" role="img" aria-label="Merkkarte: Tagesgeld vergleichen: Was bleibt nach dem Aktionszins?"><rect width="100%" height="100%" fill="#f6f9fc"/><text x="40" y="66" font-size="26" font-weight="700" fill="#1f3a5f">Auf einen Blick</text><line x1="40" y1="90" x2="760" y2="90" stroke="#d7e0ea" stroke-width="2"/><text x="40" y="140" font-size="21" fill="#222">•  Vergleiche die Zinsen für deinen Anlagebetrag und deine</text><text x="40" y="172" font-size="21" fill="#222">    Anlagedauer.</text><text x="40" y="216" font-size="21" fill="#222">•  Gilt ein höherer Satz nur für einige Monate, rechne den Rest</text><text x="40" y="248" font-size="21" fill="#222">    mit dem Anschlusszins.</text><text x="40" y="292" font-size="21" fill="#222">•  Prüfe außerdem, welche Bank die Einlagen hält.</text><text x="40" y="350" font-size="16" fill="#6b7a8c">FranksFinanzcheck · Zusammenfassung des Beitrags</text></svg>