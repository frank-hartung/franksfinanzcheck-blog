<svg xmlns="http://www.w3.org/2000/svg" width="800" height="438" viewBox="0 0 800 438" role="img" aria-label="Merkkarte: DSL-Wechselbonus sichern: So sparst du beim Internetvertrag"><rect width="100%" height="100%" fill="#f6f9fc"/><text x="40" y="66" font-size="26" font-weight="700" fill="#1f3a5f">Auf einen Blick</text><line x1="40" y1="90" x2="760" y2="90" stroke="#d7e0ea" stroke-width="2"/><text x="40" y="140" font-size="21" fill="#222">•  Ein DSL-Wechselbonus ist nur dann wirklich attraktiv, wenn du</text><text x="40" y="172" font-size="21" fill="#222">    ihn zusammen mit Grundgebühr, Anschlusskosten und Laufzeit</text><text x="40" y="204" font-size="21" fill="#222">    rechnest.</text><text x="40" y="248" font-size="21" fill="#222">•  Gute Angebote drücken den Effektivpreis über 24 Monate spürbar</text><text x="40" y="280" font-size="21" fill="#222">    – oft um 10 € bis 20 € pro Monat.</text><text x="40" y="324" font-size="21" fill="#222">•  Wer nur auf den Bonus schaut, tappt schnell in die</text><text x="40" y="356" font-size="21" fill="#222">    Rabattfalle.</text><text x="40" y="414" font-size="16" fill="#6b7a8c">FranksFinanzcheck · Zusammenfassung des Beitrags</text></svg>