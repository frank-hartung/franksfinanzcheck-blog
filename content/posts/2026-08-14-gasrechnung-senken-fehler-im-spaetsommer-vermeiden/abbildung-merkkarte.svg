<svg xmlns="http://www.w3.org/2000/svg" width="800" height="502" viewBox="0 0 800 502" role="img" aria-label="Merkkarte: Gasrechnung senken: Fehler im Spätsommer vermeiden"><rect width="100%" height="100%" fill="#f6f9fc"/><text x="40" y="66" font-size="26" font-weight="700" fill="#1f3a5f">Auf einen Blick</text><line x1="40" y1="90" x2="760" y2="90" stroke="#d7e0ea" stroke-width="2"/><text x="40" y="140" font-size="21" fill="#222">•  Die teuersten Spätsommer-Fehler sind ein ungeprüfter Tarif,</text><text x="40" y="172" font-size="21" fill="#222">    ein unrealistischer Abschlag, fehlende Zählerstände, ein</text><text x="40" y="204" font-size="21" fill="#222">    aufgeschobener Heizungs-Check und pauschale Technik-</text><text x="40" y="236" font-size="21" fill="#222">    Einstellungen.</text><text x="40" y="280" font-size="21" fill="#222">•  Prüfe Arbeitspreis, Grundpreis und Vorjahresverbrauch</text><text x="40" y="312" font-size="21" fill="#222">    getrennt.</text><text x="40" y="356" font-size="21" fill="#222">•  Entlüfte nur bei Bedarf; wiederkehrender Druckverlust,</text><text x="40" y="388" font-size="21" fill="#222">    Störungen und Arbeiten am Wärmeerzeuger gehören zum</text><text x="40" y="420" font-size="21" fill="#222">    Fachbetrieb.</text><text x="40" y="478" font-size="16" fill="#6b7a8c">FranksFinanzcheck · Zusammenfassung des Beitrags</text></svg>