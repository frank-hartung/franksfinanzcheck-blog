<svg xmlns="http://www.w3.org/2000/svg" width="800" height="374" viewBox="0 0 800 374" role="img" aria-label="Merkkarte: DNS-Server wechseln: Datenschutz, Filter und Einrichtung"><rect width="100%" height="100%" fill="#f6f9fc"/><text x="40" y="66" font-size="26" font-weight="700" fill="#1f3a5f">Auf einen Blick</text><line x1="40" y1="90" x2="760" y2="90" stroke="#d7e0ea" stroke-width="2"/><text x="40" y="140" font-size="21" fill="#222">•  Ein DNS-Server übersetzt Domainnamen in IP-Adressen.</text><text x="40" y="184" font-size="21" fill="#222">•  Ein Wechsel ändert vor allem, welcher Resolver deine Anfragen</text><text x="40" y="216" font-size="21" fill="#222">    erhält.</text><text x="40" y="260" font-size="21" fill="#222">•  Er erhöht nicht die Bandbreite und verschlüsselt DNS nicht</text><text x="40" y="292" font-size="21" fill="#222">    automatisch.</text><text x="40" y="350" font-size="16" fill="#6b7a8c">FranksFinanzcheck · Zusammenfassung des Beitrags</text></svg>