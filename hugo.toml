# ============================================================
#  Hugo-Konfiguration – CHECK24 Affiliate-Blog
#  WICHTIG: baseURL später durch deine echte Domain ersetzen!
# ============================================================

baseURL = "https://franksfinanzcheck.de/"          # <-- HIER deine Domain eintragen
title = "FranksFinanzcheck"                       # <-- HIER deinen Blog-Namen eintragen
theme = "PaperMod"
locale = "de-DE"
defaultContentLanguage = "de"
enableRobotsTXT = true                         # erzeugt robots.txt automatisch
enableEmoji = true
paginate = 10
copyright = "© 2026 FranksFinanzcheck – Alle Rechte vorbehalten"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = "production"
  title = "FranksFinanzcheck"                      # <-- Blog-Name (erscheint im Browser-Tab)
  description = "Geld sparen & Frugalismus: Praxistipps zu Budgetplanung, Strom- & Gastarifen, DSL, Versicherungen und Reisen – so sparst du monatlich bares Geld."
  keywords = ["Geld sparen", "Frugalismus", "Budgetplanung", "Stromvergleich", "Gasvergleich", "DSL vergleichen", "Kfz-Versicherung", "Sparen"]
  author = "Frank"                          # <-- Name des Autors/Betreibers
  DateFormat = "2. January 2006"
  defaultTheme = "auto"
  disableThemeToggle = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowToc = true
  comments = false
  mainSections = ["posts"]
  # Pflicht-Hinweis für Affiliate-Links (erscheint unter jedem Artikel)
  disclaimer = "Hinweis: Dieser Blog enthält Affiliate-Links (Werbung). Wenn du über einen Link etwas bei CHECK24 buchst oder abschließt, erhalten wir eine Provision – für dich entstehen keine Mehrkosten. Unsere Empfehlungen bleiben davon unabhängig."

  [params.homeInfoParams]
    Title = "Willkommen bei FranksFinanzcheck 👋"
    Content = "Geld sparen ohne Verzicht: Frugalismus-Tricks, Budgetplanung und clevere Vergleichstipps zu Strom, Gas, DSL, Versicherungen und Reisen. Die Artikel erscheinen laufend neu – schau bald wieder vorbei! Alle Tipps gibt es auch als Infografiken auf [Pinterest](https://www.pinterest.de/franksfinanzcheck/) – folge mir, um nichts zu verpassen! 📌"

  [[params.socialIcons]]
    name = "pinterest"
    url = "https://www.pinterest.de/franksfinanzcheck/"
    title = "FranksFinanzcheck auf Pinterest"

[menu]
[[menu.main]]
    identifier = "home"
    name = "Start"
    url = "/"
    weight = 1
[[menu.main]]
    identifier = "posts"
    name = "Blog"
    url = "/posts/"
    weight = 2
[[menu.main]]
    identifier = "impressum"
    name = "Impressum"
    url = "/impressum/"
    weight = 3
[[menu.main]]
    identifier = "datenschutz"
    name = "Datenschutz"
    url = "/datenschutz/"
    weight = 4

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5
