baseURL = "https://franksfinanzcheck.de/"
title = "FranksFinanzcheck"
theme = "PaperMod"
# PREM-AUDIT 26.08.2026: languageCode ist seit Hugo 0.158 deprecated
# (Build-Warnung bei jedem Deploy) – `locale` (unten) ist der Nachfolger.

# RSS (Entscheidung 20.08.2026: für Pinterest-Auto-Publish wieder aktiviert).
# Nur der HOME-Feed wird erzeugt (/index.xml); Sektions-Feeds bleiben aus.
# Das Layout layouts/rss.xml ist Pinterest-optimiert (Cover + Pin-Description).

# Keine automatische Titel-Umwandlung (Title-Case) durch Hugo:
# Taxonomie-Terme (Tags/Kategorien) werden EXAKT wie im Frontmatter
# angezeigt – verhindert "Haushaltsbuch Führen" statt "Haushaltsbuch führen".
titleCaseStyle = "none"
locale = "de-DE"
defaultContentLanguage = "de"
enableRobotsTXT = true
enableEmoji = true
# Harte Publikations-Gates: Entwürfe, Zukunftsdaten und abgelaufene Seiten
# NIEMALS bauen. (hugo.yaml mit buildDrafts:true war eine Landmine und ist entfernt.)
buildDrafts = false
buildFuture = false
buildExpired = false
[pagination]
pagerSize = 8
# INDEX-HYGIENE 29.09.2026 (Befund: 237 nicht indexierte Seiten in der GSC).
# Hugo legt für JEDE paginierte Liste zusätzlich eine Seite `…/page/1/` an, die
# per Meta-Refresh auf die Listenseite selbst weiterleitet. Bei 147 Tag-Archiven,
# 4 Kategorien und 3 Sektionen waren das 154 reine Weiterleitungs-URLs – von
# Google gecrawlt und in der Search Console als „Seite mit Weiterleitung" unter
# „nicht indexiert" gezählt. Verlinkt wird `/page/1/` nirgends: der Paginator
# zeigt für Seite 1 immer auf die Basis-URL. Die Aliase waren also reiner
# Crawl-Müll ohne jeden Nutzen.
# `disableAliases` schaltet genau diese Automatik ab – die echten Pager-Seiten
# (/page/2/, /page/3/ …) bleiben unverändert erhalten und weiter noindex,follow.
# Wache: scripts/index_hygiene_gate.py (H2).
disableAliases = true
copyright = "© 2026 FranksFinanzcheck – Alle Rechte vorbehalten"

# Service Worker (sw.js) als eigenes Output-Format am Seiten-Root rendern.
# Die Cache-Version wird aus HUGO_JSDELIVR_SHA abgeleitet → nach jedem
# Deploy neue Cache-Generation, alte Caches werden automatisch gelöscht.
[mediaTypes]
  [mediaTypes."application/javascript"]
    suffixes = ["js"]
    delimiter = ""

[outputFormats.SWJS]
  mediaType = "application/javascript"
  baseName = "sw"
  isPlainText = true

[outputs]
  home = ["HTML", "RSS", "SWJS"]  # RSS = Pinterest-Feed unter /index.xml
  section = ["HTML"]              # keine Sektions-Feeds (nur der Home-Feed)
  page = ["HTML"]
  # PREMIUM-AUDIT 11.09.2026: Taxonomie-Archive bekamen je einen eigenen
  # RSS-Feed – 116 zusätzliche Feeds (1 pro Tag), jeder mit ein und demselben
  # Artikel. Das ist Crawl-Rauschen (Google sieht Duplikat-Feeds), kostet
  # Build-Zeit und widerspricht der Entscheidung „nur der Home-Feed".
  #
  # STAND 29.09.2026: Diese beiden Zeilen laufen inzwischen INS LEERE – der
  # [taxonomies]-Block weiter unten ist leer, es gibt also weder Taxonomie-
  # noch Term-Seiten. Sie bleiben trotzdem stehen: Wer die Archive je
  # zurückholt (dort beschrieben), soll nicht versehentlich wieder 100+
  # Tag-Feeds miterzeugen. Die frühere Zusatzbemerkung „Tag-/Kategorieseiten
  # bleiben erhalten (interne Verlinkung)" ist damit überholt und entfernt:
  # die Themen-Navigation läuft über themenwelt_chips.html auf die
  # indexierbaren Pillar-Ratgeber.
  taxonomy = ["HTML"]
  term = ["HTML"]

# RSS-Feed: letzte 50 Artikel (deckt alle Publikationen ab;
# Pinterest pinnt beim ersten Verbinden die vorhandenen Artikel einmalig)
[services]
  [services.rss]
    limit = 50

# ============================================================
#  SICHERHEIT DES BAUS (Sicherheitsaudit 15.10.2026, F-06)
#  ------------------------------------------------------------
#  Warum das hier steht: `unsafe = true` unten lässt rohes HTML aus Markdown
#  unverändert durch (nötig für die <div>-Blöcke im Bestand). Damit ist jedes
#  Skript-Tag in einer Inhaltsdatei auch im gebauten HTML – gefährlich, weil
#  Content in diesem Repo automatisch entsteht (Voice-Memo → Draft, KI-
#  Redaktion, Bots) und die Meta-CSP der Seite kein `script-src` kennt.
#  Diese vier Schalter verkleinern das Fenster auf der Bau-Ebene:
#    · enableInlineShortcodes = false  – keine Kurzcodes IN Inhaltsdateien,
#      die beliebigen Code ausführen (Default ist false; hier festgenagelt).
#    · security.exec.allow/osEnv   – nur die erwarteten Programme (Sass,
#      PostCSS, npx) und nur die Umgebungsvariablen, die der Bau wirklich
#      braucht. Ein manipuliertes Template kann damit nicht mehr beliebige
#      Prozesse oder Umgebungswerte anziehen.
#    · security.http               – der Bau darf NICHTS Fremdes nachladen
#      (es gibt heute keinen einzigen Remote-Abruf; ein späterer wäre ein
#      bewusster Eintrag hier statt einer stillen Hintertür).
#    · security.funcs.getenv       – nur HUGO_-Variablen sind im Template
#      sichtbar (asset_url.html nutzt HUGO_JSDELIVR_SHA).
#  Die Gegenprobe auf der Auslieferungsebene macht scripts/blog_header_gate.py
#  (Security-Header + CSP), die Quelle prüft scripts/content_html_wache.py
#  (kein <script>/onerror/javascript: in content/).
#  Wachen-Doku: docs/SICHERHEIT-BETRIEB-RUNBOOK.md
# ============================================================
[security]
  enableInlineShortcodes = false
  [security.exec]
    # Die Hugo-Standardliste, hier ausgeschrieben statt unsichtbar: Nur diese
    # Programme darf ein Template starten. Bewusst NICHT erweitert – was der
    # Bau zusätzlich bräuchte, wäre ein bewusster, begründeter Eintrag.
    allow = ['^dart-sass-embedded$', '^go$', '^npx$', '^postcss$', '^babel$']
  [security.funcs]
    # Nur HUGO_-Variablen sind im Template sichtbar (asset_url.html nutzt
    # HUGO_JSDELIVR_SHA). Alles andere – Tokens, Kontodaten, Laufzeitpfade –
    # bleibt dem Bau verborgen.
    getenv = ['^HUGO_', '^CI$']
  [security.http]
    methods = ['(?i)GET|POST']
    # Der Bau lädt NICHTS Fremdes nach. Es gibt heute keinen einzigen
    # Remote-Abruf; ein späterer muss hier bewusst mit Begründung stehen
    # (der Bau bricht sonst laut ab – fail closed statt stiller Fremdladung).
    urls = ['^https://([a-z0-9-]+\.)?franksfinanzcheck\.de/.*']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # BEGRÜNDUNG (F-06): Roh-HTML ist im Bestand produktiv (Tabellen- und
      # Kachel-Blöcke in content/**). Der Ersatz wäre eine Tag-Allowlist
      # (markup.goldmark.renderer.tagWhitelist) – die verträgt der Bestand
      # noch nicht. Deshalb: unsafe bleibt, aber die Quelle wird bewacht
      # (scripts/content_html_wache.py, fail-closed mit Selbsttest) und die
      # Auslieferung bekommt eine echte CSP mit script-src über Cloudflare.
      unsafe = true

[params]
  env = "production"

  # ---------------------------------------------------------------
  # DESIGN-VARIANTE (Design-Varianten-Werkbank, Runbook:
  # docs/ANLEITUNG-DESIGN-VARIANTEN.md)
  #
  # Leer = Basis. Ein Wert schaltet das zugehörige Stylesheet aus
  # assets/css/varianten/ scharf – aber nur, wenn er im Register
  # data/design/varianten.yaml steht, dort `aktiv:` denselben Wert
  # nennt, der Status `live` ist und eine menschliche Freigabe mit
  # gültigem Messprotokoll vorliegt. Geprüft wird das fail-closed von
  #   python3 scripts/design_variant_gate.py --produktionswache
  # im Deploy, VOR dem Build.
  #
  # Seit 03.10.2026 läuft bewusst die kanonische Basis: Die tragfähige
  # Hero-Hierarchie und das FF Kostenprofil liegen dauerhaft in der
  # Markenebene, nicht mehr in einer Produktionsvariante. Historische
  # Entwürfe und Messungen bleiben im Varianten-Register nachvollziehbar.
  # Eine neue Variante darf hier nur nach dem dokumentierten Mess- und
  # Freigabeprozess eingetragen werden.
  # ---------------------------------------------------------------
  designVariante = ""
  title = "FranksFinanzcheck"
  description = "Das Fixkosten-Cockpit für deutsche Haushalte: Verträge, Fristen und laufende Kosten nachvollziehbar prüfen – unabhängig und mit klarer Rechnung."
  # ENTITY-REGISTER (25.10.2026): der eine, wortgleiche Identitätssatz der
  # Marke + die Abgrenzung zu FINANZCHECK.de. Vertrag: data/entity.yaml –
  # diese beiden Werte MÜSSEN dort (`definition` / `abgrenzung`) identisch
  # stehen; gerendert wird von hier (Startseiten-Entity-Box, Schema.org
  # Organization.description). Wortlaut-Änderung = beide Dateien + /ueber/,
  # /impressum/, /presse/, llms.txt-Generator nachziehen; die Wache
  # scripts/entity_marken_gate.py schlägt sonst fail-closed an.
  # `description` darüber bleibt unverändert (data/brand_lock.yaml).
  entityDefinition = "FranksFinanzcheck (franksfinanzcheck.de) ist das unabhängige Fixkosten-Cockpit für deutsche Haushalte: ein redaktioneller Ratgeber von Frank Hartung, der Verträge, Fristen und laufende Kosten mit nachvollziehbarer Rechnung ordnet – kein Bankportal, kein Kreditvergleichsportal und keine Versicherungsmakler."
  entityAbgrenzung = "FranksFinanzcheck steht in keiner geschäftlichen oder gesellschaftsrechtlichen Verbindung zum Kreditvergleichsportal FINANZCHECK.de. Trotz der ähnlich klingenden Namen handelt es sich um unterschiedliche, voneinander unabhängige Anbieter. Auf franksfinanzcheck.de werden Kredite, Konten und Versicherungen nicht selbst angeboten; ein Vertrag kommt – wenn du einem gekennzeichneten Partnerlink folgst – ausschließlich mit dem dort genannten Anbieter zustande."
  keywords = ["Fixkosten-Cockpit", "Fixkosten senken", "Geld sparen", "Budgetplanung", "Stromvergleich", "Gasvergleich", "DSL vergleichen", "Versicherungen", "Kündigungsfrist"]
  author = "Frank Hartung"
  contactEmail = "kontakt@franksfinanzcheck.de"
  # SITE-WEITES Social-Fallback-Bild (Premium-Audit 11.09.2026).
  # Startseite, /ueber/ und die Rechtsseiten haben kein Cover – damit fiel
  # auf der meistgeteilten URL (Home) og:image UND twitter:image komplett weg:
  # Pinterest, Facebook und LinkedIn zeigten nur einen Text-Kasten. Hugo nutzt
  # site.Params.images automatisch als Fallback in _funcs/get-page-images; das
  # Bild entsteht wie die Artikelfcover durch scripts/generate_covers.py
  # (2:3, 1000x1500, gleiche Marke) und wird von der Wache eingefordert (S5).
  images = ["images/covers/og-default-1200x630.jpg", "images/covers/brand-franksfinanzcheck.jpg"]
  # Alt-Text des Site-Fallback-Bildes (og:image:alt) – konkret, nicht generisch.
  ogImageAlt = "FranksFinanzcheck: Fixkosten-Cockpit für Verträge, Fristen und laufende Kosten"
  DateFormat = "02.01.2006"
  defaultTheme = "auto"
  disableThemeToggle = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowToc = true
  # 26.09.2026 (Frank): Das Inhaltsverzeichnis im Artikel steht offen –
  # vollständig sichtbar statt hinter einem zusätzlichen Klick.
  TocOpen = true
  comments = false
  mainSections = ["posts"]
  # Pinterest-Website-Verifikation (wird nach Erhalt des Codes befüllt)
  pinterestVerify = "e238ffd88bd085648a14bd1d52d72405"
  mastodonUrl    = "https://mastodon.social/@FranksFinanzcheck"
  mastodonUser   = "@FranksFinanzcheck@mastodon.social"
  # Newsletter (12.09.2026, seit 24.09.2026 Eigenbetrieb): der Anmeldeweg der
  # Site liegt in layouts/shortcodes/newsletter_form.html, die Landingpage in
  # content/newsletter/. Zwei Wege, beide erlaubt – der Shortcode entscheidet
  # nach dieser Reihenfolge:
  #   newsletterFormAction  echtes Inline-Formular (POST, Feld `email`) an den
  #                       eigenen Capture-Worker (abos.franksfinanzcheck.de)
  #   newsletterFormUrl     Button zu einem externen Anmeldeformular (leer = unsichtbar)
  # Beides leer = kein Capture: der Footer-CTA verschwindet, die Landingpage zeigt
  # den Leerzustand, und scripts/newsletter_digest.py --check meldet laut „nicht
  # geschaltet" (damit „keine Anmeldung" nie mit „Alles in Ordnung" verwechselt wird).
  newsletterFormUrl = ""
  newsletterFormAction = "https://abos.franksfinanzcheck.de/anmeldung"
  newsletterPromise = "Zweimal pro Woche: Spartipps und Rechner – dienstags und freitags."
  # BOT-SCHUTZ DES ANMELDEFORMULARS (Sicherheitsaudit 15.10.2026, F-02).
  # Empfehlung: Cloudflare Turnstile – kostenlos, kein Cookie, keine
  # Nutzerverfolgung (nur „Managed Challenge"); Datenschutzhinweise Abschnitt
  # „Newsletter" nennen den Dienst.
  #   turnstileSiteKey   öffentlicher Site-Key aus dem Cloudflare-Dashboard
  #                      (Turnstile -> Website hinzufügen -> Domain
  #                      franksfinanzcheck.de). Ist er gesetzt, liefert der
  #                      Shortcode das Widget aus und ff-newsletter.js schickt
  #                      das Token als `cf-turnstile-response` mit.
  # Beide Werte gehören zusammen (Paar-Vertrag 19.10.2026, WF-E813 / #809):
  # dieser Site-Key UND das Secret TURNSTILE_SECRET im Newsletter-Worker –
  # der Site-Key wird zusätzlich als Variable TURNSTILE_SITEKEY in
  # newsletter-worker/wrangler.toml gespiegelt (Wache prüft den Spiegel).
  # Erst wenn BEIDE gesetzt sind, liefert das Formular das Widget aus und
  # der Worker prüft fail-closed. Der halbgesetzte Zustand „nur Secret“ war
  # der Anmelde-Ausfall vom 15.10.2026: jede Anmeldung scheiterte an einer
  # Sicherheitsprüfung ohne Widget. Seitdem heißt er „wartet“ – die
  # Anmeldung läuft weiter, und die Wache
  # scripts/worker_betrieb_wache.py meldet den Zustand täglich laut
  # (Live-Job der Sicherheits-Wache), bis das Paar komplett ist – siehe
  # docs/SICHERHEIT-BETRIEB-RUNBOOK.md, Schritt A3.
  turnstileSiteKey = ""
  bingVerify = "5079875E367065FE09E09FC61BC077C6"
  disclaimer = "Hinweis: Dieser Blog enthält Affiliate-Links (Werbung). Wenn du über einen solchen Link bei einem unserer Partner (z. B. CHECK24 oder TARIFCHECK24) etwas buchst oder abschließt, erhalten wir eine Provision – für dich entstehen keine Mehrkosten. Unsere Empfehlungen bleiben davon unabhängig."

  # Der statische Willkommenstext (`homeInfoParams`) wurde am 27.09.2026
  # vollständig entfernt. Die einzige Startseiten-H1 und ihr GEO-Lead kommen
  # saisonal aus data/saisons.yaml; Rendering: layouts/_partials/home_info.html.
  # Dadurch ersetzt der Saisonwechsel Inhalt, ohne diese kritische Konfiguration
  # oder das Premium-Layout anzufassen.

  [[params.socialIcons]]
    name = "pinterest"
    url = "https://www.pinterest.de/franksfinanzcheck/"
    title = "FranksFinanzcheck auf Pinterest"

  [[params.socialIcons]]
    name = "mastodon"
    url = "https://mastodon.social/@FranksFinanzcheck"
    title = "FranksFinanzcheck auf Mastodon"

  # Cookielose Analytics-Vorbereitung (Umami, self-hosted auf
  # stats.franksfinanzcheck.de). Ergänzung: Website-ID nach Bereitstellung
  # der Umami-Instanz. Ohne website-Parameter wird das Tracking nicht
  # geladen (kein Wirkung ohne Konfiguration). Siehe layouts/_partials/umami.html
  # und cloudflare/edge-schutz.md (A4) für die CSP-Anpassung.
  [params.analytics.umami]
    # website = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"   # Pflicht, nach Umami-Install
    domain = "stats.franksfinanzcheck.de"                  # Self-Host-URL

  # Cloudflare Web Analytics (kostenlose Alternative zu Umami)
  # Kein eigenes Hosting, kein Server, kein API-Zugang, kein Consent-Popup.
  # Aktivierung: Cloudflare Dashboard → Analytics → Web Analytics →
  #              Website hinzufügen → Website-ID + Token notieren →
  #              hier einfügen. KOSTENLOS (Cloudflare-eigen).
  # Quelle: https://developers.cloudflare.com/analytics/
  [params.analytics.cloudflare]
    # website = "your-website-id-uuid"   # Website-ID aus Cloudflare Dashboard
    # token   = "your-beacon-token"     # Beacon-Token aus Cloudflare Dashboard
    domain = "franksfinanzcheck.de"

