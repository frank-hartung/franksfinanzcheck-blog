baseURL = "https://frank-hartung.github.io/franksfinanzcheck-blog/"
title = "FranksFinanzcheck"
theme = "PaperMod"
locale = "de-DE"
defaultContentLanguage = "de"
enableRobotsTXT = true
enableEmoji = true
[pagination]
pagerSize = 8
copyright = "© 2026 FranksFinanzcheck – Alle Rechte vorbehalten"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = "production"
  title = "FranksFinanzcheck"
  description = "Geld sparen & Frugalismus: Praxistipps zu Budgetplanung, Strom- & Gastarifen, DSL, Versicherungen und Reisen – so sparst du monatlich bares Geld."
  keywords = ["Geld sparen", "Frugalismus", "Budgetplanung", "Stromvergleich", "Gasvergleich", "DSL vergleichen", "Kfz-Versicherung", "Sparen"]
  author = "Frank Hartung"
  DateFormat = "2. January 2006"
  defaultTheme = "auto"
  disableThemeToggle = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowToc = true
  comments = false
  mainSections = ["posts"]
  # Pinterest-Website-Verifikation (wird nach Erhalt des Codes befüllt)
  pinterestVerify = "e238ffd88bd085648a14bd1d52d72405"
  bingVerify = "DD6ABFE13474B50A9739BBB46E542368"
  disclaimer = "Hinweis: Dieser Blog enthält Affiliate-Links (Werbung). Wenn du über einen Link etwas bei CHECK24 buchst oder abschließt, erhalten wir eine Provision – für dich entstehen keine Mehrkosten. Unsere Empfehlungen bleiben davon unabhängig."

  [params.homeInfoParams]
    Title = "Willkommen bei FranksFinanzcheck 👋"
    Content = "Geld sparen ohne Verzicht: Frugalismus-Tricks, Budgetplanung und clevere Vergleichstipps zu Strom, Gas, DSL, Versicherungen und Reisen. Die Artikel erscheinen laufend neu – schau bald wieder vorbei!"

  [[params.socialIcons]]
    name = "pinterest"
    url = "https://www.pinterest.de/franksfinanzcheck/"
    title = "FranksFinanzcheck auf Pinterest"

[menu]
[[menu.main]]
    identifier = "home"
    name = "Start"
    url = "/"
    weight = 1
[[menu.main]]
    identifier = "posts"
    name = "Blog"
    url = "/posts/"
    weight = 2
[[menu.main]]
    identifier = "ueber"
    name = "Über mich"
    url = "/ueber/"
    weight = 3
[[menu.main]]
    identifier = "impressum"
    name = "Impressum"
    url = "/impressum/"
    weight = 4
[[menu.main]]
    identifier = "datenschutz"
    name = "Datenschutz"
    url = "/datenschutz/"
    weight = 5

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[related]
  threshold = 60
  includeNewer = true
  [[related.indices]]
    name = "keywords"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "categories"
    weight = 60
  [[related.indices]]
    name = "date"
    weight = 10
    pattern = "2006"

# Cover-Bilder: keine serverseitige Bildverarbeitung (Responsive-Srcset) –
# stattdessen direkte Datei-URLs. Ermöglicht die Auslieferung über das
# jsDelivr-CDN (Cache: 1 Jahr + immutable) statt GitHub Pages (max-age=600).
[cover]
  responsiveImages = false

# Privacy-freundliches Analytics (Umami – cookieless, DSGVO-konform)
# websiteId leer = Analytics deaktiviert. ID + ggf. src/hostUrl eintragen
# (siehe ANLEITUNG-UMAMI-ANALYTICS.md).
[params.umami]
  websiteId = ""                        # ← Umami-Website-ID hier eintragen
  src = "https://cloud.umami.is/script.js"  # Cloud; self-hosted: eigene URL (z. B. https://umami.example.com/script.js)
  hostUrl = ""                          # self-hosted: https://umami.example.com (sonst leer)
  consentRequired = true                # true: lädt nur nach "Alle akzeptieren" (streng); false: cookieless ohne Einwilligung (DNT wird respektiert)
