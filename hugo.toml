# ============================================================
#  Hugo-Konfiguration – CHECK24 Affiliate-Blog
#  WICHTIG: baseURL später durch deine echte Domain ersetzen!
# ============================================================

baseURL = "https://DEINE-DOMAIN.DE/"          # <-- HIER deine Domain eintragen
title = "SparRatgeber24"                       # <-- HIER deinen Blog-Namen eintragen
theme = "PaperMod"
locale = "de-DE"
defaultContentLanguage = "de"
enableRobotsTXT = true                         # erzeugt robots.txt automatisch
enableEmoji = true
paginate = 10
copyright = "© 2026 SparRatgeber24 – Alle Rechte vorbehalten"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = "production"
  title = "SparRatgeber24"                      # <-- Blog-Name (erscheint im Browser-Tab)
  description = "Unabhängige Ratgeber und Vergleichstipps zu Strom, Gas, DSL, Versicherungen und Reisen – so sparst du garantiert Geld."
  keywords = ["Stromvergleich", "Gasvergleich", "Handytarife", "Kfz-Versicherung", "CHECK24", "Sparen", "Tarife vergleichen"]
  author = "Redaktion"                          # <-- Name des Autors/Betreibers
  DateFormat = "2. January 2006"
  defaultTheme = "auto"
  disableThemeToggle = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowToc = true
  comments = false
  mainSections = ["posts"]
  # Pflicht-Hinweis für Affiliate-Links (erscheint unter jedem Artikel)
  disclaimer = "Hinweis: Dieser Blog enthält Affiliate-Links (Werbung). Wenn du über einen Link etwas bei CHECK24 buchst oder abschließt, erhalten wir eine Provision – für dich entstehen keine Mehrkosten. Unsere Empfehlungen bleiben davon unabhängig."

  [params.homeInfoParams]
    Title = "Willkommen bei SparRatgeber24 👋"
    Content = "Unabhängige Tipps, wie du bei Strom, Gas, Internet, Versicherungen und Reisen bares Geld sparst – Schritt für Schritt erklärt, getestet und stets aktuell. Die Artikel erscheinen laufend neu – schau bald wieder vorbei!"

  [params.socialIcons]
    # Beispiel: [[params.socialIcons]] name="pinterest" url="https://..." etc.
    # Leer lassen für den Start.

[menu]
[[menu.main]]
    identifier = "home"
    name = "Start"
    url = "/"
    weight = 1
[[menu.main]]
    identifier = "posts"
    name = "Blog"
    url = "/posts/"
    weight = 2
[[menu.main]]
    identifier = "impressum"
    name = "Impressum"
    url = "/impressum/"
    weight = 3
[[menu.main]]
    identifier = "datenschutz"
    name = "Datenschutz"
    url = "/datenschutz/"
    weight = 4

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5
