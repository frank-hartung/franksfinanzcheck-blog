baseURL = "https://franksfinanzcheck.de/"
title = "FranksFinanzcheck"
theme = "PaperMod"

# RSS komplett deaktiviert (Entscheidung 10.08.2026 – nicht erwünscht):
# Hugo erzeugt dann weder index.xml noch Sektions-Feeds; der Head-Link
# rel=alternate auf den Feed entfällt bei PaperMod automatisch mit.
disableKinds = ["RSS"]

# Keine automatische Titel-Umwandlung (Title-Case) durch Hugo:
# Taxonomie-Terme (Tags/Kategorien) werden EXAKT wie im Frontmatter
# angezeigt – verhindert "Haushaltsbuch Führen" statt "Haushaltsbuch führen".
titleCaseStyle = "none"
locale = "de-DE"
defaultContentLanguage = "de"
enableRobotsTXT = true
enableEmoji = true
[pagination]
pagerSize = 8
copyright = "© 2026 FranksFinanzcheck – Alle Rechte vorbehalten"

# Service Worker (sw.js) als eigenes Output-Format am Seiten-Root rendern.
# Die Cache-Version wird aus HUGO_JSDELIVR_SHA abgeleitet → nach jedem
# Deploy neue Cache-Generation, alte Caches werden automatisch gelöscht.
[mediaTypes]
  [mediaTypes."application/javascript"]
    suffixes = ["js"]
    delimiter = ""

[outputFormats.SWJS]
  mediaType = "application/javascript"
  baseName = "sw"
  isPlainText = true

[outputs]
  home = ["HTML", "SWJS"]  # RSS raus (disableKinds in hugo.toml oben)

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = "production"
  title = "FranksFinanzcheck"
  description = "Geld sparen & Frugalismus: Praxistipps zu Budgetplanung, Strom- & Gastarifen, DSL, Versicherungen und Reisen – so sparst du monatlich bares Geld."
  keywords = ["Geld sparen", "Frugalismus", "Budgetplanung", "Stromvergleich", "Gasvergleich", "DSL vergleichen", "Kfz-Versicherung", "Sparen"]
  author = "Frank Hartung"
  DateFormat = "2. January 2006"
  defaultTheme = "auto"
  disableThemeToggle = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowToc = true
  comments = false
  mainSections = ["posts"]
  # Pinterest-Website-Verifikation (wird nach Erhalt des Codes befüllt)
  pinterestVerify = "e238ffd88bd085648a14bd1d52d72405"
  mastodonUrl    = "https://mastodon.social/@FranksFinanzcheck"
  mastodonUser   = "@FranksFinanzcheck@mastodon.social"
  # URL des gehosteten Brevo-Anmeldeformulars (leer = Button unsichtbar):
  newsletterFormUrl = ""
  bingVerify = "5079875E367065FE09E09FC61BC077C6"
  disclaimer = "Hinweis: Dieser Blog enthält Affiliate-Links (Werbung). Wenn du über einen Link etwas bei CHECK24 buchst oder abschließt, erhalten wir eine Provision – für dich entstehen keine Mehrkosten. Unsere Empfehlungen bleiben davon unabhängig."

  # Homepage-<title>-Tag separat vom Marken-Namen (site.Title), der u.a. in
  # Schema.org (Organization/WebSite "name"), Footer & aria-Labels weiter
  # als reiner "FranksFinanzcheck" gebraucht wird. Der <title>-Tag der
  # Startseite bekommt hierdurch zusätzlich Kern-Keywords + Nutzenversprechen
  # (13.08. SEO-Fix: vorher nur "FranksFinanzcheck" ohne jedes Keyword).
  homeTitle = "FranksFinanzcheck: Ratgeber für Strom, Gas, DSL & Finanzen"

  [params.homeInfoParams]
    Title = "Geld sparen ohne Verzicht: Dein Ratgeber für Strom, Gas, Versicherungen & Finanzen"
    Content = "💰 Geld sparen ohne Gürtel enger zu schnallen – genau darum geht es hier.\n\nJeden Tag erscheint ein neuer, verständlicher Ratgeber: **Strom, Gas und DSL günstiger**, Versicherungen richtig wählen, Konto & Karte ohne Gebührenfallen, dazu Frugalismus-Tricks und Budgetplanung, die wirklich im Alltag funktionieren. Ohne Fachchinesisch, ohne Verkaufsdruck – dafür mit konkreten Zahlen, ehrlichen Vor- und Nachteilen und Schritt-für-Schritt-Anleitungen.\n\nStöbere dich durch die Ratgeber – dein Geld arbeitet ab heute für dich, nicht umgekehrt. 🚀"

  [[params.socialIcons]]
    name = "pinterest"
    url = "https://www.pinterest.de/franksfinanzcheck/"
    title = "FranksFinanzcheck auf Pinterest"

  [params.assets]
    # Bisher zeigte das Organization/Publisher-Logo in allen JSON-LD-Schemas
    # (WebSite, BlogPosting-Publisher) auf favicon.ico (nur 395 Byte, sehr
    # niedrige Auflösung). Google empfiehlt ein quadratisches Logo min.
    # 112x112px. apple-touch-icon.png (180x180, bereits vorhanden) ist die
    # beste sofort verfügbare Lösung, bis ein dediziertes logo.png angelegt
    # wird. Wirkt sich auch auf den Browser-Tab-Favicon-Link aus (Verbesserung).
    favicon = "apple-touch-icon.png"

[menu]
[[menu.main]]
    identifier = "home"
    name = "Start"
    url = "/"
    weight = 1
[[menu.main]]
    identifier = "posts"
    name = "Blog"
    url = "/posts/"
    weight = 2
[[menu.main]]
    identifier = "pillars"
    name = "Ratgeber"
    url = "/pillar/"
    weight = 3
[[menu.main]]
    identifier = "ueber"
    name = "Über mich"
    url = "/ueber/"
    weight = 4
[[menu.main]]
    identifier = "impressum"
    name = "Impressum"
    url = "/impressum/"
    weight = 5
[[menu.main]]
    identifier = "datenschutz"
    name = "Datenschutz"
    url = "/datenschutz/"
    weight = 6

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[related]
  threshold = 60
  includeNewer = true
  [[related.indices]]
    name = "keywords"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "categories"
    weight = 60
  [[related.indices]]
    name = "date"
    weight = 10
    pattern = "2006"

# Cover-Bilder: keine serverseitige Bildverarbeitung (Responsive-Srcset) –
# stattdessen direkte Datei-URLs. Alle Bilder werden FIRST-PARTY von GitHub
# Pages ausgeliefert (kein Drittanbieter-CDN); Cache-Busting via ?v=<SHA>
# (Env HUGO_JSDELIVR_SHA vom Deploy-Workflow) umgeht max-age=600.
[cover]
  responsiveImages = false

# Privacy-freundliches Analytics (Umami – cookieless, DSGVO-konform)
# websiteId leer = Analytics deaktiviert. ID + ggf. src/hostUrl eintragen
# (siehe ANLEITUNG-UMAMI-ANALYTICS.md).
[params.umami]
  websiteId = ""                        # ← Umami-Website-ID hier eintragen
  src = "https://cloud.umami.is/script.js"  # Cloud; self-hosted: eigene URL (z. B. https://umami.example.com/script.js)
  hostUrl = ""                          # self-hosted: https://umami.example.com (sonst leer)
  consentRequired = true                # true: lädt nur nach "Alle akzeptieren" (streng); false: cookieless ohne Einwilligung (DNT wird respektiert)
