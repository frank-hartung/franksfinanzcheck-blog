# ---------------------------------------------------------------------
# TAXONOMIEN – bewusst KEINE (Index-Hygiene, Entscheidung 29.09.2026)
#
# Hugo legt ohne diesen Block die Standard-Taxonomien `tags` UND
# `categories` an. Beide erzeugten nur Crawl-Fläche ohne Gegenwert:
#
#   `categories` kannte zwei Werte ("Ratgeber" 61×, "News" 5×) und war
#   NIRGENDS verlinkt: die drei Stellen, die das Feld lesen
#   (schema_article.html → articleSection, extend_post_content.html →
#   Karten-Label, ff_voice_toolbar.html), nutzen ausschließlich
#   `.Params.categories` als WERT, nie die Archiv-URL.  → 8 URLs
#
#   `tags` war nach der Kuratierung noch 26 Archive – alle `noindex`.
#   Sie WAREN verlinkt (Tag-Leiste im Artikel-Footer, 42 Artikel), aber
#   jeder dieser Links verschenkte interne Linkkraft an eine Seite, die
#   per Definition nie ranken kann. Die Leiste ist deshalb durch
#   layouts/_partials/themenwelt_chips.html ersetzt: dieselbe Funktion,
#   dieselbe Optik, aber Ziele sind die sechs INDEXIERBAREN
#   Pillar-Ratgeber.  → 27 URLs (26 Archive + 1 Pager)
#
# Die Frontmatter-Felder `tags` und `categories` bleiben unverändert
# erhalten und voll lesbar – sie speisen weiter Article-Schema und
# Hugos Related-Matching ([related] unten), OHNE je eine URL zu bauen.
# Genau dafür sind sie da; das kuratierte Vokabular sichert
# data/seo/tag_register.yaml (Wache scripts/tag_governance.py).
#
# Themen-Einstieg für Menschen und Crawler läuft vollständig über die
# sechs Pillar-Seiten: Startseite und /posts/ (Karten-Raster
# themenwelten.html), Artikel (pillar_box.html + themenwelt_chips.html)
# und die Sitemap. Wache: scripts/index_hygiene_gate.py (H3/H4).
#
# Rückbau (falls Archive je wieder gewollt sind): `tag = "tags"` hier
# eintragen, das Budget in index_hygiene_gate.py (BUDGET) anheben und
# in themenwelt_chips.html entscheiden, ob beides nebeneinander soll.
[taxonomies]

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[related]
  threshold = 60
  includeNewer = true
  [[related.indices]]
    name = "keywords"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "categories"
    weight = 60
  [[related.indices]]
    name = "date"
    weight = 10
    pattern = "2006"

# Cover-Bilder: keine serverseitige Bildverarbeitung (Responsive-Srcset) –
# stattdessen direkte Datei-URLs. Alle Bilder werden FIRST-PARTY von GitHub
# Pages ausgeliefert (kein Drittanbieter-CDN); Cache-Busting via ?v=<SHA>
# (Env HUGO_JSDELIVR_SHA vom Deploy-Workflow) umgeht max-age=600.
[cover]
  responsiveImages = false

[params.assets]
  theme_color = "#0E5A43"
  msapplication_TileColor = "#0E5A43"

