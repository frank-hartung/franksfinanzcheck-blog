# ============================================================
#  KI-ASSISTENT – Cloudflare Worker (Serverless Proxy)
#  ------------------------------------------------------------
#  Rollout: 2026-10-08
#  Zweck:   Sichere API-Brücke zwischen dem Blog-Frontend und
#           den kostenlosen LLM-Providern (Groq, NVIDIA, Cloudflare
#           Workers AI, Gemini). Alle Schlüssel leben NUR hier –
#           das Frontend sieht nie einen API-Key.
#
#  DEPLOY
#    cd cloudflare/ki-assistent
#    npx wrangler deploy
#
#  SECRETS (einmalig setzen, NICHT in diese Datei schreiben)
#    npx wrangler secret put TURNSTILE_SECRET   # Pflicht – ohne: 503
#    npx wrangler secret put LLM_PROXY_TOKEN    # Anmeldung am eigenen Proxy
#
#  Sicherheitsaudit 14.10.2026 (M-04): Provider-Schlüssel (Groq, NVIDIA,
#  Workers AI, Gemini) gehören NICHT mehr in diesen Worker – er reicht keine
#  Schlüssel weiter. Sie liegen ausschließlich beim Proxy (LLM_PROXY_BASE_URL),
#  dessen Host exakt in LLM_PROXY_HOSTS stehen muss. Alte Secrets entfernen:
#    npx wrangler secret delete GROQ_API_KEY   (ebenso NVIDIA_API_KEY,
#    CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GEMINI_API_KEY)
#
#  VOR DER AKTIVIERUNG (Widget ist aus, solange kiAssistentEndpoint fehlt):
#    · Turnstile-Widget im Frontend einbinden (Token als turnstileToken)
#    · Datenschutzerklärung um den KI-Assistenten ergänzen (Anbieter,
#      Drittland, Zweck) und „kein Chatbot“-Aussagen anpassen (Art. 50 KI-VO)
#    · Route unten einkommentieren, Deploy über den Workflow
#      „Cloudflare-Worker deployen“ (Freigabe im Environment)
#
#  VERTRAG
#    T1:  Kein kostenpflichtiger Pfad – nur Gratis-Tiers.
#    T5:  Keine Browser-Brücke – dieser Worker IST die Brücke,
#         aber eine saubere serverseitige, nicht ein UI-Scraping.
#    T6:  Ein Transportweg – dieselbe Logik wie llm_client.py.
# ============================================================

name = "ki-assistent"
main = "worker.js"
compatibility_date = "2026-10-08"

# Sicherheitsaudit 14.10.2026 (M-14): kein *.workers.dev – dort greifen
# WAF/Rate-Limit der Zone nicht. Erreichbar nur über die eigene Route.
workers_dev = false
preview_urls = false
# routes = [
#   { pattern = "ki.franksfinanzcheck.de", custom_domain = true }
# ]

# Mengenbegrenzung über alle Isolates (M-04): 10 Fragen je 60 s und IP.
[[ratelimits]]
name = "KI_LIMITER"
namespace_id = "1403"
simple = { limit = 10, period = 60 }

# Nur franksfinanzcheck.de darf den Worker aufrufen (exakter Vergleich).
# Vorschau nur für das EIGENE Projekt, z. B. "franksfinanzcheck.pages.dev"
# (leer = keine Vorschau). Keine Wildcards auf fremde Plattform-Domains.
[vars]
ALLOWED_ORIGIN = "https://franksfinanzcheck.de,https://www.franksfinanzcheck.de"
VORSCHAU_HOSTS = ""
LLM_PROXY_BASE_URL = ""
LLM_PROXY_HOSTS = ""
RATE_LIMIT_RPM = "15"
SYSTEM_PROMPT = """Du bist der KI-Assistent von FranksFinanzcheck.de – einem unabhängigen Finanzblog für deutsche Haushalte.

DEINE ROLLE:
- Du beantwortest Fragen zu Fixkosten, Versicherungen, Strom, Gas, DSL, Kündigung, Budgetplanung und Sparen.
- Du bist sachlich, freundlich und antwortest auf Deutsch.
- Du vermeidest Übertreibungen und Superlative.
- Du gibst KEINE Anlageberatung und KEINE Steuerberatung.
- Du empfiehlst bei komplexen persönlichen Situationen den Gang zum Fachberater.

DEIN STIL:
- Kurze, klare Sätze. Keine Floskeln.
- Zahlen und Fakten, wenn du sie sicher weißt.
- Bei Unsicherheit sagst du es offen.
- Du verweist auf passende Artikel von FranksFinanzcheck.de, wenn relevant.

WICHTIG:
- Du bist KEIN Ersatz für professionelle Beratung.
- Du verkaufst nichts und empfiehlst keine konkreten Produkte.
- Du respektierst die Privatsphäre der Nutzer."""