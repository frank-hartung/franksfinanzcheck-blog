name: Sofortheilungs-Patch einspielen (einmalig, 02.09.2026)

# EINMALIGER Workflow – härtet den wöchentlichen SEO-Workflow:
# "Affiliate-Fixes committen" bekommt if: always(), damit bereits
# durchgeführte Selbstheilungen NIE verloren gehen, wenn der
# Affiliate-Profi-Check wegen eines unheilbaren Rests Exit 1 meldet.
#
# HINTERGRUND: Am 02.09.2026 schlug "Wöchentliche SEO-Optimierung" fehl
# (A3: Heiler-Deckel). Der Skript-Fix (scripts/affiliate_profi_check.py)
# kommt regulär per Pull Request – NUR diese Workflow-Zeile braucht den
# Umweg hier, weil der Arena-Bot keine Workflow-Dateien pushen darf.
#
# VORAUSSETZUNG: Repository-Secret `GH_PAT` (bereits eingerichtet für
# "Textverständnis-Patches einspielen" – Scopes: repo + workflow).
#
# ANWENDUNG:
#   1. Diese Datei nach .github/workflows/apply-sofortheilung-2026-09-02.yml
#      legen (GitHub-Web-Oberfläche → "Add file").
#   2. GitHub → Actions → "Sofortheilungs-Patch einspielen" → "Run workflow".
#   3. Danach diese einmalige Workflow-Datei wieder löschen (optional).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Patch-Datei aus Arena-Branch holen
        run: |
          git fetch origin arena/01a0613f-franksfinanzcheck-blog
          git show origin/arena/01a0613f-franksfinanzcheck-blog:patches/2026-09-02-seo-weekly-affiliate-commit-always.patch > /tmp/sofort.patch
          echo "✅ Patch-Datei geladen:"
          wc -l /tmp/sofort.patch

      - name: Patch anwenden (mit Vorab-Prüfung)
        run: |
          git apply --check /tmp/sofort.patch
          git apply /tmp/sofort.patch
          echo "✅ Patch sauber angewendet"

      - name: Committen und pushen
        run: |
          git config user.name "SEO-Bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add .github/workflows/seo-weekly.yml
          if git diff --cached --quiet; then
            echo "Nichts zu committen (Patch bereits drin?)"
          else
            git commit -m "ci: Affiliate-Fixes-Commit mit if: always() gehärtet (Sofortheilung 02.09.)"
            git push origin main
            echo "✅ Workflow-Härtung auf main gepusht"
          fi
